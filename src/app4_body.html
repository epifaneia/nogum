<title>NOGUM App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
%%BASECSS%%
.tab.right{margin-left:auto}
/* wizard */
.wiz{max-width:860px;margin:0 auto}
.steps{display:flex;gap:6px;margin:0 0 16px;flex-wrap:wrap}
.steps span{flex:1 1 90px;font:600 10.5px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);border-top:4px solid var(--rule);padding-top:6px}
.steps span.done{border-color:var(--ink-2);color:var(--ink-2)}
.steps span.now{border-color:var(--red);color:var(--ink)}
.page{background:var(--paper);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);padding:clamp(20px,4vw,40px)}
.page .kick{font:600 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:0 0 12px}
.page .big{font:600 clamp(24px,3.4vw,32px)/1.25 var(--serif);margin:0 0 22px;text-wrap:balance}
.page .hint{font-size:15px;color:var(--ink-2);margin:-10px 0 18px}
.choices{display:grid;gap:10px}
.choice{display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:left;border:2px solid var(--rule);background:var(--ground);border-radius:12px;padding:14px 18px;font-size:18px;line-height:1.3}
.choice small{display:block;font:13px/1.35 var(--mono);color:var(--ink-3);margin-top:4px}
.choice:hover{border-color:var(--ink-3)}
.choice[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.choice[aria-pressed="true"] small{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.choice .mark{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid currentColor;opacity:.6}
.choice.multi .mark{border-radius:5px}
.choice[aria-pressed="true"] .mark{background:var(--red);border-color:var(--red);opacity:1}
.techline{margin:18px 0 0;padding-top:12px;border-top:1px dashed var(--rule);font:12.5px/1.5 var(--mono);color:var(--ink-3)}
.techline b{color:var(--blue)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.nav .btn{font:600 13px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em;border:1.5px solid var(--ink);background:var(--paper);border-radius:10px;padding:13px 18px}
.nav .btn.go{background:var(--ink);color:var(--paper)}
.nav .btn:disabled{opacity:.35;cursor:default}
.summary{width:100%;border-collapse:collapse;font-size:15px}
.summary td{border-bottom:1px solid var(--rule-2);padding:8px 6px;vertical-align:top}
.summary td:first-child{font:600 11px/1.5 var(--mono);text-transform:uppercase;color:var(--ink-3);width:34%}
.summary .tech{display:block;font:12px/1.4 var(--mono);color:var(--blue)}
.cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.cta .btn{font:800 20px/1 var(--display);text-transform:uppercase;letter-spacing:.05em;padding:14px 22px;border-radius:12px;border:2px solid var(--ink);background:var(--paper)}
.cta .btn.red{background:var(--red);border-color:var(--red);color:#fff}
/* reminders */
.remind{columns:2 300px;column-gap:14px}
.remind .rbox{break-inside:avoid;margin:0 0 12px}
.rbox table{width:100%;border-collapse:collapse;font-size:13.5px}
.rbox td{padding:2px 4px;vertical-align:top;border-bottom:1px solid var(--rule-2)}
.rbox td:first-child{font:600 12px/1.4 var(--mono);white-space:nowrap}
.rbox ul{margin:4px 0 0;padding-left:18px;font-size:13.5px}
.rbox li{margin:2px 0}
.lines{display:grid;gap:14px;margin:8px 0}
.line{border-bottom:1.5px solid var(--ink-3);height:26px;font:600 10.5px/1 var(--mono);text-transform:uppercase;color:var(--ink-3)}
.blankamb{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.blankamb div{border:1.5px solid var(--ink-2);border-radius:8px;padding:8px;min-height:120px;font-size:12.5px}
.blankamb b{display:block;font:800 16px/1 var(--display);text-transform:uppercase;margin-bottom:4px}
.gearblank td{height:26px}
/* pages & skill grid */
.sheetbar{display:flex;justify-content:flex-end;gap:8px;max-width:210mm;margin:0 auto 10px}
.a4{width:min(210mm,100%);min-height:297mm;margin:0 auto 18px;background:var(--paper);border:1px solid var(--rule);box-shadow:var(--shadow);padding:clamp(14px,3.5vw,13mm) clamp(14px,3.5vw,13mm) 18mm;position:relative}
.pgno{position:absolute;bottom:7mm;left:0;right:0;text-align:center;font:600 11px/1 var(--mono);color:var(--ink-3)}
.a4 .sec:first-child{margin-top:0}
/* un Ambito por fila: con dos, las Firmas no caben (los nombres y su select se pisan) */
.skillgrid{display:grid;grid-template-columns:1fr;gap:8px}
.acard{border:1.5px solid var(--ink-3);border-radius:10px;overflow:hidden;break-inside:avoid}
.acard.null{border-style:dashed;border-color:var(--red)}
.acard-h{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--rule-2)}
.acard-h b{font:800 17px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;flex:1}
.best{font:600 11px/1 var(--mono);color:var(--ink-2)}
.power{display:flex;align-items:center;gap:6px;padding:5px 10px;border-bottom:1px solid var(--rule-2);flex-wrap:wrap}
.power .seg{display:flex;gap:2px}
.power .seg button{width:20px;height:12px;border:1px solid var(--ink-3);background:var(--paper);border-radius:2px;padding:0}
.power .seg button.on{background:var(--blue);border-color:var(--blue)}
.power .lab{font:11.5px/1.2 var(--mono);color:var(--ink-2)}
.dcols{display:grid;grid-template-columns:1fr 1fr}
.dcol{padding:5px 8px}
.dcol+.dcol{border-left:1px solid var(--rule-2)}
.srow{display:flex;align-items:center;gap:5px;min-height:21px;font-size:12.5px}
.srow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow.dom{border-bottom:1px solid var(--rule-2);margin-bottom:2px;padding-bottom:2px}
.srow.dom .nm{font-weight:600;font-size:13.5px}
.srow.fir{padding-left:10px}
.srow.fir select{flex:1;min-width:0;font-size:11.5px;padding:1px 3px}
.fown{padding:0 0 3px 10px}
.fown input{width:100%;box-sizing:border-box;font-size:11.5px;padding:2px 5px}
.meter{display:flex;gap:2px;flex:none}
.meter button{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink-2);background:var(--paper);padding:0}
.meter button.on{background:var(--red);border-color:var(--red)}
.meter button.lock{cursor:default}
.meter button.lock:not(.on){opacity:.35}
.bonus{font:600 11px/1 var(--mono);min-width:20px;text-align:right}
.plus{border:1px solid var(--rule);background:var(--paper);border-radius:4px;width:18px;height:18px;padding:0;font:600 12px/1 var(--mono);color:var(--ink-2)}
.pagetop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.helpbtn{border:1.5px solid var(--blue);color:var(--blue);background:none;border-radius:999px;padding:5px 12px;font:600 12px/1 var(--mono)}
.helptext{background:var(--blue-soft);border-radius:10px;padding:10px 14px;font-size:15px;margin:4px 0 16px}
.choicewrap{display:flex;gap:6px;align-items:stretch}
.choicewrap .choice{flex:1}
.qbtn{flex:none;width:42px;border:2px solid var(--rule);background:var(--paper);border-radius:12px;font:700 18px/1 var(--mono);color:var(--blue)}
.summary td.chg{width:1%;white-space:nowrap;text-align:right}
.mini{border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:5px 10px;font:600 11px/1 var(--mono);text-transform:uppercase;color:var(--ink-2)}
.blankfields .line{margin-top:6px}
.gear .emptyrow td{height:26px}
/* scene tone */
.scene{position:sticky;top:58px;z-index:20;background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);padding:6px 16px}
@media (max-width:640px){.scene{position:static}}
.scenebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1500px;margin:0 auto;font-size:14px}
.scnow{background:var(--amber-soft);color:var(--amber);border-radius:999px;padding:4px 10px}
.mini.strong{border-color:var(--ink);color:var(--ink);margin-left:auto}
.tonegrid-wrap{max-width:900px;margin:10px auto 4px}
.tonegrid{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:6px;align-items:stretch}
.tonegrid .axis{font:600 11px/1.2 var(--mono);text-transform:uppercase;color:var(--ink-3);text-align:center;align-self:end}
.tonegrid .axis.row{align-self:center;text-align:right;padding-right:4px}
.tcellwrap{display:flex;gap:4px}
.tcell{flex:1;text-align:left;border:2px solid var(--rule);background:var(--paper);border-radius:10px;padding:8px 10px;min-width:0}
.tcell b{display:block;font-size:13.5px}
.tcell small{display:block;font:11px/1.3 var(--mono);color:var(--ink-3);margin-top:3px}
.tcell.on{border-color:var(--red);background:var(--red-soft)}
.accmodes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:640px){.tonegrid{grid-template-columns:repeat(3,minmax(0,1fr))}.tonegrid>span{display:none}.tcellwrap{flex-direction:column}.tcell small{display:none}}
/* dice */
.dicewrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;max-width:1100px;margin:0 auto}
@media (max-width:820px){.dicewrap{grid-template-columns:1fr}}
.dfield{margin:12px 0}
.dfield label{display:block;font:600 11px/1 var(--mono);text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.dfield select{width:100%}
.segbtns{display:flex;flex-wrap:wrap;gap:4px}
.segbtns button{flex:1 1 auto;border:1.5px solid var(--rule);background:var(--paper);border-radius:8px;padding:8px 10px;font:600 13px/1 var(--mono)}
.segbtns button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.check{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:15px}
.dtotal{font:600 14px/1.4 var(--mono);margin:14px 0 8px}
.dtotal b{font:800 28px/1 var(--display);margin-left:6px}
.okmsg{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:8px 12px}
.rollbtn{width:100%;font:800 26px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;padding:16px;border-radius:12px;border:0;background:var(--red);color:#fff;margin-top:6px}
.rollbtn:disabled{opacity:.35}
.dice2{display:flex;justify-content:center;gap:18px;margin:10px 0 14px}
.die{width:96px;height:96px;border-radius:18px;display:grid;place-items:center;font:800 48px/1 var(--display);color:#fff;box-shadow:var(--shadow)}
.die.red{background:var(--red)}.die.blue{background:var(--blue)}
.die.dim{opacity:.35}.die.off{opacity:.12}
.dice2.spin .die{animation:spin .45s ease-out}
@keyframes spin{from{transform:rotate(-200deg) scale(.6)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.dice2.spin .die{animation:none}}
.dmath{text-align:center;font:600 14px/1.4 var(--mono);color:var(--ink-2);margin:0}
.dout{text-align:center;font:800 34px/1.1 var(--display);text-transform:uppercase;margin:6px 0}
.dout.fum{color:var(--red)}.dout.cri{color:var(--ok)}.dout.part{color:var(--amber)}.dout.ok{color:var(--blue)}.dout.fail{color:var(--ink-3)}
.dexp{text-align:center;margin:0 0 12px}
.dlog{font:12.5px/1.5 var(--mono);color:var(--ink-2);border-top:1px solid var(--rule-2);padding-top:8px;margin:0;padding-left:20px}
/* story */
.storygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;max-width:1500px;margin:0 auto}
.story label{display:block;font:600 12px/1.2 var(--mono);text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.story textarea{width:100%;min-height:170px}
.story.wide{grid-column:1/-1}
.story .tall{min-height:220px}
.story.secret{border-left:4px solid var(--red)}
.sechead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sechead label{flex:1}
.unlock{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.unlock input{flex:1 1 180px;min-width:0}
/* questions modes */
.modesw{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.modesw button{border:0;background:var(--paper);padding:7px 14px;font:600 12px/1 var(--mono);text-transform:uppercase}
.modesw button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.msg.lock{align-self:flex-start;background:var(--red-soft);border:1px solid var(--red)}
/* talk */
.talkentry{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px;padding:12px 14px;border:2px dashed var(--blue);border-radius:12px;color:var(--blue)}
.talkentry .btn{font:600 13px/1 var(--mono);text-transform:uppercase;border:1.5px solid var(--blue);color:var(--blue);background:var(--paper);border-radius:10px;padding:11px 14px}
.talk textarea{width:100%;min-height:90px}
.talk .chat{max-height:45vh}
.understood{margin-top:14px}
.fdesc{font:italic 11px/1.3 var(--serif);color:var(--ink-3);padding:0 0 3px 22px}
@media print{
  .scene,.wiz,.nav,.sheetbar,.create{display:none!important}
  .a4{width:auto;min-height:0;margin:0;border:0;box-shadow:none;padding:0 0 10mm;break-after:page}
  .a4:last-child{break-after:auto}
  .pgno{bottom:0}
  .remind{columns:2}
  .acard.null,.meter button.on,.power .seg button.on{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* barra de reglas de la mesa */
.rulesbar{max-width:210mm;margin:0 auto 12px;border:1px solid var(--rule);border-radius:12px;background:var(--paper);box-shadow:var(--shadow);padding:9px 11px}
.rulesbar .rbrow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px}
.rblab{align-self:center;font:600 10.5px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-right:2px}
.rbf{display:flex;flex-direction:column;gap:3px;min-width:0}
.rbf>span{font:600 9.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.rbxp{display:flex;align-items:center;gap:3px;font:13px/1.2 var(--serif);color:var(--ink-2);white-space:nowrap}
.rbxp input{width:48px;font:14px/1.2 var(--mono);color:var(--ink);background:var(--ground);border:1px solid var(--rule);border-radius:7px;padding:4px 5px}
.rbf select{max-width:230px;font:14px/1.2 var(--serif);color:var(--ink);background:var(--ground);border:1px solid var(--rule);border-radius:7px;padding:5px 6px}
.rulesbar .tool.on{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.rulesbar .spacer{flex:1 1 10px}
.rbpanel{border-top:1px solid var(--rule);margin-top:9px;padding-top:9px}
.rbp-h{font:600 10.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:0 0 6px}
.rbp-t{font-size:13.5px;line-height:1.45;color:var(--ink-2);margin:0 0 9px;max-width:70ch}
.rbgrp{display:flex;gap:8px;align-items:baseline;margin-bottom:6px;flex-wrap:wrap}
.rbgn{flex:0 0 150px;font:600 11px/1.3 var(--mono);color:var(--ink-3)}
.rbgrp .chips{display:flex;flex-wrap:wrap;gap:5px;flex:1 1 300px}
.chip{border:1.5px solid var(--rule);background:var(--ground);border-radius:999px;padding:4px 10px;font-size:12.5px;line-height:1.2;text-align:left}
.chip.on{border-color:var(--red);background:var(--red-soft);color:var(--red);font-weight:600}
.rbcode{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:7px}
.rbcode input{flex:1 1 260px;min-width:0;font:13px/1.3 var(--mono);color:var(--ink);background:var(--ground);border:1px solid var(--rule);border-radius:7px;padding:7px 8px}
.rbcode input[readonly]{font-weight:600;letter-spacing:.02em}
.rulesbar textarea{width:100%;box-sizing:border-box;min-height:70px;font:11.5px/1.4 var(--mono);color:var(--ink);background:var(--ground);border:1px solid var(--rule);border-radius:7px;padding:7px 8px;margin-bottom:7px}
label.tool.file{cursor:pointer;display:inline-flex;align-items:center}
.rbmsg{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 0;font-size:13.5px;background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:7px 10px}
.rbmsg.bad{background:var(--red-soft);color:var(--red)}
@media (max-width:640px){.rbf select{max-width:100%}.rbgn{flex-basis:100%}}

.acard .techo{font:600 10px/1 var(--mono);color:var(--red);background:var(--red-soft);border-radius:999px;padding:3px 7px;margin-left:6px}
.acard.noexiste{opacity:.55}
.arcchk{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--mono);color:var(--ink-2);margin-left:8px;cursor:pointer}
.seg button.cap{background:repeating-linear-gradient(135deg,transparent,transparent 3px,var(--rule) 3px,var(--rule) 4px);cursor:not-allowed}
.keys{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.potrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.potb{border:1.5px solid var(--rule);background:var(--ground);border-radius:999px;padding:4px 12px;font-size:13px}
.potb[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft);color:var(--red);font-weight:600}
.potrow select{font:13px/1.2 var(--serif);border:1px solid var(--rule);border-radius:7px;padding:4px 6px;background:var(--ground);color:var(--ink)}
.kcount{margin-left:auto;font:600 12px/1 var(--mono);color:var(--ink-3)}
.kcount.over{color:var(--red)}
.kw{font:600 10px/1 var(--mono);text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:5px}
.kw input{width:46px;font:13px var(--mono);border:1px solid var(--rule);border-radius:6px;padding:3px 5px;background:var(--ground);color:var(--ink)}
.krow{display:flex;gap:6px;align-items:center;margin-bottom:5px}
.krow input[type=text]{flex:1 1 140px;min-width:0;font:13px var(--serif);border:0;border-bottom:1px solid var(--rule);background:transparent;color:var(--ink);padding:3px 2px}
.krow select{font:12px var(--serif);border:1px solid var(--rule);border-radius:6px;padding:3px 4px;background:var(--ground);color:var(--ink);max-width:190px}
.krow .kc{font:600 13px var(--mono);color:var(--ink-2);min-width:18px;text-align:right}
.krow.blank{color:var(--ink-3)}
.krow.blank .line{flex:1;border-bottom:1px solid var(--rule)}
.krow.blank .kf{font:11px var(--mono);color:var(--ink-3)}

.finder{margin:10px 0}
.fq{border:1px solid var(--rule);border-radius:10px;padding:10px;margin-top:8px}
.fq p{margin:0 0 8px;font-size:15px}
.fq .mini{margin-left:10px}
.flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;max-height:320px;overflow:auto}
.fitem{text-align:left;border:1px solid var(--rule);background:var(--ground);border-radius:8px;padding:6px 8px;min-width:0}
.fitem b{display:block;font-size:13px}
.fitem span,.fitem em{display:block;font:11px/1.3 var(--mono);color:var(--ink-3);font-style:normal}
.fitem:hover{border-color:var(--red)}
/* hub de formularios */
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(246px,1fr));gap:10px;margin:14px 0}
.hubcard{text-align:left;border:1.5px solid var(--rule);background:var(--paper);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-height:188px}
.hubcard:hover:not(:disabled){border-color:var(--red)}
.hubcard:disabled{opacity:.5;cursor:default}
.hubkick{font:600 10.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.hubcard b{font:600 21px/1.15 var(--serif)}
.hubdesc{font-size:13.5px;line-height:1.4;color:var(--ink-2)}
.hubstate{font:11.5px/1.4 var(--mono);color:var(--blue)}
.hubgo{margin-top:auto;font:600 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--red)}
.ftop{display:flex;align-items:center;gap:12px;margin:0 0 12px;flex-wrap:wrap}
.ftop .kick{font:600 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:0}
.ftop .mini{flex:none}
/* contexto */

function aplicaUni(){

    var mo = sc('uni','mons');
    if (mo >= 8) { u.push('gotico'); sup.push('monstruos'); }

    if (cu >= 12) { u.push('supers'); sup.push('poderes'); }

  if (banda3(sc('uni','roto')) === 2) u.push('postapo');
  if (sc1('uni','toon') >= 4) { u.push('toon'); xtra.push('toon'); }

  M.sup = sup.length ? sup : ['none'];
  M.xtra = xtra.length ? xtra : ['none'];
  M.known = false; M.world = null; M.family = null;

}

function pasosUni(){

    if (sec.id === 'magia') p.push({t:'gate', g:'sobr', q:G_SOBR});

function respuestasTexto(fid){
  var out = [];

  }
  sectores(fid).forEach(function(s){
    var a = ans(fid, s.id); if (!a.length) return;
    s.qs.forEach(function(q, i){
      if (!a[i]) return;
      /* las de cinco opciones dicen la elegida; las de acuerdo, en cuanto de acuerdo */
      out.push('- [' + s.k[0] + '] «' + q.v[0] + '» → ' + a[i] + '/5 («' + (q.o ? q.o[a[i] - 1][0] : ACN[a[i] - 1][0]) + '»)');

      var n = sc1('baul', x[0]); if (n) out.push('- [delimitar] «' + x[1].v[0] + '» → ' + n + '/5');

    var pm = sc1('uni','pmax'); if (pm) out.push('- [nivel máximo de los jugadores] «' + Q_PMAX.v[0] + '» → ' + pm + '/5 («' + Q_PMAX.o[pm - 1][0] + '»)');

function esPaso(f){ return f === 'tono' || f === 'uni' || f === 'baul'; }
/* ======================= 5 · EL REPARTO (PNJ) ======================= */
/* Las fichas rapida y de decorado de 7.4 y 7.5, con la Regla del Estilo de 3.5 como veredicto.
   La pregunta del nivel no se hace en abstracto: se hace contra el grupo,
   que es para lo que sirve el nivel. */
function nuevoPnj(){ return {step:0, tipo:null, rel:null, amb:null, hab:null, dur:null, nom:''}; }
function habName(k){ var p = String(k).split('.'), a = AMB[+p[0]], d = a && a.doms[+p[1]]; return d ? pick(d.n) + ' › ' + pick(d.dis[+p[2]]) : '—'; }
function ambOf(id){ return AMB.filter(function(a){ return a.id === id; })[0] || null; }
function pnjs(){ S.pnjs = S.pnjs || []; return S.pnjs; }
/* El nivel del grupo NO es el nivel maximo del mundo (mundoMax()): es la Rejilla mas
   alta que tenga cualquier personaje en el ambito que importa (en cualquiera,
   si aun no hay ambito), o 1 si no hay fichas. */
function pjNivel(amb){
  var n = 1;
  (S.chars || []).forEach(function(c){ AMB.forEach(function(a, ai){ if (!amb || a.id === amb) n = Math.max(n, ambLvl(c, ai)); }); });
  return n;
}
/* y nada pasa del nivel maximo del mundo (3.7): lo que no existe ahi no se
   reparte (si los personajes ya lo han pasado, manda su nivel) */
function pnjNivel(rel, amb){ var g = pjNivel(amb); return Math.max(1, Math.min(5, Math.max(mundoMax(), g), g + (rel === 'bajo' ? -1 : rel === 'alto' ? 1 : 0))); }
/* Acelerado (3, improvisar un enemigo): un nivel de Rejilla, UNA habilidad a +2
   (todo lo demas a +0) y las casillas que quieras que dure la pelea, 3 por
   defecto. En el completo, un Ambito entero a +2 y la vida fractal. */
function pnjCasillas(P){ if (P.tipo === 'decorado') return 0; if (isAcc() && !P.dur) return 3; return P.dur === 'corta' ? 3 : P.dur === 'media' ? 9 : 27; }
/* El decorado (7.5) no tiene ficha, ni tirada, ni siquiera Rejilla: actua como
   n−1, un nivel por debajo de los jugadores. Por eso no se le pregunta el nivel. */
function pnjPasos(P){
  if (P.tipo === 'decorado') return ['tipo', 'fin'];
  var p = ['tipo', 'nivel'];
  if (P.tipo === 'rapida') { p.push('etiq'); p.push('dur'); }
  p.push('fin');
  return p;
}
/* 3.5: la Regla del Estilo se aplica contra el decorado Y contra todo lo que
   este por debajo de tu nivel. Son dos condiciones, no una.
   Y la Rejilla es RELATIVA: no se juzga por el numero, se juzga por el numero
   AL LADO del vuestro. El mismo Rejilla 2 es el ciberpsicopata que os revienta
   esta noche o, tres arcos mas adelante, algo a lo que ya no haceis caso. Por
   eso el veredicto de una ficha guardada se recalcula cada vez: si el grupo
   sube, el PNJ baja solo. Lo que esta muy por encima NO es decorado (7.5). */
function veredictoEstilo(tipo, n, amb){
  if (tipo === 'decorado') return ['ok', t('Contra él se aplica la Regla del Estilo', 'The Style Rule applies against them'),
    t('Es decorado: con él ya no se puede fallar. No se tira para ver si ganáis, se tira para ver cómo de bien quedáis (3.5).',
      'They are scenery: you can no longer fail against them. You do not roll to see if you win, you roll to see how good you look (3.5).')];
  var g = pjNivel(amb);
  if (n > g) return ['bad', t('No se le gana', 'You do not beat this'),
    t('Está por encima. Sin Llave no hay derecho a tirada: se rodea, se huye o se busca una Llave; y si va a por vosotros, se narra la derrota (3.1).',
      'They are above you. Without a Key there is no right to roll: you go round it, flee, or look for a Key; and if it comes for you, the defeat is narrated (3.1).')];
  if (n < g) return ['ok', t('Contra él se aplica la Regla del Estilo', 'The Style Rule applies against them'),
    t('Está por debajo de los personajes. No se tira para ver si ganan: se tira para ver cómo de bien quedan.',
      'They are below the characters. You do not roll to see if the players win: you roll to see how good they look.')];
  return ['mid', t('Pelea de verdad', 'A real fight'),
    t('Está a vuestra altura. Se tira como contra cualquier rival y puede salir mal.',
      'They are on your level. You roll as against any rival, and it can go badly.')];
}

}

/* ======================= LOS TRES FORMULARIOS ======================= */
/* 1. El tono escribe la mesa. 2. El contexto recomienda las reglas extra.
   3. El equipo escribe en una ficha. Los dos primeros viajan en el Código;
   el tercero no: el equipo es de quien lleva la ficha. */

/* ---------------- 4. el equipo ---------------- */
/* ---------------- 3. el equipo ---------------- */
function resBonus(c){ return bonoDis(c, 2, 1, 3); }   /* Social > Jerarquia > Recursos */
/* Desde la v2 el catalogo trae el precio en tres columnas: Acceso (it.m),
   Puntos (it.p) y Llaves (it.k). Se lee el numero del principio: «1 por
   hechizo» son 1, «—» es 0. */
function cifra(x){ var m = /^\s*(\d+)/.exec(pick(x) || ''); return m ? +m[1] : 0; }
/* Acelerado (2.9): el equipo solo cuesta dinero, sin puntos ni Llaves; lo
   que pide es sitio: tres objetos. */
function itemPtsOf(it){ return isAcc() ? 0 : cifra(it.p); }
function itemKeysOf(it){ return isAcc() ? 0 : cifra(it.k); }
/* el precio, para leerlo de un vistazo: «Acceso 2 · 1 pt · 1 Llave» */
function costeTxt(it){
  var a = accOf(it), p = cifra(it.p), k = cifra(it.k), o = [];
  o.push(a === 9 ? t('sin Acceso','no Access') : t('Acceso ','Access ') + a);
  if (p) o.push(p + ' ' + t(p === 1 ? 'punto' : 'puntos', p === 1 ? 'point' : 'points'));
  if (k) o.push(/^\s*\d+\s*$/.test(pick(it.k)) ? k + ' ' + t(k === 1 ? 'Llave' : 'Llaves', k === 1 ? 'Key' : 'Keys') : t('Llaves: ','Keys: ') + pick(it.k));
  return o.join(' · ');
}
function accTres(c){ return isAcc() && (c.gear || []).length > 3; }
function accSem(c, it){
  var a = accOf(it);
  if (a === 9) return ['na', t('no se compra con dinero','not bought with money')];
  /* la tabla de los cajones de Recursos (5.6): lo cotidiano (Acceso 0) esta siempre al
     alcance, tambien con Recursos −1 o −2; de +0 a +2 se llega un escalon mas
     arriba con esfuerzo, una vez por arco; +4 llega a 3 y no hay mas arriba */
  var r = resBonus(c), siempre = r >= 4 ? 3 : Math.max(0, r), esfuerzo = (r >= 0 && r <= 2) ? siempre + 1 : siempre;
  if (a <= siempre) return ['ok', t('a tu alcance','within reach')];
  if (a <= esfuerzo) return ['mid', t('con esfuerzo: una vez por arco, y con precio','with effort: once per arc, and at a price')];
  return ['bad', t('fuera de tu alcance aquí','out of reach here')];
}
function eqRef(r){ return r.u + '|' + r.b + '|' + r.i; }
function eqItem(key){
  var p = String(key).split('|');
  var b = DATA.bazar.filter(function(x){ return x.id === p[0]; })[0];
  var it = b && b.blocks[+p[1]] && b.blocks[+p[1]].items[+p[2]];
  return it ? {u:p[0], b:+p[1], i:+p[2], it:it} : null;
}
function eqChar(){ return S.chars.filter(function(x){ return x.id === (S.eq && S.eq.who); })[0]; }
/* acentos fuera y todo en minusculas, que nadie escribe «Katana» con mayuscula */
function norm(x){ return String(x == null ? '' : x).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function eqBusca(q){
  var pal = norm(q).split(/\s+/).filter(function(x){ return x.length > 1; });
  if (!pal.length) return [];
  var out = [];
  DATA.bazar.forEach(function(bz){
    if (universes().indexOf(bz.id) < 0) return;
    var un = norm(uniName(bz.id));
    bz.blocks.forEach(function(bl, bi){
      var bn = norm(pick(bl.n));
      bl.items.forEach(function(it, ii){
        var nom = norm(pick(it.n));
        var todo = nom + ' ' + norm(pick(it.x)) + ' ' + norm(pick(it.d)) + ' ' + norm(pick(it.e)) +
          ' ' + norm(pick(it.a)) + ' ' + norm(pick(it.m)) + ' ' + bn + ' ' + un;
        for (var k = 0; k < pal.length; k++) if (todo.indexOf(pal[k]) < 0) return;
        var enNombre = 1;
        for (var j = 0; j < pal.length; j++) if (nom.indexOf(pal[j]) < 0) { enNombre = 0; break; }
        out.push({u:bz.id, b:bi, i:ii, it:it, nm:enNombre ? 0 : 1});
      });
    });
  });
  out.sort(function(a, b){ return (a.nm - b.nm) || (accOf(a.it) - accOf(b.it)); });
  return out;
}
function eqFicha(c, r){
  var key = eqRef(r), on = S.eq.sel.indexOf(key) > -1, sem = accSem(c, r.it);
  var p = itemPtsOf(r.it), k = itemKeysOf(r.it);
  return '<button type="button" class="fitem' + (on ? ' on' : '') + '" data-eqadd="' + esc(key) + '" aria-pressed="' + on + '"><b>' + esc(pick(r.it.n)) + '</b>' +
    '<span>' + esc([pick(r.it.d), pick(r.it.e), pick(r.it.a)].filter(function(x){ return x && x !== '—'; }).join(' · ')) + '</span>' +
    '<em class="sem ' + sem[0] + '">' + esc(sem[1]) + (p ? ' · ' + p + ' ' + esc(t(p === 1 ? 'punto' : 'puntos', 'pt' + (p === 1 ? '' : 's'))) : '') +
    (k ? ' · ' + k + ' ' + esc(t(k === 1 ? 'Llave' : 'Llaves', 'Key' + (k === 1 ? '' : 's'))) : '') + '</em></button>';
}
function eqResHTML(c){
  var E = S.eq, q = E.busca || '';

    return '<p class="eqvacio">' + esc(t('Escribe una palabra: el nombre si lo sabes, o lo que haga el objeto («veneno», «cuerda», «escudo», «implante»).',

    (res.length > 60 ? t(' · se enseñan los 60 primeros', ' · showing the first 60') : '')) + '</p><div class="flist">' +
    corte.map(function(r){ return eqFicha(c, r); }).join('') + '</div>';
}

      '<div id="eqres">' + eqResHTML(c) + '</div>' +
      '<p class="eqnote">' + esc(t('Se busca en el nombre y en lo que hace cada objeto, solo dentro del equipo que tu mesa tiene abierto.',

    '<p class="hint">' + esc(t('Ordenados de lo más fácil de conseguir a lo más difícil. Puedes marcar varios.','Sorted from easiest to hardest to get hold of. You can tick several.')) + '</p><div class="flist">';

function bindEq(){
  var v = $('view'), E = S.eq;
  v.querySelectorAll('[data-eqwho]').forEach(function(b){ b.addEventListener('click', function(){
    E.who = b.getAttribute('data-eqwho'); E.modo = 'busca'; E.busca = ''; E.fstep = 0; E.cat = null; E.sel = [];
    persist(); render(); window.scrollTo(0, 0);
  }); });
  /* el buscador se repinta solo por dentro, para no perder el foco al escribir */
  var inp = $('eqq');
  if (inp) {
    function repinta(){
      var box = $('eqres'); if (box) box.innerHTML = eqResHTML(eqChar());
      var nav = $('eqnav'); if (nav) {
        var go = nav.querySelector('[data-eq="cuenta"]');
        if (go) { go.disabled = !E.sel.length; go.textContent = t('Ir a la cuenta','Go to the bill') + (E.sel.length ? ' (' + E.sel.length + ')' : '') + ' →'; }
      }
    }
    inp.addEventListener('input', function(){ E.busca = inp.value; persist(); repinta(); });
    var box0 = $('eqres');
    if (box0) box0.addEventListener('click', function(ev){
      var b = ev.target.closest('[data-eqadd]'); if (!b) return;
      var key = b.getAttribute('data-eqadd'), i = E.sel.indexOf(key);
      if (i > -1) E.sel.splice(i, 1); else E.sel.push(key);
      persist(); repinta();
    });
    if (window.matchMedia && window.matchMedia('(min-width:768px)').matches) { try { inp.focus(); } catch(e){} }
  }
  v.querySelectorAll('[data-eqf]').forEach(function(b){ b.addEventListener('click', function(){
    var q = FINDQ[E.fstep], nx = q[b.getAttribute('data-eqf')];
    if (typeof nx === 'string') { E.cat = nx; E.modo = 'lista'; } else { E.fstep = nx; }
    persist(); render(); window.scrollTo(0,0);
  }); });
  v.querySelectorAll('[data-eqadd]').forEach(function(b){ b.addEventListener('click', function(){
    var key = b.getAttribute('data-eqadd'), i = E.sel.indexOf(key);
    if (i > -1) E.sel.splice(i, 1); else E.sel.push(key);
    persist(); render(true);
  }); });
  v.querySelectorAll('[data-eq]').forEach(function(b){ b.addEventListener('click', function(){
    var k = b.getAttribute('data-eq');
    if (k === 'exit') { S.form = null; }
    else if (k === 'who') { E.who = null; E.modo = 'busca'; }
    else if (k === 'busca') { E.modo = 'busca'; E.cat = null; E.fstep = 0; }
    else if (k === 'arbol' || k === 'fres') { E.modo = 'arbol'; E.cat = null; E.fstep = 0; }
    else if (k === 'more') { E.modo = 'busca'; E.cat = null; E.fstep = 0; }
    else if (k === 'list') { E.modo = E.cat ? 'lista' : 'busca'; }
    else if (k === 'cuenta') { E.modo = 'cuenta'; }
    else if (k === 'add') {
      var c = eqChar();
      if (c) { E.sel.forEach(function(key){ var r = eqItem(key); if (r) c.gear.push({u:r.u, b:r.b, i:r.i}); }); S.tab = c.id; }
      S.form = null; S.eq = null;
    }
    persist(); render(); window.scrollTo(0,0);
  }); });
}

/* El nivel maximo de los jugadores de cada receta (3.7, 9.4) viene de los
   datos, leido de la ficha impresa de cada receta. Antes habia aqui una tabla copiada a mano y se quedo atras
   al expulsar la receta 15: seis recetas llevaban los techos de la de al lado. */
function techoReceta(r){ var x = DATA.techos && DATA.techos[r]; return (x && x.length === 5) ? x : null; }
function arcOpen(){
  if (M.known && M.world !== null) { var tc = techoReceta(KNOWN[M.world].r); return tc ? tc[4] > 0 : true; }
  var sp = M.sup || [];
  return ['magia','monstruos','poderes','ki'].some(function(k){ return sp.indexOf(k) > -1; });
}
/* el nivel maximo de los jugadores: el de la receta, Ambito por Ambito; en un
   mundo propio, el del formulario del universo (o la barra), igual para los
   cinco; sin contestar, null (sin techo) */
function jugMax(){
  if (M.known && M.world !== null) return techoReceta(KNOWN[M.world].r);
  var p = Math.max(0, Math.min(5, +M.pmax || 0));
  return (M.known === false && p) ? [p, p, p, p, arcOpen() ? p : 0] : null;
}
function techos(){ return jugMax() || [5,5,5,5, arcOpen() ? 5 : 0]; }
function techo(ai){ var v = techos()[ai]; return v === undefined ? 5 : v; }
/* 12 puntos, o 14 PARA TODOS si algun jugador lleva Arcano (5.2, C·22oct):
   nadie tiene mas puntos por tener magia, y si en el mundo hay magia pero no
   esta al alcance de los jugadores, son 12. Sin fichas (la plantilla), lo que
   permita el mundo. La casilla «Tiene Arcano» de cada ficha dice si ese
   personaje toca el ambito, no cuantos puntos reparte. */
function tieneArc(c){ return arcOpen() && !(c && c.arc === false); }
function mesaArc(){ return arcOpen() && (!S.chars.length || S.chars.some(function(x){ return x.arc !== false; })); }
function budget(){ return Math.max(0, (mesaArc() ? 14 : 12) + ptsExtra()); }
/* la escalera de la Llave (4.3): n², o 3n−2 con la escalera llana del Baul (9.1) */
function llana(){ return !isAcc() && baul().indexOf(16) > -1; }
function escalera(n){ return n <= 0 ? 0 : llana() ? 3 * n - 2 : n * n; }
function limitada(n){ return n <= 0 ? 0 : Math.max(1, Math.ceil(escalera(n) / 2)); }
function keyMom(k){ return k.w === 'mom' || k.w === 'amb'; }
function keyCost(k){ var n = +k.lv || 1; if (keyMom(k)) return 0; if (k.w === 'dis') return limitada(n);
  // el Ajuste hacia arriba (5.5); en el Acelerado no existe y vale como entera
  return escalera(n) * (isAcc() ? 1 : k.w === 'des' ? 3 : k.w === 'pot' ? 2 : 1); }
function keysOwn(c){ var n = 0; (c.klist || []).forEach(function(k){ n += keyCost(k); }); return n; }
/* Los precios del Bazar son para un portador de nivel 1 (9.3). Para otro
   nivel cambia lo que el objeto te sube, x = su nivel menos el tuyo:
   - la Parca es una Llave Limitada al daño (4.5): su parte del precio pasa de
     limitada(N−1) a limitada(x), y lo demas (que no se esquive…) se queda;
   - lo demas con nivel (vehiculos, Sincronizacion) se escala en proporcion.
   Lo regalado o prestado no se paga. */
function parcaN(it){ var m = /(?:Parca|Reaper) · (?:Rejilla|Grid) (\d)/.exec(pick(it.d) || ''); return m ? +m[1] : 0; }
function itemGridN(it){ var m = /(?:Rejilla|Grid): (?:Nivel|Level) (\d)/.exec(pick(it.x) || ''); return parcaN(it) || (m ? +m[1] : 0); }
function gearAi(g){ var i = AMB.map(function(x){ return x.id; }).indexOf(g.amb || 'fis'); return i < 0 ? 0 : i; }
function gearKeys(c, g, it){
  if (g.free) return 0;
  var p = itemKeysOf(it), N = itemGridN(it); if (!p || N < 2) return p;
  var x1 = N - 1, x = N - ambLvl(c, gearAi(g)), P = parcaN(it);
  if (P) { var resto = Math.max(0, p - Math.max(1, Math.ceil(x1 * x1 / 2))); return limitada(x) + resto; }
  return x <= 0 ? 0 : Math.max(1, Math.ceil(p * escalera(x) / (x1 * x1)));
}
function keysGear(c){ return gearNum(c, function(it, g){ return gearKeys(c, g, it); }); }
/* Los unos abundan (3.4): el nivel maximo del mundo no sube los ambitos ni da
   mas bote. El bote aparte son 5 Llaves o +1 de Rejilla (5.2), y aqui se lleva como
   5 Llaves: el +1 de Rejilla las gasta. La Rejilla por encima de 1 se paga de
   ahi, 5·n² por ambito (5·(3n−2) con la escalera llana). La experiencia de
   salida suma o resta. */
function keysHave(c){ return Math.max(0, 5 + keysExtra() + (+c.kw || 0)); }
/* El techo es una propuesta de la receta que confirma la mesa (T184): se puede
   pasar, con aviso. Solo el ambito que no existe en el mundo (techo 0) se queda en 1. */
function ambLvl(c, ai){ var a = AMB[ai], v = +(c.grid && c.grid[a.id]) || 1; return (techo(ai) === 0 || (a.id === 'arc' && !tieneArc(c))) ? 1 : Math.max(1, v); }
/* la Rejilla cuesta 5 veces la escalera de la Llave: 5·n², o 5·(3n−2) con la
   escalera llana del Baul (9.1, C·22oct), para que siga siendo la compra mas
   barata del Ambito entero (5/8 de cubrirlo con Llaves) */
function gridCost(n){ return n > 0 ? 5 * escalera(n) : 0; }
/* los niveles que da la historia no se pagan; se pagan los que sube uno por su cuenta (T185) */
function gridPaid(c, ai){ var n = ambLvl(c, ai) - 1, f = Math.min(+((c.gj || {})[AMB[ai].id]) || 0, n); return gridCost(n) - gridCost(f); }
function keysGrid(c){ var n = 0; AMB.forEach(function(a, ai){ n += gridPaid(c, ai); }); return n; }
/* ksp: Llaves gastadas a mano (la de un momento no se paga y no suma aqui) */
function keysUsed(c){ return keysOwn(c) + keysGear(c) + keysGrid(c) + (+c.ksp || 0); }

function newChar(){ var c = {id:'pc' + Date.now().toString(36), name:'', concept:'', grid:{}, dom:{}, dis:{}, fir:[], gear:[], stance:'violencia', dmg:{fis:0,men:0,esp:0}, keys:'', notes:'', klist:[], potAmb:'', kw:0, ksp:0}; AMB.forEach(function(a){ c.grid[a.id] = 1; }); return c; }
function gearNum(c, fn){
  var n = 0;
  (c.gear || []).forEach(function(g){
    var b = DATA.bazar.filter(function(x){ return x.id === g.u; })[0];
    var it = b && b.blocks[g.b] && b.blocks[g.b].items[g.i];
    if (it) n += fn(it, g);
  });
  return n;
}
function pointsGear(c){ return gearNum(c, function(it, g){ return g.free ? 0 : itemPtsOf(it); }); }
function cost(c){ var p = pointsGear(c); Object.keys(c.dom).forEach(function(k){ if (c.dom[k]) p++; }); Object.keys(c.dis).forEach(function(k){ if (c.dis[k]) p++; }); c.fir.forEach(function(){ p += 2; }); return p; }
function ambHas(c, ai){ return !!(c.dom[ai + '.0'] || c.dom[ai + '.1']); }
/* El bono de una columna (un Dominio). Ambito sin nada: Nulo −2. Si hay algo
   en el ambito, la columna que tocaste va normal y la otra es Torpe −1: ya no
   hay +0 para los personajes. El acordeon plegado da +4 (3.x). */
function bonoCol(c, ai, di){
  if (!ambHas(c, ai)) return -2;
  if (folds(c).dom[ai + '.' + di]) return 4;
  return c.dom[ai + '.' + di] ? 1 : -1;
}
/* lo mismo para una Disciplina concreta, con sus Firmas */
function bonoDis(c, ai, di, si){
  var b = bonoCol(c, ai, di), sk = ai + '.' + di + '.' + si;
  if (b < 1) return b;
  if (c.dis[sk]) b = Math.max(b, 2);
  if (folds(c).dis[sk]) b = 4;
  (c.fir || []).forEach(function(f){ if (f.key === sk) b = Math.max(b, f.lv); });
  return b;
}
function bestDex(c){ var b = bonoCol(c, 0, 0); for (var s = 0; s < 4; s++) b = Math.max(b, bonoDis(c, 0, 0, s)); return b; }
function groups(){ var out = []; DATA.bazar.forEach(function(b){ if (universes().indexOf(b.id) < 0) return; b.blocks.forEach(function(bl, bi){ out.push({u:b.id, b:bi, name:uniName(b.id) + ' · ' + pick(bl.n), items:bl.items}); }); }); return out; }
var CATN = {arma:['Armas','Weapons'], defensa:['Defensas','Defences'], vehiculo:['Vehículos','Vehicles'],
            artefacto:['Artefactos y poderes','Artefacts and powers'], util:['Útiles','Tools']};
var FINDQ = [

function accOf(it){ var m = /^\s*(\d)/.exec(pick(it.m) || ''); return m ? +m[1] : 9; }

function onChar(e, c){

function renderAsk(){ var camp = S.askMode === 'camp'; return '<div class="panel"><div class="formhead"><h2>' + esc(u('ask')) + '</h2><div class="modesw" role="group"><button type="button" data-amode="rules" aria-pressed="' + !camp + '">' + esc(t('Reglas','Rules')) + '</button><button type="button" data-amode="camp" aria-pressed="' + camp + '">' + esc(t('Campaña','Campaign')) + '</button></div>' + (camp && S.story.pw && unlocked ? '<button type="button" class="tool" id="askLock">🔒 ' + esc(t('Bloquear secreto','Lock secret')) + '</button>' : '') + '</div><p class="note">' + esc(camp ? t('Preguntas sobre la campaña, respondidas con lo escrito en la pestaña Historia. Si la respuesta está en el Secreto de Máster, se pide la contraseña.','Campaign questions, answered from what is written in the Story tab. If the answer is in the GM secret, the password is required.') : t('Dudas de reglas, respondidas según el canon de NOGUM y la mesa actual.','Rules questions, answered from the NOGUM canon and the current table.')) + '</p><div class="chat" id="chat"></div><textarea id="askQ"></textarea><div class="row" style="margin-top:8px"><button class="tool primary" id="askBtn" type="button">' + esc(t('Preguntar','Ask')) + '</button><button class="tool" id="stopBtn" type="button" hidden>' + esc(t('Parar','Stop')) + '</button><button class="tool" id="clearBtn" type="button">' + esc(t('Nueva conversación','New conversation')) + '</button><span class="note" id="askNote"></span></div></div>'; }

function disName(sk){ var p = String(sk).split('.'); return AMB[+p[0]].doms[+p[1]].dis[+p[2]]; }
// una Firma propia (s = 'own') no esta en el catalogo: solo tiene su nombre, en f.t
function firmaOf(f){ return (f.s === undefined || f.s === null || f.s === '' || f.s === 'own') ? null : firmaList(f.key)[+f.s] || null; }

var sceneOpen = false;
var OPTROWS = [['alto','Optimista','Optimistic'],['neutro','Neutral','Neutral'],['bajo','Opresivo','Oppressive']];
var CAOSCOLS = [['bajo','Previsible','Predictable'],['medio','Neutral','Neutral'],['alto','Caótico','Chaotic']];
function gameCardName(){ return pick(isAcc() ? ACC[accBase()].n : CARDS[cardBase()].n); }
/* ============ PISTAS PROPIAS: ARRASTRAR Y SOLTAR ============
   Viven en el navegador (IndexedDB). No se suben a ningun sitio: son tus
   ficheros en tu maquina, asi que no hay licencia que valga ni nada que
   redistribuir. Sobreviven a que la app se actualice; lo que no hacen es
   seguirte a otro ordenador. */
var MUSP = [];        /* {id, nom, tipo, carta} en memoria, sin el audio */
var musAviso = null;  /* tarjeta con el bocadillo de «no hay pista» */
var musSon = null;    /* tarjeta que esta sonando ahora */
var musErr = '';      /* ultimo problema, para decirlo en vez de callar */
var MUSDB = null, musURL = null, AUD = null;

function musdb(){
  if (MUSDB) return Promise.resolve(MUSDB);
  return new Promise(function(ok, no){
    if (!window.indexedDB) return no(new Error('sin indexedDB'));
    var r = indexedDB.open('nogum-musica', 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore('pistas', {keyPath:'id'}); };
    r.onsuccess = function(){ MUSDB = r.result; ok(MUSDB); };
    r.onerror = function(){ no(r.error || new Error('no abre')); };
  });
}
function musSt(modo){
  return musdb().then(function(d){ return d.transaction('pistas', modo).objectStore('pistas'); });
}
function musPide(hacer){
  return musSt('readonly').then(function(st){
    return new Promise(function(ok){ var r = hacer(st); r.onsuccess = function(){ ok(r.result); }; r.onerror = function(){ ok(null); }; });
  });
}
function musRefresca(){
  return musPide(function(st){ return st.getAll(); }).then(function(ps){
    MUSP = (ps || []).map(function(p){ return {id:p.id, nom:p.nom, tipo:p.tipo, carta:p.carta}; });
    return MUSP;
  }).catch(function(){ MUSP = []; return MUSP; });
}
function musGuarda(reg){
  return musSt('readwrite').then(function(st){
    return new Promise(function(ok, no){ var r = st.put(reg); r.onsuccess = function(){ ok(true); }; r.onerror = function(){ no(r.error); }; });
  });
}
function musElimina(id){
  return musSt('readwrite').then(function(st){
    return new Promise(function(ok){ var r = st.delete(id); r.onsuccess = function(){ ok(true); }; r.onerror = function(){ ok(false); }; });
  });
}
function musDe(carta){ for (var i = 0; i < MUSP.length; i++) if (MUSP[i].carta === carta) return MUSP[i]; return null; }

/* Comprobar que suena ANTES de guardarla: si no, sueltas un PDF y te quedas
   con silencio y sin explicacion. */
function musValida(f){
  return new Promise(function(ok){
    var u = URL.createObjectURL(f), a = new Audio(), hecho = false;
    var fin = function(v){ if (hecho) return; hecho = true; try { URL.revokeObjectURL(u); } catch(e){} ok(v); };
    a.onloadedmetadata = function(){ fin(true); };
    a.onerror = function(){ fin(false); };
    setTimeout(function(){ fin(false); }, 8000);
    a.preload = 'metadata'; a.src = u;
  });
}

/* ---------------------------- el reproductor ---------------------------- */
function aud(){
  if (!AUD) { AUD = document.createElement('audio'); AUD.loop = true; AUD.preload = 'none'; AUD.style.display = 'none'; document.body.appendChild(AUD); }
  return AUD;
}
function fundido(a, hasta, ms, luego){
  /* Con setInterval y NO con requestAnimationFrame: hay entornos donde la
     pagina no pinta (pestana de fondo, paneles embebidos, ahorro de energia)
     y rAF no dispara nunca. Alli el volumen se quedaba en 0 y la musica sonaba
     muda con el boton encendido. El valor final se asegura siempre. */
  var de = a.volume, t0 = Date.now(), listo = false, h = null;
  var pon = function(v){ try { a.volume = Math.max(0, Math.min(1, v)); } catch(e){} };
  var cerrar = function(){ if (listo) return; listo = true; if (h) clearInterval(h); pon(hasta); if (luego) luego(); };
  h = setInterval(function(){
    var p = (Date.now() - t0) / ms;
    if (p >= 1) return cerrar();
    pon(de + (hasta - de) * p);
  }, 40);
  setTimeout(cerrar, ms + 150);
}
function musPara(cb){
  var a = aud();
  if (a.paused) { musSon = null; if (cb) cb(); return; }
  fundido(a, 0, 260, function(){ a.pause(); musSon = null; if (musURL) { try { URL.revokeObjectURL(musURL); } catch(e){} musURL = null; } if (cb) cb(); });
}
function musToca(carta){
  var reg = musDe(carta);
  if (!reg) { musAviso = carta; musErr = ''; render(true); return; }
  musAviso = null;
  musPara(function(){
    musPide(function(st){ return st.get(reg.id); }).then(function(p){
      if (!p || !p.blob) { musErr = t('Esa pista ya no está guardada.', 'That track is no longer stored.'); render(true); return; }
      var a = aud();
      musURL = URL.createObjectURL(p.blob);
      a.src = musURL; a.volume = 0; a.loop = true;
      a.play().then(function(){ musSon = carta; fundido(a, 1, 420); render(true); })
              .catch(function(){ musErr = t('El navegador no ha dejado sonar. Vuelve a pulsar.', 'The browser refused to play. Press again.'); render(true); });
    });
  });
}

}
function musNombre(k){

function renderPistas(){

        '<td class="chg"><button type="button" class="mini" data-musdel="' + esc(p.id) + '">' + esc(t('Quitar','Remove')) + '</button></td></tr>';
    });
    h += '</table>';
    h += '<p class="eqnote">' + esc(t('Una pista asignada a una tarjeta suena con su botón de altavoz, y pisa a la de serie. Las que dejes sin asignar valen de pistas sueltas: les pones el nombre de la escena y las disparas cuando toque.',
      'A track assigned to a card plays from its speaker button and overrides the built-in one. Leave one unassigned and it works as a loose cue: name it after the scene and fire it when you need it.')) + '</p>';
  }

/* --------------------- entrada de ficheros y botones --------------------- */
function musMete(files){
  var lista = [].slice.call(files || []).filter(function(f){ return f && f.size; });
  if (!lista.length) return;
  musErr = '';
  var pend = lista.length, malos = [];
  lista.forEach(function(f){
    musValida(f).then(function(vale){
      if (!vale) { malos.push(f.name); pend--; if (!pend) musFin(malos); return; }
      var reg = {id:'m' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
                 nom:f.name.replace(/\.[^.]+$/, '').slice(0, 60), tipo:f.type || 'audio', carta:null, blob:f};
      musGuarda(reg).then(function(){ pend--; if (!pend) musFin(malos); })
        .catch(function(){ malos.push(f.name + ' ' + t('(no cabe o el navegador no deja guardar)','(too big, or the browser refused to store it)')); pend--; if (!pend) musFin(malos); });
    });
  });
}
function musFin(malos){
  if (malos.length) musErr = t('No he podido con: ','Could not take: ') + malos.join(', ');
  musRefresca().then(function(){ render(true); });
}
document.addEventListener('dragover', function(e){
  var z = e.target.closest && e.target.closest('[data-musdrop]'); if (!z) return;
  e.preventDefault(); z.classList.add('sobre');
});
document.addEventListener('dragleave', function(e){
  var z = e.target.closest && e.target.closest('[data-musdrop]'); if (z) z.classList.remove('sobre');
});
document.addEventListener('drop', function(e){
  var z = e.target.closest && e.target.closest('[data-musdrop]'); if (!z) return;
  e.preventDefault(); z.classList.remove('sobre');
  musMete(e.dataTransfer && e.dataTransfer.files);
});
document.addEventListener('change', function(e){
  if (e.target && e.target.id === 'musFile') { musMete(e.target.files); e.target.value = ''; return; }
  var sel = e.target && e.target.getAttribute && e.target.getAttribute('data-musasig');
  if (sel) {
    var val = e.target.value || null;
    musPide(function(st){ return st.get(sel); }).then(function(p){
      if (!p) return;
      /* una tarjeta, una pista: si ya habia otra puesta ahi, se suelta */
      var antes = val ? musDe(val) : null;
      var sigue = function(){ p.carta = val; musGuarda(p).then(function(){ musRefresca().then(function(){ render(true); }); }); };
      if (antes && antes.id !== sel) {
        musPide(function(st){ return st.get(antes.id); }).then(function(q){
          if (!q) return sigue();
          q.carta = null; musGuarda(q).then(sigue);
        });
      } else sigue();
    });
  }
});
document.addEventListener('click', function(e){
  var b = e.target.closest && e.target.closest('[data-musp],[data-musid],[data-musdel],[data-musir]');
  if (!b) return;
  var k = b.getAttribute('data-musp');
  if (k) { if (musSon === k) musPara(function(){ render(true); }); else musToca(k); return; }
  var id = b.getAttribute('data-musid');
  if (id) {
    var reg = MUSP.filter(function(p){ return p.id === id; })[0];
    if (!reg) return;
    if (reg.carta) { if (musSon === reg.carta) musPara(function(){ render(true); }); else musToca(reg.carta); return; }
    /* suelta: suena igual, pero no pertenece a ninguna tarjeta */
    musPara(function(){
      musPide(function(st){ return st.get(id); }).then(function(p){
        if (!p || !p.blob) return;
        var a = aud(); musURL = URL.createObjectURL(p.blob);
        a.src = musURL; a.volume = 0; a.loop = true;
        a.play().then(function(){ musSon = '#' + id; fundido(a, 1, 420); render(true); }).catch(function(){});
      });
    });
    return;
  }
  var del = b.getAttribute('data-musdel');
  if (del) {
    var r = MUSP.filter(function(p){ return p.id === del; })[0];
    if (musSon && (musSon === '#' + del || (musDe(musSon) && musDe(musSon).id === del))) musPara();
    musElimina(del).then(function(){ musRefresca().then(function(){ render(true); }); });
    return;
  }
  if (b.getAttribute('data-musir')) { musAviso = null; musOpen = true; S.tab = 'form'; S.form = null; persist(); render(true);
    setTimeout(function(){ var p = document.querySelector('.muspro'); if (p) p.scrollIntoView({block:'center'}); }, 60); }
});

function renderScene(){

  var over = !!S.scene;
  var h = '<div class="scenebar"><span class="sclab">' + esc(t('Tono de la partida','Game tone')) + ': <b>' + esc(gameCardName()) + '</b></span>' +

    '<button type="button" class="mini" id="musBtn" aria-expanded="' + musOpen + '">' + esc(t('Música','Music')) + '</button></div>';
  if (musOpen) h += renderMusica();
  if (sceneOpen) {
    h += '<div class="tonegrid-wrap">';
    if (isAcc()) {
      h += '<div class="accmodes">' + ['epico','neutro','caos','terror'].map(function(k){ return '<div class="tcellwrap">' + musAltavoz(k) + '<button type="button" class="tcell' + (accK() === k ? ' on' : '') + '" data-scene="' + k + '"><b>' + esc(pick(ACC[k].n)) + '</b><small>' + esc(pick(ACC[k].roll)) + '</small></button></div>'; }).join('') + '</div>';
    } else {
      h += '<div class="tonegrid"><span></span>' + CAOSCOLS.map(function(c){ return '<span class="axis">' + esc(pick(c.slice(1))) + '</span>'; }).join('');
      OPTROWS.forEach(function(r){
        h += '<span class="axis row">' + esc(pick(r.slice(1))) + '</span>';

var CARDCELL = {EPICA:['alto','bajo'], PULP:['alto','alto'], REAL:['neutro','bajo'], PRIM:['neutro','medio'], BOLA:['neutro','alto'], ANG:['bajo','bajo'], PES:['bajo','alto']};
var CARD3 = {EPICA:'EPI', PULP:'PUL', REAL:'REA', PRIM:'PRI', BOLA:'BOL', ANG:'ANG', PES:'PES', TRAG:'TRA'};
var C3 = {}; Object.keys(CARD3).forEach(function(k){ C3[CARD3[k]] = k; });
var CARDORD = ['EPICA','PULP','REAL','PRIM','BOLA','ANG','PES','TRAG'];
var ACCSET = {epico:['alto','medio'], neutro:['neutro','bajo'], caos:['neutro','alto'], terror:['bajo','medio']};
var UNIID = ['fantasia','steampunk','terror','postapo','neon','opera','gotico','supers','wuxia','social','toon'];
var ZOOMK = ['cascara','carne','nucleo'];

function setCard(k){
  S.scene = null;
  if (k === 'TRAG') { M.card = 'TRAG'; return; }
  M.card = null;
  var c = CARDCELL[k]; if (c) { M.opt = c[0]; M.caos = c[1]; M.hueco = 'prev'; }
}
function setAccMode(k){ S.scene = null; M.card = null; var c = ACCSET[k]; if (c) { M.opt = c[0]; M.caos = c[1]; } }
function baulGroupOf(k){ for (var i = 0; i < BAUL_GROUPS.length; i++) if (BAUL_GROUPS[i].k.indexOf(k) > -1) return i; return -1; }
function toggleBaul(k){

  var a = (M['b' + gi] || []).filter(function(x){ return x >= 0; }), i = a.indexOf(k);
  if (i > -1) a.splice(i, 1); else a.push(k);

/* El Baul tiene 17 reglas y el Codigo 17 bits. Los Codigos de antes llevan
   cuatro cifras (16 bits) y se leen igual: la regla 17, la escalera llana
   (bit 16), queda apagada. Uno nuevo solo crece a cinco cifras si la lleva,
   asi que los Codigos sin ella siguen siendo identicos a los de siempre. */
var BAUL_BITS = 17;
function baulMask(){ var m = 0; baul().forEach(function(k){ if (k >= 0 && k < BAUL_BITS) m |= (1 << k); }); return m; }
function setBaulMask(m){
  BAUL_GROUPS.forEach(function(g, gi){ M['b' + gi] = g.k.filter(function(k){ return (m >> k) & 1; }); });
}
function uniMask(){ var m = 0; universes().forEach(function(id){ var i = UNIID.indexOf(id); if (i > -1) m |= (1 << i); }); return m; }

function restoreM(json){
  var o = JSON.parse(json);
  Object.keys(M).forEach(function(k){ if (!(k in o)) delete M[k]; });
  Object.keys(o).forEach(function(k){ M[k] = o[k]; });
}

/* --- el Codigo --- */
function codeMake(){
  var bm = baulMask();
  var p = ['N1', 'T' + CARD3[cardBase()], 'Z' + (ZOOMK.indexOf(M.zoom || 'carne') + 1 || 2), 'G' + mundoMax(), 'S' + (M.estilo !== false ? 1 : 0), 'B' + hx(bm, bm > 0xFFFF ? 5 : 4)];
  if (M.known && M.world !== null) p.push('W' + ('0' + M.world).slice(-2)); else p.push('U' + hx(uniMask(), 3));
  /* nivel maximo de los jugadores de un mundo propio: solo si se ha dicho, asi
     los Codigos de siempre no cambian; una app vieja no lo conoce y lo ignora */
  if (!(M.known && M.world !== null) && +M.pmax) p.push('J' + Math.max(1, Math.min(5, +M.pmax)));
  p.push('E' + (isAcc() ? 'A' : 'C'));
  /* puntos de mas (o de menos): solo si la mesa los da, asi los Codigos de
     siempre no cambian. Lo negativo va con N (P-N2 son dos puntos menos): una
     app vieja lo lee como 0 en vez de romperse. */
  function xp(k, v){ if (v) p.push(k + (v < 0 ? 'N' + (-v) : v)); }
  xp('P', ptsExtra());
  xp('K', keysExtra());
  return p.join('-');
}
function codeLink(){ return location.origin + location.pathname + '#c=' + codeMake(); }
function codeParse(str){
  var o = {}, tk = String(str || '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim().split(' ');
  if (!tk.length || tk[0] !== 'N1') return null;
  for (var i = 1; i < tk.length; i++) {
    var k = tk[i].charAt(0), v = tk[i].slice(1);
    if (k === 'T') { if (!C3[v]) return null; o.card = C3[v]; }
    else if (k === 'Z') o.zoom = ZOOMK[(+v) - 1] || 'carne';
    /* G: el nivel maximo del mundo (antes «escala de la partida», el mismo numero) */
    else if (k === 'G') o.grid = Math.max(1, Math.min(6, (+v) || 1));
    else if (k === 'J') o.pmax = Math.max(1, Math.min(5, (+v) || 1));
    else if (k === 'S') o.estilo = v !== '0';
    else if (k === 'B') o.baul = (parseInt(v, 16) || 0) & ((1 << BAUL_BITS) - 1);
    else if (k === 'W') o.world = +v;
    else if (k === 'U') o.unis = parseInt(v, 16) || 0;
    else if (k === 'E') o.edition = (v === 'A') ? 'acelerado' : 'completo';
    else if (k === 'P') o.pts = v.charAt(0) === 'N' ? -(+v.slice(1) || 0) : (+v || 0);
    else if (k === 'K') o.kx = v.charAt(0) === 'N' ? -(+v.slice(1) || 0) : (+v || 0);
  }
  return o.card ? o : null;
}
function applyCode(str){
  var c = codeParse(str); if (!c) return false;
  rbUndo = JSON.stringify(M);
  M.edition = c.edition || 'completo';
  if (c.world !== undefined && KNOWN[c.world]) { M.known = true; M.world = c.world; M.unis = null; }
  else if (c.unis !== undefined) {
    var u = UNIID.filter(function(id, i){ return (c.unis >> i) & 1; });
    M.known = false; M.world = null; M.unis = u.length ? u : null;
  }
  setCard(c.card);
  M.zoom = c.zoom || 'carne';
  M.grid = c.grid || 1;
  M.pmax = (M.known === false && c.pmax) ? c.pmax : null;
  M.estilo = c.estilo !== false;
  M.pts = xpNum(c.pts || 0);
  M.kx = xpNum(c.kx || 0);
  setBaulMask(c.baul || 0);
  S.scene = null; S.locked = true; S.fix = null;
  return true;
}

}

  TEXTO_CAIDO[idTexto] = '';
  if (DL) return DL.save({filename:name, data:data}).then(function(){ return t('Archivo guardado.','File saved.'); }, cae);
  try {
    var b = new Blob([data], {type:'application/json'}), a = document.createElement('a');

// La musica viaja dentro del archivo como texto. Pesa: por eso es un boton aparte.
function musicaParaArchivo(){
  return musPide(function(st){ return st.getAll(); }).then(function(ps){
    return Promise.all((ps || []).filter(function(p){ return p && p.blob; }).map(function(p){
      return new Promise(function(ok){
        var r = new FileReader();
        r.onload = function(){ ok({id:p.id, nom:p.nom, tipo:p.tipo, carta:p.carta, data:r.result}); };
        r.onerror = function(){ ok(null); };
        r.readAsDataURL(p.blob);
      });
    }));
  }).then(function(xs){ return xs.filter(Boolean); });
}
function dataABlob(d){
  var i = d.indexOf(','), tipo = d.slice(5, i).split(';')[0], b = atob(d.slice(i + 1)), u8 = new Uint8Array(b.length);
  for (var k = 0; k < b.length; k++) u8[k] = b.charCodeAt(k);
  return new Blob([u8], {type:tipo});
}
// Al abrir: las pistas del archivo se guardan, y las tarjetas que ellas ocupan
// se sueltan aqui, para que no haya dos pistas en la misma tarjeta.
function musicaDesdeArchivo(lista){
  var cartas = lista.map(function(x){ return x.carta; }).filter(Boolean);
  return musRefresca().then(function(locales){
    return Promise.all(locales.filter(function(p){ return p.carta && cartas.indexOf(p.carta) > -1; }).map(function(p){
      return musPide(function(st){ return st.get(p.id); }).then(function(reg){ if (reg) { reg.carta = null; return musGuarda(reg); } });
    }));
  }).then(function(){
    return Promise.all(lista.map(function(x){ return musGuarda({id:x.id, nom:x.nom, tipo:x.tipo, carta:x.carta, blob:dataABlob(x.data)}); }));
  }).then(function(){ return musRefresca(); });
}
function nPistas(n){ return n === 1 ? t('1 pista', '1 music track') : n + t(' pistas', ' music tracks'); }
function guardaMesa(conMusica){

function importGame(txt, alAcabarMusica){

  var aviso = t('La partida del archivo reemplaza esta mesa y todas sus fichas. ¿Seguir?','The game in the file replaces this table and all its sheets. Continue?');
  if (o.ver && o.ver !== appVer()) aviso = t('Esta mesa se guardó con otra versión de las preguntas de la app. La mesa, las fichas y la historia se abren igual, pero las respuestas de los formularios pueden no coincidir.',
    'This table was saved with another version of the app’s questions. The table, sheets and story open the same, but the form answers may not match.') + '\n\n' + aviso;
  if (!confirm(aviso)) { rbBad = false; return ''; }
  rbUndo = null;
  restoreM(JSON.stringify(o.m));
  S.chars = Array.isArray(o.chars) ? o.chars : [];
  migraEquipo(S.chars, o.bzv);
  if (o.story) S.story = o.story;
  if (o.lang) S.lang = o.lang;
  if (o.askMode) S.askMode = o.askMode;
  if (o.q && typeof o.q === 'object') S.q = o.q;
  S.locked = o.locked !== false; S.scene = null; S.fix = null; S.tab = 'tpl'; S.form = null; S.st = {}; S.ia = {};
  rbBad = false;
  if (Array.isArray(o.musica) && o.musica.length) {
    var fin = alAcabarMusica || function(m){ rbMsg = m; render(true); }, n = o.musica.length;
    musicaDesdeArchivo(o.musica).then(function(){ fin(t('Partida abierta, con ' + nPistas(n) + ' de música.', 'Game loaded, with ' + nPistas(n) + '.')); },
      function(){ fin(t('Partida abierta, pero la música no ha cabido en este navegador.','Game loaded, but the music did not fit in this browser.')); });
    return t('Partida abierta: mesa, fichas e historia. Metiendo la música…','Game loaded: table, sheets and story. Loading the music…');
  }
  return t('Partida abierta: mesa, fichas e historia.','Game loaded: table, sheets and story.');
}

function bindCfg(){
  var aviso = function(m, ok){ cfgIAmsg = m; cfgIAok = ok; render(true); };
  $('cfgProv').addEventListener('change', function(){ try { localStorage.setItem(PROV_K, this.value); } catch(e){} eligeIA(); cfgIAmsg = ''; render(true); });
  $('cfgSave').addEventListener('click', function(){
    var v = ($('cfgKey').value || '').trim();
    if (!v) { aviso(t('Pega primero la clave.','Paste the key first.'), false); return; }
    // si la clave es claramente de otro proveedor, se cambia solo y se avisa
    var de = provDeClave(v), cambio = de && de !== provActual();
    if (cambio) try { localStorage.setItem(PROV_K, de); } catch(e){}
    guardaClave(v, $('cfgRec').checked); eligeIA();
    aviso((cambio ? t('Es una clave de ','That is a key for ') + PROVS[de].n + t(': cambio el proveedor. ','; switching provider. ') : '') + t('Clave guardada. Compruébala con «Probar la conexión».','Key saved. Check it with “Test the connection”.'), null);
  });
  var d = $('cfgDel'); if (d) d.addEventListener('click', function(){ guardaClave('', false); eligeIA(); aviso(t('Clave borrada de este navegador.','Key deleted from this browser.'), null); });
  $('cfgRec').addEventListener('change', function(){ var k = claveActual(); if (k) guardaClave(k, this.checked); render(true); });
  $('cfgModel').addEventListener('change', function(){ try { localStorage.setItem(kModelo(provActual()), this.value.trim()); } catch(e){} cfgIAmsg = ''; render(true); });
  var p = $('cfgTest'); if (p) p.addEventListener('click', function(){
    aviso(t('Probando…','Testing…'), null);
    byokSample(t('Contesta solo con la palabra: funciona','Reply with just the word: works'), {max:400}).then(function(r){
      aviso(t('Funciona. ','It works. ') + modeloNombre() + t(' ha contestado: «',' replied: “') + r.text.trim().slice(0, 60) + t('».','”.'), true);
    }, function(e){
      if (!e || e.code !== 'modelo') { aviso(errText(e), false); return; }
      // el nombre del modelo ha caducado o no esta en tu cuenta: se enseñan los que hay
      modelosDeLaClave().then(function(ls){
        aviso(errText(e) + (ls.length ? ' ' + t('Los que tiene tu clave: ','Your key has: ') + ls.slice(0, 15).join(', ') + (ls.length > 15 ? '…' : '') : ''), false);
      }, function(){ aviso(errText(e), false); });
    });
  });
  var hecho = function(m){ cfgMsg = m; render(true); };
  $('cfgExp').addEventListener('click', function(){ hecho(t('Guardando…','Saving…')); guardaMesa(false).then(hecho); });
  $('cfgExpM').addEventListener('click', function(){
    hecho(t('Preparando la mesa con su música…','Preparing the table with its music…'));
    guardaMesa(true).then(hecho, function(){ hecho(t('No se ha podido leer la música de este navegador.','Could not read the music from this browser.')); });
  });
  $('cfgImp').addEventListener('change', function(){
    var f = this.files && this.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      var m = importGame(String(r.result), function(fin){ cfgMsg = fin; persist(); render(true); });
      if (m && !rbBad) S.tab = 'cfg';       // se queda aqui para leer el resultado
      cfgMsg = m; persist(); render();
    };
    r.readAsText(f);
  });
}

    '<textarea id="rbJson" placeholder="' + esc(t('Aquí aparece la partida si el navegador no deja guardar archivos; y aquí puedes pegarla para abrirla.','The game appears here if the browser will not save files; and you can paste one here to open it.')) + '"></textarea></div>';
}
function rbCopy(txt, id){
  var el = $(id);
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt); return true; } } catch(e){}
  try { if (el) { el.value = txt; el.select(); return document.execCommand('copy'); } } catch(e){}
  return false;
}
document.addEventListener('click', function(e){
  var b = e.target.closest('.rulesbar [data-rbb]'); if (!b) return;
  var k = b.getAttribute('data-rbb');
  if (k !== 'apply' && k !== 'undo') rbUndo = null;
  if (k === 'estilo') { M.estilo = !estilo(); rbMsg = ''; }
  else if (k === 'baul' || k === 'code' || k === 'file') { rbOpen = (rbOpen === k) ? null : k; rbMsg = ''; }
  else if (k === 'baulk') { toggleBaul(+b.getAttribute('data-k')); }
  /* «Recomiéndame» abre el formulario del Baúl (el 3), que es el que las recomienda */
  else if (k === 'ctxgo') { S.tab = 'form'; S.form = 'baul'; S.st.baul = 0; rbOpen = null; rbMsg = ''; persist(); render(); window.scrollTo(0,0); return; }
  else if (k === 'copy') { rbBad = !rbCopy(codeMake(), 'rbCode'); rbMsg = rbBad ? t('Cópialo a mano desde el recuadro.','Copy it by hand from the box.') : t('Código copiado.','Code copied.'); }
  else if (k === 'copylink') { rbBad = !rbCopy(codeLink(), 'rbCode'); rbMsg = rbBad ? t('Cópialo a mano desde el recuadro.','Copy it by hand from the box.') : t('Enlace copiado.','Link copied.'); }
  else if (k === 'apply') {
    var v = $('rbCodeIn') ? $('rbCodeIn').value : '';
    if (applyCode(v)) { rbBad = false; rbMsg = t('Mesa cambiada: ','Table changed: ') + pick(card().n) + ' · ' + worldName(); rbOpen = null; }
    else { rbBad = true; rbMsg = t('Ese Código no se entiende. Debe empezar por N1.','That Code cannot be read. It has to start with N1.'); }
  }
  else if (k === 'export') { rbMsg = exportGame(); }
  else if (k === 'importpaste') { rbMsg = importGame($('rbJson') ? $('rbJson').value : ''); if (rbMsg && !rbBad) rbOpen = null; }
  else if (k === 'undo') { if (rbUndo) { restoreM(rbUndo); rbUndo = null; S.scene = null; rbMsg = t('Se ha deshecho el cambio.','The change has been undone.'); rbBad = false; } }
  else if (k === 'hide') { rbMsg = ''; }
  else return;
  persist(); render(true);
});
document.addEventListener('change', function(e){
  var el = e.target.closest('.rulesbar [data-rb], .rulesbar [data-rbfile]'); if (!el) return;
  if (el.getAttribute('data-rbfile')) {
    var f = el.files && el.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(){ rbMsg = importGame(String(r.result)); if (rbMsg && !rbBad) rbOpen = null; persist(); render(); };
    r.onerror = function(){ rbBad = true; rbMsg = t('No se ha podido leer el archivo.','The file could not be read.'); render(true); };
    r.readAsText(f); return;
  }
  var f2 = el.getAttribute('data-rb'), v = el.value;
  rbMsg = ''; rbUndo = null;
  if (f2 === 'world') {
    var i = +v;
    if (i < 0) {
      if (M.tech === null || M.tech === undefined) { S.tab = 'form'; S.form = 'uni'; S.st.uni = 0; persist(); render(); window.scrollTo(0,0); return; }
      M.known = false; M.world = null;
    } else { M.known = true; M.world = i; M.unis = null; rbMsg = t('Universo cambiado. Si además quieres su receta de tono entera, cámbiala con la tarjeta y el resto de la barra.','Universe changed. If you also want its whole tone recipe, set it with the card and the rest of the bar.'); }
  }
  else if (f2 === 'edition') M.edition = v;
  else if (f2 === 'card') setCard(v);
  else if (f2 === 'acc') setAccMode(v);
  else if (f2 === 'zoom') M.zoom = v;
  else if (f2 === 'grid') M.grid = +v;
  else if (f2 === 'pmax') { M.pmax = (+v) || null; if (M.pmax && M.pmax > (+M.grid || 1)) M.grid = M.pmax; }
  else if (f2 === 'pts') M.pts = xpNum(v);
  else if (f2 === 'kx') M.kx = xpNum(v);
  persist(); render(true);
});
function fromHash(live){
  var m = /[#&?]c=([A-Za-z0-9\-]+)/.exec(location.hash || '');
  if (!m) return false;
  var ok = applyCode(m[1]);
  if (ok) {
    S.tab = 'tpl'; rbOpen = null; rbBad = false;
    rbMsg = t('Mesa cargada desde el enlace: ','Table loaded from the link: ') + pick(card().n) + ' · ' + worldName();
    persist();
  }
  try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
  if (ok && live) { render(); window.scrollTo(0,0); }
  return ok;
}
window.addEventListener('hashchange', function(){ fromHash(true); });
fromHash(false);

/* ======================= RENDER ======================= */
function render(keep){
  renderTop();
  var v = $('view'), y = window.scrollY;
  if (S.tab === 'form') { v.innerHTML = renderForm(); bindForm(); }
  else if (S.tab === 'tpl') { v.innerHTML = renderTemplate(); var cb = $('createBtn'); if (cb) cb.addEventListener('click', function(){ var c = newChar(); S.chars.push(c); S.tab = c.id; S.form = null; persist(); render(); window.scrollTo(0,0); }); }
  else if (S.tab === 'ask') { v.innerHTML = renderAsk(); $('askBtn').addEventListener('click', ask); $('stopBtn').addEventListener('click', function(){ if (ctl) ctl.abort(); }); $('clearBtn').addEventListener('click', function(){ if (S.askMode === 'camp') campReset(); else turns = []; $('chat').innerHTML = ''; }); v.querySelectorAll('[data-amode]').forEach(function(b){ b.addEventListener('click', function(){ S.askMode = b.getAttribute('data-amode'); pendingQ = null; persist(); render(); }); }); if ($('askLock')) $('askLock').addEventListener('click', function(){ unlocked = false; campReset(); render(); }); $('askQ').addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); } }); }
  else if (S.tab === 'dice') { v.innerHTML = renderDice(); bindDice(); }
  else if (S.tab === 'story') { v.innerHTML = renderStory(); bindStory(); }
  else if (S.tab === 'ses') { v.innerHTML = renderSes(); $('sesBtn').addEventListener('click', analyse); }
  else if (S.tab === 'cfg') { v.innerHTML = renderCfg(); bindCfg(); }
  else {
    var c = S.chars.filter(function(x){ return x.id === S.tab; })[0];
    if (!c) { S.tab = 'tpl'; return render(); }
    v.innerHTML = renderChar(c, S.chars.indexOf(c));
    var sh = $('pcSheet');
    sh.addEventListener('click', function(e){ onChar(e, c); });
    $('f-name').addEventListener('input', function(){ c.name = this.value; persist(); renderTop(); var h2 = sh.querySelector('.sheethead h2'); if (h2) h2.textContent = c.name || (u('pc') + ' ' + (S.chars.indexOf(c) + 1)); });
    ['concept','keys','notes'].forEach(function(k){ $('f-' + k).addEventListener('input', function(){ c[k] = this.value; persist(); }); });
    if ($('f-arc')) $('f-arc').addEventListener('change', function(){ c.arc = this.checked; persist(); render(true); });
    if ($('f-kw')) $('f-kw').addEventListener('input', function(){ c.kw = Math.max(0, +this.value || 0); persist(); render(true); });
    sh.querySelectorAll('[data-ktxt]').forEach(function(x){ x.addEventListener('input', function(){ c.klist[+x.getAttribute('data-ktxt')].t = x.value; persist(); }); });
    sh.querySelectorAll('[data-kform]').forEach(function(x){ x.addEventListener('change', function(){ c.klist[+x.getAttribute('data-kform')].w = x.value; persist(); render(true); }); });
    sh.querySelectorAll('[data-klv]').forEach(function(x){ x.addEventListener('change', function(){ c.klist[+x.getAttribute('data-klv')].lv = +x.value; persist(); render(true); }); });
    if ($('f-ksp')) $('f-ksp').addEventListener('input', function(){ c.ksp = Math.max(0, +this.value || 0); persist(); render(true); });
    /* elegir el ambito no sube nada: sube el boton +1 Rejilla, y se paga */
    sh.querySelectorAll('[data-gamb]').forEach(function(x){ x.addEventListener('change', function(){ var gx = c.gear[+x.getAttribute('data-gamb')]; if (gx) gx.amb = x.value; persist(); render(true); }); });
    sh.querySelectorAll('[data-gj]').forEach(function(x){ x.addEventListener('change', function(){ c.gj = c.gj || {}; c.gj[x.getAttribute('data-gj')] = +x.value; persist(); render(true); }); });
    sh.querySelectorAll('[data-potamb]').forEach(function(x){ x.addEventListener('change', function(){ c.potAmb = x.value; persist(); render(true); }); });
    sh.querySelectorAll('select[data-grid]').forEach(function(s){ s.addEventListener('change', function(){ c.grid[s.getAttribute('data-grid')] = +s.value; persist(); }); });
    sh.querySelectorAll('select[data-fsel]').forEach(function(s){ s.addEventListener('change', function(){ c.fir[+s.getAttribute('data-fsel')].s = s.value; persist(); render(true); if (s.value === 'own') { var x = sh.ownerDocument.querySelector('[data-ftxt="' + s.getAttribute('data-fsel') + '"]'); if (x) x.focus(); } }); });
    sh.querySelectorAll('input[data-ftxt]').forEach(function(x){ x.addEventListener('input', function(){ c.fir[+x.getAttribute('data-ftxt')].t = x.value; persist(); }); });
    var gs = groups();
    $('gType').addEventListener('change', function(){ var g = gs[+this.value], it = $('gItem'); it.innerHTML = '<option value="">' + esc(t('Objeto…','Item…')) + '</option>' + (g ? g.items.map(function(x, i){ return '<option value="' + i + '">' + esc(pick(x.n)) + ' — ' + esc(pick(x.d)) + '</option>'; }).join('') : ''); it.disabled = !g; $('gAdd').disabled = true; });
    $('gItem').addEventListener('change', function(){ $('gAdd').disabled = this.value === ''; });
  }
  v.querySelectorAll('[data-print]').forEach(function(b){ b.addEventListener('click', function(){ window.print(); }); });
  if (keep) window.scrollTo(0, y);
}
if (M.known === null) { S.form = null; }
render();
musRefresca().then(function(){ if (MUSP.length) render(true); });
})();
</script>
