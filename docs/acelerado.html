<section class="chapter" id="acelerado">
<h2>NOGUM Accelerated · Immediate Immersion Protocol</h2>
<p><em>Play now. Ask yourself why it works later.</em></p>

<aside class="meta"><p>This is a complete game, not a summary. It is also a giant advert: at the end of each rule you will find a question. If one of them gets under your skin, the Complete Game is waiting for you. If not, just play.</p></aside>

<!-- ============================ 0 ============================ -->
<h3 id="ac-arranque"><span class="hn">0</span> · Start-up</h3>
<h4>0.1 The promise</h4>
<p>You will be playing in ten minutes, without reading two hundred pages. There is no theory and no explanation here: only rules that work. With them you can play in your favourite universe, whichever it is.</p>
<h4>0.2 What you need</h4>
<ul>
<li><strong>Two ten-sided dice of different colours: one red and one blue.</strong> One pair per player, or one pair for the whole table.</li>
<li>One character sheet per player (at the end of this rulebook).</li>
<li>A Game Master (GM) who has read these pages. The players do not need to read them.</li>
<li>Friends who want to tell a story together.</li>
</ul>
<h4>0.3 The black box</h4>
<p>The players do not need to know the rules. The deal is simple:</p>
<blockquote><p>You declare your action and roll. I tell you what happens.</p></blockquote>
<p>The GM translates the numbers into story. Nobody at the table has to hear the word “modifier” if they don't want to.</p>
<aside class="meta"><p>Does it feel like the GM gets a lot of the work? They do. It's a feature, not a bug. <span class="src">T72</span></p></aside>

<!-- ============================ 1 ============================ -->
<h3 id="ac-selector"><span class="hn">1</span> · Mission selector</h3>
<p>Before starting, the GM answers two sets of questions about the universe they are going to play. Don't ask “which game are we playing?”. Ask “how does this world feel?”. <span class="src">T76</span></p>

<h4>1.1 How much optimism is there in your world?</h4>
<div class="tw"><table class="t">
<thead><tr><th>Question</th><th>Little</th><th>Normal</th><th>A lot</th></tr></thead>
<tbody>
<tr><td>Does the universe have favourites?</td><td>Yes: the monsters</td><td>No: nobody</td><td>Yes: us</td></tr>
<tr><td>When a plan goes wrong, why?</td><td>Because the enemy is competent and cruel</td><td>Because sometimes things go wrong</td><td>It hardly ever goes wrong; and if it does, there's a vine to swing from</td></tr>
<tr><td>How do these stories end?</td><td>Surviving is already winning</td><td>It depends on what you do</td><td>The heroes win</td></tr>
</tbody></table></div>
<p>Go with the answer that comes up most often. If none repeats (little, normal, a lot), the first question decides. <span class="src">T176</span></p>

<h4>1.2 How much chaos is there in your world?</h4>
<div class="tw"><table class="t">
<thead><tr><th>Question</th><th>Little</th><th>Normal</th><th>A lot</th></tr></thead>
<tbody>
<tr><td>Is physics reliable?</td><td>It's clockwork</td><td>It's a film</td><td>It's madness</td></tr>
<tr><td>What happens when someone does it right?</td><td>It works, always</td><td>It works, almost always</td><td>It may work… at a price</td></tr>
<tr><td>Are there absurd surprises?</td><td>Never</td><td>Some</td><td>Constantly</td></tr>
</tbody></table></div>
<p>Go with the answer that comes up most often. If none repeats, the first question decides. <span class="src">T176</span></p>
<p>The questions are this rulebook's own: the author set the format (optimism and chaos separately; little / normal / a lot) and the two parent questions, not the wording of the others. <span class="src">Approved by the author</span></p>

<h4>1.3 Your game mode</h4>
<p>Cross your two answers on the table:</p>
<div class="tw"><table class="t">
<thead><tr><th>Optimism \ Chaos</th><th>Little</th><th>Normal</th><th>A lot</th></tr></thead>
<tbody>
<tr><td><strong>A lot</strong></td><td>Optimistic</td><td>Optimistic</td><td>Optimistic</td></tr>
<tr><td><strong>Normal</strong></td><td>Neutral</td><td>Neutral</td><td>Chaos</td></tr>
<tr><td><strong>Little</strong></td><td>Terror</td><td>Terror</td><td>Terror</td></tr>
</tbody></table></div>
<p>Optimism picks the mode and chaos decides one box. There are four, and each changes one thing and one thing only:</p>
<ul>
<li><strong>Optimistic</strong> changes <em>the die</em>: you roll two and keep the higher.</li>
<li><strong>Neutral</strong> changes nothing. It is the reference.</li>
<li><strong>Chaos</strong> changes <em>what the result is made of</em>: same die, wider bands and successes that charge a toll.</li>
<li><strong>Terror</strong> changes <em>what you can take</em>: the same die as Neutral, but three health boxes instead of nine.</li>
</ul>
<p>Look hard at the third one, because it is the strangest and the most important thing in this book: <strong>Chaos and Neutral bring exactly the same number of rolls home</strong>, 50&nbsp;% with the sheet at zero and 70&nbsp;% with the sheet at +2. They are identical up to +3; at +4 they drift slightly apart, because in Chaos a 2 on the red is still a fumble: 80&nbsp;% against 90&nbsp;%. Chaos does not make you fail more. It changes what happens to you is made of: where Neutral deals clean successes and clean failures, Chaos deals fumbles, criticals and wins that come with an invoice.</p>
<p>And the fourth is the other way to hurt. <strong>In Terror the world is not crueller: you are more fragile.</strong> You roll as in Neutral and you hit just as often. What changes is that a knife kills you. The Complete Game calls that <em>fractal health</em> and leaves it in your hands; here it comes preset, so you can watch it work without having to decide anything.</p>

<aside class="meta"><p>Missing a tone? A world that is Swiss clockwork and cruel at the same time? A game of Russian roulette where a 9 is already a miracle? Dark <em>and</em> chaotic at once? These four cover roughly everything and are enough to start with. And they are not a separate invention: all four exist in the Complete Game —Optimistic is Epic, Neutral is First Gear, Chaos is Black comedy and Terror is First Gear with the short health track—. By the time they feel small, you already know four of the seven cards. <span class="src">T135</span></p></aside>

<!-- ============================ 2 ============================ -->
<h3 id="ac-reglas"><span class="hn">2</span> · Universal rules</h3>

<h4>2.1 The single roll</h4>
<p>Always roll both dice, the red one and the blue one. What changes is how you read them:</p>
<div class="tw"><table class="t">
<thead><tr><th>Mode</th><th>Which die counts</th><th>Fumble</th><th>Critical</th><th>Result</th></tr></thead>
<tbody>
<tr><td><strong>Optimistic</strong></td><td>The <strong>higher</strong> of the two</td><td>Double 1</td><td>A 10 on either</td><td>Total 6 or more: success</td></tr>
<tr><td><strong>Neutral</strong></td><td><strong>Only the red one</strong> (the blue one doesn't count)</td><td>1 on the red</td><td>10 on the red</td><td>Total 6 or more: success</td></tr>
<tr><td><strong>Chaos</strong></td><td><strong>Red die only</strong> (the blue one does not count)</td><td>A 1 <strong>or 2</strong> on the red</td><td>A 9 <strong>or 10</strong> on the red</td><td>Total 5 or less: failure · 6 or 7: <strong>partial success</strong> · 8 or more: success</td></tr>
<tr><td><strong>Terror</strong></td><td><strong>Red die only</strong> (the blue one does not count)</td><td>A 1 on the red</td><td>A 10 on the red</td><td>Total 6 or more: success · <strong>and only 3 health boxes</strong> (2.7)</td></tr>
</tbody></table></div>
<div class="rule"><p class="rule-title">How to roll</p>
<ol>
<li>Read the die the mode tells you to.</li>
<li>Add your bonus (2.2). That is the <strong>total</strong>.</li>
<li>Compare it with <strong>TN 6</strong>. Always the same one.</li>
<li><strong>Fumbles</strong> and <strong>criticals</strong> are read on the dice, before adding anything. A fumble is always a disaster and a critical is always something extraordinary, whatever your bonus.</li>
</ol>
</div>
<p><strong>Partial success (Chaos only).</strong> You pull it off, but you pay a price. The GM picks one:</p>
<ul>
<li><strong>Time</strong>: you manage it, but late; the guards are already in the corridor.</li>
<li><strong>Resource</strong>: you manage it, but something breaks; the bat splinters.</li>
<li><strong>Position</strong>: you manage it, but you are left exposed; you fall flat on your back on the other side of the wall.</li>
<li><strong>Friendly fire</strong>: you manage it, but someone else gets caught in it; the explosion takes out the only radio.</li>
</ul>
<p>Never “you pull it off, but you lose a health box”. That is laziness.</p>

<aside class="meta"><p>Same character (+2), same task. In <strong>Optimistic</strong> they pull it off 91&nbsp;% of the time. In <strong>Neutral</strong>, 70&nbsp;%. In <strong>Chaos</strong>, also 70&nbsp;% —you read that right, the same number— but two out of every seven of those times paying a price, and with twice the fumbles and twice the criticals. In <strong>Terror</strong>, 70&nbsp;% again: what changes is that two hits now put them out. You have not touched the sheet once: you have changed the atmosphere three times in three different ways.</p></aside>

<h4>2.2 Bonuses</h4>
<p>Your bonus comes from your sheet and from the situation. Your sheet only gives five possible values:</p>
<div class="tw"><table class="t">
<thead><tr><th>Bonus</th><th>Who you are at this</th></tr></thead>
<tbody>
<tr><td class="num">−2</td><td><strong>Null.</strong> You haven't put a single point into that whole sphere.</td></tr>
<tr><td class="num">−1</td><td><strong>Clumsy.</strong> You have the sphere, but that column is empty: you are on the wrong foot.</td></tr>
<tr><td class="num">+1</td><td><strong>I get by.</strong> You have a broad skill that covers it.</td></tr>
<tr><td class="num">+2</td><td><strong>It's my job.</strong> You have a specific skill that covers it.</td></tr>
<tr><td class="num">+4</td><td><strong>Grand Master.</strong> Nobody does it better.</td></tr>
</tbody></table></div>
<p><strong>Difficulty.</strong> If the task is easy, +2. If it is hard, −2. If it is heroic, −4. Normal is 0. Difficulty is added to the bonus; the TN never moves.</p>
<p><strong>Limits.</strong> Add up skill, difficulty and any other modifier. If the total drops below −2, the GM chooses: either roll at −2 or narrate the failure without rolling. If it goes above +4, the GM chooses: either roll at +4 or narrate the success without rolling. The final bonus is always between −2 and +4.</p>
<p><strong>Don't roll for the sake of it.</strong> Roll only if every possible result is interesting. If failing adds nothing, it just happens. What the story cannot do without —the clue without which there is no adventure— is not rolled for: it is found. What you roll for is how much you get and at what price. <span class="src">T176</span></p>

<h4>2.3 Skills</h4>
<p>Every character has <strong>five spheres</strong>: <strong>Physical</strong>, <strong>Mental</strong>, <strong>Social</strong>, <strong>Technical</strong> and <strong>Arcane</strong> (magic, the Force, psychic powers; if your world doesn't have them, ignore it). Spheres are not skills: they are the drawers you keep them in.</p>
<p>Each sphere splits into two <strong>broad skills</strong>, and each of those into four <strong>specific skills</strong>. The list is closed:</p>
<div class="tw"><table class="t">
<thead><tr><th>Sphere</th><th>Broad skill (column)</th><th>Specific skills</th></tr></thead>
<tbody>
<tr><td rowspan="2"><strong>Physical</strong></td><td>Dexterity</td><td>Athletics · Acrobatics · Stealth · Sleight of Hand</td></tr>
<tr><td>Vigour</td><td>Might · Fortitude · Brawling · Weapons</td></tr>
<tr><td rowspan="2"><strong>Mental</strong></td><td>Erudition</td><td>Sciences · Humanities · Occultism · Current Affairs</td></tr>
<tr><td>Wits</td><td>Investigation · Alertness · Tactics · Survival</td></tr>
<tr><td rowspan="2"><strong>Social</strong></td><td>Influence</td><td>Persuasion · Deception · Empathy · Seduction</td></tr>
<tr><td>Hierarchy</td><td>Leadership · Intimidation · Contacts · Resources</td></tr>
<tr><td rowspan="2"><strong>Technical</strong></td><td>Artifice</td><td>Mechanics · Electronics · Biotech · Crafting</td></tr>
<tr><td>Operations</td><td>Driving · Flight · Systems · Security</td></tr>
<tr><td rowspan="2"><strong>Arcane</strong></td><td>Gift</td><td>Projection · Alteration · Divination · Protection</td></tr>
<tr><td>Ritual</td><td>Alchemy · Summoning · Enchantment · Bonds</td></tr>
</tbody></table></div>
<p>You have <strong>12 points</strong>, or <strong>14</strong> if your world has an Arcane sphere (that is ten more slots to cover). Each step costs one point —except the Signature, which costs two— and to raise a step you must have paid for the previous one:</p>
<div class="tw"><table class="t">
<thead><tr><th>Step</th><th>What it is</th><th>Examples</th><th>Cost</th><th>Cumulative points</th><th>Bonus</th></tr></thead>
<tbody>
<tr><td>Broad skill</td><td>Half of a sphere</td><td>Dexterity, Vigour, Erudition, Wits, Influence</td><td class="num">1</td><td class="num">1</td><td class="num">+1</td></tr>
<tr><td>Specific skill</td><td>A trade within the broad skill</td><td>Vigour → Weapons · Erudition → Sciences · Influence → Deception</td><td class="num">1</td><td class="num">2</td><td class="num">+2</td></tr>
<tr><td>Signature (Grand Master)</td><td>Your specialty within the trade</td><td>Weapons → Firearms · Sciences → Chemistry · Acrobatics → Parkour</td><td class="num">2</td><td class="num">4</td><td class="num">+4</td></tr>
</tbody></table></div>
<ul>
<li>When you roll, use <strong>only the highest step that fits</strong>. Bonuses don't stack.</li>
<li>A <strong>column</strong> is each of the two broad skills of a sphere, with its specific skills underneath: in Physical, Dexterity is one column and Vigour the other.</li>
<li>If you have spent nothing in a sphere, everything in it is rolled at −2 (Null). As soon as you buy anything in it, the column you have touched gives its bonuses as normal, and anything that falls in <strong>the other column</strong> is rolled at −1 (Clumsy).</li>
<li>To be a Grand Master at something, you must be able to explain <strong>exactly</strong> what you do. “Firearms”, yes. “Being good”, no.</li>
<li>In addition, every character has <strong>Style +2</strong>, a gift that sits outside the spheres (2.8).</li>
</ul>
<aside class="meta"><p>Not sure which skill to pick? Torn between “Piloting” and “Evasive driving”? NOGUM has a closed list of 10 broad skills and 40 specific ones, plus a catalogue of Signatures sorted so you only look at your branch. NOGUM has your back. <span class="src">T135</span></p></aside>

<h4>2.4 The Grid: how big your feats are</h4>
<p>The bonus says <strong>how well</strong> you do something. The Grid says <strong>at what scale</strong> you do it. Each character has one level per sphere. Ask yourself: if this gets out of hand, what makes the news?</p>
<div class="tw"><table class="t">
<thead><tr><th>Level</th><th>Scale</th><th>Examples</th></tr></thead>
<tbody>
<tr><td class="num">1</td><td>One person</td><td>Any human, however expert: The consultant from Baker Street, a boxer, a hacker.</td></tr>
<tr><td class="num">2</td><td>A room, hundreds of people</td><td>An exceptional human, only if your universe allows it: the barbarian of the steppe, the perfect soldier. A rank-and-file soldier stands no chance against them.</td></tr>
<tr><td class="num">3</td><td>A building, a neighbourhood</td><td>Bringing down a castle, cutting the power grid of a skyscraper.</td></tr>
<tr><td class="num">4</td><td>A big city</td><td>A mystic shield over the city, a monster razing districts.</td></tr>
<tr><td class="num">5</td><td>A country</td><td>Changing the geography. Only for campaign finales.</td></tr>
<tr><td class="num">6</td><td>Cosmic</td><td>No rolling: it's scenery. The GM narrates it.</td></tr>
</tbody></table></div>
<p>Each level multiplies your <strong>reach</strong> by a hundred: ×1 one person, ×100 a room, ×10,000 a building, ×1,000,000 a city, ×100,000,000 a country. When someone has a level on you they are not better than you: they are playing with two more zeros, and that is why there is no roll.</p>
<p>If you don't know which level to give, <strong>humans are level 1 in everything</strong>. What is measured is tools and scale, not intelligence or muscle: a brilliant chemist is still level 1. And <strong>ones are plentiful</strong>: however big the game, almost all of a character's spheres stay at 1. <span class="src">T176</span></p>
<div class="rule"><p class="rule-title">Five ideas that settle almost everything</p>
<ol>
<li><strong>The Grid is scale, not skill, and it is almost never human:</strong> ×100 across a whole sphere, something irresistible. The vampire’s presence is a 2; the sirens, a 3. A rock star is a 1 with Keys. That is why ones are plentiful.</li>
<li><strong>If something grants a permission or breaks the Grid, it has Keys.</strong> Wherever it comes from.</li>
<li><strong>The Reaper is a Key:</strong> it reaches whoever stands above. That is why it costs Keys.</li>
<li><strong>What is lent or stolen lasts one scene,</strong> whoever uses it. Passing it around resets nothing.</li>
<li><strong>What a Key does is what the Key says:</strong> it puts you one level above, but only in what it covers. A bazooka is a Key to damage: it blows you apart if it hits, but it has to hit.</li>
</ol>
<p>The hard cases, solved one by one, are in the complete rulebook (2.6). <span class="src">T179</span></p></div>
<div class="rule"><p class="rule-title">The power gap</p>
<p>It works for everyone: players and adversaries alike. Compare the Grid level of whoever acts with the level of whatever they act against, in the sphere of the action. An NPC or a monster has a single level for everything, unless the GM says otherwise.</p>
<ul>
<li><strong>If you are at the same level</strong>, roll as normal: attack, defence, everything.</li>
<li><strong>If you are above</strong> (even by one level), you don't roll to succeed: you succeed. If it matters how, roll Style (+2, 2.8). That also goes for a monster attacking characters below it: the blow lands without a roll, with its weapon's damage.</li>
<li><strong>If you are below</strong>, you cannot affect what is above you —not even a scratch— without a <strong>Key</strong>. That includes defending yourself: against an attack that comes from above there is no defence roll, unless you have a Key that applies. With a Key you roll everything as normal, with your full bonus.</li>
</ul>
</div>
<p><strong>The Key.</strong> A Key is a narrative reason that lets you affect something of a higher level: a bazooka, the stone from his own world, a stolen admin password, a video of the bribe, twenty mercenaries firing at once. Each Key raises you <strong>one Grid level</strong> against its target. With a Key you roll as normal, with your full bonus and no penalties. Getting one is often an adventure in itself.</p>
<div class="rule"><p class="rule-title">Keys are bought</p>
<ul>
<li>At creation, the <strong>separate pot</strong> gives you <strong>5 Keys</strong>, or <strong>+1 Grid level</strong> in one sphere. By default, every character starts at level 1 in everything; if you pick the +1, it can go in any sphere your universe's ceiling allows. It does not trade for skill points: everyone turns up with a trade.</li>
<li>You can start with more points if the table chooses it consciously, knowing it goes against the idea of this rulebook.</li>
<li>Each Key is <strong>one specific skill against its target, for ever</strong> (“Weapons against vampires” works against vampires, not against a werewolf) or <strong>a whole sphere against its target for one scene</strong>, if it is very specific: that one is crossed off when the scene ends. Never a Signature. It is written down with its target; you can keep it blank and assign it the first time you use it, as the pregenerated characters do. <span class="src">T176</span></li>
<li>Grid and Keys trade: one Grid level in a sphere is worth <strong>5 Keys</strong>, its eight specific skills for the price of five. If the story raises the table’s Grid and you would rather not rise, you take those 5 Keys, which <strong>can only be spent in that sphere</strong>. <span class="src">T176</span></li>
<li>One Key puts you <strong>one Grid level above</strong>. To climb further against the same thing, the count is squared: rising <em>n</em> levels costs <em>n</em>² Keys in total (1, 4, 9). With five in the pot, nobody starts more than two levels above.</li>
<li>During the campaign the Director hands out <strong>one Key per player per session</strong> <span class="src">T176</span>. That tap is the game’s power dial: Keys also buy the equipment that breaks the Grid. Only that: normal equipment costs money and nothing else (2.9).</li>
<li>And what the Director gives you for a good idea —“it occurs to you to use the holy water”— is a <strong>lent Key</strong>: it lasts one scene; it goes on the sheet in pencil and is rubbed out when the scene ends.</li>
</ul></div>
<aside class="meta"><p>Why can the vigilante millionaire stand up to the alien in tights and trunks with the same bonus as a nightclub bouncer? Because of the Key. The Complete Game has a whole chapter bringing the Grid down to earth, with pop-culture examples in all five spheres. NOGUM is waiting for you.</p></aside>

<h4>2.5 Initiative</h4>
<p>When combat starts, each participant rolls with the active mode and adds their <strong>best Dexterity bonus</strong> (the broad skill or any of their specific skills under it). Act from highest to lowest total. On a tie, the GM decides.</p>
<aside class="meta"><p>If your character is going to spend their turn deducing a clue, hacking a terminal or intimidating the rival boss… does it make sense for their physical speed to decide the order? Want an initiative where you first choose your intent (violence, trick or specialty) and then how you carry it out? NOGUM is waiting for you. <span class="src">T135</span></p></aside>

<h4>2.6 Combat</h4>
<p>Combat is an aggressive negotiation. Each attack is resolved in two steps.</p>
<div class="rule"><p class="rule-title">Step 1 · Impact (the attacker rolls)</p>
<p>Roll your attack skill against TN 6. The defender's circumstances (cover, fog, size) change the difficulty. The defender's skills don't count here.</p>
<ul>
<li><strong>Fumble</strong>: you don't connect and something goes wrong (you disarm yourself, hit an ally…).</li>
<li><strong>Failure</strong>: the blow goes astray.</li>
<li><strong>Success</strong>: you connect. The weapon's damage is in the air.</li>
<li><strong>Critical</strong>: you hit a vital spot: <strong>+1 damage</strong>.</li>
</ul>
</div>
<div class="rule"><p class="rule-title">Step 2 · Mitigation (the defender rolls)</p>
<p>If the weapon allows it (check its tags), the defender makes <strong>a single reaction</strong>: dodge (Dexterity → Acrobatics) or soak (Vigour → Fortitude), depending on which route the weapon leaves open.</p>
<p><strong>The defender wins ties.</strong> You both roll against the same TN and compare the <strong>result level</strong>: fumble &lt; failure &lt; success at a cost &lt; success &lt; critical.</p>
<ul>
<li><strong>The defender matches or beats</strong> the attacker’s result level: no damage.</li>
<li><strong>The attacker ends up above</strong> and the defender got a success or a success at a cost: weapon damage −1.</li>
<li><strong>The defender fails</strong>: takes all the damage.</li>
<li><strong>The defender fumbles</strong>: the attack goes up one result level on that scale, and then you compare. If that takes it to a critical, +1 damage, like any critical. <span class="src">T176</span></li>
</ul>
</div>
<p><strong>Final damage</strong> = weapon damage (+1 if the attack ended up a critical) − the defender's reduction, within the limits set by the tags.</p>
<p><strong>Hazards with no attacker</strong> (falls, fire, the environment): they count as a successful attack of their level; if they are extreme, as a critical; the huge ones carry the Reaper with their level. They never kill: at worst, out of the fight. <span class="src">T176</span></p>
<p><strong>Tags override the tie.</strong> With <span class="tag">Dodge: Partial</span> you eat at least 1 even when you match it, and with <span class="tag">Dodge: None</span> there is no reaction to roll.</p>
<p><strong>In Chaos</strong>, a partial success in combat is a success at a cost: it connects or defends like a success, but in the comparison it counts as one result level lower, and the GM adds a cost from the menu (the attack connects, but you lose your weapon; you dodge, but you hit the floor).</p>

<p><strong>Weapons.</strong> Every weapon, power or hazard is described with three tags:</p>

<tr><td><span class="tag">Dmg 2</span></td><td>Serious</td><td>War swords, magnums, claws. “ICU”.</td></tr>
<tr><td><span class="tag parca">The Reaper</span></td><td>Not a damage value</td><td>Artillery, military explosives, a car at full speed. It carries a Grid level, compared against the target’s Physical. If you are below it, you are out of the fight, with no defence roll: there the Reaper is not dodged, it is avoided by not being there. At its level it does Dmg 2 and you defend as normal, with its tags. Above it, nothing without a Key. <span class="src">T176</span></td></tr>
<tr><td><span class="tag">Dodge: Full</span></td><td>Free dodge</td><td>Melee, slow projectiles. Dodging can bring you down to 0.</td></tr>

<p>A Reaper above your level breaks the Grid and is paid for like any weapon: <em>x</em>² Keys, with <em>x</em> the levels it has on you. A Reaper 2 grenade in the hands of a level 1 character costs 1 Key (2.4). <span class="src">T176</span></p>
<aside class="meta"><p>Want a weapon that can only harm something of a higher level if it's the right one? A catalogue of hundreds of weapons, powers and vehicles from ten settings? The Multiverse Bazaar is in the Complete Game.</p></aside>

<h4>2.7 Health</h4>
<p>Every character has <strong>9 health boxes</strong>, in three blocks of three. Each point of damage crosses off one box.</p>
<div class="rule"><p class="rule-title">Except in Terror</p>
<p>In <strong>Terror</strong> mode there are not nine: there are <strong>3 boxes</strong>, a single block. Fill it and you are out of the fight. With the damage in this book that means <strong>two serious hits take you off the scene</strong>, and that one is enough if the attacker rolls a critical and you don’t stop it.</p>
<p>It is not a switch you have to remember to turn on. It comes with the mode, and it is the one piece of this book that lets you look in on what the Complete Game calls <strong>fractal health</strong>: there, lethality is a dial and you turn it, with three, nine or twenty-seven boxes.</p></div>
<div class="tw"><table class="t">
<thead><tr><th>Block</th><th>Boxes</th><th>When filled</th></tr></thead>
<tbody>
<tr><td>First</td><td class="num">1–3</td><td><strong>−2</strong> to actions the wound gets in the way of (a swollen eye, a broken hand).</td></tr>
<tr><td>Second</td><td class="num">4–6</td><td><strong>−4</strong> (replaces the −2) and you lose complex actions (a useless leg, a haemorrhage).</td></tr>
<tr><td>Third</td><td class="num">7–9</td><td><strong>Out of the fight.</strong></td></tr>
</tbody></table></div>
<ul>
<li><strong>Out of the fight is not death.</strong> You are incapacitated and leave the scene; you come back when it ends, and your health goes the same way as everyone else’s (below). <span class="src">T176</span> Whether you wake up is decided by the story or by your player, never by the dice. In NOGUM nobody dies because of a bad roll.</li>
<li><strong>Not even the Reaper kills.</strong> Whoever it hits below its level is left out of the fight. Death, madness or transformation only happen if they are agreed in the story.</li>
<li>When the threat ends —you have felt safe, even for a moment— the boxes are cleared; if the next fight comes with no breather, it is the same scene and they stay crossed out. <span class="src">T177</span> But <strong>the wounds remain</strong>: the penalty of the block you filled stays until you heal (hours or days for the first, days or weeks for the second).</li>
<li>Penalties respect the limits in 2.2: you never go below −2.</li>
</ul>
<aside class="meta"><p>Would you like to play in a grimy world where a stray bullet makes you fear for your life? Or in an anime where the final boss takes a hundred hits? Or in a story where a glance into the abyss hurts as much as a gunshot? In the Complete Game, the same sheet works for three hits and you're out, for twenty-seven points of attrition, and for wounds to the mind and the soul. NOGUM is waiting for you. <span class="src">T135</span></p></aside>

<h4>2.8 Mooks and Style</h4>
<div class="rule"><p class="rule-title">The Style Rule</p>
<p>Every character has <strong>Style +2</strong>. When you face enemies <strong>below your level</strong> on the Grid, or mere mooks (the scenery of the scene), <strong>you don't roll to see if you win: it's a given</strong>. You roll with the active mode and add your Style to see <strong>how</strong> you win:</p>
<ul>
<li><strong>Fumble</strong>: you win, but you make a fool of yourself. If your character takes themselves very seriously, it may sting.</li>
<li><strong>Failure</strong> (and, in Chaos, partial success): you win, but messily or without shining.</li>
<li><strong>Success</strong>: you win in style, clean and spectacular.</li>
<li><strong>Critical</strong>: legendary. Film-grade choreography, several go down at once and rumours are born.</li>
</ul>
<p>Mooks don't get health boxes tracked. The GM declares what is scenery, and scenery does not hurt you: each Style roll drops one, and a critical drops several. If an enemy can hurt you, it is not scenery: it has a quick sheet (3) and rolls as normal. <span class="src">T176</span></p>
</div>
<p>Style suits anime, wuxia, space opera and action films. <strong>It is not recommended for very serious universes</strong>: in a realistic war, even the lowliest soldier rolls.</p>
<aside class="meta"><p>Why does the hero sweep aside twenty thugs and then sweat against a single one? In the Complete Game you'll see how the Grid, the Key and Style share the work, and how to make enemy sheets in ten seconds. NOGUM is waiting for you.</p></aside>

<h4>2.9 Equipment: what you can afford</h4>
<p>Here normal equipment <strong>costs money and nothing else</strong>, and money is your bonus in <em>Resources</em> (Social → Hierarchy → Resources). No points, no Keys: if your drawer reaches, you have it. Only equipment that breaks the Grid —the kind that lets you affect something of a higher level— also costs Keys (2.4).</p>
<div class="tw"><table class="t">
<thead><tr><th>Resources</th><th>Who you are</th><th>What you carry</th><th>Access</th></tr></thead>
<tbody>
<tr><td class="num">−2</td><td>You have nothing and nobody gives you credit</td><td>Clothes, a knife, whatever you find or are lent</td><td>0, and whatever you find</td></tr>
<tr><td class="num">−1</td><td>You live day to day, with no cushion</td><td>The basics, second-hand: simple tools, a small, old weapon</td><td>0</td></tr>
<tr><td class="num">+0</td><td>A wage, or a crew that covers you</td><td>A small weapon, tools, something with wheels</td><td>0 · 1 with effort</td></tr>
<tr><td class="num">+1</td><td>Savings and contacts</td><td>A serious weapon, light protection, a decent vehicle</td><td>1 · 2 with effort</td></tr>
<tr><td class="num">+2</td><td>Real money, or a patron who pays</td><td>Military hardware, armour, an armoured vehicle</td><td>2 · 3 with effort</td></tr>
<tr><td class="num">+4</td><td>You move budgets that are not yours and money has stopped being the problem</td><td>A team of people, and what should not exist</td><td>3</td></tr>
</tbody></table></div>
<p><strong>Access</strong> is the level of Resources an item asks for: the column says how far you reach. “With effort” is the extra step: once per arc and at a price, as the first line below says. <span class="src">T176</span></p>
<ul>
<li><strong>One step above, once per arc.</strong> You can get hold of something out of your league, but it is never free: a favour that will be called in, a debt, a trail, somebody who now knows your name.</li>
<li><strong>Stolen or borrowed gear works for a whole scene.</strong> Afterwards you decide whether to keep it, and then it does have to fit in your drawer.</li>
<li><strong>The weapon does not make you better, it does something else.</strong> What changes are its tags: how much damage it does, whether it can be dodged and whether armour helps (2.6).</li>
<li><strong>Armour does add:</strong> light armour gives <strong>+1</strong> and heavy armour <strong>+2</strong> to your soak roll, if the weapon allows soaking. <span class="src">T176</span> <span class="src">T178</span></li>
</ul>
<aside class="meta"><p>In the complete rulebook equipment has a whole economy behind it: what makes you <em>better</em> is paid for with skill points and what lets you do the <em>impossible</em> is paid for with Keys, and there is a workshop for pricing anything you invent. Here money is enough. NOGUM is waiting.</p></aside>

<h3 id="ac-interfaz"><span class="hn">3</span> · Game Master interface</h3>
<p>The players don't hear rules: they hear story. This table translates what the rule says into what you narrate.</p>
<div class="tw"><table class="t">
<thead><tr><th>If the rule is…</th><th>Narrate something like…</th></tr></thead>
<tbody>
<tr><td>We start in Optimistic mode</td><td>“The music swells. You feel that today you cannot fail.”</td></tr>
<tr><td>We start in Neutral mode</td><td>“The world is neither on your side nor against you. What you do is what you'll get.”</td></tr>
<tr><td>We start in Terror mode</td><td>“You feel a weight in your stomach. Nobody is coming to save you here.”</td></tr>
<tr><td>Partial success</td><td>“You pull it off… but” + a cost from the menu: time, resource, position or friendly fire.</td></tr>
<tr><td>Fumble</td><td>“Something goes spectacularly wrong.” And make it interesting, not just humiliating.</td></tr>
<tr><td>Attacker's critical</td><td>“You hit them right where it hurts.” (+1 damage.)</td></tr>
<tr><td>Weapon with <span class="tag">Dodge: None</span></td><td>“Don't try to dodge. If they shoot, they'll hit you. All you can do is take cover.”</td></tr>
<tr><td>Weapon with <span class="tag">Soak: None</span></td><td>“Your armour is useless against this.”</td></tr>
<tr><td>First health block filled (−2)</td><td>“They've marked you. Every movement reminds you.”</td></tr>
<tr><td>Second block filled (−4)</td><td>“Forget the scratches. That last blow broke something inside. You're fighting to stay on your feet.”</td></tr>
<tr><td>Out of the fight</td><td>“Everything goes black.” And then, back to the story: who finds you?</td></tr>
<tr><td>Challenge above you on the Grid, no Key</td><td>“Yes, it's a tank. Yes, you're human. You don't roll. You run.”</td></tr>
<tr><td>A Key is possible</td><td>“That thing is invulnerable… unless you find what hurts it.”</td></tr>
<tr><td>Enemies below you (Style)</td><td>“It's not whether you take them down. It's how.”</td></tr>
<tr><td>Unnecessary roll</td><td>Say nothing about dice: “You do it.”</td></tr>
</tbody></table></div>
<p>The mode, block 2 and no-dodge weapon lines come from the verbal interface in the Complete Game. The rest are this rulebook's own. <span class="src">Approved by the author</span></p>
<p><strong>Improvising an enemy in ten seconds.</strong> Ask yourself whether it matters. If it doesn't, it's scenery: Style, and it does not hurt you. If it can hurt you, it already matters a little: give it a Grid level, one skill at +2 (everything else at +0) and as many health boxes as you want the fight to last (3 by default). If it's the villain, give it a full sheet like a player's. <span class="src">T176</span></p>
<p>NPCs roll with the same mode as the table, and make a single reaction (defence) for each attack they receive.</p>

<!-- ============================ 4 ============================ -->
<h3 id="ac-puente"><span class="hn">4</span> · Want to break the game?</h3>
<p>You now have everything you need to play in your own universe.</p>
<p>But you will have noticed the limits. Here the tone is fixed: if you start in Optimistic, you play in Optimistic all afternoon. What if you want the adventure to start as a bright fantasy and end as a nightmare? For the final boss scene to change physics mid-fight? For one particular character to live in their own tone?</p>
<p>In NOGUM you learn why each rule in this rulebook works, and with that:</p>
<ul>
<li>Seven tone cards and the panel to shift them scene by scene.</li>
<li>Fractal Health: three hits, nine boxes or twenty-seven points, with the same sheet.</li>
<li>Intent-based initiative: violence, trick or specialty.</li>
<li>The mental and spiritual damage tracks, social combat and the consequence menu.</li>
<li>The full list of skills and the catalogue of Signatures.</li>
<li>The Rules Chest, the Multiverse Bazaar and twenty recipes to emulate the most famous universes in roleplaying.</li>
</ul>
<p>Try it, tinker with it and, if you like it and it raises questions, come back. If you want to see examples of how to emulate universes with this engine, the Complete Game is waiting for you. <span class="src">T76</span> <span class="src">T135</span></p>
<aside class="meta"><p>If you've arrived here from the Complete Game: welcome back. This is driving school; over there was the engineering manual.</p></aside>

<script>(function(){
  'use strict';
  var CFG = JSON.parse(document.getElementById('cfg').textContent);
  var UI = {
    es:{contents:'Índice',search:'Buscar en el libro',ph:'Llave, Estilo, Vorpalina…',print:'Imprimir',theme:'Tema',menu:'Índice',typeset:'Maquetando páginas…',pages:'páginas',none:'Sin resultados para',meta:'Columna meta',page:'pág.'},
    en:{contents:'Contents',search:'Search the book',ph:'Key, Style, Vorpal…',print:'Print',theme:'Theme',menu:'Contents',typeset:'Typesetting pages…',pages:'pages',none:'No results for',meta:'Meta column',page:'p.'}
  };
  function $(id){ return document.getElementById(id); }
  function store(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function read(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function norm(s){ return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }

  var book = $('book'), status = $('status');
  var KEY = 'nogum-' + CFG.product;
  var lang = (location.search.match(/lang=(es|en)/) || [])[1] || read('nogum-lang') || CFG.langs[0];
  if (CFG.langs.indexOf(lang) < 0) lang = CFG.langs[0];

  /* ---------- typesetter ---------- */
  var cur, body, placed, running, stack, clones, runCap = '';
  // contenedores que se pueden repartir entre hojas. div.t7s son las siete
  // tarjetas de tono: sin estar aqui iban como un solo bloque de dos paginas
  // y la hoja recortaba en silencio lo que no cabia (T163)
  var SPLIT = 'div.tw, table, ul, ol, dl, div.rule, div.example, div.cards, div.steps, div.step, div.recipe, blockquote, section, div.acro, div.legend, div.t7s';
  var HEAD = /^(H2|H3|H4)$/;
  function isHead(el){ return el.nodeType===1 && (HEAD.test(el.tagName) || (el.matches && el.matches('.rule-title,.example-title,.step-title,.recipe-title,.card-kicker'))); }

  function newSheet(kind){
    var s = document.createElement('article');
    s.className = 'sheet' + (kind ? ' ' + kind : '');
    /* el color de capitulo viaja con la hoja: lo pinta el CSS, no el JS */
    if (runCap) s.setAttribute('data-cap', runCap);
    s.innerHTML = '<header class="rh"><span></span><span></span></header><div class="sb"></div><footer class="pf"><span class="pn"></span></footer>';
    s.firstChild.firstChild.textContent = CFG.title[lang];
    s.firstChild.lastChild.textContent = running || '';
    book.appendChild(s);
    cur = s; body = s.querySelector('.sb'); placed = 0;
    return s;
  }
  function over(){ var l = body.lastElementChild; if (!l) return false; var top = body.getBoundingClientRect().top; return l.getBoundingClientRect().bottom - top > body.clientHeight - 4 || body.scrollHeight > body.clientHeight + 1; }
  function target(){ return clones.length ? clones[clones.length-1].t : body; }
  function shallow(node, cont){
    var c = node.cloneNode(false);
    if (cont) { c.removeAttribute('id'); c.classList.add('cont'); }
    var t = c;
    if (node.tagName === 'TABLE') {
      Array.prototype.forEach.call(node.children, function(ch){ if (ch.tagName !== 'TBODY') c.appendChild(ch.cloneNode(true)); });
      t = document.createElement('tbody'); c.appendChild(t);
    }
    return {c:c, t:t};
  }
  function units(node){
    if (node.tagName === 'TABLE') {
      var rows = [], out = [];
      Array.prototype.forEach.call(node.tBodies, function(tb){ rows = rows.concat(Array.prototype.slice.call(tb.rows)); });
      for (var i=0; i<rows.length; ) {
        var span = 1;
        Array.prototype.forEach.call(rows[i].cells, function(td){ span = Math.max(span, td.rowSpan || 1); });
        out.push(rows.slice(i, i+span)); i += span;
      }
      return out;
    }
    return Array.prototype.filter.call(node.childNodes, function(n){ return n.nodeType===1 || (n.nodeType===3 && n.nodeValue.trim()); }).map(function(n){ return [n]; });
  }
  function canSplit(node){ if (node.nodeType!==1 || !node.matches(SPLIT)) return false; var u = units(node); return u.length > 1 || (u.length === 1 && u[0].length === 1 && canSplit(u[0][0])); }
  function realCount(el){ return Array.prototype.filter.call(el.childNodes, function(n){ return (n.nodeType===1 && !isHead(n) && n.tagName!=='THEAD' && n.tagName!=='CAPTION' && n.tagName!=='COLGROUP' && !(n.tagName==='TBODY' && !n.rows.length)) || (n.nodeType===3 && n.nodeValue.trim()); }).length; }

  function breakPage(){
    // carry trailing headings of the innermost target to the next page
    var t = target(), carry = [];
    while (t.lastChild && t.lastChild.nodeType===1 && isHead(t.lastChild) && realCount(t) + t.querySelectorAll(':scope > h2,:scope > h3,:scope > h4').length > 1) { carry.unshift(t.lastChild); t.removeChild(t.lastChild); }
    var old = clones.slice();
    newSheet();
    var parent = body;
    clones = old.map(function(o, i){
      var s = shallow(stack[i], true);
      parent.appendChild(s.c); parent = s.t;
      return s;
    });
    carry.forEach(function(n){ target().appendChild(n); });
    // drop empty fragments left behind, keeping their anchors
    for (var i = old.length - 1; i >= 0; i--) {
      if (realCount(old[i].t) === 0 && !old[i].t.querySelector('[id]')) {
        if (old[i].c.id) { clones[i].c.id = old[i].c.id; }
        Array.prototype.slice.call(old[i].c.childNodes).forEach(function(n){ if (isHead(n) || n.nodeType===3) clones[i].t.insertBefore(n, clones[i].t.firstChild); });
        old[i].c.remove();
      } else break;
    }
  }
  function put(node){
    var t = target();
    t.appendChild(node);
    if (!over()) { if (!isHead(node)) placed++; return; }
    t.removeChild(node);
    if (canSplit(node) && (placed > 0 || true)) { split(node); return; }
    if (placed === 0) { t.appendChild(node); placed++; return; }
    breakPage();
    target().appendChild(node);
    if (over() && canSplit(node)) { target().removeChild(node); split(node); return; }
    placed++;
  }
  function split(node){
    var s = shallow(node, false);
    target().appendChild(s.c);
    if (over()) {
      target().removeChild(s.c);
      if (placed > 0) { breakPage(); }
      target().appendChild(s.c);
    }
    stack.push(node); clones.push(s);
    var us = units(node);
    us.forEach(function(group){
      var t = target();
      group.forEach(function(n){ t.appendChild(n); });
      if (!over()) { if (!(group.length===1 && isHead(group[0]))) placed++; return; }
      group.forEach(function(n){ t.removeChild(n); });
      if (group.length===1 && canSplit(group[0])) { split(group[0]); return; }
      if (placed > 0) { breakPage(); t = target(); }
      group.forEach(function(n){ t.appendChild(n); });
      if (over() && group.length===1 && canSplit(group[0])) { group.forEach(function(n){ t.removeChild(n); }); split(group[0]); return; }
      placed++;
    });
    stack.pop(); clones.pop();
  }

  function contentsBlock(entries){
    var h = document.createElement('div');
    var h2 = document.createElement('h2'); h2.textContent = UI[lang].contents; h2.id = 'contents';
    var ol = document.createElement('ol'); ol.className = 'toc-list';
    entries.forEach(function(e){
      var li = document.createElement('li'); li.className = 'l' + e.level;
      li.innerHTML = '<a href="#' + esc(e.id) + '"><span class="t"></span><span class="d"></span><span class="n" data-for="' + esc(e.id) + '">00</span></a>';
      li.querySelector('.t').textContent = e.title;
      ol.appendChild(li);
    });
    return [h2, ol];
  }
  function cleanTitle(el){
    var c = el.cloneNode(true);
    c.querySelectorAll('.flag,.src').forEach(function(x){ x.remove(); });
    return c.textContent.replace(/\s+/g,' ').trim();
  }

  function typeset(done){
    book.style.zoom = '';
    book.innerHTML = '';
    document.documentElement.lang = lang;
    status.textContent = UI[lang].typeset;
    var tpl = document.getElementById('src-' + lang);
    var frag = tpl.content.cloneNode(true);
    var sections = Array.prototype.slice.call(frag.children).filter(function(n){ return n.tagName==='SECTION'; });
    // prep: ids on h2, numbered lists, meta labels
    var entries = [];
    sections.forEach(function(sec){
      sec.querySelectorAll('ol').forEach(function(ol){ var st = parseInt(ol.getAttribute('start') || '1', 10); Array.prototype.forEach.call(ol.children, function(li, i){ if (li.tagName==='LI' && !li.hasAttribute('value')) li.value = st + i; }); });
      sec.querySelectorAll('aside.meta').forEach(function(a){ a.setAttribute('data-label', UI[lang].meta); });
      if (sec.classList.contains('cover')) return;
      var h2 = sec.querySelector(':scope > h2');
      if (h2) {
        if (!h2.id) { h2.id = sec.id || ('s-' + entries.length); sec.setAttribute('data-cap', sec.id || h2.id); sec.removeAttribute('id'); }
        entries.push({id:h2.id, title:cleanTitle(h2), level:2});
      }
      sec.querySelectorAll('h3[id]').forEach(function(h3){ entries.push({id:h3.id, title:cleanTitle(h3), level:3}); });
    });
    stack = []; clones = []; running = ''; runCap = '';
    var queue = [];
    sections.forEach(function(sec, idx){
      // la lamina (la hoja con la imagen) va antes de la portadilla: el indice
      // va detras de la portadilla, no detras de la lamina
      if (sec.classList.contains('cover')) { queue.push({cover:sec}); if (CFG.contents && !sec.classList.contains('lamina')) queue.push({contents:true}); return; }
      if (idx === 0 && CFG.contents) queue.push({contents:true});
      queue.push({sec:sec});
    });
    var i = 0, first = true;
    function step(){
      var t0 = performance.now();
      while (i < queue.length && performance.now() - t0 < 40) {
        var q = queue[i++];
        if (q.cover) {
          running = ''; runCap = ''; newSheet('cover');
          Array.prototype.slice.call(q.cover.childNodes).forEach(function(n){ body.appendChild(n); });
          if (q.cover.id) body.firstElementChild && (body.firstElementChild.id = body.firstElementChild.id || q.cover.id);
          first = false; cur = null;
        } else if (q.contents) {
          running = UI[lang].contents; newSheet();
          contentsBlock(entries).forEach(put);
          cur = null;
        } else {
          var h2 = q.sec.querySelector(':scope > h2');
          running = h2 ? cleanTitle(h2) : running;
          var capId = q.sec.getAttribute('data-cap') || q.sec.id;
          if (capId) { runCap = capId; if (cur) cur.setAttribute('data-cap', runCap); }
          if (!cur || CFG.chapterBreak || first) newSheet();
          else if (placed > 0) { /* continue on same sheet */ }
          Array.prototype.slice.call(q.sec.childNodes).forEach(function(n){
            if (n.nodeType===3 && !n.nodeValue.trim()) return;
            if (n.nodeType===1 && n.tagName==='H2' && placed > 0) {
              // keep a heading with at least some content: start a new sheet if little room is left
              if (body.clientHeight - body.scrollHeight < 120) { running = cleanTitle(n); breakPage(); }
            }
            if (n.nodeType===1 && n.tagName==='H2') { running = cleanTitle(n); cur.firstChild.lastChild.textContent = running; }
            put(n);
          });
          first = false;
        }
      }
      if (i < queue.length) { status.textContent = UI[lang].typeset + ' ' + book.children.length; setTimeout(step, 0); return; }
      finish(entries); if (done) done();
    }
    step();
  }

  /* ---------- after layout ---------- */
  var sheetInfo = [];
  function finish(entries){
    var sheets = Array.prototype.slice.call(book.querySelectorAll('.sheet'));
    sheets.forEach(function(s, k){ s.querySelector('.pn').textContent = String(k + 1); s.setAttribute('data-page', k + 1); });
    var pageOf = {};
    entries.forEach(function(e){ var el = document.getElementById(e.id); if (el) { var s = el.closest('.sheet'); pageOf[e.id] = s ? +s.getAttribute('data-page') : 0; } });
    book.querySelectorAll('.toc-list .n').forEach(function(n){ n.textContent = pageOf[n.getAttribute('data-for')] || '–'; });
    // side contents
    var ul = $('stoc'); ul.innerHTML = '';
    entries.forEach(function(e){
      var li = document.createElement('li'); li.className = 'l' + e.level;
      li.innerHTML = '<a href="#' + esc(e.id) + '"><span></span><span class="n">' + (pageOf[e.id] || '') + '</span></a>';
      li.querySelector('span').textContent = e.title;
      ul.appendChild(li);
    });
    sheetInfo = sheets.map(function(s){ return {page:+s.getAttribute('data-page'), text:s.querySelector('.sb').textContent.replace(/\s+/g,' ')}; });
    status.textContent = sheets.length + ' ' + UI[lang].pages + ' · A4';
    fit();
    labels();
    trackActive(entries, pageOf);
  }
  function fit(){
    book.style.zoom = '';
    var avail = document.querySelector('main').clientWidth - 32;
    var w = book.getBoundingClientRect().width || 794;
    var z = Math.min(1, avail / w);
    book.style.zoom = z < 1 ? String(z) : '';
  }
  var fitT; window.addEventListener('resize', function(){ clearTimeout(fitT); fitT = setTimeout(fit, 120); });

  var activeHandler;
  function trackActive(entries, pageOf){
    var links = Array.prototype.slice.call(document.querySelectorAll('#stoc a'));
    if (activeHandler) window.removeEventListener('scroll', activeHandler);
    var ticking = false;
    activeHandler = function(){
      if (ticking) return; ticking = true;
      requestAnimationFrame(function(){
        ticking = false;
        var best = null, bestY = -Infinity;
        entries.forEach(function(e, k){
          var el = document.getElementById(e.id); if (!el) return;
          var y = el.getBoundingClientRect().top;
          if (y < 140 && y > bestY) { bestY = y; best = k; }
        });
        links.forEach(function(a, k){ a.classList.toggle('active', k === best); });
        if (best !== null) {
          var a = links[best], side = $('side'), r = a.getBoundingClientRect(), sr = side.getBoundingClientRect();
          if (r.top < sr.top + 60 || r.bottom > sr.bottom - 20) side.scrollTop += r.top - sr.top - 120;
          store(KEY + '-at', entries[best].id);
        }
      });
    };
    window.addEventListener('scroll', activeHandler, {passive:true});
    activeHandler();
  }

  /* ---------- search ---------- */
  var q = $('q'), res = $('results'), stoc = $('stoc');
  q.addEventListener('input', function(){
    var term = q.value.trim();
    if (term.length < 2) { res.hidden = true; stoc.hidden = false; return; }
    var nt = norm(term), out = [];
    sheetInfo.forEach(function(s){
      var nx = norm(s.text), p = nx.indexOf(nt); if (p < 0) return;
      var from = Math.max(0, p - 45), snip = s.text.substr(from, term.length + 100), k = norm(snip).indexOf(nt);
      out.push('<li><a href="#" data-page="' + s.page + '"><span class="rv">' + UI[lang].page + ' ' + s.page + '</span><span class="rs">' + (from ? '…' : '') + esc(snip.slice(0,k)) + '<mark>' + esc(snip.substr(k, term.length)) + '</mark>' + esc(snip.slice(k + term.length)) + '…</span></a></li>');
    });
    res.innerHTML = out.length ? out.slice(0, 60).join('') : '<li><span class="rs">' + UI[lang].none + ' «' + esc(term) + '»</span></li>';
    res.hidden = false; stoc.hidden = true;
  });
  res.addEventListener('click', function(e){
    var a = e.target.closest('a[data-page]'); if (!a) return; e.preventDefault();
    var s = book.querySelector('.sheet[data-page="' + a.getAttribute('data-page') + '"]');
    if (s) s.scrollIntoView({block:'start'});
    closeMenu();
  });

  /* ---------- chrome ---------- */
  function labels(){
    var u = UI[lang];
    $('qLabel').textContent = u.search; q.placeholder = u.ph;
    $('printBtn').textContent = u.print; $('themeBtn').textContent = u.theme; $('menuBtn').textContent = u.menu;
    document.querySelectorAll('[data-i18n-es]').forEach(function(el){ el.textContent = el.getAttribute('data-i18n-' + lang); });
    document.querySelectorAll('.lang button').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false'); });
    document.title = CFG.title[lang];
  }
  function closeMenu(){ document.body.classList.remove('nav-open'); $('menuBtn').setAttribute('aria-expanded','false'); }
  document.addEventListener('click', function(e){
    var j = e.target.closest('.joke');
    if (j) { var list = j.getAttribute('data-jokes').split('|'); var i = (list.indexOf(j.textContent.replace(/^\(|\)$/g,'')) + 1) % list.length; j.textContent = '(' + list[i] + ')'; return; }
    var a = e.target.closest('#stoc a, .toc-list a');
    if (a) { e.preventDefault(); var el = document.getElementById(a.getAttribute('href').slice(1)); if (el) el.scrollIntoView({block:'start'}); closeMenu(); }
  });
  $('menuBtn').addEventListener('click', function(){ var o = document.body.classList.toggle('nav-open'); this.setAttribute('aria-expanded', o ? 'true' : 'false'); });
  $('printBtn').addEventListener('click', function(){ window.print(); });
  var root = document.documentElement, th = read('nogum-theme'); if (th) root.setAttribute('data-theme', th);
  $('themeBtn').addEventListener('click', function(){
    var c = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var n = c === 'dark' ? 'light' : 'dark'; root.setAttribute('data-theme', n); store('nogum-theme', n);
  });
  document.querySelectorAll('.lang button').forEach(function(b){
    if (CFG.langs.indexOf(b.getAttribute('data-lang')) < 0) b.parentNode.hidden = true;
    b.addEventListener('click', function(){
      var l = b.getAttribute('data-lang'); if (l === lang) return;
      var at = read(KEY + '-at');
      lang = l; store('nogum-lang', l);
      typeset(function(){ var el = at && document.getElementById(at); if (el) el.scrollIntoView({block:'start'}); });
    });
  });
  window.addEventListener('beforeprint', function(){ book.dataset.z = book.style.zoom; book.style.zoom = ''; });
  window.addEventListener('afterprint', function(){ book.style.zoom = book.dataset.z || ''; });

  /* ---------- start ---------- */
  labels();
  var started = false;
  function start(){
    if (started) return; started = true;
    typeset(function(){
      var id = location.hash.slice(1) || read(KEY + '-at');
      var el = id && document.getElementById(id);
      if (el) el.scrollIntoView({block:'start'});
    });
  }
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(start); setTimeout(start, 2500); } else start();
})();
</script>
