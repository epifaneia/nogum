<section class="chapter" id="acelerado">
<h2>NOGUM Accelerated · Immediate Immersion Protocol</h2>
<p><em>Play now. Ask yourself why it works later.</em></p>

<aside class="meta"><p>This is a complete game, not a summary. It is also a giant advert: at the end of each rule you will find a question. If one of them gets under your skin, the Complete Game is waiting for you. If not, just play.</p></aside>

<!-- ============================ 0 ============================ -->
<h3 id="ac-arranque"><span class="hn">0</span> · Start-up</h3>
<h4>0.1 The promise</h4>
<p>You will be playing in ten minutes, without reading two hundred pages. There is no theory and no explanation here: only rules that work. With them you can play in your favourite universe, whichever it is.</p>
<h4>0.2 What you need</h4>
<ul>
<li><strong>Two ten-sided dice of different colours: one red and one blue.</strong> One pair per player, or one pair for the whole table.</li>
<li>One character sheet per player (<a href="#ac-ficha">at the end of this rulebook</a>, with the modes cheat sheet behind it).</li>
<li>A Game Master (GM) who has read these pages. The players do not need to read them.</li>
<li>Friends who want to tell a story together.</li>
</ul>
<h4>0.3 The black box</h4>
<p>The players do not need to know the rules. The deal is simple:</p>
<blockquote><p>You declare your action and roll. I tell you what happens.</p></blockquote>
<p>The GM translates the numbers into story. Nobody at the table has to hear the word “modifier” if they don't want to.</p>
<aside class="meta"><p>Does it feel like the GM gets a lot of the work? They do. It's a feature, not a bug.</p></aside>

<h4 id="ac-sesion0">0.4 Before playing: session zero</h4>
<p>Five minutes before the first game, or a whole afternoon: the table talks before playing. It is the one thing in this rulebook you do not skip.</p>
<ul>
<li><strong>Everyone’s red lines.</strong> Nothing is imposed that could make someone genuinely feel bad: explicit sex or violence, a phobia, an oppressive atmosphere, or something as harmless-looking as tedium. One person saying it is enough, and it can be said privately to the GM. Whatever shows up mid-game is removed without asking permission.</li>
<li><strong>What we are going to feel.</strong> Which emotions are explored, what bores you, which areas of the plot are respected and what solutions the genre asks for.</li>
<li><strong>Who proposes.</strong> Consensus, always counting on whoever does the hard work: the GM.</li>
<li><strong>“That doesn’t count.”</strong> There are no firewalls against the cheap combo, the one that abuses the rules: there is a table that remembers what it agreed.</li>
<li><strong>And from that, the numbers:</strong> the mode (<a href="#ac-selector">1</a>), the world and how far a character can grow in it, and what you start with (<a href="#ac-reglas">2</a>).</li>
</ul>
<p>The rules work for you. Ignore them when they stop you from doing something the plot asks for.</p>

<!-- ============================ 1 ============================ -->
<h3 id="ac-selector"><span class="hn">1</span> · Mission selector</h3>
<p>Before starting, the GM answers two sets of questions about the universe they are going to play. Don't ask “which game are we playing?”. Ask “how does this world feel?”.</p>

<h4>1.1 How much optimism is there in your world?</h4>
<div class="tw"><table class="t">
<thead><tr><th>Question</th><th>Little</th><th>Normal</th><th>A lot</th></tr></thead>
<tbody>
<tr><td>Does the universe have favourites?</td><td>Yes: the monsters</td><td>No: nobody</td><td>Yes: us</td></tr>
<tr><td>When a plan goes wrong, why?</td><td>Because the enemy is competent and cruel</td><td>Because sometimes things go wrong</td><td>It hardly ever goes wrong; and if it does, there's a vine to swing from</td></tr>
<tr><td>How do these stories end?</td><td>Surviving is already winning</td><td>It depends on what you do</td><td>The heroes win</td></tr>
</tbody></table></div>
<p>Go with the answer that comes up most often. If none repeats (little, normal, a lot), the first question decides.</p>

<h4>1.2 How much chaos is there in your world?</h4>
<div class="tw"><table class="t">
<thead><tr><th>Question</th><th>Little</th><th>Normal</th><th>A lot</th></tr></thead>
<tbody>
<tr><td>Is physics reliable?</td><td>It's clockwork</td><td>It's a film</td><td>It's madness</td></tr>
<tr><td>What happens when someone does it right?</td><td>It works, always</td><td>It works, almost always</td><td>It may work… at a price</td></tr>
<tr><td>Are there absurd surprises?</td><td>Never</td><td>Some</td><td>Constantly</td></tr>
</tbody></table></div>
<p>Go with the answer that comes up most often. If none repeats, the first question decides.</p>

<h4>1.3 Your game mode</h4>
<p>Cross your two answers on the table:</p>
<div class="tw"><table class="t">
<thead><tr><th>Optimism \ Chaos</th><th>Little</th><th>Normal</th><th>A lot</th></tr></thead>
<tbody>
<tr><td><strong>A lot</strong></td><td>Optimistic</td><td>Optimistic</td><td>Optimistic</td></tr>
<tr><td><strong>Normal</strong></td><td>Neutral</td><td>Neutral</td><td>Chaos</td></tr>
<tr><td><strong>Little</strong></td><td>Terror</td><td>Terror</td><td>Terror</td></tr>
</tbody></table></div>
<p>Optimism picks the mode and chaos decides one box. There are four, and each changes one thing and one thing only:</p>
<ul>
<li><strong>Optimistic</strong> changes <em>the die</em>: you roll two and keep the higher.</li>
<li><strong>Neutral</strong> changes nothing. It is the reference.</li>
<li><strong>Chaos</strong> changes <em>what the result is made of</em>: same die, wider bands and successes that charge a toll.</li>
<li><strong>Terror</strong> changes <em>what you can take</em>: the same die as Neutral, but three health boxes instead of nine. That is where its oppressiveness comes from.</li>
</ul>
<p>Look hard at the third one, because it is the strangest and the most important thing in this book: <strong>Chaos and Neutral bring exactly the same number of rolls home</strong>, 50&nbsp;% with the sheet at zero and 70&nbsp;% with the sheet at +2. They are identical up to +3; at +4 they drift slightly apart, because in Chaos a 2 on the red is still a fumble: 80&nbsp;% against 90&nbsp;%. Chaos does not make you fail more. It changes what happens to you is made of: where Neutral deals clean successes and clean failures, Chaos deals fumbles, criticals and wins that come with an invoice.</p>
<p>And the fourth is the other way to hurt. <strong>In Terror the oppression is not in the dice: it is in how fragile you are.</strong> You roll as in Neutral and you hit just as often. What changes is that two serious hits put you out of the fight. The Complete Game calls that <em>fractal health</em> and leaves it in your hands; here it comes preset, so you can watch it work without having to decide anything.</p>

<aside class="meta"><p>Missing a tone? A world that is Swiss clockwork and cruel at the same time? A game of Russian roulette where a 9 is already a miracle? Dark <em>and</em> chaotic at once? These four cover roughly everything and are enough to start with. And they are not a separate invention: three are cards from the Complete Game —Optimistic is Epic, Neutral is First Gear and Chaos is Black Comedy—, and Terror is First Gear with the short health track, a peek at a rule you turn yourself over there. The Complete Game also has truly oppressive dice, so extreme that they have no place in a simplification: Terror is horror for all audiences. By the time these feel small, you already know three of the seven cards.</p></aside>

<!-- ============================ 2 ============================ -->
<h3 id="ac-reglas"><span class="hn">2</span> · Universal rules</h3>

<h4>2.1 The single roll</h4>
<p>Always roll both dice, the red one and the blue one. What changes is how you read them:</p>
<div class="tw"><table class="t">
<thead><tr><th>Mode</th><th>Which die counts</th><th>Fumble</th><th>Critical</th><th>Result</th></tr></thead>
<tbody>
<tr><td><strong>Optimistic</strong></td><td>The <strong>higher</strong> of the two</td><td>Double 1</td><td>A 10 on either</td><td>Total 6 or more: success</td></tr>
<tr><td><strong>Neutral</strong></td><td><strong>Only the red one</strong> (the blue one doesn't count)</td><td>1 on the red</td><td>10 on the red</td><td>Total 6 or more: success</td></tr>
<tr><td><strong>Chaos</strong></td><td><strong>Only the red one</strong> (the blue one doesn't count)</td><td>1 <strong>or 2</strong> on the red</td><td>9 <strong>or 10</strong> on the red</td><td>Total 5 or less: failure · 6 or 7: <strong>success at a cost</strong> · 8 or more: success</td></tr>
<tr><td><strong>Terror</strong></td><td><strong>Only the red one</strong> (the blue one doesn't count)</td><td>1 on the red</td><td>10 on the red</td><td>Total 6 or more: success · <strong>and only 3 health boxes</strong> (2.7)</td></tr>
</tbody></table></div>
<div class="rule"><p class="rule-title">How to roll</p>
<ol>
<li>Read the die the mode tells you to.</li>
<li>Add your bonus (2.2). That is the <strong>total</strong>.</li>
<li>Compare it with <strong>TN 6</strong>. Always the same one.</li>
<li><strong>Fumbles</strong> and <strong>criticals</strong> are read on the dice, before adding anything. A fumble is a disaster and a critical, something extraordinary, whatever your bonus.</li>
</ol>
</div>
<p><strong>Success at a cost (Chaos only).</strong> You pull it off, but you pay a price. The GM picks one:</p>
<ul>
<li><strong>Time</strong>: you manage it, but late; the guards are already in the corridor.</li>
<li><strong>Resource</strong>: you manage it, but something breaks; the bat splinters.</li>
<li><strong>Position</strong>: you manage it, but you are left exposed; you fall flat on your back on the other side of the wall.</li>
<li><strong>Friendly fire</strong>: you manage it, but someone else gets caught in it; the explosion takes out the only radio.</li>
</ul>
<p>Better not “you pull it off, but you lose a health box”. That is laziness.</p>

<aside class="meta"><p>Same character (+2), same task. In <strong>Optimistic</strong> they pull it off 91&nbsp;% of the time. In <strong>Neutral</strong>, 70&nbsp;%. In <strong>Chaos</strong>, also 70&nbsp;% —you read that right, the same number— but two out of every seven of those times paying a price, and with twice the fumbles and twice the criticals. In <strong>Terror</strong>, 70&nbsp;% again: what changes is that two hits now put them out. You have not touched the sheet once: you have changed the atmosphere three times in three different ways.</p></aside>

<h4>2.2 Bonuses</h4>
<p>Your bonus comes from your sheet and from the situation. Your sheet only gives five possible values:</p>
<div class="tw"><table class="t">
<thead><tr><th>Bonus</th><th>Who you are at this</th></tr></thead>
<tbody>
<tr><td class="num">−2</td><td><strong>Null.</strong> You haven't put a single point into that whole Sphere.</td></tr>
<tr><td class="num">−1</td><td><strong>Clumsy.</strong> You have the Sphere, but that column is empty: you are on the wrong foot.</td></tr>
<tr><td class="num">+1</td><td><strong>I get by.</strong> You have a broad skill that covers it.</td></tr>
<tr><td class="num">+2</td><td><strong>It's my job.</strong> You have a specific skill that covers it.</td></tr>
<tr><td class="num">+4</td><td><strong>Grand Master.</strong> Nobody does it better.</td></tr>
</tbody></table></div>
<p><strong>Difficulty.</strong> If the task is easy, +2. If it is hard, −2. If it is heroic, −4. Normal is 0. Difficulty is added to the bonus; the TN does not move.</p>
<p><strong>Limits.</strong> Add up skill, difficulty and any other modifier: stack whatever can be stacked, at the table's discretion. If the total goes above +4, you roll with +4, and you can use the surplus to attempt something harder with a bigger reward. If it drops below −2, the GM decides whether there is a right to roll; if there is, you roll at −2. The bonus you roll with stays between −2 and +4.</p>
<p><strong>Don't roll for the sake of it.</strong> Roll only if every possible result is interesting. If failing adds nothing, it just happens. What the story cannot do without —the clue without which there is no adventure— is not rolled for: it is found. What you roll for is how much you get and at what price.</p>

<h4>2.3 Skills</h4>
<p>Every character has <strong>five Spheres</strong>: <strong>Physical</strong>, <strong>Mental</strong>, <strong>Social</strong>, <strong>Technical</strong> and <strong>Arcane</strong> (magic, psychic powers, the supernatural; if your world doesn't have them, ignore it). Spheres are not skills: they are the drawers you keep them in.</p>
<p>Each Sphere splits into two <strong>broad skills</strong>, and each of those into four <strong>specific skills</strong>. The list is closed:</p>
<div class="tw"><table class="t">
<thead><tr><th>Sphere</th><th>Broad skill (column)</th><th>Specific skills</th></tr></thead>
<tbody>
<tr><td rowspan="2"><strong>Physical</strong></td><td>Dexterity</td><td>Athletics · Acrobatics · Stealth · Sleight of Hand</td></tr>
<tr><td>Vigour</td><td>Might · Fortitude · Brawling · Weapons</td></tr>
<tr><td rowspan="2"><strong>Mental</strong></td><td>Erudition</td><td>Sciences · Humanities · Occultism · Current Affairs</td></tr>
<tr><td>Wits</td><td>Investigation · Alertness · Tactics · Survival</td></tr>
<tr><td rowspan="2"><strong>Social</strong></td><td>Influence</td><td>Persuasion · Deception · Empathy · Seduction</td></tr>
<tr><td>Hierarchy</td><td>Leadership · Intimidation · Contacts · Resources</td></tr>
<tr><td rowspan="2"><strong>Technical</strong></td><td>Artifice</td><td>Mechanics · Electronics · Biotech · Crafting</td></tr>
<tr><td>Operations</td><td>Driving · Flight · Systems · Security</td></tr>
<tr><td rowspan="2"><strong>Arcane</strong></td><td>Gift</td><td>Projection · Alteration · Divination · Protection</td></tr>
<tr><td>Ritual</td><td>Alchemy · Summoning · Enchantment · Bonds</td></tr>
</tbody></table></div>
<p>You have <strong>12 points</strong>. If any player at the table puts something into Arcane, <strong>everyone</strong> gets <strong>14</strong>, including whoever doesn't touch it: Arcane adds ten skills to everyone's sheet, and nobody gets more points for having magic. If your world has magic but it is out of the players' reach, it stays at 12. Each step costs one point —except the Signature, which costs two— and to raise a step you must have paid for the previous one:</p>
<div class="tw"><table class="t">
<thead><tr><th>Step</th><th>What it is</th><th>Examples</th><th>Cost</th><th>Cumulative points</th><th>Bonus</th></tr></thead>
<tbody>
<tr><td>Broad skill</td><td>Half of a Sphere</td><td>Dexterity, Vigour, Erudition, Wits, Influence</td><td class="num">1</td><td class="num">1</td><td class="num">+1</td></tr>
<tr><td>Specific skill</td><td>A trade within the broad skill</td><td>Vigour → Weapons · Erudition → Sciences · Influence → Deception</td><td class="num">1</td><td class="num">2</td><td class="num">+2</td></tr>
<tr><td>Signature (Grand Master)</td><td>Your speciality within the trade</td><td>Weapons → Firearms · Sciences → Chemistry · Acrobatics → Parkour</td><td class="num">2</td><td class="num">4</td><td class="num">+4</td></tr>
</tbody></table></div>
<ul>
<li>When you roll, use <strong>only the highest step that fits</strong>. Steps don't add up.</li>
<li>A <strong>column</strong> is each of the two broad skills of a Sphere, with its specific skills underneath: in Physical, Dexterity is one column and Vigour the other.</li>
<li>If you have spent nothing in a Sphere, everything in it is rolled at −2 (Null). As soon as you buy anything in it, the column you have touched gives its bonuses as normal, and anything that falls in <strong>the other column</strong> is rolled at −1 (Clumsy).</li>
<li>To be a Grand Master at something, you must be able to explain <strong>exactly</strong> what you do. “Firearms”, yes. “Being good”, no.</li>
<li>In addition, every character has <strong>Style +2</strong>, a gift that sits outside the Spheres (2.8).</li>
</ul>
<aside class="meta"><p>Not sure which skill to pick? Torn between “Piloting” and “Evasive driving”? NOGUM has a closed list of 10 broad skills and 40 specific ones, plus a catalogue of Signatures sorted so you only look at your branch. NOGUM has your back.</p></aside>

<h4>2.4 The Grid: how big your feats are</h4>
<p>The bonus says <strong>how well</strong> you do something. The Grid says <strong>at what scale</strong> you do it. Each character has one level per Sphere. Ask yourself: if this gets out of hand, what makes the news?</p>
<div class="tw"><table class="t">
<thead><tr><th>Level</th><th>Scale</th><th>Examples</th></tr></thead>
<tbody>
<tr><td class="num">1</td><td>One person</td><td>Any human, however expert: the boxer, the chemistry teacher, the hacker.</td></tr>
<tr><td class="num">2</td><td>A room, hundreds of people</td><td>An exceptional human or something that no longer is one, only if your universe allows it: the barbarian of the steppe, the serum soldier, the vampire's presence. A rank-and-file soldier stands no chance against them.</td></tr>
<tr><td class="num">3</td><td>A building, a neighbourhood</td><td>Bringing down a castle, cutting the power grid of a skyscraper.</td></tr>
<tr><td class="num">4</td><td>A big city</td><td>A mystic shield over the city, a monster razing districts.</td></tr>
<tr><td class="num">5</td><td>A country</td><td>Changing the geography. Only for campaign finales.</td></tr>
<tr><td class="num">6</td><td>A planet, the cosmic</td><td>Almost always unplayable: most universes don't have it, and what is there is touched with Keys.</td></tr>
</tbody></table></div>
<p>If numbers mean something in your world, as in the ones that emulate the real one, each level multiplies your <strong>reach</strong> by a hundred: ×1 one person, ×100 a room, ×10,000 a building, ×1,000,000 a city, ×100,000,000 a country. When someone has a level on you they are not better than you: they are playing with two more zeros, and that is why you have no right to roll. In a world of comics or legend the story rules: whoever is above is what the story is about, and you set the scale, or none at all.</p>
<p>If you don't know which level to give, <strong>humans are level 1 in everything</strong>. What is measured is scale, not intelligence or muscle: a brilliant chemist is still level 1. And if a jump of level sounds like a comic, that is because it is one.</p>
<div class="rule"><p class="rule-title">Five ideas that settle almost everything</p>
<ol>
<li><strong>The Grid is scale, not skill:</strong> being big across a whole Sphere. The vampire’s presence is a Social 2: she walks into the room and the whole room is spellbound. What is huge at a single thing is a Key: the sirens, with their song; the rock star, a 1 with Keys. The realistic human is 1 in everything, and that is why ones are everywhere.</li>
<li><strong>If something grants a permit, cancels a defence or reaches a Grid level above, it is a Key.</strong> Wherever it comes from.</li>
<li><strong>The Reaper is a Key to damage:</strong> it reaches whoever stands above you. That is why it costs Keys, even though damage on its own is free.</li>
<li><strong>What is lent or stolen lasts one scene,</strong> whoever uses it. Passing it around resets nothing.</li>
<li><strong>What a Key does is what the Key says:</strong> it puts you one or more levels above, and cancels what it says it cancels, nothing more. A bazooka is a Key to damage: it blows you apart if it hits, but it has to hit.</li>
</ol>
<p>The hard cases, solved one by one, are in the Key chapter of the Complete Game.</p></div>
<div class="rule"><p class="rule-title">The power gap</p>
<p>It works for everyone: players and adversaries alike. Compare the Grid level of whoever acts with the level of whatever they act against, in the Sphere of the action. An NPC or a monster has a single level for everything, unless the GM says otherwise.</p>
<ul>
<li><strong>If you are at the same level</strong>, roll as normal: attack, defence, everything.</li>
<li><strong>If you are above</strong> (even by one level), you don't roll to succeed: you succeed. If it matters how, roll Style (+2, 2.8). That also goes for a monster attacking characters below it: there is no roll, neither to hit nor to save yourself, and the defeat is narrated.</li>
<li><strong>If you are below</strong>, you cannot affect what is above you —not even a scratch— without a <strong>Key</strong>. That includes defending yourself: against an attack that comes from above there is no defence roll, unless you have a Key that applies. With a Key you roll everything as normal, with your full bonus: nobody is protected twice.</li>
</ul>
</div>
<p><strong>The Key.</strong> A Key is a narrative reason that lets you affect something of a higher level: a bazooka, the stone from his own world, a stolen admin password, a video of the bribe, twenty mercenaries firing at once. It puts you <strong>one Grid level above</strong> your own (or several, paying more), and in that roll you act at that level: if you are a 1 and the Key puts you at 2, whoever is at level 1 has no right to roll; against a 2, you roll as normal, with your full bonus. The one the fiction gives you covers whatever the fiction says and lasts one scene; your own, the one you buy, covers <strong>a whole specific skill, against any target</strong> (below). Getting one is often an adventure in itself.</p>
<div class="rule"><p class="rule-title">Keys are bought</p>
<ul>
<li>At creation, the <strong>separate pot</strong> gives you <strong>5 Keys</strong>, or <strong>+1 Grid level</strong> in one Sphere. With the +1, the sheet starts at <strong>1·1·1·1·2</strong>, the recommended starting point: a 2 in one Sphere and 1 in the other four. That 2 can only go where the universe allows it: in a realistic or horror world, players stay at 1 in everything, and the pot is 5 Keys; if there are superhumans, the 2 goes where they are. There are three ceilings, and it pays not to mix them up: the <strong>starting maximum</strong>, what a sheet starts with (by default, that 2); the <strong>player maximum</strong>, the highest a player can ever have across a whole Sphere, however long the campaign lasts; and the <strong>world maximum</strong>, the highest thing that exists in it (in cosmic horror there are vast creatures, and you cannot be one). All three are about the Grid: Keys are better left without a ceiling. The table confirms it at session zero. The pot does not trade for skill points: everyone turns up with a trade.</li>
<li>All of this is a starting point, not a limit: the table can start higher or lower, depending on what it wants to emulate. Whatever it hands out above or below that before play, in points or in Keys, is the <strong>starting experience</strong>. It is designed with a world like cyberpunk in mind; one with zombies or cosmic horror usually calls for less.</li>
<li>Each Key of your own is <strong>a whole specific skill, against any target, for ever</strong>: with “Weapons”, everything you do with weapons goes up a level, your Signature included, since it sits inside. If it only works against one thing (“Weapons against vampires”), it is a <strong>Limited</strong> Key, cheaper from two levels up; at one level it costs the same, so it is better not to limit it. You can keep it blank and write it in the first time you use it, as the pregenerated characters do; if someone abuses that, the table reins them in.</li>
<li>Grid and Keys trade: one Grid level in a Sphere is worth <strong>5 Keys</strong>, its eight specific skills for the price of five. If the story raises the table’s Grid and you would rather not rise, you take what it is worth in Keys (5 for one extra level, 20 for two) and <strong>spend them wherever you like</strong>.</li>
<li>One Key puts you <strong>one Grid level above</strong>. To climb further in the same skill, the count is squared: rising <em>n</em> levels costs <em>n</em>² Keys in total (1, 4, 9). With five in the pot, you can climb two levels in one skill (4 Keys), with one left over.</li>
<li>During the campaign the GM hands out <strong>one Key per player per session</strong>. That tap is the game’s power dial: Keys also buy permits (what no skill can do, such as flying or seeing through walls: 1 Key, by rule of thumb) and levels above (idea 2). A spell is one of those permits: your skill says how well you cast it and the Grid how big, but what you can do is paid for in Keys. Equipment, here, only asks for money (2.9).</li>
<li>And what the GM gives you for a good idea —“it occurs to you to use the holy water”— is a <strong>borrowed Key</strong>: it raises whatever the fiction says, lasts one scene and costs nothing; it goes on the sheet in pencil and is rubbed out when the scene ends.</li>
</ul></div>
<aside class="meta"><p>Why can the vigilante millionaire stand up to the alien in tights and trunks with the same bonus as a nightclub bouncer? Because of the Key. The Complete Game has a whole chapter bringing the Grid down to earth, with pop-culture examples in all five Spheres. NOGUM is waiting for you.</p></aside>

<h4>2.5 Initiative</h4>
<p>When combat starts, each participant rolls with the active mode and adds their <strong>best Dexterity bonus</strong> (the broad skill or any of their specific skills under it). Act from highest to lowest total. On a tie, the GM decides.</p>
<aside class="meta"><p>If your character is going to spend their turn deducing a clue, hacking a terminal or intimidating the rival boss… does it make sense for their physical speed to decide the order? Want an initiative where you first choose your intent (violence, trick or speciality) and then how you carry it out? NOGUM is waiting for you.</p></aside>

<h4>2.6 Combat</h4>
<p>Combat is an aggressive negotiation. Each attack is resolved in two steps.</p>
<div class="rule"><p class="rule-title">Step 1 · Impact (the attacker rolls)</p>
<p>Roll your attack skill against TN 6. The defender's circumstances (cover, fog, size) change the difficulty. The defender's skills don't count here.</p>
<ul>
<li><strong>Fumble</strong>: you don't connect and something goes wrong (you disarm yourself, hit an ally…).</li>
<li><strong>Failure</strong>: the blow goes astray.</li>
<li><strong>Success</strong>: you connect. The weapon's damage is in the air.</li>
<li><strong>Critical</strong>: you hit a vital spot: <strong>+1 damage</strong>.</li>
</ul>
</div>
<div class="rule"><p class="rule-title">Step 2 · Mitigation (the defender rolls)</p>
<p>If the weapon allows it (check its tags), the defender makes <strong>a single reaction</strong>: dodge (Dexterity → Acrobatics) or soak (Vigour → Fortitude), depending on which route the weapon leaves open.</p>
<p><strong>The defender wins ties.</strong> You both roll against the same TN and compare the <strong>result level</strong>: fumble &lt; failure &lt; success at a cost (Chaos only) &lt; success &lt; critical.</p>
<ul>
<li><strong>The defender matches or beats</strong> the attacker’s result level: no damage.</li>
<li><strong>The attacker ends up above</strong> and the defender got a success or a success at a cost: weapon damage −1.</li>
<li><strong>The defender fails</strong>: takes all the damage.</li>
<li><strong>The defender fumbles</strong>: takes all the damage, <strong>+1</strong>; if the attack was also a critical, +2 in total.</li>
</ul>
</div>
<p><strong>Final damage</strong> = weapon damage (+1 for the attacker's critical, +1 for the defender's fumble) − the defender's reduction, within the limits set by the tags.</p>
<p><strong>Hazards with no attacker</strong> (falls, fire, the environment): they count as a successful attack of their level; if they are extreme, as a critical; the huge ones carry the Reaper with their level.</p>
<p><strong>Tags override the tie.</strong> With <span class="tag">Dodge: Partial</span> you eat at least 1 even when you match it, and with <span class="tag">Dodge: None</span> there is no dodge to roll: if the weapon allows soaking, you still have that.</p>
<p><strong>In Chaos</strong>, a success at a cost in combat connects or defends like a success, but in the comparison it counts as one result level lower, and the GM adds a cost from the menu (the attack connects, but you lose your weapon; you dodge, but you hit the floor).</p>

<p><strong>Weapons.</strong> Every weapon, power or hazard is described with three tags:</p>
<div class="tw"><table class="t">
<thead><tr><th>Tag</th><th>Values</th><th>What it means</th></tr></thead>
<tbody>
<tr><td><span class="tag">Damage 1</span></td><td>Light</td><td>Fists, knives, light pistols, short falls. “A&amp;E”.</td></tr>
<tr><td><span class="tag">Damage 2</span></td><td>Serious</td><td>War swords, magnums, claws. “ICU”.</td></tr>
<tr><td><span class="tag parca">The Reaper</span></td><td>Not a damage value</td><td>Artillery, military explosives, a car at full speed. It is a Key to damage. It carries a Grid level, compared against the target’s Physical. If it reaches you and you are below it, you are put out of the fight, with no right to roll: no soak helps. Whether it can be dodged is what its <span class="tag">Dodge</span> tag says: the sniper you cannot see (<span class="tag">Dodge: None</span>) cannot be dodged —it is avoided, by not being there—; a grenade, because of its area, can barely be dodged: −2. At its level it does Damage 2 and you defend as normal, with its tags. Above it, nothing without a Key.</td></tr>
<tr><td><span class="tag">Dodge: Full</span></td><td>Free dodge</td><td>Melee, arrows, slow projectiles. Dodging can bring you down to 0.</td></tr>
<tr><td><span class="tag">Dodge: Partial</span></td><td>Limited dodge</td><td>Area, bursts, fire. Even if you dodge, you take at least 1.</td></tr>
<tr><td><span class="tag">Dodge: None</span></td><td>No dodge</td><td>Instantaneous, mental, surprise shots. And firearms, at level 1: a bullet cannot be dodged.</td></tr>
<tr><td><span class="tag">Dodge: Hard</span> / <span class="tag">Dodge: Easy</span></td><td>Modifier</td><td>−2 / +2 to the dodge roll.</td></tr>
<tr><td><span class="tag">Soak: Full</span></td><td>Free soak</td><td>Protection works: soaking can bring you down to 0.</td></tr>
<tr><td><span class="tag">Soak: Max 1</span></td><td>Limited soak</td><td>Hammers, piercing weapons: reduced by 1 at most.</td></tr>
<tr><td><span class="tag">Soak: None</span></td><td>No soak</td><td>Contact poison, psychic magic, the round that goes through any armour.</td></tr>
</tbody></table></div>
<p>Examples to get you started:</p>
<div class="tw"><table class="t">
<thead><tr><th>Weapon</th><th>Stat line</th></tr></thead>
<tbody>
<tr><td>Fists, knife</td><td><span class="tag">Damage 1</span> <span class="tag">Dodge: Full</span> <span class="tag">Soak: Full</span></td></tr>

<tr><td>Grenade, military explosive</td><td><span class="tag parca">The Reaper · Grid 2</span> <span class="tag">Dodge: Hard (−2)</span> <span class="tag">Soak: None</span></td></tr>
<tr><td>Laser rifle</td><td><span class="tag">Damage 2</span> <span class="tag">Dodge: None</span> <span class="tag">Soak: Full</span></td></tr>

</tbody></table></div>
<p>A Reaper above your level is a Key (idea 3). If it is a power of your own, it costs Keys like any other: <em>n</em>², with <em>n</em> the levels it has on you. If it is equipment, here it is paid for with money alone, like all equipment (2.9), and a grenade, being single use, does not even take up a slot.</p>
<aside class="meta"><p>Want a weapon that can only harm something of a higher level if it's the right one? A catalogue of hundreds of weapons, powers and vehicles from ten settings? The Multiverse Bazaar is in the Complete Game.</p></aside>

<h4>2.7 Health</h4>
<p>Every character has <strong>9 health boxes</strong>, in three blocks of three. Each point of damage crosses off one box.</p>
<div class="rule"><p class="rule-title">Except in Terror</p>
<p>In <strong>Terror</strong> mode there are not nine: there are <strong>3 boxes</strong>, a single block. Fill it and you are out of the fight. With the damage in this book that means <strong>two serious hits take you off the scene</strong>, and that one is enough if the attacker rolls a critical and you don’t stop it.</p>
<p>It is not a switch you have to remember to turn on. It comes with the mode, and it is the one piece of this book that lets you look in on what the Complete Game calls <strong>fractal health</strong>: there, lethality is a dial and you turn it, with three blocks, nine boxes or twenty-seven points.</p></div>
<div class="tw"><table class="t">
<thead><tr><th>Block</th><th>Boxes</th><th>When filled</th></tr></thead>
<tbody>
<tr><td>First</td><td class="num">1–3</td><td><strong>−1</strong> to actions the wound gets in the way of (a swollen eye, a broken hand).</td></tr>
<tr><td>Second</td><td class="num">4–6</td><td><strong>−3</strong> (replaces the −1) and you lose complex actions (a useless leg, a haemorrhage).</td></tr>
<tr><td>Third</td><td class="num">7–9</td><td><strong>Out of the fight.</strong></td></tr>
</tbody></table></div>
<ul>
<li><strong>Out of the fight is not death.</strong> You are incapacitated and leave the scene; you come back when it ends, and your health goes the same way as everyone else’s (below). Whether you wake up is decided by the story or by your player, not by the dice. In NOGUM no protagonist dies because of a bad roll: death is agreed.</li>
<li><strong>The Reaper, likewise.</strong> Whoever it reaches below its level is put out of the fight, with no right to roll. Whatever comes after (a scar, madness, a transformation) is agreed in the story.</li>
<li>When the threat ends and you are <strong>safe</strong>, the boxes are cleared. Being safe is not a feeling: it is being out of danger, objectively, and the GM declares it, because only the GM knows whether there are still eyes lurking in the dark. And if the next fight comes with no breather, it is the same scene and they stay crossed out. But <strong>the wounds remain</strong>: the penalty of the block you filled stays until you heal (hours or days for the first, days or weeks for the second).</li>
<li>Penalties are added to the bonus like any other modifier: if they leave you below −2, the GM decides whether you still have a right to roll (2.2).</li>
</ul>
<aside class="meta"><p>Would you like to play in a grimy world where a stray bullet makes you fear for your life? Or in an anime where the final boss takes a hundred hits? Or in a story where a glance into the abyss hurts as much as a gunshot? In the Complete Game, the same sheet works for three hits and you're out, for twenty-seven points of attrition, and for wounds to the mind and the soul. NOGUM is waiting for you.</p></aside>

<h4>2.8 Mooks and Style</h4>
<div class="rule"><p class="rule-title">The Style Rule</p>
<p>Every character has <strong>Style +2</strong>. When you face enemies <strong>below your level</strong> on the Grid, or mere mooks (the scenery of the scene), <strong>you don't roll to see if you win: it's a given</strong>. You roll with the active mode and add your Style to see <strong>how</strong> you win:</p>
<ul>
<li><strong>Fumble</strong>: you win, but you make a fool of yourself. If your character takes themselves very seriously, it may sting.</li>
<li><strong>Failure</strong> (and, in Chaos, success at a cost): you win, but messily or without shining.</li>
<li><strong>Success</strong>: you win in style, clean and spectacular.</li>
<li><strong>Critical</strong>: legendary. Film-grade choreography, several go down at once and rumours are born.</li>
</ul>
<p>Mooks are scenery: the GM declares them, they have no sheet and no roll, and they act as if they were one Grid level below you, so they cannot hurt you and nobody tracks their health boxes. Each Style roll drops one, and a critical drops several. If an enemy can hurt you, it is not scenery: it has a quick sheet (3) and rolls as normal.</p>
</div>
<p>Style suits anime, wuxia, space opera and action films. <strong>It is not recommended for very serious universes</strong>: in a realistic war, even the lowliest soldier rolls.</p>
<aside class="meta"><p>Why does the hero sweep aside twenty thugs and then sweat against a single one? In the Complete Game you'll see how the Grid, the Key and Style share the work, and how to make enemy sheets in ten seconds. NOGUM is waiting for you.</p></aside>

<h4>2.9 Equipment: what you can afford</h4>
<p>Here equipment <strong>costs money and nothing else</strong>, and money is your bonus in <em>Resources</em> (Social → Hierarchy → Resources). If your drawer reaches, you have it, without spending points or Keys: that includes the pistol or the grenade, which ask for Keys in the Complete Game. What it does ask for is room: three items.</p>
<div class="tw"><table class="t">
<thead><tr><th>Resources</th><th>Who you are</th><th>What you carry</th><th>Access</th></tr></thead>
<tbody>
<tr><td class="num">−2</td><td>You have nothing and nobody gives you credit</td><td>Clothes, a knife, whatever you find or are lent</td><td>0, and whatever you find</td></tr>
<tr><td class="num">−1</td><td>You live day to day, with no cushion</td><td>The basics, second-hand: simple tools, a small, old weapon</td><td>0</td></tr>
<tr><td class="num">+0</td><td>A wage, or a crew that covers you</td><td>A small weapon, tools, something with wheels</td><td>0 · 1 with effort</td></tr>
<tr><td class="num">+1</td><td>Savings and contacts</td><td>A serious weapon, light protection, a decent vehicle</td><td>1 · 2 with effort</td></tr>
<tr><td class="num">+2</td><td>Real money, or a patron who pays</td><td>Military hardware, armour, an armoured vehicle</td><td>2 · 3 with effort</td></tr>
<tr><td class="num">+4</td><td>You move budgets that are not yours and money has stopped being the problem</td><td>A team of people, and what should not exist</td><td>3</td></tr>
</tbody></table></div>
<p><strong>Access</strong> is the level of Resources an item asks for: the column says how far you reach, and “with effort”, the extra step (below).</p>
<ul>
<li><strong>Three items that matter.</strong> What you carry with a name and numbers on the sheet (the weapon, the armour, the vehicle) comes to three items. To take a new one, you drop one of the three. Everything else (clothes, a torch, rope) is taken for granted and gives no bonus, and single-use things (a grenade, a first-aid kit) don't count.</li>
<li><strong>One step above, once per arc.</strong> You can get hold of something out of your league, but it is not free: a favour that will be called in, a debt, a trail, somebody who now knows your name.</li>
<li><strong>Stolen or borrowed gear works for a whole scene.</strong> Afterwards you decide whether to keep it, and then it does have to fit in your drawer and among your three items.</li>
<li><strong>The weapon does not make you better, it does something else.</strong> What changes are its tags: how much damage it does, whether it can be dodged and whether armour helps (2.6).</li>
<li><strong>Armour does add:</strong> light armour gives <strong>+1</strong> and heavy armour <strong>+2</strong> to your soak roll, if the weapon allows soaking.</li>
</ul>
<aside class="meta"><p>In the Complete Game equipment has a whole economy behind it: what makes you <em>better</em> is paid for with skill points; what cancels a defence or lets you do the <em>impossible</em>, with Keys; damage, for free. And there is a workshop for pricing anything you invent. Here money and three items are enough. NOGUM is waiting.</p></aside>

<p>The players don't hear rules: they hear story. This table translates what the rule says into what you narrate.</p>

<p><strong>Improvising an enemy in ten seconds.</strong> Ask yourself whether it matters. If it doesn't, it's scenery: no sheet and no roll, it goes with Style and it does not hurt you. If it can hurt you, it already matters a little: give it a Grid level, one skill at +2 (everything else at +0) and as many health boxes as you want the fight to last (3 by default). If it's the villain, give it a full sheet like a player's.</p>
<p>NPCs roll with the same mode as the table, and make a single reaction (defence) for each attack they receive.</p>

<!-- ============================ 4 ============================ -->
<h3 id="ac-puente"><span class="hn">4</span> · Want to break the game?</h3>
<p>You now have everything you need to play in your own universe.</p>
<p>But you will have noticed the limits. Here the tone is fixed: if you start in Optimistic, you play in Optimistic all afternoon. What if you want the adventure to start as a bright fantasy and end as a nightmare? For the final boss scene to change physics mid-fight? For one particular character to live in their own tone?</p>
<p>In NOGUM you learn why each rule in this rulebook works, and with that:</p>
<ul>
<li>Seven tone cards and the panel to shift them scene by scene.</li>
<li>Fractal health: three blocks, nine boxes or twenty-seven points, with the same sheet.</li>
<li>Intent-based initiative: violence, trick or speciality.</li>
<li>The mental and spiritual damage bars, social combat and the consequence menu.</li>
<li>The full list of skills, the catalogue of Signatures, and advantages and flaws: the traits that are not skills, such as night vision or a phobia.</li>
<li>The Rules Chest, the Multiverse Bazaar and twenty recipes to emulate the most famous universes in roleplaying.</li>
</ul>
<p>Over there things change their name, not their place: the broad skill is called a <strong>Domain</strong>, and the specific one, a <strong>Discipline</strong>.</p>
<p>Try it, tinker with it and, if you like it and it raises questions, come back. If you want to see examples of how to emulate universes with this engine, the Complete Game is waiting for you.</p>
<aside class="meta"><p>If you've arrived here from the Complete Game: welcome back. This is driving school; over there was the engineering manual.</p></aside>

<div class="chu-modo"><p class="chu-n">Optimistic</p><p class="chu-f">The universe is on your side.</p>
<dl><dt>Dice</dt><dd>Roll both and keep the higher</dd><dt>Fumble</dt><dd>Double 1</dd><dt>Critical</dt><dd>A 10 on either</dd><dt>Result</dt><dd>Total 6 or more: success</dd><dt>Health</dt><dd>9 boxes</dd></dl></div>
<div class="chu-modo"><p class="chu-n">Neutral</p><p class="chu-f">The reference: nothing changes.</p>
<dl><dt>Dice</dt><dd>Only the red one</dd><dt>Fumble</dt><dd>1 on the red</dd><dt>Critical</dt><dd>10 on the red</dd><dt>Result</dt><dd>Total 6 or more: success</dd><dt>Health</dt><dd>9 boxes</dd></dl></div>
<div class="chu-modo"><p class="chu-n">Chaos</p><p class="chu-f">Successes charge a toll.</p>
<dl><dt>Dice</dt><dd>Only the red one</dd><dt>Fumble</dt><dd>1 or 2 on the red</dd><dt>Critical</dt><dd>9 or 10 on the red</dd><dt>Result</dt><dd>5 or less: failure · 6–7: success at a cost · 8 or more: success</dd><dt>Health</dt><dd>9 boxes</dd></dl></div>
<div class="chu-modo"><p class="chu-n">Terror</p><p class="chu-f">Two serious hits and you are out.</p>
<dl><dt>Dice</dt><dd>Only the red one</dd><dt>Fumble</dt><dd>1 on the red</dd><dt>Critical</dt><dd>10 on the red</dd><dt>Result</dt><dd>Total 6 or more: success</dd><dt>Health</dt><dd><b>3 boxes</b>, a single block</dd></dl></div>

<div class="chu-cols">
<div>
<p class="chu-t">The roll (2.1–2.2)</p>
<ul><li>Read the mode's die, add your bonus and compare it with <b>TN 6</b>. Always the same.</li>
<li>Fumble and critical are on the die, before adding.</li>
<li>Difficulty: easy +2 · normal 0 · hard −2 · heroic −4.</li>
<li>You roll between −2 and +4: anything above +4 is rolled at +4; below −2, the GM decides whether there is a roll.</li>
<li>Roll only if failing is interesting.</li></ul>
<p class="chu-t">Success at a cost (Chaos only)</p>
<ul><li>You manage it, and the GM sets the price: time, resource, position or friendly fire.</li>
<li>In combat it hits or defends, but it counts one level lower when compared. In Style, you win messily.</li></ul>
<p class="chu-t">The Grid (2.4)</p>
<ul><li>Same level: roll as normal.</li>
<li>Above: you succeed; if it matters how, Style +2.</li>
<li>Below: nothing, not even defending yourself, without a Key. With a Key, your full bonus.</li></ul>
</div>
<div>
<p class="chu-t">Combat (2.5–2.6)</p>
<ul><li>Initiative: mode + your best Dexterity bonus.</li>
<li>1 · Impact: the attacker rolls. Critical: +1 damage.</li>
<li>2 · Mitigation: the defender dodges (Acrobatics) or soaks (Fortitude), if the weapon allows it. Ties go to the defender.</li>
<li>Defender equal or above: no damage · success but below: damage −1 · failure: all of it · fumble: all of it +1 (+2 with a critical).</li>
<li>Damage 1, light · Damage 2, serious. The Reaper, with its level: below it, out of the fight with no roll.</li></ul>
<p class="chu-t">Style (2.8)</p>
<ul><li>Against mooks or whatever is below you: you win; roll mode + 2 to see how. Fumble: ridiculous · failure: messy · success: clean · critical: legendary.</li></ul>
<p class="chu-t">Health (2.7)</p>
<ul><li>Each point of damage crosses off a box. First block full: −1; the second: −3, instead of the −1; the third: out of the fight, which is not death.</li>
<li>Once safe (the GM says so), the boxes are rubbed out; the wound's penalty stays until you heal.</li></ul>
<p class="chu-t">Equipment (2.9)</p>
<ul><li>Resources pays for it, and three items fit. Stolen or borrowed, one scene. Light armour +1 and heavy +2 to soak.</li></ul>
</div>
</div>

<h4 class="nueva-hoja">Pregenerated characters</h4>
<p>Three examples to start right away, from three different worlds. Kira and Tomás spend 12: there is no magic in Kira's world, and in Tomás's there is, but he doesn't touch it. Ysolde spends 14, and if she played at the same table as them, they would have 14 too. Each also uses their separate pot, and Ysolde, 1 Key of starting experience for her fire (below).</p>

<p><strong>At the table:</strong> she shoots at +4 and dodges well, but with any gadget she's a Null (−2): if an electronic door needs opening, let someone else do it. With her Weapons Key she shoots like someone of level 2: an ordinary thug has no right to roll against her bullets, and against a level 2 chromed-up merc she rolls with her +4.</p>

<p><strong>Style</strong> +2 · <strong>Initiative</strong> +2 (Stealth) · <strong>Dodge</strong> +1 (Dexterity) · <strong>Soak</strong> −1 (Clumsy) · <strong>Resources</strong> −1 (Clumsy) · <strong>Magic shield</strong>: she can soak with Protection (+2) if the GM allows it.</p>
<p><strong>Her fire</strong> (a spell, not equipment): <span class="tag">Damage 2</span> <span class="tag">Dodge: Partial</span> <span class="tag">Soak: Max 1</span>, at the scale of a whole room · <strong>Equipment:</strong> staff <span class="tag">Damage 1</span> <span class="tag">Dodge: Full</span> <span class="tag">Soak: Full</span>.</p>
<p><strong>Separate pot:</strong> +1 Grid level in Arcane, her 2. <strong>Starting experience:</strong> 1 Key, the one for her fire. A spell is a permit and is paid for in Keys: the Grid says the size, not what you can do. With her Arcane 2 the fire reaches the whole room without paying for more levels, so 1 Key is enough; and since her pot went on the 2, that Key comes from the starting experience.</p>
<p><strong>At the table:</strong> with Arcane 2, her fire clears a tavern full of level 1 bandits without rolling to hit: she rolls Style. Against a dragon she needs a Key. Her level 2 in Arcane <strong>is her separate pot</strong>: she has spent there what the other two spend on Keys. Her sheet is the recommended start, 1·1·1·1·2, with the 2 where her world allows it.</p>
</div>

    carry.forEach(function(n){ target().appendChild(n); });
    // drop empty fragments left behind, keeping their anchors
    for (var i = old.length - 1; i >= 0; i--) {
      if (realCount(old[i].t) === 0 && !old[i].t.querySelector('[id]')) {
        if (old[i].c.id) { clones[i].c.id = old[i].c.id; }
        Array.prototype.slice.call(old[i].c.childNodes).forEach(function(n){ if (isHead(n) || n.nodeType===3) clones[i].t.insertBefore(n, clones[i].t.firstChild); });
        old[i].c.remove();
      } else break;
    }
  }
  function put(node){
    var t = target();
    t.appendChild(node);
    if (!over()) { if (!isHead(node)) placed++; return; }
    t.removeChild(node);
    if (canSplit(node) && (placed > 0 || true)) { split(node); return; }
    if (placed === 0) { t.appendChild(node); placed++; return; }
    breakPage();
    target().appendChild(node);
    if (over() && canSplit(node)) { target().removeChild(node); split(node); return; }
    placed++;
  }
  function split(node){
    var s = shallow(node, false);
    target().appendChild(s.c);
    if (over()) {
      target().removeChild(s.c);
      if (placed > 0) { breakPage(); }
      target().appendChild(s.c);
    }
    stack.push(node); clones.push(s);
    var us = units(node);
    us.forEach(function(group){
      var t = target();
      group.forEach(function(n){ t.appendChild(n); });
      if (!over()) { if (!(group.length===1 && isHead(group[0]))) placed++; return; }
      group.forEach(function(n){ t.removeChild(n); });
      if (group.length===1 && canSplit(group[0])) { split(group[0]); return; }
      if (placed > 0) { breakPage(); t = target(); }
      group.forEach(function(n){ t.appendChild(n); });
      if (over() && group.length===1 && canSplit(group[0])) { group.forEach(function(n){ t.removeChild(n); }); split(group[0]); return; }
      placed++;
    });
    stack.pop(); clones.pop();
  }

  function contentsBlock(entries){
    var h = document.createElement('div');
    var h2 = document.createElement('h2'); h2.textContent = UI[lang].contents; h2.id = 'contents';
    var ol = document.createElement('ol'); ol.className = 'toc-list';
    entries.forEach(function(e){
      var li = document.createElement('li'); li.className = 'l' + e.level;
      li.innerHTML = '<a href="#' + esc(e.id) + '"><span class="t"></span><span class="d"></span><span class="n" data-for="' + esc(e.id) + '">00</span></a>';
      li.querySelector('.t').textContent = e.title;
      ol.appendChild(li);
    });
    return [h2, ol];
  }
  function cleanTitle(el){
    var c = el.cloneNode(true);
    c.querySelectorAll('.flag,.src').forEach(function(x){ x.remove(); });
    return c.textContent.replace(/\s+/g,' ').trim();
  }

  function typeset(done){
    unfit();
    book.innerHTML = '';
    document.documentElement.lang = lang;
    status.textContent = UI[lang].typeset;
    var tpl = document.getElementById('src-' + lang);
    var frag = tpl.content.cloneNode(true);
    var sections = Array.prototype.slice.call(frag.children).filter(function(n){ return n.tagName==='SECTION'; });
    // prep: ids on h2, numbered lists, meta labels
    var entries = [];
    sections.forEach(function(sec){
      sec.querySelectorAll('ol').forEach(function(ol){ var st = parseInt(ol.getAttribute('start') || '1', 10); Array.prototype.forEach.call(ol.children, function(li, i){ if (li.tagName==='LI' && !li.hasAttribute('value')) li.value = st + i; }); });
      sec.querySelectorAll('aside.meta').forEach(function(a){ a.setAttribute('data-label', UI[lang].meta); });
      if (sec.classList.contains('cover')) return;
      var h2 = sec.querySelector(':scope > h2');
      if (h2) {
        if (!h2.id) { h2.id = sec.id || ('s-' + entries.length); sec.setAttribute('data-cap', sec.id || h2.id); sec.removeAttribute('id'); }
        entries.push({id:h2.id, title:cleanTitle(h2), level:(/^\s*\d+\.\d/.test(cleanTitle(h2)) ? 3 : 2)});
      }
      sec.querySelectorAll('h3[id]').forEach(function(h3){ entries.push({id:h3.id, title:cleanTitle(h3), level:3}); });
    });
    stack = []; clones = []; running = ''; runCap = '';
    var queue = [];
    sections.forEach(function(sec, idx){
      // la lamina (la hoja con la imagen) va antes de la portadilla: el indice
      // va detras de la portadilla, no detras de la lamina
      if (sec.classList.contains('cover')) { queue.push({cover:sec}); if (CFG.contents && !sec.classList.contains('lamina')) queue.push({contents:true}); return; }
      if (idx === 0 && CFG.contents) queue.push({contents:true});
      queue.push({sec:sec});
    });
    var i = 0, first = true;
    function step(){
      var t0 = performance.now();
      while (i < queue.length && performance.now() - t0 < 40) {
        var q = queue[i++];
        if (q.cover) {
          running = ''; runCap = ''; newSheet('cover');
          Array.prototype.slice.call(q.cover.childNodes).forEach(function(n){ body.appendChild(n); });
          if (q.cover.id) body.firstElementChild && (body.firstElementChild.id = body.firstElementChild.id || q.cover.id);
          first = false; cur = null;
        } else if (q.contents) {
          running = UI[lang].contents; newSheet();
          contentsBlock(entries).forEach(put);
          cur = null;
        } else {
          var h2 = q.sec.querySelector(':scope > h2');
          running = h2 ? cleanTitle(h2) : running;
          var capId = q.sec.getAttribute('data-cap') || q.sec.id;
          if (capId) { runCap = capId; if (cur) cur.setAttribute('data-cap', runCap); }
          if (!cur || CFG.chapterBreak || first) newSheet();
          else if (placed > 0) { /* continue on same sheet */ }
          Array.prototype.slice.call(q.sec.childNodes).forEach(function(n){
            if (n.nodeType===3 && !n.nodeValue.trim()) return;
            if (n.nodeType===1 && n.tagName==='H2' && placed > 0) {
              // keep a heading with at least some content: start a new sheet if little room is left
              if (body.clientHeight - body.scrollHeight < 120) { running = cleanTitle(n); breakPage(); }
            }
            if (n.nodeType===1 && n.tagName==='H2') { running = cleanTitle(n); cur.firstChild.lastChild.textContent = running; }
            // .nueva-hoja empieza en hoja nueva: las fichas de ejemplo, una por pagina
            if (n.nodeType===1 && n.classList.contains('nueva-hoja') && placed > 0) breakPage();
            put(n);
          });
          first = false;
        }
      }
      if (i < queue.length) { status.textContent = UI[lang].typeset + ' ' + book.children.length; setTimeout(step, 0); return; }
      fixOrphans(); finish(entries); if (done) done();
    }
    step();
  }

  /* ---------- after layout ---------- */
  function fixOrphans(){
    var ss = book.querySelectorAll('.sheet');
    for (var k = 0; k < ss.length - 1; k++) {
      var b = ss[k].querySelector('.sb'), nb = ss[k+1].querySelector('.sb');
      if (!b || !nb) continue;
      var l = b.lastElementChild;
      while (l && l.tagName === 'DIV' && l.classList.contains('tw') && !l.querySelector('tbody tr')) { b.removeChild(l); l = b.lastElementChild; }
      if (!l || !isHead(l) || b.children.length < 2) continue;
      nb.insertBefore(l, nb.firstElementChild);
      if (nb.scrollHeight > nb.clientHeight + 1) b.appendChild(l);
    }
  }
  var sheetInfo = [];
  function finish(entries){
    var sheets = Array.prototype.slice.call(book.querySelectorAll('.sheet'));
    sheets.forEach(function(s, k){ s.querySelector('.pn').textContent = String(k + 1); s.setAttribute('data-page', k + 1); });
    var pageOf = {};
    entries.forEach(function(e){ var el = document.getElementById(e.id); if (el) { var s = el.closest('.sheet'); pageOf[e.id] = s ? +s.getAttribute('data-page') : 0; } });
    book.querySelectorAll('.toc-list .n').forEach(function(n){ n.textContent = pageOf[n.getAttribute('data-for')] || '–'; });
    // side contents
    var ul = $('stoc'); ul.innerHTML = '';
    entries.forEach(function(e){
      var li = document.createElement('li'); li.className = 'l' + e.level;
      li.innerHTML = '<a href="#' + esc(e.id) + '"><span></span><span class="n">' + (pageOf[e.id] || '') + '</span></a>';
      li.querySelector('span').textContent = e.title;
      ul.appendChild(li);
    });
    sheetInfo = sheets.map(function(s){ return {page:+s.getAttribute('data-page'), text:s.querySelector('.sb').textContent.replace(/\s+/g,' ')}; });
    status.textContent = sheets.length + ' ' + UI[lang].pages + ' · A4';
    fit();
    labels();
    trackActive(entries, pageOf);
  }
  function unfit(){ book.style.transform = ''; book.style.marginLeft = ''; book.style.marginRight = ''; book.style.marginBottom = ''; }
  function fit(){
    unfit();
    var avail = document.querySelector('main').clientWidth - 32;
    var w = book.getBoundingClientRect().width || 794;
    var z = Math.min(1, avail / w);
    if (z < 1) { var h = book.offsetHeight; book.style.transform = 'scale(' + z + ')';
      book.style.marginLeft = '16px'; book.style.marginRight = (-(1 - z) * w) + 'px'; book.style.marginBottom = (-(1 - z) * h) + 'px'; }
  }
  var fitT; window.addEventListener('resize', function(){ clearTimeout(fitT); fitT = setTimeout(fit, 120); });

  var activeHandler;
  function trackActive(entries, pageOf){
    var links = Array.prototype.slice.call(document.querySelectorAll('#stoc a'));
    if (activeHandler) window.removeEventListener('scroll', activeHandler);
    var ticking = false;
    activeHandler = function(){
      if (ticking) return; ticking = true;
      requestAnimationFrame(function(){
        ticking = false;
        var best = null, bestY = -Infinity;
        entries.forEach(function(e, k){
          var el = document.getElementById(e.id); if (!el) return;
          var y = el.getBoundingClientRect().top;
          if (y < 140 && y > bestY) { bestY = y; best = k; }
        });
        links.forEach(function(a, k){ a.classList.toggle('active', k === best); });
        if (best !== null) {
          var a = links[best], side = $('side'), r = a.getBoundingClientRect(), sr = side.getBoundingClientRect();
          if (r.top < sr.top + 60 || r.bottom > sr.bottom - 20) side.scrollTop += r.top - sr.top - 120;
          store(KEY + '-at', entries[best].id);
        }
      });
    };
    window.addEventListener('scroll', activeHandler, {passive:true});
    activeHandler();
  }

  /* ---------- search ---------- */
  var q = $('q'), res = $('results'), stoc = $('stoc');
  q.addEventListener('input', function(){
    var term = q.value.trim();
    if (term.length < 2) { res.hidden = true; stoc.hidden = false; return; }
    var nt = norm(term), out = [];
    sheetInfo.forEach(function(s){
      var nx = norm(s.text), p = nx.indexOf(nt); if (p < 0) return;
      var from = Math.max(0, p - 45), snip = s.text.substr(from, term.length + 100), k = norm(snip).indexOf(nt);
      out.push('<li><a href="#" data-page="' + s.page + '"><span class="rv">' + UI[lang].page + ' ' + s.page + '</span><span class="rs">' + (from ? '…' : '') + esc(snip.slice(0,k)) + '<mark>' + esc(snip.substr(k, term.length)) + '</mark>' + esc(snip.slice(k + term.length)) + '…</span></a></li>');
    });
    res.innerHTML = out.length ? out.slice(0, 60).join('') : '<li><span class="rs">' + UI[lang].none + ' «' + esc(term) + '»</span></li>';
    res.hidden = false; stoc.hidden = true;
  });
  res.addEventListener('click', function(e){
    var a = e.target.closest('a[data-page]'); if (!a) return; e.preventDefault();
    var s = book.querySelector('.sheet[data-page="' + a.getAttribute('data-page') + '"]');
    if (s) s.scrollIntoView({block:'start'});
    closeMenu();
  });

  /* ---------- chrome ---------- */
  function labels(){
    var u = UI[lang];
    $('qLabel').textContent = u.search; q.placeholder = u.ph;
    $('printBtn').textContent = u.print; $('themeBtn').textContent = u.theme; $('menuBtn').textContent = u.menu;
    document.querySelectorAll('[data-i18n-es]').forEach(function(el){ el.textContent = el.getAttribute('data-i18n-' + lang); });
    document.querySelectorAll('.lang button').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false'); });
    document.title = CFG.title[lang];
  }
  function closeMenu(){ document.body.classList.remove('nav-open'); $('menuBtn').setAttribute('aria-expanded','false'); }
  document.addEventListener('click', function(e){
    var j = e.target.closest('.joke');
    if (j) { var list = j.getAttribute('data-jokes').split('|'); var i = (list.indexOf(j.textContent.replace(/^\(|\)$/g,'')) + 1) % list.length; j.textContent = '(' + list[i] + ')'; return; }
    var a = e.target.closest('#stoc a, .toc-list a');
    if (a) { e.preventDefault(); var el = document.getElementById(a.getAttribute('href').slice(1)); if (el) el.scrollIntoView({block:'start'}); closeMenu(); }
  });
  $('menuBtn').addEventListener('click', function(){ var o = document.body.classList.toggle('nav-open'); this.setAttribute('aria-expanded', o ? 'true' : 'false'); });
  /* Imprimir: papel (blanco, ahorra tinta) o pantalla (el crema, para un PDF).
     Ctrl+P sin pasar por aqui sale como papel. */
  var pm = document.createElement('div'); pm.className = 'printmenu'; pm.id = 'printMenu'; pm.hidden = true; pm.setAttribute('role', 'menu');
  document.body.appendChild(pm);
  function pintaPM(){ var u = UI[lang]; pm.innerHTML = '<button type="button" role="menuitem" data-print="papel">' + u.pPaper + '<span>' + u.pPaperD + '</span></button><button type="button" role="menuitem" data-print="pantalla">' + u.pScreen + '<span>' + u.pScreenD + '</span></button><p>' + u.pHint + '</p>'; }
  function cierraPM(){ pm.hidden = true; $('printBtn').setAttribute('aria-expanded', 'false'); }
  $('printBtn').setAttribute('aria-haspopup', 'menu');
  $('printBtn').addEventListener('click', function(e){
    e.stopPropagation();
    if (!pm.hidden) { cierraPM(); return; }
    pintaPM(); pm.hidden = false; this.setAttribute('aria-expanded', 'true');
    var r = this.getBoundingClientRect(), w = pm.offsetWidth;
    pm.style.top = (r.bottom + 6) + 'px'; pm.style.left = Math.max(16, Math.min(r.right - w, innerWidth - w - 16)) + 'px';
    pm.querySelector('button').focus();
  });
  pm.addEventListener('click', function(e){
    var b = e.target.closest('[data-print]'); if (!b) return;
    root.setAttribute('data-print', b.getAttribute('data-print')); cierraPM();
    setTimeout(function(){ window.print(); }, 30);
  });
  document.addEventListener('click', function(e){ if (!pm.hidden && !pm.contains(e.target)) cierraPM(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !pm.hidden) { cierraPM(); $('printBtn').focus(); } });
  var root = document.documentElement, th = read('nogum-theme'); if (th) root.setAttribute('data-theme', th);
  $('themeBtn').addEventListener('click', function(){
    var c = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var n = c === 'dark' ? 'light' : 'dark'; root.setAttribute('data-theme', n); store('nogum-theme', n);
  });
  document.querySelectorAll('.lang button').forEach(function(b){
    if (CFG.langs.indexOf(b.getAttribute('data-lang')) < 0) b.parentNode.hidden = true;
    b.addEventListener('click', function(){
      var l = b.getAttribute('data-lang'); if (l === lang) return;
      var at = read(KEY + '-at');
      lang = l; store('nogum-lang', l);
      typeset(function(){ var el = at && document.getElementById(at); if (el) el.scrollIntoView({block:'start'}); });
    });
  });
  window.addEventListener('beforeprint', function(){ unfit(); });
  window.addEventListener('afterprint', function(){ fit(); root.removeAttribute('data-print'); });

  /* ---------- start ---------- */
  labels();
  var started = false;
  function start(){
    if (started) return; started = true;
    typeset(function(){
      var id = location.hash.slice(1) || read(KEY + '-at');
      var el = id && document.getElementById(id);
      if (el) el.scrollIntoView({block:'start'});
    });
  }
  var SAMPLE = (function(){ var t = ''; document.querySelectorAll('template').forEach(function(x){ t += x.content.textContent; }); return Array.from(new Set(t.replace(/\s/g, ''))).join(''); })();
  if (document.fonts && document.fonts.load) { Promise.all(['400 1em "Source Serif 4"','italic 400 1em "Source Serif 4"','600 1em "Source Serif 4"','700 1em "Ibarra Real Nova"','italic 400 1em "Ibarra Real Nova"','800 1em "Big Shoulders Display"','600 1em "Big Shoulders Display"','400 1em "JetBrains Mono"','600 1em "JetBrains Mono"'].map(function(f){ return document.fonts.load(f, SAMPLE).catch(function(){}); })).then(function(){ return document.fonts.ready; }).then(start, start); setTimeout(start, 6000); } else start();
})();
</script>
