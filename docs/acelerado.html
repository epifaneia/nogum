<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOGUM Acelerado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&amp;family=Ibarra+Real+Nova:ital,wght@0,700;1,400&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>:root{
  --ground:#e7ddcb; --paper:#f5efe3; --ink:#1c1814; --ink-2:#4a4237; --ink-3:#655c4e;
  --rule:#d4c7af; --rule-2:#e8ddc9; --side:#ede4d3;
  --red:#b8323a; --red-soft:#f0ded4; --blue:#2a56a0; --blue-soft:#e3e1dd;
  --amber:#8a5a00; --amber-soft:#ebe2cf; --violet:#5b3f99; --violet-soft:#e7dfdc;
  --drop:#8f2f36; --drop-soft:#ecded3; --ok:#2f6b45; --ok-soft:#e3e3d5;
  --c-pifia:#9b2a32; --c-fallo:#6b6288; --c-parcial:#b98a00; --c-exito:#2f63b5; --c-critico:#0f8f72;
  --shadow:0 1px 3px rgba(60,40,15,.14),0 10px 30px rgba(60,40,15,.11);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  /* lo que se lee lleva Ibarra; lo que es marca o tarjeta, Big Shoulders (T160) */
  --book:"Ibarra Real Nova",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#100e0c; --paper:#1c1916; --ink:#ede6d9; --ink-2:#c5bba9; --ink-3:#9b907e;
  --rule:#3b342b; --rule-2:#2c2721; --side:#151310;
  --red:#f07378; --red-soft:#402827; --blue:#86a9ec; --blue-soft:#2e313a;
  --amber:#e7b95a; --amber-soft:#3f3422; --violet:#b9a2ee; --violet-soft:#37303b;
  --drop:#f08a90; --drop-soft:#402c2b; --ok:#8fd1a6; --ok-soft:#30382e;
  --c-pifia:#e0666e; --c-fallo:#9a93ad; --c-parcial:#e0aa42; --c-exito:#86a9ec; --c-critico:#5cc3a0;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#100e0c; --paper:#1c1916; --ink:#ede6d9; --ink-2:#c5bba9; --ink-3:#9b907e;
  --rule:#3b342b; --rule-2:#2c2721; --side:#151310;
  --red:#f07378; --red-soft:#402827; --blue:#86a9ec; --blue-soft:#2e313a;
  --amber:#e7b95a; --amber-soft:#3f3422; --violet:#b9a2ee; --violet-soft:#37303b;
  --drop:#f08a90; --drop-soft:#402c2b; --ok:#8fd1a6; --ok-soft:#30382e;
  --c-pifia:#e0666e; --c-fallo:#9a93ad; --c-parcial:#e0aa42; --c-exito:#86a9ec; --c-critico:#5cc3a0;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 var(--serif);-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-underline-offset:2px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
[id]{scroll-margin-top:84px}

/* ---------- chrome ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);flex:none}
.dice{display:flex;gap:4px}
.dice i{display:block;width:17px;height:17px;border-radius:4px;background:var(--red);transform:rotate(-8deg)}
.dice i+i{background:var(--blue);transform:rotate(10deg)}
.brand b{font:800 25px/1 var(--display);letter-spacing:.06em}
.brand small{font:600 11px/1 var(--mono);color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.products{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.products a,.products span{font:600 11.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);text-decoration:none;border:1px solid var(--rule);border-radius:6px;padding:8px 10px;white-space:nowrap}
.products a:hover{border-color:var(--ink-3);color:var(--ink)}
.products [aria-current="page"]{color:var(--paper);background:var(--ink);border-color:var(--ink)}
.tool{flex:none;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:6px;padding:8px 10px;font:600 12px/1 var(--mono);cursor:pointer}
.tool:hover{color:var(--ink);border-color:var(--ink-3)}
.lang{display:flex;flex:none;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{font:600 12px/1 var(--mono);border:0;background:none;color:var(--ink);padding:8px 11px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.menu-btn{display:none}

.shell{display:grid;grid-template-columns:290px minmax(0,1fr)}
.side{position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto;background:var(--side);border-right:1px solid var(--rule);padding:16px 14px 40px}
.search input{width:100%;font:13.5px/1.3 var(--mono);padding:9px 11px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
.search label{display:block;font:12px/1.4 var(--mono);color:var(--ink-3);margin:0 2px 6px}
.stoc{list-style:none;margin:14px 0 0;padding:0}
.stoc a{display:flex;gap:8px;text-decoration:none;color:var(--ink-2);font:13.5px/1.3 var(--serif);padding:4px 8px;border-radius:5px;border-left:2px solid transparent}
.stoc a span:first-child{flex:1}
.stoc a .n{font:12px/1.3 var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.stoc li.l2 a{color:var(--ink);font-weight:600;margin-top:8px}
.stoc li.l3 a{padding-left:18px;font-size:13px}
.stoc a:hover{background:var(--paper)}
.stoc a.active{border-left-color:var(--red);background:var(--paper);color:var(--ink)}
.results{list-style:none;margin:12px 0 0;padding:0}
.results a{display:block;text-decoration:none;color:var(--ink);padding:7px 8px;border-radius:6px}
.results a:hover{background:var(--paper)}
.results .rv{font:600 11px/1 var(--mono);color:var(--ink-3);text-transform:uppercase}
.results .rs{display:block;font:13px/1.4 var(--serif);color:var(--ink-2);margin-top:3px}
.results mark{background:var(--amber-soft);color:inherit}
main{padding:26px 16px 80px;min-width:0;overflow-x:hidden}
.status{max-width:210mm;margin:0 auto 14px;font:600 12px/1.4 var(--mono);color:var(--ink-3);text-align:center}
#book{width:210mm;margin:0 auto;transform-origin:top left}

/* ---------- sheet ---------- */
.sheet{width:210mm;height:297mm;margin:0 0 18px;background:var(--paper);box-shadow:var(--shadow);position:relative;display:flex;flex-direction:column;padding:12mm 17mm 9mm;contain:strict;overflow:hidden}
.rh{flex:none;display:flex;justify-content:space-between;gap:12px;font:600 8.5pt/1.2 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding-bottom:2.5mm;border-bottom:.3mm solid var(--rule);margin-bottom:6mm;white-space:nowrap;overflow:hidden}
.rh span{overflow:hidden;text-overflow:ellipsis}
.sb{flex:1 1 auto;min-height:0;overflow:hidden;font-size:10.5pt;line-height:1.48}
/* el margen inferior del ultimo bloque de una hoja no pinta nada: contaba como
   desbordamiento sin que se recortara una sola linea de texto */
.sb > *:last-child{margin-bottom:0}
.pf{flex:none;display:flex;justify-content:center;align-items:center;gap:6px;padding-top:3mm;font:600 9pt/1 var(--mono);color:var(--ink-3)}
.pf::before,.pf::after{content:"";width:4mm;height:.3mm;background:var(--rule)}
.sheet.cover{padding:0;background:var(--ink);color:var(--paper)}
.sheet.cover .rh,.sheet.cover .pf{display:none}
.sheet.cover .sb{padding:26mm 20mm;display:flex;flex-direction:column;justify-content:center}
/* la lamina: la primera hoja de cada libro, con la imagen de la pieza a sangre */
.sheet.cover .sb:has(.lamina){padding:22mm 0 20mm}
.lamina{display:flex;flex-direction:column;justify-content:space-between;height:100%}
.lamina-top,.lamina-pie{padding:0 18mm}
.lamina-dados{display:flex;gap:2.2mm;margin-bottom:6mm}
.lamina-dados i{display:block;width:7mm;height:7mm;border-radius:1.6mm;background:var(--red)}
.lamina-dados i+i{background:var(--blue)}
.sheet.cover .lamina-marca{font:800 74pt/.86 var(--display);letter-spacing:.01em;text-transform:uppercase;margin:0!important;max-width:none}
.lamina-foto{display:block;width:100%;height:auto}
.sheet.cover .lamina-t{font:italic 400 30pt/1.05 var(--book);margin:0!important}
.sheet.cover .lamina-a{display:flex;justify-content:space-between;max-width:none;margin:6mm 0 0!important;padding-top:3mm;border-top:.3mm solid color-mix(in srgb,currentColor 25%,transparent);font:400 7.5pt/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;opacity:.65}

/* ---------- content ---------- */
.sb h2{font:700 25pt/1.06 var(--book);letter-spacing:-.012em;margin:0 0 5mm;padding-bottom:3mm;border-bottom:.8mm solid var(--ink);text-wrap:balance}
.sb h3{font:700 15pt/1.2 var(--book);letter-spacing:0;margin:6mm 0 2.5mm;text-wrap:balance;break-after:avoid}
.hn{color:var(--red)}
.sb h3::before{content:"";display:inline-block;width:2.4mm;height:2.4mm;background:var(--red);border-radius:.5mm;margin-right:2.5mm;vertical-align:.12em;transform:rotate(45deg)}
.sb h4{font:600 12pt/1.3 var(--serif);margin:5mm 0 2mm}
.sb > :first-child{margin-top:0}
.sb p{margin:0 0 2.6mm}
.sb ul,.sb ol{padding-left:5.5mm;margin:0 0 3mm}
.sb li{margin:0 0 1.4mm}
.sb dl{margin:0 0 3mm}
.sb dt{font-weight:600;margin-top:2mm}
.sb dd{margin:.5mm 0 1.6mm}
.sb blockquote{margin:3mm 0;padding:1mm 0 1mm 4mm;border-left:.8mm solid var(--blue);color:var(--ink-2);font-style:italic}
.sb small{font-size:.85em;color:var(--ink-3)}
.signoff{font:italic 400 17pt/1.25 var(--book);letter-spacing:0;margin-top:5mm!important}
.running{display:none}
.lede{font-size:12.5pt}

.tw{margin:2.5mm 0 4mm;border:.3mm solid var(--rule);border-radius:1.5mm;overflow:hidden}
/* break-word y no anywhere: anywhere hace creer a la tabla que cualquier columna
   cabe en una letra, estrecha las de etiquetas y trocea «Total» o «Rejilla» sin
   guion. Medido: 422 palabras partidas en el Juego con anywhere, 5 con break-word. */
table.t{border-collapse:collapse;width:100%;font-size:8.7pt;line-height:1.35;table-layout:auto}
table.t th,table.t td{padding:1.4mm 2mm;text-align:left;vertical-align:top;border-bottom:.25mm solid var(--rule-2);overflow-wrap:break-word;hyphens:auto}
table.t thead th{background:var(--ink);color:var(--paper);font:600 7.5pt/1.25 var(--mono);letter-spacing:.03em;text-transform:uppercase}
/* lo pequeño de una cabecera, del color de la cabecera: el gris de .sb small no se lee sobre el negro */
table.t thead th small{color:inherit;font-weight:400}
table.t tbody th{background:var(--rule-2);font-weight:600}
table.t tbody tr:last-child>*{border-bottom:0}
table.t .tag{white-space:normal}
/* la primera columna suele llevar el nombre de la cosa y se quedaba sin sitio:
   ni «optimista» ni «opresivo» cabian. Se le da ancho y se le prohibe partir palabras. */
table.t td:first-child,table.t tbody th:first-child{min-width:34mm;overflow-wrap:normal;hyphens:none}
table.t thead th:first-child{min-width:34mm}
/* ...salvo si la primera columna es un numero (el zoom 1, 2, 3): esos 34 mm se
   los quitaba a la columna de al lado, y «Letal» o «Tactico» no cabian (T163) */
table.t td.num:first-child,table.t:has(tbody td.num:first-child) thead th:first-child{min-width:0}
/* y cuando la ultima columna es la apretada, que no se parta tampoco en seco */
table.t td:last-child{overflow-wrap:break-word}
/* Nada de guiones en las tablas. Con hyphens:auto el navegador que trae
   diccionarios (el Chrome del lector) partia «NI-VEL» o «RECUPE-RACION» para
   estrechar columnas, y el Chrome automatico de las pruebas, que no los trae,
   no lo veia. Sin guiones, cada columna mide al menos su palabra mas larga y
   el sitio sale de las columnas de texto largo. */
table.t th,table.t td{hyphens:manual}
table.t thead th{overflow-wrap:normal}
/* una cabecera que debe ir en una sola linea */
table.t th.nw{white-space:nowrap}
/* El arsenal del Bazar: las 35 tablas de objetos, con el mismo reparto */
table.t.arsenal{table-layout:fixed}
table.t.arsenal thead th:nth-child(1){width:30mm;min-width:0}
table.t.arsenal thead th:nth-child(2){width:19mm}
table.t.arsenal thead th:nth-child(3){width:21mm}
table.t.arsenal thead th:nth-child(4){width:18mm}
table.t.arsenal thead th:nth-child(5){width:33mm}
table.t.arsenal td:first-child{min-width:0}
td.num,th.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.t td.on{color:var(--red);text-align:center}
table.rejilla td{text-align:center}
.bar{display:inline-block;height:2.4mm;width:var(--w,0%);min-width:.5mm;background:var(--blue);border-radius:.5mm;vertical-align:middle}

.rule{border:.3mm solid var(--rule);border-left:1.2mm solid var(--ink);background:color-mix(in srgb,var(--ground) 55%,var(--paper));border-radius:1.5mm;padding:3mm 4mm 1mm;margin:3.5mm 0}
.rule.warn{border-left-color:var(--red)}
.rule.formula{border-left-color:var(--blue)}
.rule-title{font:700 12.5pt/1.2 var(--book);letter-spacing:0;margin:0 0 1.8mm!important}
.formula-line{font:600 9.5pt/1.45 var(--mono);background:var(--blue-soft);padding:2.2mm 3mm;border-radius:1.2mm}
.example{border:.3mm dashed var(--rule);border-radius:1.5mm;padding:3mm 4mm 1mm;margin:3.5mm 0}
.example-title,.step-title{font:600 8.5pt/1.2 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--red);margin:0 0 1.8mm!important}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:3mm;margin:3mm 0}
.step{border:.3mm solid var(--rule);border-top:1mm solid var(--blue);border-radius:1.5mm;padding:3mm 3.5mm 1mm}
aside.meta{font:8.8pt/1.45 var(--mono);color:var(--ink-2);background:var(--amber-soft);border-radius:1.5mm;padding:2.4mm 3.5mm;margin:3mm 0}
aside.meta p{margin:0}
aside.meta::before{content:attr(data-label);display:block;font:600 7pt/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin-bottom:1.4mm}
.tag{display:inline-block;font:600 7.6pt/1.2 var(--mono);padding:.3mm 1.2mm;border-radius:.8mm;background:var(--rule-2);border:.25mm solid var(--rule);white-space:nowrap;margin:.2mm 0}
.tag.parca{background:var(--ink);color:var(--paper);border-color:var(--ink);letter-spacing:.02em}
@media print{.tag.parca{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.flag{display:inline-block;font:600 6.8pt/1.2 var(--mono);letter-spacing:.03em;text-transform:uppercase;padding:.3mm 1.4mm;border-radius:99px;white-space:nowrap;vertical-align:.1em}
.flag.proposal{background:var(--amber-soft);color:var(--amber)}
.flag.pending{background:var(--violet-soft);color:var(--violet)}
.flag.ed{background:var(--blue-soft);color:var(--blue)}
.flag.drop{background:var(--drop-soft);color:var(--drop)}
.src{font:7pt/1 var(--mono);color:var(--ink-3);white-space:nowrap}
.src::before{content:"↳ "}
.legend{display:flex;flex-wrap:wrap;gap:1.5mm 5mm;font-size:9pt;margin:3mm 0}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:3mm;margin:3mm 0}
.card{border:.3mm solid var(--rule);border-top:1.2mm solid var(--ink-3);border-radius:2mm;padding:3mm 3.5mm 2mm;break-inside:avoid}
#t1{border-top-color:var(--blue)} #t4{border-top-color:var(--red)} #t3,#t5{border-top-color:var(--amber)} #t0{border-top-color:var(--ok)}
.card-kicker{font:600 7pt/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:0 0 1mm!important}
.card h4{font:800 15pt/1 var(--display);text-transform:uppercase;margin:0 0 1mm}
.card-axes{font:600 7.8pt/1.3 var(--mono);color:var(--blue);margin:0 0 1.5mm!important}
.card-quote{font-style:italic;color:var(--ink-2);margin:0 0 1.5mm!important}
.card-rules{display:grid;grid-template-columns:auto 1fr;gap:.8mm 2.5mm;margin:0 0 1.5mm;font-size:9pt}
.card-rules dt{margin:0;font:600 7pt/1.6 var(--mono);text-transform:uppercase;color:var(--ink-3)}
.card-rules dd{margin:0}
.card-fx{font-size:8.6pt;color:var(--ink-2);border-top:.3mm solid var(--rule);padding-top:1.5mm;margin:0!important}
.fractal{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5mm;margin:3mm 0}
.fr-block{border:.5mm solid var(--ink);border-radius:1.5mm;padding:2mm}
.fr-block p{font:600 7pt/1.2 var(--mono);text-transform:uppercase;margin:0 0 1.5mm}
.fr-cells{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2mm}
.fr-cells span{aspect-ratio:1;border:.35mm solid var(--ink-2);border-radius:.7mm;background:radial-gradient(circle at 22% 50%,var(--ink-3) 0 12%,transparent 13%),radial-gradient(circle at 50% 50%,var(--ink-3) 0 12%,transparent 13%),radial-gradient(circle at 78% 50%,var(--ink-3) 0 12%,transparent 13%)}
.fr-caption{grid-column:1/-1;font:8pt/1.4 var(--mono);color:var(--ink-3);margin:0}
.recipe{border:.3mm solid var(--rule);border-radius:1.5mm;padding:3mm 4mm 1mm;margin:3mm 0}
.recipe-title{font:800 13pt/1.15 var(--display);text-transform:uppercase;margin:0 0 .8mm!important}
.recipe-ref{font:8pt/1.3 var(--mono);color:var(--ink-3);margin:0 0 1.8mm!important}
.recipe-canon{font-size:9.3pt;color:var(--blue);border-top:.3mm dashed var(--rule);padding-top:1.5mm}
ol.thread{list-style:none;padding-left:0;border-left:.5mm solid var(--rule);margin-left:1.5mm}
ol.thread li{position:relative;padding-left:4.5mm}
ol.thread li::before{content:"";position:absolute;left:-1.6mm;top:.55em;width:2.6mm;height:2.6mm;border-radius:50%;background:var(--paper);border:.5mm solid var(--ink-3)}

/* in-book contents */
.toc-list{list-style:none;padding:0!important;margin:0}
.toc-list li{margin:0}
.toc-list a{display:flex;align-items:baseline;gap:2mm;color:var(--ink);text-decoration:none;padding:.9mm 0}
.toc-list .l2 a{font-weight:600;font-size:11pt;margin-top:2.5mm}
.toc-list .l3 a{padding-left:6mm;font-size:9.8pt;color:var(--ink-2)}
.toc-list .d{flex:1;border-bottom:.3mm dotted var(--ink-3);transform:translateY(-1mm)}
.toc-list .n{font:600 9pt/1 var(--mono);font-variant-numeric:tabular-nums;min-width:8mm;text-align:right}

/* covers */
.sheet.cover h2{font:600 9pt/1 var(--mono);letter-spacing:.2em;border:0;color:color-mix(in srgb,var(--paper) 65%,transparent);padding:0;margin:0 0 12mm}
.acro p{margin:0!important}
.acro-kicker{font:600 8.5pt/1 var(--mono);text-transform:uppercase;letter-spacing:.12em;opacity:.7;margin-bottom:6mm!important}
.acro-letters{font:800 68pt/.9 var(--display);letter-spacing:.05em}
.acro-official{font:600 15pt/1.3 var(--display);letter-spacing:.08em;text-transform:uppercase;margin-top:6mm!important}
.acro-joke{margin-top:4mm!important}
.joke{font:italic 400 14pt/1.3 var(--serif);color:inherit;opacity:.8;background:none;border:0;padding:0;cursor:pointer;text-align:left;border-bottom:.3mm dashed currentColor}
.sheet.cover .lede,.sheet.cover p{max-width:140mm}
.sheet.cover .lede{margin-top:14mm!important;font-size:13pt}
.sheet.cover aside.meta{background:rgba(255,255,255,.08);color:inherit;margin-top:8mm}
.sheet.cover .legend,.sheet.cover .tw,.sheet.cover h3{display:none}
.sheet.cover a{color:inherit}

/* ---------- responsive / print ---------- */
@media (max-width:980px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:58px 0 0 0;height:auto;z-index:15;transform:translateX(-102%);transition:transform .2s ease}
  body.nav-open .side{transform:none}
  .menu-btn{display:block}
  .brand small{display:none}
}
@media (max-width:600px){ .top{flex-wrap:wrap} .products{order:9;flex-basis:100%} .brand b{font-size:21px} }
@media (prefers-reduced-motion:reduce){.side{transition:none}}
@page{size:A4;margin:0}
@media print{
  :root{--paper:#fff;--ink:#161b24;--ink-2:#3b4250;--ink-3:#616978;--rule:#c9cfd8;--rule-2:#e4e8ee;--ground:#fff;color-scheme:light}
  html,body{background:#fff}
  .top,.side,.status{display:none!important}
  .shell{display:block} main{padding:0}
  #book{zoom:1!important;width:auto;margin:0}
  .sheet{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto}
  .sheet.cover{background:#1c1814;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .printmenu{display:none!important}
  /* Para papel (lo de siempre, y lo que sale con Ctrl+P): hojas blancas y la
     portada clara y sin foto, para no gastar media tinta en una pagina. */
  html:not([data-print="pantalla"]) .sheet.cover{background:#fff;color:var(--ink)}
  html:not([data-print="pantalla"]) .sheet.cover h2{color:var(--ink-3)}
  html:not([data-print="pantalla"]) .lamina-foto{display:none}
  /* Para pantalla o PDF: el crema de la web, a sangre, y la portada con su imagen */
  html[data-print="pantalla"]{--paper:#f5efe3;--ink:#1c1814;--ink-2:#4a4237;--ink-3:#655c4e;--rule:#d4c7af;--rule-2:#e8ddc9;--ground:#e7ddcb}
  html[data-print="pantalla"],html[data-print="pantalla"] body{background:#f5efe3}
  html[data-print="pantalla"] .sheet{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.t thead th,.flag,.tag,aside.meta,.formula-line,.bar{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.grid-tonal td.hueco{color:var(--ink-3);background:repeating-linear-gradient(135deg,transparent,transparent 6px,var(--rule-2) 6px,var(--rule-2) 7px)}

.recipe-grid{margin:6px 0 0;padding-top:6px;border-top:1px dotted var(--rule-2);font-size:.92em;color:var(--ink-2)}

table.t.idx td,table.t.idx th{padding:2px 6px;font-size:.88em}
table.t.idx td:first-child{font-weight:600}

/* el pack: las cinco piezas, en la portada de cada una */
.pack{margin:28px auto 0;max-width:46em;border-top:1px solid var(--rule);padding-top:18px}
.pack-h{margin:0;font:800 clamp(17px,2.2vw,21px)/1.15 var(--display);text-transform:uppercase;letter-spacing:.03em}
.pack-t{margin:4px 0 14px;font:12px/1.5 var(--mono);color:var(--ink-3)}
.pack ol{list-style:none;margin:0;padding:0;counter-reset:pieza}
.pack li{counter-increment:pieza;display:grid;grid-template-columns:1.6em 1fr;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--rule-2)}
.pack li:last-child{border-bottom:none}
.pack li::before{content:counter(pieza);grid-row:1/3;font:600 12px/1.6 var(--mono);color:var(--ink-3)}
.pack li a,.pack li strong{font:600 16px/1.3 var(--serif)}
.pack li a{color:var(--blue)}
.pack li a:hover{color:var(--red)}
.pack li em{font:11px/1.6 var(--mono);font-style:normal;text-transform:uppercase;letter-spacing:.05em;color:var(--red);margin-left:8px}
.pack li span{grid-column:2;font-size:14px;line-height:1.45;color:var(--ink-2)}
.pack li.aqui{background:var(--ground);border-radius:8px;padding-left:10px;padding-right:10px;margin:0 -10px}
/* dentro de la portada, que es oscura, el pack se tine del color de la portada:
   si no, el texto gris de las descripciones se pierde sobre el fondo */
.sheet.cover .pack{border-top-color:color-mix(in srgb,currentColor 25%,transparent)}
.sheet.cover .pack li{border-bottom-color:color-mix(in srgb,currentColor 14%,transparent)}
.sheet.cover .pack-t,.sheet.cover .pack li span{color:color-mix(in srgb,currentColor 68%,transparent)}
.sheet.cover .pack li::before{color:color-mix(in srgb,currentColor 50%,transparent)}
.sheet.cover .pack li a{color:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.sheet.cover .pack li a:hover{color:var(--red-soft,#ff8a7a)}
.sheet.cover .pack li em{color:color-mix(in srgb,currentColor 80%,transparent)}
.sheet.cover .pack li.aqui{background:rgba(255,255,255,.08)}
@media print{.pack li a{color:var(--ink)}.sheet.cover .pack li a{color:inherit}}

/* ===== color por capitulo =========================================
   Cuatro familias, una escala cada una. No es decoracion: es para saber
   donde estas al pasar paginas. Se usa en hilos finos (el filete de la
   cabecera, la linea del titulo, el numero de pagina y el indice lateral),
   nunca en el texto ni en fondos: el manual sigue siendo tinta sobre papel.
   Y nunca lleva tono: un color de referencia no cuenta una historia. */
.sheet{--cap:var(--ink-3)}
/* el motor: azules */
.sheet[data-cap="como-leer"]{--cap:#6b7382}
.sheet[data-cap="intro"]{--cap:#4b6ea8}
.sheet[data-cap="ch1"],.sheet[data-cap="ch1-panel"],.sheet[data-cap="ch1-maquinas"]{--cap:#2a56a0}
.sheet[data-cap="ch2"]{--cap:#1f6f8b}
/* la ficha: verdes */
.sheet[data-cap="ch3"]{--cap:#2e7d6b}
/* la mesa: ambares y rojos */
.sheet[data-cap="ch4"]{--cap:#9a6b16}
.sheet[data-cap="ch5"]{--cap:#a8502a}
.sheet[data-cap="ch6"]{--cap:#8d3c3c}
.sheet[data-cap="ch7"]{--cap:#7a3f6d}
/* los apendices: grises y violetas apagados */
.sheet[data-cap="ch8"],.sheet[data-cap="ch8b"]{--cap:#5c5470}
.sheet[data-cap="apx-bazar"],.sheet[data-cap="apx-bazar-b"]{--cap:#4a6a52}
.sheet[data-cap="apx-mates"]{--cap:#555f6e}
.sheet[data-cap="apx-glosario"]{--cap:#6b6257}
/* el cuaderno de edicion */
.sheet[data-cap="audit-editorial"]{--cap:#2a56a0}
.sheet[data-cap="audit-descartados"]{--cap:#a8502a}
.sheet[data-cap="audit-traza"]{--cap:#5c5470}
.rh{border-bottom-color:color-mix(in srgb,var(--cap) 55%,var(--rule))}
.rh span:last-child{color:var(--cap)}
.sb h2{border-bottom-color:var(--cap)}
.pn{color:var(--cap)}
@media print{.rh,.sb h2,.pn{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* ===== el hueco de figura =========================================
   Para DIAGRAMAS: el sistema dibujandose a si mismo. Nunca para escenas ni
   personajes. Toda imagen lleva tono, y este manual no arrastra ninguno: el
   tono lo pone la mesa, no la portada. Un esquema no cuenta una historia.
   El hueco reserva su sitio aunque el dibujo no exista todavia, para que el
   dia que llegue no haya que remaquetar el libro entero. */
/* graficas: el sistema dibujandose a si mismo */
svg.nog .gr{stroke:var(--rule-2);stroke-width:1}
svg.nog .ge{stroke:var(--rule);stroke-width:1}
svg.nog .gt{font:9.5px var(--mono);fill:var(--ink-3)}
svg.nog .gh{font:600 10px var(--mono);fill:var(--ink-2)}
svg.nog .gn{font:600 10.5px var(--mono)}
svg.nog .gl{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.nog .ok{stroke:var(--ok)}svg.nog .bl{stroke:var(--blue)}svg.nog .rd{stroke:var(--red)}
svg.nog .f-ok{fill:var(--ok)}svg.nog .f-bl{fill:var(--blue)}svg.nog .f-rd{fill:var(--red)}
svg.nog .dash{stroke-dasharray:7 3.5}svg.nog .dot{stroke-dasharray:1.5 3}
svg.nog .bt{font:10px var(--mono);fill:var(--ink-3)}
svg.nog .bs{font:10px var(--mono);fill:var(--ink-2)}
svg.nog .k-pifia{fill:var(--c-pifia)}svg.nog .k-fallo{fill:var(--c-fallo)}
svg.nog .k-parcial{fill:var(--c-parcial)}svg.nog .k-exito{fill:var(--c-exito)}
svg.nog .k-critico{fill:var(--c-critico)}
svg.nog .b-g3{fill:var(--ink-3)}svg.nog .b-ok{fill:var(--ok)}
svg.nog .b-rd{fill:var(--red)}svg.nog .b-bl{fill:var(--blue)}

/* las fichas de las siete tarjetas */
.t7s{margin:5mm 0}
.t7{border:.35mm solid var(--rule);border-left:1.6mm solid var(--t7c);border-radius:1.6mm;
    background:var(--t7b);padding:3.5mm 4mm 3mm;margin:0 0 4mm;break-inside:avoid;page-break-inside:avoid}
.t7[data-fila="opt"]{--t7c:var(--ok);--t7b:var(--ok-soft)}
.t7[data-fila="neu"]{--t7c:var(--blue);--t7b:var(--blue-soft)}
.t7[data-fila="opr"]{--t7c:var(--red);--t7b:var(--red-soft)}
.t7[data-fila="rec"]{--t7c:var(--violet);--t7b:var(--violet-soft)}
.t7cab{display:flex;align-items:baseline;justify-content:space-between;gap:3mm;flex-wrap:wrap}
.t7cab h4{margin:0;font:600 13.5pt/1.15 var(--display);letter-spacing:.01em;color:var(--t7c);
          text-transform:uppercase}
.t7ax{font:8.5pt/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);
      border:.3mm solid var(--rule);border-radius:4mm;padding:1mm 2.4mm;background:var(--paper)}
.t7frase{margin:1.5mm 0 0;font:italic 11pt/1.35 var(--serif);color:var(--ink-2)}
.t7cuerpo{display:grid;grid-template-columns:1fr 1fr;gap:4mm;align-items:start;margin:3mm 0 0}
.t7izq{min-width:0}
.t7der{min-width:0}
.t7der p{margin:0 0 2mm}
.t7der p:last-child{margin-bottom:0}
.t7how{font:9pt/1.4 var(--mono);color:var(--ink-2)}
.t7pie{margin:1mm 0 0;font:8.5pt/1.3 var(--mono);color:var(--ink-3);text-align:center}
.t7g{display:block;width:100%;height:auto}
.t7leg{display:flex;flex-wrap:wrap;gap:1.5mm 4mm;align-items:center;margin:-3mm 0 4mm;
       font:8.5pt/1.3 var(--mono);color:var(--ink-2)}
.t7leg i{display:inline-block;border-radius:1mm;margin-right:1.2mm;vertical-align:.3mm}
.t7leg i.gruesa{width:5mm;height:1.3mm}
.t7leg i.fina{width:5mm;height:.7mm}
.t7leg .sep{color:var(--ink-3)}
.t7leg .note{margin-left:auto}
.t7leg .k-exito{background:var(--c-exito)}.t7leg .k-fallo{background:var(--c-fallo)}
.t7leg .k-critico{background:var(--c-critico)}.t7leg .k-parcial{background:var(--c-parcial)}
.t7leg .k-pifia{background:var(--c-pifia)}
svg.nog .gr.fino{opacity:.55;stroke-width:.6}
svg.nog .t7fina{fill:none;stroke-width:1.6;stroke-dasharray:3 3;opacity:.9;stroke-linejoin:round}
svg.nog .t7gruesa{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
svg.nog .t7cruce{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3;opacity:.6}
svg.nog .t7num{font:600 10px var(--mono);fill:var(--c-exito)}
svg.nog .t7pg{stroke:var(--paper);stroke-width:1.5}
svg.nog .t7pf{opacity:.9}
svg.nog .t7fina.k-critico{stroke:var(--c-critico)}svg.nog .t7fina.k-parcial{stroke:var(--c-parcial)}
svg.nog .t7fina.k-pifia{stroke:var(--c-pifia)}
svg.nog .t7gruesa.k-exito{stroke:var(--c-exito)}svg.nog .t7gruesa.k-fallo{stroke:var(--c-fallo)}
svg.nog .t7pf.k-critico{fill:var(--c-critico)}svg.nog .t7pf.k-parcial{fill:var(--c-parcial)}
svg.nog .t7pf.k-pifia{fill:var(--c-pifia)}
svg.nog .t7pg.k-exito{fill:var(--c-exito)}svg.nog .t7pg.k-fallo{fill:var(--c-fallo)}
.t7n{font-size:8.5pt}
@media (max-width:620px){.t7cuerpo{grid-template-columns:1fr}}
.fig.auto > .fig-box{aspect-ratio:auto;display:block;padding:3mm 3mm 1mm}
.graf{margin:3mm 0 4mm;break-inside:avoid;page-break-inside:avoid}
.graf svg,.fig svg{display:block;width:100%;height:auto}
.leyenda{display:flex;flex-wrap:wrap;gap:1mm 4mm;margin:-3mm 0 5mm;font:8.5pt var(--mono);color:var(--ink-2)}
.leyenda i{display:inline-block;width:3.4mm;height:2.2mm;border-radius:.5mm;margin-right:1.2mm}
.leyenda .k-pifia{background:var(--c-pifia)}.leyenda .k-fallo{background:var(--c-fallo)}
.leyenda .k-parcial{background:var(--c-parcial)}.leyenda .k-exito{background:var(--c-exito)}
.leyenda .k-critico{background:var(--c-critico)}
.leyenda .b-g3{background:var(--ink-3)}.leyenda .b-ok{background:var(--ok)}
.leyenda .b-rd{background:var(--red)}.leyenda .b-bl{background:var(--blue)}
.fig{margin:6mm 0;border:.3mm solid var(--rule);border-radius:1.2mm;overflow:hidden;background:var(--ground);break-inside:avoid;page-break-inside:avoid}
.fig > .fig-box{width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
.fig.alta > .fig-box{aspect-ratio:4/3}
.fig.cuadrada > .fig-box{aspect-ratio:1/1}
.fig.tira > .fig-box{aspect-ratio:3/1}
.fig > .fig-box > *{max-width:100%;max-height:100%}
.fig > .fig-box:empty::after{content:attr(data-nota);font:11px/1.4 var(--mono);color:var(--ink-3);padding:4mm;text-align:center}
.fig figcaption,.fig > .fig-pie{margin:0;padding:2mm 3mm;font:9pt/1.35 var(--mono);color:var(--ink-2);border-top:.3mm solid var(--rule);background:var(--paper)}
.fig figcaption b,.fig > .fig-pie b{color:var(--cap)}

/* el menu de imprimir: dos salidas, papel o pantalla */
.printmenu{position:fixed;z-index:40;background:var(--paper);border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadow);padding:6px;width:min(310px,calc(100vw - 32px))}
.printmenu button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:8px 10px;border-radius:6px;cursor:pointer;font:600 14px/1.3 var(--serif)}
.printmenu button span{display:block;margin-top:2px;font:400 12.5px/1.4 var(--serif);color:var(--ink-3)}
.printmenu button:hover,.printmenu button:focus-visible{background:var(--ground)}
.printmenu p{margin:6px 10px 4px;font:11px/1.45 var(--mono);color:var(--ink-3)}

/* ===== los expedientes: fichas de ejemplo, una por pagina (T187) =====
   Un papel sobre la mesa del observador. La banda de los ojos la pone la
   pagina, no la imagen: igual en todas, y nitida al imprimir. */
.expediente{position:relative;margin:0;padding:5mm 6mm 4mm;background:var(--paper);border:1px solid var(--rule);box-shadow:inset 0 0 0 2.5px var(--paper),inset 0 0 0 3.2px var(--rule-2)}
.exp-cab{display:grid;grid-template-columns:70mm 1fr;gap:6mm;align-items:start}
/* frente y perfil, como una ficha policial */
.exp-fotos{display:grid;grid-template-columns:1fr 1fr;gap:2mm;margin-top:1mm;padding:2mm;background:var(--paper);border:1px solid var(--rule);transform:rotate(-1.1deg);box-shadow:0 1px 2px rgba(40,30,15,.18)}
.exp-foto{position:relative;margin:0;aspect-ratio:1/1;background:var(--ground);overflow:hidden}
.exp-foto img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover}
.exp-hueco{position:absolute;left:0;right:0;bottom:4mm;text-align:center;font:600 6.5pt/1.2 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3)}
.exp-banda{position:absolute;left:-3%;right:-3%;top:var(--ojos,36%);height:10%;transform:translateY(-50%);background:#0d0c0b;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.exp-num{margin:0 0 2mm!important;font:600 7.5pt/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
.exp-nombre{margin:0 0 2mm!important;font:800 21pt/1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.exp-concepto{margin:0 0 3mm!important;font-style:italic}
.exp-mesa{display:flex;flex-wrap:wrap;gap:1.5mm 5mm;margin:0 0 2.5mm!important;font:8.5pt/1.3 var(--mono);color:var(--ink-2)}
.exp-rejilla{margin:0!important;padding-top:2.5mm;border-top:1px dashed var(--rule);font:9pt/1.4 var(--mono)}
.exp-rejilla b{margin-right:2mm}
.exp-rejilla small{display:block;color:var(--ink-3);font-size:7.5pt}
.exp-cols{display:grid;grid-template-columns:1.3fr 1fr;gap:5mm;margin-top:4mm}
.exp-m{margin:0 0 1.5mm!important;font:600 7.5pt/1 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--ink-2)}
table.t.exp-t{margin:0}
table.t.exp-t td{padding:1.1mm 1.6mm;font-size:8.6pt;line-height:1.35;vertical-align:top}
table.t.exp-t td:first-child{font-weight:600;width:22%}
.exp-neg{color:var(--red)}
.exp-porque{margin:4mm 0 0;font-size:9.2pt;line-height:1.42}
.exp-porque dt{margin:2.2mm 0 0;font-weight:700}
.exp-porque dd{margin:0}

/* ===== v2: color por capitulo con la estructura nueva ================
   Mismas cuatro familias que paper.css, repartidas sobre el indice nuevo:
   el marco y el motor en azules, las cuatro ideas de la ficha en verdes,
   la mesa en ambares y rojos, los apendices en grises y violetas. */
.sheet[data-cap="ideas"]{--cap:#4b6ea8}
.sheet[data-cap="ch0"]{--cap:#6b7382}
.sheet[data-cap="ch1"],.sheet[data-cap="ch1-panel"]{--cap:#2a56a0}
.sheet[data-cap="ch2"]{--cap:#1f6f8b}
.sheet[data-cap="ch3"]{--cap:#2e7d6b}
.sheet[data-cap="ch4"]{--cap:#3d8a4f}
.sheet[data-cap="ch5"]{--cap:#5a7d2e}
.sheet[data-cap="ch6"]{--cap:#a8502a}
.sheet[data-cap="ch7"]{--cap:#9a6b16}
.sheet[data-cap="ch8"]{--cap:#7a3f6d}
.sheet[data-cap="apx-faq"]{--cap:#6b6257}
.sheet[data-cap="ch9"],.sheet[data-cap="ch9b"]{--cap:#5c5470}
.sheet[data-cap="apx-maquinas"]{--cap:#555f6e}

/* El arsenal del Bazar pasa de cinco columnas a ocho: Objeto, Daño, Esq,
   Abs y los tres precios (Acceso, Puntos, Llaves), y Notas se queda el resto. */
table.t.arsenal thead th:nth-child(1){width:26mm}
table.t.arsenal thead th:nth-child(2){width:15mm}
table.t.arsenal thead th:nth-child(3){width:17mm}
table.t.arsenal thead th:nth-child(4){width:16mm}
table.t.arsenal thead th:nth-child(5),table.t.arsenal thead th:nth-child(6),table.t.arsenal thead th:nth-child(7){width:11mm;font-size:6.5pt;letter-spacing:0}
table.t.arsenal td:nth-child(5),table.t.arsenal td:nth-child(6),table.t.arsenal td:nth-child(7){text-align:center}

/* ===== Hoja de referencia (apx-referencia): todo el juego en una cara =====
   El maquetador reparte los hijos de la seccion por hojas; .ref-hoja va
   entera, a dos columnas y con letra pequena, para caber en una sola. */
.ref-hoja{column-count:2;column-gap:5mm;column-rule:.25mm solid var(--rule);font-size:7pt;line-height:1.22;hyphens:auto}
.ref-hoja .ref-b{margin:0 0 1.6mm}
.ref-hoja h3{display:flex;justify-content:space-between;align-items:baseline;gap:2mm;font:700 10pt/1.15 var(--book);margin:0 0 1mm;padding-bottom:.5mm;border-bottom:.4mm solid var(--ink);break-after:avoid}
.ref-hoja h3::before{display:none}
.ref-ir{font:600 6.4pt/1 var(--mono);letter-spacing:.02em;white-space:nowrap}
.ref-ir a{color:var(--red);text-decoration:none}
.ref-hoja p{margin:0 0 .8mm}
.ref-hoja ul{padding-left:3mm;margin:0 0 .8mm}
.ref-hoja li{margin:0 0 .3mm}
.ref-hoja .tw{margin:.6mm 0 1.1mm;border-radius:.8mm;break-inside:avoid}
.ref-hoja table.t{font-size:6.5pt;line-height:1.15}
.ref-hoja table.t th,.ref-hoja table.t td{padding:.2mm 1mm}
.ref-hoja table.t thead th{font-size:5.8pt;letter-spacing:.02em}
.ref-hoja table.t td:first-child,.ref-hoja table.t th:first-child{min-width:0}
.ref-hoja table.t.ref-esc td,.ref-hoja table.t.ref-esc th{text-align:center}
.ref-n{font-size:6.5pt;color:var(--ink-3)}
.ref-hoja table.t td:last-child{overflow-wrap:normal}
.ref-hoja table.t:has(th.nw) td:last-child{white-space:nowrap}
.ref-hoja table.t thead a{color:inherit}

/* La cabecera y el pie se rellenan despues de maquetar (titulo de capitulo,
   numero de pagina). Vacios no ocupaban alto, la caja del texto se medía mas
   alta de lo que iba a ser y, al llenarse, lo ultimo de la hoja se cortaba.
   Un espacio duro en los huecos vacios les da su alto desde el principio. */
.rh span:empty::before,.pf .pn:empty::before{content:"\00a0"}

/* En pantallas estrechas (movil) Chrome agranda por su cuenta la letra de los
   bloques anchos, despues de maquetar: la hoja se mide con una letra y se pinta
   con otra, y el texto se sale por abajo. El libro es A4: sin autoajuste. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}

/* La tabla del Baul (9.1): con el coste de atencion y cuando estorba ya son

<section class="chapter" id="acelerado">
<h2>NOGUM Acelerado · Protocolo de Inmersión Inmediata</h2>
<p><em>Juega ahora. Pregúntate luego por qué funciona.</em></p>

<aside class="meta"><p>Esto es un juego completo, no un resumen. También es un anuncio gigante: al final de cada regla verás una pregunta. Si alguna te pica, el manual completo te está esperando. Si no, juega y ya está.</p></aside>

<!-- ============================ 0 ============================ -->
<h3 id="ac-arranque"><span class="hn">0</span> · Arranque</h3>
<h4>0.1 La promesa</h4>
<p>Vas a jugar en diez minutos, sin leerte doscientas páginas. Aquí no hay teoría ni explicaciones: solo reglas que funcionan. Con ellas puedes jugar a tu universo favorito, sea el que sea.</p>
<h4>0.2 Lo que necesitas</h4>
<ul>
<li><strong>Dos dados de diez caras de distinto color: uno rojo y otro azul.</strong> Cada jugador, o uno para toda la mesa.</li>
<li>Una hoja de personaje por jugador (<a href="#ac-ficha">al final de este manual</a>, con la chuleta de los modos detrás).</li>
<li>Un Director de juego que haya leído estas páginas. Los jugadores no necesitan leerlas.</li>
<li>Amigos con ganas de contar una historia juntos.</li>
</ul>
<h4>0.3 La caja negra</h4>
<p>Los jugadores no necesitan conocer las reglas. El trato es sencillo:</p>
<blockquote><p>Tú declara tu acción y tira. Yo te cuento qué pasa.</p></blockquote>
<p>El Director traduce los números a historia. Nadie en la mesa tiene que oír la palabra «modificador» si no quiere.</p>
<aside class="meta"><p>¿Te parece que al Director le toca mucho trabajo? Le toca. Es una feature, no un bug.</p></aside>

<h4 id="ac-sesion0">0.4 Antes de jugar: la sesión 0</h4>
<p>Cinco minutos antes de la primera partida, o una tarde entera: la mesa habla antes de jugar. Es lo único de este manual que no se salta.</p>
<ul>
<li><strong>Las líneas rojas de cada uno.</strong> No se impone nada que pueda hacer sentir genuinamente mal a alguien: sexo o violencia explícitos, una fobia, una atmósfera opresiva, o algo tan inocuo como el tedio. Basta con que una persona lo diga, y se puede decir en privado al Director. Lo que aparezca a mitad de partida se quita sin pedir permiso.</li>
<li><strong>Qué vamos a sentir.</strong> Qué emociones se exploran, qué aburre, qué zonas de la trama se respetan y qué soluciones pide el género.</li>
<li><strong>Quién propone.</strong> Consenso, contando siempre con quien hace el trabajo duro: el Director.</li>
<li><strong>«Esto no vale».</strong> Aquí no hay cortafuegos contra el combo barato, el que abusa de las reglas: hay una mesa que se acuerda de lo que pactó.</li>
<li><strong>Y de ahí, los números:</strong> el modo (<a href="#ac-selector">1</a>), el mundo y hasta dónde puede crecer un personaje en él, y con qué se empieza (<a href="#ac-reglas">2</a>).</li>
</ul>
<p>Las reglas trabajan para vosotros. Ignoradlas cuando os impidan hacer algo que la trama pide.</p>

<!-- ============================ 1 ============================ -->
<h3 id="ac-selector"><span class="hn">1</span> · Selector de misión</h3>
<p>Antes de empezar, el Director responde dos bloques de preguntas sobre el universo que va a jugar. No preguntes «¿a qué juego jugamos?». Pregunta «¿cómo se siente este mundo?».</p>

<h4>1.1 ¿Cuánto optimismo hay en tu mundo?</h4>
<div class="tw"><table class="t">
<thead><tr><th>Pregunta</th><th>Poco</th><th>Lo normal</th><th>Mucho</th></tr></thead>
<tbody>
<tr><td>¿El universo tiene favoritos?</td><td>Sí: los monstruos</td><td>No: a nadie</td><td>Sí: nosotros</td></tr>
<tr><td>Cuando un plan sale mal, ¿por qué es?</td><td>Porque el enemigo es competente y cruel</td><td>Porque a veces las cosas salen mal</td><td>Casi nunca sale mal; y si sale, hay una liana</td></tr>
<tr><td>¿Cómo acaban estas historias?</td><td>Sobrevivir ya es ganar</td><td>Depende de lo que hagas</td><td>Los héroes ganan</td></tr>
</tbody></table></div>
<p>Quédate con la respuesta que más se repita. Si no se repite ninguna (poco, normal, mucho), decide la primera pregunta.</p>

<h4>1.2 ¿Cuánto caos hay en tu mundo?</h4>
<div class="tw"><table class="t">
<thead><tr><th>Pregunta</th><th>Poco</th><th>Lo normal</th><th>Mucho</th></tr></thead>
<tbody>
<tr><td>¿La física es fiable?</td><td>Es un reloj</td><td>Es una película</td><td>Es una locura</td></tr>
<tr><td>¿Qué pasa cuando alguien lo hace bien?</td><td>Sale bien, siempre</td><td>Sale bien casi siempre</td><td>Puede salir bien… con un precio</td></tr>
<tr><td>¿Hay sorpresas absurdas?</td><td>Nunca</td><td>Alguna</td><td>Constantemente</td></tr>
</tbody></table></div>
<p>Quédate con la respuesta que más se repita. Si no se repite ninguna, decide la primera pregunta.</p>

<h4>1.3 Tu modo de juego</h4>
<p>Cruza tus dos respuestas en la tabla:</p>
<div class="tw"><table class="t">
<thead><tr><th>Optimismo \ Caos</th><th>Poco</th><th>Lo normal</th><th>Mucho</th></tr></thead>
<tbody>
<tr><td><strong>Mucho</strong></td><td>Optimista</td><td>Optimista</td><td>Optimista</td></tr>
<tr><td><strong>Lo normal</strong></td><td>Neutro</td><td>Neutro</td><td>Caos</td></tr>
<tr><td><strong>Poco</strong></td><td>Terror</td><td>Terror</td><td>Terror</td></tr>
</tbody></table></div>
<p>El optimismo elige el modo y el caos decide una casilla. Son cuatro, y cada uno cambia una cosa y solo una:</p>
<ul>
<li><strong>Optimista</strong> cambia <em>el dado</em>: tiras dos y te quedas el mayor.</li>
<li><strong>Neutro</strong> no cambia nada. Es la referencia.</li>
<li><strong>Caos</strong> cambia <em>de qué está hecho el resultado</em>: mismo dado, bandas más anchas y éxitos que cobran peaje.</li>
<li><strong>Terror</strong> cambia <em>lo que aguantas</em>: mismo dado que Neutro, pero tres casillas de vida en vez de nueve. De ahí le viene lo opresivo.</li>
</ul>
<p>Mira bien el tercero, porque es lo más raro y lo más importante de este manual: <strong>Caos y Neutro sacan adelante exactamente el mismo número de tiradas</strong>, un 50&nbsp;% con la ficha a cero y un 70&nbsp;% con la ficha a +2. Son idénticos hasta +3; a +4 se separan un poco, porque en Caos un 2 en el rojo sigue siendo pifia: 80&nbsp;% contra 90&nbsp;%. El caos no te hace fallar más. Cambia de qué está hecho lo que te pasa: donde Neutro reparte éxitos y fallos limpios, Caos reparte pifias, críticos y victorias con factura.</p>
<p>Y el cuarto es la otra forma de hacer daño. <strong>En Terror lo opresivo no está en los dados: está en lo frágil que eres.</strong> Tiras igual que en Neutro y aciertas igual de a menudo. Lo que cambia es que dos golpes serios te dejan fuera de combate. El manual completo llama a eso la <em>vida fractal</em> y la deja en tus manos; aquí viene puesta, para que la veas funcionar sin tener que decidir nada.</p>

<aside class="meta"><p>¿Echas de menos algún tono? ¿Un mundo que sea un reloj suizo y a la vez cruel? ¿Una ruleta rusa donde un 9 ya es un milagro? ¿Oscuro <em>y</em> caótico a la vez? Estos cuatro cubren a grandes rasgos casi todo y bastan para empezar. Y no son un invento aparte: tres son tarjetas del manual completo —Optimista es la Épica, Neutro es la Primera marcha y Caos es la Comedia negra—, y Terror es la Primera marcha con la vida corta, un asomo a una regla que allí giras tú. Allí también hay dados opresivos de verdad, tan extremos que no caben en una simplificación: Terror es un terror para todos los públicos. Cuando se te queden pequeños, ya conoces tres de las siete tarjetas.</p></aside>

<!-- ============================ 2 ============================ -->
<h3 id="ac-reglas"><span class="hn">2</span> · Reglas universales</h3>

<h4>2.1 La tirada única</h4>
<p>Tira siempre los dos dados, el rojo y el azul. Lo que cambia es cómo los lees:</p>
<div class="tw"><table class="t">
<thead><tr><th>Modo</th><th>Qué dado cuenta</th><th>Pifia</th><th>Crítico</th><th>Resultado</th></tr></thead>
<tbody>
<tr><td><strong>Optimista</strong></td><td>El <strong>mayor</strong> de los dos</td><td>Doble 1</td><td>Un 10 en cualquiera</td><td>Total 6 o más: éxito</td></tr>
<tr><td><strong>Neutro</strong></td><td><strong>Solo el rojo</strong> (el azul no cuenta)</td><td>1 en el rojo</td><td>10 en el rojo</td><td>Total 6 o más: éxito</td></tr>
<tr><td><strong>Caos</strong></td><td><strong>Solo el rojo</strong> (el azul no cuenta)</td><td>1 <strong>o 2</strong> en el rojo</td><td>9 <strong>o 10</strong> en el rojo</td><td>Total 5 o menos: fallo · 6 o 7: <strong>éxito con coste</strong> · 8 o más: éxito</td></tr>
<tr><td><strong>Terror</strong></td><td><strong>Solo el rojo</strong> (el azul no cuenta)</td><td>1 en el rojo</td><td>10 en el rojo</td><td>Total 6 o más: éxito · <strong>y solo 3 casillas de vida</strong> (2.7)</td></tr>
</tbody></table></div>
<div class="rule"><p class="rule-title">Cómo se tira</p>
<ol>
<li>Lee el dado que toque según el modo.</li>
<li>Suma tu bono (2.2). Eso es el <strong>total</strong>.</li>
<li>Compáralo con la <strong>TN 6</strong>. Siempre la misma.</li>
<li>La <strong>pifia</strong> y el <strong>crítico</strong> se miran en los dados, antes de sumar nada. Una pifia es un desastre y un crítico, algo extraordinario, tengas el bono que tengas.</li>
</ol>
</div>
<p><strong>Éxito con coste (solo en Caos).</strong> Lo consigues, pero pagas un precio. El Director elige uno:</p>
<ul>
<li><strong>Tiempo</strong>: lo logras, pero tarde; los guardias ya están en el pasillo.</li>
<li><strong>Recurso</strong>: lo logras, pero algo se rompe; el bate se astilla.</li>
<li><strong>Posición</strong>: lo logras, pero quedas expuesto; te caes de espaldas al otro lado del muro.</li>
<li><strong>Fuego amigo</strong>: lo logras, pero salpica a otro; la explosión se lleva la única radio.</li>
</ul>
<p>Mejor no «lo consigues, pero pierdes una casilla de vida». Eso es pereza.</p>

<aside class="meta"><p>Mismo personaje (+2), misma tarea. En <strong>Optimista</strong> lo consigue el 91&nbsp;% de las veces. En <strong>Neutro</strong>, el 70&nbsp;%. En <strong>Caos</strong>, también el 70&nbsp;% —leíste bien, el mismo número— pero dos de cada siete de esas veces pagando un precio, y con el doble de pifias y el doble de críticos. En <strong>Terror</strong>, otra vez el 70&nbsp;%: lo que cambia es que ahora dos golpes le dejan fuera. No has tocado la ficha en ningún momento: has cambiado la atmósfera tres veces de tres maneras distintas.</p></aside>

<h4>2.2 Los bonos</h4>
<p>Tu bono sale de tu ficha y de la situación. La ficha solo da cinco valores posibles:</p>
<div class="tw"><table class="t">
<thead><tr><th>Bono</th><th>Quién eres en esto</th></tr></thead>
<tbody>
<tr><td class="num">−2</td><td><strong>Nulo.</strong> No has puesto ni un punto en todo ese Ámbito.</td></tr>
<tr><td class="num">−1</td><td><strong>Torpe.</strong> Tienes el Ámbito, pero esa columna está vacía: vas con el pie cambiado.</td></tr>
<tr><td class="num">+1</td><td><strong>Me defiendo.</strong> Tienes una habilidad amplia que lo cubre.</td></tr>
<tr><td class="num">+2</td><td><strong>Es mi trabajo.</strong> Tienes una habilidad concreta que lo cubre.</td></tr>
<tr><td class="num">+4</td><td><strong>Gran Maestro.</strong> Nadie lo hace mejor.</td></tr>
</tbody></table></div>
<p><strong>Dificultad.</strong> Si la tarea es fácil, +2. Si es difícil, −2. Si es heroica, −4. Lo normal es 0. La dificultad se suma al bono; la TN no se mueve.</p>
<p><strong>Límites.</strong> Suma habilidad, dificultad y cualquier otro modificador: se acumula lo que se pueda, a criterio de la mesa. Si el total pasa de +4, tiras con +4, y lo que sobra puedes aprovecharlo para intentar algo más difícil y con más premio. Si baja de −2, el Director decide si hay derecho a tirada; si lo hay, se tira con −2. El bono con el que tiras queda entre −2 y +4.</p>
<p><strong>No tires por tirar.</strong> Tira solo si todos los resultados posibles son interesantes. Si fallar no aporta nada, sucede y ya está. Lo imprescindible para la historia —la pista sin la que no hay aventura— no se tira: se encuentra. Lo que se tira es cuánto sacas y a qué precio.</p>

<h4>2.3 Las habilidades</h4>
<p>Todo personaje tiene <strong>cinco Ámbitos</strong>: <strong>Físico</strong>, <strong>Mental</strong>, <strong>Social</strong>, <strong>Técnico</strong> y <strong>Arcano</strong> (la magia, los poderes psíquicos, lo sobrenatural; si tu mundo no los tiene, ignóralo). Los Ámbitos no son habilidades: son los cajones donde las guardas.</p>
<p>Cada Ámbito se parte en dos <strong>habilidades amplias</strong>, y cada una en cuatro <strong>habilidades concretas</strong>. La lista es cerrada:</p>
<div class="tw"><table class="t">
<thead><tr><th>Ámbito</th><th>Habilidad amplia (columna)</th><th>Habilidades concretas</th></tr></thead>
<tbody>
<tr><td rowspan="2"><strong>Físico</strong></td><td>Destreza</td><td>Atletismo · Acrobacia · Sigilo · Juego de manos</td></tr>
<tr><td>Vigor</td><td>Potencia · Entereza · Pelea · Armas</td></tr>

<p>Tienes <strong>12 puntos</strong>. Si algún jugador de la mesa pone algo en Arcano, <strong>todos</strong> tenéis <strong>14</strong>, también quien no lo toca: el Arcano añade diez habilidades a la ficha de todos, y nadie tiene más puntos por tener magia. Si en vuestro mundo hay magia pero no está al alcance de los jugadores, son 12. Cada escalón cuesta un punto —salvo la Firma, que cuesta dos— y para subir un escalón hay que haber pagado el anterior:</p>

<thead><tr><th>Escalón</th><th>Qué es</th><th>Ejemplos</th><th>Cuesta</th><th>Puntos acumulados</th><th>Bono</th></tr></thead>
<tbody>
<tr><td>Habilidad amplia</td><td>Media parte de un Ámbito</td><td>Destreza, Vigor, Erudición, Ingenio, Influencia</td><td class="num">1</td><td class="num">1</td><td class="num">+1</td></tr>
<tr><td>Habilidad concreta</td><td>Un oficio dentro de la amplia</td><td>Vigor → Armas · Erudición → Ciencias · Influencia → Engaño</td><td class="num">1</td><td class="num">2</td><td class="num">+2</td></tr>
<tr><td>Firma (Gran Maestro)</td><td>Tu especialidad dentro del oficio</td><td>Armas → Armas de fuego · Ciencias → Química · Acrobacia → Parkour</td><td class="num">2</td><td class="num">4</td><td class="num">+4</td></tr>
</tbody></table></div>
<ul>
<li>Cuando tires, usa <strong>solo el escalón más alto que encaje</strong>. Los escalones no se suman entre sí.</li>
<li>Una <strong>columna</strong> es cada una de las dos habilidades amplias de un Ámbito, con sus concretas debajo: en Físico, Destreza es una columna y Vigor la otra.</li>
<li>Si no has gastado nada en un Ámbito, todo lo de dentro se tira a −2 (Nulo). En cuanto compres algo en él, la columna que has tocado da sus bonos con normalidad, y todo lo que caiga en <strong>la otra columna</strong> se tira a −1 (Torpe).</li>
<li>Para ser Gran Maestro en algo, tienes que poder explicar <strong>exactamente</strong> qué haces. «Armas de fuego», sí. «Ser bueno», no.</li>
<li>Además, todo personaje tiene <strong>Estilo +2</strong>, un regalo que va fuera de los Ámbitos (2.8).</li>
</ul>

<h4>2.4 La Rejilla: de qué tamaño son tus hazañas</h4>
<p>El bono dice <strong>lo bien</strong> que haces algo. La Rejilla dice <strong>a qué escala</strong> lo haces. Cada personaje tiene un nivel por Ámbito. Pregúntate: si esto se descontrola, ¿qué sale en las noticias?</p>
<div class="tw"><table class="t">
<thead><tr><th>Nivel</th><th>Escala</th><th>Ejemplos</th></tr></thead>
<tbody>
<tr><td class="num">1</td><td>Una persona</td><td>Cualquier humano, por experto que sea: el boxeador, el profesor de química, el hacker.</td></tr>
<tr><td class="num">2</td><td>Una sala, cientos de personas</td><td>Un humano excepcional o algo que ya no lo es, solo si tu universo lo permite: el bárbaro de la estepa, el soldado del suero, la presencia del vampiro. Un soldado raso no tiene nada que hacer contra ellos.</td></tr>
<tr><td class="num">3</td><td>Un edificio, un barrio</td><td>Derribar un castillo, apagar la red eléctrica de un rascacielos.</td></tr>
<tr><td class="num">4</td><td>Una gran ciudad</td><td>Un escudo místico sobre la ciudad, un monstruo que arrasa distritos.</td></tr>
<tr><td class="num">5</td><td>Un país</td><td>Cambiar la geografía. Solo para finales de campaña.</td></tr>
<tr><td class="num">6</td><td>Un planeta, lo cósmico</td><td>Casi siempre injugable: la mayoría de universos no lo tienen, y lo que hay ahí se toca con Llaves.</td></tr>
</tbody></table></div>
<p>Si en tu mundo los números significan algo, como en los que emulan el real, cada nivel multiplica por cien tu <strong>alcance</strong>: ×1 una persona, ×100 una sala, ×10.000 un edificio, ×1.000.000 una ciudad, ×100.000.000 un país. Cuando alguien te saca un nivel no es que sea mejor que tú: es que juega con dos ceros más, y por eso no tienes derecho a tirada. En un mundo de cómic o de leyenda manda la historia: el de arriba es el tema de la historia, y la escala la pones tú, o ninguna.</p>
<p>Si no sabes qué nivel poner, <strong>los humanos son nivel 1 en todo</strong>. Lo que se mide es la escala, no la inteligencia ni los músculos: un químico genial sigue siendo nivel 1. Y si un salto de nivel te suena a cómic, es porque lo es.</p>
<div class="rule"><p class="rule-title">Cinco ideas que lo resuelven casi todo</p>
<ol>
<li><strong>La Rejilla es escala, no habilidad:</strong> ser grande en todo un Ámbito. La presencia del vampiro es un 2 en Social: entra en la sala y la sala entera queda prendada. Lo que es enorme en una sola cosa es una Llave: las sirenas, con su canto; la estrella del rock, un 1 con Llaves. La humana realista es 1 en todo, y por eso los unos abundan.</li>
<li><strong>Si algo da un permiso, anula una defensa o alcanza un nivel de Rejilla por encima, es una Llave.</strong> Venga de donde venga.</li>
<li><strong>La Parca es una Llave al daño:</strong> alcanza a quien está por encima de ti. Por eso cuesta Llaves, aunque el daño, por sí solo, no se pague.</li>
<li><strong>Lo prestado o robado dura una escena,</strong> lo use quien lo use. Pasárselo no reinicia nada.</li>
<li><strong>Lo que hace una Llave lo dice la Llave:</strong> te pone uno o varios niveles por encima, y anula lo que dice que anula, nada más. Un bazuca es una Llave al daño: te revienta si te da, pero hay que acertar.</li>
</ol>
<p>Los casos difíciles, resueltos uno a uno, están en el capítulo de la Llave del manual completo.</p></div>
<div class="rule"><p class="rule-title">El salto de poder</p>
<p>Vale para todos: jugadores y adversarios. Compara el nivel de Rejilla de quien actúa con el de aquello contra lo que actúa, en el Ámbito de la acción. Un PNJ o un monstruo tiene un solo nivel para todo, salvo que el Director diga otra cosa.</p>
<ul>
<li><strong>Si estáis al mismo nivel</strong>, se tira normal: ataque, defensa, todo.</li>
<li><strong>Si estás por encima</strong> (aunque sea un nivel), no tiras para conseguirlo: lo consigues. Si importa cómo, se tira Estilo (+2, 2.8). Eso vale también para un monstruo que ataca a personajes por debajo de él: no hay tirada, ni para dar ni para salvarse, y se narra la derrota.</li>
<li><strong>Si estás por debajo</strong>, no puedes afectar a lo que está por encima —ni un rasguño— sin una <strong>Llave</strong>. Eso incluye defenderte: contra un ataque que viene de arriba no hay tirada de defensa, salvo que tengas una Llave que valga. Con Llave se tira todo normal, con tu bono completo: no se protege dos veces.</li>
</ul>
</div>
<p><strong>La Llave.</strong> Una Llave es una razón narrativa que te permite afectar a algo de nivel superior: un bazuca, la piedra de su propio mundo, una contraseña de administrador robada, un vídeo del soborno, veinte mercenarios disparando a la vez. Te pone <strong>un nivel de Rejilla por encima</strong> del tuyo (o varios, pagando más), y en esa tirada actúas como ese nivel: si eres 1 y la Llave te pone en 2, quien está a nivel 1 no tiene derecho a tirada; contra un 2, tiras con normalidad, con tu bono completo. La que te da la ficción cubre lo que la ficción diga y dura una escena; la tuya, la que compras, cubre <strong>toda una habilidad concreta, contra cualquier objetivo</strong> (abajo). Conseguirla suele ser una aventura en sí misma.</p>
<div class="rule"><p class="rule-title">Las Llaves se compran</p>
<ul>
<li>En la creación, el <strong>bote aparte</strong> te da <strong>5 Llaves</strong>, o <strong>+1 nivel de Rejilla</strong> en un Ámbito. Con el +1, la ficha arranca en <strong>1·1·1·1·2</strong>, el punto de partida recomendado: un 2 en un Ámbito y 1 en los otros cuatro. Ese 2 solo puede ir donde el universo lo permita: en uno realista o de terror, los jugadores se quedan en 1 en todo, y el bote son 5 Llaves; si hay superhumanos, el 2 va donde los haya. Hay tres techos, y conviene no mezclarlos: el <strong>nivel máximo inicial</strong>, con el que empieza una ficha (por defecto, ese 2); el <strong>nivel máximo de los jugadores</strong>, lo más alto que un jugador puede llegar a tener en todo un Ámbito por mucho que dure la campaña; y el <strong>nivel máximo del mundo</strong>, lo más alto que existe en él (en el horror cósmico hay criaturas enormes, y tú no puedes ser una). Los tres son de Rejilla: a las Llaves es mejor no ponerles techo. Lo confirma la mesa en la sesión 0. El bote no se cambia por puntos de habilidad: todo el mundo llega con un oficio.</li>
<li>Todo esto es un punto de partida, no un límite: la mesa puede empezar más alto o más bajo, según lo que quiera emular. Lo que reparta de más o de menos antes de jugar, en puntos o en Llaves, es la <strong>experiencia de salida</strong>. Viene pensado para un mundo como el ciberpunk; uno de zombis o de horror cósmico suele pedir menos.</li>
<li>Cada Llave propia es <strong>toda una habilidad concreta, contra cualquier objetivo, para siempre</strong>: con «Armas», todo lo que haces con armas sube un nivel, también tu Firma, que va dentro. Si solo vale contra una cosa («Armas contra los vampiros»), es una Llave <strong>Limitada</strong>, más barata a partir de dos niveles; a un nivel cuesta lo mismo, así que conviene no limitarla. Puedes guardarla en blanco y escribirla la primera vez que la uses, como hacen los pregenerados; si alguien abusa, la mesa lo frena.</li>
<li>La Rejilla y las Llaves se cambian: un nivel de Rejilla en un Ámbito vale <strong>5 Llaves</strong>, sus ocho habilidades concretas por el precio de cinco. Si la historia sube la Rejilla de la mesa y tú prefieres no subir, te llevas lo que vale en Llaves (5 por un nivel de más, 20 por dos) y <strong>las gastas donde quieras</strong>.</li>
<li>Una Llave te pone <strong>un nivel de Rejilla por encima</strong>. Para subir más en la misma habilidad, la cuenta va al cuadrado: subir <em>n</em> niveles cuesta <em>n</em>² Llaves en total (1, 4, 9). Con cinco en el bote, puedes subir dos niveles en una habilidad (4 Llaves), y te sobra una.</li>
<li>Durante la campaña, el Director da <strong>una Llave por jugador y sesión</strong>. Ese grifo es el mando de potencia de la partida: con Llaves se compran también los permisos (lo que ninguna habilidad puede hacer, como volar o ver a través de las paredes: 1 Llave, a ojo de buen cubero) y los niveles por encima (idea 2). Un hechizo es uno de esos permisos: tu habilidad dice lo bien que lo lanzas y la Rejilla, a qué tamaño, pero lo que puedes hacer se paga con Llaves. El equipo, aquí, solo pide dinero (2.9).</li>
<li>Y lo que el Director te regala por una buena idea —«se te ocurre usar el agua bendita»— es una <strong>Llave prestada</strong>: sube lo que la ficción diga, dura una escena y no se paga; se apunta a lápiz y se borra al acabarla.</li>
</ul></div>
<aside class="meta"><p>¿Por qué el millonario vigilante puede plantarle cara al alien de mallas y calzoncillos con el mismo bono que un portero de discoteca? Por la Llave. En el manual completo hay un capítulo entero para bajar la Rejilla a tierra, con ejemplos de cultura pop en los cinco Ámbitos. NOGUM te espera.</p></aside>

<h4>2.5 Iniciativa</h4>
<p>Cuando empieza el combate, cada participante tira con el modo activo y suma su <strong>mejor bono en Destreza</strong> (la habilidad amplia o cualquier habilidad concreta suya). Se actúa de mayor a menor total. Si hay empate, decide el Director.</p>
<aside class="meta"><p>Si tu personaje va a usar su turno para deducir una pista, hackear una terminal o intimidar al jefe rival… ¿tiene sentido que el orden lo decida su velocidad física? ¿Quieres una iniciativa donde primero eliges tu intención (violencia, treta o especialidad) y después cómo la ejecutas? NOGUM te espera.</p></aside>

<h4>2.6 El combate</h4>
<p>El combate es una negociación agresiva. Cada ataque se resuelve en dos pasos.</p>
<div class="rule"><p class="rule-title">Paso 1 · El impacto (tira el atacante)</p>
<p>Tira tu habilidad de ataque contra la TN 6. Las circunstancias del defensor (cobertura, niebla, tamaño) cambian la dificultad. Las habilidades del defensor no cuentan aquí.</p>
<ul>
<li><strong>Pifia</strong>: no conectas y algo sale mal (te desarmas, das a un aliado…).</li>
<li><strong>Fallo</strong>: el golpe se pierde.</li>
<li><strong>Éxito</strong>: conectas. El daño del arma está en el aire.</li>
<li><strong>Crítico</strong>: conectas en zona vital: <strong>+1 al daño</strong>.</li>
</ul>
</div>
<div class="rule"><p class="rule-title">Paso 2 · La mitigación (tira el defensor)</p>
<p>Si el arma lo permite (mira sus etiquetas), el defensor hace <strong>una sola reacción</strong>: esquivar (Destreza → Acrobacia) o absorber (Vigor → Entereza), según la vía que el arma deje abierta.</p>
<p><strong>La defensa gana los empates.</strong> Los dos tiráis contra la misma TN y comparáis el <strong>nivel de resultado</strong>: pifia &lt; fallo &lt; éxito con coste (solo en Caos) &lt; éxito &lt; crítico.</p>
<ul>
<li><strong>El defensor iguala o supera</strong> el nivel de resultado del atacante: no hay daño.</li>
<li><strong>El atacante queda por encima</strong> y el defensor sacó éxito o éxito con coste: daño del arma −1.</li>
<li><strong>El defensor falla</strong>: recibe todo el daño.</li>
<li><strong>El defensor pifia</strong>: recibe todo el daño, <strong>+1</strong>; si además el ataque fue crítico, +2 en total.</li>
</ul>
</div>
<p><strong>Daño final</strong> = daño del arma (+1 por crítico del atacante, +1 por pifia del defensor) − reducción del defensor, dentro de los límites de las etiquetas.</p>
<p><strong>Peligros sin atacante</strong> (caídas, fuego, el entorno): cuentan como un ataque con éxito de su nivel; si son extremos, como un crítico; los enormes llevan La Parca con su nivel.</p>
<p><strong>Las etiquetas mandan sobre el empate.</strong> Con <span class="tag">Esq: Parcial</span> comes al menos 1 aunque iguales, y con <span class="tag">Esq: Nula</span> no hay esquiva que tirar: si el arma deja absorber, te queda la absorción.</p>
<p><strong>En Caos</strong>, un éxito con coste en combate conecta o defiende como un éxito, pero en la comparación vale un nivel de resultado menos, y el Director añade un coste del menú (el ataque conecta, pero pierdes el arma; esquivas, pero caes al suelo).</p>

<p><strong>Las armas.</strong> Toda arma, poder o peligro se describe con tres etiquetas:</p>
<div class="tw"><table class="t">
<thead><tr><th>Etiqueta</th><th>Valores</th><th>Qué significa</th></tr></thead>
<tbody>
<tr><td><span class="tag">Daño 1</span></td><td>Leve</td><td>Puños, cuchillos, pistolas ligeras, caídas cortas. «Urgencias».</td></tr>
<tr><td><span class="tag">Daño 2</span></td><td>Serio</td><td>Espadas de guerra, magnum, garras. «UCI».</td></tr>
<tr><td><span class="tag parca">La Parca</span></td><td>No es un valor de daño</td><td>Artillería, explosivos de guerra, un coche a toda velocidad. Es una Llave al daño. Lleva nivel de Rejilla, que se compara con el Físico del objetivo. Si te alcanza y estás por debajo, se te da fuera de combate, sin derecho a tirada: no hay absorción que valga. Si se puede esquivar, lo dice su etiqueta <span class="tag">Esq</span>: el francotirador que no ves (<span class="tag">Esq: Nula</span>) no se esquiva —se evita, no estando ahí—; una granada, por su área, se esquiva a duras penas: −2. A su altura hace Daño 2 y te defiendes normal, con sus etiquetas. Por encima de ella, nada sin Llave.</td></tr>

<aside class="meta"><p>¿Quieres que un arma solo pueda dañar a algo de nivel superior si es la adecuada? ¿Un catálogo de cientos de armas, poderes y vehículos de diez ambientaciones? El Bazar del Multiverso está en el manual completo.</p></aside>

<h4>2.7 La vida</h4>
<p>Todo personaje tiene <strong>9 casillas de vida</strong>, en tres bloques de tres. Cada punto de daño tacha una casilla.</p>
<div class="rule"><p class="rule-title">Salvo en Terror</p>
<p>En el modo <strong>Terror</strong> no son nueve: son <strong>3 casillas</strong>, un solo bloque. Al llenarlo estás fuera de combate. Con el daño de este manual eso significa que <strong>dos impactos serios te sacan de la escena</strong>, y que basta uno si el atacante saca crítico y no lo paras.</p>
<p>No es un interruptor que tengas que acordarte de encender. Viene con el modo, y es la única pieza de este manual que te deja asomarte a lo que el completo llama <strong>vida fractal</strong>: ahí la letalidad es un mando y lo giras tú, con tres bloques, nueve casillas o veintisiete puntos.</p></div>
<div class="tw"><table class="t">
<thead><tr><th>Bloque</th><th>Casillas</th><th>Al llenarlo</th></tr></thead>
<tbody>
<tr><td>Primero</td><td class="num">1–3</td><td><strong>−1</strong> a las acciones que la herida estorbe (un ojo hinchado, una mano rota).</td></tr>
<tr><td>Segundo</td><td class="num">4–6</td><td><strong>−3</strong> (sustituye al −1) y pierdes las acciones complejas (una pierna inútil, una hemorragia).</td></tr>
<tr><td>Tercero</td><td class="num">7–9</td><td><strong>Fuera de combate.</strong></td></tr>
</tbody></table></div>
<ul>
<li><strong>Fuera de combate no es muerte.</strong> Estás incapacitado y sales de la escena; vuelves al acabarla, y con tu vida pasa lo mismo que con la de todos (abajo). Si despiertas lo decide la historia o tu jugador, no los dados. En NOGUM ningún protagonista muere por una mala tirada: la muerte se pacta.</li>
<li><strong>La Parca, lo mismo.</strong> A quien alcanza por debajo de su nivel, se le da fuera de combate, sin derecho a tirada. Lo que venga después (una cicatriz, la locura, una transformación) se acuerda en la historia.</li>
<li>Cuando termina la amenaza y estáis <strong>a salvo</strong>, las casillas se borran. Estar a salvo no es una sensación: es estar fuera de peligro de forma objetiva, y lo declara el Director, porque solo él sabe si todavía quedan ojos acechando en la oscuridad. Y si el siguiente combate llega sin respiro, es la misma escena y siguen tachadas. Pero <strong>las heridas se quedan</strong>: el penalizador del bloque que llenaste sigue hasta que te cures (horas o días para el primero, días o semanas para el segundo).</li>
<li>Los penalizadores se suman al bono como cualquier otro modificador: si te dejan por debajo de −2, el Director decide si todavía tienes derecho a tirada (2.2).</li>
</ul>
<aside class="meta"><p>¿Te gustaría jugar a un mundo sucio donde una bala perdida te haga temer por tu vida? ¿O a un anime donde el jefe final aguanta cien golpes? ¿Y a una historia donde una mirada al abismo duele tanto como un tiro? En el manual completo, la misma ficha sirve para tres golpes y fuera, para veintisiete puntos de desgaste y para heridas en la mente y en el alma. NOGUM te espera.</p></aside>

<h4>2.8 Masillas y Estilo</h4>
<div class="rule"><p class="rule-title">La regla del Estilo</p>
<p>Todo personaje tiene <strong>Estilo +2</strong>. Cuando te enfrentas a enemigos <strong>por debajo de tu nivel</strong> en la Rejilla, o a simples masillas (el decorado de la escena), <strong>no se tira para ver si ganas: se da por hecho</strong>. Tiras con el modo activo y sumas tu Estilo para ver <strong>cómo</strong> ganas:</p>
<ul>
<li><strong>Pifia</strong>: ganas, pero haces el ridículo. Si tu personaje se toma muy en serio, puede dolerle.</li>
<li><strong>Fallo</strong> (y, en Caos, el éxito con coste): ganas, pero de forma sucia o sin lucirte.</li>
<li><strong>Éxito</strong>: ganas con estilo, limpio y espectacular.</li>
<li><strong>Crítico</strong>: legendario. Coreografía de cine, caen varios a la vez y nacen rumores.</li>
</ul>
<p>Los masillas son decorado: los declara el Director, no tienen ficha ni tirada y actúan como si estuvieran un nivel de Rejilla por debajo de vosotros, así que no te hacen daño ni se les cuentan casillas de vida. Cada tirada de Estilo tumba a uno, y con crítico a varios. Si un enemigo puede hacerte daño, no es decorado: tiene ficha rápida (3) y tira normal.</p>
</div>
<p>El Estilo encaja con el anime, el wuxia, la space opera y el cine de acción. <strong>No se recomienda en universos muy serios</strong>: en una guerra realista, hasta el último soldado tira.</p>
<aside class="meta"><p>¿Por qué el héroe barre a veinte matones y luego suda contra uno solo? En el manual completo verás cómo la Rejilla, la Llave y el Estilo se reparten el trabajo, y cómo hacer fichas de enemigos en diez segundos. NOGUM te espera.</p></aside>

<!-- ============================ 3 ============================ -->
<h4>2.9 El equipo: lo que puedes permitirte</h4>
<p>Aquí el equipo <strong>solo cuesta dinero</strong>, y el dinero es tu bono en <em>Recursos</em> (Social → Jerarquía → Recursos). Si tu cajón llega, lo tienes, sin gastar puntos ni Llaves: también la pistola o la granada, que en el manual completo piden Llaves. Lo que sí pide es sitio: tres objetos.</p>
<div class="tw"><table class="t">
<thead><tr><th>Recursos</th><th>Quién eres</th><th>Lo que llevas encima</th><th>Acceso</th></tr></thead>
<tbody>
<tr><td class="num">−2</td><td>No tienes nada y nadie te fía</td><td>Ropa, un cuchillo, lo que encuentres o te presten</td><td>0, y lo que encuentres</td></tr>
<tr><td class="num">−1</td><td>Vives al día, sin colchón</td><td>Lo básico y de segunda mano: herramientas sencillas, un arma pequeña y vieja</td><td>0</td></tr>
<tr><td class="num">+0</td><td>Un sueldo, o un grupo que te cubre</td><td>Un arma pequeña, herramientas, un trasto con ruedas</td><td>0 · 1 con esfuerzo</td></tr>
<tr><td class="num">+1</td><td>Ahorros y contactos</td><td>Un arma seria, protección ligera, un vehículo decente</td><td>1 · 2 con esfuerzo</td></tr>
<tr><td class="num">+2</td><td>Dinero de verdad, o un patrón que paga</td><td>Material militar, armadura, un vehículo blindado</td><td>2 · 3 con esfuerzo</td></tr>
<tr><td class="num">+4</td><td>Mueves presupuestos que no son tuyos y el dinero ha dejado de ser el problema</td><td>Un equipo de gente, y lo que no debería existir</td><td>3</td></tr>
</tbody></table></div>
<p><strong>Acceso</strong> es el nivel de Recursos que pide un objeto: la columna dice hasta cuál llegas, y «con esfuerzo», el escalón de más (abajo).</p>
<ul>
<li><strong>Tres objetos que importan.</strong> Lo que llevas con nombre y números en la ficha (el arma, la armadura, el vehículo) son tres objetos. Para coger uno nuevo, sueltas uno de los tres. Lo demás (ropa, linterna, cuerda) se da por hecho y no da bonos, y lo de un solo uso (una granada, un botiquín) no cuenta.</li>
<li><strong>Un escalón por encima, una vez por arco.</strong> Puedes conseguir algo que no te toca, pero no sale gratis: un favor que te van a cobrar, una deuda, un rastro, alguien que ahora sabe tu nombre.</li>
<li><strong>Lo robado o prestado funciona una escena entera.</strong> Después decides si te lo quedas, y entonces sí tiene que caber en tu cajón y entre tus tres objetos.</li>
<li><strong>El arma no te hace mejor, hace otra cosa.</strong> Lo que cambia son sus etiquetas: cuánto daño hace, si se puede esquivar y si la armadura sirve (2.6).</li>
<li><strong>La armadura sí suma:</strong> la ligera da <strong>+1</strong> y la pesada <strong>+2</strong> a tu tirada de absorción, si el arma deja absorber.</li>
</ul>
<aside class="meta"><p>En el manual completo el equipo tiene una economía entera detrás: lo que te hace <em>mejor</em> se paga con puntos de habilidad; lo que anula una defensa o te deja hacer lo <em>imposible</em>, con Llaves; el daño, gratis. Y hay un taller para ponerle precio a cualquier cosa que os inventéis. Aquí bastan el dinero y tres objetos. NOGUM te espera.</p></aside>

<p><strong>Improvisar un enemigo en diez segundos.</strong> Pregúntate si importa. Si no importa, es decorado: sin ficha ni tirada, va con Estilo y no te hace daño. Si puede hacerte daño, ya importa un poco: dale un nivel de Rejilla, una habilidad a +2 (todo lo demás a +0) y las casillas de vida que quieras que dure la pelea (3 por defecto). Si es el villano, hazle una ficha completa como la de un jugador.</p>
<p>Los PNJ tiran con el mismo modo que la mesa, y hacen una sola reacción (defensa) por cada ataque que reciben.</p>

<!-- ============================ 4 ============================ -->
<h3 id="ac-puente"><span class="hn">4</span> · ¿Quieres romper el juego?</h3>
<p>Ya tienes todo lo necesario para jugar a tu propio universo.</p>
<p>Pero habrás notado los límites. Aquí el tono es fijo: si empiezas en Optimista, juegas en Optimista toda la tarde. ¿Y si quieres que la aventura empiece como una fantasía luminosa y acabe como una pesadilla? ¿Que la escena del jefe final cambie la física a mitad de combate? ¿Que un personaje concreto viva en su propio tono?</p>
<p>En NOGUM aprendes por qué funciona cada regla de este manual, y con eso:</p>
<ul>
<li>Siete tarjetas de tono y el panel para moverlas escena a escena.</li>
<li>La vida fractal: tres bloques, nueve casillas o veintisiete puntos, con la misma ficha.</li>
<li>La iniciativa por intenciones: violencia, treta o especialidad.</li>
<li>Las barras de daño mental y espiritual, el combate social y el menú de consecuencias.</li>
<li>La lista completa de habilidades, el catálogo de Firmas, y las ventajas y lacras: los rasgos que no son habilidades, como la visión nocturna o una fobia.</li>
<li>El baúl de reglas, el Bazar del Multiverso y veinte recetas para emular los universos más famosos del rol.</li>
</ul>
<p>Allí las cosas cambian de nombre, no de sitio: la habilidad amplia se llama <strong>Dominio</strong>, y la concreta, <strong>Disciplina</strong>.</p>
<p>Pruébalo, toquetéalo y, si te gusta y te suscita preguntas, vuelve. Si quieres ver ejemplos de cómo emular universos con este motor, el manual completo te está esperando.</p>
<aside class="meta"><p>Si has llegado aquí desde el manual completo: bienvenido de vuelta. Esto es la autoescuela; allí estaba el manual de ingeniería.</p></aside>
