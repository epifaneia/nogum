<section class="chapter" id="audit-editorial">
<h2>Auditoría · Decisiones editoriales</h2>
<p>Consolidar el material ha exigido resolver contradicciones que el autor no llegó a cerrar. Cada resolución lleva un código (<span class="flag ed">ED</span>) y aparece marcada en el punto exacto del manual donde se aplica. Ninguna introduce reglas nuevas: todas eligen entre versiones que ya existían o corrigen erratas y cálculos.</p>
<div class="rule">
<p class="rule-title">Orden de autoridad</p>
<ol>
<li>La última palabra explícita del autor en la conversación (T1–T145, del 10 de febrero al 24 de mayo).</li>
<li>El texto del propio autor: el cuerpo del borrador (<em>NOGUMdraft</em>, 18 de febrero) y su texto sobre combate, este último solo donde nada posterior lo sustituye.</li>
<li>Los textos del asistente que el autor aprobó («me encanta», «queda», «dale»).</li>
<li>Las propuestas del asistente que el autor nunca validó. Solo aparecen marcadas con <span class="flag proposal">Propuesta sin validar</span>.</li>
</ol>
</div>

<h3 id="ed-nucleo">Decisiones del núcleo (capítulos 1–7)</h3>
<div class="tw"><table class="t">
<thead><tr><th>Código</th><th>Conflicto</th><th>Resolución</th><th>Base</th><th>Dónde</th></tr></thead>
<tbody>
<tr><td class="num"><span class="flag ed">ED-1</span></td><td>Críticos: la «Regla del Margen de 4» (superar el TN en más de 4; <span class="src">T30–T31</span>) y las tarjetas del borrador que leían «10+» tras bonos, frente al «10 natural en cualquier dado, no depende del bono» del propio borrador (1.3) y de <span class="src">T131</span>.</td><td>Pifia y crítico se leen siempre en los dados naturales.</td><td>La herramienta de caos «ampliar los rangos de crítico y pifia» solo tiene sentido con lecturas naturales; <span class="src">T21</span> «la pifia es siempre pifia»; <span class="src">T131</span>.</td><td><a href="juego.html#ch1-panel">1.4</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-2</span></td><td>La Tarjeta Terror del borrador marcaba la pifia en «2–3 naturales», copiado de las tarjetas de suma.</td><td>Pifia = el dado bajo es un 1 (19 %). Crítico = doble 10 (1 %).</td><td>Simetría con la Tarjeta Héroe (<span class="src">T21, T131</span>).</td><td><a href="juego.html#tono-pp">Tarjeta 4</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-3</span></td><td>Tono por defecto: el asistente proponía la Épica Clásica (mejor de 2d10); el borrador del autor (7.2), «un solo dado, sin curvas».</td><td>El tono por defecto es la Tarjeta 0 (1d10, TN 6, daño de nivel 2). Se añade como tarjeta porque el borrador la describe, pero no la imprimía.</td><td>Borrador 7.2 y 1.3 («caos neutro: leemos solo el rojo»).</td><td><a href="juego.html#tono-nn">Tarjeta 0</a>, <a href="juego.html#ch8-defecto">7.2</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-4</span></td><td>El caso A del borrador sumaba mal (la rama de Pistolas costaba 4) y usaba un modelo concreto como Firma de +4.</td><td>La rama cuesta 3 y el +4 es la misma Firma con su segundo punto. El punto sobrante va a Destreza.</td><td>Un punto = +1 (<span class="src">T101–T103</span>); sin modelos concretos (<span class="src">T49</span>).</td><td><a href="juego.html#ch5-salida">3.5</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-5</span></td><td>La escala de TN 4/6/9/12/15 y el techo de +6 (asistente) frente a la dificultad como modificador +2/0/−2/−4 y el anclaje −2…+4 (borrador).</td><td>Vale el borrador: el TN lo fija la tarjeta y la dificultad es un modificador. El bono total se mueve siempre entre −2 y +4.</td><td>Borrador 1.3 y 4.1.</td><td><a href="juego.html#ch2-bonos">4.1</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-6</span></td><td>La regla del salto de poder se titulaba «(+/−2)».</td><td>Basta un nivel de diferencia.</td><td><span class="src">T57</span>: «Dos no. Con uno es suficiente».</td><td><a href="juego.html#ch3-estilo">4.5 A</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-7</span></td><td>Dos versiones de la Regla del Estilo en el borrador: en 4.5, «diferencia 0 o 1» con cuatro resultados; en 6.2, «por debajo de tu nivel» con tres.</td><td>Se usa el disparador de 6.2 con la tabla de cuatro resultados. El Estilo es un +2 fijo de la ficha.</td><td><span class="src">T113</span> (corrección del autor).</td><td><a href="juego.html#ch3-estilo">4.5 B</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-8</span></td><td>Momento en que actúa quien cambia de disposición: el autor dijo «vas el último» y el asistente escribió «en el siguiente intercambio».</td><td>Va el último en la ronda en curso.</td><td><span class="src">T85, T129</span>.</td><td><a href="juego.html#ch6-iniciativa">5.1</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-9</span></td><td>La esquiva parcial se describía como «recibes la mitad o un mínimo de 1».</td><td>Aunque mitigues, recibes como mínimo 1 punto (sin mitades).</td><td>Simplicidad: la única aritmética del combate es el +1 del crítico (<span class="src">T129</span>).</td><td><a href="juego.html#ch5-armas">5.3</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-10</span></td><td>El Bazar usa valores de esquiva «Difícil» y «Fácil» que no estaban en la leyenda.</td><td>Difícil = −2 a la tirada de esquiva; Fácil = +2.</td><td>Así aparecen en varios ítems (<span class="src">T68–T70</span>).</td><td><a href="juego.html#ch5-armas">5.3</a>, <a href="juego.html#apx-bazar">8.3</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-11</span></td><td>El índice del autor dice «daño social» y el texto y la conversación, «mental».</td><td>Se mantiene la barra Mental; los ataques sociales van a ella por defecto. Cada campaña puede crear o renombrar barras.</td><td>Borrador 5.5; <span class="src">T137</span>.</td><td><a href="juego.html#ch6-dano">5.5</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-12</span></td><td>«Colapso: muerte» y «umbral 3: muerte, locura o transformación», frente a «nadie muere por una mala tirada».</td><td>El umbral 3 deja al personaje fuera de combate. La muerte, la locura o la transformación solo ocurren si se pactan.</td><td>Manifiesto; texto del autor sobre combate («nunca los dados»).</td><td><a href="juego.html#ch6-vida">5.4</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-13</span></td><td>El diagnóstico del 7.1 asociaba el optimismo neutro a «sumar 2d10».</td><td>Neutro = un solo dado; la suma es la herramienta del orden (caos bajo).</td><td>Borrador 1.3; <span class="src">T14</span>.</td><td><a href="juego.html#ch8-diagnostico">7.1</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-14</span></td><td>«Del 80 % al 30 %» al bajar el optimismo.</td><td>Para un +2 contra TN 6: del 91 % (mejor de 2d10) al 49 % (peor de 2d10).</td><td>Cálculo exacto (Apéndice D).</td><td><a href="juego.html#ch8-disonancia">7.4</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-16</span></td><td>La Disciplina Armas solo cubría el cuerpo a cuerpo, pero el propio borrador cuelga de ella la Firma «Pistolas».</td><td>Armas cubre el cuerpo a cuerpo y la distancia.</td><td>Caso A del borrador; Firmas «Armas de fuego» y «Armas melé» (<span class="src">T98</span>).</td><td><a href="juego.html#ch2-lista">3.2</a>, <a href="juego.html#ch9-skills">8.2</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-17</span></td><td>El esbozo inicial de combate: la dificultad de la esquiva sumaba el margen del atacante y la absorción dependía del margen del defensor.</td><td>Tirada fija contra el TN: éxito −1, crítico −2.</td><td><span class="src">T45</span> («te compro tu apunte»); <span class="src">T129</span>.</td><td><a href="juego.html#ch6-golpes">5.2</a></td></tr>
</tbody></table></div>

<h3 id="ed-apendices">Decisiones de los apéndices y de NOGUM Acelerado</h3>
<div class="tw"><table class="t">
<thead><tr><th>Código</th><th>Resolución</th><th>Dónde</th></tr></thead>
<tbody>
<tr><td class="num"><span class="flag ed">ED-15</span></td><td>El modo Agobio de Acelerado usa las bandas de la Tarjeta Pulp sobre el dado bajo: 5 o menos, fallo; 6–7, parcial; 8 o más, éxito. El autor dijo «peor dado + éxito parcial», pero no fijó los números.</td><td><a href="acelerado.html#ac-reglas">Acelerado</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-A1</span></td><td>El selector de misión de Acelerado cruza los ejes así: optimismo alto → Épico; optimismo bajo → Agobio; optimismo normal → Neutro, salvo con mucho caos, que pasa a Agobio.</td><td><a href="acelerado.html#ac-selector">Acelerado</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-B1</span></td><td>Los objetos del Bazar con etiquetas antiguas (Tipo C, [Inevitable], «daño sucio → agravado») pasan a la ficha explícita.</td><td><a href="juego.html#apx-bazar">8.3</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-B2</span></td><td>NOGUM nunca añade dados. «+1 dado» y «Motor: mejor de 2d10» pasan a «la tirada usa el mejor de 2d10»; «Motor: caos alto» pasa a la Tarjeta 5; «Acción extra» es un efecto.</td><td><a href="juego.html#apx-bazar">8.3</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-B3</span></td><td>Ningún objeto mata por reglas: «muere» pasa a «queda fuera de combate» o «sale de la historia».</td><td><a href="juego.html#apx-bazar">8.3</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-R1</span></td><td>El Pacto del diablo del Baúl: en vez de «+1 dado», la acción usa el mejor de 2d10 y lleva un coste garantizado.</td><td><a href="juego.html#ch9-baul">8.1</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-R2</span></td><td>Cambiar de funda (cuerpo) daña la barra Espiritual, rebautizada Identidad, porque su colapso es pasar a PNJ.</td><td><a href="juego.html#ch9-baul">8.1</a>, <a href="juego.html#ch9b">8.4</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-R3</span></td><td>La Firma «Cazas estelares» pasa de Pilotaje a Vuelo.</td><td><a href="juego.html#ch9-skills">8.2</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-R4</span></td><td>La «fragilidad máxima» de la receta 14 es el zoom Letal.</td><td><a href="juego.html#ch9b">8.4</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-R5</span></td><td>Mundodisco: «suma + caos alto» pasa a la Tarjeta 5. La «ley del millón a uno» se expresa como modificador (+2 Fácil frente a +0 Estándar).</td><td><a href="juego.html#ch9b">8.4</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-M</span></td><td>Cifras de la conversación corregidas con el cálculo exacto.</td><td>aplicadas en todo el libro</td></tr>
</tbody></table></div>

<h3 id="ed-cerradas">Decisiones cerradas por el autor después de la consolidación</h3>
<div class="tw"><table class="t">
<thead><tr><th>Tema</th><th>Decisión</th><th>Dónde</th></tr></thead>
<tbody>
<tr><td>Siglas de NOGUM</td><td>Son una broma interna con dos lecturas. La oficial es pedante: <em>Narrative Ontology &amp; General Universal Mechanics</em> en inglés y <em>Narrativa Ontológica General Universal y Metafísica</em> en español. La real es en coña: <em>Nos Olvidamos de Guardar Una Mesa</em>, <em>Narrativa Orgánica para Gamers Ultra Motivados</em> o <em>No Otro Gato Usando Magia</em>; en inglés, <em>No One Gets Ur Mechanics</em>, <em>Not Our Game, U Mad?</em> o <em>Narrative Orgasm Generates Ultimate Mayhem</em>. La edición española lleva el título pedante en inglés y debajo la broma en español; la inglesa, al revés.</td><td>Portadas de la Tesis y del Juego completo</td></tr>
<tr><td>Marcador de disposición</td><td>Cada ficha completa lleva un marcador de disposición (Violencia, Treta, Especialidad). Si la mesa no elige antes de actuar, vale la última marcada. Es un recordatorio, no una regla nueva.</td><td><a href="juego.html#ch6-iniciativa">5.1</a></td></tr>
<tr><td>Subir de nivel de Rejilla</td><td>No cuesta puntos. Sube con la campaña, pactado narrativamente. La Rejilla cambia el universo, no la competencia; la competencia se mejora con bonificadores, dones y lacras.</td><td><a href="juego.html#ch3-ambitos">2.4</a>, <a href="juego.html#ch5-progreso">3.6</a></td></tr>
<tr><td>El cuadrante de siete tarjetas</td><td>El panel de seis tarjetas más recetas queda sustituido por siete tarjetas repartidas en un cuadrante de nueve sitios, con <strong>dos huecos a la vista</strong>. Antes, dos pares de casillas eran mecánicamente idénticas (optimista previsible = optimista neutral; opresivo neutral = opresivo caótico) y el eje del caos no hacía nada en cuatro de las nueve. Ahora una palanca por columna y la fila elige la dirección.</td><td><a href="juego.html#ch1-panel">1.4</a>, <a href="juego.html#maq-cuadrante">1.3 I</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-18</span></td><td><strong>Regla única de naturales.</strong> «Mira el número que vas a usar: si es 1, pifia; si es 10, crítico.» Reproduce exactamente las cifras anteriores (mejor de dos: 1&nbsp;% y 19&nbsp;%, que era «doble 1» y «cualquier 10»; peor de dos: 19&nbsp;% y 1&nbsp;%) y elimina los casos especiales. La suma conserva su línea: 2–3 y 19–20. El autor descartó la versión literal (2 y 20, al 1&nbsp;%) porque dejaba a la Realista sin un solo momento memorable por sesión.</td><td><a href="juego.html#ch1-panel">1.4</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-19</span></td><td><strong>La dificultad no es palanca de tono.</strong> Un número por lectura (6 y 11) y se acabó: mover la TN por escena es justo la fricción que el juego promete quitar. El tono se construye con las otras cuatro palancas. Solo las recetas explícitas la tocan (Tragedia, suma vs TN 14).</td><td><a href="juego.html#maq-palancas">1.3 G</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-20</span></td><td><strong>El centro del eje es la costumbre, no la objetividad.</strong> La columna central es el dado plano porque es lo que hace casi todo el hobby (d20, d100), no porque sea el punto medio estadístico: de hecho es la lectura más aleatoria de todas. Decisión explícita del autor: el eje mide la distancia respecto a lo que la mesa espera.</td><td><a href="juego.html#maq-palancas">1.3 G</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-21</span></td><td><strong>El centro caótico lleva las dos herramientas.</strong> Ni el ruido ni la zona de roce inclinan el tono, así que en la única casilla sin dirección se aplican juntas: pifia 1–2, coste 5–6, crítico 9–10. Resultado: los cinco resultados al 20&nbsp;%, la única distribución uniforme del juego. Esto cierra la duda histórica de las dos tarjetas (Pulp/Drama y Gonzo) que compartían casilla.</td><td><a href="juego.html#tono-nc">1.4</a></td></tr>
<tr><td>La esquina opresiva se queda como está</td><td>La Pesadilla mantiene el ruido: 36&nbsp;% de pifias y techo del 64&nbsp;% para el gran maestro. El autor decide no suavizarla y avisar en el manual: lo opresivo tiene público, aunque sea minoritario, y el terror bien jugado se juega en una noche, no en una campaña de un año.</td><td><a href="juego.html#tono-pc">1.4</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-15</span> (revisada)</td><td>Las bandas de Agobio en Acelerado pasan a ser la zona de roce del manual completo: fallo ≤4, coste 5–6, éxito 7+ sobre el dado menor. Deja de estar pendiente de confirmación. Consecuencia: un profesional (+2) sale adelante el 64&nbsp;% de las veces, y un 36&nbsp;% sin pagar nada.</td><td><a href="acelerado.html#ac-reglas">Acelerado</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-23</span></td><td><strong>Dónde va el éxito con coste.</strong> En la TN y el punto de encima (total 6 o 7 con TN 6), nunca un punto más abajo. La versión anterior, en 5–6, ascendía un fallo a éxito con coste: regalaba partidas. Colocada arriba, la banda <strong>no cambia cuántas veces sales adelante</strong>, solo cuántas de esas veces pagas, que es lo que hace la herramienta de la que viene.</td><td><a href="juego.html#ch1-panel">1.4</a>, <a href="juego.html#maq-palancas">1.3 G</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-24</span></td><td><strong>El crítico amplifica; la pifia ramifica.</strong> Una sorpresa buena va donde ya ibas y no obliga a nadie a inventar nada; una mala cierra la puerta que usabas y abre otra que no estaba. De ahí que la misma palanca añada previsibilidad hacia arriba y caos hacia abajo, y que en la fila opresiva el caos entre por la pifia en vez de por el coste: el peor de dos ya lo trae puesto.</td><td><a href="juego.html#maq-palancas">1.3 G</a></td></tr>
<tr><td>Las siete, cerradas</td><td>Cada tarjeta caótica sale adelante exactamente igual de a menudo que su compañera de fila; lo único que cambia es el precio. Y la cuenta que decide si una tarjeta aguanta una campaña es cuánto tiene que improvisar el DJ: 1&nbsp;% en Épica y Angustia, 3&nbsp;% en Realista, 10&nbsp;% en Primera marcha, 19&nbsp;% en Pesadilla, 24&nbsp;% en Pulp y 40&nbsp;% en Comedia negra.</td><td><a href="juego.html#maq-cuadrante">1.3 I</a></td></tr>
<tr><td>El caos frustra</td><td>Decisión del autor: decirlo en el manual con todas las letras. La columna caótica solo funciona si la mesa ha acordado que se persigue la historia y no el éxito. Y la Angustia necesita su propia instrucción: que el fallo reste siempre algo, o el desgaste se vuelve tedio.</td><td><a href="juego.html#ch1-panel">1.4</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-25</span></td><td><strong>La defensa gana los empates.</strong> Se comparan niveles, no totales, así que la tirada enfrentada sigue retirada (ED-17). Si el defensor iguala al atacante no hay daño; si el atacante queda por encima, −1; si el defensor pifia, el ataque sube un escalón. Las etiquetas mandan sobre el empate, y ahí está la diferencia entre un duelo y un tiroteo. Consecuencia medida: con la Primera marcha y los dos a +1, el defensor iguala o supera el 68&nbsp;% de las veces, de modo que las peleas con esquiva Total se vuelven coreografía larga y las armas con Esq Nula o Parcial recuperan el miedo.</td><td><a href="juego.html#ch6-golpes">5.2</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-26</span></td><td><strong>El Estilo nunca cuesta.</strong> En las tarjetas con éxito con coste, esa banda se lee como éxito en la tirada de Estilo: se tira precisamente cuando ya no se puede fallar. Se reescriben los cuatro resultados con las palabras del autor y se retira el daño de estrés por ridículo que proponía el borrador.</td><td><a href="juego.html#ch3-estilo">4.5</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-27</span></td><td><strong>Qué cubre una Llave.</strong> Una Disciplina para siempre, o un Ámbito entero durante una escena, y se elige la forma al comprarla. La Llave ancha se ata a una escena y no a un enemigo, por el argumento del autor: un monstruo que vuelve cuando ya sabes cómo matarlo ha dejado de ser un antagonista, y si vuelve cambiado ya no es el mismo. De paso, la escena queda consagrada como unidad de tiempo del juego: tono, Estilo, Llave ancha y arma robada se miden todos en escenas.</td><td><a href="juego.html#ch4-llave">2.3</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-28</span></td><td><strong>Llave propia y Llave prestada.</strong> La comprada es permanente y se escribe; la que regala el Director por una buena idea dura una escena y no se apunta. Así el Director puede seguir premiando el ingenio sin inflar la ficha. El traspaso es una transacción, no un préstamo: el dueño libera y el otro paga de su monedero.</td><td><a href="juego.html#ch4-llave">2.3</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-29</span></td><td><strong>El ×100.</strong> Cada nivel de Rejilla multiplica por cien el alcance: persona, sala, edificio, ciudad, país ya eran los peldaños; el número solo se pone delante. Se escribe como <em>alcance</em> y no como literalidad, para que nadie pregunte cuánto peso levanta un Físico 2. Con el número puesto, «un nivel de diferencia decide sin tirar» deja de parecer arbitrario: son dos ceros.</td><td><a href="juego.html#ch3-ambitos">2.4</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-30</span></td><td><strong>Techo de Rejilla por universo.</strong> El nivel inicial lo pone la campaña y el techo lo pone el género. Las veinte recetas traen su techo por ámbito, y la Llave es la excepción pactada. Es la palanca que faltaba para que la emulación se notara fuera del tono y del equipo: en cyberpunk no existe un ingenio por cien, pero sí el exploit contra <em>esa</em> IA.</td><td><a href="juego.html#ch9-recetas">8.4</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-31</span></td><td><strong>12 puntos, 14 con Arcano, y el bote aparte.</strong> La proporción es la razón: 40 casillas sin magia y 50 con ella dejan la misma escasez. El bote (+1 de Rejilla en un ámbito <em>o</em> 5 Llaves) no se cambia por puntos en ninguna dirección, para matar al héroe de Rejilla sin oficio. Y la elección no es neutra: diez casillas por cinco monedas contra una por una, «la libertad se paga al doble». Los 10 puntos del borrador quedan superados.</td><td><a href="juego.html#ch5-salida">3.5</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-32</span></td><td><strong>La escalera cuadrada.</strong> Subir <em>n</em> niveles contra la misma cosa cuesta <em>n</em>² Llaves, con la escalera llana (3<em>n</em>−2) como regla opcional para quien quiera divinidad a plazos. Coinciden en 1 y 4, que es donde juega casi todo el mundo. Efecto que no hace falta escribir como prohibición: con cinco Llaves en el bote, nadie empieza por encima de +2.</td><td><a href="juego.html#ch4-llave">2.3</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-33</span></td><td><strong>Los dos monederos.</strong> La experiencia deja de ser un contador: puntos de habilidad y Llaves son dos bolsas independientes, con la misma pregunta de velocidad hecha dos veces. El hallazgo que ordena el capítulo: los puntos saturan porque el Ancla corta en +4, y las Llaves no saturan nunca. De ahí la frase de cabecera: si quieres que la campaña escale, abre el grifo de las Llaves, no el de los puntos.</td><td><a href="juego.html#ch5-progreso">3.6</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-34</span></td><td><strong>Los tres cerrojos del equipo.</strong> Dinero (el Acceso en Recursos, escrito en la ficha técnica), permiso narrativo y Llaves si el objeto rompe la Rejilla. Cierra un agujero clásico —una pistola de catálogo regalaba lo que un personaje paga con nueve Llaves— y convierte el saqueo en una decisión: lo robado funciona una escena gratis y luego se paga o se deja.</td><td><a href="juego.html#ch5-equipo">4.3</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-35</span></td><td><strong>La lacra es la cicatriz de un bloque lleno.</strong> Dones y lacras no se compran: aparecen cuando se llena un bloque de la barra Mental o Espiritual y el personaje se cura. Eso ata la vida fractal con la ficha y obliga a escribir lo que faltaba, que era qué hace de verdad el daño mental y el espiritual bloque a bloque.</td><td><a href="juego.html#ch6-dano">5.5</a></td></tr>
<tr><td>El Bazar dice lo que cuesta</td><td>Los 294 objetos llevan <span class="tag">Acceso 0–3</span> derivado del daño y de la rareza en una sola pasada, y los doce que rompen la Rejilla llevan además su precio en Llaves. Las tablas de poderes —la Fuerza, el ki, las disciplinas, los superpoderes, los toon y el arsenal social— se quedan sin Acceso a propósito: no se compran con dinero, describen lo que ya eres. De paso se completaron 22 fichas técnicas que el borrador había dejado a medias.</td><td><a href="juego.html#apx-bazar">8.3</a></td></tr>
<tr><td>Las recetas eligen de verdad</td><td>El remapeo mecánico de las tarjetas había dejado frases que ofrecían la misma tarjeta dos veces («Épica o Épica»). Revisadas una a una, con una elección real y un contraste en cada caso. La predicción del autor se cumple con una excepción, y es la buena: <strong>la única receta de las veinte que usa la fila opresiva es la de Cthulhu</strong>, con Angustia, cuyos porcentajes reproducen el reparto del género.</td><td><a href="juego.html#ch9-recetas">8.4</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-36</span></td><td><strong>Tres monedas, tres cosas distintas.</strong> Recursos paga tenerlo, los puntos pagan que te haga mejor y las Llaves pagan que te deje hacer lo imposible. La decisión del autor que lo ordena todo: el bono de la cota de malla se paga con <em>puntos</em>, no con Llaves, porque en su mundo una cota no tiene nada de extraordinario y lo que te da es exactamente lo que te habría dado entrenar. Con eso el Bazar entero se vuelve usable: casi todo cuesta solo dinero, y solo pagas de un monedero cuando el objeto te mejora o rompe el techo.</td><td><a href="juego.html#bz-fabrica">8.3</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-37</span></td><td><strong>El Ajuste.</strong> Limitado, Completo, Potenciado y Desatado no son cuatro potencias del mismo poder: son el corrector de lo que el desglose no sabe decir, y multiplican ÷2, ×1, ×2 y ×3 sobre puntos y Llaves. Con dos salvaguardas que el autor pidió implícitamente al describirlo como subjetivo: <strong>solo paga lo que la cuenta no ha pagado ya</strong>, y se puede volver a etiquetar si el juego demuestra que estaba mal tasado. El ejemplo de la invisibilidad —capa, a voluntad, indetectable— enseña la propiedad bonita: la etiqueta se retira sola en cuanto la cuenta sabe describir el poder.</td><td><a href="juego.html#bz-fabrica">8.3</a></td></tr>
<tr><td>El taller y las piezas sueltas</td><td>Las reglas de fabricación van <strong>delante</strong> del catálogo, que pasa a ser una tabla de equivalencias: miras lo que cuesta algo parecido y extrapolas. Detrás van 53 piezas genéricas sin ambientación —12 armas, 10 defensas, 10 vehículos y 21 artefactos y poderes— con el precio hecho en las tres monedas, y un índice cruzado que ordena los 347 objetos por categoría y por Acceso. Las dos últimas filas de la tabla de poderes son trampas a propósito: «saber si te mienten» es Empatía y «ver el instante siguiente» son dos bonos; ninguna de las dos es un poder.</td><td><a href="juego.html#bz-piezas">8.3</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-38</span></td><td><strong>El acordeón.</strong> Regla del autor que se había quedado perdida en la conversación y que resuelve el agujero más grande que le quedaba a la progresión: con el Ancla cortando en +4, los puntos solo compraban anchura y no tenían meta. Ahora tres Firmas de Gran Maestro pliegan la Disciplina entera, tres Disciplinas el Dominio y los dos Dominios el Ámbito, a 8, 22 y 44 puntos. No sube el techo: lo ensancha. Y deja los dos monederos con escaleras largas distintas y complementarias —las Llaves suben hacia fuera, los puntos hacia dentro—, que es la clase de simetría que este sistema llevaba pidiendo desde el capítulo 2.</td><td><a href="juego.html#ch2-firmas">3.3</a></td></tr>
<tr><td>Las 200 Firmas y las seis tablas</td><td>El catálogo de Firmas vivía solo en la app mientras el manual prometía mil y no traía ninguna: ahora el 8.2 lleva las doscientas, cinco por Disciplina y bilingües, ordenadas por Ámbito, con lo que se cierra también la vieja pregunta de cómo agruparlas. Y las cuatro tablas que las recetas invocaban sin que existieran son ahora seis, escritas como el autor las pidió: ejemplos de problemas separados por género, no un sistema. Las heridas vienen en dos sabores (de aventura y sucia), la de locura lleva su aviso de mesa por delante, y la barra Espiritual trae los tres nombres que usa según el género: Corrupción, Empatía y la Bestia.</td><td><a href="juego.html#ch9-tablas">8.1</a></td></tr>
<tr><td class="num"><span class="flag ed">ED-39</span></td><td><strong>El nombre lo pone el género; la barra la pone la causa.</strong> Corrección del autor sobre un borrador que colgaba Empatía e Identidad de la barra Espiritual por costumbre. Hay tres barras —Cuerpo, Mente y Espíritu— y el género puede rebautizarlas, pero no elegir de cuál cuelgan. El caso que lo enseña es la Humanidad: en el gótico hay una Bestia dentro y eso es Espíritu; en cyberpunk no hay nadie dentro, la ciberpsicosis es una locura, y eso es Mente. Y el corolario que ordena medio capítulo 8: <strong>sin Arcano no hay barra Espiritual</strong>, igual que no hay Ámbito.</td><td><a href="juego.html#ch6-dano">5.5</a></td></tr>
<tr><td>Seis decisiones del autor</td><td>Caen de una tacada: <strong>no hay versión en ×10</strong> de la Rejilla (un salto de diez es lo que ya separa el −2 del +4, y si el ×100 se sale de madre la respuesta es dejar a todos en Rejilla 1 y jugar con los puntos); el reparto inicial es <strong>[2,1,1,1,1]</strong> con el 2 obligado al Ámbito que el universo permite, <strong>y si no lo quieres, 5 Llaves</strong>; la tabla de cultura pop queda aprobada; <strong>un crítico de Estilo no cura</strong>; <strong>nada de iniciativa fija</strong>, también los PNJ declaran guardia y tiran; y <strong>siempre se absorbe con la habilidad</strong>. De paso, la Sed del gótico deja de ser combustible: es <strong>ansia</strong>, va en la barra Mental y se juega como un síndrome de abstinencia, que es lo que de verdad da escena.</td><td><a href="juego.html#ch3-ambitos">2.4</a></td></tr>
<tr><td>El acta del taller</td><td>Veintisiete decisiones y noventa y cuatro nombres, contestados de una tacada y aplicados. Lo que más cambia el juego: el <strong>flashback se tira</strong> en vez de pagarse, la <strong>transformación</strong> dura siempre lo que la escena, el <strong>daño ambiental</strong> sube mientras te quedas, y en el gótico desaparece la escalera de Generaciones: <strong>todos los vampiros son Rejilla 2</strong>, un humano sin Llave pierde automáticamente, y lo que distingue a un neonato de un matusalén son Llaves y no niveles. Y la <strong>Identidad</strong> deja de poder retirar una ficha: hay terapia, y vuelves siendo otro personaje.</td><td><a href="juego.html#ch9-tablas">8.1</a></td></tr>
<tr><td>El barrido de marcas, hecho</td><td>Noventa y cuatro nombres con dueño fuera, en los dos idiomas, con los sustitutos que eligió el autor. De unas mil ciento setenta menciones quedan veintiocho, y todas son seguras: el género «cyberpunk», la palabra «paranoia» como condición de locura, 1984, Chernóbil y el cóctel Molotov, que no es una marca sino un apodo histórico. El índice del Bazar se regenera solo, así que cambiar un título de ambientación arregló de golpe sus veintitrés filas.</td><td><a href="juego.html#apx-bazar">8.3</a></td></tr>
<tr><td>Las veinte, cerradas</td><td>Sale la 15, «Cazadores adolescentes», porque mecánicamente repetía la 14: gente corriente que no puede tocar al monstruo hasta que encuentra su Llave. Entra <strong>«El mundo sostenido por quelonios» como receta 20</strong>, con su diagnóstico intacto. Y la sección de crítica y mejora estrena la del ciberpunk: el género pedía Comedia negra y se emuló con un motor realista y letal, y con esas reglas la mesa aprende que lo rentable es no arriesgar — una partida de cromo donde nadie arriesga es una partida de contabilidad. La letalidad no se quita: se mueve al zoom y a las etiquetas.</td><td><a href="juego.html#ch9-recetas">8.4</a></td></tr>
<tr><td>El menú de la pifia</td><td>Seis puertas para no improvisar a pelo cuando una de cada cinco tiradas se estrella: se cierra un camino, se gasta algo que no se repone, dejas un rastro, la amenaza se acerca, se rompe lo que llevas, alguien se fija en ti. Con la regla de tamaño: en la columna previsible la pifia cierra una puerta; en la caótica abre una rama.</td><td><a href="juego.html#ch6-golpes">5.2</a></td></tr>
<tr><td>Cuatro formularios, y las preguntas son situaciones</td><td>El asistente unico se parte en cuatro modulos y deja de preguntar en términos técnicos. Cada pregunta es una escena con <strong>cinco respuestas escritas</strong>, de «​obedecer: alguna bala cae fija» a «​atacar: ¡por fin un reto!», y con los tres pasos de en medio escritos también, que es donde vive el matiz. Cuando la pregunta es estar de acuerdo o no, la escena se lee entera y se contesta con una <strong>barra que se desliza</strong>. El contador <strong>no se enseña</strong>: suma a escondidas por sector, tres preguntas cada uno (dos situaciones distintas y una frase final que dice el extremo alto en voz alta), y solo se ve el resultado al cerrar el sector. <strong>1 · El tono</strong> saca caos, optimismo y barra de vida. <strong>2 · El universo</strong> deduce la época de los tropos en vez de preguntar por el año. <strong>3 · El Baúl</strong> empieza delimitando: «¿te gusta la chicha?», y un primer no quita de un plumazo las ocho reglas que piden llevar un número, mientras un segundo no rotundo deja la partida con cero. <strong>4 · El equipo</strong> abre ahora con un <strong>buscador de palabra clave</strong> que mira el nombre y lo que hace cada objeto, sin acentos ni mayúsculas, dentro del equipo que la mesa tiene abierto: si sale a la primera, la búsqueda ha terminado. El árbol de cuatro preguntas se queda detrás, para cuando no se sabe cómo se llama. De paso cae el hueco del Cuadrante: se reparte con el contador escondido y ya no hace falta preguntarlo.</td><td><a href="juego.html#ch1-ejes">1.1</a></td></tr>
<tr><td>Tres formularios en vez de uno</td><td>La app preguntaba por las dieciséis reglas del Baúl una a una, y eso convertía el final del formulario en una encuesta. Ahora hay <strong>tres</strong>, con un repartidor que los va abriendo según lo que ya exista: <strong>1 · el tono</strong> (universo, edición, tarjeta, peligro y escala), <strong>2 · el contexto</strong>, que hace siete preguntas sobre la ficción y <em>recomienda</em> las reglas que la sostienen con el por qué de cada una, y <strong>3 · el equipo</strong>, que abre preguntando <strong>para quién</strong> y acaba escribiendo el objeto en la ficha. La partición no es ergonomía: los dos primeros viajan en el Código y valen para toda la mesa; el tercero escribe en una ficha y no viaja, porque el equipo es de quien lo lleva. El motor de recomendación no se inventó: son las veinte recetas del 8.4, que ya traían su paquete de reglas, usadas ahora como valores por defecto. En la cuenta del equipo se ven <strong>tres columnas y solo dos se restan</strong>: el Acceso no es un monedero sino un umbral que mide tu nivel en Recursos (ED-36), y confundirlo habría convertido el Bazar en una tienda de compra por puntos.</td><td><a href="juego.html#ch5-equipo">4.3</a></td></tr>
<tr><td>La fila opresiva, situada</td><td>No es una esquina teórica del cuadrante: la Angustia reproduce la distribución de La Llamada de Cthulhu y Warhammer (9 · 25 · 49 · 81&nbsp;%). Lo que allí se guarda en la ficha, aquí se guarda en la tarjeta, y por eso se entra y se sale del tono sin rehacer personajes. La diferencia está en el reparto, y por eso el aviso de formato corto.</td><td><a href="juego.html#ch1-panel">1.4</a></td></tr>
</tbody></table></div>

<h3 id="ed-abiertas">Lo que sigue abierto para el autor</h3>
<p>Estas cuestiones no se han resuelto por edición: se señalan con <span class="flag pending">Pendiente</span> en su sitio. La lista completa, con el turno de origen, está en <a href="#tr-pendientes">Trazabilidad</a>.</p>
<ul>
<li>La Regla del Margen. <strong>Cerrada: no vuelve.</strong> El acordeón (3.3) ya hace ese trabajo —la maestría se nota ensanchando el +4, no bajando la banda de crítico— y meter las dos sería cobrar dos veces por lo mismo.</li>
<li>Diferenciar Fantasía de poder y Épica clásica, y diseñar las recetas Pulp desatado y Pesadilla. <strong>Cerrado</strong>: el cuadrante de siete tarjetas elimina la distinción —las dos eran el mismo mejor de dos— y convierte aquellas recetas en el Pulp desenfrenado y la Pesadilla actuales.</li>
<li>Presupuestos de Rejilla por tipo de campaña (niveles iniciales). <strong>Medio cerrado</strong>: los <em>techos</em> por universo ya están decididos receta a receta (ED-30); el nivel inicial sigue siendo decisión de la mesa.</li>
<li>Capítulo de experiencia (costes y ritmos). <strong>Cerrado</strong>: escrito en <a href="juego.html#ch5-progreso">3.6</a> con los dos monederos, las cinco velocidades, el mérito que suma encima de una base y la lista de lo que se premia.</li>
<li>Capítulo de aspectos (dones y lacras) y su coste. <strong>Cerrado en lo esencial</strong>: no tienen coste porque no se compran (ED-35). Sigue abierta la etiqueta [Lento].</li>
<li>Las cuatro Disciplinas de Ritual y cómo organizar el catálogo de Firmas. <strong>Cerrado</strong>: Alquimia, Invocación, Encantamiento y Vínculos, por decisión del autor; y las doscientas Firmas van ordenadas por Ámbito y Disciplina en <a href="juego.html#ch9-skills">8.2</a>.</li>
<li>Requisitos para absorber daño. <strong>Cerrado</strong>: siempre se absorbe con la habilidad, lleves armadura o no; lo que decide si sirve son las etiquetas del arma y los bonos de la protección.</li>
<li>Puntos de suerte del villano principal.</li>
<li>Mundodisco dentro o fuera de las 20 recetas; ambientación 10 del Bazar (comedia o espionaje).</li>
<li><strong>Cerrado.</strong> Sustituir marcas y personajes con copyright. Tres pasadas: la primera cambió títulos, referencias y menciones en texto; la segunda fue a por lo que quedaba vivo —la Fuerza, las gemas y capas de Marvel, el lazo y el anillo de DC, el jedi, la kriptonita— y de paso arregló tres destrozos gramaticales que había dejado la primera; la tercera fue solo para el inglés, donde la traducción había devuelto marcas que el castellano ya tenía eufemizadas (la receta de artes marciales era prácticamente un catálogo). Criterio: se describe lo que el objeto <em>hace</em>, no de dónde viene.</li>
</ul>
</section>
<section class="chapter" id="audit-descartados">
<h2>Auditoría · Conceptos descartados</h2>

<p>Este registro recoge todas las ideas que se quedaron por el camino durante el diseño de NOGUM, entre los turnos <span class="src">T1</span> y <span class="src">T145</span> (10 de febrero – 24 de mayo). El borrador del autor (<span class="src">Borrador</span>, 18 de febrero, <span class="src">T128</span>) también se revisa. Así se ve por qué el manual final dice lo que dice y se comprueba que ninguna directiva vieja se ha colado en él.</p>
<p><strong>Criterio.</strong> Manda siempre el autor. Un concepto figura como <em>descartado</em> en tres casos:</p>
<ul>
<li>el autor lo rechazó de forma explícita;</li>
<li>el autor lo sustituyó por otra solución;</li>
<li>el canon lo retira mediante una decisión editorial (ED-n), porque choca con la última palabra del autor.</li>
</ul>
<p>También se incluyen las propuestas del asistente que el autor rechazó o dejó atrás, así como los restos obsoletos que siguen apareciendo en el borrador. El más visible es el índice viejo que va pegado al principio. Nada de lo que aparece aquí forma parte del manual final: el registro está aislado del texto de reglas y solo sirve como historial.</p>
<aside class="meta"><p>Si alguna vez te preguntas «¿pero no habíamos dicho que el crítico era superar la TN por 4?», la respuesta está aquí: sí, lo dijimos, y luego dejamos de decirlo.</p></aside>

<p>Cada hilo recoge las versiones sucesivas de un concepto clave, desde la primera formulación hasta la versión canónica.</p>

<h3 id="tr-pendientes">Cuestiones abiertas heredadas</h3>
<p>Estas son las dudas que el autor dejó sin cerrar. El manual las marca como pendientes y no las resuelve por su cuenta.</p>
<ul>
<li><strong>Siglas de NOGUM.</strong> Cerrado el 17 sep: siglas pedantes y siglas en broma, intercambiadas de idioma según la edición.</li>
<li><strong>Compra en partida de niveles de Rejilla.</strong> Cerrado el 17 sep: no se compran; suben con la campaña, pactados, y cambian el universo, no la competencia.</li>
<li><strong>Arrays de Rejilla inicial.</strong> Los arrays [1,1,1,1,1] / [2,1,1,1,1] / [3,2,2,1,1] del asistente no están validados. <span class="src">T89</span>–<span class="src">T91</span> <span class="flag pending">Pendiente</span></li>
<li><strong>Capítulo de experiencia.</strong> Hay tesis (crecimiento rápido, XP narrativa, XP fija en hitos), pero no tabla de costes. <span class="src">T37</span>–<span class="src">T38</span>, <span class="src">T63</span>–<span class="src">T64</span> <span class="flag pending">Pendiente</span></li>
<li><strong>Aspectos (dones y lacras) y habilidades lentas.</strong> Falta el capítulo y sus costes; también cómo se anotan los requisitos de la magia. <span class="src">T54</span>, <span class="src">T87</span> <span class="flag pending">Pendiente</span></li>
<li><strong>Categorías del catálogo de Firmas.</strong> El autor sugirió nivel tecnológico; el asistente ofreció las opciones A/B/C y ninguna se eligió. <span class="src">T143</span> <span class="flag pending">Pendiente</span></li>
<li><strong>Las 4 Disciplinas de Ritual.</strong> El borrador dice «se define según campaña»; la propuesta Alquimia / Invocación / Encantamiento / Vínculos no está validada. <span class="src">T106</span>, <span class="src">T142</span> <span class="flag pending">Pendiente</span></li>
<li><strong>Mundodisco.</strong> El autor lo pidió «como uno de los 20», pero desapareció de la lista definitiva: ¿sustituye a otro o va como receta extra? <span class="src">T123</span>, <span class="src">T127</span> <span class="flag pending">Pendiente</span></li>
<li><strong>Otras recetas de crítica y mejora</strong> (por ejemplo, adaptaciones que «emulan MAL», como Dungeon World). <span class="src">T121</span> <span class="flag pending">Pendiente</span></li>
<li><strong>Rick Sánchez: ¿N5 o N6?</strong> El autor dijo «5 (si no 6)». <span class="src">T134</span> <span class="flag pending">Pendiente</span></li>
<li><strong>Retoques de la tabla «La Malla en la cultura pop»</strong>, que el autor dijo que haría él. <span class="src">T135</span> <span class="flag pending">Pendiente</span></li>
<li><strong>Diferencia entre Fantasía de Poder y Épica Clásica.</strong> Tras la corrección del crítico (19 %) ambas coinciden; el asistente proponía doble 10 para Fantasía de Poder. <span class="src">T130</span>–<span class="src">T131</span> <span class="flag pending">Pendiente</span></li>
<li><strong>Crítico ligado a la maestría.</strong> Al autor le gustaba que «el Gran Maestro saque críticos donde el mediocre acierta»; con críticos naturales eso ya no ocurre. <span class="src">T31</span> <span class="flag pending">Pendiente</span></li>
<li><strong>Bandas del modo Agobio en Acelerado.</strong> Las propone el editor (<span class="flag ed">ED-15</span>) y el autor debe confirmarlas. <span class="src">T135</span> <span class="flag pending">Pendiente</span></li>
<li><strong>Puntos de Suerte</strong> del antagonista principal: se mencionan, pero nunca se definen. <span class="src">T58</span> <span class="flag pending">Pendiente</span></li>
<li><strong>Iniciativa fija de PNJ (12/16).</strong> Nunca se validó. <span class="src">T81</span> <span class="flag pending">Pendiente</span></li>
<li><strong>Títulos paródicos definitivos.</strong> ¿Los del asistente o los del autor («Clases, razas, y combos»…)? <span class="src">T118</span>–<span class="src">T119</span> <span class="flag pending">Pendiente</span></li>
<li><strong>Acrónimos del título bilingüe.</strong> Cerrado el 17 sep (ver Decisiones editoriales).</li>
<li><strong>Ambientación 10 del Bazar.</strong> ¿Comedia/Toon o Espionaje Realista? El asistente entregó Toon sin que el autor eligiera; el recuento de 300 ítems no cuadra. <span class="src">T71</span>, <span class="src">T78</span> <span class="flag pending">Pendiente</span></li>
<li><strong>Revisión del Bazar del Multiverso.</strong> Hay entregas sin comentar, duplicados y nombres con propiedad intelectual ajena. <span class="src">T107</span>–<span class="src">T110</span> <span class="flag pending">Pendiente</span></li>
<li><strong>Cifras del Baúl de reglas</strong> (relojes 4/6/8, flashbacks…): son del asistente y están sin validar; falta el contenido del 8.1 del autor. <span class="src">T117</span> <span class="flag pending">Pendiente</span></li>
<li><strong>Tabla «Piedra Rosetta»</strong> para quien llega desde otros sistemas universales: ni aceptada ni rechazada. <span class="src">T120</span> <span class="flag pending">Pendiente</span></li>
<li><strong>Recuperar salud o estrés con el Estilo:</strong> propuesta sin validar. <span class="src">T76</span>, <span class="src">Borrador</span> <span class="flag pending">Pendiente</span></li>
<li><strong>One-shots del autor</strong> para promocionar el juego: se desconoce cuáles serán. <span class="src">T71</span> <span class="flag pending">Pendiente</span></li>
<li><strong>Formato de Acelerado</strong> (¿gratuito?): el autor no lo confirmó. <span class="src">T77</span> <span class="flag pending">Pendiente</span></li>
<li><strong>Pieles de la Rejilla en las emulaciones</strong> (cambio de nombres sin anunciar): no se retomó tras fijar la escala de impacto. <span class="src">T33</span> <span class="flag pending">Pendiente</span></li>
</ul>

      // va detras de la portadilla, no detras de la lamina
      if (sec.classList.contains('cover')) { queue.push({cover:sec}); if (CFG.contents && !sec.classList.contains('lamina')) queue.push({contents:true}); return; }
      if (idx === 0 && CFG.contents) queue.push({contents:true});
      queue.push({sec:sec});
    });
    var i = 0, first = true;
    function step(){
      var t0 = performance.now();
      while (i < queue.length && performance.now() - t0 < 40) {
        var q = queue[i++];
        if (q.cover) {
          running = ''; runCap = ''; newSheet('cover');
          Array.prototype.slice.call(q.cover.childNodes).forEach(function(n){ body.appendChild(n); });
          if (q.cover.id) body.firstElementChild && (body.firstElementChild.id = body.firstElementChild.id || q.cover.id);
          first = false; cur = null;
        } else if (q.contents) {
          running = UI[lang].contents; newSheet();
          contentsBlock(entries).forEach(put);
          cur = null;
        } else {
          var h2 = q.sec.querySelector(':scope > h2');
          running = h2 ? cleanTitle(h2) : running;
          var capId = q.sec.getAttribute('data-cap') || q.sec.id;
          if (capId) { runCap = capId; if (cur) cur.setAttribute('data-cap', runCap); }
          if (!cur || CFG.chapterBreak || first) newSheet();
          else if (placed > 0) { /* continue on same sheet */ }
          Array.prototype.slice.call(q.sec.childNodes).forEach(function(n){
            if (n.nodeType===3 && !n.nodeValue.trim()) return;
            if (n.nodeType===1 && n.tagName==='H2' && placed > 0) {
              // keep a heading with at least some content: start a new sheet if little room is left
              if (body.clientHeight - body.scrollHeight < 120) { running = cleanTitle(n); breakPage(); }
            }
            if (n.nodeType===1 && n.tagName==='H2') { running = cleanTitle(n); cur.firstChild.lastChild.textContent = running; }
            // .nueva-hoja empieza en hoja nueva: las fichas de ejemplo, una por pagina
            if (n.nodeType===1 && n.classList.contains('nueva-hoja') && placed > 0) breakPage();
            put(n);
          });
          first = false;
        }
      }
      if (i < queue.length) { status.textContent = UI[lang].typeset + ' ' + book.children.length; setTimeout(step, 0); return; }
      fixOrphans(); finish(entries); if (done) done();
    }
    step();
  }

  /* ---------- after layout ---------- */
  function fixOrphans(){
    var ss = book.querySelectorAll('.sheet');
    for (var k = 0; k < ss.length - 1; k++) {
      var b = ss[k].querySelector('.sb'), nb = ss[k+1].querySelector('.sb');
      if (!b || !nb) continue;
      var l = b.lastElementChild;
      while (l && l.tagName === 'DIV' && l.classList.contains('tw') && !l.querySelector('tbody tr')) { b.removeChild(l); l = b.lastElementChild; }
      if (!l || !isHead(l) || b.children.length < 2) continue;
      nb.insertBefore(l, nb.firstElementChild);
      if (nb.scrollHeight > nb.clientHeight + 1) b.appendChild(l);
    }
  }
  var sheetInfo = [];
  function finish(entries){
    var sheets = Array.prototype.slice.call(book.querySelectorAll('.sheet'));
    sheets.forEach(function(s, k){ s.querySelector('.pn').textContent = String(k + 1); s.setAttribute('data-page', k + 1); });
    var pageOf = {};
    entries.forEach(function(e){ var el = document.getElementById(e.id); if (el) { var s = el.closest('.sheet'); pageOf[e.id] = s ? +s.getAttribute('data-page') : 0; } });
    book.querySelectorAll('.toc-list .n').forEach(function(n){ n.textContent = pageOf[n.getAttribute('data-for')] || '–'; });
    // side contents
    var ul = $('stoc'); ul.innerHTML = '';
    entries.forEach(function(e){
      var li = document.createElement('li'); li.className = 'l' + e.level;
      li.innerHTML = '<a href="#' + esc(e.id) + '"><span></span><span class="n">' + (pageOf[e.id] || '') + '</span></a>';
      li.querySelector('span').textContent = e.title;
      ul.appendChild(li);
    });
    sheetInfo = sheets.map(function(s){ return {page:+s.getAttribute('data-page'), text:s.querySelector('.sb').textContent.replace(/\s+/g,' ')}; });
    status.textContent = sheets.length + ' ' + UI[lang].pages + ' · A4';
    fit();
    labels();
    trackActive(entries, pageOf);
  }
  function unfit(){ book.style.transform = ''; book.style.marginLeft = ''; book.style.marginRight = ''; book.style.marginBottom = ''; }
  function fit(){
    unfit();
    var avail = document.querySelector('main').clientWidth - 32;
    var w = book.getBoundingClientRect().width || 794;
    var z = Math.min(1, avail / w);
    if (z < 1) { var h = book.offsetHeight; book.style.transform = 'scale(' + z + ')';
      book.style.marginLeft = '16px'; book.style.marginRight = (-(1 - z) * w) + 'px'; book.style.marginBottom = (-(1 - z) * h) + 'px'; }
  }
  var fitT; window.addEventListener('resize', function(){ clearTimeout(fitT); fitT = setTimeout(fit, 120); });

  var activeHandler;
  function trackActive(entries, pageOf){
    var links = Array.prototype.slice.call(document.querySelectorAll('#stoc a'));
    if (activeHandler) window.removeEventListener('scroll', activeHandler);
    var ticking = false;
    activeHandler = function(){
      if (ticking) return; ticking = true;
      requestAnimationFrame(function(){
        ticking = false;
        var best = null, bestY = -Infinity;
        entries.forEach(function(e, k){
          var el = document.getElementById(e.id); if (!el) return;
          var y = el.getBoundingClientRect().top;
          if (y < 140 && y > bestY) { bestY = y; best = k; }
        });
        links.forEach(function(a, k){ a.classList.toggle('active', k === best); });
        if (best !== null) {
          var a = links[best], side = $('side'), r = a.getBoundingClientRect(), sr = side.getBoundingClientRect();
          if (r.top < sr.top + 60 || r.bottom > sr.bottom - 20) side.scrollTop += r.top - sr.top - 120;
          store(KEY + '-at', entries[best].id);
        }
      });
    };
    window.addEventListener('scroll', activeHandler, {passive:true});
    activeHandler();
  }

  /* ---------- search ---------- */
  var q = $('q'), res = $('results'), stoc = $('stoc');
  q.addEventListener('input', function(){
    var term = q.value.trim();
    if (term.length < 2) { res.hidden = true; stoc.hidden = false; return; }
    var nt = norm(term), out = [];
    sheetInfo.forEach(function(s){
      var nx = norm(s.text), p = nx.indexOf(nt); if (p < 0) return;
      var from = Math.max(0, p - 45), snip = s.text.substr(from, term.length + 100), k = norm(snip).indexOf(nt);
      out.push('<li><a href="#" data-page="' + s.page + '"><span class="rv">' + UI[lang].page + ' ' + s.page + '</span><span class="rs">' + (from ? '…' : '') + esc(snip.slice(0,k)) + '<mark>' + esc(snip.substr(k, term.length)) + '</mark>' + esc(snip.slice(k + term.length)) + '…</span></a></li>');
    });
    res.innerHTML = out.length ? out.slice(0, 60).join('') : '<li><span class="rs">' + UI[lang].none + ' «' + esc(term) + '»</span></li>';
    res.hidden = false; stoc.hidden = true;
  });
  res.addEventListener('click', function(e){
    var a = e.target.closest('a[data-page]'); if (!a) return; e.preventDefault();
    var s = book.querySelector('.sheet[data-page="' + a.getAttribute('data-page') + '"]');
    if (s) s.scrollIntoView({block:'start'});
    closeMenu();
  });

  /* ---------- chrome ---------- */
  function labels(){
    var u = UI[lang];
    $('qLabel').textContent = u.search; q.placeholder = u.ph;
    $('printBtn').textContent = u.print; $('themeBtn').textContent = u.theme; $('menuBtn').textContent = u.menu;
    document.querySelectorAll('[data-i18n-es]').forEach(function(el){ el.textContent = el.getAttribute('data-i18n-' + lang); });
    document.querySelectorAll('.lang button').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false'); });
    document.title = CFG.title[lang];
  }
  function closeMenu(){ document.body.classList.remove('nav-open'); $('menuBtn').setAttribute('aria-expanded','false'); }
  document.addEventListener('click', function(e){
    var j = e.target.closest('.joke');
    if (j) { var list = j.getAttribute('data-jokes').split('|'); var i = (list.indexOf(j.textContent.replace(/^\(|\)$/g,'')) + 1) % list.length; j.textContent = '(' + list[i] + ')'; return; }
    var a = e.target.closest('#stoc a, .toc-list a');
    if (a) { e.preventDefault(); var el = document.getElementById(a.getAttribute('href').slice(1)); if (el) el.scrollIntoView({block:'start'}); closeMenu(); }
  });
  $('menuBtn').addEventListener('click', function(){ var o = document.body.classList.toggle('nav-open'); this.setAttribute('aria-expanded', o ? 'true' : 'false'); });
  /* Imprimir: papel (blanco, ahorra tinta) o pantalla (el crema, para un PDF).
     Ctrl+P sin pasar por aqui sale como papel. */
  var pm = document.createElement('div'); pm.className = 'printmenu'; pm.id = 'printMenu'; pm.hidden = true; pm.setAttribute('role', 'menu');
  document.body.appendChild(pm);
  function pintaPM(){ var u = UI[lang]; pm.innerHTML = '<button type="button" role="menuitem" data-print="papel">' + u.pPaper + '<span>' + u.pPaperD + '</span></button><button type="button" role="menuitem" data-print="pantalla">' + u.pScreen + '<span>' + u.pScreenD + '</span></button><p>' + u.pHint + '</p>'; }
  function cierraPM(){ pm.hidden = true; $('printBtn').setAttribute('aria-expanded', 'false'); }
  $('printBtn').setAttribute('aria-haspopup', 'menu');
  $('printBtn').addEventListener('click', function(e){
    e.stopPropagation();
    if (!pm.hidden) { cierraPM(); return; }
    pintaPM(); pm.hidden = false; this.setAttribute('aria-expanded', 'true');
    var r = this.getBoundingClientRect(), w = pm.offsetWidth;
    pm.style.top = (r.bottom + 6) + 'px'; pm.style.left = Math.max(16, Math.min(r.right - w, innerWidth - w - 16)) + 'px';
    pm.querySelector('button').focus();
  });
  pm.addEventListener('click', function(e){
    var b = e.target.closest('[data-print]'); if (!b) return;
    root.setAttribute('data-print', b.getAttribute('data-print')); cierraPM();
    setTimeout(function(){ window.print(); }, 30);
  });
  document.addEventListener('click', function(e){ if (!pm.hidden && !pm.contains(e.target)) cierraPM(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !pm.hidden) { cierraPM(); $('printBtn').focus(); } });
  var root = document.documentElement, th = read('nogum-theme'); if (th) root.setAttribute('data-theme', th);
  $('themeBtn').addEventListener('click', function(){
    var c = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var n = c === 'dark' ? 'light' : 'dark'; root.setAttribute('data-theme', n); store('nogum-theme', n);
  });
  document.querySelectorAll('.lang button').forEach(function(b){
    if (CFG.langs.indexOf(b.getAttribute('data-lang')) < 0) b.parentNode.hidden = true;
    b.addEventListener('click', function(){
      var l = b.getAttribute('data-lang'); if (l === lang) return;
      var at = read(KEY + '-at');
      lang = l; store('nogum-lang', l);
      typeset(function(){ var el = at && document.getElementById(at); if (el) el.scrollIntoView({block:'start'}); });
    });
  });
  window.addEventListener('beforeprint', function(){ unfit(); });
  window.addEventListener('afterprint', function(){ fit(); root.removeAttribute('data-print'); });

  /* ---------- start ---------- */
  labels();
  var started = false;
  function start(){
    if (started) return; started = true;
    typeset(function(){
      var id = location.hash.slice(1) || read(KEY + '-at');
      var el = id && document.getElementById(id);
      if (el) el.scrollIntoView({block:'start'});
    });
  }
  var SAMPLE = (function(){ var t = ''; document.querySelectorAll('template').forEach(function(x){ t += x.content.textContent; }); return Array.from(new Set(t.replace(/\s/g, ''))).join(''); })();
  if (document.fonts && document.fonts.load) { Promise.all(['400 1em "Source Serif 4"','italic 400 1em "Source Serif 4"','600 1em "Source Serif 4"','700 1em "Ibarra Real Nova"','italic 400 1em "Ibarra Real Nova"','800 1em "Big Shoulders Display"','600 1em "Big Shoulders Display"','400 1em "JetBrains Mono"','600 1em "JetBrains Mono"'].map(function(f){ return document.fonts.load(f, SAMPLE).catch(function(){}); })).then(function(){ return document.fonts.ready; }).then(start, start); setTimeout(start, 6000); } else start();
})();
</script>
</body>
