<script type="application/json" id="canon">"# CANON NOGUM — Reglas definitivas para el documento maestro\n\n## PALABRA DEL AUTOR (21 oct 2026): manda sobre todo lo demás\nDaniel Martín respondió uno a uno a los 53 conceptos del núcleo (`notas/CANON-respuestas-2026-10-21.html`). Esto manda sobre todo lo que viene después en este fichero y sobre el texto del libro. Donde dijo **Sí**, el enunciado queda confirmado tal cual. Donde dijo **No**, manda su texto, copiado literal; el enunciado del asistente se deja solo para que se vea a qué responde, y no vale como regla.\n\n### El marco\n- **m1 · La mesa manda.** Sí. Las reglas son herramientas para que el tono y el progreso se controlen, y se ignoran cuando impiden lo que la trama pide. NOGUM es para adultos: no hay cortafuegos contra el combo barato; la mesa puede decir «esto no vale».\n- **m2 · Sesión 0.** Sí. Antes de la campaña: las líneas rojas de cada uno (no se impone nada que haga sentir genuinamente mal a alguien; basta una persona; se puede decir en privado al Director), qué se va a sentir, qué soluciones pide el género y hasta dónde puede llegar el tono. De ahí salen los números.\n- **m3 · La muerte se pacta.** Sí. Ningún protagonista muere por una tirada. Fuera de combate no es muerte; la muerte se pacta con argumentos de arco.\n- **m4 · Tira solo si vale la pena.** Sí. Solo se tira si todos los resultados posibles son interesantes.\n\n### El motor\n- **t1 · Dos dados de diez.** Sí. Dos d10 de colores distintos (rojo y azul). La tarjeta de tono dice cómo se leen: el rojo solo, la suma, el mejor de dos o el peor de dos.\n- **t2 · El cuadrante.** Sí. Siete tarjetas: la fila es de qué lado está el universo (optimista, neutral, opresivo); la columna, a qué precio (previsible, la costumbre, caótico). Dos huecos, a propósito.\n- **t3 · TN y dificultad.** Sí. TN 6 (11 con la suma). La dificultad es un modificador sobre la tirada (+2 fácil, 0, −2 difícil, −4 heroico); la TN no se mueve.\n- **t4 · Pifias y críticos.** Sí. Se leen en el número que usas, sin bonos, con bandas estrecha, normal o ancha según la tarjeta.\n- **t5 · Éxito con coste.** Sí. Un total igual a la TN o un punto por encima: lo consigues y el Director pone el precio (tiempo, recurso, posición, fuego amigo).\n- **t6 · El tono se mueve.** Sí. Por campaña, arco, sesión, escena o personaje, dentro de lo pactado en la sesión 0.\n\n### El ancla\n- **a1 · Qué es el ancla.** Sí. Todas las fichas, sin excepción, van de −2 a +4. Por eso la estadística funciona siempre tal como se diseñó, en cualquier género y en la sesión cien. El ancla no es el +4: es el rango.\n- **a2 · Los bonos se acumulan.** No.\n  - El asistente entendía (superado): Pero el total nunca sale de −2 a +4. Si se pasa, el Director narra o tira en el extremo.\n  - **El autor:**\n  > Si se pasa, puedes aprovechar para ponerte penalizadores, hacer algo mas dificil (y con mas reward), y tirar con tu +4. Pero no se narra, ni se esquipea la tirada. Sólo no se tira si fallar NO ES INTERESANTE. no si es numericamente trivial el fallo. el ancla está para que nunca lo sea.\n- **a3 · La pirámide.** Sí. Ámbito (no se compra) → Dominio +1 (1 punto) → Disciplina +2 (1 punto) → Firma +4 (2 puntos). Se usa el escalón más alto aplicable; no se suman entre sí.\n- **a4 · Nulidad y Torpe.** Sí. Nulidad −2 en un ámbito donde no tienes nada. Torpe −1 en la otra columna de un ámbito donde sí tienes algo.\n- **a5 · Presupuesto.** No.\n  - El asistente entendía (superado): 12 puntos de habilidad, o 14 si el personaje tiene Arcano.\n  - **El autor:**\n  > Sí pero no. Sólo aclarar. El presupuesto total es eso + 5 llaves (o una malla) Pero creo que sólo hablabas de los puntos, no?\n- **a6 · Estilo.** Sí. +2 fijo, fuera de la pirámide. Se tira cuando ya no se puede fallar, para ver cómo.\n\n### La Rejilla\n- **r1 · Lo que significa un nivel.** No.\n  - El asistente entendía (superado): Un nivel de diferencia: el de abajo no tiene derecho a tirada. Si no quieres que alguien tire, lo pones un nivel por debajo, sin pedir permiso.\n  - **El autor:**\n  > No me gusta cómo está expresado. Si ya no es interesante el combate con enemigos de cierto nivel, es posible que sea el momento de resumir esa decisión poniendo una malla de distancia, más probablemente subiendo a los jugadores que bajando al enemigo. Así, pasas de tener una serie de ventajas específicas en ficha, a que el enemigo débil pierda el permiso de siquiera intentarlo. A menos que la narrativa le otorgue una llave.\n- **r2 · Las dos lecturas.** Sí. Según el tono. Narrativa: el de arriba es el tema de la historia, y no dice nada del mundo. Tangible: de verdad puede cien veces más; para los mundos que emulan el real.\n- **r3 · El ×100.** No.\n  - El asistente entendía (superado): Solo es de la lectura tangible: persona, sala, edificio, ciudad, país. La narrativa no se ata a ninguna escala real.\n  - **El autor:**\n  > Casi. Matices. Puedes tener tu escala en la narrativa. Seguramente el *100 no encaje. Goku sube con saltos mucho más grandes, Gimli muestra superioridad total sin que haya una superioridad numérica clara. Prioriza la narrativa, y adecua la escala a tu mundo si quieres una, o ignórala si no te suma.\n- **r4 · Por ámbitos.** No.\n  - El asistente entendía (superado): Un nivel por ámbito (Físico, Mental, Social, Técnico, Arcano). Los unos abundan.\n  - **El autor:**\n  > No entiendo el phrasing.\n  > La malla humana realista es 1 en todo. El mundo real puede afectar países enteros (armas biológicas, discursos políticos) pero siempre en ámbitos muy estrechos. Nunca un ámbito completo. Si suena a cómic, es porque un salto de malla es cómic.\n- **r5 · La salida.** No.\n  - El asistente entendía (superado): 1·1·1·1·2 como mucho; el 2 sale del bote.\n  - **El autor:**\n  > Nada de como mucho. Son los puntos de partida recomendados. Puedes empezar más alto o más bajo, según lo que quieras emular. Lo que sí, si eliges ese set up, sólo puedes poner 2 en aquello que el universo permita. Si no quieres, en vez de ese 2, tienes 5 llaves.\n- **r6 · El techo.** No.\n  - El asistente entendía (superado): Lo más alto que un mundo deja llegar a un jugador. No es la salida. La receta lo propone y la mesa lo confirma.\n  - **El autor:**\n  > Sí, pero quiero ser más específico. Techo en MALLA. Las llaves es mejor no intentar ponerles techo, porque siempre pueden sorprender con un plan que afecte a MUCHA gente. Y sobre todo en universos con internet, aviones, armas de destrucción masiva... puede haber muchas llaves latentes y pretender encontrar los techos es misión imposible. Hay varios techos, y copnviene separarlo,s o usar palabras distintas.\n  > Nivel máximo inicial. Nivel máximo del mundo. Nivel máximo de los jugadores. (ejemplo, Cthulhu. Hay criaturas cósmicas en el universo. Tú no puedes ser una) Tampoco es un concepto tan relevante si la palabra lía jajajaja\n- **r7 · ¿Rejilla o Llave?.** No.\n  - El asistente entendía (superado): Si a la historia ha dejado de interesarle el de abajo en todo el ámbito, es Rejilla; si solo contra una cosa, es Llave.\n  - **El autor:**\n  > Esa es una lectura. Dos caras. Si tu personaje es superior en todo el ámbito, con un multiplicador de *100, es hora de cambiar de malla. No tienen derecho a tocarte sin llave.\n  > O narrativamente, puede que simplemente no interesan esos combates, aunque no haya una superioridad física tan patente.\n- **r8 · Quién la sube.** Sí. La abre la historia; no se compra con puntos. Por defecto, si sube uno, los demás reciben lo equivalente.\n- **r9 · Sincronización.** Sí. Quien pilota un mecha o viste un exoesqueleto hereda su ficha y su nivel mientras dure. Un vehículo normal no hereda nada.\n- **r10 · Hacia arriba.** No.\n  - El asistente entendía (superado): Un PNJ por encima de los jugadores no se toca sin Llave.\n  - **El autor:**\n  > Sí. Sólo un matiz, porque es contra intuitivo. Con permiso, tiras con tu bono completo. No se protege dos veces.\n\n### La Llave\n- **l1 · Qué es.** No.\n  - El asistente entendía (superado): La explicación narrativa que te deja interactuar con un nivel superior. Sin ella es imposible; con ella tiras normal, con tu bono y con el tono de la partida.\n  - **El autor:**\n  > Sí, con un matiz. Convierte tu tirada de toda la disciplina. (Atletismo, Acrobacia, Sigilo, Juego de manos) Contra cualquier objetivo.\n- **l2 · Lo que hace.** No.\n  - El asistente entendía (superado): Te pone un nivel por encima en lo que cubre, también de lo que estaba a tu altura.\n  - **El autor:**\n  > Te pone un nivel (o varios, pagando varias llaves) por encima del actual. En esa tirada, actúa como una malla, a menos que esté limitado. Lo usas con alguien de malla 1, y la llave te pone en malla 2, y el malla 1 no tiene derecho a tirada. Contra lo que sea. Pero ojo ojal. Que dice la llave? Una granada hace daño de malla 2. no hay tirada de soportar, Esquivar es difícil, pero la llave no lo impide de forma tan tajante. Sí hay tirada. Contra enemigos de la siguiente malla, da derecho a tirada, que antes no tenías (un bicho con mucha armadura natural, la granada sí puede hacerle daño. Tu puño americano ni cosquillas.\n- **l3 · A qué va ligada.** No.\n  - El asistente entendía (superado): El libro dice: una Disciplina entera contra su objetivo, nunca una Firma. Tú me has dicho que va ligada a un dominio, y que ponerle objetivo solo la abarata. No sé si «dominio» es un Dominio de la pirámide (Vigor, Destreza…) o una Disciplina.\n  - **El autor:**\n  > toda la disciplina. (Atletismo, Acrobacia, Sigilo, Juego de manos) . Me lío con las palabras. Mea culpa.\n- **l4 · Su precio.** Sí. Subir n niveles cuesta n² Llaves. Contra todo es la compra completa; contra una sola cosa, Limitada y más barata.\n- **l5 · La Llave ancha.** No.\n  - El asistente entendía (superado): El ámbito entero contra su objetivo durante una escena; se tacha al acabarla.\n  - **El autor:**\n  > La llave es tan grande como diga la escena. Puede ser limitada, o en este caso, muy potenciada. (de /2 a*3) Eso altera los costes. Si dura una escena y es narrativo, no tiene costes, así que no merece definición específica.\n- **l6 · Propia, prestada, de un momento.** Sí. La propia se compra y es permanente. La prestada o de un momento la da la ficción o el Director: dura una escena y sube lo que la ficción diga.\n- **l7 · En blanco.** Sí. Se puede guardar sin escribir y decidirla la primera vez que se usa; si alguien abusa, la mesa lo frena.\n- **l8 · La Parca.** No.\n  - El asistente entendía (superado): Es una Llave al daño: si te alcanza y estás por debajo de su nivel, quedas fuera de combate, sin absorción. Si se puede esquivar lo dice su etiqueta. Nunca mata.\n  - **El autor:**\n  > Sí. Sólo mi yo tikismikis. No me gustan los nunca. A menos que se haya pactado blablabla. No es una regla de la parca. Es de la muerte. Y de hecho la parca es lo que más difícil pone a la mesa para perdonarlo. jajaja te ha destrozado el planeta la estrella de la muerte. Se puede saber cómo hago para decir que no te mató? jajajajaja Yo ni mencionaría la muerte ahí. La muerte tiene su lugar en el manual. Se te da, fuera de combate sin derecho a tirada.\n- **l9 · Los permisos.** No.\n  - El asistente entendía (superado): Lo que ninguna habilidad puede hacer (volar, ver a través de las paredes) cuesta 1 Llave.\n  - **El autor:**\n  > Sí, con matices. El sistema es vago a posta. Puede costar menos (nunca menos de 1, pero si un poder hace varias cosas de forma limitada, el total sí se puede dividir) o más. (entre /2 y *3) Un poco a ojo de buen cubero. Es parte de reglas vagas aposta. Se bajará a tierra con varios ejemplos de poderes en el capi del final.\n- **l10 · Los hechizos.** Sí. Un punto en Arcano es el requisito; el hechizo es el permiso, y se paga con Llaves. Limitado si el manual emulado lo hace difícil, entero si es a voluntad; en medio decide la mesa.\n\n### La economía\n- **e1 · El bote aparte.** Sí. +1 de Rejilla en un ámbito, o 5 Llaves. No se cambia por puntos en ninguna dirección.\n- **e2 · La unidad de cambio.** Sí. La Rejilla de un ámbito vale 5·n² Llaves (5, 20, 45…); cubrirlo a mano con Llaves, 8·n². La proporción es 5/8.\n- **e3 · Dos monederos.** Sí. Puntos (oficio) y Llaves (tamaño), cada uno con su ritmo, pactado en la sesión 0. Por defecto, una Llave por sesión.\n- **e4 · Experiencia de salida.** No.\n  - El asistente entendía (superado): Los puntos y Llaves de más que la mesa quiera dar antes de jugar.\n  - **El autor:**\n  > O menos. Por defecto es un lugar cómo para empezar. No el mínimo. De hecho está diseñado para cyberpunk, donde el mundo suele ser más poderoso que Zombies o Cthulhu.\n- **e5 · El equipo: tres cerrojos.** No.\n  - El asistente entendía (superado): El Acceso (tu nivel en Recursos), el permiso narrativo, y Llaves si rompe la Rejilla, según cuántos niveles te sube por encima de la tuya.\n  - **El autor:**\n  > Acceso, permiso narrativo y coste en los dos monederos. Tambien puede costar habilidad si lo que te da es un bono. Se paga su precio en ambas monedas, con el modificador que le venga bien.\n- **e6 · Devolver, prestar, regalar.** Sí. El equipo devuelve siempre sus puntos y Llaves al dejarlo. Lo prestado o robado dura una escena y no cuesta. Los regalos del Director no se pagan mientras la historia los pida.\n- **e7 · El Ajuste.** No.\n  - El asistente entendía (superado): Limitado ÷2, Completo ×1, Potenciado ×2, Desatado ×3. Por debajo de 1 Llave, gratis una escena y se consume.\n  - **El autor:**\n  > Por debajo de una llave no hay nada. Coste mínimo 1. Si dura una escena, no se paga, aunque el precio sea mayor. Y no se paga POR ESO. Tu puedes hacer un poder tan limitado como quieras. Pero si lo quieres para siempre, pagas al menos 1. No te voy a obligar a devolverlo solo por ser débil.\n- **e8 · El precio de las armas.** No.\n  - El asistente entendía (superado): Lo administra el mundo (el Acceso y la ficción), no las Llaves.\n  - **El autor:**\n  > El daño es lo único que no se paga. Si le dificulta la esquiva al otro, o la absorción, o si tiene cualquier otra cosa chula (mira automatica, +2 al dar, por ejemplo) se paga por puntos de habilidad. Si hace alguna cosa que encaje como llave, se paga. Una simple pistola es inesquivable. pagas llave. (no dificulta, anula a malla 1 la esquiva)\n\n### Combate y vida\n- **c1 · Ataque y defensa.** Sí. Los dos tiran contra la TN y se comparan niveles de resultado; el empate es del defensor.\n- **c2 · El daño.** Sí. Crítico del atacante: +1 al daño. El daño de un arma llega a 2, más la Parca.\n- **c3 · Las etiquetas.** Sí. Daño, Esq (Total, Parcial, Nula, Difícil −2…) y Abs (Total, Máx N, Nula). Mandan sobre el empate.\n- **c4 · La iniciativa.** Sí. Por guardias: Violencia, Treta o Especialidad. Si cambias, vas el último.\n- **c5 · La vida fractal.** Sí. 3 bloques, 9 casillas o 27 puntos, con la misma ficha; el zoom lo pone el tono.\n- **c6 · Las barras.** Sí. Física, Mental, Espiritual y las del género. La barra es tensión: vuelve entera cuando el Director declara que estáis a salvo. Las consecuencias se quedan hasta curarse.\n- **c7 · La oposición.** Sí. Decorado (sin ficha ni tirada), ficha rápida y ficha completa.\n\n### El Acelerado\n- **x1 · Cuatro modos.** No.\n  - El asistente entendía (superado): Optimista, Neutro, Caos y Terror, y los cuatro son configuraciones legales del completo.\n  - **El autor:**\n  > Sí y no. Es legal, sí. Pero en el completo son dos neutros. uno con 9 y otro con 3 de vida. Las 4 combinaciones son 3 combinaciones legales y asomarse a una regla nueva.\n- **x2 · Sus reglas propias.** Sí. Torpe −1, armadura ligera +1 y pesada +2 a la absorción, nueve casillas de vida (tres en Terror).\n\n### Aclaraciones del 22 oct (preguntas del barrido, `REVISION-canon-2026-10-21.md`)\n- **La Llave Limitada de un nivel.** Se pregunta: si Limitada es ÷2 con mínimo 1, a un nivel cuesta lo mismo que la completa. **El autor:**\n  > Sí, no tiene sentido separar cuando el precio es el mismo. Te lo compro.\n- **El daño de nivel superior** (granada, Parca 2). **El autor:**\n  > Ser parca sí se paga. Aunque sea daño, es un permiso además. Afectar a la siguiente,\n  \n  Y aclara cómo acababa: \n  > acababa. Solo puse una coma sin querer. Es afectar al siguiente punto en la REJILLA ( a ver si pillo hábito ajaja) Ergo es una llave por derecho. Eso es lo que hacen las llaves.\n- **Consumibles de un uso.** **El autor:**\n  > Correcto. Equipo de un solo uso, no se paga. No es parte de tu ficha. Sería equipo permanente un carcaj de flechas que no vamos a contar, un saco de pociones que misteriosamente siempre está lleno. Limitado si once in a while hay que pasar por tiendas, y te puedes quedar sin ellas en un momento inconveniente, that sort og thing.\n- **El nombre.** En sus respuestas, el autor escribe «malla» por costumbre: es la **Rejilla** (en inglés, *Grid*), el nombre vigente desde T158.\n- **Por debajo de −2.** **El autor:**\n  > Por debajo de -2, se decide si hay derecho a tirada. A discrecion del narrador.\n- **La Tragedia (TN 14).** Se pregunta si queda como excepción declarada a «la TN no se mueve», se quita o se rehace como dificultad. **El autor:**\n  > excepcion declarada me parece bien.\n- **«No hay combos» (dos efectos de la misma fuente no se acumulan).** **El autor:**\n  > creo que lo correcto es acumular lo que se pueda, a criterio de mesa, con el ancla en +4. la palabra combo barato se refiere a abusar de reglas, como las llaves que se rellenan cuando la partida ya empez'o, etc. la filosofia es no tememos a los jugadores tramposos, pq la meta no es matar mejor, y lo que no es narrativ se pacta en la 0. Se trata a la mesa cxomo adultos siempre.\n- **La Llave de cada sesión.** Se pregunta si es por jugador o para toda la mesa. **El autor:**\n  > por sesion y por cabeza, si\n- **Los 14 puntos.** Se pregunta si son del personaje que pone algo en Arcano o de cualquiera en un mundo con magia. **El autor:**\n  > para cualquiera en una partida en la que algun jugador se pone arcano. no va a tener mas puntos por tener magia. es de justicia en la mesa. si en tu mundo hay magia pero no es accesible a los jugadores, no te da puntos.\n- **Lo cósmico (nivel 6).** Se pregunta si es decorado fuera de la Rejilla o el nivel máximo del mundo, tocable con Llaves. **El autor:**\n  > lo cosmico es 6.(nivel planetas en la convencion simulacionista) la mayoria de universos no lo tiene, y es cas siempre injugable. Huiria de absolutos, ya que es un manual universal. puee que haya una partida cosmica en el que lleven seres como galactus cada uno. nada lo impide. Y las mismas reglas. Se toca con llaves, o partidas de universos sin techo, puede que una eventual subvida de malla (piensa en goku) En general no me gusta ser tajante en nada, para dejar claro que es un manual universal. Siempre usa generalmente, en la mayoria de mesas, etc. Cuando declares lo que no est'a al alcance, y cosas del palo.\n- **El ×100 en la lectura tangible.** Se pregunta si es fijo o la mesa puede adaptarlo. **El autor:**\n  > La escala tangible, igual. Intentamos ser poco taxtivos. Si los n'umeros significan algo en tu mundo, el *100 es la mejor elecci'on, para que el salto sea indiscutible. No recomendamos cambiarlo, por la sencilla razon de que un salto menor hace difusa la diferencia entre malla, y un pj que tiene -2 VS +4. y se ilustra. El mejor boxeador del mundo, no tiene nada que hacer contra una turba de 100 adolescentes sedentarios. Contra 10.... quiz'as. El quiz'as estorba.\n- **«Los unos abundan» y «un súper tiene como mucho dos ámbitos por encima de 1, y excepcionalmente tres».** Se pregunta si se cambia por la versión de r4. **El autor:**\n  > si entiendo la frase. Sewgurament el extracto en el archivo canon no lo pille bien. Asi esta bvien. Encaja con la idea de no irse de madre.\n- **La defensa contra una Llave o un arma de nivel superior** (ch5:29, «el de abajo… ni se defiende»). **El autor:**\n  > anula lo que diga que anula. y en armas se dice explicitamente los tres ambitos. Esquiva, bloqueo, y daño.  estando los dos ultimos muy relacionados, pero no siendo lo mismo. Algunas no se dejan absorber por daño masivo (granada) y otros pq atraviesan armadura, pero pueden hacer daños menores (balas perforantes, balas laser, katanas monofilo)\n- **Las fichas rápidas** (+0 fuera de su ámbito; «Rejilla 1–5»). **El autor:**\n  > se queda 0 como simplificacion de esas fichas. y no hace falta ser repetitivo con las excepciones. Los mundos con rejilla 6 son muy escasos, y ya se dice en su lugar que si quieres nadie te para. Un jugador jugando seres de galaxia, lo sabe y no se extraña con que las reglas no parezcan escritas para él en algnos párrafos generales.\n- **El Social de la receta corregida de ciberpunk** (cap8:896, Social 4 por deudas y favores). **El autor:**\n  > Se queda en llaves. no existe el ser que impide tirar a cualquier humano para seducirlo, convencerlo, intimidarlo...\n- **Los blásters de ópera espacial, esquivables.** **El autor:**\n  > convenio del género.\n- **El equipo del Acelerado, solo con dinero.** **El autor:**\n  > Vale como simplificacion. Pero aqui si se pone limite de equipo. 3 Items para una partida rapida? si no, se hacen ricos y se llenan 10 paginas jajajaja Lo podemos pensar un poco.\n\n  Hablado después, y aceptado por el autor («Vale: tres objetos, para uno nuevo sueltas uno, y lo de un solo uso no cuenta»): tres objetos que importan, con nombre y números en la ficha; lo demás (ropa, linterna, cuerda) se da por hecho y no da bonos; lo de un solo uso no cuenta; para coger uno nuevo, sueltas uno de los tres.\n- **Terror en el Acelerado** (sin lectura opresiva de dados). **El autor:**\n  > Si tiene. La lectura opresiva la dan los 3 puntos de vida. Es la diferencia con el neutro, que tiene 9. Lo opresivo es muy extremo.  Y lo presentamos así. no tiene cabida en una siplificacion, pero si damos herramientas para un terror mas para todos los publicos. El maual grande te deja ajustar varios diales, e ir con todo bajo tu responsabilidad. el acelerado tiene 4 tonos, no voy a poner uno que es 99% injugable\n- **«Matemáticamente infalible (99 %)» en la Épica** (ch4:41). **El autor:**\n  > Cambia por casi, sí.\n- **Presencia Majestuosa** (bz:445: el de nivel inferior tira Mental para poder atacarte). **El autor:**\n  > No es contradicción. Se puede usar para ilustrar lo abiertas que son las llaves. Pasar esa tirada puede ser la llave.\n- **Encargo: la tabla de poderes del capítulo 2.** **El autor:**\n  > Hay que rehacer la tabla de poderes en el capitulo 2, para ilustrar bien el ser que seria malla en los distintos 5 ambitos. Hay ejemplos que digo expresamente que son llaves. Lo ideal sewria la tabla con todo, la escribimos juntos, y debajo otra vez, con ejemplos de llave que alcanzan ese nivel, sin ser punto en rejilla\n\n  Criterios que dio el autor al escribirlas juntos: cada casilla lleva su porqué, porque el lector no tiene por qué captar la referencia; un ser de Rejilla hace *cualquier cosa* del ámbito a esa escala (Orfeo: su canto despierta cualquier emoción), y lo que es enorme en una sola cosa es Llave (las sirenas, el amo del hierro, la mujer del rayo); con un poco de imaginación todo puede ser un personaje («con poner sintiente» basta); «ya es un salto en sí TENER arcano, pero eso no lo hace un N2 si afecta a una persona». Las tablas quedan así (aprobadas el 22 oct: «ha quedado perfecta la diferenciación»):\n\n  **Tabla 1 · Seres de ese nivel en todo el ámbito (Rejilla)**\n\n  | | N1 · Humano | N2 · Sala | N3 · Edificio | N4 · Ciudad | N5 · País |\n  |---|---|---|---|---|---|\n  | Físico | El poli del yipi ka yei, el boxeador. Contra tres matones a la vez, suda sangre. | El soldado del suero, el cromado, el licántropo. Un soldado raso no tiene sentido contra ellos. | El trepamuros: las balas no le alcanzan, su sentido arácnido las ve venir. El robot del futuro: las balas le rebotan. | El monstruo nuclear, el verde y furioso. Sus ondas de choque barren calles. | El alien de mallas y calzoncillos. Cambia la geografía. |\n  | Mental | El profesor de química enfermo. Un +4 en Química, no un nivel: brillante en lo suyo y humano en todo lo demás. | El consultor de Baker Street, el científico elástico que lidera a su familia de aventureros. Parecen humanos, pero sus deducciones quedan claramente fuera del alcance de su especie. | El genio alienígena de cabeza enorme. Ningún plan del edificio se le escapa: ya lo ha pensado antes. | La IA de una ciudad. Sabe en tiempo real todo lo que pasa en ella (cada cámara, cada registro, cada conversación), y sobre eso investiga, resuelve y deduce. | La IA de un país. Lo mismo, a escala de una nación: sabe lo que va a hacer antes que su gobierno. |\n  | Social | El negociador, el buen relaciones públicas. Convencen a quien tienen delante. | La presencia del vampiro. Entra en la sala y la sala entera queda prendada. | La reina de la colmena. Satura de feromonas un puerto entero, y cada tripulación siente lo que a ella le conviene: devoción, pánico, calma o furia. No se evita, porque hay que respirar. | Orfeo. Su canto despierta cualquier emoción, y una ciudad entera da la vuelta a su revolución. | El señor de los sueños. Lo que sueña o teme un país es cosa suya. |\n  | Técnico | El manitas universal, el hacker. +4 en Artificio, pero sus maravillas caben en una habitación. | El inventor imposible (el millonario que se construye una armadura en una cueva). Va un salto por delante de su mundo: solo, hace lo que un equipo entero. | Los técnicos de un futuro lejano. Manejan a placer las leyes de la física. | La nanofactoría sintiente. Monta al instante cualquier aparato desde la materia prima más básica, y decide ella qué montar. | El científico de un futuro imposible (el cínico de la pistola de portales). Domina esta física y otra nueva. |\n  | Arcano | El brujo cazador, el aprendiz de la Orden. Una señal, una maldición, un velo: magia sobre una persona cada vez. Tener Arcano ya es un salto, pero no te hace N2. | El maestro de la Orden. Lo mismo que el aprendiz, sobre una sala entera: levanta, protege, ve o derriba a todos los que hay en ella. | El archimago de la torre. Toda la torre es su hechizo, y puede llevar eso a cualquier barrio: tormenta, sanación, adivinación o destierro, a la escala de un edificio. | El hechicero supremo que guarda la ciudad. Nada sobrenatural entra sin que él lo sepa, y puede curar, desterrar o sellar a esa escala. | El señor oscuro. Su sombra cubre reinos: corrompe, vigila, levanta a los muertos y enferma las cosechas de medio mapa a la vez. |\n\n  Debajo: «Con un poco de imaginación, todo puede ser un personaje: una IA, una nanofactoría con mente propia. Si es alguien y es grande en todo el ámbito, es Rejilla.»\n\n  Revisión del autor a la tabla 2 (22 oct): cada Llave tiene que ser del ámbito en lo que *hace*, no solo en lo que es. «Técnico es crear, reparar, esas cosas»: el satélite láser hace daño (Físico) y dejar sin dinero «es robar con llave, no técnico con llave»; la nanofactoría de la tabla 2 es la de la tabla 1 sin mente («la blueprint se la das tú»). En Arcano, la bola de fuego es daño: mejor un pergamino de invisibilidad. La mujer del rayo se queda: «Una tormenta mola mucho».\n\n  Últimos retoques (22 oct), aceptados por el autor («Te lo compro»): la tabla 2 no hace la cuenta del precio (algunas son Limitadas), remite a 2.3; en Social N5 se quitan «los dioses de la locura», que se confundían con los primigenios del nivel 6. Sobre añadir que en una partida realista el detective sería un +4 en N1, **el autor:**\n  > Sherlock no es humano. En una partida realista, Sherlock NO EXISTE. el matiz queda claro con PRECEN HUMANOS, pero sus deducciones no lo son. tu lo lees como en una partida realista, e se compra diferente. Para mí, en una partida realista, no te dejo mirar como cojea y deducir inmediatamente los años que ha servido en una guerra en oriente medio XD yo no cambiaba nada. El parece hace todo ese trabajo\n\n  **Tabla 2 · Llaves que llegan a ese nivel sin ser Rejilla** (si se compran, cuestan lo que una Llave de ese nivel, 2.3; si son de un solo uso o duran una escena, no se pagan)\n\n  | | N2 · Sala | N3 · Edificio | N4 · Ciudad | N5 · País |\n  |---|---|---|---|---|\n  | Físico | La granada. Daña a toda una sala, y quien la lanza sigue siendo humano. | El tanque. Derriba el vestíbulo; fuera de él, quien lo conduce es nivel 1. | La bomba nuclear táctica. Arrasa un centro urbano, y solo arrasa. | El arma biológica. Llega a todo un país, pero solo enferma; no levanta un coche. |\n  | Mental | El laboratorio forense que trabaja para ti. Investigación por cien, y nada más. | El algoritmo de bolsa. Predice un mercado; no sabe quién mató al portero. | La red de vigilancia de una ciudad. Lo ve todo, pero solo ve. | El servicio de inteligencia. Sabe los secretos de un país; no resuelve una ecuación. |\n  | Social | El discurso ante la junta. Una sala, un día. | La estrella del rock. Saca a miles de fans a la calle, pero no impresiona a quien no sabe quién es. | La cadena de televisión. Una ciudad oye su versión, y solo esa. | El discurso político que arrastra a un país. Con ese mensaje, no con cualquiera. |\n  | Técnico | El enjambre de drones. El trabajo de un equipo entero, pero solo aquel para el que se programó. | El hacker con su ordenador. Apaga las defensas de un edificio, pero no repara el ascensor. | La nanofactoría. Levanta los escudos de una ciudad en una noche, pero solo lo que dice el plano que tú le das. | El gusano que tumba la red de un país. Sabotea todo lo que está conectado, pero no arregla ni una tostadora. |\n  | Arcano | El pergamino de invisibilidad. Toda la comitiva desaparece a ojos de la sala; es de un solo uso, así que no se paga. | El amo del hierro. Levanta un estadio, si es de metal; contra una puerta de madera es un humano. | La mujer del rayo. Una tormenta sobre toda la ciudad, y nada más que tormenta. | El pacto del rey con el demonio. El reino no pierde ninguna guerra mientras dure; no le da al rey ni pan ni amor. |\n\n\n### Respuestas a PREGUNTAS-v2 (22 oct, `respuestas.docx`)\nEl autor contestó en un documento las 25 preguntas de `notas/PREGUNTAS-v2.md`. Cada respuesta va literal, tras el título de la pregunta.\n- **1. La Parca, Limitada al daño.** **El autor:**\n  > Confirmo.\n- **2. Anular la absorción, ¿Llave?** **El autor:**\n  > Confirmo.\n- **3. Cuántos puntos cuesta dificultar la defensa del otro.** **El autor:**\n  > Confirmo.\n- **4. Combinaciones.** **El autor:**\n  > Una llave por trait. Llave para no esquivar, pero no absorber ya va en daño masivo. (destroza el escudo también) no cobramos dos veces por el mismo concepto.\n- **5. La Llave «contra los vampiros» ya escrita, de un nivel.** **El autor:**\n  > La no separación a nivel 1 se debe al coste. La idea detrás es, si te voy a cobrar lo mismo, no lo limtes, pq el mínimo es 1. Un consejo de optimización, más que una regla dura. Se señala así.\n- **6. La escalera llana (3n−2)** **El autor:**\n  > Al baúl. Crecimiento más rápido. Mallas menos inaccesibles.\n- **7. La Transformación.** **El autor:**\n  > Sasto. Y la transformacion es limitada o no segun las condiciones de la transformación. No vale como truco para pagar menos si es a voluntad y siempre que quieras.\n- **8. «Ignora todo»** **El autor:**\n  > Sí, se puede poner n como el techo del universo (el ser más poderoso, puedas jugarlo o no), el precio depende contra quien lo puedes usar.\n- **9. El rockero** **El autor:**\n  > Depende. Hay fans por todas partes? Sólo en los suburbios? Recuerda que es un manual universal. En principio es general. Pq cyberpunk es un universo conectado. Puedes contactar por redes a distancia, y una llamada puede transportarlos. Pero queda sujeto a la mesa.\n- **10. El golpe de un ser de Rejilla superior** **El autor:**\n  > No hay tiradas. Se Narra la derrota. Como en vampiro la mascarada cuando te metes con un anciano.\n- **11. Con Llave contra el de arriba** **El autor:**\n  > La llave cubre lo que cubre. Un arma sin escudo, y una contextual (emboscada, sorpresa) es una sola oportunidad. Como le toque a él… mal vais jajajaja nada que inventar. La llave o llaves específican el tipo de oportunidad que compras.\n- **12. Por debajo de −2** **El autor:**\n  > Sasto. Está bien.\n- **13. La Tragedia** **El autor:**\n  > Son consejos. Se recomienda encarecidamente no usar por tiempos prolongados los tonos más oscuros. Pero la mesa es adulta y se trata como tal.\n- **14. Social 3–4 por fama** **El autor:**\n  > Preguntate. Tienes derecho a tirada para resistir las 8 habilidades? Yo creo que sí. En tal caso son llaves. Pero analízalo. Si quieres podemos charlarla. En ppio, parece claro que son llaves.\n- **15. Inés «casi humana»** **El autor:**\n  > Así está bien. S´olo para ilustrar, y es más sencillo si son 56 llaves en físico que se convierten en la malla. Criterio didáctico y de simpleza.\n- **16. [Lento]** **El autor:**\n  > Nisiquiera puede usarse en conflicto, es todavía mas restrictivo, y puede usarse como una desventaja que puedas usar como puntos de habilidad en otra cosa. Desventajas y ventajas tienen la misma característica que todo lo demás. Llaves o puntos con multiplicador. No entramos mucho en detalle. Es un motor para que construyan los DMs. No una lista infinita de rcetas.\n- **17. La muerte pactada al revés** **El autor:**\n  > Sí. Es una pieza clave en algunos universos de terror, sobre todo en one shots.\n- **18. «Las Llaves que se rellenan cuando la partida ya empezó»** **El autor:**\n  > Es eso, sí.\n- **19. Las seis ideas** **El autor:**\n  > Está flama.\n- **20. El decorado** **El autor:**\n  > Lo primero. Si no hay tirada, actúan como n-1 (n es la de los jugadores) asi que nisiquiera necesitan rejilla.\n- **21. «Don»** **El autor:**\n  > Sí. Ventaja?\n- **22. «DJ» y «Director»** **El autor:**\n  > Director\n- **23. Nombres que rozan franquicias** **El autor:**\n  > Perfecto.\n- **24. La tabla de bonos de 2.1** **El autor:**\n  > El +3 no existe solo con ficha, y si los bonos llegan a +3 al aplicarse, no se dice cómo. Puede ser un profesional con ayuda, o un torpe con muchísima ayuda. No entramos en tanto detalle.\n- **25. Detalles menores** **El autor:**\n  > Perfecto.\n- **Ventajas y desventajas: ¿se compran, o «no se compran, ocurren»?** (a raíz de su respuesta 16). **El autor:**\n  > Las dos cosas\n  \n  Y lo aclara: \n  > Lo de las dos cosas iba por el cuadro del final. Se compran y ocurren. Se decide en mesa si empezais con desventjaas, etc. en ppio libertad total con tus 12 puntos y 5 llaves. Pero va a sesion 0\n- **Lo que decidieron los agentes y el autor aprueba** (dioses fuera del decorado, el Social por fama bajado a 1 en las recetas 4 y 15, y la escalera llana). **El autor:**\n  > Me valen las tres (dioses como no decorado, social por fama, bajado a 1, y la rejilla plana, es n*3 en vez de n cuadrado. Una regla de progresion mas rapida en el baaul.\n\n- **Dudas de la revisión por conceptos (22 oct).** «Ningún protagonista muere por una tirada» (0.7), ¿se suaviza?; las masillas, ¿tiran iniciativa o son decorado?; «sin saltarse la progresión» en la Llave de un momento; «si un objeto da un permiso y no pone Llaves, es una errata» en el Bazar. **El autor:**\n  > 1. Nah, está bien así. Encaja con las reglas son tuyas y te las follas cuando quieras. La excepcion no les quita el status de regla.\n  > 2. Lo palanamos a decorado.\n  > 3. Se explica un poco.\n  > 4. Me parece honesto. Siempre se va a colar algo\n\n- **El éxito con coste no es universal (22 oct, leyendo la hoja de referencia).** **El autor:**\n  > El exito con coste no esta siempre. Igual a la TN o uno ma. [...] A la tabla le sobra el porcentaje con +0 (a nadie le importa) y le falta si hay exito con cose o no, y que numeros lo dan.\n\n  En las tarjetas, solo lo llevan el Pulp desenfrenado y la Comedia negra (total 6 o 7). t5 vale para esas.\n\n- **Respuestas a PREGUNTAS-final (22 oct).** **El autor:**\n  > 1. Aumenta el daño en un nivel con una pifi de defensa. Pero como bien dices, si no entra, no se tira. No va a lanzarse hacia la bala que no le iba a dar XD\n  > 2. Las penalizaciones de las barras, si lo entiendo bien, son los penalizadores que te da el daño tras pasar un cierto umbral. Claro que se cuenta!!\n  > 3. Si hay ficha, la cambia. Como regla sucia de prisa, se puede cambiar de rejilla, pero es un mecha! Demasiado cool para no darle e rotagonismo que merece.  Las chapuzas no hay que recomendarlas en voz alta. jajajaja Cambia la ficha!\n  > 4. Nah. Me fio de ti CASI SIEMPRE va a ser llave. Es muy raro un aura de carisma irresistible pida lo que pida. Existe, pero es muy raro\n\n- **Crítico del atacante y pifia del defensor a la vez (22 oct).** **El autor:**\n  > Se suman: crítico y pifia del defensor dan +2 al daño.\n\n- **Preguntas abiertas contestadas desde las seis ideas (22 oct).** El autor pidió al asistente contestarlas él, «como test de si la lógica es fuerte», y las confirmó todas: **«todo bien»**.\n\n- **La Llave potenciada (23 oct).** Va en 4.3, debajo de la Llave Limitada, con los multiplicadores del Ajuste (Potenciada ×2, Desatada ×3), una lista corta de ×2 y otra más larga de ×3. **El autor:**\n  > A veces lo que hace tu poder no encaja exactamente con una llave. Se siente DEMASIADO poderoso, casi tramposo. Como podemos utilizar este manual para cualquier poder, habilidad, conjuro, o ventaja sobrenatural, queremos asegurarnos de que hay un precio para tu idea. Y hablamos de los multiplicadores. Muy breve. […] El sigilo que te haga invisible, inaudible, indetectable a ki, cámaras de calor, etc. No es justo que cueste igual que una capa de invisibilidad. Y no es un salto ×100. No habla de afectar a más gente. Solo a uno cada vez. El que mira.\n  > si, me gusta más sigilo como 1 desatado que como una rejilla más. Y cámbialo en todo.\n\n  Consecuencia: «indetectable por cualquier medio» deja de ser Sigilo +2 (4 Llaves, T179) y pasa a **Sigilo +1 Desatada: 3 Llaves**, en 4.3, 4.6 y 5.4–5.5. La invisibilidad queda en 1 / 2 / 3 Llaves (capa, a voluntad e inaudible, indetectable).\n  Corrección del autor a la tabla de 5.5:\n  > A voluntad es la definición de completa, de siempre. Y pone potenciado. […] Cambia las dos. Permiso: 1 llave. Ajuste: Limitado. Precio: una llave. El precio mínimo es 1. Invisibilidad a voluntad, y además, inaudible. Permiso 1 llave. Potenciado 2 llaves. Y el indetectable por cualquier medio, desatado.\n\n  Capa: permiso, Limitado, 1 Llave (el mínimo), sin el Acceso en la tabla. A voluntad e inaudible: Potenciado, 2. A voluntad sola es Completo, 1 Llave (así queda en el Bazar).\n\n- **La Parca y la vida Letal (23 oct).** **El autor:**\n  > la parca está escrita para fichas de 3 puntos de vida. Creo que no es preocupante. Yo lo dejaría así. Quizás una línea para subrayarlo. La parca deja fuera de combate sea cual sea tu barra de vida, a menos que tengas llave. Nótese que el daño realista, con el techo a +2, es el de 3 puntos de vida. Ponerte más vida es perfectamente legítimo y usual en el rol. Pero que sea una decisión consciente. Es una ficha que soporta balazos, hachazos en la cabeza y caídas letales. […] No cambies nada del acelerado. Esto es teoría y detalle. Y solo merece vivir en el densito.\n\n  Va en 6.4 (el daño realista es el de la vida Letal) y, en 4.5, una frase que remite allí. El Acelerado no se toca.\n\n- **Esq: Parcial (23 oct).** El autor la había entendido como un −1 a la esquiva; el libro dice que, aunque esquives, comes al menos 1 punto. **El autor:**\n  > me gusta mucho más el tuyo jajajaa lo dejamos no?\n\n  Se queda como está: con Esq: Parcial, aunque iguales o superes, recibes al menos 1 (Juego 6.2–6.3, Acelerado 2.6, Bazar).\n\n- **Los penalizadores por herida: −1 y −3 (23 oct).** El autor: «los penalizadores por daño son una pasada no?». Con −2/−4, la segunda herida empujaba por debajo del suelo del Ancla a quien sabe hacer algo (un +1 a −3). **El autor:**\n  > Sí: el suelo se queda en −2 y los penalizadores pasan a −1 y −3. Cámbialo en todo, en los dos idiomas.\n\n  Primer bloque lleno: −1; segundo: −3 (sustituye al −1) y se pierden las acciones complejas. El suelo sigue en −2 (por debajo, el Director decide si hay tirada). Las barras se siguen sumando: Herido en una y Crítico en otra, −4. Cambia en el Juego (6.5, 6.6), el Acelerado (2.7, la ficha y la chuleta) y la App.\n\n- **La escena de 6.7 y la estaca (23 oct).** **El autor:**\n  > No me gusta el ejemplo. Primero. No tiran normal. Parte de la superioridad del vampiro es su alerta […] y tú le das iniciativa en igualdad de condiciones por un palito. Segundo. La estaca no hace más daño. Es un punto débil conocido. En el corazón, los paraliza o los mata según el universo. […] vampiro tiene un fandom serio\n  > sé lo del crítico, pero no vamos a limitarlo tanto. […] el crítico te da el permiso narrativo de hacer más daño, y la excusa es un punto débil. Aquí es simplemente un ataque apuntado. Más difícil, quizás −1, están frente a frente, cerca, no es una proeza.\n  > y si tiene una llave de pelea, no hay razón para no seguir peleando. La llave es acercarse sin que el vampiro sienta la hostilidad con sus sentidos aumentados. Le permite tirar iniciativa […] Se lo juega todo a una carta.\n  > Esa iniciativa se la da el entrenamiento de cazador.\n\n  Tomás: Rejilla 1, Pelea +2 y una Llave, su entrenamiento de cazador (llegar sin que el vampiro sienta su hostilidad: con ella tira iniciativa). La estaca es una Llave Limitada: solo en el corazón, con un ataque apuntado (−1). Si conecta pero la esquiva empata, entra sin llegar al corazón: sin daño. Luego no le queda Llave para defenderse ni seguir: se narra la derrota. En el Bazar, la estaca: en el corazón (apuntado, −1), paraliza o mata según el universo; 1 Llave Limitada contra vampiros.\n\n- **Inés en 7.2: sin tarjeta y sin Llave en blanco (23 oct).** **El autor:**\n  > No mezcles conceptos. Ensucia la idea central. Se explica aquí que las llaves esparcidas para decir con una serie de poderes que eres sobrehumana, se puede resumir en un aumento completo de la malla física, y eliminas por completo la posibilidad de un humano de afectarte. Nada del tono. Es un cambio de foco en lo interesante.\n  > No pinta nada meter la llave en blanco. Si llegado el momento la ponen en otro ámbito, la conversión no es tan limpia. Y además, tampoco te hace más humana una llave en blanco. […] Quita toda la mención a la llave en blanco. Está mal por muchas razones.\n\n  «La misma Inés, en la corte» ya no cambia la tarjeta: las Llaves sueltas se resumen en Físico 2, y lo que cambia es el foco. En la ficha de Inés sale la frase de la Llave en blanco. La regla general de la Llave en blanco (C·l7, 4.4) se queda.\n\n- **Expediente 16, «Nadie», la cambiaformas (24 oct).** Los expedientes enseñan las ideas más abiertas del manual (frase nueva en su introducción). **El autor:**\n  > Llave 1 desatado en tiradas de sigilo. Te ven, pero no ven lo que creen ver, y no alertan. Solo un salto de rejilla, porque engaña solo a una persona a la vez. Desatado, porque es mucho más versátil que una capa de invisibilidad, que niega un solo sentido. Los poderes mutantes engañan hasta un test de ADN. […] Se infiltra en un edificio armado hasta los dientes. Para ello, robas la identidad del CEO. Tu poder ha creado una llave de situación. El edificio es malla 3. Tu infiltración es 1. La situación te regala la llave. No se paga. Tiras con tu bono completo.\n  > Su apariencia y su voz (la voz es parte de su poder, la forma de las cuerdas vocales) son la excusa. Si hay un engañar, aunque lo tenga a +4, puede usar en cualquier momento otra llave de rejilla +1 (no se tira) y como mínimo la otra persona necesita saber que «uno de nosotros no es quien dice ser» como llave para tener derecho a fijarse en la actuación, que en otro momento es un «hoy estás raro», sin más. Y dentro de comprar esa opción, si tiene la firma, tira contra un gran maestro.\n  > [Arcano] No, porque nace con ellos, y no necesita saber de ningún ritual para lanzarlo.\n  > Lo que la escena te da, la escena te lo puede arrebatar en cualquier momento. También sin coste.\n\n  Ficha: Rejilla 1, 12 puntos (sin Arcano), Tarjeta Épica, 9 casillas; Llaves Sigilo +1 Desatada (3), Engaño +1 (1), Acrobacia +1 (1); Firma «Ser quien esperan». Retratos: de frente y de perfil, dos personas distintas.\n\n- **Los expedientes, el último agarre (24 oct).** El autor: «Puede ser crucial para entender bien. Así pues, creo que debe estar anunciada y con enlaces a menudo en partes clave del manual». Quedan como **9.5**, con número y marcador propios; se anuncian tras las seis ideas; y cada idea que tiene ficha lleva una señal fija, «En una ficha · …» (clase `ver-exp`), solo donde la idea se explica por primera vez: 3.2, 4.1, 4.3, 4.4, 5.2, 5.3 y la hoja de referencia. Cada expediente nuevo llega con sus señales.\n\n- **Expediente 17, «Wukong», y la receta 17: shōnen sucio (24 oct).** **El autor:**\n  > Es una reflexión que tuve sobre lo que significa en caso de empate gana la defensa. La épica no habla de tamaño. Habla de emoción, de riesgo percibido. […] Rejilla 5, VIDA 3. […] La lucha puede ser muy larga, y para eso están las esquivas y los parry. Pero un solo golpe duro puede acabar con un personaje, perder un brazo, etc. […] Golpes normales de 1 de daño, y permitir golpes mayores limitados a escenas o arcos, como la bola genki, serían la mejor manera de narrar una pelea larga pero con riesgo en la mesa. La mayoría de golpes no entrarán. Pero uno solo, SE SIENTE.\n  > Épico es precisamente lo que quiero remarcar que no es, un universo en el que el prota muere y pierde cada dos por tres. Pero no pondría Anime. Shonen sucio. Y sería neutro, grave. Tampoco veo el caos elevado ahí.\n  > No. Un puñetazo es un puñetazo. Tiene 1 de daño en goku y en la vida real. Solo que con rejilla alta no te afectan las balas. Pero los golpes de tu cuerpo escalan contigo junto a la defensa. Y todo queda igual.\n  > No, se sale todo de lo humano. Con correa para que las peleas sean, por defecto, largas y visibles. El golpe que anula esquiva o con un daño superior debe sentirse como un golpe de gracia. Algo para lo que la escena genera momento.\n\n  Receta 17: Realista (neutro y grave), zoom Letal, golpes de gracia con correa (Llave de un momento o Parca una vez por arco). En la App, el mundo de artes marciales pasa a Realista y vida Letal. En 6.4 sale «anime» de la fila de Guerra; la idea de la vida Letal como daño realista no cambia. Nombre: «Wukong», del Rey Mono de «Viaje al Oeste» (dominio público), no «Son Goku».\n\n- **El corolario de la coreografía y el Cansancio (24 oct).** **El autor:**\n  > y dejamos como corolario, todas las peleas en nogum son coreografías largas, hasta que alguien saca un arma de verdad, que aunque esquives, algo entra. Regla opcional: cansancio. Baja la habilidad de defensa mientras la pelea se alarga.\n\n  El corolario va al final de 6.2. El Cansancio es el módulo 18 del Baúl (9.1): desde la tercera ronda, y cada tres rondas, −1 a esquivar y absorber, acumulable; se recupera a salvo; se suma a las heridas y respeta el suelo del Ancla. Lo lleva la receta 17. La Idea dice «dieciocho reglas»; en la App, la regla 18 entra en «Riesgo y poder», el Código pasa a 18 bits (los viejos se leen igual) y el mundo de artes marciales enciende Transformación y Cansancio en vez de Daño explosivo, que estorba con la vida Letal.\n\n- **Lo que te acompaña: la pareja (26 oct).** **El autor:**\n  > Druida con mascota. Los stats de la mascota pueden comprarse como limitados, en las acciones en las que no aporten nada si la acción la hace uno u otro. Cuando dos criaturas haciendo algo a la vez lo consiguen más rápido, o más efectivo, como el combate, se paga completo. Percepción, desplazamiento, etc. pagado en ti o en el animal, es lo mismo.\n  > pague uno, el otro, o los dos? Suena a fuente gratuita de puntos... No? No nos dan miedo los combos. Pero me gustaría afilarlo, a ver si no hay ni punishment ni regalo evidente.\n  > Me gusta «la pareja».\n\n  En 5.6, «Lo que te acompaña»: sin Acceso (es un vínculo), ficha rápida; lo que hacéis igual se compra una vez y lo conserva quien lo pagó; lo que solo aporta él, entero en su ficha (y lo que te saque de nivel, en Llaves); por defecto ayuda (modificador, gratis), y si actúa por su cuenta lo que use va Potenciado; si lo pierdes, recuperas lo pagado. Expediente 1, «Brezo y Ceniza». El mutante mascota del Bazar remite a 5.6.\n\n- **Expediente 15, «Remache»: el equipo que se paga (24–28 oct).** **El autor:**\n  > El 13 me parece genial. El equipo que se paga. Las pistolas que pagan permiso inesquivable. El daño gratuito, y gadgets. Un universo bonito con mucho peso en los objetos es steampunk. Haz un concepto chulo de ficha cachibaches y los tres filtros (dinero etc).\n\n  Inventora y ladrona de la receta 15 (vapor victoriano). Dos hojas: la ficha y el porqué; y la tabla de los tres cerrojos (Acceso, la historia, la cuenta) con siete cachibaches del Bazar y la gatling que la historia no deja entrar. Señales en 5.6 y en la receta 15.\n\n- **Expediente 8, «Viper», y la barra de campaña (28 oct).** **El autor:**\n  > Podemos usarla como transformación costosa y pago limitado. Esa cara inhumana puede dañar la humanidad (mente en cyberpunk) de forma permanente, una piscina de 27 que refleja el daño lento durante la campaña. Y penalizadores de carisma al tratar con personas. Podríamos darle los puntos a mitad de precio por eso, reflejar otra cosa del manual.\n  > Sería un daño 1d10/3 redondeado hacia abajo. Que recuperemos el azar del manual. Cuál dado se mira es el tono. Se culmina animando a crear nuevas reglas. Aunque esta no venga en el manual.\n\n  **El autor (29 oct):**\n  > Nada de mención a sonreír con la lengua. Es cualquier sonrisa humana. No es una máscara, es una transformación, en la que pierde su apariencia humana, y su identidad se diluye cada vez que se aleja de su propia especie de forma tan evidente.\n\n  **El autor (30 oct):**\n  > Una sonrisa encantadora. Hasta que entra en modo ataque. Queda súper raro lo de sonrisa cualquiera. Era para corregir lo de sonrisa con la lengua fuera.\n\n  Su concepto: «Ciberpirata. Una sonrisa encantadora, hasta que entra en modo ataque.»\n\n  Su transformación: Físico +1, Limitada por su correa (3 Llaves). Cada vez que se aleja tanto de su especie, la identidad se diluye: 1d10 ÷ 3 a la Humanidad, leído con el dado del tono. Lo que no vuelve, lacra: de cada transformación regresa un poco menos humana, −1 a Influencia con personas, +1 punto. En el módulo de Barras propias del Baúl, la **barra de campaña**: su propio zoom (Guerra, 27) y no se vacía al estar a salvo. Señales en la receta 8, en Transformación y en la barra de campaña. Están en `src/v2/DECISIONES-ultimas.md`: el hechizo de Ysolde paga 1 Llave aunque tenga Arcano 2; la escalera llana abarata también la Rejilla (5·(3n−2)); fuera la «escala de la partida» de la App; las Firmas, en su Disciplina; hackear es Técnico; sin fila +0 en Recursos; sin porcentaje con bono 0 en las tarjetas; «permiso narrativo» solo para la Llave (el cerrojo pasa a «que la historia lo permita»); el Acelerado como está; el Baúl con coste de atención y cuándo estorba; «Ámbito» con mayúscula; nombres en castellano con mayúscula solo inicial.\n\n- **Las reglas de vuestra mesa (29 oct).** **El autor:**\n  > Faltaría un lugar para crear reglas propias, una pequeña mención en el manual, y la opción en la app de redactarla. De lo contrario, estamos dando un poder a la mesa que no hay cómo aplicarlo.\n\n  En el manual, 0.9 «Las reglas de vuestra mesa», al cerrar el capítulo 0: qué hace, cuándo se aplica y cómo se tira; el azar se lee con el dado de la tarjeta; si da poder, se paga en la escala que toca (que sea de la mesa no la hace gratis); se apunta en la ficha o en la lista de la mesa. Viper es el ejemplo y su última línea enlaza aquí. El Acelerado no se toca. En la App, «Reglas de la mesa» en la portada (nombre, texto, y si vale para toda la mesa o para una ficha): viajan en el archivo de la mesa y no en el Código, salen en la página de recordatorios de la ficha que las lleva (las de toda la mesa, también en la plantilla) y el asistente las recibe como válidas en esta mesa; sin IA, la búsqueda local también las mira.\n\n- **La lámina del Ancla (29 oct).** **El autor:** «imagen para el ancla». Abre el capítulo 2: una mano de cartas con el −2, el 4 y un ancla en una taberna de puerto, con el hombre del sombrero enfrente.\n\n- **Las láminas de la tesis, la consola y el archivo (29 oct).** **El autor:** «La tesis tiene la imagen tan potente [...] con los dos dados.» «La tesis con las emociones, y donde se diga que sirve para muchos mundos, esta.» La de las dos manos con el dado rojo y el azul abre «La tesis» en La Idea y la introducción del Juego; el espejo en color de las caras de todos los géneros abre el capítulo 1 de La Idea, donde dice que es un manual universal de emociones. La consola de mezclas abre el capítulo 8 del Juego, y el archivador de las fichas abre 9.5, los expedientes. **Ajuste del autor (29 oct):** la de las dos manos sale en la introducción del Juego y abriendo «1 · De qué va esto» en La Idea (y no dos veces en La Idea); el espejo en color pasa al capítulo 1 del Juego en lugar del de blanco y negro («nos gusta mucho más»), que se retira. El ejército bajo los dirigibles, con el hombre del sombrero en un banco, abre el capítulo 6, «El peligro».\n\n- **Las sueltas, por concepto (29 oct).** **El autor:** «Viper en moto me pega como apertura de fichas. Está siendo entrevistada y va bien.» «El coche detenido quizás en algo más de reglas. No le busques un significado hiper profundo. Se ve como algo de observación.» «El mago bajo el cielo entiendo la metáfora pero no pega en ese capítulo.» La ciudad verde y luminosa va sola en 1.1, bajo el eje del optimismo; la nave, en la receta 7; el páramo, en la receta 10; Viper en la moto abre el capítulo 7; el coche bajo la lluvia, en 2.3, junto a Alerta e Investigación. El mago y el coche no tienen sitio de apertura: el mago sigue sin colocar.\n- **La Llave y la batalla social (29 oct).** **El autor:** «Una es la llave (espada mágica da permiso a luchar con gigante) y el otro es la batalla social. Mete ambas.» El samurái de la katana azul ante el oni abre el capítulo 4, en 4.1. **El autor (30 oct):** «Era para sustituir a la que encabeza el capítulo de las llaves, no para añadirla [...]; se parece demasiado a la del capítulo anterior.» Sustituye al cuaderno ante el mecha, que se retira, y su pie sigue al de la Rejilla: «Salvo que tenga una Llave: esta espada le da derecho a tirada contra el gigante.» El bufón en el baile de máscaras, rojo contra azul, abre el Duelo Social del Bazar, tras su cita.\n- **La nave, a la cabecera del bloque (30 oct).** **El autor:** «El dibujo de la nave nos evoca ciencia ficción, que es el bloque, pero no [la ópera de estrellas concreta]. Deja la imagen casi donde está, un poco más arriba, fuera del cuadro [...], y en el encabezado de la ciencia ficción.» Sale de la receta 7 y va bajo el título del Bloque B, con el pie «Futuro y ciencia ficción: naves, tripulaciones y un pasillo largo hasta el puente.»\n- **El mago, a la cabecera de la fantasía (30 oct).** **El autor:** «Esa pa fantasía (bloque A). Quizás... es un poco darky.» El mago encapuchado bajo el agujero negro con su anillo de runas, con el hombre del sombrero tendiéndole un micrófono, abre el Bloque A bajo su título, como la nave abre el B: el bloque ya tiene ese registro (el barro y la herejía de la receta 2, las runas pagadas con sangre de la 6). Pie: «Fantasía: espadas, brujería y un cielo que no debería abrirse.»\n- **Una lámina para el Acelerado (30 oct).** **El autor:** «Tras revisar, pide el cuerpo algo para el acelerado. [...] Creo que no más de una imagen.» El espejo de los mundos (cuadrado, al 62 %) va en la primera página, tras 0.1 «La promesa», que acaba en «puedes jugar a tu universo favorito, sea el que sea». Repite la lámina del capítulo 1 del Juego completo porque el Acelerado se lee por separado. Pie: «Dos dados, todos los mundos. El tuyo también.»\n- **La lámina del baúl (30 oct).** **El autor:** «Para el baúl.» El baúl con patas del que asoma un dragón va en 9.1, tras su primer párrafo («piezas que el Director saca del baúl cuando la historia las pide»). Pie: «Saca del baúl lo que la historia pida. Y ciérralo antes de que salga solo.»\n- **La lámina de los monederos (30 oct).** **El autor:** «Y este para los costes.» El hombre del sombrero apuntando en el libro de cuentas, ante la cámara acorazada, entre monedas de todas las épocas (de la concha a la cripto) y llaves de todas las épocas (de la de hierro a la tarjeta), va en 5.1 (**el autor:** «Esa me gusta mucho más, cámbiala», en lugar del duende de la primera versión) «Dos monederos», tras la lista de los dos (puntos: el oficio; Llaves: el tamaño). Pie: «Dos sacos, y no se mezclan: las monedas compran oficio; las llaves, tamaño.»\n- **El menú, los Bloques C y D, y el Director que señala (30 oct).** **El autor:** «Menú degustación, mundos fantásticos (D), y otra que no sé dónde ponerla.» «Y esa para actual misterio.» Para la tercera, de las ideas propuestas: «Director y gancho. Y damos las imágenes por terminadas.» La androide que presenta la carta ante la pantalla de mundos, junto al sillón vacío y al hombre del sombrero, va bajo «El menú degustación». Pie: «Siéntese. Hoy tenemos veinte platos.» El equipo táctico ante el cuerpo colgado con sigilos abre el Bloque C. Pie: «Mundo actual y misterio: la puerta se abre, y lo de dentro no sale en el informe.» La cantante con armadura sobre el escenario abre el Bloque D. Pie: «Los raros y maravillosos: aquí se canta, se grita y se pelea con brillos.» El hombre del sombrero que señala el horizonte rojo al encapuchado de las garras va en 0.3 «Quién propone», bajo el título: el Director llega con una idea y la mesa la ajusta. Pie: «El Director señala un camino. Ir o no, lo decide la mesa.» Con estas, la serie de láminas queda cerrada.\n- **El último repaso de las láminas (30 oct).** **El autor:**\n  > Los monederos: la imagen más arriba. Bajo el título.\n  > El baúl: la caja de herramientas y el baúl son conceptos muy similares. Vamos a jugar con eso. La imagen está justo antes del título del baúl. No se sabe si cierra el título grande, y abre el título pequeño.\n  > Sería genial si puedes encuadrar el combate social en la página de arriba. Queda una página con mucho hueco justo antes.\n  > Imagen del menú degustación: «Siéntese. Hoy tenemos veinte universos para su deleite.»\n  > Los raros y maravillosos [...] cambia por: «Atrévete a jugar. Atrévete a soñar.»\n\n  Los monederos van justo bajo «5.1 Dos monederos». El baúl, entre el final de la entrada del capítulo 9 y el título de 9.1, con el pie «Caja de herramientas o baúl, según quién la abra. Ciérrala antes de que salga sola.» La corte del Duelo Social pasa a formato panorámico (21:9, clase `ancha`), que recorta techo y suelo; así cabe con su título y su cita en la página que antes quedaba medio vacía. El menú y el Bloque D llevan los pies del autor.\n- **La lámina de cierre (30 oct).** **El autor:** «Falta una imagen para cerrar [...] una imagen que deje el regustito que debe dejar. And we can call it FINISHED.» El despacho a oscuras, con el neón de NOGUM tras la persiana, el expediente «CLOSED» sobre la mesa y el hombre del sombrero apagando la luz al salir, va sola en su hoja y centrada, entre la Hoja de referencia y la Licencia. Pie: «Caso cerrado. Hasta la próxima mesa.» Con ella la serie de láminas queda terminada.\n- **Los remates de maquetación (30 oct).** **El autor:** «¿Es un producto con acabado profesional?» «Sí, arréglalos.» El término de una lista viaja con su definición y la comprobación del PDF ya lo vigila; las etiquetas del arsenal del Bazar caben en su columna; una lámina que no cabe sube por encima de hasta tres párrafos de su apartado; y se quitan tres saltos de hoja de la macrorrevisión (Daño ambiental, Las 40 Disciplinas, Mutaciones y artefactos) que dejaban páginas medio vacías.\n\n## HOJA DE REFERENCIA del Juego completo v2 (las reglas vigentes en una pagina)\nHoja de referencia\nLa tirada 1.3 · 1.4\nTira solo si fallar es interesante, no porque sea improbable (0.6). Dos d10, rojo y azul: lectura de la tarjeta + bono total ≥ TN → éxito. TN 6; 11 con la suma.\nTarjeta | Lees | TN | Pifia | Crítico | Con coste | \nÉpica | el alto | 6 | 1 | 10 | — | \nPulp desenfrenado | el alto | 6 | 1–2 | 10 | 6–7 | \nRealista | la suma | 11 | 2–3 | 19–20 | — | \nPrimera marcha | el rojo | 6 | 1 | 10 | — | \nComedia negra | el rojo | 6 | 1–2 | 9–10 | 6–7 | \nAngustia | el bajo | 6 | doble 1 | doble 10 | — | \nPesadilla | el bajo | 6 | 1 | 10 | — | \nLa Tragedia, la suma con TN 14, es la excepción declarada (1.4).\nPifia y crítico, en el número que usas, antes de sumar y sin bonos. Pifia: fallo y complicación. Crítico: más lejos (en combate, +1 daño).\nÉxito con coste, solo en las tarjetas que lo llevan (columna «Con coste»): un total de 6 o 7. Lo consigues, y el Director pone el precio.\nBono total = habilidad + dificultad + equipo + efectos. La dificultad es un modificador; la TN no se mueve: +2 fácil · 0 estándar · −2 difícil · −4 heroico.\nEl Ancla cap. 2\nTodas las fichas van de −2 a +4: ese rango es el Ancla.\nPirámide | Cuesta | Total | Bono | \nÁmbito (5) vacío: Nulidad | — | — | −2 | \nSu otra columna: Torpe | — | — | −1 | \nDominio (10) | 1 | 1 | +1 | \nDisciplina (40) | 1 | 2 | +2 | \nFirma (abierta) | 2 | 4 | +4 | \nSe usa el escalón más alto que se aplique; los escalones no se suman entre sí. La pirámide no da +0.\nEstilo +2: fijo, fuera de la pirámide, no se compra. Se tira cuando ya no se puede fallar, para ver cómo (3.5).\nLos bonos se acumulan, lo que se pueda, a criterio de mesa (2.5). Por encima de +4, tiras con +4, y el margen sirve para algo más difícil y con más premio.\nPor debajo de −2, el Director decide si hay derecho a tirada; si lo hay, con −2.\nLa Rejilla cap. 3 · 9.5\nUn nivel por Ámbito, en el de la acción. Basta un nivel (3.1):\nMismo nivel: se tira con normalidad.\nEl de abajo no tiene derecho a tirada, ni para dar ni para salvarse: se narra su derrota. Salvo que traiga una Llave.\nEl de arriba no tira: tiene éxito. Si importa cómo, Estilo.\nLas dos lecturas, según el tono (3.2). Narrativa: el de arriba es el tema de la historia; escala propia, o ninguna. Tangible: de verdad puede cien veces más.\n1 | 2 | 3 | 4 | 5 | 6 | \npersona | sala | edificio | ciudad | país | planeta | \n×1 | ×100 | ×10⁴ | ×10⁶ | ×10⁸ | ×10¹⁰ | \nGrande en todo el Ámbito: Rejilla. En una sola cosa: Llave. La Rejilla humana realista es 1 en todo.\nLo cósmico (6) casi siempre es injugable (3.7). La Rejilla la abre la historia, no los puntos; si sube uno, los demás, lo equivalente (3.6).\nQuien pilota un mecha juega con su ficha (3.8). El decorado, sin ficha ni tirada, actúa como n−1.\nLa Llave cap. 4 · 9.5\nToda una Disciplina (Atletismo, Acrobacia, Sigilo…), contra cualquier objetivo, te pone n niveles de Rejilla por encima del tuyo. En esa tirada actúas como esa Rejilla (4.1).\nEres 1 contra un 1: te pone en 2 y él no tira. Contra un 2: tiras, con tu bono completo; no se protege dos veces.\nAnula lo que dice que anula, y nada más (4.2). La granada, Llave 2: no se absorbe, se esquiva con −2, y a un bicho de nivel 2 le puede hacer daño.\nUna Llave por rasgo; el mismo concepto no se cobra dos veces.\nSubir | +1 | +2 | +3 | +4 | +5 | \nCompleta: n² | 1 | 4 | 9 | 16 | 25 | \nLimitada: ÷2, al alza | 1 | 2 | 5 | 8 | 13 | \nLimitada: contra una sola cosa, o solo para el daño. A un nivel cuesta igual: mejor no limitarla (un consejo, 4.3).\nPropia: se compra, permanente. Prestada o de un momento: la da la ficción (una emboscada, ser veinte), dura una escena y no se paga. En blanco: se escribe al usarla.\nLa Parca, una Llave al daño con su nivel: por debajo, fuera de combate sin tirada; a su altura, Daño 2; por encima, nada sin Llave (4.5).\nPermiso: lo que ninguna habilidad hace (volar, ver a través de las paredes), 1 Llave. Hechizo: el punto en Arcano es el requisito; el hechizo es el permiso.\nLa cuenta cap. 5\nDos monederos que no se cambian: puntos (el oficio) y Llaves (el tamaño). El equipo pide además Acceso: lo que tus Recursos te dejan tener (0 cotidiano · 1 arma seria · 2 militar · 3 lo que no debería existir).\nSalida: 12 puntos (14 para todos si algún jugador lleva Arcano) y un bote aparte: 5 Llaves o +1 de Rejilla. Punto de partida recomendado, 1·1·1·1·2, con el 2 donde el universo lo deje. Más o menos, en la sesión 0 (5.2).\nProgreso: por defecto, una Llave por sesión y por cabeza; los puntos, al ritmo de la mesa (5.8).\nQué (5.4) | Se paga | \nUn bono, o dificultar la defensa del otro | 1 punto por +1 | \nPermiso, niveles, anular una defensa (la pistola) | Llaves | \nEl número de daño | gratis | \nAfectar al nivel siguiente (la Parca) | Llave | \nLo de un solo uso, o lo que dura una escena | gratis | \nLo que hay que reponer de vez en cuando | Limitado | \nLo que es para siempre | mínimo 1 | \nAjuste, sobre puntos y Llaves (no sobre el Acceso), al alza, y solo por lo que la cuenta no ha pagado: Limitado ÷2 · Completo ×1 · Potenciado ×2 · Desatado ×3. Vago a propósito (5.5).\nUnidad de cambio: un Ámbito n niveles por encima vale 5·n² Llaves en Rejilla (5, 20, 45, 80); a mano, 8·n² (8, 32, 72, 128) (5.3).\nEl equipo devuelve sus puntos y Llaves al dejarlo; lo prestado o robado dura una escena y no cuesta (5.7).\nEl combate cap. 6\nAntes de nada, la Rejilla: a distinto nivel, el de abajo no tira.\nIniciativa por guardias: declara Violencia, Treta o Especialidad y tira tu mejor habilidad acorde. De mayor a menor; empate, más bono, y luego los PJ. Crítico, primero; pifia, último. Cambiar de guardia: al final (6.1).\n1 · Impacto: el atacante tira contra la TN. Pifia o fallo, no conecta: no hay defensa. Éxito, conecta. Crítico, +1 al daño.\n2 · Mitigación: si la ficha técnica lo deja, el defensor elige esquivar (Acrobacia) o absorber (Entereza) y tira contra la TN. Se comparan niveles de resultado (6.2):\nEl defensor… | Daño que recibe | \niguala o supera al atacante | ninguno: el empate es suyo | \nacierta (o con coste), por debajo | el del arma −1 | \nfalla | completo | \npifia | completo, +1 (+2 con crítico) | \nDaño: 1 leve, 2 serio. El de un arma llega a 2, más el crítico; por encima, la Parca.\nEtiquetas, que mandan sobre el empate (6.3). Esq: Total · Parcial (al menos 1) · Difícil −2 · Fácil +2 · Nula. Abs: Total · Máx N · Nula. Rejilla N: el arma es una Llave de ese nivel.\nVida fractal, la misma ficha: 3 bloques (Letal) · 9 casillas (Táctico) · 27 puntos (Guerra). Sano, Herido, Crítico, Fuera de combate (6.4).\nBarras: Física, Mental (lo social va aquí), Espiritual y las del género. Sus penalizadores se suman. Vuelven enteras al estar a salvo; las consecuencias se quedan hasta curarse (6.5).\nFuera de combate no es la muerte: la muerte se pacta (0.7).\nCaso cerrado. Hasta la próxima mesa.\n"</script>

/* dentro de cada tema, primero las reglas sin chicha y luego las que piden
   llevar un numero. El orden es el de "lo mas caracteristico del tema". */
var BAUL_ORD = [
 {light:[1,15,8], heavy:[0]},
 {light:[10,2,11,16,17], heavy:[3]},
 {light:[14], heavy:[13,6,7]},
 {light:[5], heavy:[9,12,4]}
];
function baulChicha(){ return sc1('baul','chicha') >= 3; }
function baulCero(){ return !baulChicha() && sc1('baul','insiste') > 0 && sc1('baul','insiste') <= 2; }
function baulCand(gi){ var o = BAUL_ORD[gi]; return o.light.concat(baulChicha() ? o.heavy : []); }
function baulDe(gi){ return baulCand(gi).slice(0, cuantas(sc('baul','t' + gi))); }
function aplicaBaul(){
  if (sinContestar('baul')) return;
  if (baulCero()) { setBaulMask(0); return; }
  var m = 0;
  BAUL_ORD.forEach(function(x, gi){ baulDe(gi).forEach(function(k){ m |= (1 << k); }); });
  setBaulMask(m);
}
function resBaul(gi){
  var on = baulDe(gi);
  return on.length
    ? {t:[on.length + (on.length === 1 ? ' regla' : ' reglas'), on.length + (on.length === 1 ? ' rule' : ' rules')],
       d:[on.map(function(k){ return DATA.baul[k][0]; }).join(', '), on.map(function(k){ return DATA.baul[k][1]; }).join(', ')]}
    : {t:['Ninguna de este tema','None from this theme'], d:['El núcleo se encarga.','The core handles it.']};
}

var SECC = {'0.6':'ch0-tirar','0.7':'ch0-muerte','2.4':'ch2-firmas','2.5':'ch2-bonos','3.1':'ch3-nivel','3.2':'ch3-lecturas','3.3':'ch3-ejemplos','3.4':'ch3-ambitos','3.5':'ch3-estilo','3.6':'ch3-subir','3.7':'ch3-techos','3.8':'ch3-sincro',

  '9.1':'ch9-baul','9.3':'apx-bazar','9.4':'ch9b'};
function juegoUrl(id){
  var p = PRODS.filter(function(x){ return x.es === 'Juego'; })[0], u = p && p.url;
  if (!u) return '';
  return u + (S.lang === 'en' && !/claude\.ai/.test(u) ? (u.indexOf('?') < 0 ? '?' : '&') + 'lang=en' : '') + '#' + id;
}
function refs(html){
  return String(html).replace(/(^|>)([^<]+)/g, function(m, a, tx){
    return a + tx.replace(/\((\d\.\d)(?:–(\d\.\d))?\)/g, function(all, x, y){
      if (!SECC[x] || (y && !SECC[y])) return all;
      var l = function(n){ var u = juegoUrl(SECC[n]); return u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + n + '</a>' : n; };
      return '(' + l(x) + (y ? '–' + l(y) : '') + ')';
    });
  });
}

function formEstado(id){
  var hayUni = M.known !== null;
  if (id === 'tono') return (M.opt && M.caos)
    ? [pick(card().n) + (isAcc() ? '' : ' · ' + pick(ZOOM[zoomK()].n)) + (estilo() ? ' · ' + t('Estilo','Style') : ''), true]
    : [t('Sin contestar','Not answered yet'), true];
  if (id === 'uni') return hayUni ? [worldName() + ' · ' + t('nivel máximo del mundo ','world maximum ') + mundoMax(), true]
                                  : [t('Sin contestar','Not answered yet'), true];
  if (id === 'baul') return isAcc() ? [t('El Acelerado no usa el Baúl','Accelerated has no Chest'), false]
    : !hayUni ? [t('Hace falta el universo','Needs the universe first'), false]
    : [baul().length + ' ' + t('de ' + DATA.baul.length + ' activas','of ' + DATA.baul.length + ' on'), true];
  if (id === 'pnj') return !hayUni ? [t('Hace falta el universo','Needs the universe first'), false]
    : [(pnjs().length ? pnjs().length + ' ' + t(pnjs().length === 1 ? 'en el reparto' : 'en el reparto', pnjs().length === 1 ? 'in the cast' : 'in the cast')
        : t('Sin nadie todavía','Nobody yet')), true];
  return !hayUni ? [t('Hace falta el universo','Needs the universe first'), false]

    : [S.chars.length + ' ' + t(S.chars.length === 1 ? 'ficha' : 'fichas', S.chars.length === 1 ? 'sheet' : 'sheets'), true];
}

/* --------------------------- los pasos de cada formulario --------------------------- */
function pasosTono(){
  var p = [];
  S_TONO.forEach(function(sec){
    if (isAcc() && (sec.id === 'vida' || sec.id === 'estilo')) return;
    for (var i = 0; i < 3; i++) p.push({t:'q', s:sec, i:i});
    p.push({t:'res', s:sec});
  });
  p.push({t:'fin'});
  return p;
}
function pasosUni(){
  var p = [{t:'pick', k:'known'}];
  if (M.known === true) {
    p.push({t:'pick', k:'family'});
    if (M.family) p.push({t:'pick', k:'world'});
    if (M.world !== null && M.world !== undefined) p.push({t:'fin'});
    return p;
  }
  if (M.known !== false) return p;
  S_UNI.forEach(function(sec){
    if (sec.id === 'magia') p.push({t:'gate', g:'sobr', q:G_SOBR});
    if (sec.sup && !uniSobrOn()) return;
    for (var i = 0; i < 3; i++) p.push({t:'q', s:sec, i:i});
    p.push({t:'res', s:sec});
    if (sec.id === 'mundo') p.push({t:'one', g:'pmax', q:Q_PMAX});
  });
  p.push({t:'one', g:'toon', q:Q_TOON});
  p.push({t:'fin'});
  return p;
}
function pasosBaul(){
  var p = [{t:'gate', g:'chicha', q:G_CHICHA}];
  if (!sc1('baul','chicha')) return p;
  if (!baulChicha()) {
    p.push({t:'gate', g:'insiste', q:G_INSIST});
    if (!sc1('baul','insiste')) return p;
    if (baulCero()) { p.push({t:'cero'}); return p; }
  }
  S_BAUL.forEach(function(sec, gi){
    for (var i = 0; i < 3; i++) p.push({t:'q', s:sec, i:i});
    p.push({t:'res', s:sec, gi:gi});
  });
  p.push({t:'fin'});
  return p;
}
function pasos(fid){ return fid === 'tono' ? pasosTono() : fid === 'uni' ? pasosUni() : pasosBaul(); }
function aplica(fid){ if (fid === 'tono') aplicaTono(); else if (fid === 'uni') aplicaUni(); else if (fid === 'baul') aplicaBaul(); }
function sectores(fid){ return fid === 'tono' ? S_TONO : fid === 'uni' ? S_UNI : S_BAUL; }

function bindPasos(fid){
  var v = $('view'), ps = pasos(fid), p = ps[S.st[fid] || 0];
  function avanza(){ S.st[fid] = Math.min((S.st[fid] || 0) + 1, pasos(fid).length - 1); persist(); render(); window.scrollTo(0, 0); }
  function marca(n){
    if (p.t === 'q') setAns(fid, p.s.id, p.i, n); else { S.q[fid] = S.q[fid] || {}; S.q[fid][p.g] = [n]; }
    aplica(fid); persist(); render(true);
  }
  v.querySelectorAll('[data-sc]').forEach(function(b){ b.addEventListener('click', function(){ marca(+b.getAttribute('data-sc')); }); });
  v.querySelectorAll('[data-scr]').forEach(function(r){
    r.addEventListener('input', function(){ marca(Math.max(1, Math.min(5, +r.value || 3))); });
  });
  v.querySelectorAll('[data-pk]').forEach(function(b){ b.addEventListener('click', function(){
    var x = b.getAttribute('data-pk').split('|');
    if (x[0] === 'known') { M.known = x[1] === '1'; M.family = null; M.world = null; M.unis = null; if (!M.known) aplicaUni(); }
    else if (x[0] === 'family') { M.family = x[1]; M.world = null; }
    else { applyPreset(+x[1]); S.q.tono = {}; S.q.baul = {}; S.st.tono = 0; S.st.baul = 0; S.ia = {}; }
    persist(); render(true);
  }); });
  v.querySelectorAll('[data-fsig]').forEach(function(b){ b.addEventListener('click', avanza); });
  v.querySelectorAll('[data-fat]').forEach(function(b){ b.addEventListener('click', function(){ S.st[fid] = Math.max(0, (S.st[fid] || 0) - 1); persist(); render(); window.scrollTo(0, 0); }); });
  v.querySelectorAll('[data-fcero]').forEach(function(b){ b.addEventListener('click', function(){ S.st[fid] = 0; persist(); render(); window.scrollTo(0, 0); }); });
  v.querySelectorAll('[data-fsal]').forEach(function(b){ b.addEventListener('click', function(){ aplica(fid); S.form = null; persist(); render(); window.scrollTo(0, 0); }); });
  v.querySelectorAll('[data-ia]').forEach(function(b){ b.addEventListener('click', function(){ pideLectura(b.getAttribute('data-ia')); }); });
  v.querySelectorAll('[data-iastop]').forEach(function(b){ b.addEventListener('click', function(){ if (iaCtl) iaCtl.abort(); }); });
  bindTalk();
  var g = $('talkGo');
  if (g) g.addEventListener('click', function(){ S.talk.on = true; persist(); render(); window.scrollTo(0, 0); });
}

function respuestasTexto(fid){
  var out = [];
  if (fid === 'uni' && M.known && M.world !== null) {
    return '- No ha contestado escalas: ha usado el atajo y ha elegido el universo conocido «' + KNOWN[M.world].n[0] +
      '», que aplica la receta de emulación nº ' + (KNOWN[M.world].r + 1) + ' («' + DATA.recipes[KNOWN[M.world].r][0] + '») entera.';
  }
  sectores(fid).forEach(function(s){
    var a = ans(fid, s.id); if (!a.length) return;
    s.qs.forEach(function(q, i){
      if (!a[i]) return;
      /* las de cinco opciones dicen la elegida; las de acuerdo, en cuanto de acuerdo */
      out.push('- [' + s.k[0] + '] «' + q.v[0] + '» → ' + a[i] + '/5 («' + (q.o ? q.o[a[i] - 1][0] : ACN[a[i] - 1][0]) + '»)');
    });
  });
  if (fid === 'baul') {
    [['chicha', G_CHICHA], ['insiste', G_INSIST]].forEach(function(x){
      var n = sc1('baul', x[0]); if (n) out.push('- [delimitar] «' + x[1].v[0] + '» → ' + n + '/5');

/* ======================= 5 · EL REPARTO (PNJ) ======================= */
/* Las fichas rapida y de decorado de 7.4 y 7.5, con la Regla del Estilo de 3.5 como veredicto.
   La pregunta del nivel no se hace en abstracto: se hace contra el grupo,
   que es para lo que sirve el nivel. */
function nuevoPnj(){ return {step:0, tipo:null, rel:null, amb:null, hab:null, dur:null, nom:''}; }
function habName(k){ var p = String(k).split('.'), a = AMB[+p[0]], d = a && a.doms[+p[1]]; return d ? pick(d.n) + ' › ' + pick(d.dis[+p[2]]) : '—'; }
function ambOf(id){ return AMB.filter(function(a){ return a.id === id; })[0] || null; }
function pnjs(){ S.pnjs = S.pnjs || []; return S.pnjs; }
/* El nivel del grupo NO es el nivel maximo del mundo (mundoMax()): es la Rejilla mas
   alta que tenga cualquier personaje en el ambito que importa (en cualquiera,
   si aun no hay ambito), o 1 si no hay fichas. */
function pjNivel(amb){
  var n = 1;
  (S.chars || []).forEach(function(c){ AMB.forEach(function(a, ai){ if (!amb || a.id === amb) n = Math.max(n, ambLvl(c, ai)); }); });
  return n;
}
/* y nada pasa del nivel maximo del mundo (3.7): lo que no existe ahi no se
   reparte (si los personajes ya lo han pasado, manda su nivel) */
function pnjNivel(rel, amb){ var g = pjNivel(amb); return Math.max(1, Math.min(5, Math.max(mundoMax(), g), g + (rel === 'bajo' ? -1 : rel === 'alto' ? 1 : 0))); }
/* Acelerado (3, improvisar un enemigo): un nivel de Rejilla, UNA habilidad a +2
   (todo lo demas a +0) y las casillas que quieras que dure la pelea, 3 por
   defecto. En el completo, un Ambito entero a +2 y la vida fractal. */
function pnjCasillas(P){ if (P.tipo === 'decorado') return 0; if (isAcc() && !P.dur) return 3; return P.dur === 'corta' ? 3 : P.dur === 'media' ? 9 : 27; }
/* El decorado (7.5) no tiene ficha, ni tirada, ni siquiera Rejilla: actua como
   n−1, un nivel por debajo de los jugadores. Por eso no se le pregunta el nivel. */
function pnjPasos(P){
  if (P.tipo === 'decorado') return ['tipo', 'fin'];
  var p = ['tipo', 'nivel'];
  if (P.tipo === 'rapida') { p.push('etiq'); p.push('dur'); }

/* 3.5: la Regla del Estilo se aplica contra el decorado Y contra todo lo que
   este por debajo de tu nivel. Son dos condiciones, no una.
   Y la Rejilla es RELATIVA: no se juzga por el numero, se juzga por el numero
   AL LADO del vuestro. El mismo Rejilla 2 es el ciberpsicopata que os revienta
   esta noche o, tres arcos mas adelante, algo a lo que ya no haceis caso. Por
   eso el veredicto de una ficha guardada se recalcula cada vez: si el grupo
   sube, el PNJ baja solo. Lo que esta muy por encima NO es decorado (7.5). */
function veredictoEstilo(tipo, n, amb){
  if (tipo === 'decorado') return ['ok', t('Contra él se aplica la Regla del Estilo', 'The Style Rule applies against them'),
    t('Es decorado: con él ya no se puede fallar. No se tira para ver si ganáis, se tira para ver cómo de bien quedáis (3.5).',
      'They are scenery: you can no longer fail against them. You do not roll to see if you win, you roll to see how good you look (3.5).')];
  var g = pjNivel(amb);
  if (n > g) return ['bad', t('No se le gana', 'You do not beat this'),
    t('Está por encima. Sin Llave no hay derecho a tirada: se rodea, se huye o se busca una Llave; y si va a por vosotros, se narra la derrota (3.1).',
      'They are above you. Without a Key there is no right to roll: you go round it, flee, or look for a Key; and if it comes for you, the defeat is narrated (3.1).')];
  if (n < g) return ['ok', t('Contra él se aplica la Regla del Estilo', 'The Style Rule applies against them'),
    t('Está por debajo de los personajes. No se tira para ver si ganan: se tira para ver cómo de bien quedan.',
      'They are below the characters. You do not roll to see if the players win: you roll to see how good they look.')];
  return ['mid', t('Pelea de verdad', 'A real fight'),
    t('Está a vuestra altura. Se tira como contra cualquier rival y puede salir mal.',

}
