<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOGUM App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>

:root{
  --ground:#e7ddcb; --paper:#f5efe3; --ink:#1c1814; --ink-2:#4a4237; --ink-3:#655c4e;
  --rule:#d4c7af; --rule-2:#e8ddc9; --side:#ede4d3;
  --red:#b8323a; --red-soft:#f0ded4; --blue:#2a56a0; --blue-soft:#e3e1dd;
  --amber:#8a5a00; --amber-soft:#ebe2cf; --violet:#5b3f99; --violet-soft:#e7dfdc;
  --drop:#8f2f36; --drop-soft:#ecded3; --ok:#2f6b45; --ok-soft:#e3e3d5;
  --c-pifia:#9b2a32; --c-fallo:#6b6288; --c-parcial:#b98a00; --c-exito:#2f63b5; --c-critico:#0f8f72;
  --shadow:0 1px 3px rgba(60,40,15,.14),0 10px 30px rgba(60,40,15,.11);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  /* lo que se lee lleva Ibarra; lo que es marca o tarjeta, Big Shoulders (T160) */
  --book:"Ibarra Real Nova",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#100e0c; --paper:#1c1916; --ink:#ede6d9; --ink-2:#c5bba9; --ink-3:#9b907e;
  --rule:#3b342b; --rule-2:#2c2721; --side:#151310;
  --red:#f07378; --red-soft:#402827; --blue:#86a9ec; --blue-soft:#2e313a;
  --amber:#e7b95a; --amber-soft:#3f3422; --violet:#b9a2ee; --violet-soft:#37303b;
  --drop:#f08a90; --drop-soft:#402c2b; --ok:#8fd1a6; --ok-soft:#30382e;
  --c-pifia:#e0666e; --c-fallo:#9a93ad; --c-parcial:#e0aa42; --c-exito:#86a9ec; --c-critico:#5cc3a0;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#100e0c; --paper:#1c1916; --ink:#ede6d9; --ink-2:#c5bba9; --ink-3:#9b907e;
  --rule:#3b342b; --rule-2:#2c2721; --side:#151310;
  --red:#f07378; --red-soft:#402827; --blue:#86a9ec; --blue-soft:#2e313a;
  --amber:#e7b95a; --amber-soft:#3f3422; --violet:#b9a2ee; --violet-soft:#37303b;
  --drop:#f08a90; --drop-soft:#402c2b; --ok:#8fd1a6; --ok-soft:#30382e;
  --c-pifia:#e0666e; --c-fallo:#9a93ad; --c-parcial:#e0aa42; --c-exito:#86a9ec; --c-critico:#5cc3a0;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.5 var(--serif);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding:10px 16px;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);min-height:60px}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.dice{display:flex;gap:4px}.dice i{width:18px;height:18px;border-radius:4px;background:var(--red);transform:rotate(-8deg);display:block}.dice i+i{background:var(--blue);transform:rotate(10deg)}
.brand b{font:800 26px/1 var(--display);letter-spacing:.06em}
.brand small{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:thin;align-items:center}
.tab{flex:none;border:1px solid var(--rule);background:var(--paper);border-radius:8px 8px 8px 8px;padding:9px 14px;font:600 13px/1 var(--mono);text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab.add{border-style:dashed}
.tab.aux{margin-left:auto}
.lang{display:flex;flex:none;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;padding:8px 11px;font:600 12px/1 var(--mono)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tool{flex:none;border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:9px 12px;font:600 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2)}
.tool:hover{color:var(--ink);border-color:var(--ink-3)}
.tool.primary{background:var(--red);border-color:var(--red);color:#fff}
.tool.on{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.tool:disabled{opacity:.4;cursor:default}
main{padding:18px 16px 60px}
.wrap{max-width:1500px;margin:0 auto}
.disclaimer{max-width:1500px;margin:0 auto 14px;font-size:14.5px;color:var(--ink-2);background:var(--paper);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:8px;padding:10px 14px}
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px;align-items:start}
@media (max-width:1050px){.split{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:clamp(16px,2.4vw,26px)}
.formhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.formhead h2,.sheethead h2{font:800 30px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0}
.lockmsg{font:13px/1.4 var(--mono);color:var(--amber);background:var(--amber-soft);border-radius:8px;padding:8px 12px;margin:10px 0 4px}
fieldset.q{border:0;border-top:1px solid var(--rule-2);margin:0;padding:18px 0 12px}
fieldset.q:disabled{opacity:.55}
.q legend{padding:0;font:600 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:6px}
.q .ask{font:600 21px/1.3 var(--serif);margin:0 0 12px;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.opts.wide{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.opt{text-align:left;border:1.5px solid var(--rule);background:var(--ground);border-radius:10px;padding:11px 13px;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--ink-3)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.opt small{display:block;font:12px/1.35 var(--mono);opacity:.75;margin-top:3px}
.tech{margin:10px 0 0;font:12.5px/1.45 var(--mono);color:var(--ink-3)}
.tech b{color:var(--blue);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--rule);background:var(--ground);border-radius:999px;padding:6px 11px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
/* sheet */
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:clamp(16px,2.4vw,28px)}
.sheethead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--ink);padding-bottom:10px;margin-bottom:14px}
.sheethead .sub{font:600 12px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-top:4px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font:600 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em;padding:5px 8px;border-radius:999px;background:var(--rule-2)}
.badge.red{background:var(--red-soft);color:var(--red)}.badge.blue{background:var(--blue-soft);color:var(--blue)}.badge.amber{background:var(--amber-soft);color:var(--amber)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:14px}
.rbox{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--ground)}
.rbox h3{font:800 17px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0 0 6px}
.rbox dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:14px}
.rbox dt{font:600 10.5px/1.7 var(--mono);text-transform:uppercase;color:var(--ink-3)}
.rbox dd{margin:0}
.rbox p{margin:4px 0 0;font-size:14px}
.rbox.card{border-top:4px solid var(--red)}
.note{font:12.5px/1.45 var(--mono);color:var(--ink-3)}
.sec{font:800 19px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec .note{font-family:var(--mono);text-transform:none;letter-spacing:0}
/* tracks */
.tracks{display:grid;gap:8px}
.track{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center}
.track > span{font:600 11px/1.2 var(--mono);text-transform:uppercase;color:var(--ink-2)}
.blocks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.blk{border:2px solid var(--ink);border-radius:6px;padding:4px;display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-height:30px}
.blk .lbl{width:100%;font:600 10px/1 var(--mono);color:var(--ink-3);text-transform:uppercase}
.u{flex:1 1 0;min-width:10px;height:22px;border:1.5px solid var(--ink-2);border-radius:3px;background:var(--paper);padding:0;position:relative}
.u.full{background:var(--red);border-color:var(--red)}
.u.half{background:linear-gradient(135deg,var(--red) 50%,var(--paper) 50%)}
.u:disabled{cursor:default}
/* pyramid */
.amb{border:1px solid var(--rule);border-radius:10px;margin-bottom:10px;overflow:hidden}
.amb-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:var(--rule-2)}
.amb-h b{font:800 18px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;flex:1}
.base{font:600 12px/1 var(--mono);padding:5px 8px;border-radius:6px}
.base.neg{background:var(--red-soft);color:var(--red)}.base.zero{background:var(--ok-soft);color:var(--ok)}
.doms{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:700px){.doms{grid-template-columns:1fr}}
.dom{padding:8px 12px;border-top:1px solid var(--rule-2)}
.dom + .dom{border-left:1px solid var(--rule-2)}
.lvl{display:flex;align-items:center;gap:8px;padding:3px 0;flex-wrap:wrap}
.lvl .nm{flex:1;min-width:90px}
.lvl.d .nm{font-weight:600}
.lvl.s{padding-left:14px}
.lvl.f{padding-left:30px;font-size:14px}
.pip{border:1.5px solid var(--rule);background:var(--paper);border-radius:6px;padding:3px 8px;font:600 12px/1.2 var(--mono);min-width:40px}
.pip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pip:disabled{opacity:.35;cursor:default}
.mini{border:1px dashed var(--rule);background:none;border-radius:6px;padding:2px 8px;font:600 11px/1.3 var(--mono);color:var(--ink-3)}
select{border:1px solid var(--rule);border-radius:6px;background:var(--paper);padding:5px 8px;max-width:100%}
input[type=text],textarea{border:1px solid var(--rule);border-radius:8px;background:var(--paper);padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
.pts{font:800 22px/1 var(--display)}
.pts.over{color:var(--red)}
.stance{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stance button{border:2px solid var(--rule);background:var(--ground);border-radius:10px;padding:10px;font:800 18px/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.stance button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.gear{width:100%;border-collapse:collapse;font-size:14px}
.gear th,.gear td{text-align:left;border-bottom:1px solid var(--rule-2);padding:6px 6px;vertical-align:top}
.gear th{font:600 10.5px/1.3 var(--mono);text-transform:uppercase;color:var(--ink-3)}
.gear tr.out td{opacity:.45}
.tag{display:inline-block;font:600 11px/1.2 var(--mono);padding:2px 5px;border-radius:4px;background:var(--rule-2);border:1px solid var(--rule);margin:1px 0}
.addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:700px){.fields{grid-template-columns:1fr}}
.fields label{display:block;font:600 11px/1 var(--mono);text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.create{margin-top:18px;display:flex;justify-content:center}
.create button{font:800 22px/1 var(--display);text-transform:uppercase;letter-spacing:.05em;padding:14px 28px;border-radius:12px;border:0;background:var(--red);color:#fff}
.blankpyr{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;font-size:13.5px}
.blankpyr div{border:1px solid var(--rule);border-radius:8px;padding:8px}
.blankpyr b{display:block;font:800 15px/1 var(--display);text-transform:uppercase;margin-bottom:4px}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-height:55vh;overflow:auto;margin:10px 0}
.msg{padding:10px 14px;border-radius:10px;max-width:86%;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--blue-soft)}.msg.ai{align-self:flex-start;background:var(--ground);border:1px solid var(--rule)}.msg.loc{align-self:flex-start;background:var(--amber-soft)}
.who{display:block;font:600 10.5px/1 var(--mono);text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font:600 11px/1 var(--mono);text-transform:uppercase;padding:6px 9px;border-radius:999px;background:var(--rule-2);color:var(--ink-3)}
.status.on{background:var(--ok-soft);color:var(--ok)}.status.off{background:var(--amber-soft);color:var(--amber)}
.timeline{list-style:none;margin:10px 0 0;padding:0 0 0 14px;border-left:2px solid var(--rule)}
.timeline li{margin-bottom:12px}
[hidden]{display:none!important}
@media (max-width:640px){.top{flex-wrap:wrap}.tabs{order:9;flex-basis:100%}.brand small{display:none}.track{grid-template-columns:1fr}}
@page{size:A4;margin:12mm}
@media print{
  :root{--paper:#fff;--ground:#fff;--ink:#161b24;--ink-2:#3b4250;--ink-3:#616978;--rule:#c9cfd8;--rule-2:#e7eaef;color-scheme:light}
  body{background:#fff;font-size:11pt}
  .top,.disclaimer,.noprint,#formPanel{display:none!important}
  main{padding:0}.split{display:block}
  .sheet{box-shadow:none;border:0;padding:0}
  .u.full,.base,.badge,.stance button[aria-pressed="true"],.rbox.card{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .amb,.rbox,.track{break-inside:avoid}
  select,input,textarea{border:0;background:none;appearance:none;-webkit-appearance:none;padding:0}
}

.tab.right{margin-left:auto}
/* wizard */
.wiz{max-width:860px;margin:0 auto}
.steps{display:flex;gap:6px;margin:0 0 16px;flex-wrap:wrap}
.steps span{flex:1 1 90px;font:600 10.5px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);border-top:4px solid var(--rule);padding-top:6px}
.steps span.done{border-color:var(--ink-2);color:var(--ink-2)}
.steps span.now{border-color:var(--red);color:var(--ink)}
.page{background:var(--paper);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);padding:clamp(20px,4vw,40px)}
.page .kick{font:600 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:0 0 12px}
.page .big{font:600 clamp(24px,3.4vw,32px)/1.25 var(--serif);margin:0 0 22px;text-wrap:balance}
.page .hint{font-size:15px;color:var(--ink-2);margin:-10px 0 18px}
.choices{display:grid;gap:10px}
.choice{display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:left;border:2px solid var(--rule);background:var(--ground);border-radius:12px;padding:14px 18px;font-size:18px;line-height:1.3}
.choice small{display:block;font:13px/1.35 var(--mono);color:var(--ink-3);margin-top:4px}
.choice:hover{border-color:var(--ink-3)}
.choice[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.choice[aria-pressed="true"] small{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.choice .mark{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid currentColor;opacity:.6}
.choice.multi .mark{border-radius:5px}
.choice[aria-pressed="true"] .mark{background:var(--red);border-color:var(--red);opacity:1}
.techline{margin:18px 0 0;padding-top:12px;border-top:1px dashed var(--rule);font:12.5px/1.5 var(--mono);color:var(--ink-3)}
.techline b{color:var(--blue)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.nav .btn{font:600 13px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em;border:1.5px solid var(--ink);background:var(--paper);border-radius:10px;padding:13px 18px}
.nav .btn.go{background:var(--ink);color:var(--paper)}
.nav .btn:disabled{opacity:.35;cursor:default}
.summary{width:100%;border-collapse:collapse;font-size:15px}
.summary td{border-bottom:1px solid var(--rule-2);padding:8px 6px;vertical-align:top}
.summary td:first-child{font:600 11px/1.5 var(--mono);text-transform:uppercase;color:var(--ink-3);width:34%}
.summary .tech{display:block;font:12px/1.4 var(--mono);color:var(--blue)}
.cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.cta .btn{font:800 20px/1 var(--display);text-transform:uppercase;letter-spacing:.05em;padding:14px 22px;border-radius:12px;border:2px solid var(--ink);background:var(--paper)}
.cta .btn.red{background:var(--red);border-color:var(--red);color:#fff}
/* reminders */
.remind{columns:2 300px;column-gap:14px}
.remind .rbox{break-inside:avoid;margin:0 0 12px}
.rbox table{width:100%;border-collapse:collapse;font-size:13.5px}
.rbox td{padding:2px 4px;vertical-align:top;border-bottom:1px solid var(--rule-2)}
.rbox td:first-child{font:600 12px/1.4 var(--mono);white-space:nowrap}
.rbox ul{margin:4px 0 0;padding-left:18px;font-size:13.5px}
.rbox li{margin:2px 0}
.lines{display:grid;gap:14px;margin:8px 0}
.line{border-bottom:1.5px solid var(--ink-3);height:26px;font:600 10.5px/1 var(--mono);text-transform:uppercase;color:var(--ink-3)}
.blankamb{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.blankamb div{border:1.5px solid var(--ink-2);border-radius:8px;padding:8px;min-height:120px;font-size:12.5px}
.blankamb b{display:block;font:800 16px/1 var(--display);text-transform:uppercase;margin-bottom:4px}
.gearblank td{height:26px}
/* pages & skill grid */
.sheetbar{display:flex;justify-content:flex-end;gap:8px;max-width:210mm;margin:0 auto 10px}
.a4{width:min(210mm,100%);min-height:297mm;margin:0 auto 18px;background:var(--paper);border:1px solid var(--rule);box-shadow:var(--shadow);padding:clamp(14px,3.5vw,13mm) clamp(14px,3.5vw,13mm) 18mm;position:relative}
.pgno{position:absolute;bottom:7mm;left:0;right:0;text-align:center;font:600 11px/1 var(--mono);color:var(--ink-3)}
.a4 .sec:first-child{margin-top:0}
.skillgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:760px){.skillgrid{grid-template-columns:1fr}}
.acard{border:1.5px solid var(--ink-3);border-radius:10px;overflow:hidden;break-inside:avoid}
.acard.null{border-style:dashed;border-color:var(--red)}
.acard-h{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--rule-2)}
.acard-h b{font:800 17px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;flex:1}
.best{font:600 11px/1 var(--mono);color:var(--ink-2)}
.power{display:flex;align-items:center;gap:6px;padding:5px 10px;border-bottom:1px solid var(--rule-2);flex-wrap:wrap}
.power .seg{display:flex;gap:2px}
.power .seg button{width:20px;height:12px;border:1px solid var(--ink-3);background:var(--paper);border-radius:2px;padding:0}

.meter button.lock:not(.on){opacity:.35}
.bonus{font:600 11px/1 var(--mono);min-width:20px;text-align:right}
.plus{border:1px solid var(--rule);background:var(--paper);border-radius:4px;width:18px;height:18px;padding:0;font:600 12px/1 var(--mono);color:var(--ink-2)}
.pagetop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.helpbtn{border:1.5px solid var(--blue);color:var(--blue);background:none;border-radius:999px;padding:5px 12px;font:600 12px/1 var(--mono)}
.helptext{background:var(--blue-soft);border-radius:10px;padding:10px 14px;font-size:15px;margin:4px 0 16px}
.choicewrap{display:flex;gap:6px;align-items:stretch}
.choicewrap .choice{flex:1}
.qbtn{flex:none;width:42px;border:2px solid var(--rule);background:var(--paper);border-radius:12px;font:700 18px/1 var(--mono);color:var(--blue)}
.summary td.chg{width:1%;white-space:nowrap;text-align:right}
.mini{border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:5px 10px;font:600 11px/1 var(--mono);text-transform:uppercase;color:var(--ink-2)}
.blankfields .line{margin-top:6px}
.gear .emptyrow td{height:26px}
/* scene tone */
.scene{position:sticky;top:58px;z-index:20;background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);padding:6px 16px}

.scenebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1500px;margin:0 auto;font-size:14px}
.scnow{background:var(--amber-soft);color:var(--amber);border-radius:999px;padding:4px 10px}
.mini.strong{border-color:var(--ink);color:var(--ink);margin-left:auto}
.tonegrid-wrap{max-width:900px;margin:10px auto 4px}
.tonegrid{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:6px;align-items:stretch}
.tonegrid .axis{font:600 11px/1.2 var(--mono);text-transform:uppercase;color:var(--ink-3);text-align:center;align-self:end}
.tonegrid .axis.row{align-self:center;text-align:right;padding-right:4px}
.tcellwrap{display:flex;gap:4px}
.tcell{flex:1;text-align:left;border:2px solid var(--rule);background:var(--paper);border-radius:10px;padding:8px 10px;min-width:0}
.tcell b{display:block;font-size:13.5px}
.tcell small{display:block;font:11px/1.3 var(--mono);color:var(--ink-3);margin-top:3px}
.tcell.on{border-color:var(--red);background:var(--red-soft)}
.accmodes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:640px){.tonegrid{grid-template-columns:repeat(3,minmax(0,1fr))}.tonegrid>span{display:none}.tcellwrap{flex-direction:column}.tcell small{display:none}}
/* dice */
.dicewrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;max-width:1100px;margin:0 auto}
@media (max-width:820px){.dicewrap{grid-template-columns:1fr}}
.dfield{margin:12px 0}
.dfield label{display:block;font:600 11px/1 var(--mono);text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.dfield select{width:100%}
.segbtns{display:flex;flex-wrap:wrap;gap:4px}
.segbtns button{flex:1 1 auto;border:1.5px solid var(--rule);background:var(--paper);border-radius:8px;padding:8px 10px;font:600 13px/1 var(--mono)}
.segbtns button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.check{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:15px}
.dtotal{font:600 14px/1.4 var(--mono);margin:14px 0 8px}
.dtotal b{font:800 28px/1 var(--display);margin-left:6px}
.okmsg{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:8px 12px}
.rollbtn{width:100%;font:800 26px/1 var(--display);text-transform:uppercase;letter-spacing:.06em;padding:16px;border-radius:12px;border:0;background:var(--red);color:#fff;margin-top:6px}
.rollbtn:disabled{opacity:.35}
.dice2{display:flex;justify-content:center;gap:18px;margin:10px 0 14px}
.die{width:96px;height:96px;border-radius:18px;display:grid;place-items:center;font:800 48px/1 var(--display);color:#fff;box-shadow:var(--shadow)}
.die.red{background:var(--red)}.die.blue{background:var(--blue)}
.die.dim{opacity:.35}.die.off{opacity:.12}
.dice2.spin .die{animation:spin .45s ease-out}
@keyframes spin{from{transform:rotate(-200deg) scale(.6)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.dice2.spin .die{animation:none}}
.dmath{text-align:center;font:600 14px/1.4 var(--mono);color:var(--ink-2);margin:0}
.dout{text-align:center;font:800 34px/1.1 var(--display);text-transform:uppercase;margin:6px 0}
.dout.fum{color:var(--red)}.dout.cri{color:var(--ok)}.dout.part{color:var(--amber)}.dout.ok{color:var(--blue)}.dout.fail{color:var(--ink-3)}
.dexp{text-align:center;margin:0 0 12px}
.dlog{font:12.5px/1.5 var(--mono);color:var(--ink-2);border-top:1px solid var(--rule-2);padding-top:8px;margin:0;padding-left:20px}
/* story */
.storygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;max-width:1500px;margin:0 auto}
.story label{display:block;font:600 12px/1.2 var(--mono);text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.story textarea{width:100%;min-height:170px}
.story.wide{grid-column:1/-1}

.sechead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sechead label{flex:1}
.unlock{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.unlock input{flex:1 1 180px;min-width:0}
/* questions modes */
.modesw{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.modesw button{border:0;background:var(--paper);padding:7px 14px;font:600 12px/1 var(--mono);text-transform:uppercase}
.modesw button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.msg.lock{align-self:flex-start;background:var(--red-soft);border:1px solid var(--red)}
/* talk */
.talkentry{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px;padding:12px 14px;border:2px dashed var(--blue);border-radius:12px;color:var(--blue)}
.talkentry .btn{font:600 13px/1 var(--mono);text-transform:uppercase;border:1.5px solid var(--blue);color:var(--blue);background:var(--paper);border-radius:10px;padding:11px 14px}
.talk textarea{width:100%;min-height:90px}
.talk .chat{max-height:45vh}
.understood{margin-top:14px}
.fdesc{font:italic 11px/1.3 var(--serif);color:var(--ink-3);padding:0 0 3px 22px}
@media print{

  .a4{width:auto;min-height:0;margin:0;border:0;box-shadow:none;padding:0 0 10mm;break-after:page}

  .pgno{bottom:0}
  .remind{columns:2}
  .acard.null,.meter button.on,.power .seg button.on{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* barra de reglas de la mesa */
.rulesbar{max-width:210mm;margin:0 auto 12px;border:1px solid var(--rule);border-radius:12px;background:var(--paper);box-shadow:var(--shadow);padding:9px 11px}

.rulesbar .spacer{flex:1 1 10px}
.rbpanel{border-top:1px solid var(--rule);margin-top:9px;padding-top:9px}

.rbp-t{font-size:13.5px;line-height:1.45;color:var(--ink-2);margin:0 0 9px;max-width:70ch}
.rbgrp{display:flex;gap:8px;align-items:baseline;margin-bottom:6px;flex-wrap:wrap}
.rbgn{flex:0 0 150px;font:600 11px/1.3 var(--mono);color:var(--ink-3)}
.rbgrp .chips{display:flex;flex-wrap:wrap;gap:5px;flex:1 1 300px}
.chip{border:1.5px solid var(--rule);background:var(--ground);border-radius:999px;padding:4px 10px;font-size:12.5px;line-height:1.2;text-align:left}
.chip.on{border-color:var(--red);background:var(--red-soft);color:var(--red);font-weight:600}
.rbcode{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:7px}
.rbcode input{flex:1 1 260px;min-width:0;font:13px/1.3 var(--mono);color:var(--ink);background:var(--ground);border:1px solid var(--rule);border-radius:7px;padding:7px 8px}
.rbcode input[readonly]{font-weight:600;letter-spacing:.02em}
.rulesbar textarea{width:100%;box-sizing:border-box;min-height:70px;font:11.5px/1.4 var(--mono);color:var(--ink);background:var(--ground);border:1px solid var(--rule);border-radius:7px;padding:7px 8px;margin-bottom:7px}
label.tool.file{cursor:pointer;display:inline-flex;align-items:center}
.rbmsg{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 0;font-size:13.5px;background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:7px 10px}

.acard .techo{font:600 10px/1 var(--mono);color:var(--red);background:var(--red-soft);border-radius:999px;padding:3px 7px;margin-left:6px}
.acard.noexiste{opacity:.55}
.arcchk{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--mono);color:var(--ink-2);margin-left:8px;cursor:pointer}
.seg button.cap{background:repeating-linear-gradient(135deg,transparent,transparent 3px,var(--rule) 3px,var(--rule) 4px);cursor:not-allowed}
.keys{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.potrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.potb{border:1.5px solid var(--rule);background:var(--ground);border-radius:999px;padding:4px 12px;font-size:13px}
.potb[aria-pressed="true"]{border-color:var(--red);background:var(--red-soft);color:var(--red);font-weight:600}
.potrow select{font:13px/1.2 var(--serif);border:1px solid var(--rule);border-radius:7px;padding:4px 6px;background:var(--ground);color:var(--ink)}

.krow input[type=text]{flex:1 1 140px;min-width:0;font:13px var(--serif);border:0;border-bottom:1px solid var(--rule);background:transparent;color:var(--ink);padding:3px 2px}

.finder{margin:10px 0}

.dcol.torpe .nm{opacity:.72}
.srow .bonus.neg{color:var(--red);font-weight:600}
.fitem .sem.parca,.cuenta .parca{color:var(--red);font-weight:600}
.eqbuscar{margin:0 0 12px}
.eqbuscar input{width:100%;box-sizing:border-box;font:18px/1.3 var(--serif);padding:13px 16px;border:2px solid var(--rule);border-radius:12px;background:var(--paper);color:var(--ink)}
.eqbuscar input:focus{outline:none;border-color:var(--red)}
.eqbuscar input::placeholder{color:var(--ink-3)}
.eqvacio{margin:0;padding:18px 4px;font-size:14.5px;line-height:1.5;color:var(--ink-3);text-align:center}
.eqcuantos{margin:0 0 8px;font:11.5px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
/* la vineta y la barra de acuerdo */
.vign{font:600 clamp(19px,2.6vw,25px)/1.4 var(--serif);margin:0 0 22px;text-wrap:balance}
.desliza{border:1px solid var(--rule);border-radius:12px;padding:14px 16px 10px;background:var(--ground)}
.despolos{display:flex;justify-content:space-between;gap:12px;font:600 11.5px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);margin-bottom:10px}
.despolos span:last-child{text-align:right}
.desliza input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;display:block}
.desliza input[type=range]:focus{outline:2px solid var(--blue);outline-offset:3px}
.desliza input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:999px;background:linear-gradient(90deg,var(--rule),var(--ink-3),var(--rule))}
.desliza input[type=range]::-moz-range-track{height:8px;border-radius:999px;background:linear-gradient(90deg,var(--rule),var(--ink-3),var(--rule))}
.desliza input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:var(--red);border:3px solid var(--paper);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.desliza input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--red);border:3px solid var(--paper);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.desliza input[type=range].sin::-webkit-slider-thumb{background:var(--ink-3)}
.desliza input[type=range].sin::-moz-range-thumb{background:var(--ink-3)}
.desval{margin:8px 0 0;text-align:center;font:600 17px/1.3 var(--serif);color:var(--ink)}
.desval.sin{font:12.5px/1.5 var(--mono);color:var(--ink-3);font-weight:400}
/* el repartidor */
.hubedi{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--rule);border-radius:10px;padding:9px 12px;margin:12px 0}
.hubedi>span:first-child{font:600 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.hubedi .note{font:11.5px/1.4 var(--mono);color:var(--ink-3);flex:1 1 200px}
.hubedi .tool.on{border-color:var(--red);background:var(--red);color:#fff}
.summary .chg{width:1%;white-space:nowrap}
/* la lectura del modelo */
.aiask{margin-top:16px;padding-top:12px;border-top:1px dashed var(--rule);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.aiask .note{font:11.5px/1.4 var(--mono);color:var(--ink-3);flex:1 1 220px}
.iawait{font:600 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--red)}
.iabox{margin-top:10px;min-height:1.6em;border-left:3px solid var(--red);padding:6px 0 6px 12px;font-size:15.5px;line-height:1.55;white-space:pre-wrap}

.fold{font:600 9.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--red);background:var(--red-soft);border-radius:999px;padding:2px 6px;margin-left:5px}
.fold.big{margin-left:auto}

/* el indicador de IA es un boton: lleva a la Configuracion */
button.status{border:0;cursor:pointer}
/* la configuracion */
.cfg{max-width:860px;margin:0 auto}
.cfgsec{margin-top:18px;padding-top:14px;border-top:1px solid var(--rule)}
.cfgsec:first-of-type{border-top:0;padding-top:4px}
.cfgest{font:13px/1.45 var(--mono);color:var(--ink-2);margin:0 0 8px}
.cfgok{font:13px/1.45 var(--mono);color:var(--ok);background:var(--ok-soft);border-radius:8px;padding:8px 12px;margin:0 0 10px}
.cfgmsg{font:13px/1.45 var(--mono);color:var(--ok);margin:6px 0 0}
.cfgmsg.bad{color:var(--red)}
.cfgchk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-2);margin:2px 0 10px}
.cfg input[type=password]{flex:1 1 260px;min-width:0;font:13.5px/1.3 var(--mono);padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
.cfgpriv{margin-top:12px;font-size:13.5px;line-height:1.5;color:var(--ink-2);background:var(--blue-soft);border-radius:8px;padding:10px 14px}
.cfgpriv p{margin:0}
.cfgpriv a{color:inherit;font-weight:600}
.cfg .rbf select{width:auto;min-width:min(330px,100%);max-width:100%}
/* el modelo es un campo libre dentro de una columna: sin esto, la base flexible de .rbcode input lo estira hacia abajo */
.cfg .rbf input{flex:none;width:min(330px,100%);box-sizing:border-box}
.cfgjson{width:100%;min-height:90px;margin-top:8px;font:12px/1.4 var(--mono)}
/* la bienvenida: la imagen de la App mientras la mesa esta vacia */
.bienvenida{position:relative;max-width:1500px;margin:0 auto 14px;border-radius:12px;overflow:hidden;background:#1c1814}
.bienvenida img{display:block;width:100%;height:clamp(170px,28vw,340px);object-fit:cover;object-position:50% 40%}
.bienvenida figcaption{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:baseline;gap:12px;padding:40px 18px 14px;
  background:linear-gradient(rgba(12,10,8,0),rgba(12,10,8,.85));color:#f5efe3}
.bienvenida b{font:800 clamp(28px,4.4vw,44px)/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.bienvenida span{font:600 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.14em;opacity:.8}
.srow.folded .nm{font-weight:600}
</style>
</head>

a: tampoco es un permiso : son dos bonos. Ajuste: —.", "You see the next instant: +2 to initiative and to dodging. The sum: not a permission either : it is two bonuses. Adjustment: —."], "c": "artefacto"}]}]}], "baul": [["Relojes de progreso", "Progress clocks"], ["Flashbacks", "Flashbacks"], ["Pacto del diablo", "Devil's bargain"], ["Daño explosivo", "Exploding damage"], ["Rejilla mística inversa", "Inverse mystic grid"], ["Destino (Wyrd)", "Destiny (Wyrd)"], ["Fundas (el cuerpo como equipo)", "Sleeves (the body as equipment)"], ["Clones", "Clones"], ["El DJ tira en oculto", "The GM rolls in secret"], ["Tablas de dados", "Dice tables"], ["Transformación", "Transformation"], ["Sincronización", "Synchronisation"], ["Daño ambiental", "Environmental damage"], ["Barras propias (Honor, Reputación y otras)", "Custom tracks (Honour, Reputation and others)"], ["Vínculos", "Bonds"], ["Menú de los 4 costes", "Menu of the 4 costs"]], "recipes": [["1. «GESTIÓN DE HOMICIDIOS EN MAZMORRA» · «CLASES, RAZAS Y COMBOS»", "1. “DUNGEON HOMICIDE MANAGEMENT” · “CLASSES, RACES AND COMBOS”"], ["2. «BARRO, RATAS Y HEREJÍA» · «ME CURARON EL BRAZO Y AHORA SOY PSICÓPATA»", "2. “MUD, RATS AND HERESY” · “THEY HEALED MY ARM AND NOW I AM A PSYCHOPATH”"], ["3. «EL PASEO MELANCÓLICO»", "3. “THE MELANCHOLY STROLL”"], ["4. «HONOR SUICIDA Y CEREMONIA DEL TÉ»", "4. “SUICIDAL HONOUR AND TEA CEREMONIES”"], ["5. «DRAMA DE CAPA Y ESPADA»", "5. “SWASHBUCKLING MELODRAMA”"], ["6. «VIKINGOS, NIEVE Y DESTINO»", "6. “VIKINGS, SNOW AND DESTINY”"], ["7. «MAGOS ESPACIALES Y PADRES AUSENTES»", "7. “SPACE WIZARDS AND ABSENT FATHERS”"], ["8. «ALTA TECNOLOGÍA, BAJA ESPERANZA»", "8. “HIGH TECH, LOW HOPE”"], ["9. «EL BACKUP DE TU ALMA»", "9. “BACKING UP YOUR SOUL”"], ["10. «CHATARRA, GASOLINA Y ÓXIDO»", "10. “SCRAP, PETROL AND RUST”"], ["11. «CIBER-ELFOS Y MAGIA CORPORATIVA»", "11. “CYBER-ELVES AND CORPORATE MAGIC”"], ["12. «LA BIBLIOTECA MORTAL»", "12. “THE DEADLY LIBRARY”"], ["13. «POLÍTICA DE COMUNIDAD DE VECINOS (CON COLMILLOS)» · «LOS ALBINOS Y LOS SACOS DE DADOS»", "13. “HOMEOWNERS' ASSOCIATION POLITICS (WITH FANGS)” · “THE ALBINOS AND THE DICE BAGS”"], ["14. «NIÑOS EN BICICLETA VS EL GOBIERNO»", "14. “KIDS ON BIKES VS THE GOVERNMENT”"], ["15. «LADRONES EN LA NIEBLA»", "15. “THIEVES IN THE FOG”"], ["16. «DIOSES EN PIJAMA Y PROBLEMAS ÉTICOS»", "16. “GODS IN PYJAMAS WITH ETHICAL DILEMMAS”"], ["17. «EL TORNEO DE ARTES MARCIALES (GRITANDO)»", "17. “THE MARTIAL ARTS TOURNAMENT (NOW WITH SCREAMING)”"], ["18. «ROBOTS GIGANTES Y ANGUSTIA ADOLESCENTE»", "18. “GIANT ROBOTS AND TEENAGE ANGST”"], ["19. «LA DISTOPÍA HILARANTE»", "19. “THE HILARIOUS DYSTOPIA”"], ["20. «EL MUNDO SOSTENIDO POR QUELONIOS»", "20. “THE WORLD ON THE BACK OF CHELONIANS”"]], "baulLong": [["Dibuja un círculo dividido en 4, 6 u 8 segmentos según lo largo que sea el objetivo (una infiltración, una persecución, el fin del mundo). Cada éxito en una tirada que empuje hacia el objetivo rellena 1 segmento ; cada crítico, 2 . Cada fallo en una tirada de riesgo rellena un segmento del reloj opuesto (el de los malos: la alarma, el ritual, la marea). Gana quien complete antes su reloj. Reloj de viaje. Mide el camino, no el combate: cada etapa rellena segmentos y cada contratiempo (tormenta, emboscada, desánimo) los cuesta. Es el corazón de la receta 3. Reloj de suministros. Sustituye a la contabilidad de flechas y raciones.", "Draw a circle split into 4, 6 or 8 segments depending on how long the goal is (an infiltration, a chase, the end of the world). Each success on a roll that pushes towards the goal fills 1 segment ; each critical, 2 . Each failure on a risky roll fills a segment of the opposing clock (the villains' one: the alarm, the ritual, the tide). Whoever fills their clock first wins. Travel clock. It measures the road, not the fight: each leg of the journey fills segments and each setback (storm, ambush, despair) costs them. It is the heart of recipe 3. Supply clock. It replaces bookkeeping of arrows and rations."], ["Un jugador puede interrumpir el presente para narrar una escena del pasado que resuelve el problema actual («No tengo la llave… pero ayer soborné al guardia»). Para hacerlo paga un coste: tacha 1 casilla de su barra Mental (el estrés de haberlo tenido todo previsto) o gasta un recurso de equipo . Si el flashback exige una acción arriesgada, se tira como cualquier otra. Recetas: 16 («Ladrones en la niebla»), donde los flashbacks son obligatorios para planear el golpe.", "A player can interrupt the present to narrate a scene from the past that solves the current problem (“I don't have the key… but yesterday I bribed the guard”). To do so they pay a cost: mark 1 box on their Mental track (the stress of having foreseen everything) or spend an equipment resource . If the flashback calls for a risky action, it is rolled like any other. Recipes: 16 (“Thieves in the Fog”), where flashbacks are mandatory for planning the heist."], ["Antes de una tirada importante, el Director ofrece un trato: la acción se resuelve con Mejor de 2d10 contra TN 6 (como en la tarjeta T1 Héroe), sea cual sea la tarjeta activa. A cambio, pase lo que pase, el Director aplica una consecuencia narrativa garantizada , elegida del menú de los 4 costes (5.6). El jugador puede rechazar el pacto. La versión original hablaba de «+1 dado». En NOGUM no se añaden dados ni se acumulan bonos: el poder del pacto es cambiar la lectura hacia el optimismo durante una tirada. Recetas: ninguna de las veinte lo usa. Está pensado para terror y drama oscuro.", "Before an important roll, the Game Master offers a deal: the action is resolved with Best of 2d10 against TN 6 (as on the T1 Hero card), whatever card is active. In exchange, come what may, the Game Master applies a guaranteed narrative consequence , chosen from the menu of the 4 costs (5.6). The player may turn the bargain down. The original version spoke of “+1 die”. In NOGUM you do not add dice or stack bonuses: the power of the bargain is shifting the reading towards optimism for one roll. Recipes: none of the twenty uses it. It is designed for horror and dark drama."], ["Cuando el atacante saca crítico, además de su +1 al daño (5.2), vuelve a tirar la misma lectura. Si saca otro crítico, suma otro +1, y así sucesivamente. El daño sigue sujeto a las etiquetas del arma y del defensor. Es la versión «pulp desatado» de la única matemática del daño. No lo confundas con la etiqueta especial Daño Masivo del núcleo, que es una propiedad del arma y no depende de los dados. Recetas: ninguna de las veinte; aparece en la Piedra Rosetta (acción pulp frenética).", "When the attacker rolls a critical, on top of their +1 to damage (5.2), they roll the same reading again. If they roll another critical, they add another +1, and so on. The damage is still subject to the weapon's and the defender's tags. It is the “unleashed pulp” version of the single damage maths. Don't confuse it with the core's special tag Massive Damage , which is a property of the weapon and does not depend on the dice. Recipes: none of the twenty; it appears in the Rosetta Stone (frantic pulp action)."], ["En este módulo el conocimiento prohibido hace daño. Cada vez que un personaje aprende o usa saber prohibido (Ocultismo, cualquier competencia del ámbito Arcano), recibe Daño Mental 1 Esq: Nula , aunque la tirada sea un éxito . Un crítico es una revelación completa: Daño Mental 2 . Cuanto más sabes, más cerca estás de quedar fuera de juego. Recetas: 12 («La biblioteca mortal»: saber = Daño Mental).", "In this module, forbidden knowledge hurts. Every time a character learns or uses forbidden lore (Occultism, any skill in the Arcane sphere), they take Mental Dmg 1 Dodge: None , even if the roll is a success . A critical is a full revelation: Mental Dmg 2 . The more you know, the closer you are to being out of the game. Recipes: 12 (“The Deadly Library”: knowledge = Mental damage)."], ["Al crear el personaje, el jugador escribe cómo y cuándo morirá (una condición narrativa, no una fecha: «cuando vuelva a ver el mar de mi infancia»). Hasta que llegue ese momento, el personaje tira sus acciones de supervivencia con la tarjeta T1 Héroe , aunque la mesa juegue con otra. Cuando el Wyrd se cumple, pasa a la tarjeta T6 Tragedia hasta el final de la escena. Es tono por personaje (capítulo 7) al servicio del destino. Magia rúnica: la magia se paga con sangre. Cada runa tacha casillas de la barra Física del lanzador (1 por runa menor, 2 por runa mayor).", "When creating the character, the player writes down how and when they will die (a narrative condition, not a date: “when I see the sea of my childhood again”). Until that moment comes, the character rolls their survival actions with the T1 Hero card , even if the table is playing with another one. When the Wyrd is fulfilled, they switch to the T6 Tragedy card until the end of the scene. It is per-character tone (chapter 7) in the service of destiny. Rune magic: magic is paid for in blood. Each rune marks boxes on the caster's Physical track (1 per minor rune, 2 per major rune)."], ["La barra Física y el nivel de Rejilla del ámbito Físico pertenecen a la funda (el cuerpo), que se anota en la ficha como equipo , con su propia ficha técnica. Las competencias, la barra Mental y la barra Espiritual pertenecen al personaje. Cambiar de funda causa Daño Espiritual 1 Esq: Nula Abs: Nula . En esta receta la barra Espiritual se llama Identidad : si se vacía, el personaje olvida quién es y pasa a ser un PNJ. Si la funda queda fuera de combate , la mente se descarga en la nube y despierta en una funda nueva (si hay copia de seguridad y conexión). El salto cuesta el mismo daño a la Identidad. ED-R2.", "The Physical track and the Grid level of the Physical sphere belong to the sleeve (the body), which is noted on the sheet as equipment , with its own stat block. The skills, the Mental track and the Spiritual track belong to the character. Changing sleeves causes Spiritual Dmg 1 Dodge: None Soak: None . In this recipe the Spiritual track is called Identity : if it empties, the character forgets who they are and becomes an NPC. If the sleeve is taken out of the fight , the mind is uploaded to the cloud and wakes up in a new sleeve (if there is a backup and a connection). The jump costs the same damage to Identity. ED-R2."], ["Cada personaje empieza con 6 clones , que se marcan en la ficha. Cuando queda fuera de combate, la mesa puede declarar que ese clon ha muerto: llega el siguiente, con la misma ficha y la vida completa, y suele traer una explicación poco convincente. Al gastar el sexto, el personaje sale de la partida. La muerte es aquí un chiste recurrente pactado por la mesa. No contradice el pilar «nadie muere por una mala tirada»: en este género, morir es parte del humor. Recetas: 20 («La distopía hilarante»).", "Each character starts with 6 clones , which are marked on the sheet. When they are taken out of the fight, the table may declare that clone dead: the next one arrives, with the same sheet and full health, usually bringing an unconvincing explanation. Once the sixth is spent, the character leaves the game. Here death is a running gag agreed by the table. It does not contradict the pillar “nobody dies because of one bad roll”: in this genre, dying is part of the humour. Recipes: 20 (“The Hilarious Dystopia”)."], ["El Director tira todas las tiradas de riesgo detrás de la pantalla, también las de los jugadores, y anuncia solo el resultado narrativo. En la variante extrema, puede mentir sobre lo que ha salido. Encaja con la caja negra del capítulo 7: el jugador declara y el Director cuenta. Úsalo solo si la mesa lo pacta en la sesión cero: el pacto entre caballeros también vale para el Director. Recetas: 20 («La distopía hilarante»).", "The Game Master makes all risky rolls behind the screen, the players' ones included, and announces only the narrative outcome. In the extreme variant, they may lie about what came up. It fits with the black box from chapter 7: the player declares and the Game Master narrates. Use it only if the table agrees to it in session zero: the gentlemen's agreement binds the Game Master too. Recipes: 20 (“The Hilarious Dystopia”)."], ["Cuatro tablas que se activan según el género. El autor las nombra en sus recetas, pero aún no están escritas . Heridas graves. Amplía las consecuencias del umbral 2 (5.6) con una tabla de 1d10 de lesiones concretas. Enfermedades y locura. Una tabla de dolencias (físicas y mentales) para mundos sucios. Receta 2. Fallos de equipo. Para mundos donde nada funciona: amplía el rango de pifia (herramienta C.1 del capítulo 1) solo para el equipo y, cuando salta, se tira en la tabla. Receta 10. Mutaciones. Una tabla de mutaciones aleatorias para el horror corporal y el postapocalipsis. Ninguna de las veinte recetas la usa.", "Four tables that switch on depending on the genre. The author names them in their recipes, but they have not been written yet . Grievous wounds. It expands the threshold 2 consequences (5.6) with a 1d10 table of specific injuries. Diseases and madness. A table of ailments (physical and mental) for grimy worlds. Recipe 2. Equipment failures. For worlds where nothing works: it widens the fumble range (tool C.1 from chapter 1) for equipment only and, when it triggers, you roll on the table. Recipe 10. Mutations. A table of random mutations for body horror and post-apocalypse. None of the twenty recipes uses it."], ["Durante un combate, el personaje se transforma y sube 1 nivel de Rejilla en un ámbito (normalmente el Físico). Como todo modificador temporal (4.4), la transformación lleva una condición de fin anotada: al acabar la escena, al llenar un bloque de vida o al gastar una casilla de la barra Espiritual por turno. Si el Director cambia además el zoom de daño a mitad de pelea, la transformación se combina con la Sincronización. Recetas: 18 («El torneo de artes marciales (gritando)»).", "During a fight, the character transforms and goes up 1 Grid level in one sphere (usually the Physical one). Like any temporary modifier (4.4), the transformation carries a noted end condition : when the scene ends, when a health block is filled, or by spending one box of the Spiritual track per turn. If the Game Master also changes the damage zoom mid-fight, the transformation combines with Synchronisation. Recipes: 18 (“The Martial Arts Tournament (Now With Screaming)”)."], ["Es regla del núcleo (capítulo 2): al pilotar o fusionarse con algo, el personaje hereda el nivel del vehículo, y el Director puede cambiar el zoom de daño a mitad de sesión (el piloto frágil con Letal sube al robot con Guerra, sin cambiar de ficha). En el baúl solo figura para recordar que existe. Recetas: 19 («Robots gigantes y angustia adolescente»).", "It is a core rule (chapter 2): when piloting or merging with something, the character inherits the vehicle's level, and the Game Master can change the damage zoom mid-session (the fragile pilot on Lethal climbs into the robot on War, without changing sheets). It is listed in the chest only as a reminder that it exists. Recipes: 19 (“Giant Robots and Teenage Angst”)."], ["Un entorno hostil (radiación, frío extremo, vacío, gas) inflige daño por cada escena de exposición , sin tirada de ataque: por ejemplo, radiación Daño 1 Esq: Nula Abs: Nula . La protección adecuada (traje, refugio, antídoto) funciona como permiso narrativo: con ella, el daño se puede absorber o desaparece. Para el caso extremo («si se rompe el casco, todos mueren»), el núcleo ya tiene la etiqueta especial Daño Absoluto . Recetas: 10 («Chatarra, gasolina y óxido»).", "A hostile environment (radiation, extreme cold, vacuum, gas) inflicts damage for each scene of exposure , with no attack roll: for example, radiation Dmg 1 Dodge: None Soak: None . The right protection (suit, shelter, antidote) works as narrative permission: with it, the damage can be soaked or disappears. For the extreme case (“if the helmet cracks, everyone dies”), the core already has the special tag Absolute Damage . Recipes: 10 (“Scrap, Petrol and Rust”)."], ["El núcleo tiene tres barras (Física, Mental, Espiritual) y admite que una campaña cree una barra propia o rebautice una existente (5.5). Todas funcionan igual: bloques, casillas, umbrales y consecuencias. Honor (barra propia): recibe Daño Social N . Llegar a 0 es la deshonra definitiva. Receta 4. Reputación / Ciudad (barra propia): mide lo que el héroe se juega de verdad. Receta 17. Sangre (barra Mental rebautizada): el estrés del vampiro; se gasta para activar poderes. Receta 13. Sombra (barra Espiritual rebautizada): la corrupción que deja el mal en quien lo combate. Receta 3.", "The core has three tracks (Physical, Mental, Spiritual) and allows a campaign to create a custom track or rename an existing one (5.5). They all work the same way: blocks, boxes, thresholds and consequences. Honour (custom track): takes Social Dmg N . Reaching 0 is final disgrace. Recipe 4. Reputation / City (custom track): measures what the hero really has at stake. Recipe 17. Blood (renamed Mental track): the vampire's stress; it is spent to activate powers. Recipe 13. Shadow (renamed Spiritual track): the corruption evil leaves on those who fight it. Recipe 3."], ["Cada personaje anota 2 o 3 vínculos : personas que le importan. Un vínculo sirve para dos cosas: Como Llave (2.3). Cuando el personaje actúa para proteger o apoyar a un vínculo presente en la escena, puede afectar a una amenaza de nivel superior. La amistad es el permiso narrativo. Como escudo. Puede desviar daño Mental hacia un vínculo, que se resiente en la ficción (una discusión, un abandono, una herida). Se sacrifica la vida personal para salvar la mente. Recetas: 14 («Niños en bicicleta vs el Gobierno»). Ojo con la homonimia: «Vínculos» es también una de las cuatro Disciplinas propuestas para Ritual (8.2).", "Each character notes 2 or 3 bonds : people who matter to them. A bond is useful for two things: As a Key (2.3). When the character acts to protect or support a bond present in the scene, they can affect a higher-level threat. Friendship is the narrative permission. As a shield. They can divert Mental damage onto a bond, which suffers in the fiction (an argument, an abandonment, a wound). Personal life is sacrificed to save the mind. Recipes: 14 (“Kids on Bikes vs the Government”). Watch out for the name clash: “Bonds” is also one of the four Disciplines proposed for Ritual (8.2). If both are confirmed, one of them will need renaming."], ["El éxito parcial y su menú (tiempo, recurso, posición, fuego amigo) ya están en el núcleo: consulta el capítulo 5.6 . Lo mencionamos aquí porque las recetas de caos alto lo dan por supuesto. Tampoco están en el baúl la Regla del Estilo ni la gestión de masillas: son núcleo (4.5). <h3", "Partial success and its menu (time, resource, position, friendly fire) are already in the core: see chapter 5.6 . We mention it here because the high-chaos recipes take it for granted. Also missing from the chest are the Style Rule and mook handling: they are core (4.5). <h3"]], "techos": [[3, 2, 3, 2, 4], [2, 2, 3, 2, 3], [2, 2, 3, 2, 4], [2, 2, 4, 2, 3], [2, 2, 3, 2, 0], [2, 1, 2, 1, 2], [3, 2, 4, 3, 4], [2, 1, 1, 1, 0], [3, 3, 3, 4, 0], [2, 1, 2, 2, 2], [2, 2, 3, 3, 3], [1, 1, 2, 1, 1], [2, 2, 4, 1, 3], [1, 1, 1, 1, 0], [2, 1, 3, 2, 2], [5, 5, 4, 5, 5], [5, 2, 2, 2, 5], [4, 1, 2, 3, 0], [1, 1, 2, 2, 2], [2, 2, 3, 2, 3]], "firmas": [{"dis": ["Atletismo", "Athletics"], "items": [{"n": ["Maratón / Resistencia", "Marathon / Endurance"], "d": ["Mantenimiento del ritmo en carreras prolongadas sin acumular fatiga.", "Holding the pace over long runs without building up fatigue."]}, {"n": ["Salto Imposible", "Impossible Leap"], "d": ["Superación de brechas verticales u horizontales límite.", "Clearing vertical or horizontal gaps at the very limit."]}, {"n": ["Escalada Libre", "Free Climbing"], "d": ["Ascenso rápido por superficies verticales sin necesidad de arné ng artefacts and relics."]}]}, {"dis": ["Ocultismo", "Occultism"], "items": [{"n": ["Demonología y Criptozoología", "Demonology and Cryptozoology"], "d": ["Identificación de criaturas, mitos, debilidades y comportamiento.", "Identifying creatures and myths, their weaknesses and behaviour."]}, {"n": ["Grimorios y Textos Prohibidos", "Grimoires and Forbidden Texts"], "d": ["Lectura e interpretación de tomos antiguos, runas y fórmulas.", "Reading and interpreting ancient tomes, runes and formulae."]}, {"n": ["Simbología Esotérica", "Esoteric Symbology"], "d": ["Reconocimiento de sellos, marcas místicas y geometrías sagradas.", "Recognising seals, mystic marks and sacred geometry."]}, {"n": ["Profecías y Presagios", "Prophecies and Omens"], "d": ["Análisis de augurios, lecturas estelares o líneas temporales implícitas.", "Interpreting auguries, star readings or implied timelines."]}, {"n": ["Lore del Multiverso", "Multiverse Lore"], "d": ["Conocimiento de planos, dimensiones paralelas y leyes no terrenales.", "Knowledge of planes, parallel dimensions and unearthly laws."]}]}, {"dis": ["Actualidad", "Current Affairs"], "items": [{"n": ["Cultura Pop y Tendencias", "Pop Culture and Trends"], "d": ["Manejo de referencias, jerga urbana y cultura de consumo.", "Command of references, street slang and consumer culture."]}, {"n": ["Geopolítica y Macroeconomía", "Geopolitics and Macroeconomics"], "d": ["Rastrear flujos de dinero, mercados corporativos y fronteras políticas.", "Tracking money flows, corporate markets and political borders."]}, {"n": ["Prensa y Redes Sociales", "Press and Social Media"], "d": ["Rastreo de bulos, filtraciones de datos e información en tiempo real.", "Tracing hoaxes, data leaks and real-time information."]}, {"n": ["Submundo y Crimen Organizado", "Underworld and Organised Crime"], "d": ["Conocimiento de bandas, rutas de contrabando y códigos callejeros.", "Knowing the gangs, smuggling routes and street codes."]}, {"n": ["Burocracia y Leyes Locales", "Bureaucracy and Local Law"], "d": ["Navegación por trámites, normativas corporativas y vacíos legales.", "Navigating red tape, corporate regulations and legal loopholes."]}]}, {"dis": ["Investigación", "Investigation"], "items": [{"n": ["Deducción en Escena", "Scene Deduction"], "d": ["Reconstrucción de hechos analizando rastros, manchas y desorden.", "Reconstructing events from traces, stains and disarray."]}, {"n": ["Interrogatorio Técnico", "Technical Interrogation"], "d": ["Extracción de datos cruzando contradicciones y presión lógica.", "Extracting information by cross-checking contradictions and applying logical pressure."]}, {"n": ["Análisis Forense", "Forensic Analysis"], "d": ["Inspección visual de heridas, causas de muerte y muestras en el sitio.", "On-site visual examination of wounds, causes of death and samples."]}, {"n": ["Conexión de Pistas", "Connecting the Dots"], "d": ["Identificación de patrones o hilos conductores entre datos inconexos.", "Finding patterns or common threads between unrelated data."]}, {"n": ["Búsqueda Documental", "Records Search"], "d": ["Rastreo rápido de información específica en archivos físicos o digitales.", "Quickly tracking down specific information in physical or digital archives."]}]}, {"dis": ["Alerta", "Alertness"], "items": [{"n": ["Percepción de Emboscadas", "Ambush Sense"], "d": ["Lectura del entorno para detectar peligro inminente o emboscadas.", "Reading the surroundings to detect imminent danger or ambushes."]}, {"n": ["Lectura Corporal", "Body Reading"], "d": ["Identificación de microexpresiones, nerviosismo o mentiras en tiempo real.", "Spotting micro-expressions, nerves or lies in real time."]}, {"n": ["Detección de Trampas", "Trap Detection"], "d": ["Localización de sensores, cables, mecanismos o minas antes de activarlos.", "Locating sensors, tripwires, mechanisms or mines before they go off."]}, {"n": ["Aislamiento Auditivo", "Auditory Focus"], "d": ["Filtrado de ruidos de fondo para escuchar conversacio <script type="application/json" id="canon">"# CANON NOGUM — Reglas definitivas para el documento maestro\n\nJerarquía de autoridad usada para resolver contradicciones:\n0. El bloque REGLAS VIGENTES de aquí abajo: manda sobre todo lo demás de este fichero.\n1. Última palabra explícita del AUTOR en la conversación (turnos T1–T145, 10 feb – 24 may).\n2. Texto del borrador del autor `nogumdraft-docx.md` (cuerpo, no el índice viejo que lleva pegado arriba) y `nogum-pdf.md` (texto del autor sobre combate, anterior; vale solo donde nada posterior lo sustituye).\n3. Texto del asistente aceptado por el autor (\"me encanta\", \"queda\", \"dale\"…).\n4. Propuestas del asistente no validadas → se incluyen SOLO marcadas como «Propuesta sin validar» o en Pendientes.\nLas decisiones de edición (ED-n) son arreglos de congruencia que el editor ha tenido que tomar; se muestran al lector en la pestaña «Decisiones editoriales».\n\n## REGLAS VIGENTES (resumen al día; si algo de más abajo lo contradice, manda esto)\nLo que sigue a este bloque es el registro de cómo se llegó aquí y contiene reglas superadas. Para responder, usa primero este bloque. (Actualizado en T185.)\n- **La mesa manda (Capítulo 0 · Sesión 0).** Antes de la campaña se pactan las líneas rojas de cada uno (no se impone nada que haga sentir genuinamente mal a nadie; basta una persona; se puede decir en privado al Director; lo que aparece tarde se quita sin pedir permiso), qué se va a sentir, qué soluciones pide el género, hasta dónde puede llegar el tono, y de ahí los números. No hay cortafuegos contra el combo barato: la mesa puede decir «esto no vale». Las reglas trabajan para la mesa y se ignoran cuando impiden lo que la trama pide.\n- **Tirada.** Dos d10 (rojo y azul) y siete tarjetas de tono (ver §2bis). TN 6 (11 en la suma). Los bonos se acumulan, pero el total va siempre de −2 a +4 (el Ancla).\n- **Ficha.** 12 puntos (14 si hay Arcano). Ámbito → Dominio (+1) → Disciplina (+2) → Firma (+3/+4). Ámbito vacío: Nulidad, −2. Si tienes algo en el ámbito, la otra columna se tira a −1 (Torpe). Estilo +2.\n- **Bote aparte.** +1 de Rejilla en un ámbito cuyo techo llegue a 2, o 5 Llaves. Se empieza en 1·1·1·1·2 como mucho; para empezar más arriba, experiencia de salida o un salto pactado en la sesión 0.\n- **Rejilla.** Es escala, no habilidad (×100 de alcance por nivel), y casi nunca es humana: los unos abundan. Un nivel por encima: ganas sin tirar y tiras Estilo para el cómo. Por debajo: imposible sin Llave.\n- **Techo del mundo.** La Rejilla entera más alta que puede tener un jugador en cada ámbito en ese mundo. La receta lo propone y la mesa lo confirma («¿es posible en vuestro mundo?»). No frena las Llaves: una Disciplina puede pasar por encima si el mundo lo hace posible. Los PNJ pueden estar por encima.\n- **Saltos de Rejilla.** Los abre la trama y los decide el Director; por defecto nadie se queda atrás (su salto, su valor en Llaves o algo equivalente). Valor: 5·n² Llaves por ámbito (cada peldaño, 5, 15, 25, 35). Quien rechaza un salto cobra su valor en Llaves y las gasta donde quiera.\n- **Llaves.** Estrecha: una Disciplina entera (nunca una Firma) contra su objetivo, para siempre. Ancha: un ámbito entero contra su objetivo, una escena (se tacha). Una Llave te pone un nivel por encima en lo que cubre. Subir n niveles contra lo mismo: n² Llaves. Una Disciplina cuesta x² contra un objetivo o solo para el daño (Limitado) y 2·x² contra todo; nunca más que la Rejilla del ámbito, 5·x². Se puede dejar en blanco y escribirla la primera vez que se usa.\n- **Llaves de un momento o prestadas.** Las da la ficción o el Director (el club de hackers, veinte mercenarios a la vez, el agua bendita): duran una escena y suben lo que la ficción diga; no se mejoran con Llaves. Lo prestado o robado de paso dura una escena.\n- **Regalos del Director.** Lo que la historia pone en vuestras manos como planteamiento (el robot de la agencia, la nave del grupo) no se paga mientras la historia lo pida.\n- **Equipo.** Tres cerrojos: el Acceso (Recursos), el permiso narrativo y, si rompe la Rejilla, Llaves (x = niveles por encima de la Rejilla del portador; x² por Disciplina contra un objetivo o solo daño, 2·x² contra todo, tope 5·x²). Por debajo de 1 Llave: gratis una escena y se consume. El equipo siempre devuelve sus puntos y Llaves al dejarlo; en un traspaso, quien lo libera las recupera y quien lo recibe las paga. El precio de las armas lo administra el mundo (Acceso y ficción).\n- **Sincronización** (mechas, exoesqueletos, armaduras motorizadas, fusiones): heredas ficha y escala. Es Rejilla, 5·x², a precio entero; Limitada (la mitad) solo si no está siempre disponible, y lo decide la mesa. Un vehículo normal no hereda nada: cobra x².\n- **La Parca.** Si te alcanza y estás por debajo de su nivel, quedas fuera de combate, sin absorción. Si se esquiva lo dice su etiqueta Esq (Nula: se evita no estando ahí; la granada, Difícil −2). Por encima de tu nivel es una Llave y se paga como un arma. Nunca mata.\n- **Combate.** El atacante tira; el defensor tira su reacción si la etiqueta lo permite; se comparan niveles de resultado, y los empates los gana el defensor. Crítico del atacante: +1 al daño. El daño de un arma llega a 2, más la Parca.\n- **Vida.** Barras Física, Mental, Espiritual y las del género. La barra es tensión: cuando termina la amenaza y el Director declara que estáis a salvo, todas vuelven enteras. Las consecuencias (al cruzar un umbral) se quedan hasta curarse: leves, cura sencilla; graves, cura grave. Fuera de combate no es muerte; la muerte de un protagonista siempre se pacta.\n- **Acelerado.** Cuatro modos: Optimista (mejor de dos), Neutro (dado rojo), Caos (mismo dado, bandas anchas y éxito con coste) y Terror (como Neutro, pero 3 casillas de vida en vez de 9). Torpe −1. Armadura ligera +1 y pesada +2 a la absorción. Lo que rompe la Rejilla o da un permiso cuesta además Llaves.\n\n---\n## 0. Identidad\n- Nombre: NOGUM. Lema: «Donde la Emoción dicta la Física».\n- Siglas (decisión del autor, 17 sep): broma interna. Oficial pedante: EN «Narrative Ontology & General Universal Mechanics» / ES «Narrativa Ontológica General Universal y Metafísica». Real en coña: ES «Nos Olvidamos de Guardar Una Mesa», «Narrativa Orgánica para Gamers Ultra Motivados», «No Otro Gato Usando Magia»; EN «No One Gets Ur Mechanics», «Not Our Game, U Mad?», «Narrative Orgasm Generates Ultimate Mayhem». Edición española: título pedante en inglés + coña en español; edición inglesa: al revés.\n- Voz: texto principal serio; columna lateral izquierda \"meta\" (estilo manual de Cyberpunk 2020) con comentarios informales, referencias y bromas (T119). Máxima: cero pedantería («¿te parece justo que…?», nunca «¿entiendes que…?») (T41–42).\n- Filtro de interés, no de competencia: NOGUM es universal en universos, no en estilos de juego. Es narrativo.\n- Dos productos: NOGUM (core) y NOGUM Acelerado (manual aparte que TAMBIÉN va incluido al final del core como guía rápida) (T76, T77, T117).\n\n## 1. Manifiesto (Introducción) — texto del borrador del autor, aprobado\n- Apartados: ¿Qué es el rol? (según las tiendas) / ¿Qué es el rol? (para NOGUM) / ¿Qué es este manual? (UNA TESIS SOBRE EL TONO INVISIBLE).\n- Pilares innegociables: Historia sobre los dados («tira sólo si todos los resultados son interesantes»; nadie muere por una mala tirada); La historia sobre la justicia (pacto entre caballeros; se negocia diversión/narrativa, nunca «justicia de reglas»); La emoción como pulso; El ritmo debe fluir (improvisación premiada; no-juego desincentivado). Además (T97): jugadores mentalmente adultos; reglas líquidas; sin combos ni acumulación de bonos.\n- Tesis: los universales narrativos (Fate, HITOS, PbtA) traen el tono de casa. Ejemplo PbtA + dios solar de la Edad de Plata vs The Boys; Fate nunca podrá jugar Cthulhu purista.\n- Los dos ejes (Optimismo, Caos) + letalidad + anclaje numérico + simplicidad. Descubrimiento accidental: cambio de tono por campaña, sesión, escena… e incluso por personaje (T7).\n- Sin guía de lectura (T97): basta el índice.\n- Sidebar: invitación a empezar por NOGUM Acelerado «si te da pereza leer una disertación sobre diseño narrativo» (T76).\n\n## 2. Capítulo 1 — El Motor\n- 1.1 Ejes: Y = Optimismo (Voluntad): Alto (El Elegido; Indiana Jones), Neutro (Indiferencia; la vida real), Bajo (Hostilidad; Alien). X = Caos (Predictibilidad): Bajo (Orden; Sherlock), Medio (Estándar), Alto (Gonzo; Deadpool/Alicia).\n- Vida real = Optimismo Neutro + Caos BAJO (T4).\n- 1.2 Malla Tonal 3×3 (tabla del borrador): \n  - Alto: Fantasía de Poder (C.bajo; Superman, Bond) | Épica Clásica (C.medio; Star Wars, D&D) | Pulp Desatado (C.alto; Guardianes).\n  - Neutro: Realismo Gris (C.bajo; drama policial) | Drama de Acción (C.medio; Juego de Tronos) | Comedia Negra/Extrañeza (C.alto; Twin Peaks).\n  - Bajo: Terror Purista (C.bajo; 1984, Chernobyl) | Thriller de Supervivencia (C.medio; Walking Dead) | Pesadilla/Slasher (C.alto; Elm Street).\n- 1.3 Sala de Máquinas (técnico, «sáltalo si quieres»): punto de equilibrio = 1 dado lineal = CAOS NEUTRO (costumbre del hobby) (T14). Herramientas de orden = sumar dados (Gauss). Caos alto = C.1 ampliar rangos naturales de crítico/pifia; C.2 añadir éxito parcial. Optimismo = quedarse el MEJOR de 2; pesimismo = el PEOR de 2.\n- Solución NOGUM: DOS d10 de distinto color (rojo y azul). Lecturas: Rojo solo (1d10) · Suma (2–20) · Mejor · Peor · + reglas de rango/parcial.\n- Anclaje: el bono total va SIEMPRE de −2 (Nulidad) a +4 (Gran Maestro).\n- **ED-1 (Críticos y pifias NATURALES)**: pifia y crítico se leen en los dados, sin bonos, no dependen del bono. Base: borrador 1.3 («NAT 10 en cualquiera de los dos dados, no depende del bono»), T21 «la pifia es siempre pifia», T131 (crítico en Mejor de 2 = un 10 en cualquier dado = 19 %), y la herramienta C.1 (ampliar rangos) que sólo tiene sentido con lecturas naturales. Se RETIRA la «Regla del Margen de 4» (T30–31: crítico = superar TN en más de 4) y el «10+ tras bonos» de las tarjetas 1 y 4 del borrador. Queda como pregunta abierta para el autor (le gustaba que «el Gran Maestro saque críticos donde el mediocre acierta»).\n- Éxito: total (lectura + bono total) ≥ TN de la tarjeta activa.\n- 1.4 Panel de Control **[SUPERADO: ver §2bis, el cuadrante de siete tarjetas. Lo que sigue es el panel antiguo y se conserva solo como registro; no se responde con él]**: 6 Tarjetas de Tono (+ configuración por defecto). Canon (ED-2 corrige erratas del borrador):\n  - T0 ESTÁNDAR / AVENTURA CLÁSICA (Optimismo Neutro / Caos Medio) — no es tarjeta en el borrador; es el «tono por defecto» del 7.2 del autor: 1d10 (rojo) + bono vs TN 6. Pifia: 1 natural. Crítico: 10 natural. Daño: Nivel 2.\n  - T1 HÉROE (Opt. Alto / Caos Bajo) «Soy el mejor en lo que hago»: 2d10 quédate el ALTO + bono vs TN 6. Pifia: doble 1 (1 %). Crítico: un 10 natural en cualquiera de los dos dados (19 %).\n  - T2 REALISTA (Opt. Neutro / Caos Bajo) «La vida es justa y predecible»: SUMA 2d10 + bono vs TN 11. Pifia: suma natural 2–3 (3 %). Crítico: suma natural 19–20 (3 %).\n  - T3 PULP / DRAMA (Opt. Neutro / Caos Alto) «Sí, pero te va a costar»: 1d10 (rojo) + bono. Pifia 1 natural. Total ≤5 fallo; 6–7 ÉXITO PARCIAL (lo logras con coste); 8+ éxito; 10 natural crítico.\n  - T4 TERROR (Opt. Bajo / Caos Medio — coordenadas del borrador) «Tengo miedo a fallar»: 2d10 quédate el BAJO + bono vs TN 6. Pifia: el dado bajo es un 1 = cualquier 1 (19 %) [ED-2: el borrador decía «2–3 NAT», copiado de la tarjeta de suma]. Crítico: doble 10 (1 %) («Milagro»).\n  - T5 GONZO (Caos Máximo / Ruleta rusa; Opt. Neutro) «¡Cualquier cosa puede pasar!»: 1d10 (rojo) + bono vs TN 6. 1–2 naturales pifia (20 %). 9–10 naturales crítico (20 %). Resto suma bono vs 6.\n  - T6 TRAGEDIA (Opt. Bajo / Caos Bajo) «No hay esperanza»: SUMA 2d10 + bono vs TN 14 (curva desplazada). Pifia suma natural 2–3. Crítico suma natural 19–20. [TN 13 de T23 descartado; T30 y borrador fijan 14].\n  - Nota de diseño: redundancia deliberada; «Cero memoria. 100 % narrativa».\n  - Relación con la malla: T1 = Fantasía de Poder; T2 = Realismo Gris; T3 y T5 = dos sabores de Caos Alto neutro (T3 herramienta C.2 «éxito parcial», T5 herramienta C.1 «rangos ampliados» = Comedia Negra); T4 = Thriller/Terror; T6 = Terror Purista/Tragedia; T0 = Drama de Acción. Las otras casillas (Épica Clásica, Pulp Desatado, Pesadilla) quedan para que el DJ las diseñe; el análisis de los 9 modos (T130–131) da recetas de referencia:\n    - Épica Clásica: mejor de 2; crítico cualquier 10; pifia doble 1. (El asistente la llamó «estándar NOGUM» en T130; el autor en su 7.2 eligió 1d10 como tono por defecto → ED-3: el tono por defecto es T0.)\n    - Pulp Desatado: mejor de 2 + éxito parcial con total 6–7.\n    - Thriller de Supervivencia: peor de 2 + fallo por 1–2 puntos = éxito con coste.\n    - Pesadilla/Slasher: peor de 2; cualquier 1 = pifia.\n    - Fantasía de Poder vs Épica Clásica: tras T131 ambas tienen crítico 19 %; diferencia pendiente (el asistente proponía doble 10 para F. de Poder).\n- Principios del «99 %» (T21–22): el Gran Maestro no debe fallar en lo mundano. NO hay «inflación narrativa». La dificultad se queda donde está; recomendación: no tirar, o que el jugador se suba la dificultad («una mano a la espalda»).\n\n## 2bis. EL CUADRANTE DE SIETE TARJETAS (modelo vigente)\nSustituye al panel de 6 tarjetas + recetas. Cerrado por el autor tras el taller de palancas (18-20 septiembre 2026).\n- **Ejes**: la FILA dice de qué lado está el universo (optimista / neutral / opresivo). La COLUMNA dice a qué precio (previsible / neutral = la costumbre / caótico).\n- **Asimetría que gobierna el modelo (ED-24)**: las sorpresas buenas AMPLIFICAN (el crítico va donde ya ibas; nadie improvisa) y las malas RAMIFICAN (la pifia cierra la puerta que usabas y obliga a abrir otra). Por eso la misma palanca —quedarse un dado de dos— añade previsibilidad hacia arriba y caos hacia abajo, y por eso el peor de dos ya trae el caos puesto sin herramientas extra.\n- **Las cinco palancas** y su vector (centro / dispersión / espectáculo):\n  1. Lectura mejor o peor de 2d10: mueve el centro (media 7,15 o 3,85 frente a 5,5) Y concentra (DT 2,35 vs 2,87). Es DIAGONAL: vive en las esquinas de la columna previsible.\n  2. Suma 2d10: no mueve el centro, concentra al máximo (DT 2,03 equivalente), apaga el espectáculo (extremos 3 %).\n  3. Bandas naturales, en tres anchuras: ESTRECHA (los dos dados de acuerdo: doble 1 / doble 10), NORMAL (el número que usas: 1 / 10), ANCHA (ese y el de al lado: 1–2 / 9–10). Se leen SIEMPRE sobre el número que usas, así que se inclinan solas según el tono: en el mejor de dos, ensanchar da 4/36; en el peor, 36/4; en el rojo, 20/20.\n  4. Éxito con coste (herramienta PbtA): ocupa LA TN Y EL PUNTO DE ENCIMA (total 6 o 7 con TN 6). No cambia cuántas veces sales adelante; solo cuántas de esas veces pagas (ED-23).\n  5. TN: única palanca de optimismo puro, PERO NO se usa para construir el cuadrante (ED-19). Un número por lectura: 6 (dado, mejor, peor) y 11 (suma).\n- **Palancas descartadas y por qué**: dados explosivos (rompen el anclaje [−2,+4]); mejor de 3 (mismo vector, más dados); mover el anclaje (obliga a rehacer fichas); que el jugador elija la lectura tras ver los dados (el tono lo ponen mesa y DJ antes de tirar); qué hace una pifia (no es palanca: es decisión del narrador; la complicación pequeña vive en el éxito con coste).\n- **LAS SIETE** (cifras exactas con bono 0: pifia / fallo / coste / éxito / crítico → sale adelante; y el recorrido de −2 a +4):\n  - **Épica** (optimista·previsible): mejor de 2d10, TN 6, bandas normales. 1/24/0/56/19 → 75 %. 51 → 99 %.\n  - **Pulp desenfrenado** (optimista·caótico): mejor de 2d10, TN 6, pifia ancha (1–2), crítico normal (10), coste. 4/21/24/32/19 → 75 %. 51 → 96 %. El coste va del 32 % con −2 al 5 % con +4: el maestro no negocia.\n  - **Realista** (neutral·previsible): suma 2d10, TN 11, extremos 2–3 / 19–20. 3/42/0/52/3 → 55 %. 36 → 85 %.\n  - **Primera marcha** (neutral·neutral): dado rojo, TN 6, bandas normales. 10/40/0/40/10 → 50 %. 30 → 90 %. Es la vara de medir: diez puntos por escalón de bono.\n  - **Bola de nieve** (neutral·caótico): dado rojo, TN 6, bandas anchas (1–2 / 9–10), coste. 20/30/20/10/20 → 50 %. 30 → 80 %.\n  - **Angustia** (opresivo·previsible): peor de 2d10, TN 6, bandas estrechas (dobles). 1/74/0/24/1 → 25 %. 9 → 81 %. Es donde más pesa la ficha (72 puntos).\n  - **Pesadilla** (opresivo·caótico): peor de 2d10, TN 6, bandas normales. 19/56/0/24/1 → 25 %. 9 → 81 %. Con +4 desaparece el fallo limpio: el gran maestro no falla, pifia.\n- **La fila decide, la columna cobra**: en cada fila la caótica SALE ADELANTE EXACTAMENTE IGUAL DE A MENUDO que su compañera (Pulp = Épica, Bola = Primera marcha, Pesadilla = Angustia). Solo cambia el precio, y cada fila lo cobra en su moneda: arriba el coste, abajo la pifia, en medio las dos.\n- **Cuánto improvisa el DJ** (pifia + coste, la cuenta que decide si una tarjeta aguanta una campaña): Épica 1 %, Angustia 1 %, Realista 3 %, Primera marcha 10 %, Pesadilla 19 %, Pulp 24 %, Bola de nieve 40 %. La escalera separa las tres columnas sin solaparse.\n- **Aviso obligatorio en el manual**: el caos FRUSTRA salvo que la mesa acuerde explícitamente que se persigue la historia y no el éxito. La Pesadilla es para una noche sucia o una escena corta, no para una campaña de un año. Y en la Angustia, el fallo debe restar siempre algo (un camino, el tiempo, la ocasión) o el desgaste se vuelve tedio.\n- **Dos huecos reales**: optimista·neutral y opresivo·neutral. Con dado plano no hay forma de inclinar el tono sin mover la TN, y la TN no se mueve. Se dibujan a la vista y se invita a rellenarlos. En la app, cuando el cuestionario cae en un hueco se pregunta a qué vecina arrimarse.\n- **Lectura como espectro**: los ejes no son binarios; cerca de un borde se toma prestada una parte de la vecina (p. ej. la banda un paso más ancha, sin el coste).\n- **Recetas que sí mueven la TN**: Tragedia = suma 2d10 vs TN 14 (3/69/0/25/3 → 28 % con bono 0; 15 → 64 %).\n- **ED-18 (regla única de naturales)**: «mira el número que vas a usar; si cae en la banda de pifia, es pifia; si cae en la de crítico, es crítico». Con banda normal reproduce exactamente los valores antiguos (mejor de 2: 1 % y 19 % = doble 1 / cualquier 10; peor de 2: 19 % y 1 %). La suma conserva 2–3 y 19–20.\n- **ED-19 (la TN no es palanca de tono)**: un número por lectura (6 y 11).\n- **ED-20 (el centro es la costumbre, no la objetividad)**: la columna central es el dado plano porque es lo que hace el hobby, no porque sea el punto medio estadístico; de hecho es la lectura más aleatoria.\n- **ED-21 (el centro caótico lleva las dos herramientas)**: bandas anchas y coste a la vez, porque ninguna inclina el tono.\n- **ED-23 (dónde va el éxito con coste)**: en la TN y el punto de encima. En 5–6 ascendía un fallo a éxito con coste, o sea regalaba partidas; la herramienta de la que viene solo cobra peaje a lo que ya había salido bien.\n- **ED-24 (crítico amplifica, pifia ramifica)**: por eso el pesimismo (fallar más) y el caos (fallar y además complicarse) entran juntos por la misma puerta en la fila opresiva, y por eso ahí basta con ensanchar la banda un paso.\n- **ED-15 (revisada)**: en Acelerado, el Agobio junta lo que el manual completo separa (peor de dos + éxito con coste), porque allí solo hay tres modos y no hay eje de caos. El coste usa la misma regla: total 6 o 7. Profesional (+2): sale adelante el 49 %, y solo la mitad de esas veces sin pagar.\n- **ED-25 (la defensa gana los empates)**: atacante y defensor tiran contra la misma TN y se comparan NIVELES, nunca totales ni márgenes (ED-17 sigue en pie). Defensor iguala o supera → sin daño. Atacante por encima con defensor en éxito o éxito con coste → daño −1. Defensor falla → daño completo. Defensor pifia → el ataque sube un escalón en la escala de la tarjeta activa (fallo→éxito o →con coste; éxito→crí
