"Aggressive Seduction"], "d": ["Daño Social 1", "Social Damage 1"], "e": ["Esq: Total", "Dodge: Full"], "a": ["Abs: Nula", "Soak: None"], "m": ["—", "—"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Ataca al deseo e ignora la armadura lógica. Abs: Nula: 1 Llave.", "Targets desire and ignores logical armour. Soak: None: 1 Key."], "c": "arma"}, {"n": ["Luz de gas (gaslighting)", "Gas Light (Gaslighting)"], "d": ["Daño Mental 1 / turno", "Mental Damage 1 / turn"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Voluntad", "Soak: Will"], "m": ["—", "—"], "p": ["1", "1"], "k": ["1", "1"], "x": ["Fractal: Mente Daño continuo, turno a turno, que erosiona la cordura. Esq: Nula, 1 Llave; que siga dañando cada turno sin volver a tirar, 1 punto.", "Fractal: Mind Ongoing damage, turn after turn, that wears down sanity. Dodge: None, 1 Key; going on dealing damage every turn without rolling again, 1 point."], "c": "arma"}, {"n": ["Excomunión / destierro", "Excommunication / Exile"], "d": ["La Parca · Rejilla 4", "The Reaper · Grid 4"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Nula", "Soak: None"], "m": ["—", "—"], "p": ["0", "0"], "k": ["6", "6"], "x": ["Bomba nuclear social, espiritual: el personaje queda fuera de juego en ese Ámbito . Lo que pasa del Daño 2 es la Parca con su nivel ( 4.5 ), y el de una bomba nuclear es el 4 ( 4.8 ). Parca 4, Limitada al daño: 5 Llaves ( 5.6 ); que no se esquive, otra.", "A social, spiritual nuclear bomb: the character is out of the game in that Sphere . Anything past Damage 2 is the Reaper with its level ( 4.5 ), and a nuclear bomb’s is 4 ( 4.8 ). Reaper 4, Limited to damage: 5 Keys ( 5.6 ); being undodgeable, another."], "c": "arma"}, {"n": ["El silencio calculado", "The Calculated Silence"], "d": ["Daño Social 1", "Social Damage 1"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Reputación", "Soak: Reputation"], "m": ["—", "—"], "p": ["0", "0"], "k": ["1", "1"], "x": ["No decir nada cuando toda la sala espera que digas algo. No se puede esquivar porque no ha pasado nada. Esq: Nula: 1 Llave.", "Saying nothing when the whole room is waiting for you to speak. It cannot be dodged because nothing happened. Dodge: None: 1 Key."], "c": "arma"}, {"n": ["La pregunta inocente", "The Innocent Question"], "d": ["Daño Social 1", "Social Damage 1"], "e": ["Esq: Total", "Dodge: Full"], "a": ["Abs: Reputación", "Soak: Reputation"], "m": ["—", "—"], "p": ["0", "0"], "k": ["0", "0"], "x": ["Preguntar en voz alta algo que no se puede contestar sin perder. Se esquiva contestando rápido y mal.", "Asking out loud something that cannot be answered without losing. It is dodged by answering fast and badly."], "c": "arma"}, {"n": ["El elogio envenenado", "The Poisoned Compliment"], "d": ["Daño Social 2", "Social Damage 2"], "e": ["Esq: Difícil (−2)", "Dodge: Hard (−2)"], "a": ["Abs: Reputación", "Soak: Reputation"], "m": ["—", "—"], "p": ["2", "2"], "k": ["0", "0"], "x": ["Alabarte en público justo por lo que te avergüenza. Protestar lo empeora: por eso la esquiva es difícil. Esq: Difícil: 2 puntos.", "Praising you in public for exactly what embarrasses you. Protesting makes it worse: hence the hard dodge. Dodge: Hard: 2 points."], "c": "arma"}, {"n": ["La filtración", "The Leak"], "d": ["Daño Social 2", "Social Damage 2"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Nula", "Soak: None"], "m": ["—", "—"], "p": ["0", "0"], "k": ["2", "2"], "x": ["Permiso: lo privado se vuelve público Lo que dijiste en confianza, en boca de todos. No hay reacción posible: ya está dicho. Esq: Nula y Abs: Nula: dos defensas anuladas, 2 Llaves.", "Permit: the private becomes public. What you said in confidence, in everybody’s mouth. No reaction is possible: it has already been said. Dodge: None and Soak: None: two defences cancelled, 2 Keys."], "c": "arma"}, {"n": ["El ultimátum público", "The Public Ultimatum"], "d": ["Daño Social 2", "Social Damage 2"], "e": ["Esq: Parcial", "Dodge: Partial"], "a": ["Abs: Reputación", "Soak: Reputation"], "m": ["—", "—"], "p": ["1", "1"], "k": ["0", "0"], "x": ["Elige ahora y delante de todos. Aunque esquives, algo pierdes: por eso es Parcial. Esq: Parcial: 1 punto.", "Choose now and in front of everybody. Even if you dodge, you lose something: hence Partial. Dodge: Partial: 1 point."], "c": "arma"}, {"n": ["La deuda recordada", "The Debt Recalled"], "d": ["Daño Social 1", "Social Damage 1"], "e": ["Esq: Difícil (−2)", "Dodge: Hard (−2)"], "a": ["Abs: Total", "Soak: Full"], "m": ["—", "—"], "p": ["2", "2"], "k": ["1", "1"], "x": ["Permiso: un favor Te recuerdan en público lo que te dieron. Además del daño, te obliga a aceptar una petición o a quedar como un ingrato. Esq: Difícil, 2 puntos; obligarte a elegir es un permiso, 1 Llave.", "Permit: a favour They remind you in public of what they gave you. Besides the damage, it forces you to accept a request or look ungrateful. Dodge: Hard, 2 points; forcing you to choose is a permit, 1 Key."], "c": "arma"}, {"n": ["El desaire calculado", "The Calculated Snub"], "d": ["Daño Social 1", "Social Damage 1"], "e": ["Esq: Total", "Dodge: Full"], "a": ["Abs: Reputación", "Soak: Reputation"], "m": ["—", "—"], "p": ["0", "0"], "k": ["0", "0"], "x": ["No saludarte. Barato, repetible y devastador si se hace delante de quien decide.", "Not greeting you. Cheap, repeatable and devastating if done in front of whoever decides."], "c": "arma"}, {"n": ["La confesión ajena", "Somebody Else’s Confession"], "d": ["Daño Mental 2", "Mental Damage 2"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Voluntad", "Soak: Will"], "m": ["—", "—"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Te cuentan algo que no querías saber, y a partir de ahora eres cómplice. Va a la Mental, no a la Social: no te quita reputación, te quita paz. Esq: Nula: 1 Llave.", "They tell you something you did not want to know, and from now on you are an accomplice. It goes to the Mental bar, not the Social one: it does not cost you reputation, it costs you peace. Dodge: None: 1 Key."], "c": "arma"}]}]}, {"id": "piezas", "n": ["Piezas sueltas: el catálogo genérico", "Loose parts: the generic catalogue"], "blocks": [{"n": ["Armas", "Weapons"], "items": [{"n": ["Hoja corta", "Short blade"], "d": ["Daño 1", "Damage 1"], "e": ["Esq: Total", "Dodge: Full"], "a": ["Abs: Total", "Soak: Full"], "m": ["0", "0"], "p": ["0", "0"], "k": ["0", "0"], "x": ["El cuchillo, la daga, el punzón. Existe en todos los mundos y no cuesta nada tenerlo.", "The knife, the dagger, the shiv. It exists in every world and costs nothing to own."], "c": "arma"}, {"n": ["Hoja larga", "Long blade"], "d": ["Daño 2", "Damage 2"], "e": ["Esq: Total", "Dodge: Full"], "a": ["Abs: Total", "Soak: Full"], "m": ["1", "1"], "p": ["0", "0"], "k": ["0", "0"], "x": ["La espada, el machete, el hacha de mano.", "The sword, the machete, the hand axe."], "c": "arma"}, {"n": ["Arma a dos manos", "Two-handed weapon"], "d": ["Daño 2", "Damage 2"], "e": ["Esq: Fácil (+2)", "Dodge: Easy (+2)"], "a": ["Abs: Máx 1", "Soak: Max 1"], "m": ["1", "1"], "p": ["1", "1"], "k": ["0", "0"], "x": ["Enorme y lenta: hace un destrozo, pero se ve venir. El punto paga el Abs: Máx 1; que se vea venir no descuenta.", "Huge and slow: it does terrible damage, but you see it coming. The point pays for the Soak: Max 1; seeing it coming is no discount."], "c": "arma"}, {"n": ["Arma de maestro armero", "Master-forged weapon"], "d": ["Daño 2", "Damage 2"], "e": ["Esq: Total", "Dodge: Full"], "a": ["Abs: Total", "Soak: Full"], "m": ["2", "2"], "p": ["1", "1"], "k": ["0", "0"], "x": ["El punto compra +1 a dar , y se suma a lo que ya tengas ( 2.5 ).", "The point buys +1 to hit , and it adds to whatever you already have ( 2.5 )."], "c": "arma"}, {"n": ["Proyectil ligero", "Light projectile"], "d": ["Daño 1", "Damage 1"], "e": ["Esq: Total", "Dodge: Full"], "a": ["Abs: Total", "Soak: Full"], "m": ["1", "1"], "p": ["0", "0"], "k": ["0", "0"], "x": ["Arco corto, honda, dardo. Una pistola, por pequeña que sea, es un arma de fuego (más abajo).", "Short bow, sling, dart. A pistol, however small, is a firearm (further down)."], "c": "arma"}, {"n": ["Proyectil pesado", "Heavy projectile"], "d": ["Daño 2", "Damage 2"], "e": ["Esq: Difícil (−2)", "Dodge: Hard (−2)"], "a": ["Abs: Máx 1", "Soak: Max 1"], "m": ["2", "2"], "p": ["3", "3"], "k": ["0", "0"], "x": ["Ballesta, arco largo, jabalina: a distancia no hay dónde esconderse. Esq: Difícil, 2 puntos; Abs: Máx 1, uno.", "Crossbow, longbow, javelin: at range there is nowhere to hide. Dodge: Hard, 2 points; Soak: Max 1, one."], "c": "arma"}, {"n": ["Arma de fuego", "Firearm"], "d": ["Daño 2", "Damage 2"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Total", "Soak: Full"], "m": ["1", "1"], "p": ["0", "0"], "k": ["1", "1"], "x": ["La pistola, el revólver, el rifle. A nivel 1 no se esquiva: no dificulta la esquiva, la anula, y eso es una Llave ( 5.6 ). En la ópera espacial, los blásters se esquivan por convenio del género.", "The pistol, the revolver, the rifle. At level 1 it cannot be dodged: it does not make dodging harder, it cancels it, and that is a Key ( 5.6 ). In space opera, blasters can be dodged by genre convention."], "c": "arma"}, {"n": ["Arma de área", "Area weapon"], "d": ["Daño 2", "Damage 2"], "e": ["Esq: Parcial", "Dodge: Partial"], "a": ["Abs: Máx 1", "Soak: Max 1"], "m": ["2", "2"], "p": ["2", "2"], "k": ["0", "0"], "x": ["Fuego, metralla, aliento. Aunque esquives, te comes 1. Esq: Parcial y Abs: Máx 1: 2 puntos.", "Fire, shrapnel, breath. Even if you dodge, you take 1. Dodge: Partial and Soak: Max 1: 2 points."], "c": "arma"}, {"n": ["Arma inevitable", "Inevitable weapon"], "d": ["La Parca · Rejilla 2", "The Reaper · Grid 2"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Nula", "Soak: None"], "m": ["3", "3"], "p": ["0", "0"], "k": ["2", "2"], "x": ["El rifle supersónico, el rayo, la bala que ya te dio. No existe en todos los mundos, y donde existe lo cambia todo. Parca 2, Limitada al daño: 1 Llave ( 5.6 ); que no se esquive, otra.", "The supersonic rifle, the beam, the bullet that already hit you. It does not exist in every world, and where it does it changes everything. Reaper 2, Limited to damage: 1 Key ( 5.6 ); being undodgeable, another."], "c": "arma"}, {"n": ["Arma que abre la armadura", "Armour-opener"], "d": ["Daño 2", "Damage 2"], "e": ["Esq: Total", "Dodge: Full"], "a": ["Abs: Nula", "Soak: None"], "m": ["2", "2"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Monofilo, perforante, ácido, maldita. Se esquiva bien; pararla, no. Abs: Nula: no dificulta la armadura, la anula, y eso es 1 Llave ( 5.6 ).", "Monofilament, armour-piercing, acid, cursed. Easy to dodge; impossible to stop. Soak: None: it does not make armour harder, it cancels it, and that is 1 Key ( 5.6 )."], "c": "arma"}, {"n": ["Arma aturdidora", "Stunning weapon"], "d": ["Daño 1 (aturde)", "Damage 1 (stuns)"], "e": ["Esq: Total", "Dodge: Full"], "a": ["Abs: Nula", "Soak: None"], "m": ["1", "1"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Porra, táser, hechizo de sueño. Hace poco daño y mucha diferencia. Abs: Nula: 1 Llave.", "Baton, taser, sleep spell. Little damage, a lot of difference. Soak: None: 1 Key."], "c": "arma"}, {"n": ["Arma de asedio", "Siege weapon"], "d": ["La Parca · Rejilla 2", "The Reaper · Grid 2"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Nula", "Soak: None"], "m": ["3", "3"], "p": ["0", "0"], "k": ["2", "2"], "x": ["Rejilla: Nivel 2 Cañón, ariete, bola de fuego de guerra: alcanza al nivel 2. Parca 2, Limitada al daño: 1 Llave ( 5.6 ); que no se esquive, otra.", "Grid: Level 2 Cannon, battering ram, war-grade fireball: it reaches level 2. Reaper 2, Limited to damage: 1 Key ( 5.6 ); being undodgeable, another."], "c": "arma"}, {"n": ["La bomba de los mil soles", "The bomb of a thousand suns"], "d": ["La Parca · Rejilla 4", "The Reaper · Grid 4"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Nula", "Soak: None"], "m": ["3", "3"], "p": ["0", "0"], "k": ["0", "0"], "x": ["Rejilla: Nivel 4 Borra una ciudad. No es equipo de personaje: es un argumento. Normalmente está en manos de alguien a quien hay que convencer. Y es de un solo uso, así que no se paga ( 5.4 ): lo que cuesta es tenerla, y eso es una trama. Una que se pudiera lanzar cada sesión costaría 6 Llaves: Parca 4, Limitada al daño: 5 Llaves ( 5.6 ), y 1 porque no se esquiva.", "Grid: Level 4 It erases a city. This is not character equipment: it is a plot. It is usually in the hands of somebody who has to be talked round. And it is single use, so it is not paid for ( 5.4 ): what it costs is having it, and that is a storyline. One that could be launched every session would cost 6 Keys: Reaper 4, Limited to damage: 5 Keys ( 5.6 ), and 1 because it cannot be dodged."], "c": "arma"}, {"n": ["La luna que no era una luna", "The moon that was not a moon"], "d": ["La Parca · Rejilla 5", "The Reaper · Grid 5"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Nula", "Soak: None"], "m": ["—", "—"], "p": ["0", "0"], "k": ["9", "9"], "x": ["Rejilla: Nivel 5 Apunta a un país entero y lo apaga. Nadie la aguanta. Se juega buscando el tubo de escape. Parca 5, Limitada al daño: 8 Llaves ( 5.6 ); que no se esquive, otra.", "Grid: Level 5 It points at a whole country and switches it off. Nobody survives it. You play it looking for the exhaust port. Reaper 5, Limited to damage: 8 Keys ( 5.6 ); being undodgeable, another."], "c": "arma"}, {"n": ["La lanza que cae del cielo", "The spear that falls from the sky"], "d": ["La Parca · Rejilla 4", "The Reaper · Grid 4"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Nula", "Soak: None"], "m": ["3", "3"], "p": ["0", "0"], "k": ["6", "6"], "x": ["Rejilla: Nivel 4 Un poste de metal soltado desde muy arriba. Sin explosivo, sin aviso y sin discusión. Parca 4, Limitada al daño: 5 Llaves ( 5.6 ); que no se esquive, otra.", "Grid: Level 4 A metal post dropped from very high up. No explosive, no warning and no argument. Reaper 4, Limited to damage: 5 Keys ( 5.6 ); being undodgeable, another."], "c": "0", "0"], "k": ["1", "1"], "x": ["Una muchedumbre hace lo que dices. La cuenta: nivel 2 en una Disciplina, Liderazgo, contra todo: 1² = 1. Ajuste: Completo.", "A crowd does what you say. Tally: level 2 in one Discipline, Leadership, against everything: 1² = 1. Adjustment: Complete."], "c": "artefacto"}, {"n": ["Piel contra el elemento", "Elemental skin"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["—", "—"], "p": ["0", "0"], "k": ["1", "1"], "x": ["El fuego, el frío o el vacío no te tocan. La cuenta: permiso: 1 Llave. Ajuste: Completo.", "Fire, cold or vacuum do not touch you. Tally: permit: 1 Key. Adjustment: Complete."], "c": "artefacto"}, {"n": ["Ojo del mentiroso", "Liar’s eye"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["—", "—"], "p": ["1", "1"], "k": ["0", "0"], "x": ["Sabes cuándo te mienten. La cuenta: esto no es un poder : es Empatía. Ajuste: —.", "You know when you are being lied to. Tally: this is not a power : it is Empathy. Adjustment: —."], "c": "artefacto"}, {"n": ["Medio segundo", "Half a second"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["—", "—"], "p": ["2", "2"], "k": ["0", "0"], "x": ["Ves el instante siguiente: +2 a iniciativa y a esquivar. La cuenta: tampoco es un permiso : son dos bonos. Ajuste: —.", "You see the next instant: +2 to initiative and to dodging. Tally: not a permit either : it is two bonuses. Adjustment: —."], "c": "artefacto"}]}]}], "baul": [["Relojes de progreso", "Progress clocks"], ["Flashbacks", "Flashbacks"], ["Pacto del diablo", "Devil’s bargain"], ["Daño explosivo", "Exploding damage"], ["Rejilla mística inversa", "Inverse mystic Grid"], ["Destino (Wyrd)", "Destiny (Wyrd)"], ["Fundas (el cuerpo como equipo)", "Sleeves (the body as equipment)"], ["Clones", "Clones"], ["El Director tira en oculto", "The GM rolls in secret"], ["Tablas de dados", "Dice tables"], ["Transformación", "Transformation"], ["Sincronización", "Synchronisation"], ["Daño ambiental", "Environmental damage"], ["Barras propias (Honor, Reputación y otras)", "Custom bars (Honour, Reputation and others)"], ["Vínculos", "Bonds"], ["Menú de los 4 costes", "Menu of the 4 costs"], ["La escalera llana", "The flat ladder"], ["Cansancio", "Fatigue"]], "recipes": [["1. «GESTIÓN DE HOMICIDIOS EN MAZMORRA» · «CLASES, RAZAS Y COMBOS»", "1. “DUNGEON HOMICIDE MANAGEMENT” · “CLASSES, RACES AND COMBOS”"], ["2. «BARRO, RATAS Y HEREJÍA» · «ME CURARON EL BRAZO Y AHORA SOY PSICÓPATA»", "2. “MUD, RATS AND HERESY” · “THEY HEALED MY ARM AND NOW I AM A PSYCHOPATH”"], ["3. «EL PASEO MELANCÓLICO»", "3. “THE MELANCHOLY STROLL”"], ["4. «HONOR SUICIDA Y CEREMONIA DEL TÉ»", "4. “SUICIDAL HONOUR AND TEA CEREMONIES”"], ["5. «DRAMA DE CAPA Y ESPADA»", "5. “SWASHBUCKLING MELODRAMA”"], ["6. «VIKINGOS, NIEVE Y DESTINO»", "6. “VIKINGS, SNOW AND DESTINY”"], ["7. «MAGOS ESPACIALES Y PADRES AUSENTES»", "7. “SPACE WIZARDS AND ABSENT FATHERS”"], ["8. «ALTA TECNOLOGÍA, BAJA ESPERANZA»", "8. “HIGH TECH, LOW HOPE”"], ["9. «EL BACKUP DE TU ALMA»", "9. “BACKING UP YOUR SOUL”"], ["10. «CHATARRA, GASOLINA Y ÓXIDO»", "10. “SCRAP, PETROL AND RUST”"], ["11. «CIBER-ELFOS Y MAGIA CORPORATIVA»", "11. “CYBER-ELVES AND CORPORATE MAGIC”"], ["12. «LA BIBLIOTECA MORTAL»", "12. “THE DEADLY LIBRARY”"], ["13. «POLÍTICA DE COMUNIDAD DE VECINOS (CON COLMILLOS)» · «LOS ALBINOS Y LOS SACOS DE DADOS»", "13. “HOMEOWNERS’ ASSOCIATION POLITICS (WITH FANGS)” · “THE ALBINOS AND THE DICE BAGS”"], ["14. «NIÑOS EN BICICLETA VS EL GOBIERNO»", "14. “KIDS ON BIKES VS THE GOVERNMENT”"], ["15. «LADRONES EN LA NIEBLA»", "15. “THIEVES IN THE FOG”"], ["16. «DIOSES EN PIJAMA Y PROBLEMAS ÉTICOS»", "16. “GODS IN PYJAMAS WITH ETHICAL DILEMMAS”"], ["17. «EL TORNEO DE ARTES MARCIALES (GRITANDO)»", "17. “THE MARTIAL ARTS TOURNAMENT (NOW WITH SCREAMING)”"], ["18. «ROBOTS GIGANTES Y ANGUSTIA ADOLESCENTE»", "18. “GIANT ROBOTS AND TEENAGE ANGST”"], ["19. «LA DISTOPÍA HILARANTE»", "19. “THE HILARIOUS DYSTOPIA”"], ["20. «EL MUNDO SOSTENIDO POR QUELONIOS»", "20. “THE WORLD ON THE BACK OF CHELONIANS”"]], "baulLong": [["Reloj de progreso Dibuja un círculo dividido en 4, 6 u 8 segmentos según lo largo que sea el objetivo (una infiltración, una persecución, el fin del mundo). Cada éxito en una tirada que empuje hacia el objetivo rellena 1 segmento ; cada crítico, 2 . Cada fallo en una tirada de riesgo rellena un segmento del reloj opuesto (el de los malos: la alarma, el ritual, la marea). Gana quien complete antes su reloj. Reloj de viaje. Mide el camino, no el combate: cada etapa rellena segmentos y cada contratiempo (tormenta, emboscada, desánimo) los cuesta. Es el corazón de la receta 3. Reloj de suministros. Sustituye a la contabilidad de flechas y raciones. Solo se saca cuando la escasez es el tema de la escena (perdidos en el desierto); el resto del tiempo, los héroes llevan bocadillos. El núcleo ya usa un reloj sin llamarlo así: la hemorragia arterial del umbral 2 ( 6.6 ) es un reloj de 3 turnos. Recetas: 3 («El paseo melancólico»), 15 («Ladrones en la niebla»).", "Progress clock Draw a circle split into 4, 6 or 8 segments depending on how long the goal is (an infiltration, a chase, the end of the world). Each success on a roll that pushes towards the goal fills 1 segment ; each critical, 2 . Each failure on a risky roll fills a segment of the opposing clock (the villains’ one: the alarm, the ritual, the tide). Whoever fills their clock first wins. Travel clock. It measures the road, not the fight: each leg of the journey fills segments and each setback (storm, ambush, despair) costs them. It is the heart of recipe 3. Supply clock. It replaces bookkeeping of arrows and rations. It only comes out when scarcity is the theme of the scene (lost in the desert); the rest of the time, the heroes have packed sandwiches. The core already uses a clock without calling it one: the arterial bleeding at threshold 2 ( 6.6 ) is a 3-turn clock. Recipes: 3 (“The Melancholy Stroll”), 15 (“Thieves in the Fog”)."], ["Planificación retroactiva Un jugador puede interrumpir el presente para narrar una escena del pasado que resuelve el problema actual («No tengo la llave… pero ayer soborné al guardia»). El flashback no se paga: se tira. Tira la habilidad que corresponda al plan contra la TN de la tarjeta activa. Éxito: el flashback ocurrió, y tienes lo que fuiste a buscar. Cada punto por encima de la TN te da un detalle más que puedes meter dentro: un objeto que dejaste preparado, una salida, alguien colocado en el sitio justo. Fallo: el plan existía, pero salió torcido y lo descubres ahora. Pifia: el pasado te delata; el menú de la pifia ( 6.2 ) decide cómo. Así el flashback es una escena con riesgo, que es para lo que la mesa lo quiere. Recetas: 15 («Ladrones en la niebla»), donde los flashbacks son obligatorios para planear el golpe.", "Retroactive planning A player can interrupt the present to narrate a scene from the past that solves the current problem (“I don’t have the key… but yesterday I bribed the guard”). The flashback is not paid for: it is rolled. Roll whatever skill the plan calls for against the active card’s TN. Success: the flashback happened, and you have what you went for. Every point above the TN buys one more detail you can slip inside it: something you left ready, an exit, somebody placed exactly where you needed them. Failure: the plan existed, but it went crooked and you find out now. Fumble: the past gives you away; the fumble menu ( 6.2 ) decides how. That way the flashback is a scene with risk, which is what the table wants it for. Recipes: 15 (“Thieves in the Fog”), where flashbacks are mandatory for planning the heist."], ["Riesgo por poder Antes de una tirada importante, el Director ofrece un trato: la acción se resuelve con Mejor de 2d10 contra TN 6 (como en la tarjeta Épica), sea cual sea la tarjeta activa. A cambio, pase lo que pase, el Director aplica una consecuencia narrativa garantizada , elegida del menú de los 4 costes ( 6.6 ). El jugador puede rechazar el pacto. En NOGUM no se añaden dados: el poder del pacto es cambiar la lectura hacia el optimismo durante una tirada. Recetas: ninguna de las veinte lo usa. Está pensado para terror y drama oscuro.", "Risk for power Before an important roll, the GM offers a deal: the action is resolved with Best of 2d10 against TN 6 (as on the Epic card), whatever card is active. In exchange, come what may, the GM applies a guaranteed narrative consequence , chosen from the menu of the 4 costs ( 6.6 ). The player may turn the bargain down. In NOGUM you do not add dice: the power of the bargain is shifting the reading towards optimism for one roll. Recipes: none of the twenty uses it. It is designed for horror and dark drama."], ["Críticos en cadena Cuando el atacante saca crítico, además de su +1 al daño ( 6.2 ), vuelve a tirar la misma lectura. Si saca otro crítico, suma otro +1, y así sucesivamente. El daño sigue sujeto a las etiquetas del arma y del defensor. Es la versión «pulp desatado» de la única matemática del daño. No lo confundas con la Parca del núcleo ( 4.5 ), que es una propiedad del arma y no depende de los dados. Recetas: ninguna de las veinte; aparece en la Piedra Rosetta (acción pulp frenética).", "Chained criticals When the attacker rolls a critical, on top of their +1 to damage ( 6.2 ), they roll the same reading again. If they roll another critical, they add another +1, and so on. The damage is still subject to the weapon’s and the defender’s tags. It is the “unleashed pulp” version of the single damage maths. Don’t confuse it with the Reaper of the core ( 4.5 ), which is a property of the weapon and does not depend on the dice. Recipes: none of the twenty; it appears in the Rosetta Stone (frantic pulp action)."], ["Saber es perder la razón En este módulo el conocimiento prohibido hace daño. Cada vez que un personaje aprende o usa saber prohibido (Ocultismo, cualquier competencia del Ámbito Arcano), recibe Daño Mental 1 Esq: Nula , aunque la tirada sea un éxito . Un crítico es una revelación completa: Daño Mental 2 . Cuanto más sabes, más cerca estás de quedar fuera de juego. Recetas: 12 («La biblioteca mortal»: saber = Daño Mental).", "To know is to lose your mind In this module, forbidden knowledge hurts. Every time a character learns or uses forbidden lore (Occultism, any skill in the Arcane Sphere), they take Mental Damage 1 Dodge: None , even if the roll is a success . A critical is a full revelation: Mental Damage 2 . The more you know, the closer you are to being out of the game. Recipes: 12 (“The Deadly Library”: knowledge = Mental damage)."], ["Tu muerte está escrita Al crear el personaje, el jugador escribe cómo y cuándo morirá (una condición narrativa, no una fecha: «cuando vuelva a ver el mar de mi infancia»). Hasta que llegue ese momento, el personaje tira sus acciones de supervivencia con la tarjeta Épica , aunque la mesa juegue con otra. Cuando el Wyrd se cumple, pasa a la receta Tragedia ( 1.4 ) hasta el final de la escena. Es tono por personaje ( 1.5 y capítulo 8 ) al servicio del destino. La condición la aprueba el Director . Tiene que poder ocurrir en esta campaña : «cuando vuelva a ver el mar de mi infancia» no vale si la partida nunca va a salir del valle. Y el Director puede provocarla cuando la historia lo pida: el destino no espera a que el jugador tenga ganas. Magia rúnica: la magia se paga con sangre. Cada runa tacha casillas de la barra Física del lanzador (1 por runa menor, 2 por runa mayor). Aquí la muerte es legítima porque la ha escrito el propio jugador: es la muerte pactada de 0.7 . Y la Tragedia llega en la dosis que recomendamos para los tonos más oscuros: poco tiempo, una escena. Es un consejo, no una regla: la mesa es adulta y decide ( 1.4 ). Recetas: 6 («Vikingos, nieve y destino»).", "Your death is written When creating the character, the player writes down how and when they will die (a narrative condition, not a date: “when I see the sea of my childhood again”). Until that moment comes, the character rolls their survival actions with the Epic card , even if the table is playing with another one. When the Wyrd is fulfilled, they switch to the Tragedy recipe ( 1.4 ) until the end of the scene. It is per-character tone ( 1.5 and chapter 8 ) in the service of destiny. The condition is approved by the GM . It has to be able to happen in this campaign : “when I see the sea of my childhood again” does not work if the game is never leaving the valley. And the GM can trigger it when the story calls for it: destiny does not wait until the player feels like it. Rune magic: magic is paid for in blood. Each rune marks boxes on the caster’s Physical bar (1 per minor rune, 2 per major rune). Here death is legitimate because the player wrote it themselves: it is the agreed death of 0.7 . And Tragedy arrives in the dose we recommend for the darkest tones: a short while, one scene. It is advice, not a rule: the table is grown-up and decides ( 1.4 ). Recipes: 6 (“Vikings, Snow and Destiny”)."], ["Tu mente es software La barra Física y el nivel de Rejilla del Ámbito Físico pertenecen a la funda (el cuerpo), que se anota en la ficha como equipo , con su propia ficha técnica. Las competencias, la barra Mental y la barra Espiritual pertenecen al personaje. Cambiar de funda causa Daño Mental 1 Esq: Nula Abs: Nula . Aquí la barra Mental se llama Identidad (no hay Arcano, así que no hay barra Espiritual). Vaciarla no retira la ficha. Lo que hay al otro lado es terapia —danza mental, reconstrucción, el tiempo— y vuelves siendo un personaje muy distinto , que es mucho mejor material de mesa que un hueco. Los casos severos no se juegan como protagonistas salvo acuerdo expreso, y perder la ficha solo pasa en partidas cortas donde ese final estaba pactado desde el principio ( 0.7 ). Si la funda queda fuera de combate , la mente se descarga en la nube y despierta en una funda nueva (si hay copia de seguridad y conexión). El salto cuesta el mismo daño a la Identidad. Recetas: 9 («El backup de tu alma»).", "Your mind is software The Physical bar and the Grid level of the Physical Sphere belong to the sleeve (the body), which is noted on the sheet as equipment , with its own stat block. The skills, the Mental bar and the Spiritual bar belong to the character. Changing sleeves causes Mental Damage 1 Dodge: None Soak: None . Here the Mental bar is called Identity (there is no Arcane, so there is no Spiritual bar). Emptying it does not retire the sheet. What waits on the other side is therapy —mind-dancing, reconstruction, time— and you come back as a very different character , which is far better table material than a gap. Severe cases are not played as protagonists unless expressly agreed, and losing the sheet only happens in short games where that ending was agreed from the start ( 0.7 ). If the sleeve is taken out of the fight , the mind is uploaded to the cloud and wakes up in a new sleeve (if there is a backup and a connection). The jump costs the same damage to Identity. Recipes: 9 (“Backing Up Your Soul”)."], ["Seis vidas Cada personaje empieza con 6 clones , que se marcan en la ficha. Cuando queda fuera de combate, la mesa puede declarar que ese clon ha muerto: llega el siguiente, con la misma ficha y la vida completa, y suele traer una explicación poco convincente. Al gastar el sexto, el personaje sale de la partida. La muerte es aquí un chiste recurrente pactado por la mesa. No contradice el pilar «ningún protagonista muere por una tirada» ( 0.7 ): en este género, morir es parte del humor. Recetas: 19 («La distopía hilarante»).", "Six lives Each character starts with 6 clones , which are marked on the sheet. When they are taken out of the fight, the table may declare that clone dead: the next one arrives, with the same sheet and full health, usually bringing an unconvincing explanation. Once the sixth is spent, the character leaves the game. Here death is a running gag agreed by the table. It does not contradict the pillar “no protagonist dies because of a roll” ( 0.7 ): in this genre, dying is part of the humour. Recipes: 19 (“The Hilarious Dystopia”)."], ["Detrás de la pantalla El Director tira todas las tiradas de riesgo detrás de la pantalla, también las de los jugadores, y anuncia solo el resultado narrativo. En la variante extrema, puede mentir sobre lo que ha salido. Encaja con la caja negra del capítulo 8 : el jugador declara y el Director cuenta. Úsalo solo si la mesa lo pacta en la sesión 0: el pacto entre caballeros también vale para el Director. Recetas: 19 («La distopía hilarante»).", "Behind the screen The GM makes all risky rolls behind the screen, the players’ ones included, and announces only the narrative outcome. In the extreme variant, they may lie about what came up. It fits with the black box of chapter 8 : the player declares and the GM narrates. Use it only if the table agrees to it in session zero: the gentlemen’s agreement binds the GM too. Recipes: 19 (“The Hilarious Dystopia”)."], ["Cuatro tablas que se activan según el género. Las recetas las nombran, y están escritas, como ejemplos por género, en Tablas de problemas . Lo que sigue es para qué sirve cada una. Heridas graves. Amplía las consecuencias del umbral 2 ( 6.6 ) con una tabla de 1d10 de lesiones concretas. Enfermedades y locura. Una tabla de dolencias (físicas y mentales) para mundos sucios. Receta 2. Fallos de equipo. Para mundos donde nada funciona: amplía el rango de pifia (herramienta A.3.1 de la Sala de Máquinas ) solo para el equipo y, cuando salta, se tira en la tabla. Receta 10. Mutaciones. Una tabla de mutaciones aleatorias para el horror corporal y el postapocalipsis. Ninguna de las veinte recetas la usa.", "Four tables that switch on depending on the genre. The recipes name them, and they are written, as examples by genre, in Problem tables . What follows is what each one is for. Grievous wounds. It expands the threshold 2 consequences ( 6.6 ) with a 1d10 table of specific injuries. Diseases and madness. A table of ailments (physical and mental) for grimy worlds. Recipe 2. Equipment failures. For worlds where nothing works: it widens the fumble range (tool A.3.1 of the Engine Room ) for equipment only and, when it triggers, you roll on the table. Recipe 10. Mutations. A table of random mutations for body horror and post-apocalypse. None of the twenty recipes uses it."], ["Subir de nivel a gritos Durante un combate, el personaje se transforma y sube (normalmente en el Físico). Como todo modificador temporal ( 2.5 ), la transformación tiene su condición de fin : se acaba al acabar la escena , porque lo que el género pide es que dure lo que dura la pelea. Transformarse no sale gratis. Lo que se paga es la capacidad de transformarte, que es tuya para siempre; una transformación de un momento que te presta la trama no se paga ( 4.4 ). La capacidad se paga como lo que sube. Si sube un Ámbito entero, es Rejilla: 5·n² Llaves, con n los niveles que sube ( 5.3 ). Si sube Disciplinas sueltas, a voluntad es la Llave completa, contra todo: n² por Disciplina ( 4.3 ); si suben tantas que la cuenta pasa de 5·n², sale más a cuenta la Rejilla del Ámbito. Es Limitada o no según sus condiciones. Con limitaciones importantes —solo con luna llena, sin control, te cuesta vida…— va Limitada ( 5.5 ): la mitad, al alza, y como poco 1 Llave. Que acabe con la escena no la abarata: si te transformas a voluntad y siempre que quieres, es la completa, y la condición de fin no vale como truco para pagar menos. Una Disciplina sola que sube un nivel cuesta lo mismo Limitada que completa, así que ahí, como consejo, no merece la pena separarlas ( 4.3 ). Un nivel de Rejilla en todo el Físico, de 1 a 2, a voluntad, son 5 Llaves; el hombre lobo que solo se transforma con luna llena y no se controla va Limitado y paga 3. Si el Director cambia además el zoom de daño a mitad de pelea, la transformación se combina con la Sincronización ( 3.8 ). Recetas: 17 («El torneo de artes marciales (gritando)»). En una ficha · «Viper» : su transformación, Limitada (9.5)", "Levelling up by screaming During a fight, the character transforms and goes up (usually in the Physical Sphere). Like any temporary modifier ( 2.5 ), the transformation has its end condition : it ends when the scene ends , because what the genre wants is for it to last as long as the fight does. Transforming is not free. What you pay for is the ability to transform, which is yours for good; a momentary transformation lent to you by the plot is not paid for ( 4.4 ). The ability is paid for like whatever it raises. If it raises a whole Sphere, it is Grid: 5·n² Keys, with n the number of levels it rises ( 5.3 ). If it raises individual Disciplines, at will it is the complete Key, against everything: n² per Discipline ( 4.3 ); if it raises so many that the total goes past 5·n², the Sphere’s Grid works out cheaper. Whether it is Limited depends on its conditions. With significant limitations —only under a full moon, out of control, it costs you health…— it is Limited ( 5.5 ): half, rounded up, and at least 1 Key. Ending with the scene does not make it cheaper: if you transform at will and whenever you like, it is the complete one, and the end condition is no trick for paying less. A single Discipline rising one level costs the same Limited as complete, so there, as advice, it is not worth telling them apart ( 4.3 ). One Grid level across the whole Physical Sphere, from 1 to 2, at will, is 5 Keys; the werewolf who only transforms under a full moon and cannot control it is Limited and pays 3. If the GM also changes the damage zoom mid-fight, the transformation combines with Synchronisation ( 3.8 ). Recipes: 17 (“The Martial Arts Tournament (Now With Screaming)”). On a sheet · “Viper” : her transformation, Limited (9.5)"], ["Es regla del núcleo y vive en 3.8 : quien pilota un mecha, viste un exoesqueleto o se fusiona juega con la ficha del mecha, con su nivel, mientras dure. En el baúl solo figura para recordar que existe. Recetas: 18 («Robots gigantes y angustia adolescente»).", "It is a core rule and lives in 3.8 : whoever pilots a mecha, wears an exoskeleton or fuses plays with the mecha’s sheet, at its level, for as long as it lasts. It only appears in the chest as a reminder that it exists. Recipes: 18 (“Giant Robots and Teenage Angst”)."], ["El mundo te hace daño Un entorno hostil (radiación, frío extremo, vacío, gas) inflige daño por cada escena de exposición y sin tirada de ataque, y el daño sube según te quedas : Daño 1 la primera escena, Daño 2 la segunda, La Parca · Rejilla 2 la tercera —a quien esté por debajo de ese nivel lo deja fuera de combate, sin derecho a tirada ( 4.5 )—, y todo con Esq: Nula Abs: Nula . Rejilla 2 es lo corriente; el vacío o el corazón de un reactor llevan la suya, más alta. El contador vuelve a cero en cuanto sales. La protección adecuada (traje, refugio, antídoto) es lo que te salva: con ella, el daño se puede absorber o desaparece. El caso extremo (el casco que se rompe en el vacío) es una Parca de nivel más alto ( 4.5 ). Recetas: 10 («Chatarra, gasolina y óxido»).", "The world hurts you A hostile environment (radiation, extreme cold, vacuum, gas) inflicts damage for each scene of exposure , with no attack roll, and the damage rises the longer you stay : Damage 1 the first scene, Damage 2 the second, The Reaper · Grid 2 the third —anyone below that level is taken out of the fight, with no right to roll ( 4.5 )—, and all of it with Dodge: None Soak: None . Grid 2 is the usual; vacuum or the heart of a reactor carry their own, higher. The counter resets the moment you get out. The right protection (suit, shelter, antidote) is what saves you: with it, the damage can be soaked or disappears. The extreme case (the helmet that cracks in vacuum) is a higher-level Reaper ( 4.5 ). Recipes: 10 (“Scrap, Petrol and Rust”)."], ["Una barra para lo que más importa El núcleo tiene tres barras (Física, Mental, Espiritual) y admite que una campaña cree una barra propia o rebautice una existente ( 6.5 ). Todas funcionan igual: bloques, casillas, umbrales y consecuencias, y vuelven enteras cuando estáis a salvo ( 6.4 ). Honor (barra propia): recibe Daño Social N . Llenarla del todo es la deshonra definitiva. Receta 4. Reputación / Ciudad (barra propia): mide lo que el héroe se juega de verdad. Receta 16. Sed (barra Mental rebautizada): el ansia del vampiro, que se juega como una abstinencia. Receta 13. Sombra (barra Espiritual rebautizada): la corrupción que deja el mal en quien lo combate. Receta 3. Corrupción (barra Espiritual rebautizada) en grimdark; Humanidad e Identidad (barra Mental rebautizada) en ciberpunk y mentes digitales, porque allí la pérdida es cognitiva y no sobrenatural. Recetas 2, 8, 9. Los nombres salen de las recetas, y los usos concretos de cada barra están en las tablas de problemas . Barra de campaña. Una barra propia puede ser de campaña: lleva su propio zoom (lo normal, Guerra: 27 puntos, la pérdida lenta de 6.4 ) y no se vacía al estar a salvo ; se recupera con lo que diga la ficción: una terapia, una cura, quitarse el cromo. Sus umbrales dejan consecuencias como cualquier otra. Receta 8. En una ficha · «Viper» : la Humanidad, de campaña (9.5)", "A bar for what matters most The core has three bars (Physical, Mental, Spiritual) and allows a campaign to create a custom bar or rename an existing one ( 6.5 ). They all work the same way: blocks, boxes, thresholds and consequences, and they come back whole when you are safe ( 6.4 ). Honour (custom bar): takes Social Damage N . Filling it completely is final disgrace. Recipe 4. Reputation / City (custom bar): measures what the hero really has at stake. Recipe 16. Thirst (renamed Mental bar): the vampire’s craving, played as withdrawal. Recipe 13. Shadow (renamed Spiritual bar): the corruption evil leaves on those who fight it. Recipe 3. Corruption (renamed Spiritual bar) in grimdark; Humanity and Identity (renamed Mental bar) in cyberpunk and digital minds, because there the loss is cognitive and not supernatural. Recipes 2, 8, 9. The names come from the recipes, and the specific uses of each bar are in the problem tables . Campaign bar. A custom bar can be campaign-long: it has its own zoom (usually War: 27 points, the slow loss in 6.4 ) and does not empty when you are safe ; it recovers with whatever the fiction says: therapy, a cure, taking the chrome out. Its thresholds leave consequences like any other. Recipe 8. On a sheet · “Viper” : Humanity, campaign-long (9.5)"], ["El corazón como Llave Cada personaje anota 2 o 3 vínculos : personas que le importan, que son personajes no jugadores —la hermana, el vecino, el viejo maestro—, no otro PJ. Un vínculo sirve para dos cosas: Como Llave ( 4.4 ). Cuando el personaje actúa para proteger o apoyar a un vínculo presente en la escena, puede afectar a una amenaza de nivel superior. La amistad es el permiso narrativo. Como escudo. Puede desviar daño hacia un vínculo, que se resiente en la ficción: una discusión, un abandono, una herida. Se sacrifica la vida personal para salvar lo otro. Qué barra puede escudar lo decide el universo. Por defecto, la Mental. En el gótico, además la Espiritual: aferrarse a alguien que te quiere es justo lo que frena a la Bestia, y por eso allí los vínculos son media ficha. Recetas: 14 («Niños en bicicleta vs el Gobierno»).", "The heart as a Key Each character notes 2 or 3 bonds : people who matter to them, who are non-player characters —the sister, the neighbour, the old master—, not another PC. A bond is useful for two things: As a Key ( 4.4 ). When the character acts to protect or support a bond present in the scene, they can affect a higher-level threat. Friendship is the narrative permission. As a shield. They can divert damage onto a bond, which suffers in the fiction: an argument, an abandonment, a wound. Personal life is sacrificed to save the rest. Which bar a bond can shield is decided by the universe. By default, the Mental one. In the gothic, the Spiritual one as well: holding on to somebody who loves you is exactly what holds the Beast back, which is why bonds are half a character sheet there. Recipes: 14 (“Kids on bikes vs the Government”)."], ["El éxito con coste y su menú (tiempo, recurso, posición, fuego amigo) ya están en el núcleo: la idea, en 1.3 , y el menú, en 6.6 . Solo lo llevan el Pulp desenfrenado y la Comedia negra, y las recetas que juegan en ellas lo dan por supuesto. La Regla del Estilo y la gestión de masillas también se dan por supuestas: son núcleo, y viven en 3.5 .", "Success at a cost and its menu (time, resource, position, friendly fire) are already in the core: the idea, in 1.3 , and the menu, in 6.6 . Only Unleashed Pulp and Black Comedy carry it, and the recipes played on them take it for granted. The Style Rule and mook handling are also taken for granted: they are core, and live in 3.5 ."], ["Regla opcional · Crecer a plazos Crecimiento más rápido, Rejillas menos inaccesibles. Por defecto, subir n niveles con Llaves cuesta n ² ( 4.3 ). Pero este es un manual universal, y en algún momento alguien querrá llegar a dios. Si no quieres que el precio se dispare, usa 3 n −2 : 1, 4, 7, 10, 13. Con ella baja también la Rejilla, para que siga siendo la compra más barata del Ámbito entero (5/8 de cubrirlo con Llaves): 5·(3 n −2) , es decir 5, 20, 35, 50, 65, en vez de 5· n ². Coincide con la cuadrada en los dos primeros peldaños —donde juega casi todo el mundo— y solo se separa cuando se va a por la divinidad. La cuadrada dice «la divinidad se conquista en campaña»; la llana dice «la divinidad se compra a plazos». Las dos son defendibles; por defecto va la cuadrada, porque n ² se recuerda sin tabla. Por qué el precio de la cuadrada ya es un buen trato, en la Sala de Máquinas ( A.10 ). Recetas: ninguna de las veinte la usa; es para la mesa que quiere que la campaña escale deprisa.", "Optional rule · Growing in instalments Faster growth, Grids less out of reach. By default, rising n levels with Keys costs n ² ( 4.3 ). But this is a universal rulebook, and at some point somebody will want to become a god. If you don’t want the price to skyrocket, use 3 n −2 : 1, 4, 7, 10, 13. The Grid comes down with it, so that it stays the cheapest way to buy a whole Sphere (5/8 of covering it with Keys): 5·(3 n −2) , that is 5, 20, 35, 50, 65, instead of 5· n ². It matches the square ladder on the first two rungs —where nearly everyone plays— and only parts ways when you go for godhood. The square one says “godhood is conquered over a campaign”; the flat one says “godhood is bought in instalments”. Both are defensible; the square one is the default, because n ² can be remembered without a table. Why the square price is already a good deal, in the Engine Room ( A.10 ). Recipes: none of the twenty uses it; it is for the table that wants the campaign to scale quickly."], ["La defensa se cansa A partir de la tercera ronda de una pelea, y cada tres rondas, −1 a las tiradas de defensa (esquivar y absorber), acumulable. Se recupera al estar a salvo, como las barras ( 6.4 ). Se suma a los penalizadores por herida y respeta el suelo del Ancla ( 2.5 ). Entre iguales, la defensa gana los empates y la pelea es una coreografía larga ( 6.2 ). El cansancio no la acorta al principio: la hace converger. Hacia la décima ronda, dos luchadores que empezaron a +4 defienden a +1, y los golpes empiezan a entrar. Recetas: 17 («El torneo de artes marciales (gritando)»). <h3", "Defence gets tired From the third round of a fight, and every three rounds, −1 to defence rolls (dodge and soak), cumulative. It is recovered once safe, like the bars ( 6.4 ). It adds to wound penalties and respects the Anchor’s floor ( 2.5 ). Between equals, ties go to the defender and the fight is a long choreography ( 6.2 ). Fatigue does not shorten it at first: it makes it converge. Around the tenth round, two fighters who started at +4 defend at +1, and blows start getting through. Recipes: 17 (“The Martial Arts Tournament (Now with Screaming)”). <h3"]], "techos": [[3, 2, 1, 2, 4], [2, 2, 1, 2, 3], [2, 2, 1, 2, 4], [2, 2, 1, 2, 3], [2, 2, 1, 2, 0], [2, 1, 1, 1, 2], [3, 2, 1, 3, 4], [2, 1, 1, 1, 0], [3, 3, 1, 4, 0], [2, 1, 1, 2, 2], [2, 2, 1, 3, 3], [1, 1, 1, 1, 1], [2, 2, 4, 1, 3], [1, 1, 1, 1, 0], [2, 1, 1, 2, 2], [5, 5, 4, 5, 5], [5, 2, 1, 2, 5], [4, 1, 1, 3, 0], [1, 1, 1, 2, 2], [2, 2, 1, 2, 3]], "firmas": [{"dis": ["Atletismo", "Athletics"], "items": [{"n": ["Maratón / resistencia", "Marathon / Endurance"], "d": ["Mantenimiento del ritmo en carreras prolongadas sin acumular fatiga.", "Holding the pace over long runs without building up fatigue."]}, {"n": ["Salto imposible", "Impossible Leap"], "d": ["Superación de brechas verticales u horizontales límite.", "Clearing vertical or horizontal gaps at the very limit."]}, {"n": ["Escalada libre", "Free Climbing"], "d": ["Ascenso rápido por superficies verticales sin necesidad de arnés o equipo.", "Scaling vertical surfaces quickly, with no harness or gear."]}, {"n": ["Natación extrema", "Extreme Swimming"], "d": ["Desplazamiento y maniobra en aguas bravas, corrientes o bajo presión.", "Moving and manoeuvring through rough water, currents or under pressure."]}]}, {"dis": ["Acrobacia", "Acrobatics"], "items": [{"n": ["Caída controlada", "Controlled Fall"], "d": ["Absorción o disipación del impacto de caídas desde grandes alturas.", "Absorbing or dispersing the impact of falls from great heights."]}, {"n": ["Contorsionismo", "Contortionism"], "d": ["Paso del cuerpo por espacios extremadamente reducidos, o zafarse de ataduras.", "Squeezing through extremely tight spaces, or slipping out of bonds."]}, {"n": ["Equilibrio extremo", "Extreme Balance"], "d": ["Desplazamiento estable sobre repisas estrechas, cables o tendidos de alta tensión.", "Moving steadily along narrow ledges, cables or power lines."]}, {"n": ["Piruetas y fintas", "Flips and Feints"], "d": ["Maniobras aéreas para cambiar la orientación en combate o despistar al rival.", "Aerial moves to change facing in combat or wrong-foot an opponent."]}, {"n": ["Parkour urbano", "Urban Parkour"], "d": ["Fluidez para superar obstáculos arquitectónicos a máxima velocidad.", "Flowing over architectural obstacles at top speed."]}, {"n": ["Esquiva refleja", "Reflex Dodge"], "d": ["Movimientos de evasión lateral y cobertura rápida ante proyectiles o impactos.", "Sidesteps and snap cover against projectiles or impacts."]}]}, {"dis": ["Sigilo", "Stealth"], "items": [{"n": ["Camuflaje en sombras", "Shadow Cloak"], "d": ["Desplazamiento usando los puntos ciegos de iluminación y entorno.", "Moving through the blind spots of lighting and surroundings."]}, {"n": ["Movimiento silencioso", "Silent Movement"], "d": ["Insonorización de pasos sobre cualquier tipo de superficie (cristal, madera, metal).", "Muffling footsteps on any surface (glass, wood, metal)."]}, {"n": ["Mimetismo / cobertura", "Mimicry / Cover"], "d": ["Mantenerse inmóvil adaptando el contorno del cuerpo al entorno visual.", "Staying motionless, blending the body’s outline into the scenery."]}, {"n": ["Rastro cero", "Zero Trace"], "d": ["Desplazamiento sin dejar huellas, olores ni alteraciones en el entorno.", "Moving without leaving footprints, scents or any disturbance behind."]}, {"n": ["Infiltración en sombras", "Shadowing"], "d": ["Seguimiento y acecho a objetivos a corta distancia sin ser detectado.", "Tailing and stalking targets at close range without being spotted."]}]}, {"dis": ["Juego de manos", "Sleight of Hand"], "items": [{"n": ["Hurto sutil (pickpocket)", "Light Fingers (Pickpocket)"], "d": ["Robo o colocación de objetos en bolsillos o equipo ajeno sin que se entere.", "Lifting or planting objects in someone’s pockets or kit without them noticing."]}, {"n": ["Juego de naipes / trampas", "Card Tricks / Cheating"], "d": ["Manipulación física de dados, cartas u objetos pequeños de azar.", "Physically rigging dice, cards or other small games of chance."]}, {"n": ["Desarme rápido", "Quick Disarm"], "d": ["Inhabilitación o arrebato mecánico de armas al descuido.", "Mechanically disabling or snatching a weapon from an unwary foe."]}, {"n": ["Ocultamiento en cuerpo", "Body Concealment"], "d": ["Camuflaje de pequeñas herramientas, llaves o armas entre la ropa o la piel.", "Hiding small tools, keys or weapons in clothing or against the skin."]}]}, {"dis": ["Potencia", "Might"], "items": [{"n": ["Embestida / rompepuertas", "Battering Ram / Door Breaker"], "d": ["Fuerza bruta aplicada para derribar estructuras, barricadas o puertas.", "Brute force to bring down structures, barricades or doors."]}, {"n": ["Levantamiento pesado", "Heavy Lifting"], "d": ["Elevación y sostén de peso estático masivo (vigas, vehículos, escombros).", "Raising and holding massive static loads (beams, vehicles, rubble)."]}, {"n": ["Presión / agarre mortal", "Death Grip"], "d": ["Fuerza de apriete para inmovilizar, estrangular o romper presas.", "Crushing strength to pin, choke or break holds."]}, {"n": ["Lanzamiento de pesados", "Heavy Throw"], "d": ["Arrojar objetos pesados como proyectiles improvisados a distancia.", "Hurling heavy objects as improvised projectiles at range."]}, {"n": ["Proeza estructural", "Structural Feat"], "d": ["Sostener techos o pesos a punto de colapsar para dar tiempo a otros.", "Holding up ceilings or collapsing loads to buy others time."]}]}, {"dis": ["Entereza", "Fortitude"], "items": [{"n": ["Tolerancia al dolor", "Pain Tolerance"], "d": ["Ignorar penalizadores por heridas, dolor físico o tortura.", "Ignoring penalties from wounds, physical pain or torture."]}, {"n": ["Resistencia a toxinas", "Toxin Resistance"], "d": ["Filtrado metabólico ante venenos, drogas, gases o intoxicaciones.", "Metabolic filtering of poisons, drugs, gases or intoxicants."]}, {"n": ["Inmunidad térmica / ambiental", "Thermal / Environmental Immunity"], "d": ["Soportar temperaturas extremas (congelación/calor) o privación de aire.", "Withstanding extreme temperatures (freezing or heat) or lack of air."]}, {"n": ["Aguante cardio-pulmonar", "Cardio-Pulmonary Stamina"], "d": ["Sostener el esfuerzo físico con niveles mínimos de oxígeno (apnea).", "Sustaining physical effort on minimal oxygen (breath-holding)."]}, {"n": ["Estabilización rápida", "Rapid Stabilisation"], "d": ["Reducción de tiempos de sangrado y recuperación fisiológica tras trauma.", "Cutting bleeding time and speeding physiological recovery after trauma."]}, {"n": ["Bloqueo y absorción", "Block and Absorb"], "d": ["Posicionamiento del cuerpo para reducir el daño de impactos desarmados.", "Positioning the body to reduce damage from unarmed strikes."]}]}, {"dis": ["Pelea", "Brawling"], "items": [{"n": ["Proyecciones y llaves", "Throws and Locks"], "d": ["Uso de la fuerza del rival para derribos, proyecciones o llaves articulares.", "Using an opponent’s strength for takedowns, throws or joint locks."]}, {"n": ["Boxeo / golpes contundentes", "Boxing / Heavy Blows"], "d": ["Impactos directos (puños, codos) dirigidos a noquear o causar trauma.", "Direct strikes (fists, elbows) aimed to knock out or cause trauma."]}, {"n": ["Pelea callejera / sucia", "Street / Dirty Fighting"], "d": ["Uso del entorno, mordiscos, cabezazos y golpes a zonas blandas.", "Using the surroundings, biting, headbutts and blows to soft spots."]}, {"n": ["Sumisión táctica", "Tactical Submission"], "d": ["Agarres enfocados a dormir o neutralizar sin causar daño permanente.", "Holds meant to put someone to sleep or subdue them without lasting harm."]}]}, {"dis": ["Armas", "Weapons"], "items": [{"n": ["Hojas cortas / dagas", "Short Blades / Daggers"], "d": ["Manejo de cuchillos, dagas, katanas o armas blancas de ataque rápido.", "Wielding knives, daggers, katanas or other fast-striking blades."]}, {"n": ["Armas contundentes / pesadas", "Blunt / Heavy Weapons"], "d": ["Uso de mazas, martillos, mandobles, hachas y armas de gran inercia.", "Maces, hammers, greatswords, axes and other high-momentum pplies, sustenance or temporary shelter from outside reality."]}]}, {"dis": ["Encantamiento", "Enchantment"], "items": [{"n": ["Inscripción de runas / glifos", "Rune / Glyph Inscription"], "d": ["Grabar sellos en puertas o suelo que se activan como trampas o cierres.", "Carving seals on doors or floors that trigger as traps or locks."]}, {"n": ["Imbuir propiedades", "Imbue Properties"], "d": ["Otorgar temporalmente daño elemental o precisión aumentada a un arma o equipo.", "Temporarily lending elemental damage or heightened accuracy to a weapon or piece of kit."]}, {"n": ["Talismanes de salvaguarda", "Warding Talismans"], "d": ["Crear objetos portátiles que absorben un único impacto o maldición fatal.", "Making portable objects that soak up a single fatal blow or curse."]}, {"n": ["Forja de objetos místicos", "Forging Mystic Items"], "d": ["Vinculación permanente de un efecto mágico a un ítem mediante ritual.", "Permanently binding a magical effect to an item through ritual."]}, {"n": ["Sellado de zonas", "Zone Sealing"], "d": ["Inhabilitar el uso de magia, tecnología o poderes en un área delimitada.", "Shutting down magic, technology or powers within a defined area."]}]}, {"dis": ["Vínculos", "Bonds"], "items": [{"n": ["Pacto de sangre / lealtad", "Blood Pact / Loyalty"], "d": ["Crear un nexo indeleble con un aliado para compartir resistencia o comunicación.", "Forging an unbreakable link with an ally to share resilience or communication."]}, {"n": ["Transferencia de vitalidad", "Vitality Transfer"], "d": ["Drenar energía o vida de un objetivo para sanar a uno mismo o a un aliado.", "Draining energy or life from a target to heal yourself or an ally."]}, {"n": ["Maldición de daño compartido", "Shared Pain Curse"], "d": ["Vincular a dos enemigos para que el daño sufrido por uno lo sufra el otro.", "Linking two enemies so that damage suffered by one is suffered by the other."]}, {"n": ["Ancla psíquica / rastreo", "Psychic Anchor / Tracking"], "d": ["Marcar a un objeti
