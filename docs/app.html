<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOGUM App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>

:root{
  --ground:#e7ddcb; --paper:#f5efe3; --ink:#1c1814; --ink-2:#4a4237; --ink-3:#655c4e;
  --rule:#d4c7af; --rule-2:#e8ddc9; --side:#ede4d3;
  --red:#b8323a; --red-soft:#f0ded4; --blue:#2a56a0; --blue-soft:#e3e1dd;
  --amber:#8a5a00; --amber-soft:#ebe2cf; --violet:#5b3f99; --violet-soft:#e7dfdc;
  --drop:#8f2f36; --drop-soft:#ecded3; --ok:#2f6b45; --ok-soft:#e3e3d5;
  --c-pifia:#9b2a32; --c-fallo:#6b6288; --c-parcial:#b98a00; --c-exito:#2f63b5; --c-critico:#0f8f72;
  --shadow:0 1px 3px rgba(60,40,15,.14),0 10px 30px rgba(60,40,15,.11);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  /* lo que se lee lleva Ibarra; lo que es marca o tarjeta, Big Shoulders (T160) */
  --book:"Ibarra Real Nova",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#100e0c; --paper:#1c1916; --ink:#ede6d9; --ink-2:#c5bba9; --ink-3:#9b907e;
  --rule:#3b342b; --rule-2:#2c2721; --side:#151310;
  --red:#f07378; --red-soft:#402827; --blue:#86a9ec; --blue-soft:#2e313a;
  --amber:#e7b95a; --amber-soft:#3f3422; --violet:#b9a2ee; --violet-soft:#37303b;
  --drop:#f08a90; --drop-soft:#402c2b; --ok:#8fd1a6; --ok-soft:#30382e;
  --c-pifia:#e0666e; --c-fallo:#9a93ad; --c-parcial:#e0aa42; --c-exito:#86a9ec; --c-critico:#5cc3a0;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#100e0c; --paper:#1c1916; --ink:#ede6d9; --ink-2:#c5bba9; --ink-3:#9b907e;
  --rule:#3b342b; --rule-2:#2c2721; --side:#151310;
  --red:#f07378; --red-soft:#402827; --blue:#86a9ec; --blue-soft:#2e313a;
  --amber:#e7b95a; --amber-soft:#3f3422; --violet:#b9a2ee; --violet-soft:#37303b;
  --drop:#f08a90; --drop-soft:#402c2b; --ok:#8fd1a6; --ok-soft:#30382e;
  --c-pifia:#e0666e; --c-fallo:#9a93ad; --c-parcial:#e0aa42; --c-exito:#86a9ec; --c-critico:#5cc3a0;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.5 var(--serif);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding:10px 16px;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);min-height:60px}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.dice{display:flex;gap:4px}.dice i{width:18px;height:18px;border-radius:4px;background:var(--red);transform:rotate(-8deg);display:block}.dice i+i{background:var(--blue);transform:rotate(10deg)}
.brand b{font:800 26px/1 var(--display);letter-spacing:.06em}
.brand small{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:thin;align-items:center}
.tab{flex:none;border:1px solid var(--rule);background:var(--paper);border-radius:8px 8px 8px 8px;padding:9px 14px;font:600 13px/1 var(--mono);text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab.add{border-style:dashed}
.tab.aux{margin-left:auto}
.lang{display:flex;flex:none;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;padding:8px 11px;font:600 12px/1 var(--mono)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tool{flex:none;border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:9px 12px;font:600 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2)}
.tool:hover{color:var(--ink);border-color:var(--ink-3)}
.tool.primary{background:var(--red);border-color:var(--red);color:#fff}
.tool.on{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.tool:disabled{opacity:.4;cursor:default}
main{padding:18px 16px 60px}
.wrap{max-width:1500px;margin:0 auto}
.disclaimer{max-width:1500px;margin:0 auto 14px;font-size:14.5px;color:var(--ink-2);background:var(--paper);border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:8px;padding:10px 14px}
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px;align-items:start}
@media (max-width:1050px){.split{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:clamp(16px,2.4vw,26px)}
.formhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.formhead h2,.sheethead h2{font:800 30px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0}
.lockmsg{font:13px/1.4 var(--mono);color:var(--amber);background:var(--amber-soft);border-radius:8px;padding:8px 12px;margin:10px 0 4px}
fieldset.q{border:0;border-top:1px solid var(--rule-2);margin:0;padding:18px 0 12px}
fieldset.q:disabled{opacity:.55}
.q legend{padding:0;font:600 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:6px}
.q .ask{font:600 21px/1.3 var(--serif);margin:0 0 12px;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.opts.wide{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.opt{text-align:left;border:1.5px solid var(--rule);background:var(--ground);border-radius:10px;padding:11px 13px;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--ink-3)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.opt small{display:block;font:12px/1.35 var(--mono);opacity:.75;margin-top:3px}
.tech{margin:10px 0 0;font:12.5px/1.45 var(--mono);color:var(--ink-3)}
.tech b{color:var(--blue);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--rule);background:var(--ground);border-radius:999px;padding:6px 11px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
/* sheet */
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:clamp(16px,2.4vw,28px)}
.sheethead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--ink);padding-bottom:10px;margin-bottom:14px}
.sheethead .sub{font:600 12px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-top:4px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font:600 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em;padding:5px 8px;border-radius:999px;background:var(--rule-2)}
.badge.red{background:var(--red-soft);color:var(--red)}.badge.blue{background:var(--blue-soft);color:var(--blue)}.badge.amber{background:var(--amber-soft);color:var(--amber)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:14px}
.rbox{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--ground)}
.rbox h3{font:800 17px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0 0 6px}
.rbox dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:14px}
.rbox dt{font:600 10.5px/1.7 var(--mono);text-transform:uppercase;color:var(--ink-3)}
.rbox dd{margin:0}
.rbox p{margin:4px 0 0;font-size:14px}
.rbox.card{border-top:4px solid var(--red)}
.note{font:12.5px/1.45 var(--mono);color:var(--ink-3)}
.sec{font:800 19px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec .note{font-family:var(--mono);text-transform:none;letter-spacing:0}
/* tracks */
.tracks{display:grid;gap:8px}
.track{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center}
.track > span{font:600 11px/1.2 var(--mono);text-transform:uppercase;color:var(--ink-2)}
.blocks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.blk{border:2px solid var(--ink);border-radius:6px;padding:4px;display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-height:30px}
.blk .lbl{width:100%;font:600 10px/1 var(--mono);color:var(--ink-3);text-transform:uppercase}
.u{flex:1 1 0;min-width:10px;height:22px;border:1.5px solid var(--ink-2);border-radius:3px;background:var(--paper);padding:0;position:relative}
.u.full{background:var(--red);border-color:var(--red)}
.u.half{background:linear-gradient(135deg,var(--red) 50%,var(--paper) 50%)}
.u:disabled{cursor:default}
/* pyramid */
.amb{border:1px solid var(--rule);border-radius:10px;margin-bottom:10px;overflow:hidden}
.amb-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:var(--rule-2)}
.amb-h b{font:800 18px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;flex:1}
.base{font:600 12px/1 var(--mono);padding:5px 8px;border-radius:6px}
.base.neg{background:var(--red-soft);color:var(--red)}.base.zero{background:var(--ok-soft);color:var(--ok)}
.doms{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:700px){.doms{grid-template-columns:1fr}}
.dom{padding:8px 12px;border-top:1px solid var(--rule-2)}
.dom + .dom{border-left:1px solid var(--rule-2)}
.lvl{display:flex;align-items:center;gap:8px;padding:3px 0;flex-wrap:wrap}
.lvl .nm{flex:1;min-width:90px}
.lvl.d .nm{font-weight:600}
.lvl.s{padding-left:14px}
.lvl.f{padding-left:30px;font-size:14px}
.pip{border:1.5px solid var(--rule);background:var(--paper);border-radius:6px;padding:3px 8px;font:600 12px/1.2 var(--mono);min-width:40px}
.pip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pip:disabled{opacity:.35;cursor:default}
.mini{border:1px dashed var(--rule);background:none;border-radius:6px;padding:2px 8px;font:600 11px/1.3 var(--mono);color:var(--ink-3)}
select{border:1px solid var(--rule);border-radius:6px;background:var(--paper);padding:5px 8px;max-width:100%}
input[type=text],textarea{border:1px solid var(--rule);border-radius:8px;background:var(--paper);padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
.pts{font:800 22px/1 var(--display)}
.pts.over{color:var(--red)}
.stance{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stance button{border:2px solid var(--rule);background:var(--ground);border-radius:10px;padding:10px;font:800 18px/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.stance button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.gear{width:100%;border-collapse:collapse;font-size:14px}
.gear th,.gear td{text-align:left;border-bottom:1px solid var(--rule-2);padding:6px 6px;vertical-align:top}
.gear th{font:600 10.5px/1.3 var(--mono);text-transform:uppercase;color:var(--ink-3)}
.gear tr.out td{opacity:.45}
.tag{display:inline-block;font:600 11px/1.2 var(--mono);padding:2px 5px;border-radius:4px;background:var(--rule-2);border:1px solid var(--rule);margin:1px 0}
.addrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:700px){.fields{grid-template-columns:1fr}}
.fields label{display:block;font:600 11px/1 var(--mono);text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.create{margin-top:18px;display:flex;justify-content:center}
.create button{font:800 22px/1 var(--display);text-transform:uppercase;letter-spacing:.05em;padding:14px 28px;border-radius:12px;border:0;background:var(--red);color:#fff}
.blankpyr{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;font-size:13.5px}
.blankpyr div{border:1px solid var(--rule);border-radius:8px;padding:8px}
.blankpyr b{display:block;font:800 15px/1 var(--display);text-transform:uppercase;margin-bottom:4px}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-height:55vh;overflow:auto;margin:10px 0}
.msg{padding:10px 14px;border-radius:10px;max-width:86%;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--blue-soft)}.msg.ai{align-self:flex-start;background:var(--ground);border:1px solid var(--rule)}.msg.loc{align-self:flex-start;background:var(--amber-soft)}
.who{display:block;font:600 10.5px/1 var(--mono);text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font:600 11px/1 var(--mono);text-transform:uppercase;padding:6px 9px;border-radius:999px;background:var(--rule-2);color:var(--ink-3)}
.status.on{background:var(--ok-soft);color:var(--ok)}.status.off{background:var(--amber-soft);color:var(--amber)}
.timeline{list-style:none;margin:10px 0 0;padding:0 0 0 14px;border-left:2px solid var(--rule)}
.timeline li{margin-bottom:12px}
[hidden]{display:none!important}
@media (max-width:640px){.top{flex-wrap:wrap}.tabs{order:9;flex-basis:100%}.brand small{display:none}.track{grid-template-columns:1fr}}
@page{size:A4;margin:12mm}
@media print{
  :root{--paper:#fff;--ground:#fff;--ink:#161b24;--ink-2:#3b4250;--ink-3:#616978;--rule:#c9cfd8;--rule-2:#e7eaef;color-scheme:light}
  body{background:#fff;font-size:11pt}
  .top,.disclaimer,.noprint,#formPanel{display:none!important}
  main{padding:0}.split{display:block}
  .sheet{box-shadow:none;border:0;padding:0}
  .u.full,.base,.badge,.stance button[aria-pressed="true"],.rbox.card{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .amb,.rbox,.track{break-inside:avoid}
  select,input,textarea{border:0;background:none;appearance:none;-webkit-appearance:none;padding:0}
}

.tab.right{margin-left:auto}
/* wizard */
.wiz{max-width:860px;margin:0 auto}
.steps{display:flex;gap:6px;margin:0 0 16px;flex-wrap:wrap}
.steps span{flex:1 1 90px;font:600 10.5px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);border-top:4px solid var(--rule);padding-top:6px}
.steps span.done{border-color:var(--ink-2);color:var(--ink-2)}
.steps span.now{border-color:var(--red);color:var(--ink)}
.page{background:var(--paper);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);padding:clamp(20px,4vw,40px)}
.page .kick{font:600 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:0 0 12px}
.page .big{font:600 clamp(24px,3.4vw,32px)/1.25 var(--serif);margin:0 0 22px;text-wrap:balance}
.page .hint{font-size:15px;color:var(--ink-2);margin:-10px 0 18px}
.choices{display:grid;gap:10px}
.choice{display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:left;border:2px solid var(--rule);background:var(--ground);border-radius:12px;padding:14px 18px;font-size:18px;line-height:1.3}
.choice small{display:block;font:13px/1.35 var(--mono);color:var(--ink-3);margin-top:4px}
.choice:hover{border-color:var(--ink-3)}
.choice[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.choice[aria-pressed="true"] small{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.choice .mark{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid currentColor;opacity:.6}
.choice.multi .mark{border-radius:5px}
.choice[aria-pressed="true"] .mark{background:var(--red);border-color:var(--red);opacity:1}
.techline{margin:18px 0 0;padding-top:12px;border-top:1px dashed var(--rule);font:12.5px/1.5 var(--mono);color:var(--ink-3)}
.techline b{color:var(--blue)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.nav .btn{font:600 13px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em;border:1.5px solid var(--ink);background:var(--paper);border-radius:10px;padding:13px 18px}
.nav .btn.go{background:var(--ink);color:var(--paper)}
.nav .btn:disabled{opacity:.35;cursor:default}
.summary{width:100%;border-collapse:collapse;font-size:15px}
.summary td{border-bottom:1px solid var(--rule-2);padding:8px 6px;vertical-align:top}
.summary td:first-child{font:600 11px/1.5 var(--mono);text-transform:uppercase;color:var(--ink-3);width:34%}
.summary .tech{display:block;font:12px/1.4 var(--mono);color:var(--blue)}
.cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.cta .btn{font:800 20px/1 var(--display);text-transform:uppercase;letter-spacing:.05em;padding:14px 22px;border-radius:12px;border:2px solid var(--ink);background:var(--paper)}
.cta .btn.red{background:var(--red);border-color:var(--red);color:#fff}
/* reminders */
.remind{columns:2 300px;column-gap:14px}
.remind .rbox{break-inside:avoid;margin:0 0 12px}
.rbox table{width:100%;border-collapse:collapse;font-size:13.5px}
.rbox td{padding:2px 4px;vertical-align:top;border-bottom:1px solid var(--rule-2)}
.rbox td:first-child{font:600 12px/1.4 var(--mono);white-space:nowrap}
.rbox ul{margin:4px 0 0;padding-left:18px;font-size:13.5px}
.rbox li{margin:2px 0}
.lines{display:grid;gap:14px;margin:8px 0}
.line{border-bottom:1.5px solid var(--ink-3);height:26px;font:600 10.5px/1 var(--mono);text-transform:uppercase;color:var(--ink-3)}
.blankamb{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.blankamb div{border:1.5px solid var(--ink-2);border-radius:8px;padding:8px;min-height:120px;font-size:12.5px}
.blankamb b{display:block;font:800 16px/1 var(--display);text-transform:uppercase;margin-bottom:4px}
.gearblank td{height:26px}
/* pages & skill grid */
.sheetbar{display:flex;justify-content:flex-end;gap:8px;max-width:210mm;margin:0 auto 10px}
.a4{width:min(210mm,100%);min-height:297mm;margin:0 auto 18px;background:var(--paper);border:1px solid var(--rule);box-shadow:var(--shadow);padding:clamp(14px,3.5vw,13mm) clamp(14px,3.5vw,13mm) 18mm;position:relative}
.pgno{position:absolute;bottom:7mm;left:0;right:0;text-align:center;font:600 11px/1 var(--mono);color:var(--ink-3)}
.a4 .sec:first-child{margin-top:0}
/* un Ambito por fila: con dos, las Firmas no caben (los nombres y su select se pisan) */
.skillgrid{display:grid;grid-template-columns:1fr;gap:8px}
.acard{border:1.5px solid var(--ink-3);border-radius:10px;overflow:hidden;break-inside:avoid}
.acard.null{border-style:dashed;border-color:var(--red)}
.acard-h{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--rule-2)}
.acard-h b{font:800 17px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;flex:1}
.best{font:600 11px/1 var(--mono);color:var(--ink-2)}
.power{display:flex;align-items:center;gap:6px;padding:5px 10px;border-bottom:1px solid var(--rule-2);flex-wrap:wrap}
.power .seg{display:flex;gap:2px}
.power .seg button{width:20px;height:12px;border:1px solid var(--ink-3);background:var(--paper);border-radius:2px;padding:0}

/* el altavoz de cada tarjeta */
.tcellwrap{position:relative}
.mustog{position:absolute;top:6px;right:6px;z-index:2;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);font-size:10px;line-height:1;cursor:pointer;padding:0}
.mustog:hover{border-color:var(--red)}
.mustog.on{background:var(--red);border-color:var(--red);color:#fff}
.mustog.vacio{opacity:.45}
.musglobo{position:absolute;z-index:5;top:36px;right:4px;max-width:210px;background:var(--ink);color:var(--paper);border-radius:10px;padding:8px 10px;font:12px/1.35 var(--mono);box-shadow:var(--shadow)}
.musglobo .mini{margin-top:6px;display:inline-block;background:var(--paper);color:var(--ink);border-color:var(--paper)}
.musica .kick{margin:0 0 2px}
.tag.parca{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dcol.torpe .nm{opacity:.72}
.srow .bonus.neg{color:var(--red);font-weight:600}
.fitem .sem.parca,.cuenta .parca{color:var(--red);font-weight:600}
.eqbuscar{margin:0 0 12px}
.eqbuscar input{width:100%;box-sizing:border-box;font:18px/1.3 var(--serif);padding:13px 16px;border:2px solid var(--rule);border-radius:12px;background:var(--paper);color:var(--ink)}
.eqbuscar input:focus{outline:none;border-color:var(--red)}
.eqbuscar input::placeholder{color:var(--ink-3)}
.eqvacio{margin:0;padding:18px 4px;font-size:14.5px;line-height:1.5;color:var(--ink-3);text-align:center}
.eqcuantos{margin:0 0 8px;font:11.5px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
/* la vineta y la barra de acuerdo */
.vign{font:600 clamp(19px,2.6vw,25px)/1.4 var(--serif);margin:0 0 22px;text-wrap:balance}
.desliza{border:1px solid var(--rule);border-radius:12px;padding:14px 16px 10px;background:var(--ground)}
.despolos{display:flex;justify-content:space-between;gap:12px;font:600 11.5px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);margin-bottom:10px}
.despolos span:last-child{text-align:right}
.desliza input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;display:block}
.desliza input[type=range]:focus{outline:2px solid var(--blue);outline-offset:3px}
.desliza input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:999px;background:linear-gradient(90deg,var(--rule),var(--ink-3),var(--rule))}
.desliza input[type=range]::-moz-range-track{height:8px;border-radius:999px;background:linear-gradient(90deg,var(--rule),var(--ink-3),var(--rule))}
.desliza input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:var(--red);border:3px solid var(--paper);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.desliza input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--red);border:3px solid var(--paper);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.desliza input[type=range].sin::-webkit-slider-thumb{background:var(--ink-3)}
.desliza input[type=range].sin::-moz-range-thumb{background:var(--ink-3)}
.desval{margin:8px 0 0;text-align:center;font:600 17px/1.3 var(--serif);color:var(--ink)}
.desval.sin{font:12.5px/1.5 var(--mono);color:var(--ink-3);font-weight:400}
/* el repartidor */
.hubedi{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--rule);border-radius:10px;padding:9px 12px;margin:12px 0}
.hubedi>span:first-child{font:600 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.hubedi .note{font:11.5px/1.4 var(--mono);color:var(--ink-3);flex:1 1 200px}
.hubedi .tool.on{border-color:var(--red);background:var(--red);color:#fff}
.summary .chg{width:1%;white-space:nowrap}
/* la lectura del modelo */
.aiask{margin-top:16px;padding-top:12px;border-top:1px dashed var(--rule);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.aiask .note{font:11.5px/1.4 var(--mono);color:var(--ink-3);flex:1 1 220px}
.iawait{font:600 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--red)}
.iabox{margin-top:10px;min-height:1.6em;border-left:3px solid var(--red);padding:6px 0 6px 12px;font-size:15.5px;line-height:1.55;white-space:pre-wrap}

.fold{font:600 9.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--red);background:var(--red-soft);border-radius:999px;padding:2px 6px;margin-left:5px}
.fold.big{margin-left:auto}

/* el indicador de IA es un boton: lleva a la Configuracion */
button.status{border:0;cursor:pointer}
/* la configuracion */
.cfg{max-width:860px;margin:0 auto}
.cfgsec{margin-top:18px;padding-top:14px;border-top:1px solid var(--rule)}
.cfgsec:first-of-type{border-top:0;padding-top:4px}
.cfgest{font:13px/1.45 var(--mono);color:var(--ink-2);margin:0 0 8px}
.cfgok{font:13px/1.45 var(--mono);color:var(--ok);background:var(--ok-soft);border-radius:8px;padding:8px 12px;margin:0 0 10px}
.cfgmsg{font:13px/1.45 var(--mono);color:var(--ok);margin:6px 0 0}
.cfgmsg.bad{color:var(--red)}
.cfgchk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-2);margin:2px 0 10px}
.cfg input[type=password]{flex:1 1 260px;min-width:0;font:13.5px/1.3 var(--mono);padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
.cfgpriv{margin-top:12px;font-size:13.5px;line-height:1.5;color:var(--ink-2);background:var(--blue-soft);border-radius:8px;padding:10px 14px}
.cfgpriv p{margin:0}
.cfgpriv a{color:inherit;font-weight:600}
.cfg .rbf select{width:auto;min-width:min(330px,100%);max-width:100%}
/* el modelo es un campo libre dentro de una columna: sin esto, la base flexible de .rbcode input lo estira hacia abajo */
.cfg .rbf input{flex:none;width:min(330px,100%);box-sizing:border-box}
.cfgjson{width:100%;min-height:90px;margin-top:8px;font:12px/1.4 var(--mono)}
/* la bienvenida: la imagen de la App mientras la mesa esta vacia */
.bienvenida{position:relative;max-width:1500px;margin:0 auto 14px;border-radius:12px;overflow:hidden;background:#1c1814}
.bienvenida img{display:block;width:100%;height:clamp(170px,28vw,340px);object-fit:cover;object-position:50% 40%}
.bienvenida figcaption{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:baseline;gap:12px;padding:40px 18px 14px;
  background:linear-gradient(rgba(12,10,8,0),rgba(12,10,8,.85));color:#f5efe3}
.bienvenida span{font:600 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.14em;opacity:.8}
.srow.folded .nm{font-weight:600}
</style>
</head>

ound is the dodge, at −2. Tally: The Reaper of level 3, Limited to damage: 2 Keys ( 5.6 ). Hitting the ground is the dodge the Reaper lets you attempt ( 4.2 ), and putting it at −2 makes defence harder: Dodge: Hard, 2 points."], "c": "arma"}]}, {"n": ["Protección y utilidad", "Protection and utility"], "items": [{"n": ["Escudo de torre", "Tower Shield"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["0", "0"], "p": ["1", "1"], "k": ["0", "0"], "x": ["Permite intentar absorber ataques con Esq: Nula (como las flechas). La cuenta: Lo que no se esquiva se absorbe si el arma lo deja ( 6.2 ), y contra los proyectiles el escudo es esa armadura: se tasa como el escudo de las piezas sueltas , 1 punto.", "Lets you try to soak attacks with Dodge: None (such as arrows). Tally: What cannot be dodged is soaked if the weapon allows it ( 6.2 ), and against projectiles the shield is that armour: it is priced like the shield in the loose parts , 1 point."], "c": "defensa"}, {"n": ["Cota de malla", "Chainmail"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["0", "0"], "p": ["1", "1"], "k": ["0", "0"], "x": ["Absorbe hasta 1 punto de daño de armas de filo. El tope de la etiqueta Abs del arma atacante sigue mandando. La cuenta: Absorber 1 punto es un bono: 1 punto.", "Soaks up to 1 point of damage from bladed weapons. The cap on the attacking weapon’s Soak tag still rules. Tally: Soaking 1 point is a bonus: 1 point."], "c": "defensa"}, {"n": ["Placas completas", "Full Plate"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["0", "0"], "p": ["2", "2"], "k": ["0", "0"], "x": ["Absorben hasta 2 puntos de daño físico; −2 a esquivar. La cuenta: Absorber 2 puntos, 2 puntos; el −2 a esquivar es lo que la armadura es, y no descuenta.", "Soaks up to 2 points of physical damage; −2 to dodge. Tally: Soaking 2 points, 2 points; the −2 to dodge is what the armour is, and is no discount."], "c": "defensa"}, {"n": ["Capa de desplazamiento", "Cloak of Displacement"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["1", "1"], "p": ["2", "2"], "k": ["0", "0"], "x": ["Quien te ataca tira con Peor de 2d10 (se queda el dado bajo). Defensa mágica. Encaja tal cual en el motor canónico (lectura Peor). La cuenta: Peor de 2d10 para quien te ataca vale como un −2 a su tirada: 2 puntos.", "Anyone attacking you rolls with Worst of 2d10 (keeps the low die). Magical defence. Fits the canonical engine as is (Worst reading). Tally: Worst of 2d10 for whoever attacks you counts as a −2 to their roll: 2 points."], "c": "artefacto"}, {"n": ["Anillo de invisibilidad", "Ring of Invisibility"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["0", "0"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Eres invisible mientras lo llevas; tu primer ataque suele ser sorpresa ( Esq: Nula ). La cuenta: Permiso, 1 Llave aunque el Acceso sea 0; Limitado (hay que llevarlo puesto), y a una Llave eso no la abarata. El golpe por sorpresa sale de que no te ven: va dentro.", "You are invisible while you wear it; your first attack is usually a surprise ( Dodge: None ). Tally: Permit, 1 Key even if the Access is 0; Limited (you have to be wearing it), and at one Key that does not make it cheaper. The surprise blow comes from not being seen: it is included."], "c": "artefacto"}, {"n": ["Botas de levitación", "Boots of Levitation"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["0", "0"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Ignoras el terreno difícil y las caídas. La cuenta: Permiso, 1 Llave aunque el Acceso sea 0.", "You ignore difficult terrain and falls. Tally: Permit, 1 Key even if the Access is 0."], "c": "artefacto"}, {"n": ["Gema de luz", "Light Gem"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["0", "0"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Ilumina como el día y ciega a las criaturas de la oscuridad. La cuenta: Iluminar es Acceso; cegar a las criaturas de la oscuridad es un permiso: 1 Llave.", "Shines like daylight and blinds creatures of darkness. Tally: Giving light is Access; blinding creatures of darkness is a permit: 1 Key."], "c": "artefacto"}, {"n": ["Poción de piel de piedra", "Stoneskin Potion"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["0", "0"], "p": ["0", "0"], "k": ["0", "0"], "x": ["Tu absorción cuenta como Abs: Total contra los 3 primeros ataques físicos que recibas. La cuenta: De un solo uso: no se paga ( 5.4 ).", "Your soak counts as Soak: Full against the first 3 physical attacks you take. Tally: Single use: not paid for ( 5.4 )."], "c": "defensa"}, {"n": ["Pergamino de vuelo", "Scroll of Flight"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["0", "0"], "p": ["0", "0"], "k": ["0", "0"], "x": ["Movimiento en tres dimensiones durante una escena. La cuenta: De un solo uso: no se paga ( 5.4 ).", "Three-dimensional movement for one scene. Tally: Single use: not paid for ( 5.4 )."], "c": "util"}, {"n": ["Amuleto anti-detección", "Anti-Detection Amulet"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["0", "0"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Los magos no te detectan. La cuenta: Permiso, 1 Llave.", "Wizards cannot detect you. Tally: Permit, 1 Key."], "c": "artefacto"}]}]}, {"id": "neon", "n": ["2. La Ciudad de Neón", "2. The City of Neon"], "blocks": [{"n": ["Armas de fuego", "Firearms"], "items": [{"n": ["Pistola ligera (9 mm)", "Light Pistol (9 mm)"], "d": ["Daño 1", "Damage 1"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Total", "Soak: Full"], "m": ["0", "0"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Rejilla: Estándar La cuenta: Arma de fuego: a nivel 1 no se esquiva, y eso es una Llave ( 5.6 ).", "Grid: Standard Tally: Firearm: at level 1 it cannot be dodged, and that is a Key ( 5.6 )."], "c": "arma"}, {"n": ["Pistola pesada (.44 Magnum)", "Heavy Pistol (.44 Magnum)"], "d": ["Daño 2", "Damage 2"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Máx 1", "Soak: Max 1"], "m": ["1", "1"], "p": ["1", "1"], "k": ["1", "1"], "x": ["Te rompe las costillas aunque lleves chaleco. La cuenta: Arma de fuego: a nivel 1 no se esquiva, y eso es una Llave ( 5.6 ). Abs: Máx 1, 1 punto.", "Breaks your ribs even through a vest. Tally: Firearm: at level 1 it cannot be dodged, and that is a Key ( 5.6 ). Soak: Max 1, 1 point."], "c": "arma"}, {"n": ["Subfusil (SMG)", "Submachine Gun (SMG)"], "d": ["Daño 1", "Damage 1"], "e": ["Esq: Nula (ráfaga)", "Dodge: None (burst)"], "a": ["Abs: Total", "Soak: Full"], "m": ["0", "0"], "p": ["0", "0"], "k": ["1", "1"], "x": ["La ráfaga es color. La cuenta: Arma de fuego: a nivel 1 no se esquiva, y eso es una Llave ( 5.6 ).", "The burst is colour. Tally: Firearm: at level 1 it cannot be dodged, and that is a Key ( 5.6 )."], "c": "arma"}, {"n": ["Escopeta (cartucho)", "Shotgun (Shells)"], "d": ["Daño 2", "Damage 2"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Máx 1", "Soak: Max 1"], "m": ["2", "2"], "p": ["1", "1"], "k": ["1", "1"], "x": ["A quemarropa. La dispersión (Esq: Parcial) solo cuenta contra quien sí puede esquivar una bala. La cuenta: Arma de fuego: a nivel 1 no se esquiva, y eso es una Llave ( 5.6 ). Abs: Máx 1, 1 punto.", "Point-blank. The spread (Dodge: Partial) only counts against someone who can actually dodge a bullet. Tally: Firearm: at level 1 it cannot be dodged, and that is a Key ( 5.6 ). Soak: Max 1, 1 point."], "c": "arma"}, {"n": ["Rifle de asalto", "Assault Rifle"], "d": ["Daño 2", "Damage 2"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Máx 1", "Soak: Max 1"], "m": ["1", "1"], "p": ["1", "1"], "k": ["1", "1"], "x": ["Alcance medio o largo. La cuenta: Arma de fuego: a nivel 1 no se esquiva, y eso es una Llave ( 5.6 ). Abs: Máx 1, 1 punto.", "Medium or long range. Tally: Firearm: at level 1 it cannot be dodged, and that is a Key ( 5.6 ). Soak: Max 1, 1 point."], "c": "arma"}, {"n": ["Rifle de francotirador (antimaterial)", "Sniper Rifle (Anti-Materiel)"], "d": ["Daño 2", "Damage 2"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Nula", "Soak: None"], "m": ["3", "3"], "p": ["0", "0"], "k": ["2", "2"], "x": ["Supersónico: si oyes el disparo, ya te ha dado. Atraviesa paredes y blindajes personales. Es el ejemplo canónico de arma inevitable ( 6.3 ). La cuenta: No se esquiva ni se absorbe: dos defensas anuladas a tu nivel ( 4.2 ), 1 Llave cada una, 2 Llaves.", "Supersonic: if you hear the shot, it has already hit you. Goes through walls and personal armour. It is the canonical example of an inevitable weapon ( 6.3 ). Tally: It cannot be dodged or soaked: two defences cancelled at your level ( 4.2 ), 1 Key each, 2 Keys."], "c": "arma"}, {"n": ["Lanzagranadas", "Grenade Launcher"], "d": ["La Parca · Rejilla 2", "The Reaper · Grid 2"], "e": ["Esq: Difícil (−2)", "Dodge: Hard (−2)"], "a": ["Abs: Nula", "Soak: None"], "m": ["2", "2"], "p": ["2", "2"], "k": ["1", "1"], "x": ["De área; la onda expansiva ignora las coberturas. La cuenta: La granada es daño de nivel 2 ( 4.8 ): La Parca · Rejilla 2, Limitada al daño, que a un nivel cuesta lo mismo que la completa: 1 Llave ( 5.6 ). Esquivarla se puede, pero es difícil: Esq: Difícil, 2 puntos. Las granadas sueltas son de un uso y no se pagan; el lanzador, sí.", "Area effect; the blast wave ignores cover. Tally: The grenade is level 2 damage ( 4.8 ): The Reaper · Grid 2, Limited to damage, which at one level costs the same as the Complete one: 1 Key ( 5.6 ). It can be dodged, but it is hard: Dodge: Hard, 2 points. Loose grenades are single use and not paid for; the launcher is."], "c": "arma"}, {"n": ["Cañón de riel (railgun)", "Railgun"], "d": ["La Parca · Rejilla 3", "The Reaper · Grid 3"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Nula", "Soak: None"], "m": ["3", "3"], "p": ["0", "0"], "k": ["3", "3"], "x": ["Rejilla: Nivel 3 Daña tanques y estructuras, y el tanque es nivel 3 ( 4.8 ). La cuenta: La Parca de nivel 3, Limitada al daño: 2 Llaves ( 5.6 ); y no se esquiva, 1 más: 3 Llaves.", "Grid: Level 3 Damages tanks and structures, and the tank is level 3 ( 4.8 ). Tally: The Reaper of level 3, Limited to damage: 2 Keys ( 5.6 ); and it cannot be dodged, 1 more: 3 Keys."], "c": "arma"}, {"n": ["Pistola inteligente (smart)", "Smart Pistol"], "d": ["Daño 1", "Damage 1"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Total", "Soak: Full"], "m": ["1", "1"], "p": ["1", "1"], "k": ["1", "1"], "x": ["Balas teledirigidas: no se esquivan, solo se paran con blindaje. La cuenta: No se esquiva, como toda pistola: 1 Llave. La mira automática, +1 a dar, 1 punto ( 5.6 ).", "Guided bullets: they cannot be dodged, only stopped by armour. Tally: It cannot be dodged, like any pistol: 1 Key. The automatic sight, +1 to hit, 1 point ( 5.6 )."], "c": "arma"}, {"n": ["Táser / arma de choque", "Taser / Shock Weapon"], "d": ["Daño 1 (aturdimiento)", "Damage 1 (stun)"], "e": ["Esq: Total", "Dodge: Full"], "a": ["Abs: Nula (Metal)", "Soak: None (Metal)"], "m": ["0", "0"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Valor fuera de la leyenda. Contra quien lleva armadura metálica o ciberimplantes, Abs: Nula y el daño se duplica; en los demás casos se lee como Abs: Total. La cuenta: Contra el metal anula la absorción: una Llave Limitada, que a un nivel cuesta 1 ( 4.3 ).", "Value outside the legend. Against someone with metal armour or cyberware, Soak: None and the damage doubles; otherwise read it as Soak: Full. Tally: Against metal it cancels soak: a Limited Key, which at one level costs 1 ( 4.3 )."], "c": "arma"}]}, {"n": ["Cuerpo a cuerpo (alta tecnología)", "Melee (high tech)"], "items": [{"n": ["Cuchillo de combate", "Combat Knife"], "d": ["Daño 1", "Damage 1"], "e": ["Esq: Total", "Dodge: Full"], "a": ["Abs: Total", "Soak: Full"], "m": ["0", "0"], "p": ["0", "0"], "k": ["0", "0"], "x": ["—", "—"], "c": "arma"}, {"n": ["Katana monofilo", "Monowire Katana"], "d": ["Daño 2", "Damage 2"], "e": ["Esq: Total", "Dodge: Full"], "a": ["Abs: Nula", "Soak: None"], "m": ["1", "1"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Corta a nivel molecular: ignora el kevlar y las placas cerámicas. La cuenta: Abs: Nula: anula la armadura, 1 Llave ( 4.2 ).", "Cuts at a molecular level: ignores Kevlar and ceramic plates. Tally: Soak: None: it cancels armour, 1 Key ( 4.2 )."], "c": "arma"}, {"n": ["Martillo cohete", "Rocket Hammer"], "d": ["Daño 2", "Damage 2"], "e": ["Esq: Fácil (+2)", "Dodge: Easy (+2)"], "a": ["Abs: Máx 1", "Soak: Max 1"], "m": ["2", "2"], "p": ["1", "1"], "k": ["0", "0"], "x": ["Lento pero devastador. La cuenta: Abs: Máx 1, 1 punto. Lo fácil de esquivar no descuenta.", "Slow but devastating. Tally: Soak: Max 1, 1 point. Being easy to dodge is no discount."], "c": "arma"}, {"n": ["Garras mantis", "Arm Blades"], "d": ["Daño 2", "Damage 2"], "e": ["Esq: Total", "Dodge: Full"], "a": ["Abs: Total", "Soak: Full"], "m": ["1", "1"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Ocultas: el primer ataque es sorpresa (ese golpe se lee como Esq: Nula). La cuenta: Ocultas: el primer golpe no se esquiva, una Llave Limitada que a un nivel cuesta 1.", "Concealed: the first attack is a surprise (that blow reads as Dodge: None). Tally: Concealed: the first blow cannot be dodged, a Limited Key that at one level costs 1."], "c": "arma"}, {"n": ["Nanocable (látigo)", "Nanowire (Whip)"], "d": ["Daño 2", "Damage 2"], "e": ["Esq: Difícil (−2)", "Dodge: Hard (−2)"], "a": ["Abs: Nula", "Soak: None"], "m": ["1", "1"], "p": ["2", "2"], "k": ["1", "1"], "x": ["Corta extremidades. Alcance medio. La cuenta: Esq: Difícil, 2 puntos; Abs: Nula, 1 Llave.", "Severs limbs. Medium range. Tally: Dodge: Hard, 2 points; Soak: None, 1 Key."], "c": "arma"}]}, {"n": ["Tecnología y gadgets", "Tech and gadgets"], "items": [{"n": ["Chaleco Kevlar", "Kevlar Vest"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["0", "0"], "p": ["1", "1"], "k": ["0", "0"], "x": ["Absorbe 1 punto de daño balístico. Inútil contra el monofilo. La cuenta: Absorber 1 punto, 1 punto.", "Soaks 1 point of ballistic damage. Useless against monowire. Tally: Soaking 1 point, 1 point."] uenta: El pergamino es de un uso y no se paga; la técnica que enseña se paga aparte, como cualquier otra ( 5.4 ).", "Teaches a Level 4 technique in exchange for permanent damage. “Permanent damage” is read as a consequence that only another arc can heal ( 6.6 ). Tally: The scroll is single use and not paid for; the technique it teaches is paid for separately, like any other ( 5.4 )."], "c": "artefacto"}, {"n": ["Abanico de las tres tormentas", "Fan of the Three Storms"], "d": ["Daño 2 (área)", "Damage 2 (area)"], "e": ["Esq: Parcial", "Dodge: Partial"], "a": ["Abs: Total", "Soak: Full"], "m": ["1", "1"], "p": ["1", "1"], "k": ["1", "1"], "x": ["Crea tornados. La cuenta: Mandar en el viento es un permiso, 1 Llave; Esq: Parcial, 1 punto.", "Creates tornadoes. Tally: Commanding the wind is a permit, 1 Key; Dodge: Partial, 1 point."], "c": "arma"}, {"n": ["Radar de reliquias", "Relic Radar"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["0", "0"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Localiza objetos de trama (Llaves). La cuenta: Permiso, 1 Llave.", "Locates plot items (Keys). Tally: Permit, 1 Key."], "c": "artefacto"}, {"n": ["Armadura del guerrero de otro planeta", "The Armour of the Warrior from Another Planet"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["0", "0"], "p": ["1", "1"], "k": ["0", "0"], "x": ["Elástica: absorbe hasta 1 punto ( Abs: Máx 1 ). No se rompe al transformarte. La cuenta: Absorber 1 punto, 1 punto.", "Stretchy: soaks up to 1 point ( Soak: Max 1 ). It does not tear when you transform. Tally: Soaking 1 point, 1 point."], "c": "defensa"}, {"n": ["Agua sagrada", "Sacred Water"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["0", "0"], "p": ["0", "0"], "k": ["0", "0"], "x": ["Convierte una habilidad de +2 en +4, pero beberla causa Daño 2. La cuenta: De un solo uso: no se paga ( 5.4 ).", "Turns a +2 skill into +4, but drinking it deals Damage 2. Tally: Single use: not paid for ( 5.4 )."], "c": "artefacto"}]}]},  ( 3.6 ); if it is bought, it is worth 5 Keys ( 5.3 )."], "c": "artefacto"}, {"n": ["Cristal de la piedra de su propio mundo", "Crystal of the Stone from His Own World"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["—", "—"], "p": ["0", "0"], "k": ["8", "8"], "x": ["Llave: debilidad Anula los poderes del héroe invulnerable y baja su nivel de Rejilla a 1. Es el ejemplo clásico de Llave ( 4.1 ). Si la ficción te lo presta, no se paga ( 4.4 ). Si es tuyo para siempre, es una Llave Limitada a un solo ser, del tamaño de lo que le quita: de 5 a 1, cuatro niveles, 16 ÷ 2 = 8 Llaves.", "Key: weakness Cancels the invulnerable hero’s powers and drops their Grid level to 1. It is the classic example of a Key ( 4.1 ). If the fiction lends it to you, it is not paid for ( 4.4 ). If it is yours for good, it is a Key Limited to a single being, the size of what it takes away: from 5 to 1, four levels, 16 ÷ 2 = 8 Keys."], "c": "artefacto"}, {"n": ["Casco místico", "Mystic Helmet"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["—", "—"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Inmune a la telepatía. Inmunidad: permiso, 1 Llave.", "Immune to telepathy. Immunity: a permit, 1 Key."], "c": "defensa"}, {"n": ["Martillo digno", "Worthy Hammer"], "d": ["Daño 2", "Damage 2"], "e": ["Esq: Total", "Dodge: Full"], "a": ["Abs: Nula", "Soak: None"], "m": ["—", "—"], "p": ["0", "0"], "k": ["5", "5"], "x": ["Rejilla: Nivel 4 Solo lo levanta quien el Director decida. Vuelve a la mano. La cuenta: una Llave de Armas a nivel 4, Limitada al daño: 9, la mitad al alza, 5. Como en la Parca, la Abs: Nula va dentro: no se cobra dos veces.", "Grid: Level 4 Only whoever the GM decides can lift it. It returns to your hand. Tally: a Weapons Key at level 4, Limited to damage: 9, half rounded up, 5. As with the Reaper, the Soak: None comes included: nothing is charged twice."], "c": "arma"}, {"n": ["Gema primordial (una sola)", "Primordial Gem (just one)"], "d": ["La Parca · Rejilla 6", "The Reaper · Grid 6"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Nula", "Soak: None"], "m": ["—", "—"], "p": ["0", "0"], "k": ["14", "14"], "x": ["Usarla te causa Daño 2. El daño de un arma llega a 2, y lo que pasa de ahí es la Parca con su nivel ( 4.5 ). Esta es cósmica, nivel 6 ( 3.7 ): casi siempre fuera del alcance de los jugadores, y antes un argumento que un objeto. Si se compra, cinco niveles por encima de un portador de nivel 1: 25, Limitada al daño, 13; y que no se esquive, 1 más.", "Using it deals Damage 2 to you. A weapon’s damage goes up to 2, and anything beyond that is the Reaper with its level ( 4.5 ). This one is cosmic, level 6 ( 3.7 ): almost always out of the players’ reach, and a plot before it is an object. If it is bought, five levels above a level 1 bearer: 25, Limited to damage, 13; and being undodgeable, 1 more."], "c": "arma"}, {"n": ["Manto que levita", "Levitating Mantle"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["—", "—"], "p": ["1", "1"], "k": ["1", "1"], "x": ["Tiene personalidad propia y te defiende sola. Levitar es un permiso (1 Llave); que te defienda sola, +1 a defender (1 punto).", "It has a mind of its own and defends you by itself. Levitating is a permit (1 Key); defending you by itself, +1 to defend (1 point)."], "c": "artefacto"}, {"n": ["Reactor de pecho", "Chest Reactor"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["—", "—"], "p": ["0", "0"], "k": ["0", "0"], "x": ["Fuente de energía inagotable. Por sí solo no hace nada en la ficha: alimenta lo que lleves, y eso se paga aparte.", "Inexhaustible power source. On its own it does nothing on the sheet: it powers whatever you carry, and that is paid for separately."], "c": "util"}, {"n": ["Simbionte alienígena", "Alien Symbiote"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["—", "—"], "p": ["0", "0"], "k": ["1+", "1+"], "x": ["Da poderes físicos, a cambio de Daño Mental constante (corrupción). Lo que cuesten los poderes que te dé, cada uno según la cuenta ( 5.4 ): al menos 1 Llave. La corrupción puede justificar el Limitado si la mesa la juega en serio ( 5.5 ).", "Grants physical powers in exchange for constant Mental Damage (corruption). It costs whatever the powers it gives you cost, each by the tally ( 5.4 ): at least 1 Key. The corruption can justify Limited if the table plays it seriously ( 5.5 )."], "c": "artefacto"}]}]}, {"id": "steampunk", "n": ["9. El Oeste Extraño", "9. The Weird West"], "blocks": [{"n": ["Armas de pólvora y vapor", "Gunpowder and steam weapons"], "items": [{"n": ["Revólver «Pacificador» (.45)", "“Peacemaker” Revolver (.45)"], "d": ["Daño 2", "Damage 2"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Máx 1", "Soak: Max 1"], "m": ["1", "1"], "p": ["1", "1"], "k": ["1", "1"], "x": ["6 balas. Como toda arma de fuego, a nivel 1 no se esquiva: no dificulta la esquiva, la anula, y eso es 1 Llave ( 5.6 ). El Abs: Máx 1, un punto.", "6 bullets. Like every firearm, it cannot be dodged at level 1: it does not make dodging harder, it cancels it, and that is 1 Key ( 5.6 ). The Soak: Max 1, one point."], "c": "arma"}, {"n": ["Rifle Winchester", "Winchester Rifle"], "d": ["Daño 2", "Damage 2"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Total", "Soak: Full"], "m": ["1", "1"], "p": ["0", "0"], "k": ["1", "1"], "x": ["De palanca. Alcance largo. Arma de fuego: 1 Llave.", "Lever-action. Long range. Firearm: 1 Key."], "c": "arma"}, {"n": ["Escopeta de dos cañones", "Double-Barrelled Shotgun"], "d": ["Daño 2", "Damage 2"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Total", "Soak: Full"], "m": ["2", "2"], "p": ["0", "0"], "k": ["1", "1"], "x": ["A quemarropa. En el yermo la llaman «la Recortada». Arma de fuego: 1 Llave.", "Point-blank. In the wasteland they call it “the Sawn-Off”. Firearm: 1 Key."], "c": "arma"}, {"n": ["Gatling de vapor (portátil)", "Steam Gatling (portable)"], "d": ["La Parca · Rejilla 2", "The Reaper · Grid 2"], "e": ["Esq: Difícil (−2, área)", "Dodge: Hard (−2, area)"], "a": ["Abs: Máx 1", "Soak: Max 1"], "m": ["2", "2"], "p": ["3", "3"], "k": ["1", "1"], "x": ["Nube de plomo. Tarda 1 turno en girar el cañón. Parca 2, Limitada al daño: 1 Llave ( 5.6 ); la Esq: Difícil y el Abs: Máx 1, 3 puntos.", "A cloud of lead. Takes 1 turn to spin up the barrel. Reaper 2, Limited to damage: 1 Key ( 5.6 ); the Dodge: Hard and the Soak: Max 1, 3 points."], "c": "arma"}, {"n": ["Rifle Tesla (voltaico)", "Tesla Rifle (Voltaic)"], "d": ["Daño 2", "Damage 2"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Nula (Metal)", "Soak: None (Metal)"], "m": ["2", "2"], "p": ["0", "0"], "k": ["2", "2"], "x": ["Arco eléctrico que salta entre objetivos metálicos. Valor fuera de la leyenda: contra objetivos con metal, Abs: Nula; sin metal, se lee como Abs: Total. Esq: Nula, 1 Llave; la armadura anulada contra metal, otra, que por ser Limitada no baja de 1.", "Electric arc that jumps between metal targets. Off-legend value: against targets carrying metal, Soak: None; without metal, it is read as Soak: Full. Dodge: None, 1 Key; armour cancelled against metal, another, which, being Limited, does not drop below 1."], "c": "arma"}, {"n": ["Pistola de clavos a presión", "Pneumatic Nail Gun"], "d": ["Daño 1", "Damage 1"], "e": ["Esq: Total", "Dodge: Full"], "a": ["Abs: Total", "Soak: Full"], "m": ["0", "0"], "p": ["0", "0"], "k": ["0", "0"], "x": ["Silenciosa.", "Silent."], "c": "arma"}, {"n": ["Cañón de mano", "Hand Cannon"], "d": ["Daño 2", "Damage 2"], "e": ["Esq: Fácil (+2)", "Dodge: Easy (+2)"], "a": ["Abs: Máx 1", "Soak: Max 1"], "m": ["2", "2"], "p": ["1", "1"], "k": ["0", "0"], "x": ["Un solo tiro. Puede romperte la muñeca. El punto paga el Abs: Máx 1.", "A single shot. It can break your wrist. The point pays for the Soak: Max 1."], "c": "arma"}, {"n": ["Cuchillo Bowie", "Bowie Knife"], "d": ["Daño 1", "Damage 1"], "e": ["Esq: Total", "Dodge: Full"], "a": ["Abs: Total", "Soak: Full"], "m": ["0", "0"], "p": ["0", "0"], "k": ["0", "0"], "x": ["—", "—" ints ( 5.4 )."], "c": "artefacto"}, {"n": ["Amuleto de chamán", "Shaman's Amulet"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["1", "1"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Abs: Total contra ataques espirituales. Defenderte de lo espiritual, que sin él no se puede: 1 Llave.", "Soak: Full against spiritual attacks. Defending yourself from the spiritual, which cannot be done without it: 1 Key."], "c": "artefacto"}, {"n": ["Bala bendita", "Blessed Bullet"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["0", "0"], "p": ["0", "0"], "k": ["0", "0"], "x": ["Llave: demonios Contra demonios, el daño pasa a Abs: Nula y cuenta como agravado. Valor fuera de la leyenda: es una Llave narrativa contra una criatura. Cada bala es de un solo uso: no se paga.", "Key: demons Against demons, the damage becomes Soak: None and counts as aggravated. Off-legend value: it is a narrative Key against a creature. Each bullet is single use: it is not paid for."], "c": "artefacto"}, {"n": ["Elixir de aceite de serpiente", "Snake Oil Elixir"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["0", "0"], "p": ["0", "0"], "k": ["0", "0"], "x": ["Cura o envenena (50 %). De un solo uso: no se paga ( 5.4 ).", "Heals or poisons (50%). Single use: it is not paid for ( 5.4 )."], "c": "artefacto"}, {"n": ["Mano del hombre muerto", "Dead Man's Hand"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["0", "0"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Si el personaje sale de la historia con ella en el bolsillo, vuelve como Resucitado (un zombi inteligente) . Volver es un permiso: 1 Llave. Quién sale de la historia, y cómo, se pacta ( 0.7 ).", "If the character leaves the story with it in their pocket, they come back Risen (an intelligent zombie) . Coming back is a permit: 1 Key. Who leaves the story, and how, is agreed at the table ( 0.7 )."], "c": "artefacto"}, {"n": ["Lazo espiritual", "Spirit Lasso"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["0", "0"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Atrapa fantasmas. Tocar lo intangible: permiso, 1 Llave.", "Catches ghosts. Touching the intangible: a permit, 1 Key."], "c": "artefacto"}, {"n": ["Tótem animal", "Animal Totem"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["0", "0"], "p": ["1", "1"], "k": ["0", "0"], "x": ["Te da una habilidad animal a +2 de forma temporal. Un +2 que no siempre está: Limitado, 1 punto.", "Temporarily grants you an animal ability at +2. A +2 that is not always there: Limited, 1 point."], "c": "artefacto"}, {"n": ["Reloj de bolsillo hipnótico", "Hypnotic Pocket Watch"], "d": ["Daño Mental 1", "Mental Damage 1"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Voluntad", "Soak: Will"], "m": ["1", "1"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Efecto: aturde Esq: Nula, 1 Llave.", "Effect: stuns Dodge: None, 1 Key."], "c": "arma"}, {"n": ["Escopeta exorcista", "Exorcist Shotgun"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["0", "0"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Con inscripciones sagradas: repele a los demonios. Repeler demonios es un permiso: 1 Llave. Si además disparas con ella, usa la ficha de la escopeta de dos cañones y suma su Llave.", "Engraved with holy inscriptions: it repels demons. Repelling demons is a permit: 1 Key. If you also shoot with it, use the stats of the double-barrelled shotgun and add its Key."], "c": "artefacto"}]}]}, {"id": "toon", "n": ["10. El Mundo Animado", "10. The Animated World"], "blocks": [{"n": ["Armas de tienda de bromas", "Joke-shop weapons"], "items": [{"n": ["El yunque (caída)", "The Anvil (Falling)"], "d": ["La Parca · Rejilla 2", "The Reaper · Grid 2"], "e": ["Esq: Fácil (+2)", "Dodge: Easy (+2)"], "a": ["Abs: Nula", "Soak: None"], "m": ["2", "2"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Te deja como un acordeón (consecuencia: Plano). Parca 2, Limitada al daño: 1 Llave ( 5.6 ).", "Squashes you like an accordion (consequence: Flat). Reaper 2, Limited to damage: 1 Key ( 5.6 )."], "c": "arma"}, {"n": ["Mazo gigante de madera", "Giant Wooden Mallet"], "d": ["Daño 2", "Damage 2"], "e": ["Esq: Total", "Dodge: Full"], "a": ["Abs: Total", "Soak: Full"], "m": ["1", "1"], "p": ["0", "0"], "k": ["0", "0"], "x": ["Chichones instantáneos.", "Instant bumps on the head."], "c": "arma"}, {"n": ["Dinamita con mecha larga", "Long-Fuse Dynamite"], "d": ["La Parca · Rejilla 2", "The Reaper · Grid 2"], "e": ["Esq: Difícil (−2)", "Dodge: Hard (−2)"], "a": ["Abs: Nula", "Soak: None"], "m": ["2", "2"], "p": ["0", "0"], "k": ["0", "0"], "x": ["Siempre explota justo cuando vas a mirar por qué no ha explotado. De un solo uso: no se paga. Si siempre te queda otra en el bolsillo, 1 Llave.", "It goes off just as you go to check why it hasn’t gone off. Single use: it is not paid for. If there is always another one in your pocket, 1 Key."], "c": "arma"}, {"n": ["Guante de boxeo con muelle", "Spring-Loaded Boxing Glove"], "d": ["Daño 1", "Damage 1"], "e": ["Esq: Sorpresa", "Dodge: Surprise"], "a": ["Abs: Máx 1", "Soak: Max 1"], "m": ["0", "0"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Sale de cajas pequeñas y empuja 10 m. Valor fuera de la leyenda: si pilla al objetivo desprevenido, se lee como Esq: Nula; si ya lo conoce, como Esq: Total. Inesquivable cuando pilla desprevenido: 1 Llave, que por ser Limitada no baja de 1.", "Pops out of small boxes and pushes 10 m. Off-legend value: if it catches the target unawares, it is read as Dodge: None; if the target already knows about it, as Dodge: Full. Undodgeable when it catches them unawares: 1 Key, which, being Limited, does not drop below 1."], "c": "arma"}, {"n": ["Tarta en la cara", "Pie in the Face"], "d": ["Daño 0", "Damage 0"], "e": ["Esq: Total", "Dodge: Full"], "a": ["Abs: Nula", "Soak: None"], "m": ["0", "0"], "p": ["0", "0"], "k": ["0", "0"], "x": ["Efecto: Ceguera + Humillación Daña la dignidad. La humillación iría a la barra Mental. De un solo uso: no se paga ( 5.4 ).", "Effect: Blindness + Humiliation Damages your dignity. The humiliation would go to the Mental bar. Single use: it is not paid for ( 5.4 )."], "c": "arma"}, {"n": ["Escopeta anudada", "Knotted Shotgun"], "d": ["Daño de retorno", "Backfire Damage"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Nula", "Soak: None"], "m": ["1", "1"], "p": ["0", "0"], "k": ["0", "0"], "x": ["Si disparas, el tiro te da a ti. Valor fuera de la leyenda: el daño del arma se lo lleva quien dispara. No cuesta nada: quien sale perdiendo es quien la usa.", "If you fire, the shot hits you. Off-legend value: the shooter takes the weapon’s damage. It costs nothing: the one who loses out is whoever uses it."], "c": "arma"}, {"n": ["Bomba redonda negra", "Round Black Bomb"], "d": ["La Parca · Rejilla 2", "The Reaper · Grid 2"], "e": ["Esq: Difícil (−2)", "Dodge: Hard (−2)"], "a": ["Abs: Máx 1", "Soak: Max 1"], "m": ["2", "2"], "p": ["0", "0"], "k": ["0", "0"], "x": ["Te deja la cara negra y el pelo hacia atrás. De un solo uso: no se paga ( 5.4 ).", "Leaves your face blackened and your hair blown back. Single use: it is not paid for ( 5.4 )."], "c": "arma"}, {"n": ["Sierra de suelo", "Floor Saw"], "d": ["Daño: Caída", "Damage: Fall"], "e": ["Esq: Difícil (−2)", "Dodge: Hard (−2)"], "a": ["Abs: Nula", "Soak: None"], "m": ["0", "0"], "p": ["2", "2"], "k": ["2", "2"], "x": ["Recortas un círculo alrededor del enemigo, que cae al vacío. Valor fuera de la leyenda: el daño es el de la caída según la altura (1 o 2, o la Parca si es alta de verdad, 6.3 ). La cuenta: recortar el suelo es un permiso (1 Llave) y que la armadura no sirva, otra (1); la Esq: Difícil, 2 puntos.", "You cut a circle around the enemy, who drops into the void. Off-legend value: the damage is falling damage by height (1 or 2, or the Reaper if it is really high, 6.3 ). Tally: cutting the floor out is a permit (1 Key) and armour being no use is another (1); the Dodge: Hard, 2 points."], "c": "arma"}, {"n": ["Cohete a la espalda", "Rocket on Your Back"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["0", "0"], "p": ["0", "0"], "k": ["0", "0"], "x": ["Vas muy rápido y sin controlar la dirección: las tiradas para dirigirlo usan la tarjeta Comedia negra (caos alto) . Se quema en un viaje: de un solo uso, no se paga.", "You go very fast with no control over direction: rolls to steer it use the Black Comedy card (high chaos) . It burns out in one trip: single use, not paid for."], "c": "util"}, {"n": ["Túnel pintado", "Painted Tunnel"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["0", "0"], "p": ["0", "0"], "k": ["0", "0"], "x": ["Efecto: Muro Tú pasas; tu perseguidor se estampa contra la pared. Un túnel ya pintado es de un solo uso. Pintar los que quieras es La pintura de túnel, más abajo.", "Effect: Wall You go through; your pursuer slams into the wall. A tunnel that is already painted is single use. Painting as many as you like is Tunnel Paint, further down."], "c": "util"}, {"n": ["El yunque oportuno", "The Timely Anvil"], "d": ["La Parca · Rejilla 2", "The Reaper · Grid 2"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Nula", "Soak: None"], "m": ["0", "0"], "p": ["0", "0"], "k": ["2", "2"], "x": ["Cae desde arriba cuando hace gracia. No se esquiva porque no estaba ahí hasta que lo miraste. Parca 2, Limitada al daño: 1 Llave ( 5.6 ); que no se esquive, otra.", "It falls from above whenever it is funny. It cannot be dodged because it was not there until you looked. Reaper 2, Limited to damage: 1 Key ( 5.6 ); being undodgeable, another."], "c": "arma"}, {"n": ["La sartén", "The Frying Pan"], "d": ["Daño 1", "Damage 1"], "e": ["Esq: Total", "Dodge: Full"], "a": ["Abs: Nula", "Soak: None"], "m": ["0", "0"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Suena como una campana y deja la cara marcada en el metal. La armadura no sirve: el ruido es el daño. Abs: Nula: 1 Llave.", "It rings like a bell and leaves the face printed on the metal. Armour does not help: the sound is the damage. Soak: None: 1 Key."], "c": "arma"}, {"n": ["El mazo de feria", "The Fairground Mallet"], "d": ["Daño 2", "Damage 2"], "e": ["Esq: Fácil (+2)", "Dodge: Easy (+2)"], "a": ["Abs: Máx 1", "Soak: Max 1"], "m": ["0", "0"], "p": ["1", "1"], "k": ["0", "0"], "x": ["Enorme, lento y con un silbido que lo anuncia. Te aplana; a la escena siguiente ya estás bien. El punto paga el Abs: Máx 1.", "Huge, slow and with a whistle that announces it. It flattens you; by the next scene you are fine. The point pays for the Soak: Max 1."], "c": "arma"}, {"n": ["La caja de cerillas infinita", "The Infinite Matchbox"], "d": ["Daño 1 (fuego)", "Damage 1 (fire)"], "e": ["Esq: Parcial", "Dodge: Partial"], "a": ["Abs: Nula", "Soak: None"], "m": ["0", "0"], "p": ["1", "1"], "k": ["2", "2"], "x": ["Nunca se acaba, y de ella sale todo lo que quepa en una caja de cerillas, que es sorprendentemente mucho. Como nunca se acaba, es permanente: sacar de ella lo que quepa es un permiso (1 Llave), el Abs: Nula otra (1), y la Esq: Parcial, 1 punto.", "It never runs out, and out of it comes anything that fits in a matchbox, which is surprisingly a lot. Since it never runs out, it is permanent: taking out whatever fits is a permit (1 Key), the Soak: None is another (1), and the Dodge: Partial, 1 point."], "c": "arma"}, {"n": ["El imán gigante", "The Giant Magnet"], "d": ["Daño 2", "Damage 2"], "e": ["Esq: Difícil (−2)", "Dodge: Hard (−2)"], "a": ["Abs: Nula (Metal)", "Soak: None (Metal)"], "m": ["1", "1"], "p": ["2", "2"], "k": ["2", "2"], "x": ["Atrae todo el metal de la escena, incluidas las armas de tus amigos y las muelas de todo el mundo. Atraer todo el metal es un permiso (1 Llave) y la armadura anulada contra metal, otra (1); la Esq: Difícil, 2 puntos.", "It attracts every piece of metal in the scene, including your friends’ weapons and everybody’s fillings. Attracting all the metal is a permit (1 Key) and armour cancelled against metal, another (1); the Dodge: Hard, 2 points."], "c": "arma"}, {"n": ["La pintura de túnel", "Tunnel Paint"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["2", "2"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Pintas un túnel en una pared y es un túnel. Solo funciona para quien lo pintó: los demás se dan contra el muro. Permiso: 1 Llave.", "You paint a tunnel on a wall and it is a tunnel. It only works for whoever painted it: everybody else hits the wall. Permit: 1 Key."], "c": "artefacto"}]}, {"n": ["Poderes toon", "Cartoon powers"], "items": [{"n": ["Espacio en los bolsillos", "Hammerspace Pockets"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["—", "—"], "p": ["0", "0"], "k": ["2", "2"], "x": ["Sacas cualquier objeto que tenga gracia en la escena. Permiso, Potenciado: cualquier objeto, cuando quieras.", "You pull out any item that would be funny in the scene. Permit, Enhanced: any item, whenever you like."], "c": "artefacto"}, {"n": ["Disfraz instantáneo", "Instant Disguise"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["—", "—"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Te disfrazas de mujer o de abuela en 1 segundo, y quien sea de nivel 1 no tiene tirada para verte el truco. Es una Llave de Engaño a nivel 2: 1 Llave ( 4.1 ).", "You disguise yourself as a woman or a granny in 1 second, and anyone at level 1 gets no roll to see through the trick. It is a Deception Key at level 2: 1 Key ( 4.1 )."], "c": "artefacto"}, {"n": ["Cuerpo de goma", "Rubber Body"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["—", "—"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Inmunidad: contundente Las balas rebotan y los golpes te estiran. Una Llave de Entereza contra golpes y balas, Limitada: a un nivel, 1.", "Immunity: blunt Bullets bounce off and blows stretch you. A Fortitude Key against blows and bullets, Limited: at one level, 1."], "c": "artefacto"}, {"n": ["Regeneración de escena", "Scene Regeneration"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["—", "—"], "p": ["0", "0"], "k": ["1", "1"], "x": ["En la escena siguiente estás curado y limpio. La barra ya vuelve sola cuando estáis a salvo ( 6.4 ); esto cura también las consecuencias: permiso, 1 Llave.", "In the next scene you are healed and spotless. The bar already comes back by itself once you are safe ( 6.4 ); this also heals the consequences: a permit, 1 Key."], "c": "artefacto"}, {"n": ["Salir del plano", "Step Out of Frame"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["—", "—"], "p": ["0", "0"], "k": ["3", "3"], "x": ["Te sales de la película y borras al enemigo con una goma. Permiso Desatado (×3). Si borra a cualquiera, sea del nivel que sea, ya no es un permiso: es una Parca, y se paga con su nivel ( 4.5 ).", "You step out of the film and rub the enemy out with an eraser. Unleashed permit (×3). If it rubs out anyone, whatever their level, it is no longer a permit: it is a Reaper, and it is paid for with its level ( 4.5 )."], "c": "artefacto"}, {"n": ["Inmortalidad cómica", "Comic Immortality"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["—", "—"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Inmortalidad No sales de la historia: si quedas fuera de combate, te salen alas y tocas el arpa un rato, y luego vuelves . En el Mundo Animado suele venir con el tono: si es de toda la mesa, es lo pactado en la sesión 0 ( 0.7 ) y no se paga. Si es solo tuya, 1 Llave.", "Immortality You do not leave the story: if you are taken out of the fight, you sprout wings and play the harp for a while, then come back . In the Animated World it usually comes with the tone: if it applies to the whole table, it is what was agreed in session zero ( 0.7 ) and it is not paid for. If it is yours alone, 1 Key."], "c": "artefacto"}, {"n": ["Ojos saltones", "Bulging Eyes"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["—", "—"], "p": ["1", "1"], "k": ["0", "0"], "x": ["Bonificador a Percepción al ver a una chica guapa. «Percepción» se lee como la disciplina Alerta. Un +1 que solo sale a veces: Limitado, y el mínimo es 1 punto.", "Bonus to Perception when you see a pretty girl. “Perception” is read as the Alertness discipline. A +1 that only shows up sometimes: Limited, and the minimum is 1 point."], "c": "artefacto"}, {"n": ["Bajar la cremallera", "Unzip Yourself"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["—", "—"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Te quitas el «disfraz» de personaje y eres otro. Permiso: 1 Llave.", "You take off your character “costume” and turn out to be someone else. Permit: 1 Key."], "c": "artefacto"}, {"n": ["Cartel de «Socorro»", "“Help!” Sign"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["—", "—"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Acción gratuita para comunicarte con el público. Permiso: 1 Llave.", "Free action to communicate with the audience. Permit: 1 Key."], "c": "artefacto"}, {"n": ["El agujero portátil", "The Portable Hole"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["—", "—"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Permiso: llevas un agujero doblado en el bolsillo y lo pones donde quieras. Una vez colocado, es un agujero de verdad.", "Permit: you carry a hole folded in your pocket and put it wherever you like. Once placed, it is a real hole."], "c": "artefacto"}, {"n": ["La caída diferida", "The Delayed Fall"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["—", "—"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Permiso: no caes hasta que miras abajo. Si nadie te lo recuerda, puedes cruzar un cañón andando.", "Permit: you do not fall until you look down. If nobody reminds you, you can walk across a canyon."], "c": "artefacto"}, {"n": ["El disfraz fino", "The Thin Disguise"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["—", "—"], "p": ["0", "0"], "k": ["1", "1"], "x": ["Permiso: un bigote postizo te hace irreconocible para cualquiera, incluida tu madre y quien te esté persiguiendo.", "Permit: a fake moustache makes you unrecognisable to anyone, including your mother and whoever is chasing you."], "c": "artefacto"}, {"n": ["Los patines cohete", "The Rocket Skates"], "d": ["Daño 2 (al chocar)", "Damage 2 (on impact)"], "e": ["Esq: Nula", "Dodge: None"], "a": ["Abs: Máx 1", "Soak: Max 1"], "m": ["—", "—"], "p": ["1", "1"], "k": ["1", "1"], "x": ["Permiso: velocidad absurda. La dirección no viene incluida, y el daño te lo llevas tú tan a menudo como el otro. La cuenta: la velocidad es un permiso y el choque inesquivable, otro (2 Llaves), y el Abs: Máx 1, un punto; pero como el daño te lo llevas tú tan a menudo como el otro, Limitado: 1 Llave y 1 punto.", "Permit: absurd speed. Steering is not included, and you take the damage as often as the other one does. Tally: the speed is a permit and the undodgeable crash another (2 Keys), and the Soak: Max 1, a point; but since you take the damage as often as the other one does, Limited: 1 Key and 1 point."], "c": "arma"}, {"n": ["El segundo de más", "The Extra Second"], "d": ["—", "—"], "e": ["—", "—"], "a": ["—", "—"], "m": ["—", "—"], "p": ["0", "0"], "k": ["2", "2"], "x": ["Permiso: una acción extra por escena, hecha en el instante que hay entre que te caes y que tocas el suelo. Como el Instante robado de las piezas sueltas: permiso, Potenciado.", "Permit: one extra action per scene, taken in the moment between falling and hitting the ground. Like the Stolen instant in the loose parts: a permit, Enhanced."], "c": "artefacto"}]}]}, {"id": "social", "n": ["El Duelo Social (intriga cortesana)", "The Social Duel (court intrigue)"], "blocks": [{"n": ["Arsenal social", "Social arsenal"], "items": [{"n": ["El rumor sutil", "The Subtle Rumour"], "d": ["Daño Social 1", "Social Damage 1"], "e": ["Esq: Total", "Dodge: Full"], "a": ["Abs: Total", "Soak: Full"], "m": ["—", "—"], "p": ["0", "0"], "k": ["0", "0"], "x": ["Funciona como una daga: la buena reputación lo absorbe y la astucia lo desvía.", "Works like a dagger: a good reputation soaks it and cunning deflects it."], "c": "arma"}, {"n": ["El
