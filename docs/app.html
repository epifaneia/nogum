on encendido**, que es el peor fallo posible porque parece que la funcion\nesta rota. Ahora el fundido va con `setInterval` y, pase lo que pase, un\n`setTimeout` final garantiza el volumen de destino y el callback.\n\nRegla general para este codigo: **nada que deba terminar puede depender de\nrequestAnimationFrame.** Para animar, vale; para llegar a un estado, no.\n\n## T144 · La Tesis se convierte en La Apuesta\n\n«Una tesis de 50 paginas, con viajes intelectuales, citas pedantes y mucho\ntexto, RESTA, para dejarse conocer.»\n\nDe acuerdo con el diagnostico, no con la conclusion de borrarla. El porque de\nuna regla sirve en el sitio de la regla, y el viaje del disenador le interesa al\ndisenador. Pero el documento corto **no es para jugadores: es para quien decide\nsi NOGUM se conoce** —resenistas, podcasteros, el que se plantea escribir un\nsuplemento—. Esa gente no se lee 150 paginas para decidir si el sistema es\ninteresante, y la gente construye encima de cosas cuya postura de diseno\nentiende. Es el documento que recluta, y sin el baja el techo del unico arreglo\nrealista a la peor carencia del pack (no hay terceros).\n\nAsi que no se borra: se reescribe entera como **La Apuesta** (ES) / **The\nWager** (EN). Doce paginas en vez de un tratado. El subtitulo dice el trato:\n«Que pregunta responde NOGUM, con que reglas la responde, y a que ha renunciado\npara responderla.»\n\nEstructura: las preguntas → la emocion como pilar → el rigor (las\ncurvas, el recuento exacto, el eje del caos que no cambia cuanto sale sino de\nque esta hecho) → la modularidad → **las reglas que obedecen a la\napuesta, una a una** (pifia antes del bono, el Ancla, la escalera con el Torpe y\nla Firma a +4, la vida fractal, el +2 y la Parca, el x100, la Regla del Estilo,\nlas tres monedas, el Baul; fuera las posturas y todo lo que no tenga vinculo\nclaro) → contra las listas infinitas, rescatadas por la app → el\nAcelerado → **a que hemos renunciado**.\n\nEsa ultima seccion es nueva y es deliberada: una apuesta que solo cuenta lo que\ngana es un anuncio. Dice sin rodeos que no hay inflacion, que no hay simulacion\nfina, que algunos tonos frustran a proposito, que la mesa tiene que hablar antes\nde jugar y que **no hay biblioteca detras**.\n\n## T145 · El Agobio del Acelerado no es la oscuridad del completo\n\nEl autor pregunto si hay tonos pesimistas en el Acelerado, sospechando que\ntanto insistir en que son residuales los dejaba fuera.\n\n**No estan fuera: Agobio es el modo que mas mapa ocupa** —toda la fila de\noptimismo bajo mas la casilla de optimismo normal con mucho caos, cuatro de\nnueve—. Pero el hallazgo es otro: **Agobio no es Angustia ni Pesadilla**. Es\n«peor de dos» **con exito con coste**, y esa combinacion no existe en el\nCuadrante. El taller la habia descartado por escrito para la fila opresiva: «el\ncaos entra por la pifia, no por el coste».\n\nMedido con `curvas.py`, tiradas en las que el DJ tiene que inventarse algo\n(pifia + coste):\n\n| bono | Agobio (Acelerado) | Pesadilla | Angustia |\n|---|---|---|---|\n| -2 | 27 % | 19 % | 1 % |\n| +0 | 35 % | 19 % | 1 % |\n| +2 | 43 % | 19 % | 1 % |\n| +4 | 51 % | 19 % | 1 % |\n\nEl modo oscuro del manual **de entrada** es el mas exigente de los dos\nproductos, y empeora segun mejoran los personajes, que es al reves de lo que\ndeberia hacer un producto de entrada.\n\nNo es incoherencia: el Acelerado solo tiene una herramienta de caos y la aparca\nen Agobio, que asi hace doble turno —el propio texto lo dice—. Es la\nunica solucion con tres modos. Pero **la factura no estaba en ninguna pagina**.\nLa Apuesta ya la declara. **Pendiente de decision del autor:** anadir el aviso\ntambien al Acelerado, o estrechar su banda de coste al total exacto de 6 en vez\nde 6-7, que la parte por la mitad.\n\n## T146 · El Acelerado pasa a cuatro modos\n\nEl autor, despues de T145: «Neutro, solo el rojo, 9 de vida. Optimista, mejor\nde ambos, 9. Caos, PbA, mira solo un dado. Terror, Neutro + 3 de vida. Metemos\nla vida corta solo ahi, y 4 tonos super diferenciados.»\n\n| modo | dado | pifia | critico | coste | vida |\n|---|---|---|---|---|---|\n| Optimista | el mayor de los dos | doble 1 | un 10 en cualquiera | no | 9 |\n| Neutro | solo el rojo | 1 | 10 | no | 9 |\n| Caos | solo el rojo | 1 o 2 | 9 o 10 | si (total 6-7) | 9 |\n| Terror | solo el rojo | 1 | 10 | no | **3** |\n\n**Fuera el Agobio.** Era «peor de dos + coste», la combinacion que el Cuadrante\nhabia descartado por escrito, y cargaba al DJ con un 35-51 % de tiradas que\ninventar (T145). Ahora:\n\n- **Caos y Neutro sacan adelante exactamente lo mismo**: 50 % a bono 0, 70 % a\n  +2. Es el eje del caos del manual completo demostrado dentro del manual de\n  entrada: no cambia cuanto sale, cambia de que esta hecho. Comprobado en el\n  motor de la app con 600 tiradas: 20/30/18/10/22 frente al 20/30/20/10/20\n  teorico.\n- **La carga del DJ deja de empeorar con la campana.** Es plana en los cuatro\n  modos: 1 %, 10 %, 40 %, 10 %, de -2 a +4.\n- **Los cuatro modos son configuraciones legales del manual completo:**\n  Optimista = Epica, Neutro = Primera marcha, Caos = Comedia negra, Terror =\n  Primera marcha con vida Letal. El Agobio no era ninguna. Graduarse deja de ser\n  aprender otro juego: ya conoces cuatro de las siete tarjetas.\n\n**La oscuridad viene de la vida, no de la tirada.** En Terror aciertas igual de\na menudo que en Neutro; lo que cambia es que dos impactos serios te sacan. El\nautor rechazo expresamente convertir el 3 en un interruptor: «el interruptor\nmata la tesis del acelerado como papilla. Con el 3 anclado al terror, el jugador\nse ASOMA al cambio de vida, sin tener que frotarse la cabeza con diales y cuando\nactivarlos». Va anclado al modo, y es la unica pieza del Acelerado que deja ver\nla vida fractal sin operarla.\n\nLo que se pierde y se dice: **desaparece el «peor de dos»**, y con el la\nsensacion de que el mundo va a por ti. Terror da miedo, no opresion. Para eso\nesta el completo.\n\nTocado: `frag_acelerado` (cruce, tabla de tirada, exito parcial, vida, combate,\nEstilo, hoja de referencia, ED-A1, ED-15, nota editorial) en los dos idiomas,\n`app4_body` (ACC, accBase, ACCSET, zoomK anclado al modo, rejilla de escena,\nmusica, selector de la barra), `make_covers`, `assemble3` y la seccion 7 de La\nApuesta, que ya no lleva la advertencia del Agobio porque el motivo ha\ndesaparecido.\n\n## T147 · La Apuesta, reescrita en prosa\n\nPrimera lectura del autor, demoledora y con razon: «No me gusta. Falta\nverbosidad. Falta explicar que es el tono, partiendo de la EMOCION, no soltarlo\na pelo en la mesa. Las preguntas son siempre la misma.»\n\nEl problema de fondo: la version anterior **habia heredado el tono esquematico\nde la Tesis** —vinetas por todas partes— cuando una carta de presentacion\ntiene que leerse como un ensayo. Reescrita entera: **76 parrafos y cero listas**.\n\nEstructura nueva, dictada por el autor:\n\n1. **De que va esto.** Universal de universos y **tambien de emociones**. Define\n   el tono partiendo de la emocion, no al reves: el mismo salto de tres metros\n   produce euforia, tension o pavor, y **eso no lo decide el genero, lo decide\n   el reglamento**. De ahi, la tesis ludico-narrativa. Y cierra con **el feliz\n   accidente**, citado literal del manual (T7): no solo por campana, sino por\n   sesion, por escena e incluso por personaje. El autor: «Frase literal del\n   manual, no importa repetir. Es clave.»\n2. **La mesa de mezclas.** Los diales —optimismo, caos, vida— presentados\n   antes de hablar de girarlos. El orden anterior estaba invertido.\n3. **El rigor**, que ahora cae solo despues de los diales.\n4. **Modular de verdad.**\n5. **Las estrategias, agrupadas** y menos detalladas: «como imprimir miedo o\n   euforia» (los dados en general **mas la letalidad dentro**), «como\n   administrar el caos», «por que la estadistica nunca se rompe» (el Ancla, y\n   de ahi **la malla**, explicada como concepto y sin el x100) y «el ritmo al\n   que crece la gente». Fuera la Parca, el Estilo y las tres monedas: «este no\n   es el lugar».\n6. Las listas infinitas y la app. 7. El Acelerado.\n8. **Cuatro piezas, una cosa**: el final nuevo. Que hace cada pata —por que,\n   como, ya, contigo— y por que juntas son algo inedito: el libro guarda\n   todo, la app decide que ves hoy, el Acelerado te deja sentirlo antes de leer\n   nada y esta carta cuenta por que.\n\n**Dos capitulos eliminados enteros**, por decision del autor y con buen\nargumento:\n\n- **«A que hemos renunciado» sobra.** «Minusvalora el resto, y esta mejor cada\n  uno de sus puntos explicado en positivo.» El Ancla ya se explica como lo que\n  impide que la estadistica se rompa; no hace falta venderla en negativo como\n  «no veras crecer numeros sin techo».\n- **«Una pregunta, no un producto cerrado» sobra.** «Si es un producto cerrado.\n  Esto era con la TESIS, no con la presentacion.» Y «por que no lleva\n  ilustraciones» tambien fuera de aqui: es un detalle y suena a *excusatio non\n  petita*. Sigue en su sitio dentro del manual completo.\n\n## T148 · La puerta de entrada, el autor, y un enlace roto en todo el pack\n\nTres cosas de la lectura del autor, y una cuarta que aparecio al comprobarlas.\n\n**La puerta de entrada.** La carta terminaba en «Bienvenido al experimento», que\nes buen cierre de tesis y mal cierre de presentacion: no decia al lector que\nhacer. Ahora, justo antes: «Bien. Ya estas listo. Puedes jugar al Acelerado esta\nmisma tarde: quince paginas y una app que te lleva de la mano.»\n\n**El autor aparece.** Al cortar el capitulo 9 se fue con el la unica linea que\nponia a alguien detras del libro. Vuelve, en el capitulo 1 y pegada a la\nincomodidad: «este manual es la respuesta a anos de incomodidad como disenador y\ncomo narrador, dirigiendo partidas en las que el sistema y la historia tiraban\nen direcciones distintas y sabiendo que no era culpa de nadie en la mesa».\n\n**La promesa del rigor, recuperada sin traerla aqui.** El capitulo 3 prometia\ncomprobabilidad y, desde que quitamos las cifras, no comprobaba nada. En vez de\ndevolver el detalle, un enlace: la Sala de Maquinas del manual completo, «con\nlas siete curvas dibujadas... Aviso: es el capitulo mas denso del libro, y\nentrar es bajo tu responsabilidad». La promesa se cumple, pero en su sitio.\n\n### Y el fallo que destapo ese enlace\n\nAl verificar el enlace nuevo aparecio que apuntaba a `NOGUM_juego.html` en vez\nde a la URL del artefacto. La causa:\n\n```\nopen(os.path.join(out, f'nogum_{p}.html'), ...).write(artefacto)\nopen(os.path.join(out, LOCAL[p]), ...).write(local)   # LOCAL['tesis'] = 'NOGUM_tesis.html'\n```\n\n**En Windows el sistema de ficheros no distingue mayusculas**, asi que\n`nogum_tesis.html` y `NOGUM_tesis.html` son el mismo fichero y la version local,\nque se escribe segunda, pisaba a la de artefacto. Todo lo publicado hasta hoy\nllevaba los enlaces del pack apuntando a ficheros locales **que no existen en\nclaude.ai**: las cuatro piezas «a un clic» no llevaban a ninguna parte.\n\nArreglado: las de artefacto se escriben ahora en `out3/art/{pieza}.html`, que no\npuede colisionar. Comprobado tras el cambio: 11 enlaces a claude.ai en la\nApuesta y en el Juego, 9 en el Acelerado, y **cero** `href=\"NOGUM_*.html\"`.\n\nLeccion: **dos rutas de salida que solo se diferencian en mayusculas no son dos\nrutas.** Y el sintoma no era visible en el producto que se abre en local, que es\njusto donde se mira.\n\n## T149 · La app deja de ser un callejon sin salida\n\n«De la app no se puede volver. Hay enlace en los 3 textos a todos los\nproductos, pero en la app no hay forma intuitiva de volver.»\n\nCierto, y peor de lo que parecia: la app no tenia **ni un solo** enlace a las\notras piezas. Los tres aciertos de «La Apuesta» que aparecian al buscar eran\ntodos del canon embebido, o sea de la bitacora.\n\nLa solucion no es inventar un gesto nuevo: es **la misma tira que ya tienen los\ntres manuales**, con la pieza actual marcada igual. El lector ya aprendio ese\ncontrol leyendo cualquiera de los libros, asi que no hay nada que explicar.\n\nVa en **fila propia debajo de la cabecera**, porque en la app la primera fila ya\nes de las pestanas y meterla ahi la habria apretujado. Lleva el rotulo «Los\nmanuales» delante, que en los libros no hace falta porque la tira esta donde\nsiempre, y aqui es nueva.\n\nDetalle del compilador: **la app se publica en dos sitios y cada uno necesita\notra URL**. En la carpeta local, rutas relativas a `NOGUM_productos`; en\nclaude.ai, las URL de artefacto, y ahi se abren en pestana nueva como en los\nmanuales. `build_app3.py` rellena `%%PRODS%%` dos veces, una por destino, igual\nque hace el ensamblador con los libros. Comprobado el viaje completo: la app\nlleva al manual y la tira del manual devuelve a la app.\n\n## T150 · La bitacora rompio la app\n\nLa version 40 salio en blanco. Causa, y es de manual:\n\n`build_app3.py` sustituye marcadores en la plantilla de la app. Dos de ellos\ninyectan **texto libre**: los datos y la bitacora entera. Al documentar en T149\nel marcador nuevo de los enlaces, **escribi su nombre literal dentro de la\nbitacora**. Como la bitacora se inyectaba primero, la sustitucion siguiente\nencontro esa aparicion *dentro de la cadena JSON del canon* y la reemplazo por\nun array con comillas sin escapar. JSON roto, error de sintaxis, script muerto\nentero: ni pestanas, ni contenido, ni el rotulo del boton de tema.\n\nDos arreglos:\n\n1. **Los marcadores de plantilla se resuelven primero y los blobs al final.** Si\n   un blob contiene algo que parece un marcador, ya no hay nada despues que lo\n   pise. Y antes de inyectar nada se comprueba que no queda ningun marcador sin\n   resolver.\n2. **El canon embebido se valida como JSON en cada compilacion**, en las dos\n   salidas, y la compilacion se para si no parsea. Esta clase de fallo no puede\n   volver a llegar a publicacion sin avisar.\n\nLeccion, y vale para cualquier plantilla: **el orden de sustitucion importa en\ncuanto uno de los valores es texto que no controlas.** Documentar el propio\nmecanismo dentro del contenido que el mecanismo procesa es la forma mas rapida\nde descubrirlo.\n\n## T151 · Fuera los bancos de musica\n\n«Quitamos esa parte. Ya tenemos el arrastra. Ya lo probe con una pista y es\nmaravilloso.»\n\nFuera la guia de busqueda entera: los terminos por tarjeta, los enlaces a\nPixabay y Free Music Archive, el «Feel» de Incompetech y el aviso de licencias\nde terceros. El panel de musica es ahora **solo** la zona de arrastre y la lista\nde tus pistas.\n\nEra lo correcto. Aquello existia porque no habia forma de meter musica propia; en\ncuanto la hay, mandar al Director a buscar fuera es peor producto. Y de paso\ndesaparece todo el problema de licencias: no enlazamos a nada, no distribuimos\nnada, la musica la pone el. Codigo muerto retirado —`BANCOS`, `INCO`,\n`MUSICA`, `musKey()`, `musica()` y seis reglas de CSS—, 68 lineas menos.\n\nAl dia tambien la mencion del manual en 1.4, que prometia «los terminos exactos\nque hay que teclear y dos bancos de musica libre». Ahora cuenta lo que hace de\nverdad: arrastras, asignas, y hay un altavoz en cada casilla del Cuadrante.\n\n**Lo que queda pendiente de T139 cambia de forma.** Ya no hace falta que el autor\nentregue siete pistas con su licencia para montar un «nivel de serie»: puede, si\nquiere, pero la funcion ya esta completa sin ellas.\n\n## T152 · Barrido exhaustivo antes de cerrar\n\nSeis fallos reales, y tres de ellos son del capitulo 8, que es justo donde el\nautor sospechaba que no habia mirado lo suficiente.\n\n### El tope de dano se arreglo en castellano y no en ingles\n\nCuatro objetos del Bazar repartian 3 de dano, que no existe desde T131:\n\n- **Granada EMP**: «Dano 0 (humanos) / 3 (maquinas)». Contradecia **su propia\n  nota editorial**, que dice que el «Dano 3 [Inevitable]» del manual original se\n  traduce a Esq: Nula y Abs: Nula. Ahora es 2, que es lo que la nota describe.\n- **Canon de Iones**: «Dano 0 (fisico) / 3 (escudos)», el mismo caso. Este no lo\n  habia visto nadie.\n- **Lanzallamas Casero** y **Gema del Infinito**: el castellano decia 2 y el\n  ingles seguia diciendo 3. Deriva de traduccion pura.\n\n### app_data.json arrastraba texto que el manual ya habia cambiado\n\n`extract_app_data.py` hace `data = dict(prev)` y solo regenera cuatro claves. El\nresto **se arrastra para siempre**. Por eso `baulLong[11]` seguia hablando de\n«La Cascara» y «El Nucleo», nombres retirados en T133, mientras el capitulo 8 ya\ndecia Letal y Guerra. La app servia una regla con vocabulario que el libro ya no\nusa. Corregido, y anadido un **guardia que para la extraccion** si cualquier\ntexto arrastrado contiene vocabulario retirado. Comprobado que salta.\n\n### Los estados editoriales seguian en el Baul\n\nEl autor pidio en su primera lectura: «quita los estados aprobado o propuesta\ndel asistente. Todos quedan.» Se aplico en la pagina del asistente y **no en la\ntabla de modulos del 8.1**, que seguia publicando una columna entera con\n«Aprobado», «Propuesta del asistente» y «cifras sin validar»: 22 apariciones en\nel Juego. Lo mas feo es que la propia `limpia_editorial()` ya lo documentaba en\nsu docstring y no lo implementaba.\n\nArreglado con el mecanismo que ya existia: la columna va marcada y el limpiador\naprende a quitar tambien `<th>`. Resultado: fuera de los tres manuales, intacta\nen el Cuaderno, que es el sitio de eso.\n\n### Y una frase rota por el barrido de marcas\n\n«¿Por que no hay receta de \"como jugar **a lo los** narrativos de aspectos\"?» Un\ndestrozo gramatical de cuando se sustituyeron los nombres comerciales.\n\n### Red nueva\n\n`w_revision.py`: barre los cuatro productos publicados buscando vocabulario\nretirado, comprueba invariantes y revisa anclas, ids repetidos y enlaces. Dos\ncosas que aprendio por el camino:\n\n- Los productos llevan **los dos idiomas** en `<template>`, asi que todo id sale\n  dos veces a proposito; y paper.js construye anclas en JavaScript que no son\n  anclas. Sin filtrar eso, 110 falsos positivos.\n- Al quitar etiquetas hay que separar los bloques con salto de linea: si no, el\n  final de una celda se pega al principio de la siguiente y aparecen frases que\n  nadie escribio («...por su Dano» + «3. Te protege de algo?» = «Dano 3»).\n\nVerificado: numeros que el manual afirma y que son ciertos. **200 Firmas**\nexactas en `firmas.json`, **40 Disciplinas**, 20 recetas con sus 20 juegos de\ntechos, 16 reglas en el Baul.\n\n## T153 · El barrido de marcas, cerrado\n\nLa primera pasada (`w_barrido.py` + `marcas_map.py`, 116 menciones) habia dejado\nlo gordo. Esto cierra lo que quedaba, en dos pasadas mas y **127 sustituciones**.\n\n### Segunda pasada: lo que seguia vivo\n\n«la Fuerza» en sus cuatro formas, el **Sable de Luz**, la **Gema del Infinito**,\nla **Capa de Levitacion**, el **Cubo Cosmico**, el **Suero de Supersoldado**, el\n**Lazo de la Verdad**, el **Cinturon de Utilidades**, el **Anillo de Poder**, el\nguino de «Armadura de Combate (Iron)», el **Radar del Dragon**, la **Carga\nBiotica**, el **jedi** de los ejemplos del capitulo 3, **la kriptonita** y **la\nprotagonista de Alien**. Criterio de los nombres nuevos: se describe lo que el\nobjeto *hace*, no de donde viene, en la linea de los que ya funcionaban\n(«Martillo Digno», «Nube de los limpios de corazon»). La Fuerza pasa a ser **el\nFlujo**, que hace el mismo trabajo y no es de nadie.\n\n### Y tres destrozos que habia dejado la primera pasada\n\n«Ballesta **el** gigante peludo», «**Pendientes pendientes** de fusion»,\n«Armadura **el** guerrero de otro planeta» y, al parear idiomas, «Regeneracion\nunion definitiva». Sustituir un nombre propio por un sintagma deja la\npreposicion colgando, y eso en producto se ve mas que la marca.\n\n### Tercera pasada: el ingles iba muy por detras\n\nEl hallazgo serio. **La traduccion inglesa habia devuelto marcas que el\ncastellano ya tenia eufemizadas.** «Nube de los limpios de corazon» se habia\ntraducido como *Flying Nimbus*; «Semilla del viejo de la montana» como *Senzu\nBean*; «Armadura de Soldado de Asalto» como *Stormtrooper Armour*; «Ballesta del\ngigante peludo» como *Bowcaster*. La receta de artes marciales en ingles era\npracticamente un catalogo de Dragon Ball: *Destructo Disc*, *Spirit Bomb*,\n*Instant Transmission*, *Namekian Regeneration*, *Power Pole*, *Z Sword*,\n*Potara Earrings*, *Bansho Fan*, mas *Fist of the North Star* y *The Eight\nGates* de otros dos mangas.\n\nSon 19 terminos, y ninguno estaba en castellano. **Leccion: en un producto\nbilingue, el barrido hay que hacerlo pareando los dos idiomas, no por separado.**\nLa version inglesa es ademas la que apunta al mercado grande.\n\n### Lo que se queda, y por que\n\n- **«alien», «fallout shelter», «dune buggy», «a doctor who owes them a favour»,\n  «metropolis»**: nombres comunes.\n- **Lovecraft**: autor citado como referencia literaria, muerto en 1937.\n- **«la comarca» / «the shire»**: nombre comun en los dos idiomas, y esta\n  haciendo trabajo descriptivo en una linea de referencia.\n- **«Vorpal»**: viene del *Jabberwocky* de Lewis Carroll (1871), dominio publico.\n  Es un guino del autor en el marcador de busqueda y se queda salvo que diga.\n\n`w_marcas_inv.py` queda como inventario: busca marcas, personajes y titulos\nsobre lo publicado y ensena el contexto, sin tocar nada.\n\n## T154 · Licencia: CC BY-SA 4.0\n\nDecidida y puesta en los cuatro productos, en los dos idiomas, mas el fichero\n`LICENSE` del repositorio.\n\n**Por que BY-SA y no otra.** Atribucion obligatoria, que es lo que el autor\npedia, y ademas obliga a que lo construido encima siga abierto. **BY** a secas\ndejaria que alguien ampliara el manual y cerrara el resultado. **NC** parece\nprotector y es la barrera que impide los suplementos de pago —la que\nEclipse Phase acabo quitando—. **ND** prohibiria los suplementos\ndirectamente. Y la licencia **ORC** de Paizo, que es la alternativa nativa del\ngremio, esta pensada para abrir las mecanicas manteniendo cerrada la prosa, que\nes justo lo contrario, y obliga a declarar material licenciado y reservado:\nmas trabajo para nada.\n\n**El dato que ordena todo esto:** las mecanicas de juego no son objeto de\nderechos de autor. Lo protegible es la expresion. O sea que cualquiera puede ya\nimplementar el sistema de lectura de dados sin permiso, con licencia o sin ella.\nLo que se licencia es **el manual**, no **el motor**.\n\nEl colofon dice las tres cosas que hacen falta:\n\n1. **Como se cita:** «NOGUM, de Daniel Martin · CC BY-SA 4.0», con enlace\n   al original donde el medio lo permita. Si no se dicta, cada uno cita como le\n   parece.\n2. **Las reglas son libres.** Legalmente no anade nada, pero quita la duda que\n   frena a quien querria escribir material compatible.\n3. **El nombre NOGUM queda fuera de la licencia.** El contenido es libre; el\n   nombre se queda con su autor, para que nadie firme en su lugar. Puedes decir\n   que tu trabajo es «compatible con NOGUM»; no puedes publicarlo COMO NOGUM.\n\nEl `LICENSE` recoge ademas los terceros: las tipografias de Google Fonts, cada\nuna con su licencia, y la aclaracion de que la musica que un usuario arrastre a\nla app es suya, se queda en su navegador y no se distribuye con el proyecto.\n\n## T155 · El proyecto sale de la carpeta temporal\n\nAl preparar la subida aparecio lo mas urgente de toda la sesion, y no tenia nada\nque ver con publicar: **todo el codigo fuente vivia en una carpeta temporal del\nsistema**. Los 44 fragmentos, el pipeline entero, los datos y `CANON.md` con sus\n154 entradas estaban en `AppData\\Local\\Temp`, que Windows limpia. En la carpeta\ndel proyecto solo habia HTML compilado, del que los fuentes no se recuperan.\n\nRescatado todo al proyecto y **comprobado que desde la copia se reconstruye**,\nque es lo unico que demuestra que el rescate sirve.\n\nEl repositorio queda asi:\n\n```\ndocs/   el sitio publicado (GitHub Pages)\nsrc/    fuentes, datos y pipeline juntos\n        archivo/  los 130 scripts de un solo uso, por historial\nLICENSE · README.md\n```\n\nEl pipeline va **dentro de `src/`** a proposito: los scripts resuelven rutas\ncontra su propia carpeta, asi que separarlos de los fuentes habria obligado a\nrefactorizar catorce ficheros sin ganar nada.\n\n**Tercer destino de compilacion: `web`.** Ademas de la carpeta local y los\nartefactos, ahora sale el sitio con nombres limpios (`apuesta.html`,\n`juego.html`...) y enlaces relativos entre piezas, sin pestana nueva porque es\nel mismo dominio. La app tambien, con su propia tabla de enlaces.\n\nY una ruta absoluta de `build_app3.py` —la carpeta del autor, escrita a\npelo— pasa a ser relativa: quien clone el repositorio tiene que poder\ncompilarlo.\n\n**GitHub Pages es el alojamiento**, no hace falta dominio: `epifaneia.github.io/nogum/`\nya es publico e indexable. El dominio propio es una capa opcional que se puede\nanadir despues sin mover nada.\n\n---\n\n## T156 · La Idea, y el Ajuste se muda al capitulo 3\n\n**La Apuesta pasa a llamarse La Idea** (`The Idea`), y la URL publica pasa de\n`apuesta.html` a `idea.html` con un reenvio en la vieja, porque ya era publica.\nEl autor propuso primero «La Epifania»; se descarto por dos razones. Reclama la\nrevelacion, y la voz de la pieza hace lo contrario: dice a que ha renunciado y\nse hace las preguntas, asi que un titulo que anuncia el hallazgo firma algo que\nel texto se niega a cobrar. Y alojada en epifaneia.dev convertiria NOGUM en un\nproducto de Epifaneia en lugar de un proyecto personal que vive ahi. «La Idea»\nempareja con el marco nuevo de la portada —una idea, cuatro piezas— y explica\nsin prometer.\n\n**La palabra «apuesta» no se retira**: se asciende a concepto. Titula la seccion\nde presentacion de la portada («Una apuesta, cuatro piezas») y sigue cerrando la\npropia pieza («esa es la apuesta, y esta toda sobre la mesa»). Lo que cambia es\nel nombre del producto, no el vocabulario.\n\n**ED-37, el Ajuste, se muda a 3.5.** Estaba escrito entero y publicado, pero en\nel taller del Bazar (8.3), un apendice del catalogo de equipo. Y no es una regla\nde catalogo: es la regla que dice como los puntos y las Llaves se convierten en\ncosas que no estan en la piramide. El capitulo 3 no la mencionaba y 4.3 tampoco,\nasi que **un jugador haciendose una ficha no se la encontraba nunca**. Al autor\nle parecio que faltaba una de las partes mas controversiales del sistema; no\nfaltaba, estaba en el capitulo equivocado.\n\nY estaba contada del reves. El taller la presenta como la herramienta del\nDirector para tasar lo que no esta en la lista. La version del autor es la\ncontraria y es mejor: **los puntos y las Llaves no contienen todo, y en vez de\nintentarlo con mil reglas, se compra un modificador y una etiqueta lo corrige**.\nEso es una frase de tesis y estaba escrita como un factor de correccion. El 3.5\nse lleva el concepto y un ejemplo; el 8.3 se queda las tablas, sin duplicar.\n\n**El ejemplo pasa a ser el dron, no la capa.** La limitacion de la capa es «se\nte puede caer», que es el Director quitandote algo. La del dron es estructural:\n+2 a lo que mires con el son dos puntos, pero se ve, se le dispara y es un\ncuerpo mas en la escena, tuyo. El jugador ve por que vale la mitad sin confiar\nen el juicio de nadie, y Limitado se siente ganado en vez de negociado. Lo que\nel ejemplo demuestra es lo que no hizo falta: ni alcance, ni bateria, ni tabla\nde aparatos voladores.\n\n**Regla nueva: por debajo de 1, gratis, una escena.** El Ajuste decia «redondeo\nhacia arriba y nada baja de 1». Ahora, cuando Limitado deja el precio por debajo\nde 1 —la cuenta decia un punto, o una Llave—, sale **gratis**, y el precio de\nque salga gratis es la correa obligatoria de que **dura una sola escena**. La\ngranada, el brebaje, el parche de un uso. Si quieres que dure mas, el minimo\nvuelve a ser 1: por eso la capa de invisibilidad sigue costando 1 Llave, porque\nte la quitas y te la pones toda la campana. Tapa el hueco de lo consumible sin\ninventar una categoria para el.\n\n**Correccion de una lectura mia que era falsa.** Dije que Desatado era\ninalcanzable en creacion porque el bote son 5 Llaves y un poder de 2 Llaves\nDesatado cuesta 6. Mire solo el bote: el Ajuste multiplica **puntos y Llaves**.\nUn poder de 0 Llaves y +3, Desatado, son 9 puntos de 12, y quedan 3. Cabe, es\nlegal, y es una ficha dura: has comprado algo enorme y no te queda oficio\ndebajo. El sistema cobra en vez de prohibir, que es la misma frase de 3.5 con\nlas Firmas y la nulidad.\n\n**El -1 de Torpe entra en la tabla de la piramide (3.1).** Daba el -2 de la\nNulidad pero no el -1 del Dominio que no tocas, que vivia solo en el cuadro de\nregla de mas abajo. Ahora esta en los dos sitios, con enlace entre ellos.\n\n**Las dos primeras preguntas del eje del optimismo median el eje de al lado.**\nLa de la cuerda tenia un fallo de diseno y no de redaccion: el modo de fallo de\n«no me llega la cuerda» es quedarse colgado, no caerse, asi que una pregunta\nsobre letalidad tenia un fallo que no era letal. La sustituye una tirada limpia\n—eres buen escalador, nadie en contra, sin prisa— que es exactamente\nmejor-de-dos contra peor-de-dos y no deja entrar al caos. La del guardia cambia\n«girar la cabeza» por que su atencion se vaya con nuestra distraccion, que si\ndice hacia donde mira, y gradua las consecuencias de «suena la alarma en todo el\nlocal» a «el pasillo se queda solo». Fuera «medio plan» y los dos «se tira y se\nve»: hablaban de preparacion, que es caos.\n\n**Y el formulario declara lo que pregunta**: no que pasaria de verdad, sino que\nesperais que pase. Una pregunta leida como suceso invita a contestar que\nocurriria en vez de que se quiere sentir.\n\n**La portada presentaba el proyecto por sus cifras.** Abria por 7,15, 3,85 y las\ncien combinaciones, que son el recibo y no el argumento, y las cuatro tarjetas\nse leian como cuatro descargas. Entra delante una seccion que dice que es esto\n—una idea y su desarrollo completo, en cuatro piezas— y las cifras bajan a una\nlinea de cierre.\n\n---\n\n## T157 · La Idea en papel, compuesta a mano\n\n**El autor pidio el PDF a mano**, despues de que yo defendiera paginarlo con un\nmotor (Paged.js). Mi objecion era una sola: el prototipo de hace meses tenia\ncajas A4 fijas con `overflow:hidden`, y eso se come en silencio lo que no cabe.\nSu decision fue a mano; se hizo a mano, y la objecion se resolvio de otra\nforma: **componer a mano, con una regla al lado**.\n\n**El texto no se copia.** `pdf_idea.py` lee `p_tesis_es.html` como los otros\ntres productos. Lo que se decide a mano es donde empieza cada pagina: la lista\n`CORTES`, escrita con las palabras exactas del corte y el porque de cada uno,\ncomo las notas de un cajista. Si un corte cae dentro de un parrafo, se parte\npor la marca, cerrando y reabriendo la negrita que quede a medias.\n\n**La puerta, medida en el mismo Chrome que imprime y con las mismas fuentes:**\nnada se desborda de su caja; todo parrafo de texto empieza en una linea entera\nde la rejilla de 15 pt; ningun titular se queda al pie ni sin dos lineas\ndetras; un parrafo partido deja dos lineas a cada lado; las dos paginas de cada\npliego acaban a la misma altura (salvo las que cierran seccion o estan frente a\nun mueble); lo que vive en el margen se ve de verdad; el mobiliario no se pisa\nni se sale; y el total es multiplo de 4, para imprimirlo como cuadernillo.\n\n**Los pliegos mandan, no las paginas.** De la 7 a la 12 hay 309 composiciones\nvalidas y ninguna con todas las paginas llenas: el texto no lo permite. La\nelegida iguala cada pliego (46|46, 44|44, 45|45). La 5 suelta cinco lineas a\nproposito: esta frente al indice, donde un pie corto no se compara con nada, y\nasi la 6 acaba en «no hay ninguna razon para girarlo solo una vez» y la\nentradilla que lo remata abre la 7 al pasar la hoja.\n\n**Cuatro fallos que la regla encontro antes que el ojo:**\n- La raya bajo el titular de seccion sumaba 0,8 pt y sacaba de la rejilla todo\n  lo que venia detras. Ahora es una sombra que no ocupa sitio.\n- Una entradilla detras de un subtitulo perdia media linea por colapso de\n  margenes de CSS. Las entradillas usan relleno, que no colapsa.\n- Los numerales de seccion y la nota al margen no se veian: los recortaba el\n  `overflow:hidden` de la caja de texto, justo el peligro del prototipo. Fuera\n  el recorte, y la puerta comprueba la visibilidad.\n- **La primera comprobacion de visibilidad mentia.** Usaba `scrollIntoView()`,\n  y una caja con `overflow:hidden` se puede desplazar por codigo: desplazaba el\n  texto hasta que el numeral entraba y lo daba por visible. Solo cazaba las\n  paginas pares. Se rehizo con pura geometria y se probo en negativo: con el\n  recorte puesto, caza los nueve elementos del margen.\n\n**La flecha caia a Consolas.** Google Fonts reparte cada fuente por rangos de\nUnicode y U+2192 no esta en el subconjunto latino de JetBrains Mono. La\nportadilla pasa a «N·O·G·U·M = ...», que ademas es lo que es: una definicion.\n\n**Lo que sale del propio texto, sin copy nuevo:** la contracubierta es el\nsalto, las tres emociones y quien decide cual (seccion 1); la pagina 15, «Tres\npuertas», son las frases de la seccion 8 («responde a ya / a como / a\ncontigo») con su enlace vivo; los creditos salen de `colofon()`, el mismo de\nlos otros tres productos.\n\n**La cubierta queda fuera de la licencia.** Es una imagen generada con IA y su\nautoria es dudosa en varias jurisdicciones: incluirla en CC BY-SA cederia\nderechos que quiza no existen. Lo dicen el PDF y el LICENSE. Es la opcion\nconservadora y el autor puede cambiarla.\n\n**Pendiente, avisado y sin tocar:** La Idea dice «malla» / «mesh» dos veces\ndonde el manual dice Rejilla / Grid.\n\n**Limitacion conocida:** las fuentes variables de Google Fonts entran en el PDF\ncomo Type 3. Se ven bien y el texto se copia (las 33 llevan ToUnicode), pero\nuna imprenta las marcaria en el control previo. Si algun dia va a imprenta,\ntoca servir instancias estaticas.\n\n---\n\n## T158 · La malla era la Rejilla\n\nLa Idea decia «malla» dos veces (y «mesh» en ingles) donde todo el manual dice\n**Rejilla** / **Grid**. Estaba ahi desde el primer commit: un resto del\nborrador, cuando «malla» llego a nombrar cuatro cosas a la vez. El autor lo\nconfirma: malla es Rejilla. Cambiado en los dos idiomas.\n\nLa puerta de vocabulario retirado la vigila desde ahora, pero no a ciegas: la\nprimera version de la regla cazaba ocho apariciones mas y las ocho eran\nlegitimas. La armadura («cota de malla», tres veces), la cita del autor en T67\nentre comillas latinas («que ignore la malla y sea la corta dioses») y el\nglosario, que habla DE la palabra. La regla deja pasar esos tres usos y se\nprobo en los dos sentidos: caza las dos erratas viejas de cada idioma y deja\nlimpio lo publicado.\n\nEl cambio corrio una palabra el parrafo partido entre las paginas 10 y 11 del\nPDF y descuadro ese pliego. La regla de cajista encontro el mismo reparto con\nel corte una palabra antes; los pliegos vuelven a acabar a la misma altura.\n\n---\n\n## T159 · El PDF se archiva; la web se lleva lo que valia\n\n**El PDF de La Idea se retira.** Era una sola pieza, y su maqueta (margen ancho\nalternado) estaba pensada para los post-its y las notas a mano del prototipo,\nque el autor descarto por ser un equipo de una persona. Sin ellos era papel\nvacio que salta de lado al leer en pantalla. `pdf_idea.py` y su hoja pasan a\n`archivo/`; la imagen de cubierta a `img/`, porque de ella sale la vista previa\nal compartir el enlace, que se queda.\n\n**La version web no tenia esqueleto de documento.** `assemble3` solo lo ponia\nen la version local; el destino web se trato como el de artefacto, donde lo\npone claude.ai, pero GitHub Pages sirve el fichero tal cual. Sin `<!doctype>`\nlos tres libros iban en modo quirks; sin `viewport`, el movil los dibujaba a\nancho de escritorio; sin `charset`, guardados o abiertos desde disco salia\n«Ã­ndice». En el sitio no se notaba lo ultimo solo porque Pages manda la\ncabecera. Error mio al montar el destino web (T155).\n\n**Las tablas feas eran `overflow-wrap:anywhere`.** Hipotesis medida antes de\ntocar nada, con un navegador real y las 160 tablas del Juego: el modo quirks no\ncambiaba nada (422 palabras partidas antes y despues de arreglarlo). `anywhere`\nhace creer a la tabla que cualquier columna cabe en una letra, y estrechaba las\nde etiquetas hasta trocear «Total», «Acceso» o «Rejilla» sin guion; las peores\neran las del Bazar. Con `break-word`: 422 -> 5 en el Juego, 8 -> 0 en el\nAcelerado, ninguna tabla mas ancha que su pagina, y sobra una pagina. Las cinco\nque quedan son palabras con guion propio (bio-aumentos, Post-Apocalipsis) que\nse parten en su guion.\n\n**Papel calido**, del prototipo: los neutros pasan de gris azulado a crema, y el\nmodo oscuro de negro azulado a negro calido, que es el de la cubierta. Los\ncolores de marca no cambian; los fondos suaves se recalculan como mezcla con el\npapel nuevo. Las treinta parejas de texto y fondo que se usan pasan de 4,5 de\ncontraste en los dos modos. La App hereda la paleta, porque toma sus tokens de\n`paper.css`.\n\n**El numero de cada titular, en rojo**: «Capitulo 3», «3.5», «1 ·», «Apendice\nD», y las recetas del Bazar. Se envuelve solo el numero.\n\n**Y un resto del cambio de nombre**: la cabecera del libro de La Idea decia\n«La apuesta de diseno», en minuscula, y por eso se escapo de la busqueda.\n\nPendiente de decidir por el autor: Big Shoulders o Ibarra Real Nova en los\ntitulares de dentro de los libros.\n\n---\n\n## T160 · Ibarra para lo que se lee\n\nEl autor delego la eleccion. Criterio: **lo que se lee lleva Ibarra Real Nova**\n(titulares de capitulo y seccion, recuadros de regla, la despedida), y **lo que\nes marca o tarjeta se queda en Big Shoulders** (el logo, el N·O·G·U·M de las\nportadillas, las tarjetas del pack y las siete de tono). Los titulares largos y\ncon parentesis se leian mal en mayusculas condensadas; en minuscula de frase y\nserif se leen como un libro. Token nuevo, `--book`.\n\nLas recetas del Bazar se quedan en Big Shoulders aunque parezcan titulares:\nson tarjetas, y su titulo viene en mayusculas desde la fuente; en serif salia\ngritando y en dos lineas.\n\nVisto de paso y sin tocar: «8.4 Simulacion de manuales» sale dos veces\nseguidas, como titular de seccion y como subtitulo.\n\n---\n\n## T161 · La imagen de cada pieza\n\nUn fichero por pieza (idea, juego, acelerado, app) en `src/img/`; el que\nfalte usa `portada.jpg`, asi que hoy las cuatro son la misma. `imagenes.py`\nlos pasa a `docs/img/` a dos tamanos: 1280 px para la lamina de cada libro y\n640 px para su tarjeta en la portada del sitio. Cambiar una imagen es dejar el\noriginal y ejecutar eso, sin tocar codigo. Es el unico paso que usa Pillow; la\ncompilacion de los libros sigue siendo biblioteca estandar.\n\n**En los libros, hoja propia y no banda dentro de la portadilla.** La primera\nversion metia la imagen arriba de la portadilla. Medido: a las portadillas les\nsobraban entre 8 y 32 mm, la banda pedia casi 90, y la hoja es de alto fijo y\nrecorta en silencio lo que no cabe. Ahora cada libro abre con una **lamina**\n(los dados, NOGUM, la imagen a sangre y el nombre de la pieza), como la\ncubierta del PDF retirado, y la portadilla pasa intacta a la pagina 2. El\nlector no pone el indice detras de la lamina sino detras de la portadilla.\nComprobado en los tres libros y los dos idiomas: la lamina cabe, la portadilla\nconserva su margen, el indice no se duplica (el del Juego son 3 hojas y 91\nentradas, igual que antes) y cada libro tiene una pagina mas.\n\nSolo en las versiones web y local: el artefacto de claude.ai no lleva ficheros\nsueltos.\n\n**En la portada del sitio**, la imagen a sangre arriba de cada tarjeta, en\n16:10, y las cuatro tarjetas en 2 x 2 en escritorio: con 3 + 1 la App se\nquedaba sola, y con imagen se notaba mucho.\n\n---\n\n## T162 · La portada cuenta la tesis, no el ejemplo\n\nTexto del autor, trabajado en conversacion. La portada abria por el ejemplo (el\nsalto de tres metros) y explicaba el mecanismo con cifras; un lector que\ntodavia no sabe que es esto no necesita medias ni probabilidades. Ahora el\norden es el de un argumento: que es NOGUM («no es otro manual universal de rol:\nes una tesis sobre como jugar, que cambia las reglas del juego, literal y\nfiguradamente»), las tres formas habituales de disenar reglas, la pregunta que\ncasi nadie se hace (como se sienten los jugadores con los dados en la mano, y\nsi esa emocion encaja con el universo), el manual que se ajusta a la emocion de\ncada universo, y el feliz accidente, que cumple el «literal» de la primera\nfrase. Cierra con «NOGUM te devuelve el mando de lo que siempre vino impuesto y\nsin declarar».\n\n«No es OTRO manual universal», y no «no es un manual universal»: lo es, y el\nJuego completo esta justo debajo. Fuera de la portada quedan el salto, las\ncifras y la seccion «En que consiste la apuesta»; sobre las tarjetas, una linea\npor pieza. Ni un numero en la entrada.\n\n---\n\n## T163 · Repaso del autor al Juego completo\n\n**Las siete tarjetas de tono se recortaban.** Iban en un solo contenedor y el\nlector no reparte entre hojas lo que no esta en su lista de partibles: un\nbloque de dos paginas en una hoja de alto fijo, y 318 mm recortados en\nsilencio. `div.t7s` entra en esa lista; el lector reparte tarjeta a tarjeta sin\npartir ninguna. Queda como pidio el autor: Epica, Pulp y Realista en una\npagina, y Primera marcha abre la siguiente. Comprobado despues: ningun texto\nde los tres libros sale de su hoja.\n\n**Ten Candles, Dread y Trophy** se habian escapado del barrido de marcas (no\nestaban en el inventario). Ahora son una descripcion: juegos de terror de una\nsola noche que apagan velas o sacan piezas de una torre. Ten Candles y Trophy\nDark/Gold entran en el inventario; Dread no, porque es una palabra corriente.\n\n**La Llave prestada se apunta en la ficha, a lapiz.** Antes decia que no se\napuntaba.\n\n**El rockero de 2.4 deja de ser Social 4.** Decision del autor: la fama no sube\nla Rejilla, da Llaves, atadas al estatus y a la capacidad de convocar. Con\ncuatro (dos peldaños, 2.3) saca a miles a la calle como un nivel 3, y solo para\neso. Y se subraya que subir la Rejilla es algo serio: en cyberpunk el unico que\npasa del 1 es el super cromado, con un 2. Por eso **los techos de la receta 8\npasan de 2 · 1 · 4 · 2 a 2 · 1 · 1 · 1**: el Social 4 y el Tecnico 2 venian del\nrockero de antes (linea del canon de 2.4) y contradecian la regla. La App lee\nlos techos del manual y ya los tiene.\n\n**La escala de N2 pasa de decenas a centenas**, que es lo que dice el x100 por\npeldano: el encabezado de la tabla de 2.4, la tabla de escala de 2.2, el\nbarbaro, el jefe de secta, dos piezas del Bazar y la tabla del Acelerado, en\nlos dos idiomas. La «mejor decena» de 1.3 habla del d100 y se queda.\n\n**La primera columna numerica ya no reserva 34 mm.** La regla general daba ese\nminimo a toda primera columna, pensado para nombres; en la tabla de la vida\nfractal el zoom (1, 2, 3) se lo quitaba a «Letal», «Tactico» y «Guerra». Afecta\na unas 37 tablas; medidas antes y despues, igual: 5 palabras partidas (las de\nguion propio) y ninguna tabla mas ancha que su pagina.\n\n---\n\n## T164 · Ajustes: la IA con tu clave, y la mesa entera en un archivo\n\n**En la web, la IA estaba muerta.** Las seis funciones que la usan (preguntar\nreglas, la memoria de campana, el analisis de sesiones, la conversacion para\nmontar la mesa y la lectura de los formularios) llamaban a la capacidad de\nclaude.ai, que fuera de claude.ai no existe: en epifaneia.dev salia siempre\n«Sin IA».\n\n**BYOK.** Una segunda fuente con la misma forma que la de la plataforma, asi\nque las seis funciones no se tocan: dentro de claude.ai se usa la suya; fuera,\nla clave de Anthropic que pegue el lector, con el SDK oficial (0.131.0, desde\njsDelivr, sin paso de compilacion). Comprobado en un navegador real hasta la\nAPI: la peticion sale del navegador sin servidor y una clave falsa da el 401\nesperado. Lo que no se ha podido probar es una respuesta de verdad, porque no\nhay clave real en el taller.\n- La clave **no viaja en ningun archivo** ni en el Codigo, por decision del\n  autor; por defecto se olvida al cerrar la pestana, con una casilla para\n  recordarla en ese dispositivo y un boton para borrarla.\n- Por defecto **Sonnet 5.5**: paga el lector. Haiku 5.5 y Opus 5.5 se pueden\n  elegir. Se pide poco esfuerzo y sin pensamiento previo donde el modelo lo\n  admite; si la API rechazara esos ajustes, se repite una vez sin ellos.\n- En una conversacion, el primer bloque (instrucciones y canon) se cachea: las\n  preguntas seguidas cuestan mucho menos.\n- Un rechazo de la API (sin saldo, peticion invalida) se cuenta con sus\n  palabras, no como un fallo de conexion.\n\n**La mesa entera en un archivo.** Ya existia el boton «Archivo» (mesa,\nrespuestas, fichas, historia), pero escondido al final de una barra. Ahora\nesta en Ajustes, y con una segunda opcion: **guardar la mesa con musica**, con\nlas pistas de cada tarjeta dentro del archivo. Al abrirlo, las pistas vuelven a\nsu tarjeta y las que ocupaban esas tarjetas aqui se sueltan. Y el archivo lleva\n**sello de version** (las preguntas y el catalogo): si se abre con otras, avisa\nen vez de cargar las respuestas como si nada. Probado de punta a punta: una\npista guardada, borrada y recuperada byte a byte; la clave, ausente del\narchivo.\n\n**La imagen de la App, solo de bienvenida.** Con la mesa vacia, arriba de los\nformularios; en cuanto hay universo o fichas, desaparece. La ruta la pone el\ncompilador segun el destino; en el artefacto de claude.ai no hay imagen.\n\nEl boton se llama «Ajustes» y no «Configuracion»: con el nombre largo la\ncabecera dejaba de caber y se cortaba la ultima pestana.\n\n---\n\n## T165 · ¿Rejilla o Llave?\n\nLo que mas se discute en la mesa al crear la ficha, segun el autor despues de\njugarlo: las ganas de ponerse Rejilla alta en lo que en la ficcion suena enorme\n(la fama, el talento, el cacharro), cuando apunta a algo concreto y son Llaves.\nAl propio autor le paso con el rockero de 2.4. El concepto se explicaba, pero\ndespues del error; ahora la prueba esta donde se decide, en una sola pregunta:\n**¿le gana a cualquier cosa de ese ambito, o solo a una?** Si es solo a una, es\nuna Llave.\n\n- **Manual:** un recuadro de regla en 2.4, justo despues del rockero, que es el\n  ejemplo del error; y en 3.5, en el parrafo que compara el +1 de Rejilla con\n  las cinco Llaves, la remision a esa prueba.\n- **App:** la pregunta, siempre, en la nota de «Bote aparte y Llaves»; y un\n  aviso en ambar, con el nombre del ambito, si la ficha queda por encima del\n  nivel de la mesa. Probado con una mesa de cyberpunk: con +1 de Rejilla avisa\n  en Fisico, el unico ambito que alli puede pasar de 1; con cinco Llaves, el\n  aviso desaparece.\n\n---\n\n## T166 · El kit de itch.io\n\nTodo lo que pide la pagina de itch.io, en `lanzamiento/itch/`, salvo la cuenta,\nque es del autor: la descripcion (la de la portada, ingles primero y espanol\ndebajo, con cada pieza enlazada en su idioma), la hoja de campos, la portada a\n1260 x 1000, cinco capturas y un **pack sin conexion** con los tres libros, la\nApp, sus imagenes y la licencia.\n\nEl pack se probo como lo abriria quien lo descarga, desde el disco y sin\nservidor: los tres libros se paginan con su lamina, todos los enlaces entre\npiezas apuntan a ficheros que existen y la App carga su bienvenida.\n\nEn local, La Idea pasa a llamarse `NOGUM_idea.html`: seguia como\n`NOGUM_tesis.html`, el nombre de antes del cambio, y quien descargara el pack\nlo habria visto.\n\nLa hoja recomienda declarar en itch que hay material hecho con IA (las\ncubiertas, y texto y codigo escritos con un asistente). En rol es un tema\nsensible, y esconderlo hace mas dano que decirlo.\n\n---\n\n## T167 · La serie de imagenes\n\nImagenes nuevas del autor para La Idea (los planos), el Acelerado (una sola\nmesa) y la App (los brazos mecanicos); el Juego conserva la original. Corrigen\nlo que fallaba en la primera tanda: el personaje vuelve a ser el mismo\n(sombrero y abrigo), el estudio es el mismo, el Acelerado deja los platos de\nDJ modernos por una mesa analogica, y las cuatro comparten el tratamiento de\nla original (centro casi en blanco y negro, color en los bordes). Las laminas\nsiguen cabiendo en su hoja; el kit de itch.io se ha regenerado con ellas.\n\n---\n\n## T168 · El Terror del Acelerado no es la Pesadilla\n\nLo encontro el autor: en la App, con NOGUM Acelerado, el formulario del tono\nleia el optimismo con las lecturas del Juego completo. Un optimismo bajo decia\n«se lee el menor de dos dados», que es Angustia o Pesadilla, cuando el modo\nTerror del Acelerado tira **igual que el Neutro** (solo el dado rojo) y lo que\ncambia son las **3 casillas de vida**. El motor de dados estaba bien; mentian\nlos textos.\n\nAhora, en el Acelerado, el paso de resultado y el resumen final dicen el modo\nal que lleva cada respuesta (tabla de cruce de ED-A1): optimismo bajo, Terror;\nalto, Optimista; normal, Neutro, salvo con caos «mucho», que es Caos. Si el\noptimismo no es normal, el caos avisa de que no cambia el modo. La fila\n«Peligro» del resumen de la mesa decia «sin floritura» aunque en el Acelerado\nel Estilo +2 va siempre; ahora dice las casillas de vida y el Estilo.\n\n---\n\n## T169 · El monstruo no tiembla\n\nFeedback de una mesa, recogido por el autor: en las tarjetas duras los\nadversarios tiran con la misma tarjeta que los jugadores, y un horror que pifia\ncasi una de cada cinco veces (Pesadilla, cualquier 1) desinfla el miedo.\n\nRegla opcional, recuadro en 5.2 tras el menu de la pifia: un adversario con\nnombre puede hacer todas sus tiradas en Primera marcha (la tarjeta del centro).\nTres condiciones del autor y de la discusion: siempre hacia el centro, nunca al\nextremo contrario; solo adversarios con nombre, las masillas siguen con la\ntarjeta de la mesa; y se anuncia en voz alta, porque cambiarlo en secreto\ncontradice la tesis (declarar lo que venia impuesto). Aviso de uso: la opresion\nya trae frustracion, y con tres casillas de vida el monstruo mata mas rapido.\n\nNo va al Baul: el Codigo de la mesa usa 16 bits y una regla 17 romperia los\ncodigos ya compartidos. En el Acelerado no hace falta para el Terror, que ya\ntira como el Neutro.\n\nDe paso: una sustitucion antigua stance -> guard habia dejado en ingles\n«circumguards» y «subguard(s)»; vuelven a ser circumstances y substance(s).\n\n---\n\n## T170 · La lectura critica: lo que se cerro\n\nTres lecturas criticas independientes (Acelerado, Juego, App frente a libros).\nEl autor decidio, y se aplico en los dos idiomas y en la App:\n\n- **Torpe −1 en todas partes.** Lo comprado en un ambito abre su columna; la\n  otra columna del ambito se tira a −1. Consecuencia: el +0 deja de ser un\n  escalon de ficha (solo sale como total con dificultad, o en los PNJ rapidos).\n- **La defensa gana los empates (ED-25), sin la lista contradictoria del Paso 2.**\n  Se comparan niveles de resultado.\n- **El salto de poder va en las dos direcciones.** Mismo nivel: se tira. El de\n  arriba no tira (Estilo si importa como), tambien el monstruo contra los PJ.\n  El de abajo no afecta ni se defiende sin Llave. La Parca deja fuera de\n  combate, nunca mata (ED-12). Regla canonica en 4.5; el resto remite.\n- **La Rejilla 2 inicial es un valor por defecto,** en cualquier ambito con\n  techo ≥2; el techo del universo es otra cosa. La App permite mas puntos\n  iniciales a conciencia (+2/+4/+6, con aviso; viaja en el Codigo como -P).\n- El Acelerado trae la lista de habilidades y define «columna».\n- La App se alinea con el Acelerado: el equipo solo cuesta dinero (Llaves solo\n  si rompe la Rejilla), el Terror es un bloque de 3 casillas, el Estilo nunca\n  cuesta en el Juego y suma solo +2, el acordeon tira a +4.\n- Erratas: la ficha de Tomas (16 → 14), el Caso B ilegal, «dos de cada siete»,\n  «igual hasta +3», Pulp 28 %, nombres viejos de tarjetas, tablas de problemas\n  a d10, y una expresion regular que cobraba puntos a las armaduras.\n\nAbiertos, para hablar: el precio en Llaves de la Rejilla y del equipo que la\nrompe; el tono por escena por defecto; si el bono de un arma se paga con\npuntos; el Bazar con dano por encima de 2; la barra de la Identidad.\n\n---\n\n## T171 · Lo corriente siempre esta al alcance\n\nCon el Torpe a −1, casi ningun personaje tiene Recursos +0, y la App dejaba a\nun detective sin poder comprarse una camara. No era la regla: la tabla de los\ncajones del Bazar (8.3) ya decia que con −1, y con −2, el Acceso 0 esta\n«siempre» al alcance. La App comparaba Recursos con Acceso a pelo; ahora sigue\nla tabla (Acceso 0 siempre; de +0 a +2, un escalon mas con esfuerzo, una vez\npor arco; +4 llega a 3). El Acelerado gana la columna de Acceso en su tabla,\nigual que el Juego, y la fila +4 del ingles vuelve a decir lo mismo que el\nespanol. Se descarto dar a todos Recursos +0 por defecto: no hacia falta tocar\nla regla.\n\n---\n\n## T172 · Las tablas no parten palabras\n\nEl autor veia «NI-VEL», «MODIFI-CADOR» o «RECUPE-RACION» partidas en las\ncabeceras, y las pruebas no lo veian: las tablas tenian hyphens:auto, su Chrome\ntrae diccionarios de guion y el Chrome automatico de las pruebas no. Ahora las\ntablas no usan guiones: cada columna mide al menos su palabra mas larga y el\nsitio sale de las columnas de texto largo. Las cabeceras no se parten nunca, y\n«Quien es su dueño» va en una linea. Las 35 tablas del arsenal del Bazar llevan\nel mismo reparto de columnas (clase arsenal, ancho fijo), y «Acceso / Rejilla»\nse parte como mucho en dos lineas. Las pruebas usan desde ahora un perfil con\nlos diccionarios de guion, para ver lo mismo que ve el lector.\n\n---\n\n## T173 · La unidad de cambio entre Llaves y Rejilla\n\nEl autor: la Rejilla avanza por trama, pero cada salto tiene que ser\ncuantificable para que sea intercambiable. «No se compra» es un permiso de la\ntrama (que no rompa el tono ni los niveles), no la ausencia de precio.\n\nLa cuenta: una Llave sube una Disciplina; un nivel de Rejilla sube el Ambito\nentero, sus ocho Disciplinas. La Rejilla se cuenta en botes de cinco Llaves y\nsube por la misma escalera: estar n niveles por encima vale 5·n² Llaves, y\ncubrir las ocho Disciplinas Llave a Llave, 8·n². La proporcion es 5/8 en todos\nlos peldaños, la misma del bote de creacion, y garantiza lo que pidio el autor:\nlas Llaves nunca valen mas que la Rejilla que sustituyen. Quien renuncia a un\nsalto cobra su valor (5, luego 15 mas…); quien quiere subir antes lo paga\ncuando la historia da permiso. Empezar en 3 son 20 Llaves: o los demas reciben\ncuatro botes, o la mesa sube su nivel de partida.\n\nPara que la cuenta no se rompa: la Llave va siempre en una Disciplina entera,\nnunca en una Firma. El equipo que rompe la Rejilla cobra x² Llaves con x\nrelativo a quien lo lleva, y va Limitado (÷2) si solo sirve para una Firma. El\nrecuadro del bote decia «diez casillas por cinco monedas, la libertad se paga\nal doble»: son ocho Disciplinas, y la libertad cuesta un 60 % mas.\n\n---\n\n## T174 · Los precios del Bazar con la unidad de cambio\n\nEl Bazar ponia precio a lo que rompe la Rejilla por el nivel del objeto\n(nivel 2 = 4 Llaves, 3 = 9…). Con T173 se recalcula para un portador de\nnivel 1, con x = niveles que el objeto le sube:\n- Lo que sube Disciplinas sueltas: x² por Disciplina, y nunca mas que la\n  Rejilla del ambito (5·x²). Armas, bombas, la Espada Ancestral, «La lista»,\n  el canon de riel (4), el arma de asedio (1). El Brazo Gorila sube dos (2).\n  Los poderes de ejemplo del taller: Velo absoluto 4, Fuerza de sala 4 (las\n  cuatro de Vigor), Fuerza de edificio 16, Oido y Mando de multitud 1.\n- Lo que sincroniza un ambito entero (vehiculos, exoesqueletos, armaduras\n  motorizadas): Rejilla Limitada, 5·x²÷2 al alza: 3 a nivel 2, 10 a nivel 3.\n- El Elixir de Vitae da la Rejilla una escena: es una Llave ancha, x² = 4.\n- Sin precio, como estaban: la Servoarmadura, la Bomba de energia prestada y\n  el Martillo Digno, que concede el Director.\nLas etiquetas «Rejilla: Llave N» pasan a «Rejilla: Nivel N». El Buggy de Arena\ntenia Acceso 1 en ingles y 2 en español: manda el español.\n\n---\n\n## T175 · Las armas, baratas en Llaves: se avisa, no se arregla\n\nCon T174 un arma que rompe la Rejilla cuesta pocas Llaves (sube una sola\nDisciplina). El autor: no se arregla, se avisa. Conseguir un arma pesada es\ncomplicado, caro o pide permisos; el precio de las armas lo administra el\nmundo, con el Acceso y la ficcion, no la cuenta. Aviso en 4.3 y en el taller\ndel Bazar.\n\n---\n\n## T176 · La Llave de principio a fin, los unos abundan y los huecos de mesa\n\nTres simulaciones de partida (una sesion de Acelerado, una campaña del Juego y\nun abogado de reglas) encontraron huecos que paraban la mesa o rompian la\neconomia. Decisiones del autor y consecuencias directas:\n- La Llave estrecha es una Disciplina contra su objetivo (no contra todo); la\n  ancha, el ambito contra su objetivo durante una escena, y se tacha. Por\n  encima del techo solo valen Llaves con objetivo. Las Llaves de un salto\n  rechazado solo se gastan en ese ambito. La superioridad numerica solo iguala.\n  La Parca por encima de tu nivel se paga en Llaves. Lo Limitado gratis se\n  consume. La Sincronizacion es Limitada solo si se puede perder. Lo que presta\n  la trama sale gratis mientras la preste. Equipo perdido, Llaves perdidas;\n  traspasar no reembolsa. Los saltos son lo que la mesa pacte, por ambito.\n- Los unos abundan: se empieza siempre en 1·1·1·1·1 mas el +1 del bote. La\n  escala de la partida es el tamaño de las hazañas, no sube todos los ambitos.\n  Para empezar mas arriba: experiencia de salida (puntos y Llaves antes de\n  empezar; la App lo ofrece con aviso) o salto pactado en la sesion cero.\n- Combate: el decorado lo declara el Director y no hace daño; la Parca por\n  encima de su nivel no hace nada sin Llave; con Llave contra alguien superior\n  se tira como al mismo nivel; defensa social, mental y espiritual por defecto;\n  peligros sin atacante; +1 al daño si la pifia del defensor lo lleva a\n  critico; iniciativa con empates; cambio de zoom; tono por personaje.\n- Baul: Vinculos solo con PNJ; la Transformacion se paga (nunca gratis); el\n  Wyrd lo aprueba el Director y puede provocarlo. Recetas 16 y 17 sin «salida\n  alta». Las 16 Parcas sin precio cobran 1 o 4 Llaves.\n- La App: fichas en 1, Rejilla a 5·n², bote de 5 Llaves, Llave ancha que se\n  tacha, poderes del Acelerado con su precio, experiencia de salida.\n\n---\n\n## T177 · La vida vuelve cuando termina la amenaza\n\nEl autor: los puntos de daño no se restablecen al terminar un combate sino al\nterminar la amenaza. Manda la escena, y la escena la marca lo que se siente:\nsi se han sentido a salvo, aunque sea un instante, son dos escenas; si no, es\nla misma por muchos combates que haya. Las consecuencias no se curan por\nsentirse a salvo: piden curas, tiempo, hechizos o pociones. En 5.4 y en el\nAcelerado; fuera de combate sigue esta misma regla.\n\n---\n\n## T178 · La armadura del Acelerado\n\nEl autor: en el Acelerado la armadura ligera da +1 y la pesada +2 a la tirada\nde absorcion, si el arma deja absorber.\n\n---\n\n## T179 · Siete ideas y un capitulo para desenredar\n\nEl autor: casi todos los agujeros que encontraron las pruebas salian de no\ntener claros los principios, no de reglas que faltaran. «Todo lo que me has\npreguntado deberia salir solo de la logica del juego.» Se escriben arriba del\ncapitulo 2, en un recuadro, y se desarrollan en un apartado nuevo, 2.6\n«Desenredando», con las preguntas reales como casos:\n1. La Rejilla es escala, no habilidad, y casi nunca es humana (escalera Social:\n   el vampiro 2, las sirenas 3, Orfeo 4, los dioses de la locura 5; la estrella\n   del rock es un 1 con Llaves). Los unos abundan.\n2. Si algo da un permiso o rompe la Rejilla, tiene Llaves.\n3. La Parca es una Llave.\n4. Lo prestado y lo robado duran una escena, lo use quien lo use.\n5. «Contra todo» es la compra completa; «contra una cosa» es Limitado. Una\n   Disciplina contra todo cuesta 2·x²; con objetivo o solo para el daño, x²;\n   nunca mas que la Rejilla del ambito.\n6. Lo que hace una Llave lo dice la Llave: alcanzar lo de arriba, no ganar sin\n   tirar. El bazuca es Rejilla para el daño, no para acertar.\n7. Nada se invoca al margen de la mesa; las Llaves de un momento las establece\n   la ficcion y no se saltan la progresion.\nPrecios: Velo absoluto 8, Fuerza de sala 5, Fuerza de edificio 20, Oido y\nMando de multitud 2, el ejemplo Indetectable 8. El Acelerado lleva cinco de\nlas siete en un recuadro.\n\n---\n\n## T180 · La Llave te pone por encima; la limita lo que cubre\n\nCorreccion del autor a T179: una Llave SI te pone un nivel por encima, tambien\nde lo que estaba a tu altura. Lo que la limita es lo que dice. El bazuca es una\nLlave al daño: si te da, te revienta (no se aguanta a pecho), pero hay que\nacertar y se puede esquivar o buscar cobertura. Un misil teledirigido con tu\ncara en la memoria cubre el daño y el acierto: no se para ni se esquiva, y para\nsobrevivirlo hace falta otra Llave, que puede ser narrativa (la hacker que le\ncorta el guiado un segundo). «Armas contra zombis» te pone por encima de los\nzombis de tu nivel: ganas sin tirar. La superioridad numerica no «solo\niguala»: es una Llave de un momento, un nivel por encima en lo que cubre,\nmientras la ficcion la sostenga. Y la entrada de 2.6 deja de decir que el\nautor lo ve evidente: el tono no mira desde arriba.\n\n---\n\n## T181 · Las aclaraciones del autor\n\n1. El equipo siempre se puede devolver: lo vendes, se rompe o lo dejas, y sus\n   puntos y Llaves quedan libres. Lo de una escena no costo nada y no devuelve\n   nada. Traspasar: quien libera recupera, quien recibe paga.\n2. La Rejilla la sube el Director, por defecto a todo el grupo a la vez; nunca\n   un nivel entero a uno solo. Quien rechaza un salto que se le ofrece cobra su\n   valor, en ese ambito.\n3. «A salvo» lo declara el Director: peligro objetivo, no una sensacion.\n4. Todas las barras vuelven enteras al estar a salvo: la barra es tension, una\n   goma; la consecuencia es la grieta, y va a la ficha.\n5. Heredar la ficha (Sincronizacion) es para mechas, trajes y fusiones; un\n   vehiculo normal no hereda nada y cuesta como una Llave (1 a nivel 2, 4 a 3).\n6. La Parca es una Llave al daño: si te alcanza por debajo de su nivel, fuera\n   de combate sin absorcion; si se esquiva lo dice su etiqueta (la granada, −2\n   por el area; el francotirador que no ves, no). Las Parcas con Esq: Parcial\n   pasan a Difícil (−2).\n7. Las partidas de vampiros recomiendan empezar en Fisico 2 y Arcano 2; el\n   valor por defecto no cambia.\n8. Las consecuencias nunca desaparecen por escena: leves, cura sencilla;\n   graves, cura grave; lo decide el universo.\n9. En el Acelerado cuesta Llaves lo que rompe la Rejilla o da un permiso; la\n   App deja de tratar la escala como nivel de los personajes; caso nuevo en\n   2.6, el enemigo con ficha por debajo de ti.\nErratas: «El filo imposible» (se habia quedado «La el filo» y «bladeine»), y\nel Acceso de las Botas Magneticas y del Monoculo en ingles.\n\n---\n\n## T182 · Para todos, o su equivalente\n\nMatiz del autor a T181: la Rejilla no tiene que subir a todos por igual. Lo que\nimporta es que no se sienta injusto: si sube uno, los demas reciben lo\nequivalente (su propio salto, su valor en Llaves o lo que la historia les de).\n\n---\n\n## T183 · La primera poda\n\nUn lector repaso todas las reglas parche (T170-T182) y las clasifico: se deduce\nde una idea, se queda, no se deduce o contradice. Se aplicaron las que se\ndeducen: unas cuarenta pasan a una frase o a una remision, y se queda una sola\ncopia donde se usa. Arreglos de paso: la Transformacion «contra todo» a 2·x²,\n«nivel N en una Disciplina» en vez de «Rejilla N», y la receta 16 sin nombres\ncon copyright. Las que no se deducen o chocan quedan para el autor.\n\n---\n\n## T184 · Sesion 0, y la mesa manda\n\nCapitulo 0 nuevo, entre la introduccion y el capitulo 1 (no renumera nada):\nlas lineas de cada uno (no se impone nada que haga sentir genuinamente mal a\nnadie; no es votacion ni lista de temas; basta una; se puede decir en privado\nal Director; lo que aparece tarde se quita sin pedir permiso; lo que pesa se\npide antes), que vamos a sentir (emociones, que explorar y que aburre, zonas de\nla trama que se respetan, que soluciones pide el genero; se acuerda un rango de\ntono, no cada escena), quien propone (consenso, con el peso de quien hace el\ntrabajo duro), «esto no vale» (recordar lo pactado, no atacar), volver a la\nsesion 0, y la lista de numeros que salen de ahi. Version corta en el\nAcelerado (0.4), parrafo en La Idea, fila en el mapa rapido y glosario.\nRespuestas del autor a las seis preguntas de la poda:\n1. Regalos del Director (3.6): lo que la historia pone en vuestras manos como\n   planteamiento no se paga mientras la historia lo pida. La norma trabaja\n   para la mesa: se ignora cuando impide lo que la trama pide.\n2. El equipo siempre devuelve sus Llaves; perderlo no abarata nada. La\n   Sincronizacion paga el precio entero y es Limitada solo si no esta siempre\n   disponible (llegar, caber); lo decide la mesa.\n3. El techo es la Rejilla entera mas alta de un jugador. No frena Llaves: una\n   Disciplina contra todo puede pasar si el mundo lo hace posible (laboratorio\n   forense de un ciberpunk). Responde a «¿es posible en vuestro mundo?» y se\n   contesta en mesa; los de las recetas son propuesta.\n4. Las Llaves de un salto rechazado son libres.\n5. Las Llaves en blanco se quedan: no hay cortafuegos contra el combo barato;\n   lo frena la mesa (caso nuevo en 2.6).\n6. Las Llaves de un momento suben lo que diga la ficcion; las compradas, por\n   la escalera.\nEncima de las siete ideas: «antes de las siete, una: la mesa manda».\n\n---\n\n## T185 · Revisión final\n\nTres lecturas (coherencia de reglas, lector nuevo, paridad ES/EN y App). Arreglos:\nel traspaso devuelve las Llaves a quien libera; la Sincronización a precio entero\nen el 5.3 y el Bazar (exoesqueletos y armaduras motorizadas 20 Llaves, Limitado\n10; la Servoarmadura Antigua tenía la Rejilla sin precio); la Llave propia puede\nquedar en blanco; la idea 7 y la Llave prestada suben lo que diga la ficción; se\nquita «si solo sirve para una Firma, Limitado» (dividía dos veces); frase rota y\nnombres con derechos de la introducción pasados a arquetipos; pilar «cero\ncombos» → los bonos se acumulan y el Ancla corta en +4 (autor); en el 7.4, bajar\nal peor de dos solo si la sesión 0 lo permitió; «la mesa manda» en el cap. 2\nqueda en una línea; el Acelerado explica el techo y el puente Dominio/Disciplina.\nBloque REGLAS VIGENTES encima del canon para el asistente de la App, que cortaba\nen la bitácora y respondía con reglas retiradas.\n\n---\n\n## T186 · La IA, de cualquiera de los cuatro\n\nDecisión del autor: la App no se casa con un proveedor. Ajustes ofrece Google\nGemini (recomendado: cupo diario gratis con una cuenta de Google), Mistral\n(modo gratuito), OpenAI y Anthropic, cada uno con su clave y su modelo. La\nclave sigue sin salir del navegador más que hacia el proveedor elegido. Los\nmodelos van por alias estables donde existen y el campo es libre; si un nombre\ncaduca, «Probar la conexión» enseña los que tiene la clave. Aviso en los planes\ngratuitos: el proveedor puede usar lo enviado para entrenar. La sesión 0 no\nremite a guías de seguridad externas (autor: NOGUM es un pacto entre amigos,\nno la formación de un evento con desconocidos).\n\n---\n\n## T187 · Los expedientes\n\nFichas de ejemplo en el capítulo 8, tras las recetas: una por página, con los\ndos monederos a la vista y el porqué de las decisiones no obvias. Son los\npapeles que estudia la figura de La Idea: retrato de frente y de perfil, como\nuna ficha policial antigua, con una banda negra en los ojos que pone la página\n(igual en todas, a la altura de los ojos de cada foto). Prototipo: la vampira\nde la receta 13, que sale a Físico 2 y Arcano 2 con diez Llaves de experiencia\nde salida pactadas en la sesión 0 (rompe el 1·1·1·1·2 a conciencia, y se\nexplica). El lector gana la clase .nueva-hoja, que empieza página nueva.\n"</script>

/* dentro de cada tema, primero las reglas sin chicha y luego las que piden
   llevar un numero. El orden es el de "lo mas caracteristico del tema". */
var BAUL_ORD = [
 {light:[1,15,8], heavy:[0]},
 {light:[10,2,11], heavy:[3]},
 {light:[14], heavy:[13,6,7]},
 {light:[5], heavy:[9,12,4]}
];
function baulChicha(){ return sc1('baul','chicha') >= 3; }
function baulCero(){ return !baulChicha() && sc1('baul','insiste') > 0 && sc1('baul','insiste') <= 2; }
function baulCand(gi){ var o = BAUL_ORD[gi]; return o.light.concat(baulChicha() ? o.heavy : []); }
function baulDe(gi){ return baulCand(gi).slice(0, cuantas(sc('baul','t' + gi))); }
function aplicaBaul(){
  if (sinContestar('baul')) return;
  if (baulCero()) { setBaulMask(0); return; }
  var m = 0;
  BAUL_ORD.forEach(function(x, gi){ baulDe(gi).forEach(function(k){ m |= (1 << k); }); });
  setBaulMask(m);
}
function resBaul(gi){
  var on = baulDe(gi);
  return on.length
    ? {t:[on.length + (on.length === 1 ? ' regla' : ' reglas'), on.length + (on.length === 1 ? ' rule' : ' rules')],
       d:[on.map(function(k){ return DATA.baul[k][0]; }).join(', '), on.map(function(k){ return DATA.baul[k][1]; }).join(', ')]}
    : {t:['Ninguna de este tema','None from this theme'], d:['El núcleo se encarga.','The core handles it.']};
}

function pasosTono(){

function pasosUni(){

    if (M.world !== null && M.world !== undefined) p.push({t:'fin'});
    return p;
  }
  if (M.known !== false) return p;
  S_UNI.forEach(function(sec){
    if (sec.id === 'magia') p.push({t:'gate', g:'sobr', q:G_SOBR});
    if (sec.sup && !uniSobrOn()) return;
    for (var i = 0; i < 3; i++) p.push({t:'q', s:sec, i:i});
    p.push({t:'res', s:sec});
  });
  p.push({t:'one', g:'toon', q:Q_TOON});
  p.push({t:'fin'});
  return p;
}

    p.push({t:'gate', g:'insiste', q:G_INSIST});

  S_BAUL.forEach(function(sec, gi){
    for (var i = 0; i < 3; i++) p.push({t:'q', s:sec, i:i});

function bindPasos(fid){
  var v = $('view'), ps = pasos(fid), p = ps[S.st[fid] || 0];

  function marca(n){
    if (p.t === 'q') setAns(fid, p.s.id, p.i, n); else { S.q[fid] = S.q[fid] || {}; S.q[fid][p.g] = [n]; }
    aplica(fid); persist(); render(true);
  }
  v.querySelectorAll('[data-sc]').forEach(function(b){ b.addEventListener('click', function(){ marca(+b.getAttribute('data-sc')); }); });
  v.querySelectorAll('[data-scr]').forEach(function(r){
    r.addEventListener('input', function(){ marca(Math.max(1, Math.min(5, +r.value || 3))); });
  });
  v.querySelectorAll('[data-pk]').forEach(function(b){ b.addEventListener('click', function(){
    var x = b.getAttribute('data-pk').split('|');
    if (x[0] === 'known') { M.known = x[1] === '1'; M.family = null; M.world = null; M.unis = null; if (!M.known) aplicaUni(); }
    else if (x[0] === 'family') { M.family = x[1]; M.world = null; }
    else { applyPreset(+x[1]); S.q.tono = {}; S.q.baul = {}; S.st.tono = 0; S.st.baul = 0; S.ia = {}; }
    persist(); render(true);
  }); });
  v.querySelectorAll('[data-fsig]').forEach(function(b){ b.addEventListener('click', avanza); });
  v.querySelectorAll('[data-fat]').forEach(function(b){ b.addEventListener('click', function(){ S.st[fid] = Math.max(0, (S.st[fid] || 0) - 1); persist(); render(); window.scrollTo(0, 0); }); });
  v.querySelectorAll('[data-fcero]').forEach(function(b){ b.addEventListener('click', function(){ S.st[fid] = 0; persist(); render(); window.scrollTo(0, 0); }); });
  v.querySelectorAll('[data-fsal]').forEach(function(b){ b.addEventListener('click', function(){ aplica(fid); S.form = null; persist(); render(); window.scrollTo(0, 0); }); });
  v.querySelectorAll('[data-ia]').forEach(function(b){ b.addEventListener('click', function(){ pideLectura(b.getAttribute('data-ia')); }); });
  v.querySelectorAll('[data-iastop]').forEach(function(b){ b.addEventListener('click', function(){ if (iaCtl) iaCtl.abort(); }); });

function respuestasTexto(fid){
  var out = [];
  if (fid === 'uni' && M.known && M.world !== null) {
    return '- No ha contestado escalas: ha usado el atajo y ha elegido el universo conocido «' + KNOWN[M.world].n[0] +
      '», que aplica la receta de emulación nº ' + (KNOWN[M.world].r + 1) + ' («' + DATA.recipes[KNOWN[M.world].r][0] + '») entera.';
  }
  sectores(fid).forEach(function(s){
    var a = ans(fid, s.id); if (!a.length) return;
    s.qs.forEach(function(q, i){
      if (!a[i]) return;
      out.push('- [' + s.k[0] + '] «' + q.v[0] + '» → ' + a[i] + '/5 (1 = «' + q.a[0] + '», 5 = «' + q.b[0] + '»)');
    });
  });
  if (fid === 'baul') {
    [['chicha', G_CHICHA], ['insiste', G_INSIST]].forEach(function(x){
      var n = sc1('baul', x[0]); if (n) out.push('- [delimitar] «' + x[1].v[0] + '» → ' + n + '/5');
    });
  }
  if (fid === 'uni') {
    var n = sc1('uni','sobr'); if (n) out.push('- [delimitar] «' + G_SOBR.v[0] + '» → ' + n + '/5');
    var tn = sc1('uni','toon'); if (tn) out.push('- [comedia] «' + Q_TOON.v[0] + '» → ' + tn + '/5');
  }
  return out.length ? out.join('\n') : '- Todavía no ha contestado ninguna pregunta de este formulario.';
}

function pideLectura(fid){
  // la misma puerta que el resto de la IA: la de claude.ai o la de tu clave
  if (!sample || aiDenied) {
    S.ia[fid] = t('Esta lectura necesita la IA. Pega una clave en Ajustes: la de Google Gemini es gratis.','This reading needs AI. Paste a key in Settings: a Google Gemini one is free.');
    persist(); render(true); return;
  }
  var refresca = !!S.ia[fid];
  iaEstado[fid] = 'pensando';
  S.ia[fid] = '';
  iaCtl = new AbortController();
  var sig = iaCtl.signal;
  render(true);
  function pinta(txt){
    S.ia[fid] = txt;
    var box = $('iabox-' + fid);
    if (box) box.textContent = txt; else render(true);
  }
  Promise.resolve(sample).then(function(sample){
    if (!sample) {
      iaEstado[fid] = '';

      persist(); render(true); return;

      + '\n\nY esto es lo que el formulario ha deducido:\n' + resultadoTexto(fid)
      + '\n\nEscribe entre 60 y 110 palabras, en ' + (S.lang === 'en' ? 'inglés' : 'castellano')
      + ', en segunda persona del plural («vuestra mesa»), sin listas ni títulos. '
      + 'Di en una frase qué clase de mesa es esta. Y después, lo importante: si hay dos respuestas que tiran en direcciones opuestas, dilo claramente, di qué sabor raro produce la mezcla y qué respuesta movería yo. '
      + 'Si no hay contradicción, dilo en media frase y no la inventes. No repitas los números ni expliques las reglas: habla de cómo se va a sentir jugar ahí.';
    return sample(pr, {
      modelTier:'default',
      signal:sig,
      cache: refresca ? {gcTime:600000, refresh:true} : {gcTime:600000},
      onText: function(up){ iaEstado[fid] = 'escribiendo'; pinta(up.text); }
    }).then(function(r){
      iaEstado[fid] = '';
      S.ia[fid] = r.text + (r.truncated ? '\n\n' + t('(se ha cortado: pídeme menos de una vez)','(cut short: ask for less at a time)') : '');
      persist(); render(true);

    iaEstado[fid] = '';
    var c = e && e.code;

    else if (c === 'api') S.ia[fid] = t('La API de ','The ') + provNombre() + t(' ha rechazado la petición: ',' API rejected the request: ') + (e.message || '');
    else S.ia[fid] = (IAERR[c] ? pick(IAERR[c]) : t('No se ha podido leer. Vuelve a intentarlo.','Could not read it. Try again.')) + (e && e.text ? '\n\n' + e.text : '');
    persist(); render(true);

}
