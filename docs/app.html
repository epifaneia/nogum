tico; el crítico es el techo) y luego se comparan. LAS ETIQUETAS MANDAN SOBRE EL EMPATE: Esq Parcial obliga a un mínimo de 1 aunque empates; Esq Nula impide la reacción. Defensa con coste: reduce como éxito (−1) y el DJ cobra un precio. Doble pifia: manda la del atacante, no conecta. Consecuencia medida: con la Primera marcha y los dos a +1, el defensor iguala o supera el 68 % de las veces, así que los duelos con Esq Total se alargan y los tiroteos con Esq Nula o Parcial siguen siendo letales. Esto convierte las etiquetas de esquiva en la principal superficie de equilibrio del juego.\n- **ED-26 (el Estilo nunca cuesta)**: en las tarjetas con éxito con coste, esa banda se lee como éxito en la tirada de Estilo, porque el Estilo se tira cuando ya no se puede fallar. Resultados: pifia = lo consigues pero te ves ridículo (sin daño de estrés; se retira esa propuesta del borrador); fallo = lo consigues de la forma más olvidable, quizá nadie miraba; éxito = molas muchísimo; crítico = lúcete, describe la escena, y el DJ puede dar una ventaja temporal si encaja.\n- **Menú de la pifia (seis puertas)**: se cierra un camino · se gasta algo que no se repone · dejas un rastro · la amenaza se acerca un paso · se rompe lo que llevas · alguien se fija en ti. En la columna previsible la pifia CIERRA una puerta; en la caótica ABRE una rama. Misma frecuencia, distinto tamaño.\n- **La fila opresiva es material de simulación**, no una esquina teórica: la Angustia (9/25/49/81) reproduce la distribución de La Llamada de Cthulhu y Warhammer. Lo que allí vive en la ficha, aquí vive en la tarjeta, y por eso se puede entrar y salir del tono sin rehacer personajes. Diferencia clave: allí el especialista se escapa del pesimismo en su rincón; aquí no se escapa nadie, y por eso conviene el formato corto (como Ten Candles, Dread o Trophy).\n- **Tarjetas retiradas**: T0–T6 y las recetas del panel anterior quedan superadas por las siete. Su rastro se conserva en el Cuaderno de Diseño.\n- **Nombres (decididos por el autor)**: Épica · Pulp desenfrenado · Realista · Primera marcha · Bola de nieve · Angustia · Pesadilla. En inglés: Epic · Unleashed Pulp · Realist · First Gear · Snowball · Anguish · Nightmare. «Primera marcha» además indica uso: se explica la primera, se empieza ahí mientras no haya tono claro y se vuelve ahí cuando la partida cambia de terreno. «Tragedia» conserva su nombre para sus propios dados (receta).\n- **ED-22 (un nombre por idea)**: glosario cerrado. Cuadrante (el mapa de tonos), Ámbito (la capa de la pirámide), Rejilla (la escala de poder), [Rejilla] (la etiqueta de equipo), Guardia (antes «Disposición»), Banda (rango natural), Éxito con coste, Llave, Firma, Estilo, Vida fractal, Baúl frente a Bazar, Decorado. En inglés: Quadrant, Sphere, Power Grid, [Grid], Guard, Band, Success at a cost, Key, Signature, Style, Fractal Health, Chest, Set dressing.\n\n## 3. Capítulo 2 — El Ancla (Rejilla de Potencia)\n- 2.1 Competencia inmutable: Novato +0, Profesional +2, Gran Maestro +4 (la Nulidad −2 en Cap. 3). El +4 NUNCA cambia con el género (Luffy, John Wick, boxeador de barrio).\n- 2.2 Escala de impacto (texto del borrador + escala del autor T92–93, T134): «Si esto se descontrola al máximo, ¿qué sale en las noticias?»\n  - N1 Individual (La Habitación): 1 persona. N2 Táctico (La Oficina / El Grupo): una sala, decenas. N3 Operativo (Edificio / Barrio). N4 Estratégico (La Ciudad). N5 Geopolítico (La Nación; solo finales de campaña). N6 Cósmico: fuera de la Rejilla, se trata como DECORADO, no se tira (las reglas no prohíben jugarlo).\n  - Cifras de la «Regla del 20» DESCARTADAS (T93).\n  - Si no existe un ser vivo con ese alcance, lo ocupa una corporación, máquina… (T89).\n  - La escala es FIJA/absoluta; lo que varía por universo es qué niveles existen (T90).\n- 2.3 La Llave (texto del borrador): explicación narrativa para interactuar con un nivel superior (Conan dormido tras el festín; Batman y la kriptonita; hackers coordinados = nivel 5). Con Llave se tira con el bono completo y el tono de la campaña; NUNCA se penaliza (T28). Sin Llave es IMPOSIBLE. Llaves por ámbito (T137, aprobado en general): física (arma pesada, entorno letal, superioridad numérica: 20 mercenarios a la vez = nivel 2; los Rohirrim apuntando a la vez cuentan como UNO), mental (contraseña robada, un mes de preparación), social (vídeo del soborno, medio nacional), técnica (laboratorio, portátil conectado al mainframe, Industrias Stark). Conseguir una Llave suele exigir una escena de investigación o riesgo (T63).\n- 2.4 La Rejilla: cada personaje tiene un nivel POR ÁMBITO (Físico, Mental, Social, Técnico, Arcano). Ejemplo del rockero cyberpunk (Social 4, resto 1). Hacker con Técnico 1 + ordenador = Llave a N3. N3 técnico = construir/reparar algo del tamaño de un edificio.\n  - Ontología ≠ competencia (T91): no existe nivel 0; el 1 es un humano normal; la ontología gana a la competencia (Capitán América, N2, te escupe en cualquier deporte de contacto).\n  - La Malla no mide cerebros ni músculos: mide herramientas de partida y escala (T133). Para tener nivel X hay que ser competente en TODO el ámbito; destacar en una parte es una Llave. Walter White, Sherlock, Watson = N1 (Sherlock con aspecto metanarrativo); Tony Stark = N2 (máx. 3) sin Llave, tecnología N5 con la Llave Industrias Stark; Capitán América, Conan, Gimli = N2 Físico; Rick Sánchez = 5 «si no 6» (pendiente).\n  - Tecnología: permite a humanos corrientes romper techos; las herramientas tienen nivel propio (granada N2, bazooka N2, virus militar N3, traje de Iron Man N3) (T92).\n  - Sincronización (T36): al pilotar/fusionarse se hereda el nivel del vehículo y el DJ puede cambiar el zoom de daño a mitad de sesión (Asuka sube al EVA → 27 puntos, misma ficha).\n  - Rejilla inicial de los PJ: sin cifras cerradas. Por defecto, humanos = 1 en todo. Arrays del asistente ([1,1,1,1,1] / [2,1,1,1,1] / [3,2,2,1,1]) = propuesta sin validar. Subir de nivel de Rejilla (decisión del autor, 17 sep): NO cuesta puntos; sube con la campaña, pactado narrativamente. La Rejilla cambia el universo en que operas, no tu competencia; la competencia se mejora con bonificadores (pirámide), dones y lacras.\n  - Tabla «La Malla en la cultura pop» (T134, v3) aceptada como base con retoques pendientes del autor.\n- **El x100 (ED-29)**: cada nivel de Rejilla multiplica por cien el ALCANCE (a cuanta gente llegas, que tamano de problema tocas): x1 persona, x100 sala, x10.000 edificio, x1.000.000 ciudad, x100.000.000 pais. Es alcance, no literalidad (un Fisico 2 no levanta cien veces mas peso). Un nivel de diferencia son dos ceros, y por eso no hay tirada. Regla opcional sin validar: x10 por nivel para campanas de callejon.\n- **Techo de Rejilla por universo (ED-30)**: el nivel inicial lo pone la campana y el TECHO lo pone el genero. Cada una de las 20 recetas (8.4) trae su techo por ambito; en la app estan en la tabla TECHO. La Rejilla sube con la historia pero contra ese techo, y la Llave es la excepcion pactada («en cyberpunk no puedes tener un ingenio por cien, pero si el exploit que funciona contra esa IA»). Un techo de jugador no es un techo de mundo: los PNJ legendarios pueden estar por encima.\n- **Que cubre una Llave (ED-27)**: una Disciplina para siempre, **o** un Ambito entero durante una ESCENA (si la Llave es muy concreta). Se elige la forma al comprarla. La Llave ancha se ata a una escena, no a un enemigo.\n- **Llave propia y prestada (ED-28)**: propia = comprada (creacion o monedero), permanente, escrita con objetivo y nivel, pactada antes de empezar. Prestada = la da el DJ por trama o ingenio, dura una escena, no sube de nivel y NO se apunta. Traspaso: lo de un solo uso se declara; lo permanente se libera y el otro lo paga de su monedero. Regla de pulgar: «lo que se lleva en la mano se presta; lo que se lleva en la cabeza, no».\n- **Escalera de Llaves (ED-32)**: subir n niveles contra la misma cosa cuesta n^2 Llaves (1, 4, 9, 16, 25). Alternativa opcional, la escalera llana 3n-2 (1, 4, 7, 10, 13), que coincide en los dos primeros peldanos. Con las 5 Llaves del bote, nadie empieza por encima de +2.\n- 2.5 Síntesis: Bono = ANCLA; Rejilla = VELA.\n\n## 4. Capítulo 3 — Protagonistas\n- Sin atributos. Pirámide de 4 niveles de zoom (Malla → Dominio → Disciplina → Firma).\n- Malla (5 ámbitos: Físico, Mental, Social, Técnico, Arcano/Especial «El Flujo», que cambia según universo: magia, la Fuerza, psiónica). No se compra, no da bono.\n- Dominio (10, lista cerrada): coste 1, +1. Disciplina (40, lista cerrada, 4 por dominio): coste 1 (requiere el Dominio), +2. Firma (abierta): 1 punto = +3 (Experto), 2 puntos = +4 (Gran Maestro); requiere la Disciplina. Sólo se puede ser Maestro/Gran Maestro en cosas específicas.\n- Máximo por rama: 4 puntos. Dos firmas al máximo en la misma rama: 1+1+2+2 = 6; en ramas distintas 1+1+2+1+1+2 = 8 (T107).\n- Presupuesto: **12 puntos**, o **14** si el universo tiene Arcano (ED-31). La razon es la proporcion: sin magia hay 40 casillas (4 ambitos x 10) y con magia 50, asi que 12/40 y 14/50 dejan la misma escasez (~30 %). Los 10 puntos del borrador quedan SUPERADOS. Sigue siendo ajustable: «juega con los numeros».\n- **Bote aparte** (ED-31): ademas de los puntos, cada personaje recibe +1 nivel de Rejilla en un Ambito **o** 5 Llaves propias. No hay cambio entre los dos botes en ninguna direccion, para que no aparezca el heroe de Rejilla sin oficio. Economia: un nivel de Rejilla cubre 10 casillas por 5 monedas y una Llave cubre 1 por 1 — «la libertad se paga al doble».\n- Precio de las Firmas = ser Nulidad: cubrir los cuatro Ambitos cuesta 4 puntos y deja 8, que son exactamente dos Grandes Maestros. Lo que cuesta el agujero lo decide la TARJETA: 51 % lo saca adelante en Epica/Pulp, 36 % en Realista, 30 % en Primera marcha/Bola, 9 % en Angustia/Pesadilla.\n- Nulidad (T106): −2 SOLO si el ámbito entero está vacío. Si tienes cualquier punto en el ámbito, lo no comprado se tira a +0.\n- Cascada: se usa el nivel más alto aplicable (Firma → Disciplina → Dominio → +0 ámbito activo → −2).\n- Lista cerrada (borrador 3.1): Físico: DESTREZA (Atletismo, Acrobacia, Sigilo, Juego de Manos), VIGOR (Potencia, Entereza, Pelea, Armas). Mental: ERUDICIÓN (Ciencias, Humanidades, Ocultismo, Actualidad), INGENIO (Investigación, Alerta, Táctica, Supervivencia). Social: INFLUENCIA (Persuasión, Engaño, Empatía, Seducción), JERARQUÍA (Liderazgo, Intimidación, Contactos, Recursos). Técnico: ARTIFICIO (Mecánica, Electrónica, Biotecnia, Artesanía), OPERACIONES (Pilotaje, Vuelo, Sistemas, Seguridad). Arcano: DON (Proyección, Alteración, Adivinación, Protección), RITUAL («se define según campaña»; propuesta sin validar T142: Alquimia, Invocación, Encantamiento, Vínculos).\n- Saber vs hacer (T102): lo teórico es Mental (Biología en Ciencias); curar de verdad es Técnico (Biotecnia).\n- Firmas: «invéntatela»; amplias como las habilidades de otros juegos (Armas de fuego, no Francotirador ni un modelo concreto) (T98, T100, T49). Regla de oro: para ser Gran Maestro debes poder explicar exactamente qué haces. Catálogo masivo (~1.000: 5×5×40) en apéndice, organizado para mirar solo tu rama; categorización PENDIENTE (géneros descartados T143; propuesta del autor: por nivel tecnológico; opciones A/B/C del asistente sin elegir).\n- Stat ESTILO: +2 fijo, regalo del sistema, fuera de la malla, en todas las fichas completas (T113).\n- Magia = habilidad más; si tiene requisitos (maná…) se anota como lacra del campo (T54).\n- Aspectos (dones/lacras) y habilidades lentas [Lento]: capítulo PENDIENTE (T87); coste sin definir.\n- 3.4 Economía de la escasez: casos del borrador con ED-4 (Caso A: la rama Armas→Pistolas +3→+4 cuesta 3, no 4; la Firma +4 es la misma «Pistolas», no un modelo «Colt 45»; sobra 1 punto → Destreza +1).\n- Progresión: vertical (nivel de Rejilla) solo por Hito/cambio de arco; horizontal con XP (T63–64). Tesis del autor (T37): crecimiento rápido, bonus de XP por juego narrativo, XP fija en hitos. Capítulo de experiencia APLAZADO (tabla de costes PENDIENTE). Modificadores permanentes sólo cambian con XP (borrador 4.4).\n\n## 5. Capítulo 4 — Resolución\n- 4.1 Dificultad = modificador sobre la tirada (borrador del autor): +2 Fácil, 0 Estándar, −2 Difícil, −4 Heroico. El TN lo fija la tarjeta activa (6; 11 en Realista; 14 en Tragedia). Tabla de TN 4/6/9/12/15 del asistente DESCARTADA (ED-5).\n- Regla del éxito / límites: se suman habilidad + dificultad + equipo + efectos. Si el total cae por debajo de −2: el DJ decide tirar (a −2) o narrar el fallo. Si supera +4: el DJ decide tirar (a +4) o narrar el éxito (NOGUM recomienda tirada de Estilo). El total NUNCA sale de [−2, +4]. (Techo +6 del asistente DESCARTADO.)\n- 4.2 Peso de la competencia: Nulidad −2 (lastre; 1d10 vs TN6: de 50 % a 30 %), Ciudadano +0/+1, Profesional +2, Gran Maestro +4 (con 1d10 y TN 6 solo falla con el 1 natural).\n- 4.3 Equipo: Bonificador de calidad (+1/+2, sólo manufactura excepcional); Permiso narrativo (Llave): el equipo puede operar en otro nivel (bazooka = N2); Efectos (cajón de sastre: arma maldita que da fuerza y hace daño espiritual; sustancia que da reflejos y euforia). Ficha técnica en Cap. 5.\n- 4.4 Modificadores temporales (Aturdido, Inspirado, Dopado, Derribado; pueden ser bonos, llaves o efectos; siempre con condición de fin; el equipo da modificadores temporales porque desaparecen si no lo llevas) y permanentes (en la hoja; sólo se cambian con XP).\n- 4.5 Malla y Estilo:\n  - A. Salto de poder (T57): basta 1 nivel de diferencia. PJ > desafío: éxito automático, no se tira (se narra, o se tira Estilo). PJ < desafío: fracaso/inmunidad, no se tira; busca una Llave. [ED-6: el título «(+/−2)» del borrador es un resto; el umbral es ≥1.]\n  - B. Regla del Estilo (versión T113 = borrador 6.2 + resultados de 4.5): se activa contra enemigos por debajo de tu nivel o claramente decorado/masillas. Se da por hecho que ganas; tiras la tarjeta activa + Estilo (+2) para ver CÓMO: Pifia (ganas pero haces el ridículo; posible daño de estrés según cuánto se tome en serio el PJ), Fallo (ganas, pero sucio o sin lucirte), Éxito (con estilo, limpio, espectacular), Crítico (legendario: coreografía de cine, eliminas a varios, nacen rumores). No se resta vida a los masillas. [ED-7: el borrador 4.5 decía «diferencia 0 o 1»; se unifica con A.]\n  - Tono: el autor dice «no se recomienda en universos muy serios» (T113). Guía del borrador: encaja de lleno en anime, wuxia, space opera, cine de acción; desaconsejada en terror realista, drama bélico, survival (en Salvar al soldado Ryan hasta el último masilla tira). El Estilo se sitúa «como un sexto ámbito».\n  - Recuperar salud/estrés con el Estilo: propuesta sin validar.\n\n## 6. Capítulo 5 — El Peligro\n- Filosofía (nogum-pdf): combate sencillo y narrativo; SIN modos opcionales para hacerlo más táctico (eje narrativo–táctico: NOGUM está a la izquierda). Todo PNJ que interactúe debería tener ficha o pinceladas.\n- 5.1 Iniciativa por Disposiciones/Posturas (autor; «piedra preciosa», T129): nadie elige la acción de antemano, sí la INTENCIÓN: Violencia (de frente; tiras tu mejor habilidad de ataque; en tu turno puedes usar otra frontal y destructiva), Treta (lateral: engaño, sigilo, entorno, cachivache «del bolso de Doraemon»; se invita a ser flexible), Especialidad (pilotar, hackear, curar; sin margen: tu acción debe encajar como un guante). Se actúa de mayor a menor. Cambiar de disposición está permitido pero vas el ÚLTIMO (de la ronda en curso — ED-8). Por defecto todas las habilidades son igual de ágiles; si en tu universo no, esa habilidad lleva un aspecto negativo (siempre última / inutilizable en tiempo de conflicto). Iniciativa fija de PNJ (12/16): sin validar.\n- 5.2 Impacto vs Mitigación:\n  - Paso 1: el atacante tira contra el TN de la tarjeta activa, con los modificadores de dificultad por circunstancias del defensor (cobertura, niebla, tamaño). Ninguna habilidad del defensor da bonos aquí. Pifia: no conecta y puede volverse contra el atacante/un aliado/efecto adverso. Fallo: se pierde. Éxito: conecta, el daño «está en el aire». Crítico: conecta en zona vital: +1 al daño (T129: «la única matemática»).\n  - Paso 2: si la etiqueta del arma lo permite, el defensor tira UNA reacción (esquivar o absorber, la vía que el arma permita) con su habilidad de defensa contra el TN de la tarjeta. Fallo: todo el daño. Éxito: −1. Crítico: −2.\n  - Daño final = daño del arma (+1 si crítico del atacante) − reducción, con los límites de las etiquetas.\n  - Margen del atacante como dificultad de la esquiva (nogum-pdf/esbozo) DESCARTADO (T45, T129).\n- 5.3 Ficha técnica [Daño] [Esq] [Abs] (+ [Malla] cuando procede):\n  - Daño 1 (leve: puños, cuchillos, bajo calibre, caídas cortas; «urgencias»), 2 (serio: espadas de guerra, magnum, garras; «UCI»), 3 (masivo: explosivos, armas pesadas, magia de guerra, caídas letales; «a comer con San Pedro»).\n  - Esq Total (melé, proyectiles lentos): la reducción puede llegar a 0. Parcial (área, ráfagas, fuego): aunque mitigues, recibes como mínimo 1 [ED-9: el borrador decía «la mitad o un mínimo de 1»; se simplifica a mínimo 1]. Nula (instantáneos, mentales, francotirador sorpresa): no se puede esquivar. Valores «Difícil»/«Fácil» del Bazar: ED-10 → Difícil = −2 a la tirada de esquiva, Fácil = +2.\n  - Abs Total (la armadura es eficaz): la reducción puede llegar a 0. Máx 1 (martillos, perforantes): se reduce como mucho 1. Nula (láser, veneno de contacto, magia psíquica): no se puede absorber. «Máx X» = reducción máxima X.\n  - Malla: Estándar (no afecta a niveles superiores) / Llave (Nivel X) / Ignora todo (Vorpalina).\n  - Ejemplo de terror: francotirador [Daño 3][Esq: Nula][Abs: Nula].\n  - Tipos A/B/C (Sucio/Letal/Absoluto) y etiquetas [VELOZ]/[LETAL]/[ÁREA]/[INEVITABLE]: DESCARTADOS como formato (T68). «Jerarquía de la Inevitabilidad» queda como nombre del concepto.\n- 5.4 Vida fractal (Muñeca Rusa): 3 bloques > 9 casillas > 27 puntos. 4 estados: Sano, Herido, Crítico, Fuera de combate (el cuarto no se llama «muerto»). Zoom de letalidad: Nivel 1 La Cáscara (Letal; Hotline Miami; cada punto de daño tacha un bloque; 3 y fuera), Nivel 2 La Carne (Aventura; 9 casillas; daño 1–3 tacha casillas), Nivel 3 El Núcleo (Desgaste/anime/jefes; 27 puntos). En la ficha están los tres trazados; el DJ puede cambiar de zoom en plena partida (Sincronización). Truco del autor (T35): media X como recordatorio, se cierra la X al recibir daño; tachar el bloque grande permite ignorar lo de dentro.\n  - Los puntos se cuentan solo durante el combate; al terminar se restablecen, pero quedan las consecuencias (nogum-pdf).\n- 5.5 Sistemas de daño: misma barra para Físico (salud), Mental (estrés/cordura; también presión social) y Espiritual (corrupción/esencia; colapso = el PJ pasa a PNJ). ED-11: el índice del autor decía «Social»; el texto usa Mental; se mantiene Mental y el daño social/reputación se aplica a la barra Mental salvo que la campaña cree una barra propia (Honor en L5A, Reputación en supers). Combate social/mental (T137): interrogatorio (Intimidación → Daño Mental 1; bloque lleno = confiesa); ver un horror = [Daño Mental 2][Esq: Nula]; abogado (Persuasión/Engaño → Daño Social 2; vaciar la barra = pierde credibilidad).\n- Muerte (nogum-pdf + manifiesto): nunca por razones técnicas. Fuera de combate = incapacitado; no participa de ninguna forma; si despierta lo decide el tono o el jugador, NUNCA los dados. ED-12: donde el borrador dice «Colapso: muerte» o «Umbral 3: muerte, locura o transformación», se lee «fuera de combate; muerte/locura/transformación solo si se pacta narrativamente».\n- 5.6 Consecuencias por umbral (borrador): Umbral 1 (1.er bloque): −2 a acciones relacionadas (Físico: ojo hinchado, mano rota; Mental: temblor, duda; Espiritual: aura gris, mala suerte). Umbral 2: −4 y pérdida de capacidades complejas (hemorragia arterial = reloj de 3 turnos, pierna inútil; paranoia, alucinaciones; posesión parcial, vacío mágico). Umbral 3: fuera de la escena.\n  - Curación (nogum-pdf): partida sucia: umbral 1 horas/días, 2 días/semanas, 3 semanas/meses; implantes/pociones se los saltan. Batalla sin peso narrativo → consecuencias temporales. Batalla ligada a la historia personal → secuelas que solo cura otro arco.\n  - Menú de 4 costes del éxito parcial (T137): tiempo, recurso, posición, fuego amigo. Nunca «lo consigues pero pierdes 1 PV».\n\n## 7. Capítulo 6 — La Oposición (fichas)\n- Decorado (hormigas y dioses; sin ficha ni vida; solo función/nivel), Ficha Rápida (nivel de Rejilla + una etiqueta a +2, el resto +0; vida elegida por cuánto quieres que dure la pelea; por defecto 3 casillas), Ficha Completa (PJ y Gran Villano; sistema completo; Estilo +2). Recomendación: solo UNA ficha completa del DJ, la del antagonista principal (Firmas +4, Salud Fractal 27). «Puntos de Suerte» mencionados: sin definir.\n- Versión anterior de la ficha exprés (T58: una esquiva, una absorción, dos campos +2, una especialidad) → sustituida por la del borrador.\n\n## 8. Capítulo 7 — La Consola de Mezclas\n- 7.1 Diagnóstico: P1 ¿El universo tiene favoritos? (Sí, nosotros → Alto/mejor; No, a nadie → Neutro; Sí, a los monstruos → Bajo/peor). P2 ¿La física es fiable? (reloj → bajo; película → medio; locura → alto). ED-13: el borrador asocia Neutro a «Suma 2d10»; en el canon la suma es la herramienta de ORDEN (caos bajo); Neutro = 1 dado.\n- Test «¿por qué falla el plan?» (T60): pesimismo = el enemigo es competente y cruel (consistentemente malo); caos = algo absurdo (inesperado).\n- 7.2 Tono por defecto: Aventura Clásica (T0): 1d10, caos medio, daño nivel 2. «Piloto automático».\n- 7.3 Curva de crecimiento / Tres velocidades: campaña (recomendada para empezar), arco/sesión, escena (maestría). Tono por personaje (T7).\n- La señal: música como gatillo; llamada narrativa en vez de nombre técnico; Interfaz verbal (tabla técnico→narrativo; texto del asistente, concepto del autor).\n- Derecho a no cambiar (T60): no es obligatorio mover la consola.\n- Caja negra (T65): el jugador no necesita leer el manual; el DJ habla solo en narrativo («Tú declara acción y tira. Yo te cuento qué pasa.»). Exigente solo para el DJ: es una feature (T72).\n- 7.4 Disonancia: A risa en el terror (baja el optimismo: +2 vs TN 6 pasa de 91 % con mejor de 2 a 49 % con peor de 2 — ED-14 sustituye el «80 %→30 %» del borrador); B aburrimiento (sube caos y letalidad; «daño masivo»); C mesa cansada (La Mesa Manda).\n\n## 9. Capítulo 8 — Apéndices (estructura del autor, T117 y borrador)\n- 8.1 Baúl de reglas (relojes, flashbacks, etc.; cifras del asistente sin validar).\n- 8.2 Listado de skills (40 disciplinas + catálogo de firmas).\n- 8.3 Listas de equipo (Bazar del Multiverso).\n- 8.4 Simulación de manuales: 20 recetas (lista T127 = borrador), + receta de crítica/mejora (Mundodisco) pendiente de ubicar.\n- 8.5 NOGUM Acelerado.\n- Principio «sin trampa ni cartón»: las recetas solo usan piezas del manual. Se emulan LORES, no carcasas (no se emulan universales).\n- Índice «definitivo» del asistente (T145) con «Cap. 8 El Camaleón con 4 recetas» y «Apéndice B: 24 campos»: OBSOLETO respecto a la estructura del autor.\n\n## 10. NOGUM Acelerado (T76 + T135, última palabra T135)\n- Manual aparte, tipo Fate Acelerado, «un anuncio gigante» con preguntas-gancho hacia NOGUM.\n- Tono: SOLO 3 modos (T135): Épico = mejor de 2d10; Neutro = solo el dado rojo; Agobio (estilo PbtA) = peor de 2d10 + éxito parcial. Una sola TN (6). ED-15: bandas de Agobio propuestas por el editor = las de la tarjeta Pulp (≤5 fallo, 6–7 parcial, 8+ éxito) aplicadas al dado bajo — pendiente de confirmar. (Los «6 tonos/6 cartuchos» de T76–77 y la «dificultad casi siempre 11» quedan sustituidos.)\n- Cuestionario: preguntas para Optimismo y para Caos (poco/lo normal/mucho) y consulta a la tabla (T76). Con 3 modos solo el eje optimismo selecciona el modo; el caos se nota en Neutro vs Agobio.\n- Malla (Rejilla) sí se explica. Habilidades: sin lista afinada, solo ejemplos («¿No sabes qué skill poner? NOGUM te ayuda»). Vida: 9 casillas fijas (−2 al llenar el 1.er bloque, −4 al 2.º, fuera al 3.º). Iniciativa: tira Destreza (gancho hacia las disposiciones). Combate completo. Sin baúl, sin cambio por escena, sin explicaciones.\n- Cierre: «Ya tienes todo lo necesario para jugar a tu propio universo…».\n- TOC (T145): 0 Arranque (Promesa, Caja Negra) · 1 Selector de misión · 2 Reglas universales (tirada única, combate simplificado, masillas) · 3 Interfaz del Director · 4 ¿Quieres romper el juego? · Apéndice: hojas y pregenerados.\n\n<!-- BITACORA: de aqui para abajo es el diario de trabajo, no reglas. -->\n\n## 11. Añadidos posteriores\n- ED-16: la Disciplina Armas cubre cuerpo a cuerpo y distancia (armas de fuego, arcos).\n- ED-17: se retira el cálculo de esquiva por margen del atacante; mitigación = tirada fija contra TN (éxito −1, crítico −2).\n- Productos: Tesis filosófica (bilingüe), Juego completo, NOGUM Acelerado, App (consultas de reglas, buscador de tono, análisis de sesiones).\n- **ED-33. Los dos monederos**: la experiencia son dos bolsas independientes, puntos de habilidad y Llaves, con ritmos distintos acordados en la sesion cero. Cinco velocidades (quietos / +1 por arco / +1 por sesion / +2 por sesion / +5 por arco) y una segunda pregunta (todos por igual, o por meritos, y el merito SUMA encima de una base). Ritmo por defecto de Llaves: 1 por sesion. El monedero de Llaves es el mando de potencia de la campana, porque los puntos saturan en +4 y las Llaves no saturan nunca: «si quieres que la campana escale, abre el grifo de las Llaves, no el de los puntos».\n- **ED-34. Los tres cerrojos del equipo**: dinero (nivel de Recursos, escrito en la ficha tecnica como Acceso 0-3), permiso narrativo, y Llaves si el objeto rompe la Rejilla (cuesta el cuadrado del nivel al que llega: Llave N3 = 9 Llaves). Lo robado, prestado o conseguido en la ficcion funciona UNA ESCENA gratis; despues se paga o se deja. La Llave del equipo se puede perder; la Llave propia eres tu.\n- **ED-35. La lacra es la cicatriz de un bloque lleno**: los dones y las lacras no se compran, ocurren. Cuando se llena un bloque de la barra Mental o Espiritual y el personaje se cura, el -2 se va y queda una lacra con nombre (sin numero, con consecuencias). Jugarla en contra propia es una de las siete cosas que se premian.\n- Acceso del Bazar: los 294 objetos llevan Acceso derivado del dano y la rareza en una pasada (0 cotidiano, 1 arma seria, 2 militar, 3 lo que no deberia existir); el DJ puede mover cualquiera un escalon. Las tablas de poderes (Fuerza, ki, disciplinas, superpoderes, toon, arsenal social) NO llevan Acceso: describen lo que ya eres.\n- Acelerado: se lo lleva todo (12/14 puntos, bote aparte, Llaves compradas, x100). Los pregenerados gastan 12 (Kira, sin magia) y 14 (Tomas, Ysolde).\n- **ED-36. Tres monedas, tres cosas distintas** (el taller del Bazar, 8.3). Un objeto puede pedir hasta tres pagos y cada uno sale de su sitio: **Recursos** paga TENERLO (y con el las etiquetas: Dano, Esq, Abs, alcance), **puntos de habilidad** pagan que te haga MEJOR (cualquier bono a una tirada: +1 defender, +1 dar; 1 punto por +1, igual que la piramide), y **Llaves** pagan que te deje hacer lo IMPOSIBLE (permisos a 1 Llave, niveles de Rejilla a N^2). La cota de malla no tiene nada de extraordinario en su mundo: Recursos + puntos, cero Llaves. Los bonos de equipo son SUELO y no suma (cascada, se usa el escalon mas alto), el punto compra el papel y no la pieza concreta, y el equipo come de los 12/14 puntos: en partidas de poderes se sube el presupuesto, con el aviso de que mas puntos = menos especializacion.\n  - Dos pruebas: si una habilidad ya lo hace, no es poder, es bono (sentir mentiras = Empatia). Si te hace ganar a cosas de un nivel por encima, no es permiso, es Rejilla.\n  - Cuatro categorias: arma, defensa, vehiculo, artefacto (+ util para lo demas, que solo cuesta Acceso).\n  - Cajones de Recursos: −2 nada · +0 Acceso 0 · +1 Acceso 1 · +2 Acceso 2 · +3 Acceso 2-3 · +4 Acceso 3. Un escalon por encima una vez por arco, pagando con una complicacion (el tiron de Recursos).\n- **ED-37. El Ajuste**: lo que la cuenta no sabe decir. Limitado (÷2) · Completo (×1) · Potenciado (×2) · Desatado (×3), sobre puntos y Llaves, nunca sobre el Acceso. Redondeo hacia arriba y minimo 1. NO es un dial de cuatro potencias del mismo poder: es el corrector de lo que el desglose no ha pagado, y **solo paga lo que la cuenta no ha pagado ya**. Calibracion: cuantas escenas resuelve esto que no hayas pagado. Se pacta al comprarlo, se escribe al lado del poder y se puede volver a etiquetar si el juego demuestra que estaba mal tasado. Si algo pide mas de ×3, es un nivel de Rejilla no visto, o es decorado. Ejemplo canonico: capa de invisibilidad (1 Llave, Limitado) · invisibilidad a voluntad (2, Potenciado) · indetectable (Rejilla 3 = 9, Completo), donde se ve que la etiqueta se retira en cuanto la cuenta sabe describir el poder.\n- Bazar: 347 objetos (294 de ambientacion + 53 piezas genericas de las cuatro categorias con precio hecho), cada uno etiquetado con su categoria, e indice cruzado al final del apendice. En el Acelerado el equipo solo cuesta Recursos.\n- **ED-38. El acordeon** (regla del autor, recuperada de la conversacion): la maestria se pliega hacia arriba. **3 Firmas de Gran Maestro en la misma Disciplina** la convierten entera en +4; **3 Disciplinas plegadas** pliegan el Dominio; **los 2 Dominios** pliegan el Ambito. No sube el techo (el Ancla sigue cortando en +4): lo ensancha, quitando huecos del mapa. Precios: 8 puntos una Disciplina (Dominio 1 + Disciplina 1 + 3 Firmas a 2), 22 un Dominio (8 + 7 + 7), 44 un Ambito (2x22). Con 12 puntos en creacion cabe una Disciplina plegada y poco mas. Es la escalera larga de los puntos, como la escalera cuadrada lo es de las Llaves: **las Llaves suben hacia fuera** (x100 de alcance por peldano) y **los puntos hacia dentro** (el +4 se ensancha). El 3 es el unico numero ajustable del acordeon.\n- Arcano cerrado (decision del autor): Don = Proyeccion, Alteracion, Adivinacion, Proteccion. Ritual = Alquimia, Invocacion, Encantamiento, Vinculos. Es la lista que ya usaba la app.\n- 8.2 trae el catalogo de **200 Firmas** (5 por Disciplina, bilingue), ordenado por Ambito y Disciplina; con eso se cierra la pregunta de como agrupar el catalogo. Y cap. 8 trae **seis tablas de problemas** por genero (heridas graves en dos sabores, enfermedad, locura con aviso de mesa, lo que se pierde con los tres nombres de la barra Espiritual, fallos de equipo y mutaciones), que son ejemplos y no un sistema.\n- **ED-39. El nombre lo pone el genero; la barra la pone la causa.** Hay tres barras y no mas: Cuerpo (fisico: heridas, agotamiento), Mente (cognitivo: cordura, estres, voluntad) y Espiritu (sobrenatural). Un genero puede rebautizar una barra, pero no elegir de cual cuelga. Caso canonico, por decision del autor: la **Humanidad** es ESPIRITU en el gotico (hay una Bestia dentro, alguien que no eres tu) y MENTE en cyberpunk (la ciberpsicosis es una locura, no una posesion). Mismo nombre, casi el mismo efecto, distinta barra, y por eso distinta curacion y distinto final. Reparto: Cordura/Estres, Empatia/Ciberpsicosis, Identidad y Honor/Reputacion van a **Mente**; Humanidad/la Bestia, Corrupcion y Sombra van a **Espiritu**; Sangre/Hambre y Fatiga/Suministros van a **Cuerpo** (la Sangre es combustible, no es la Bestia).\n  - Corolario: **si en el mundo no hay Arcano, no hay barra Espiritual** (no esta vacia: no existe, igual que el Ambito). Lo que seria Espiritu cae en Mente y la mesa pacta si esa barra puede retirar una ficha. Afecta a las recetas 8 (Empatia) y 9 (Identidad), que pasan de Espiritual a Mental.\n- **Seis decisiones del autor (12 oct)**: (1) NO existe la variante x10 de la Rejilla; un salto de diez es lo que ya separa -2 de +4, y si el x100 se sale de madre se deja a todos en Rejilla 1 y se juega con los puntos; para lo de en medio esta la Llave pequena. (2) Reparto inicial **[2,1,1,1,1]**, y el 2 es el UNICO que el universo permite (el techo de la receta dice cual); si no se quiere ese 2, **5 Llaves**. Eso afina el bote aparte: el +1 de Rejilla ya no es libre. (3) La tabla de la Rejilla en la cultura pop queda aprobada. (4) Un critico de Estilo **no cura**: el estres se negocia, nunca automatico, y el efecto lo decide el DJ con el jugador. (5) **Nada de iniciativa fija** para PNJ: tirada enfrentada con la habilidad de la disposicion, y las masillas llevan numeros basicos. (6) **Siempre se absorbe con la habilidad**, con armadura o sin ella; lo que modula son las etiquetas del arma (Abs: Max N / Nula) y los bonos de la proteccion.\n- Correccion de ED-39: la **Sed/Sangre** del gotico NO es combustible ni va en Cuerpo. Es **ansia**, el estres de una adiccion, y va en **Mente**: se juega como un sindrome de abstinencia (cuanto mas llena, peor mides el riesgo y mas barato sale ceder; al llenarse, frenesi). Los manuales viejos la trataban como piscina de puntos; aqui se juega como el mono. La Bestia sigue siendo Espiritu.\n- **Acta del taller (12 oct), aplicada entera.** Reglas: los puntos de suerte del villano NO existen (gasta Llaves); el poder metanarrativo del detective es **una Llave** (una pista por escena); **[Lento]** = esa habilidad no sirve para tirar iniciativa; el **flashback se tira** (exito = ocurrio; cada punto por encima del TN da un detalle mas; pifia = el pasado te delata); la **transformacion** termina siempre al acabar la escena; el **dano ambiental sube con la exposicion** (1, 2, 3 por escena, y el contador vuelve a cero al salir); los **vinculos** escudan la barra que decida el universo (en gotico, tambien la Espiritual). Recetas: en ciberpunk la barra Mental se llama **Humanidad** (mismo nombre que en gotico y distinta barra, que es justo lo que ED-39 ensena); en gotico **no hay escalera de Generaciones**: todos los vampiros son Rejilla 2 en lo sobrenatural y en Fisico, un humano sin Llave pierde automaticamente, y para distinguir neonato de matusalen se dan **Llaves**, no niveles; la **Identidad** (mentes digitales) nunca retira la ficha: hay terapia y vuelves siendo otro personaje, y perder la ficha solo pasa en partidas cortas con ese final pactado.\n- **El barrido de marcas, hecho.** 94 nombres con dueno sustituidos por eufemismos transparentes elegidos por el autor en el taller, en los dos idiomas: las diez ambientaciones del Bazar (La mazmorra y la estepa, La Ciudad de Neon, Pulpos antediluvianos, Opera de Estrellas, Post-Apocalipsis, Artes marciales brillos y gritos, Horror Gotico, Capas y mallas, El Oeste Extrano, El Mundo Animado), las lineas Ref de las 21 recetas, los personajes de la tabla de cultura pop y los objetos con nombre propio. De ~1.170 menciones quedan 28, todas seguras: el genero «cyberpunk», la palabra «paranoia» como condicion, 1984, Chernobil y el cóctel Molotov. Los titulos del autor van ya junto al titulo paródico en las recetas 1, 2 y 13.\n- Aviso de proceso: **la Tesis se regenera en cada compilacion desde p_tesis_es/en.html** (make_covers.py). Cualquier cambio hecho sobre p3_tesis_* se pierde. Editar siempre el p_.\n- **Las veinte, cerradas (12 oct).** Sale la 15 («Cazadores adolescentes»): repetia la leccion de la 14 —gente corriente que no puede tocar al monstruo hasta encontrar su Llave— y una de las dos sobraba. Entra **«El mundo sostenido por quelonios» como receta 20**, con su diagnostico intacto, porque ademas de critica es de las que mas se juegan. La seccion de critica y mejora pasa a tener la del ciberpunk: el genero pedia Bola de nieve y se emulo con un motor realista y letal, y con esas reglas la mesa aprende que lo rentable es no arriesgar. La letalidad no se quita, se mueve al zoom (La Cascara) y a las etiquetas.\n- **La Regla del Margen queda muerta** (decision del autor). El acordeon ya hace ese trabajo: la maestria se nota ensanchando el +4, no bajando la banda de critico.\n- Bazar: 366 objetos. El Mundo Animado se completa a 30 (seis armas de tienda de bromas y cinco poderes) y el arsenal social sube de 8 a 16.\n- Marcador de disposición (autor, 17 sep): la ficha completa lleva un marcador Violencia/Treta/Especialidad; si la mesa no elige antes de actuar, vale el último marcado. La ficha de Acelerado no tiene disposiciones (iniciativa = mejor bono de Destreza).\n\n## T124 · Cierre de las veinte recetas y de tres piezas\n\n- **Receta 15 expulsada** («Cazadores adolescentes»). Renumeradas 16-20 -> 15-19,\n  incluidas las columnas «Recetas» del Baul y las lineas `<em>Recetas:<\/em>`.\n- **«El mundo sostenido por quelonios» es la receta 20** (favorita del autor).\n  Sale de la seccion de critica y entra en el cuerpo, con su diagnostico intacto.\n- **Nueva critica y mejora: «Alta tecnologia, baja esperanza, dados equivocados»**\n  (ciberpunk). Diagnostico: un motor realista y letal hace que lo rentable sea no\n  arriesgar. Solucion: Bola de nieve; la letalidad se mueve al zoom La Cascara y a\n  las etiquetas. Regla de oro: la factura. Con esas dos criticas basta.\n- **La Regla del Margen queda muerta** (decision del autor, T123). El acordeon\n  (ED-38) ya hace ese trabajo. No queda ninguna mencion en los productos.\n- **Tres piezas escritas por el asistente a peticion del autor**: 8 armas sociales\n  (arsenal 8 -> 16), 11 objetos del Mundo Animado (19 -> 30) y la ficha de critica\n  del ciberpunk. Sus banderas de «propuesta sin validar» pasan a `src` T124.\n- **Bug cazado al paso**: la nueva seccion `ch8-tablas` se colo entre `ch8-baul` y\n  `ch8-skills`, y `extract_app_data.py` contaba sus `<h4>` como reglas del Baul\n  (23 en vez de 16), lo que habria roto la mascara de 16 bits del Codigo de mesa.\n  El extractor ahora corta en `ch8-tablas`.\n- **Banderas vivas: 10** (todas notas de procedencia o ilustraciones, ninguna\n  decision pendiente del autor).\n\n## T125 · Tres formularios en la app\n\n- **El formulario unico se parte en tres**, con un repartidor (hub) que los abre\n  en escalera segun el estado: sin mesa -> solo el 1; con mesa -> el 2; con mesa\n  y ficha -> el 3.\n  - **1 · El tono**: universo, edicion, tarjeta, peligro y escala (secciones 0-4\n    + resumen). Las cuatro paginas del Baul salen de aqui.\n  - **2 · El contexto**: siete preguntas sobre la ficcion (los planes, el fallo,\n    lo de dentro, el cuerpo, el precio, el subidon, el sitio) que **recomiendan**\n    reglas del Baul y las activan, cada una con su por que literal («lo pide tu\n    respuesta: \"...\"»). Si hay receta conocida, entra por una pantalla previa que\n    ofrece su paquete ya hecho («Me vale asi» / «Afinar con preguntas»). Las\n    dieciseis siguen accesibles en «Ver las dieciseis»: lo recomendado es un\n    punto de partida, no un limite.\n  - **3 · El equipo**: abre **siempre** por «¿Para quien es?» (incluso con una\n    sola ficha: es lo que ensena que el equipo es de alguien), sigue por el arbol\n    de cuatro preguntas del buscador, y acaba en **la cuenta**.\n- **La cuenta ensena las tres monedas (ED-36) y solo resta dos**: puntos y\n  Llaves se descuentan del total de la ficha; el **Acceso no se resta**, se mide\n  contra el nivel en Recursos del personaje y sale como semaforo (a tu alcance /\n  con una tirada o un favor / fuera de tu alcance / no se compra con dinero).\n  Restarlo habria convertido el Bazar en una tienda de compra por puntos.\n- **El equipo no viaja en el Codigo**: el Codigo es la capa de mesa (tono +\n  reglas) y el equipo es capa de ficha. Formato del Codigo sin cambios.\n- **El motor de recomendacion ya existia**: `KNOWN[20]` traia el paquete de cada\n  receta y `TECHO` los techos. No se escribio heuristica nueva.\n- Arreglado al paso: `keysGear` solo reconocia «N Llaves» en plural, asi que al\n  corregir «1 Llaves» -> «1 Llave» en el bazar (6 objetos) habria dejado de\n  contar esas Llaves. La expresion acepta ahora el singular.\n\n## T126 · Cuatro formularios de escalas (1 a 5)\n\nEl formulario unico se parte en **cuatro modulos**, y las preguntas dejan de ser\ntecnicas: casi todas son **situaciones** con dos polos escritos en prosa y cinco\npasos entre ellos. El contador **no se ensena** mientras se contesta; suma por\nsector y solo se ve el resultado al cerrar el sector.\n\n- **Tres preguntas por sector**: dos situaciones muy distintas (redundantes a\n  proposito) y una frase final que dice en voz alta el extremo alto de la escala.\n  Minimo 3, maximo 15. Bandas: <=7 bajo, 8-10 medio, >=11 alto. Para las escalas\n  de cinco peldanos (nivel tecnologico, Rejilla) se reparte 3-4 / 5-7 / 8-10 /\n  11-13 / 14-15.\n- **1 · El tono** saca lo que pidio el autor: **caos, optimismo y barra de vida**,\n  mas el Estilo. Cuatro sectores, doce preguntas. El Acelerado se queda en dos.\n- **2 · El universo** (antes «el contexto», renombrado por el autor). Atajo\n  primero: con un universo conocido se acaba en dos toques y se aplica la receta\n  entera. Si no, siete sectores de escalas: el metal (cinco peldanos\n  tecnologicos), la magia, lo que acecha, el cuerpo, las palabras, el mundo roto\n  y las hazanas, mas una pregunta suelta de comedia. Los tropos deciden la epoca:\n  no se pregunta por el ano.\n- **3 · El Baul** empieza **delimitando**, como pidio el autor: «¿te gusta la\n  chicha?». Un primer no quita de un plumazo las ocho reglas que piden llevar un\n  numero; se insiste con otra pregunta, y un segundo no rotundo deja la partida\n  con **cero** reglas extra y lo explica («el nucleo ya es un juego completo»).\n  Si pasa el portal, cuatro temas de tres preguntas, y la puntuacion decide\n  **cuantas** reglas del tema entran, siempre en orden: primero las narrativas,\n  luego las que piden numeros.\n- **4 · El equipo** sin cambios (para quien -> arbol -> la cuenta).\n\nPeso de las dieciseis reglas (el reparto sale solo y es ocho y ocho):\n- **Sin chicha** (se dice una cosa y pasa): flashbacks, pacto del diablo,\n  destino, el DJ tira en oculto, transformacion, sincronizacion, vinculos,\n  menu de los cuatro costes.\n- **Con chicha** (todas anaden un numero que hay que llevar): relojes de\n  progreso, dano explosivo, Rejilla mistica inversa, fundas, clones, barras\n  propias, tablas de dados, dano ambiental.\n\nDecisiones tomadas al construirlo:\n- **El hueco del Cuadrante se reparte con el contador**, no con otra pregunta:\n  si el caos se quedo en el borde alto de su banda tira a la vecina caotica.\n  Una pagina menos y se cambia en la barra.\n- **Una receta conocida manda sobre el tono y el Baul** hasta que el Director\n  contesta de verdad una pregunta de esos formularios: elegir mundo limpia esas\n  respuestas, y `aplicaTono`/`aplicaBaul` no escriben nada si estan en blanco.\n- **La edicion sale de los formularios** y vive en el repartidor, porque decide\n  que formularios existen.\n- **El modelo de lenguaje no escribe nota bajo cada respuesta.** Eso mataria el\n  ritmo (un toque por pregunta), lo pagaria el que abre la app y, sobre todo, no\n  debe ser indeterminista: lo que implica una respuesta es consecuencia de\n  reglas y esta escrito a mano. El modelo entra **al final de cada formulario**,\n  a peticion, para lo unico que no se puede escribir de antemano porque es\n  combinatorio: **buscar contradicciones entre respuestas**. Con progreso real\n  (5-60 s), streaming por `onText`, boton de parar y copia de error por codigo.\n- Arreglado al paso: `extract_app_data.py` metia el texto de las banderas y de\n  las notas de procedencia **dentro del nombre** de secciones, bloques y objetos\n  (se vio porque «10. El Mundo Animado» paso a llamarse «... Escrito a peticion\n  del autor (T124)»). Ahora esos `<span>` se borran con su contenido antes de\n  leer el nombre.\n- El texto del nivel tecnologico sale de `uniName()` y no escrito a mano, que ya\n  habia quedado desfasado («La Ciudad de Laton» no existe: es «El Oeste\n  Extrano»).\n\n## T127 · Las preguntas, en su forma buena\n\nCorreccion del autor: **los puntos de 1 a 5 eran el andamio del contador, no la\ninterfaz**. Quedaban rarisimos en pantalla. Dos formas de preguntar:\n\n- **Cinco opciones escritas** cuando el matiz merece prosa. Los dos extremos ya\n  estaban; se han escrito los **tres de en medio**, que es donde vive el matiz\n  (de «se cae y ya» a «hay un toldo y detras una ventana abierta», pasando por\n  «se cae, pero cae mal, no muerto»). Veinticinco preguntas, setenta y cinco\n  opciones nuevas, bilingues.\n- **Barra deslizante** cuando es estar de acuerdo o no: las dieciseis frases de\n  cierre y la de la comedia. Polos a los lados, el valor en grande debajo\n  («Muy en desacuerdo» … «Muy de acuerdo») y, sin contestar, el tirador en gris\n  y un aviso en vez de un valor. Se puede tocar cualquier punto de la barra, asi\n  que el centro se alcanza sin arrastrar.\n\nY, tambien del autor: **elegir ya no avanza solo**. Habia demasiado falso\npositivo con el auto-avance de 300 ms. Ahora se elige, se ve lo elegido marcado,\ny se pulsa «Siguiente», que esta apagado hasta que hay respuesta. Vale igual\npara las paginas de eleccion directa del atajo (universo conocido, familia,\nmundo). El aviso se dice una sola vez, en la primera pregunta de cada\nformulario.\n\n## T128 · Buscador de palabra clave en el equipo\n\nLa primera pregunta del formulario de equipo quedaba rara: debajo de «¿Hace\ndano?» habia una frase informativa («no hace falta saber el nombre del objeto»)\ncolocada entre la pregunta y el Si/No, con lo que parecia una opcion elegible.\n\n- **El buscador va primero**, antes del arbol: una caja de texto que busca en el\n  **nombre** y en **lo que hace** cada objeto (descripcion, dano, esquiva,\n  absorcion, acceso, bloque y universo), siempre dentro de las secciones que la\n  mesa tiene abiertas. Sin acentos y sin mayusculas: «canon» encuentra «Canon de\n  Mano». Varias palabras: todas tienen que aparecer. Ordena primero lo que\n  coincide en el nombre y luego por Acceso, y ensena los sesenta primeros.\n  Si sale a la primera, la busqueda ha terminado.\n- **El arbol se queda** como segunda via, detras del boton «No se como se llama ·\n  buscalo por lo que hace», y sus cuatro preguntas ya no llevan la frase suelta:\n  la cabecera dice «Por lo que hace · 1 / 4» y debajo solo estan Si y No.\n- Lo elegido **sobrevive a cambiar de busqueda**: se puede buscar «escudo»,\n  marcar dos, buscar «cuerda», marcar otro, y la cuenta lleva los tres.\n- Tecnico: la caja no pierde el foco al escribir porque solo se repinta el\n  contenedor de resultados (`#eqres`) y los clics van por delegacion, en vez de\n  volver a dibujar la vista entera.\n\n## T129 · Revision completa\n\nDos fallos encadenados, los dos hijos de expulsar la receta 15 sin arrastrar las\ntablas que la citaban por numero:\n\n1. **Los techos de Rejilla estaban desplazados** de la receta 15 en adelante.\n   Seis recetas llevaban los techos de la de al lado y «El mundo sostenido por\n   quelonios» no tenia los suyos. En la practica: a los dioses en pijama se les\n   capaba a Rejilla 2 y a los superheroes se les daban los techos del torneo de\n   artes marciales.\n2. **Seis de los veinte mundos del atajo ensenaban la receta equivocada**, y el\n   mundo del instituto con caza de monstruos apuntaba a la receta expulsada.\n   Ademas faltaba un mundo para la receta 20.\n\nArreglado de raiz, no a mano:\n- **Los techos salen del manual.** `extract_app_data.py` los lee de la linea\n  «Techos de Rejilla» de cada ficha impresa y los escribe en `app_data.json`.\n  La tabla copiada a mano dentro de la app ha desaparecido.\n- **Una receta es la que lleva numero**: las fichas de critica ya no pueden\n  desplazar la lista si alguien las mueve de sitio.\n- **El mundo huerfano sale y entra «Un mundo plano a lomos de una tortuga\n  gigante»** (receta 20), que estaba sin representar. Los veinte mundos vuelven\n  a ser una permutacion exacta de las veinte recetas.\n- **El constructor lo comprueba y revienta si se vuelve a romper**: en\n  `build_app3.py` hay tres asertos (tantos techos como recetas, Baul de 16, y\n  los mundos como permutacion exacta). Probado rompiendolo a proposito.\n\nOtras cosas de la revision:\n- **Un enlace inventado**: `#ch1-cuadrante` no existe; el ancla buena es\n  `#ch1-ejes`. El ensamblador ya lo decia en su linea `missing=[...]`, que yo\n  habia estado filtrando al construir. Leccion: no filtrar la salida del\n  ensamblador por `errors=` y `KB`.\n- **La bitacora deja de ser canon para el asistente.** `CANON.md` lleva 59 KB y\n  un tercio es diario de trabajo (ficheros, arreglos, nombres de scripts). El\n  asistente de reglas de la app lo leia entero, asi que a quien preguntaba por\n  el acordeon se le podia contestar con el arreglo de un script. Ahora hay una\n  marca `<!-- BITACORA -->` y el asistente corta ahi. El fichero sigue entero.\n- **Codigo muerto fuera**: `UNIVERSES`, `isHole()` y `curKey()`, huerfanos desde\n  que el hueco del Cuadrante dejo de ser una pagina.\n- **Maquetacion, medida**: 15 hojas de 172 se pasan, entre 2 y 12 px. Tesis 0 de\n  13; Juego 9 de 106; Cuaderno 2 de 38; **Acelerado 4 de 15**, que es el peor\n  porcentaje y por donde habria que empezar.\n- Repasado y sin problemas: enlaces internos (0 rotos en los cinco productos),\n  el Baul cubierto por los dos repartos sin solapes, la escalera x100, el coste\n  de Llaves n al cuadrado, los recuentos del Bazar contra su tabla resumen, los\n  nombres sin fugas de banderas, y los veinte mundos probados uno a uno en el\n  navegador sin un solo error de consola.\n- **Marcas**: quedan dos menciones de «Lovecraft» en el capitulo 1, usadas para\n  describir un tono, no un producto. Decision del autor si se quedan.\n- **El nombre del producto en el que ya estas** era un enlace a `#portada`, y\n  ese ancla solo existe en el Cuaderno: en los otros tres era un enlace muerto.\n  Ahora es un `<span aria-current=\"page\">`. Al cambiarlo se colo un fallo de\n  especificidad en el CSS (la regla base era mas especifica que la del producto\n  actual y el texto quedaba gris sobre fondo oscuro); corregido y comprobado en\n  los cuatro.\n\n## T130 · NOGUM se presenta como un pack de cinco\n\n- **Las cinco piezas se enlazan desde las cinco.** La barra de arriba llevaba\n  tres manuales (y el Cuaderno solo dentro del Cuaderno) y no mencionaba la app.\n  Ahora lleva Tesis, Juego, Acelerado, Cuaderno y App en todas, con la pieza en\n  la que estas marcada y sin enlace.\n- **El pack se presenta en la portada de cada producto**: las cinco numeradas,\n  con una linea de que es cada una, la que estas leyendo resaltada con «estas\n  aqui». Bilingue. El bloque se inyecta al ensamblar (`con_pack`), que es quien\n  sabe en que producto esta y si los enlaces van a ficheros locales o a los\n  artefactos publicados.\n- Dentro de la portada, que es oscura, el pack se tine con `currentColor`: con\n  los colores normales las descripciones quedaban en gris sobre fondo casi\n  negro, ilegibles.\n- Comprobado: el pack **no desborda ninguna portada** en ninguno de los cuatro\n  productos ni en ninguno de los dos idiomas.\n\n### Correccion sobre lo que dije de la maquetacion\nLas cifras de la revision anterior estaban **mal medidas**: las tome mientras el\npaginador seguia construyendo hojas, asi que salian a la mitad. Medidas ya con\nel recuento estabilizado:\n\n| Producto | Hojas | Se pasan | Peor |\n|---|---|---|---|\n| Tesis (es y en) | 13 | **0** | — |\n| Juego es | 147 | 25 (17 %) | 11 px |\n| Juego en | 210 | 35 (17 %) | 12 px |\n| Acelerado es | 15 | 4 (27 %) | 12 px |\n| Acelerado en | 15 | 5 (33 %) | 11 px |\n| Cuaderno es | 38 | 2 (5 %) | 10 px |\n\nSigue siendo recorte de menos de una linea, pero es uno de cada seis y no uno de\ncada doce. El Acelerado es el peor y la Tesis esta perfecta: lo que distingue a\nla Tesis es que casi no tiene tablas, asi que el sospechoso son las cajas y las\ntablas. Para medir esto hay que **esperar a que el recuento de hojas se\nestabilice**; si no, se mide a medias.\n\n## T131 · La Parca, el Torpe y la Firma a +4\n\nTres decisiones del autor, con los numeros delante.\n\n### El tope de dano de un arma es 2, y lo que esta por encima no es un arma\nEl bazar se habia construido con techo 3: **47 objetos** se saltaban la regla, en\nlas doce secciones. No se baja todo a 2: se parte en dos categorias.\n- **26 armas de mano** bajan a Dano 2. Un espadon no es la muerte segura cuando\n  una pistola hace 1; lo que separa un arma de guerra de un cuchillo son sus\n  otras tres etiquetas, no un numero mas grande.\n- **21 objetos son la Parca**, y salen de la escala de dano. No es un valor: es\n  un acontecimiento. Artilleria, explosivos de guerra, un coche a toda\n  velocidad, el aliento de un dragon.\n- Frase del autor, literal en el manual: **«el dano que tiene sentido tirar»**.\n\n**La regla**: cada Parca lleva un **nivel de Rejilla**. Por debajo de el no hay\ntirada: mueres. A su altura o por encima, hace **Dano 2**. Es la misma frase del\n2.4 (por debajo es imposible, la Llave es la excepcion pactada), aplicada al\ndano. No hace falta inventar un numero nuevo: se reutiliza el x100.\n- El canon de riel es Rejilla 2, y la receta de ciberpunk tiene techo Fisico 2:\n  el supersoldado cromado es justo quien lo aguanta. El ejemplo del autor sale\n  solo de los techos ya escritos.\n- **Existe en las cuatro barras.** La social te mata la cara, la mental la\n  cabeza, la espiritual lo que lleves dentro. No vacia la barra: la **tacha**.\n- En el Mundo Animado tambien mata, durante dos vinetas.\n- Cinco Parca grandes nuevas en el catalogo generico, hasta Rejilla 5.\n\n### Torpe (-1): la columna vacia\nAntes, tocar un Ambito quitaba la nulidad de **todo** el Ambito. Ahora quita la\nnulidad de **tu columna**: el otro Dominio del mismo Ambito se tira a **-1**.\n- Se descarto «la Mana» por evocar lo contrario (quien tiene mana sabe), y «a\n  contrapie» por largo. **Torpe** es corto, plano y no se puede leer en positivo.\n- **Torpe no es ignorante**: quien nunca lo ha intentado tira +0. Torpe es peor\n  porque tienes el ambito con la mitad equivocada.\n- Lo que midio la decision: una ficha especialista pasa de **0 casillas en\n  negativo a 24 de 40**. El punto en que el especialista iguala al generalista\n  sube del 12 % al 65 % de tiradas dirigidas. Con el -2 completo por columna\n  subia al 73-81 %, o sea que **invertia el incentivo**: el generalista ganaba\n  siempre. El -1 conserva el peso sin volver tonto al que se especializa.\n- Subir el presupuesto **no** arregla esa inversion (de 12 a 20 puntos mueve el\n  resultado del 43 % al 44 %): el problema no es el dinero, es que una columna\n  cerrada se lleva cuatro casillas de golpe.\n\n### La Firma salta de +2 a +4\nFeedback de las pruebas: **no hay +3**. Una Firma es la cima de su Disciplina o\nno es una Firma, y cuesta siempre 2 puntos.\n- Lo que gana la Firma se duplica: Epica +5 -> +8, Bola de nieve +10 -> +20,\n  Angustia **+15 -> +32**. Lo que mas crece es lo oscuro, que es justo donde el\n  manual dice que hay que especializarse para sobrevivir.\n- Arrastre: 32 filas de +3 fuera de las tablas de probabilidad, las escaleras de\n  Recursos y del Acelerado recompuestas, el glosario, el acordeon («tres Firmas»\n  en vez de «tres Firmas de Gran Maestro») y **los dos ejemplos trabajados del\n  capitulo 3**, que ahora ademas ilustran el Torpe: el heroe de accion esta\n  Nulo en Social y Arcano y **Torpe en Destreza, Erudicion y Artificio**.\n- El +3 del capitulo 2 se queda: ese es la escalera de Llaves (+3 = 9 Llaves =\n  x1.000.000), no la de competencia.\n\n### De paso\n- **«One Piece»** sobrevivia al barrido de marcas en el capitulo 2, dentro de un\n  parentesis que glosaba el nombre sustituido. Fuera.\n\n## T132 · Color por capitulo, hueco de figura, y por que no hay ilustraciones\n\n### La maquetacion no estaba rota (correccion mia, la tercera)\nMedi que se recortaba de verdad: **13 de 21 paginas son tablas, y lo que sobra\nson 0,10 a 0,35 de linea** — el borde inferior de una tabla y un poco de\nrelleno. En las muestras que inspeccione una a una, el ultimo bloque **termina\npor encima del limite**: lo que contaba como desbordamiento era el margen\ninferior, que no se ve. **No se pierde una sola linea legible en ningun\nproducto.** Habia estado dando porcentajes cada vez mas precisos de un fantasma.\nPuesta `.sb > *:last-child{margin-bottom:0}` para que la metrica deje de mentir.\n\n### Color por capitulo\nCuatro familias con una escala cada una: el motor (azules), la ficha (verde), la\nmesa (ambares y rojos), los apendices (grises y violetas apagados). Se usa en\nhilos finos — el filete de la cabecera, el titulo corriente, la raya del h2 y el\nnumero de pagina — **nunca en el texto ni en fondos**. Es para saber donde estas\nal pasar paginas, no para decorar.\n\nTecnico: el paginador **mudaba el id de la seccion a su h2 y se lo quitaba a la\nseccion**, asi que cuando el color intentaba leerlo ya no existia. Se guarda en\n`data-cap` antes de que lo borren, y cada hoja lo lleva.\n\n### El hueco de figura\n`.fig` con proporcion reservada (16:9, 4:3, 1:1, 3:1) y pie. Reserva su sitio\naunque el dibujo no exista, para que el dia que llegue no haya que remaquetar.\n\n### Y por que no hay ilustraciones (decision del autor)\n**Toda imagen lleva tono.** Dibujar a un guerrero decide si el libro promete\nepica, miseria u otra cosa; no hay forma de ilustrar sin elegir. Un manual cuyo\nargumento entero es que *el tono es un mando y lo pones tu* no puede decidirlo\npor el lector en la portada. La ausencia pasa a ser **una postura declarada en\nla Tesis**, en los dos idiomas.\n\nCorolario operativo: lo unico dibujable en el nucleo son **diagramas**, el\nsistema explicandose a si mismo, porque un esquema no cuenta una historia. *El\nCuadrante dibujado es el Cuadrante; un orco dibujado ya es un genero.* Si algun\ndia hay arte, ira en las recetas, que si tienen tono porque ese es su trabajo.\n\n## T133 · La vida fractal se renombra\n\n**Letal (3) · Táctico (9) · Guerra (27)**, en vez de La Cáscara / La Carne / El\nNúcleo.\n\nEl diagnóstico de por qué no se entendían: los nombres viejos describían **dónde\nestaba la cámara** —la muñeca rusa— y al jugador le da igual la cámara, quiere\nsaber cuánto aguanta. Y encima la metáfora **invertía la intuición**: «núcleo»\nsuena a lo más pequeño y era la vida más larga. Los nombres nuevos dicen qué le\npasa al personaje y se ordenan solos.\n\n- 49 nombres cambiados en manual y app, en los dos idiomas. En la app el número\n  va al lado: *Letal (3)*, *Táctico (9)*, *Guerra (27)*.\n- **Las claves internas no se tocan** (`cascara`/`carne`/`nucleo`): alimentan el\n  campo Z del Código de mesa, y cambiarlas habría roto los Códigos ya repartidos.\n- `frag_trazabilidad.html` conserva los nombres viejos a propósito: es el\n  archivo de lo que decía el canon en su momento.\n- De paso: «Daño Masivo» era el nombre del viejo Daño 3 y se había quedado\n  huérfano al crear la Parca. Atado al nombre nuevo en las cinco menciones.\n\n### Y el desplegable de la Rejilla\nFuera los multiplicadores de la barra: ahora dice `1 · Una persona … 5 · Un\npaís`. El ×100 sigue donde se explica, en el formulario y en los recordatorios.\n\n## T134 · La tarjeta deja de llamarse Bola de nieve\n\n**Comedia negra** (en ingles *Black comedy*). Dos motivos del autor: el nombre\nviejo **nombraba una regla** —la escalada— en vez de un tono, y encima era el\nnombre que le da **otro manual**. El resto de tarjetas son generos o estados de\nanimo (Epica, Angustia, Pesadilla, Tragedia); esta desentonaba dos veces.\n\n**Por que comedia, si muchas recetas que la usan son sombrias.** Razon del\nautor, y no es la que yo propuse: un mundo asi frustra **por dos sitios** —nada\nsale limpio, y lo que hay debajo suele ser feo—. **La tarjeta carga solo una\nfuente de frustracion, la que mas pesa**, y la otra la traen la **vida Letal** y\nel trasfondo. Por eso un ciberpunk sombrio y una comedia de enredo usan la misma\ntarjeta sin contradecirse. Enlaza con el aviso que el manual ya repite varias\nveces: los mundos pesimistas rozan lo injugable, pero tienen su rincon, porque\nesto es un manual universal.\n\n**Por que no Noir**, que yo habia propuesto como alternativa: noir **converge**\n—el detective que llega a la conclusion exacta, el hilo que tira hacia dentro de\nla madriguera— y esta tarjeta **dispersa**. Evoca lo contrario.\n\nLa imagen del autor, ahora en la ficha de la tarjeta: *no es una bola que crece\nhacia alguna parte, es una hoja al viento que pelea por posarse en cualquier\nsitio y no lo consigue.*\n\n- 79 nombres cambiados en manual y app, en los dos idiomas.\n- **La clave del Codigo no se toca**: la tarjeta sigue siendo `BOLA` por dentro y\n  `TBOL` en el Codigo de mesa, asi que los Codigos ya repartidos siguen valiendo.\n\n## T135 · El Cuaderno sale del pack\n\nDecision del autor: **un «como se hizo» antes del estreno no informa, presume**.\nNadie ha jugado todavia, asi que treinta y ocho paginas sobre nuestras propias\ndecisiones editoriales solo le interesan a quien las tomo.\n\nTres cosas objetivas que lo apuntalan: es **el unico producto sin version\ninglesa** (o sea, no esta escrito para un lector); en el pack sale con **el mismo\nrango que la Tesis y el Juego**; y **documenta el barrido de marcas nombre a\nnombre**, que como gesto de buena fe esta bien pero publicado es un mapa de lo\nque habia antes.\n\n- El pack pasa a ser de **cuatro piezas**: Tesis, Juego, Acelerado y App.\n- El Cuaderno **sigue existiendo y sigue enlazando a los demas**; en su propia\n  barra y en su propia portada se sigue contando (cinco piezas). Simplemente no\n  se anuncia desde fuera.\n- Es reversible: una lista en `assemble3.py` (`PIEZAS`).\n- Si algun dia vuelve, deberia volver reescrito: **comentario de diseno** en los\n  dos idiomas y para quien ya ha jugado, no diario de trabajo.\n\n## T136 · Primer feedback de lectura del autor\n\nCatorce cambios, todos de la primera lectura del manual.\n\n**El aparato editorial sale de los manuales.** Las notas ED-xx, los «Descartado»,\n«Pendiente» y «Propuesta del asistente» ya no se publican en la Tesis, el Juego\nni el Acelerado: el lector no tiene por que saber que estaba en duda. Se queda\ntodo en el Cuaderno, que es su sitio. Se hace al ensamblar (`limpia_editorial`),\ncon dos reglas: si un bloque **empieza** por una bandera es una nota entera y se\nborra el bloque; si la bandera va al final de una frase util, se borra solo la\nmarca.\n\n**Correcciones de texto**\n- «Optimismo no es caos» -> **«Pesimismo no es caos»**: el recuadro contrasta\n  optimismo *bajo* con caos alto.\n- **La pifia no es una complicacion mas pequena.** Correccion del autor: pueden\n  pesar lo mismo. Una pifia es **fallo + complicacion**; un exito con coste es\n  **exito + complicacion**. Lo que cambia es si ademas conseguiste lo que querias.\n- **«Cada cuanto el DJ tiene que inventar algo»** no servia: el DJ inventa\n  siempre. Ahora es **cada cuantas tiradas la historia se sale de lo previsible**,\n  con el por que: una mesa aguanta mucha sorpresa en una sesion y bastante menos\n  a lo largo de veinte.\n- **El [2,1,1,1,1] se lee mal.** Ahora dice explicito que hay mundos que **no\n  permiten ningun 2** (un realista, unos zombis) y que ahi todos empiezan en\n  [1,1,1,1,1] y se llevan las 5 Llaves. El 2 no es una obligacion de colocarlo:\n  es la escala que el universo deja alcanzar.\n- **«Regla de la Nulidad»** -> **«Regla de la Nulidad y la Torpeza»**, y el\n  recuadro del coste pasa a ser **«Los dos peajes»**, reescrito a la luz del -1.\n- **3.2** avisa de que las listas largas las acota la app, y que el manual esta\n  escrito para no tener que consultarlas.\n- **Las Llaves iban al reves.** Una por sesion es **rapido**, no lento. Y la\n  razon: en NOGUM **el equipo se compra con Llaves**. La recomendacion es subir\n  antes Llaves que puntos, porque los puntos maxeados borran la especializacion\n  y los papeles del grupo, mientras que las Llaves te hacen grande **en lo tuyo**.\n- **4.2** le faltaba el **Torpe (-1)**: del 50 % al 40 %, y al 16 % en Angustia.\n- **«Risa nerviosa en el terror»** -> **«Risas comodas»**. La risa nerviosa es el\n  terror funcionando; el sintoma es la risa del que sabe que no le va a pasar nada.\n- **Fuera «las palancas que existen y no usamos»**: como el Cuaderno, es mirarse\n  el ombligo. Si vuelve, es material de Tesis.\n\n**Maquetacion**\n- La primera columna de las tablas tenia 26 mm y no cabia ni «optimista»: ahora\n  34 mm y sin partir palabras.\n\n**Restos del tope de dano**\n- El **Acelerado** tenia su propia tabla con Dano 3 y sus ejemplos: pasados a la\n  Parca.\n- El ejemplo del francotirador del 5.3 y el **dano ambiental** (que escalaba a 3\n  en la tercera escena, ahora **la Parca**: seguir ahi te mata).\n- Prosa del bazar con auto-dano 3 -> 2.\n\n**Dos destrozos mios, reparados**\n- Al borrar «las palancas» me lleve por delante la nota **«Que hace una pifia»**,\n  que vivia dentro de la misma lista. Restaurada, con la redaccion nueva y en un\n  sitio que tiene sentido.\n- `w_indice2.py` **anade** el indice sin quitar el anterior: habia **dos** en el\n  bazar castellano y dos en el ingles, y el viejo arrastraba los Dano 3. El\n  ensamblador lo caza con `dups=[...]`. **Al regenerar el indice hay que borrar\n  la seccion vieja primero.**\n\n## T137 · La Sala de Maquinas se dibuja\n\nEl autor, leyendo: «Sala de maquinas: traete las graficas del taller, y elimina\nlas tablas enormes infumables.»\n\nLas tablas que se van del manual (las cifras siguen enteras en el Apendice D):\n\n- **Seccion E**, dos tablas de 11 y 20 filas, duplicadas del Apendice. Una de\n  ellas ya intentaba ser una grafica: traia barras de texto «relativas al valor\n  mas frecuente de su columna». Ahora es una grafica de dos paneles a la misma\n  escala: las cuatro lecturas sobre 1-10 y la suma sobre 2-20. El panel doble\n  demuestra lo que la seccion afirma: ninguna barra de la suma pasa del 10 %,\n  el mejor de dos llega al 19 %. Orden no es sacar numeros altos; es que casi\n  nunca salga una sorpresa.\n- **Seccion H**, las siete tablas de 7 filas, tambien duplicadas del Apendice.\n  Cada tarjeta conserva su `<h4>`, su linea de Regla y su parrafo de «Por que\n  encaja» (ese analisis no esta en ningun otro sitio) y cambia su tabla por la\n  misma tabla dibujada: una barra apilada por bono, con lo que sale adelante al\n  margen derecho.\n- **«Cifras corregidas»**, 16 filas de trabajo editorial. Fuera: «no metas\n  mierdas de ediciones en el manual». La fila del registro editorial que\n  apuntaba ahi ahora dice «aplicadas en todo el libro».\n\nAdemas, en la seccion H se anade una grafica nueva de las siete curvas juntas.\n**El color es la fila del Cuadrante y el trazo es la columna** (continuo\nprevisible, a rayas neutral, punteado caotico), y eso hace visible algo que\ncatorce tablas escondian: tres curvas estan debajo de otra. Epica y Pulp,\nPrimera marcha y Comedia negra, Angustia y Pesadilla coinciden bono a bono. Es\nel eje del caos dibujado: no cambia *cuanto* sale adelante, cambia *de que esta\nhecho*. Y el eje del optimismo se estrecha con la ficha: 42 puntos entre Epica y\nAngustia con la ficha a -2, 18 puntos con la ficha a +4. Un especialista en\nAngustia acierta tanto como un especialista en Comedia negra, que es la doctrina\ndel autor («especializate para sobrevivir») demostrada en una linea.\n\nLos numeros salen de `curvas.py`, validado contra el Apendice D del propio\nmanual: 42 filas comparadas, 0 discrepancias. El modelo lee las bandas de pifia\ny critico **sobre los dados, antes de sumar el bono**, que es por lo que una\npifia sigue siendo pifia con cualquier bono.\n\nUn diagrama no lleva tono: es el sistema dibujandose a si mismo. Por eso entra\nen el manual sin romper lo acordado en T132 («toda imagen lleva tono»).\n\n**Trampa para el proximo que dibuje algo:** los estilos de un SVG no pueden ir\nen un `<style>` dentro del propio SVG. El buscador del libro indexa\n`sheet.querySelector('.sb').textContent`, y `textContent` incluye el texto de\nlos `<style>`, asi que las reglas CSS acaban dentro del indice de busqueda. Las\nreglas viven en `paper.css` bajo `svg.nog .clase`, y cada grafica lleva\n`class=\"nog\"`.\n\n## T138 · El reparto: el quinto formulario\n\n«Hay que hacer fichas rapidas y de decorado. Formularios para crear fichas de\nPNJs. A la app.»\n\nEl manual ya tenia las tres fichas (6.1-6.4): decorado, rapida y completa. Lo\nque faltaba era hacerlas sin pensar. Quinto formulario, **El reparto**, con el\nrotulo «el Director» porque es el unico que no es de la mesa ni de la ficha.\n\nTres preguntas y ya:\n\n1. **Para que lo necesitas.** Escrito como escenas, no como tipos de ficha:\n   «esta ahi para que la escena tenga a alguien» / «va a dar problemas esta\n   sesion» / «es EL antagonista». La tercera no abre formulario: te manda a la\n   ficha plantilla, porque al nemesis se le trata con las mismas reglas que a\n   un PJ y solo deberia haber uno en la mesa.\n2. **Que pinta tiene frente a vuestro grupo.** El nivel de Rejilla no se\n   pregunta en abstracto: se pregunta contra el grupo, que es para lo unico que\n   sirve. Por debajo / a vuestra altura / por encima.\n3. (Solo la rapida) **Que hace bien** —una etiqueta, +2 en ella y +0 en todo lo\n   demas— y **cuanto quieres que dure la pelea**: 3, 9 o 27 casillas. Con la\n   frase del manual delante: no elijas su vida por lo fuerte que sea «de\n   verdad»; elige cuanto quieres que dure.\n\nLa ficha sale con el **veredicto de la Regla del Estilo** escrito. Y ahi se\ncorrigio un fallo mio: 6.2 dice «contra el decorado **y** contra todo lo que\neste por debajo de tu nivel». Son dos condiciones, no una. Yo habia programado\nsolo la del nivel, y entonces un guardia anonimo en una campana de Rejilla 1\nsalia como «pelea de verdad». Ademas, manda la intencion del Director, no el\nnumero: si dice «por debajo» en una campana de Rejilla 1, la Rejilla no puede\nbajar mas pero el veredicto se mantiene, y la ficha lo dice.\n\nEl reparto se guarda en la maquina, como las fichas, y **no viaja en el\nCodigo**: el Codigo es la mesa, no el casting.\n\n## T139 · La musica, sin inventarse una lista\n\n«MUSICA!!! La app va a tener musica ambiente gratuita para cada una de las 7\ntarjetas!!! Las piezas a ojo por el titulo (son muy explicitas en las emociones\na veces). En bancos de musica sin derechos.»\n\nHecho, pero **no como lista de canciones**. Una lista de enlaces a piezas\nconcretas se muere sola: los enlaces caen y las licencias cambian sin avisar.\nLo que no caduca es el metodo que describe el propio autor: en los bancos de\nmusica libre los titulos dicen la emocion sin disimular, asi que se elige a ojo\npor el titulo.\n\nEntonces cada tarjeta trae **tres terminos de busqueda exactos** y los bancos\ndonde teclearlos:\n\n- **Pixabay** (`pixabay.com/music/search/<terminos>/`): gratis y sin pedir\n  creditos. Verificado: «quirky pizzicato» da 11.946 resultados, «slow dread»\n  20.784, con titulos del tipo «Shadows of Dread».\n- **Free Music Archive** (`?quicksearch=`): conviven licencias distintas, asi\n  que la app avisa de poner el filtro de licencia antes de descargar.\n- **Incompetech** (Kevin MacLeod): no se puede enlazar filtrado porque el\n  filtro es un boton de su propia pagina, asi que la app da el nombre exacto\n  del «Feel» que hay que pulsar (Epic, Action, Calming, Relaxed, Humorous,\n  Somber, Eerie). Ahi hay que acreditar al autor, y se dice.\n\nSe busca en ingles porque asi estan indexados esos bancos, y se dice tambien.\nEl panel cuelga de la barra de escena, no del formulario, porque sigue al\n**tono de la escena**: si cambias de tarjeta a media sesion, cambia la musica.\nY la app deja claro que la licencia de cada pieza es la que diga su pagina, no\nla nuestra.\n\n## T140 · Una ficha por tarjeta, y el Apendice deja de ser una copia\n\nEl autor, viendo las primeras graficas: «las tablas mas interesantes del taller\nno estan. Las que hay, se entienden muy bien y quedan chulas. ESAS. Una tabla\npor cada tarjeta. Tarjetas mas grandes, con un poco de color, y su grafica.»\n\nLa seccion H pasa de siete barras apiladas a **siete fichas**, con el color de\nsu fila del Cuadrante (verde optimista, azul neutral, rojo opresiva) y la\ngrafica del taller dentro:\n\n- **Dos lineas gruesas**: lo que sale adelante y lo que no, con la cifra escrita\n  en cada bono.\n- **Tres lineas finas**: critico, coste y pifia. Cuentan de que esta hecho el\n  resto, que es lo que la curva de «sale adelante» no puede decir.\n- **La raya de «cambia de bando»**: el punto exacto en el que la tarjeta cruza\n  el 50 %. Epica no la tiene (nace en 51); Angustia y Pesadilla la cruzan tarde.\n- **Cuanto le toca inventar al DJ** (pifia + coste), que es la carga real de\n  mesa y no sale en ninguna tabla: Epica 1 %, Realista 3 %, **Comedia negra\n  40 %**. Esa cifra sola explica por que la columna caotica no es para todas las\n  mesas.\n\n### La pregunta del Apendice D\n\nEl autor pregunto si el Apendice se habia vuelto redundante. La respuesta, con\nlos numeros delante: **dos tercios si, un tercio no.**\n\n- Las siete tablas repetian los numeros del capitulo 1 **y ademas su encabezado\n  y su linea de regla**. Esa duplicacion de marco se va.\n- Pero la grafica dibuja las cinco lineas y **solo escribe una cifra**, la de\n  «sale adelante». Los otros treinta y cinco numeros por tarjeta estan ahi como\n  posiciones, no como digitos. Para *comprobar* un numero hace falta la tabla;\n  para *reconocer* una tarjeta hace falta la grafica.\n\nAsi que el Apendice no sobraba: estaba mal presentado. Ahora su intro dice\nexactamente eso y las tablas estan **generadas desde `curvas.py`**, no escritas\na mano.\n\n### Lo que aparecio al regenerarlas\n\nA la tabla de **Tragedia le faltaba la fila de +3**. Iba -2, -1, 0, +1, +2, +4.\nLas seis filas impresas cuadran con el modelo sin una sola discrepancia; la que\nfaltaba es 3 / 42 / 0 / 52 / 3, sale adelante **55 %**.\n\nY Tragedia, que es la unica tarjeta que no esta en el Cuadrante porque no cambia\nla lectura sino **la vara**, pasa a tener su propia ficha con grafica, en el\nApendice. Eso es lo que termina de justificar que el Apendice exista: es donde\nvive la octava tarjeta. Su prosa dice lo que la grafica ensena: la misma lectura\nque la Realista con la TN tres puntos mas alta no baja un tercio, baja a la\nmitad (28 % en vez de 55 % a bono 0), porque la campana castiga el doble cada\npaso que alejas la meta de su centro.\n\n**Un fallo que casi se cuela:** la linea fina de «critico» estaba dibujando el\n**exito**. `reparto()` devuelve (pifia, fallo, coste, exito, critico) y yo lei\nel indice 3 en vez del 4. Lo canto el propio dibujo al mirar los textos\nemergentes: «critico -2: 33 %» en la Realista, cuando su critico es 3 % en los\nsiete bonos. Si alguien toca esto, los indices son 0 pifia, 1 fallo, 2 coste,\n3 exito, 4 critico.\n\n## T141 · La etiqueta se elige, y la Rejilla no se lee sola\n\nDos correcciones del autor sobre el formulario del reparto (T138).\n\n### «No tan abierto. Un ambito entero a +2. Y a elegir. No a escribir.»\n\nLa ficha rapida daba una casilla de texto libre para la etiqueta\n(«Francotirador», «Negociador», «Tanque»), que es lo que dice 6.3. Fuera. Ahora\nse elige **uno de los cinco Ambitos enteros**: Fisico, Mental, Social, Tecnico o\nArcano, cada uno con sus dos Dominios a la vista. Dentro de ese Ambito, +2;\nfuera, +0.\n\nUn Ambito entero es mucho y es a proposito: un PNJ rapido no se defiende con\nmatices, se defiende con una sola idea clara. Si lo necesitas bueno en dos, es\nuna ficha completa.\n\nEl manual se cambio para que no contradiga a la app: 6.1 («un Ambito entero a\n+2») y la segunda pregunta de 6.3. Los nombres de oficio que estaban ahi\n(«Francotirador») pasan a ser lo que el Ambito parece en mesa, no la mecanica.\n\n### «La rejilla es RELATIVA a la party»\n\n«Rejilla 2 puede ser un cyber psicopata muy superior al grupo, o un piccoro de\nDB que no hace nada a los guerreros Z de unos arcos mas adelante.»\n\nEl formulario imprimia **«Rejilla 2 · Una sala llena · ×100 — Pelea de verdad»**,\nque lee como si el 2 fuese un rango absoluto y la escala (×100) fuese el\nveredicto. Las dos cosas son falsas. Arreglado en tres sitios:\n\n1. El numero **nunca aparece solo**: siempre «Rejilla 3 · uno por encima de la\n   vuestra (2)». La escala (×100, un edificio) se etiqueta como **Alcance**, que\n   es lo que de verdad mide, y se separa del veredicto.\n2. El veredicto de una ficha guardada **se recalcula contra la Rejilla actual\n   del grupo**, no se congela al crearla. Comprobado: un Rejilla 2 creado para\n   un grupo de Rejilla 1 dice «no se le gana»; cuando el grupo sube a 4, el\n   mismo PNJ pasa solo a «contra el se aplica la Regla del Estilo». Eso es\n   exactamente Piccoro y los guerreros Z, y ahora el sistema lo hace sin que\n   nadie toque la ficha.\n3. En el suelo y en el techo, el formulario lo dice en vez de disimular: a\n   Rejilla 1 no hay nada por debajo (lo que querias es decorado) y a Rejilla 5\n   no hay nada por encima (lo que este por encima es un dios, no una ficha\n   rapida).\n\nY 6.3 lo dice ahora en el manual, con el consejo que se deduce: **no le subas la\nRejilla a un PNJ cuando subais vosotros.** Dejalo donde esta y deja que se quede\natras. Esa es la mitad de la gracia.\n\n## T142 · La musica estaba escondida\n\n«donde esta la musica?»\n\nEstaba donde yo la puse y no donde se busca. El panel colgaba de la barra de\nescena, y esa barra **se oculta justo en la pestana de Formularios**, que es\ndonde se pasa el rato montando la mesa. Comprobado pestana a pestana: aparecia\nen las seis, menos en esa.\n\nAhora tambien cuelga del hub de formularios, debajo del resumen de «La mesa,\nahora mismo», con el rotulo diciendo para que tarjeta es y avisando de que\ntambien esta arriba en cualquier otra pestana. El interruptor es el mismo, asi\nque abrirla en un sitio la deja abierta en el otro.\n\nLeccion, que no es de este panel: una decision de arquitectura razonable\n—«la musica sigue al tono de la escena, luego va en la barra de escena»—\npuede esconder la funcion si esa barra no esta donde el usuario mira.\n\n## T143 · Tu musica, arrastrada\n\n«Drag and drops en musica, el boton de play en los 7. Si le das y no hay nada,\nbocadillo y elige pista en la pestana musica.»\n\nHecho. Y el orden importa: **primero las pistas propias, despues los\nbuscadores**, porque las tuyas no tienen deuda legal ninguna (tu fichero, tu\nmaquina, nadie redistribuye nada) y las de los bancos si.\n\n- **Donde viven:** IndexedDB del navegador. No se suben a ningun sitio.\n  Sobreviven a que la app se actualice —comprobado recargando— pero no te\n  siguen a otro ordenador. Se descarto la tienda de recursos del artefacto por\n  dos razones: solo podria subir el autor, y declararla convierte el artefacto\n  en interno de la organizacion para siempre.\n- **Se comprueba que suena antes de guardarla.** Si sueltas un `.txt` lo dice\n  con su nombre en vez de tragarselo y dejarte con silencio sin explicacion.\n- **Una tarjeta, una pista:** asignar una donde ya habia otra suelta a la\n  anterior en vez de dejar dos peleando.\n- **Altavoz en las siete casillas** de la rejilla de tonos (y en los tres modos\n  del Acelerado). Si no hay pista, bocadillo con un boton que te lleva al panel\n  y hace scroll hasta el.\n- Las pistas **sin asignar** valen de pistas sueltas: les pones nombre de escena\n  («El mercado», «La persecucion») y las disparas a mano. Eso no es musica\n  ambiente, es una mesa de sonido de la campaña.\n\n**El fallo que casi se publica:** el fundido de volumen usaba\n`requestAnimationFrame`. En este panel —y en cualquier pestana de fondo, panel\nembebido o modo de ahorro— **rAF no dispara nunca aunque la pagina se declare\nvisible**. Resultado: el volumen se quedaba en 0 y la musica sonaba **muda con\nel bot
