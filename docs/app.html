function esPaso(f){ return f === 'tono' || f === 'uni' || f === 'baul'; }
/* ======================= 5 · EL REPARTO (PNJ) ======================= */
/* Las tres fichas de 6.1, con la Regla del Estilo de 6.2 como veredicto.
   La pregunta del nivel no se hace en abstracto: se hace contra el grupo,
   que es para lo que sirve el nivel. */
function nuevoPnj(){ return {step:0, tipo:null, rel:null, amb:null, hab:null, dur:null, nom:''}; }
function habName(k){ var p = String(k).split('.'), a = AMB[+p[0]], d = a && a.doms[+p[1]]; return d ? pick(d.n) + ' › ' + pick(d.dis[+p[2]]) : '—'; }
function ambOf(id){ return AMB.filter(function(a){ return a.id === id; })[0] || null; }
function pnjs(){ S.pnjs = S.pnjs || []; return S.pnjs; }
/* El nivel del grupo NO es la escala de la partida (grid()): es la Rejilla mas
   alta que tenga cualquier personaje en el ambito que importa (en cualquiera,
   si aun no hay ambito), o 1 si no hay fichas. */
function pjNivel(amb){
  var n = 1;
  (S.chars || []).forEach(function(c){ AMB.forEach(function(a, ai){ if (!amb || a.id === amb) n = Math.max(n, ambLvl(c, ai)); }); });
  return n;
}
function pnjNivel(rel, amb){ var g = pjNivel(amb); return Math.max(1, Math.min(5, g + (rel === 'bajo' ? -1 : rel === 'alto' ? 1 : 0))); }
/* Acelerado (3, improvisar un enemigo): un nivel de Rejilla, UNA habilidad a +2
   (todo lo demas a +0) y las casillas que quieras que dure la pelea, 3 por
   defecto. En el completo, un Ambito entero a +2 y la vida fractal. */
function pnjCasillas(P){ if (P.tipo === 'decorado') return 0; if (isAcc() && !P.dur) return 3; return P.dur === 'corta' ? 3 : P.dur === 'media' ? 9 : 27; }
function pnjPasos(P){
  var p = ['tipo', 'nivel'];
  if (P.tipo === 'rapida') { p.push('etiq'); p.push('dur'); }
  p.push('fin');
  return p;
}
/* 6.2: la Regla del Estilo se aplica contra el decorado Y contra todo lo que
   este por debajo de tu nivel. Son dos condiciones, no una.
   Y la Rejilla es RELATIVA: no se juzga por el numero, se juzga por el numero
   AL LADO del vuestro. El mismo Rejilla 2 es el ciberpsicopata que os revienta
   esta noche o, tres arcos mas adelante, algo a lo que ya no haceis caso. Por
   eso el veredicto de una ficha guardada se recalcula cada vez: si el grupo
   sube, el PNJ baja solo. */
function veredictoEstilo(tipo, n, amb){
  var g = pjNivel(amb);
  if (n > g) return ['bad', t('No se le gana', 'You do not beat this'),
    (tipo === 'decorado'
      ? t('Esto es de lo que no se describe en detalle: son hormigas o dioses, y este es un dios. Contra esto no se tira.',
          'This is the kind that is not described in detail: they are ants or gods, and this one is a god. You do not roll against this.')
      : t('Está por encima. Contra esto no se tira: se sobrevive, se huye o se busca una Llave.',
          'They are above you. You do not roll against this: you survive it, you flee, or you look for a Key.'))];
  if (tipo === 'decorado' || n < g) return ['ok', t('Contra él se aplica la Regla del Estilo', 'The Style Rule applies against them'),
    (tipo === 'decorado' && n >= g
      ? t('Es decorado, y contra el decorado siempre se aplica: no se tira para ver si ganan, se tira para ver cómo de bien quedan.',
          'They are scenery, and the rule always applies against scenery: you do not roll to see if the players win, you roll to see how good they look.')
      : t('Está por debajo de los personajes. No se tira para ver si ganan: se tira para ver cómo de bien quedan.',
          'They are below the characters. You do not roll to see if the players win: you roll to see how good they look.'))];
  return ['mid', t('Pelea de verdad', 'A real fight'),
    t('Está a vuestra altura. Se tira como contra cualquier rival y puede salir mal.',
      'They are on your level. You roll as against any rival, and it can go badly.')];
}
/* Como se lee el numero: siempre contra el vuestro, nunca solo. */
function rejillaTxt(n, amb){
  var g = pjNivel(amb), d = n - g;
  if (d === 0) return t('la vuestra', 'the same as yours');
  return (Math.abs(d) === 1 ? t('uno ', 'one ') : (Math.abs(d) + ' '))
    + (d > 0 ? t('por encima de la vuestra', 'above yours') : t('por debajo de la vuestra', 'below yours'))
    + ' (' + g + ')';
}
var PNJ_TIPO = [
  ['decorado', ['Está ahí para que la escena tenga a alguien', 'They are there so the scene has someone in it'],
   ['Los guardias del almacén, la multitud, los zombis de relleno. También lo que está tan por encima de vosotros que no se describe en detalle: son hormigas o dioses.',
    'The warehouse guards, the crowd, the filler zombies. Also whatever is so far above you that it is not described in detail: they are ants or gods.']],
  ['rapida', ['Va a dar problemas esta sesión', 'They are going to be a problem this session'],
   ['El lugarteniente del villano, el contacto del bar, el monstruo de la semana. Tiene nombre, una cosa que hace bien y la vida que tú decidas.',
    'The villain’s lieutenant, the contact at the bar, the monster of the week. They have a name, one thing they are good at, and whatever health you decide.']],
  ['completa', ['Es EL antagonista de la campaña', 'They are THE antagonist of the campaign'],
   ['El némesis. Ese no se hace aquí: se hace con las mismas reglas que un personaje jugador, y por eso se merece una ficha entera.',
    'The nemesis. That one is not made here: it is made with the same rules as a player character, which is why it deserves a full sheet.']]
];
var PNJ_REL = [
  ['bajo', ['Por debajo. Está ahí para que quede bien quien lo atropelle', 'Below. They are there to make whoever runs them over look good']],
  ['par', ['A vuestra altura. Un rival de verdad', 'On your level. A real rival']],
  ['alto', ['Por encima. A esto no se le gana', 'Above you. This is not something you beat']]
];
var PNJ_DUR = [
  ['corta', ['Un intercambio y cae', 'One exchange and they drop'], 3],
  ['media', ['Aguanta la escena', 'They last the scene'], 9],
  ['larga', ['Es la escena entera', 'They are the whole scene'], 27]
];
function pnjOpciones(ops, cur, attr){
  var h = '<div class="choices">';
  ops.forEach(function(o){
    h += '<button type="button" class="choice" data-' + attr + '="' + o[0] + '" aria-pressed="' + (cur === o[0]) + '"><span>' +
      esc(pick(o[1])) +
      (typeof o[2] === 'number' ? '<small>' + o[2] + ' ' + esc(t('casillas de vida','health boxes')) + '</small>'
        : o[2] ? '<small>' + esc(pick(o[2])) + '</small>' : '') +
      '</span><span class="mark"></span></button>';
  });
  return h + '</div>';
}
function pnjFicha(P, guardado){
  var n = guardado ? P.nivel : pnjNivel(P.rel, P.amb), v = veredictoEstilo(P.tipo, n, P.amb), cas = guardado ? P.cas : pnjCasillas(P);
  var h = '<div class="pnjcard"><p class="kick">' + esc(P.tipo === 'decorado' ? t('Ficha de decorado','Scenery sheet') : t('Ficha rápida','Quick sheet')) + '</p>';
  h += '<p class="big">' + esc(P.nom || (P.tipo === 'decorado' ? t('Sin nombre: solo una función','No name: just a function') : t('Sin nombre todavía','No name yet'))) + '</p>';
  h += '<table class="summary"><tr><td>' + esc(t('Rejilla','Grid')) + '</td><td>' + n + ' · ' + esc(rejillaTxt(n, P.amb)) +
    '<span class="tech">' + esc(t('Alcance: ','Reach: ') + pick(GRIDN[n])) + '</span></td></tr>';
  if (P.tipo === 'rapida' && P.hab) {
    h += '<tr><td>' + esc(t('Habilidad','Skill')) + '</td><td><b>' + esc(habName(P.hab)) + '</b> +2' +
      '<span class="tech">' + esc(t('todo lo demás, +0','everything else, +0')) + '</span></td></tr>';
    h += '<tr><td>' + esc(t('Vida','Health')) + '</td><td>' + cas + ' ' + esc(t('casillas','boxes')) +
      '<span class="tech">' + esc(t('las que quieras que dure la pelea','as many as you want the fight to last')) + '</span></td></tr>';
  } else if (P.tipo === 'rapida') {
    var A = ambOf(P.amb);
    h += '<tr><td>' + esc(t('Ámbito','Sphere')) + '</td><td>' +
      (A ? '<b>' + esc(pick(A.n)) + '</b> +2' : '<span class="note">' + esc(t('sin elegir','not chosen')) + '</span>') +
      '<span class="tech">' + esc(A ? (A.doms.map(function(d){ return pick(d.n); }).join(' · ') + ' — ' + t('fuera de ahí, +0','outside it, +0'))
        : t('fuera de ahí, +0','outside it, +0')) + '</span></td></tr>';
    h += '<tr><td>' + esc(t('Vida','Health')) + '</td><td>' + cas + ' ' + esc(t('casillas','boxes')) +
      '<span class="tech">' + esc(cas === 3 ? t('sano · herido · fuera','healthy · wounded · out') : t('vida fractal','fractal health')) + '</span></td></tr>';
  } else {
    h += '<tr><td>' + esc(t('Mecánica','Mechanics')) + '</td><td>' + esc(t('Solo nivel de Rejilla','Grid level only')) +
      '<span class="tech">' + esc(t('sin vida y sin habilidades','no health, no skills')) + '</span></td></tr>';
  }
  h += '</table><p class="sem ' + v[0] + '">' + esc(v[1]) + '</p><p class="hint">' + esc(v[2]) + '</p></div>';
  return h;
}

    }).join('') + '</div>';

  } else if (paso === 'dur') {
    if (isAcc() && !P.dur) P.dur = 'corta';   /* Acelerado: 3 por defecto */
    h += '<p class="kick">' + esc(t('La vida','Health')) + '</p><p class="big">' + esc(t('¿Cuánto quieres que dure la pelea?','How long do you want the fight to last?')) + '</p>';
    h += '<p class="vign">' + esc(t('No elijas su vida por lo fuerte que sea «de verdad». Un dios puede caer de un golpe si la escena lo pide, y un matón de barrio puede aguantar diez asaltos si eso es lo que estás contando.',

    h += '<p class="big">' + esc(P.tipo === 'decorado' ? t('¿Qué son?','What are they?') : t('¿Cómo se llama?','What is their name?')) + '</p>';
    h += '<input class="pnjin" type="text" maxlength="48" data-pnn="1" value="' + esc(P.nom) + '" placeholder="' +

    h += pnjFicha(P, false);

      '<div class="page"><p class="kick">' + esc(t('El némesis','The nemesis')) + '</p><p class="big">' +

  }

}
function renderReparto(){
  var L = pnjs();
  if (!L.length) return '';
  var h = '<div class="page" style="margin-top:14px"><p class="kick">' + esc(t('El reparto','The cast')) + ' · ' + L.length + '</p><div class="hub">';
  L.forEach(function(p, i){
    var v = veredictoEstilo(p.tipo, p.nivel, p.amb);
    h += '<div class="hubcard est"><span class="hubkick">' + esc(p.tipo === 'decorado' ? t('Decorado','Scenery') : t('Rápida','Quick')) +
      ' · ' + esc(t('Rejilla ','Grid ') + p.nivel + ' · ' + rejillaTxt(p.nivel, p.amb)) + '</span><b>' + esc(p.nom) + '</b>' +
      '<span class="hubdesc">' + esc(p.tipo === 'rapida'
        ? ((p.hab ? habName(p.hab) : ambOf(p.amb) ? pick(ambOf(p.amb).n) : (p.etiq || '—')) + ' +2 · ' + p.cas + ' ' + t('casillas','boxes'))
        : t('Sin vida ni habilidades','No health, no skills')) + '</span>' +
      '<span class="sem ' + v[0] + '">' + esc(v[1]) + '</span>' +
      '<span class="hubgo"><button type="button" class="mini" data-pnb="' + i + '">' + esc(t('Quitar','Remove')) + '</button></span></div>';
  });
  return h + '</div></div>';
}
function bindPnj(){
  var v = $('view'), P = S.pnj = S.pnj || nuevoPnj();
  v.querySelectorAll('[data-pnt]').forEach(function(b){ b.addEventListener('click', function(){ P.tipo = b.getAttribute('data-pnt'); persist(); render(); }); });
  v.querySelectorAll('[data-pnr]').forEach(function(b){ b.addEventListener('click', function(){ P.rel = b.getAttribute('data-pnr'); persist(); render(); }); });
  v.querySelectorAll('[data-pnd]').forEach(function(b){ b.addEventListener('click', function(){ P.dur = b.getAttribute('data-pnd'); persist(); render(); }); });
  v.querySelectorAll('[data-pna]').forEach(function(b){ b.addEventListener('click', function(){ P.amb = b.getAttribute('data-pna'); P.hab = null; persist(); render(); }); });
  v.querySelectorAll('[data-pnh]').forEach(function(s){ s.addEventListener('change', function(){
    P.hab = s.value || null; P.amb = P.hab ? AMB[+P.hab.split('.')[0]].id : null; persist(); render();
  }); });
  var n = v.querySelector('[data-pnn]');
  if (n) { n.addEventListener('input', function(){
    /* sin repintar: repintar robaria el cursor a cada tecla */
    P.nom = n.value; persist();
    var g = v.querySelector('[data-pnx="guardar"]'); if (g) g.disabled = !n.value.trim();
    var ti = v.querySelector('.pnjcard .big'); if (ti) ti.textContent = n.value.trim() ||
      (P.tipo === 'decorado' ? t('Sin nombre: solo una función','No name: just a function') : t('Sin nombre todavía','No name yet'));
  }); }
  v.querySelectorAll('[data-pnb]').forEach(function(b){ b.addEventListener('click', function(){ pnjs().splice(+b.getAttribute('data-pnb'), 1); persist(); render(); }); });
  v.querySelectorAll('[data-pnx]').forEach(function(b){ b.addEventListener('click', function(){
    var k = b.getAttribute('data-pnx');
    if (k === 'exit') { S.form = null; }
    else if (k === 'atras') { P.step = Math.max(0, P.step - 1); }
    else if (k === 'sig') { P.step = P.step + 1; }
    else if (k === 'otro') { P.tipo = null; P.step = 0; }
    else if (k === 'tpl') { S.tab = 'tpl'; S.form = null; S.pnj = nuevoPnj(); }
    else if (k === 'guardar') {
      pnjs().push({tipo:P.tipo, nom:P.nom.trim(), nivel:pnjNivel(P.rel, P.amb), amb:P.amb, hab:P.hab || null, cas:pnjCasillas(P)});
      S.pnj = nuevoPnj();
    }
    persist(); render(); window.scrollTo(0, 0);
  }); });
}

function renderForm(){
  if (S.form === 'equipo') return renderEq();
  if (S.form === 'pnj') return renderPnj();
  if (esPaso(S.form)) {
    if (S.talk.on) return '<div class="wiz"><div class="ftop"><button type="button" class="mini" data-fsal="1">← ' +
      esc(t('Los formularios','The forms')) + '</button></div>' + renderTalk() + '</div>';
    return renderPasos(S.form);
  }
  return renderHub();
}
function bindForm(){
  if (S.form === 'equipo') return bindEq();
  if (S.form === 'pnj') return bindPnj();
  if (esPaso(S.form)) return bindPasos(S.form);
  return bindHub();
}
function bindHub(){
  var v = $('view');
  v.querySelectorAll('[data-hub]').forEach(function(b){ b.addEventListener('click', function(){
    var k = b.getAttribute('data-hub');
    S.form = k;
    if (k === 'equipo') S.eq = {who:null, modo:'busca', busca:'', fstep:0, cat:null, sel:[]};
    if (k === 'pnj') S.pnj = nuevoPnj();
    persist(); render(); window.scrollTo(0, 0);
  }); });
  v.querySelectorAll('[data-edi]').forEach(function(b){ b.addEventListener('click', function(){
    M.edition = b.getAttribute('data-edi'); S.scene = null; persist(); render(true);
  }); });
  v.querySelectorAll('[data-musg]').forEach(function(b){ b.addEventListener('click', function(){
    musOpen = !musOpen; persist(); render(); 
  }); });
  v.querySelectorAll('[data-gotpl]').forEach(function(b){ b.addEventListener('click', function(){
    S.tab = 'tpl'; S.form = null; persist(); render(); window.scrollTo(0, 0);
  }); });
}

/* ======================= LOS TRES FORMULARIOS ======================= */
/* 1. El tono escribe la mesa. 2. El contexto recomienda las reglas extra.
   3. El equipo escribe en una ficha. Los dos primeros viajan en el Código;
   el tercero no: el equipo es de quien lleva la ficha. */

/* ---------------- 4. el equipo ---------------- */
/* ---------------- 3. el equipo ---------------- */
function resBonus(c){ return bonoDis(c, 2, 1, 3); }   /* Social > Jerarquia > Recursos */
/* El precio va al principio del campo, detras del Acceso. Sin anclar, «absorbe
   hasta 1 punto» de las armaduras se cobraba como un punto de habilidad. */
var RE_PTS = /^(?:(?:Acceso|Access) \S+\s+)?(\d+)\s*(?:puntos?|points?)\b/;
var RE_KEYS = /^(?:(?:Acceso|Access) \S+\s+)?(\d+)\s*(?:Llaves?|Keys?)\b/;
/* Acelerado (2.9): el equipo no cuesta puntos de habilidad. Las Llaves si:
   las que lleve el precio, sea Rejilla o permiso (T176). Antes solo se
   cobraba lo que rompe la Rejilla y Velo absoluto salia gratis. */
function itemPtsOf(it){ if (isAcc()) return 0; var m = RE_PTS.exec(pick(it.m) || ''); return m ? +m[1] : 0; }
function itemKeysOf(it){ var m = RE_KEYS.exec(pick(it.m) || ''); return m ? +m[1] : 0; }
function accSem(c, it){
  var a = accOf(it);
  if (a === 9) return ['na', t('no se compra con dinero','not bought with money')];
  /* la tabla de los cajones (8.3): lo cotidiano (Acceso 0) esta siempre al
     alcance, tambien con Recursos −1 o −2; de +0 a +2 se llega un escalon mas
     arriba con esfuerzo, una vez por arco; +4 llega a 3 y no hay mas arriba */
  var r = resBonus(c), siempre = r >= 4 ? 3 : Math.max(0, r), esfuerzo = (r >= 0 && r <= 2) ? siempre + 1 : siempre;
  if (a <= siempre) return ['ok', t('a tu alcance','within reach')];
  if (a <= esfuerzo) return ['mid', t('con esfuerzo: una vez por arco, y con precio','with effort: once per arc, and at a price')];
  return ['bad', t('fuera de tu alcance aquí','out of reach here')];
}
function eqRef(r){ return r.u + '|' + r.b + '|' + r.i; }
function eqItem(key){
  var p = String(key).split('|');
  var b = DATA.bazar.filter(function(x){ return x.id === p[0]; })[0];
  var it = b && b.blocks[+p[1]] && b.blocks[+p[1]].items[+p[2]];
  return it ? {u:p[0], b:+p[1], i:+p[2], it:it} : null;
}
function eqChar(){ return S.chars.filter(function(x){ return x.id === (S.eq && S.eq.who); })[0]; }
/* acentos fuera y todo en minusculas, que nadie escribe «Katana» con mayuscula */
function norm(x){ return String(x == null ? '' : x).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function eqBusca(q){
  var pal = norm(q).split(/\s+/).filter(function(x){ return x.length > 1; });
  if (!pal.length) return [];
  var out = [];
  DATA.bazar.forEach(function(bz){
    if (universes().indexOf(bz.id) < 0) return;
    var un = norm(uniName(bz.id));
    bz.blocks.forEach(function(bl, bi){
      var bn = norm(pick(bl.n));
      bl.items.forEach(function(it, ii){
        var nom = norm(pick(it.n));
        var todo = nom + ' ' + norm(pick(it.x)) + ' ' + norm(pick(it.d)) + ' ' + norm(pick(it.e)) +
          ' ' + norm(pick(it.a)) + ' ' + norm(pick(it.m)) + ' ' + bn + ' ' + un;
        for (var k = 0; k < pal.length; k++) if (todo.indexOf(pal[k]) < 0) return;
        var enNombre = 1;
        for (var j = 0; j < pal.length; j++) if (nom.indexOf(pal[j]) < 0) { enNombre = 0; break; }
        out.push({u:bz.id, b:bi, i:ii, it:it, nm:enNombre ? 0 : 1});
      });
    });
  });
  out.sort(function(a, b){ return (a.nm - b.nm) || (accOf(a.it) - accOf(b.it)); });
  return out;
}
function eqFicha(c, r){
  var key = eqRef(r), on = S.eq.sel.indexOf(key) > -1, sem = accSem(c, r.it);
  var p = itemPtsOf(r.it), k = itemKeysOf(r.it);
  return '<button type="button" class="fitem' + (on ? ' on' : '') + '" data-eqadd="' + esc(key) + '" aria-pressed="' + on + '"><b>' + esc(pick(r.it.n)) + '</b>' +
    '<span>' + esc([pick(r.it.d), pick(r.it.e), pick(r.it.a)].filter(function(x){ return x && x !== '—'; }).join(' · ')) + '</span>' +
    '<em class="sem ' + sem[0] + '">' + esc(sem[1]) + (p ? ' · ' + p + ' ' + esc(t(p === 1 ? 'punto' : 'puntos', 'pt' + (p === 1 ? '' : 's'))) : '') +
    (k ? ' · ' + k + ' ' + esc(t(k === 1 ? 'Llave' : 'Llaves', 'Key' + (k === 1 ? '' : 's'))) : '') + '</em></button>';
}
function eqResHTML(c){
  var E = S.eq, q = E.busca || '';
  if (norm(q).replace(/\s+/g, '').length < 2) {
    return '<p class="eqvacio">' + esc(t('Escribe una palabra: el nombre si lo sabes, o lo que haga el objeto («veneno», «cuerda», «escudo», «implante»).',
      'Type a word: the name if you know it, or what the item does (“poison”, “rope”, “shield”, “implant”).')) + '</p>';
  }
  var res = eqBusca(q);
  if (!res.length) {
    return '<p class="eqvacio">' + esc(t('Nada con esa palabra en el equipo de tu mesa. Prueba con otra, o búscalo por lo que hace.',
      'Nothing by that word in your table’s gear. Try another one, or search by what it does.')) + '</p>';
  }
  var corte = res.slice(0, 60);
  return '<p class="eqcuantos">' + esc(res.length + ' ' + t(res.length === 1 ? 'objeto' : 'objetos', res.length === 1 ? 'item' : 'items') +
    (res.length > 60 ? t(' · se enseñan los 60 primeros', ' · showing the first 60') : '')) + '</p><div class="flist">' +
    corte.map(function(r){ return eqFicha(c, r); }).join('') + '</div>';
}
function renderEq(){
  var E = S.eq = S.eq || {who:null, modo:'busca', busca:'', fstep:0, cat:null, sel:[]};
  if (!E.modo) { E.modo = 'busca'; E.busca = E.busca || ''; }
  var h = '<div class="wiz"><div class="ftop"><button type="button" class="mini" data-eq="exit">← ' + esc(t('Los formularios','The forms')) + '</button><p class="kick">' + esc(t('4 · El equipo · la ficha','4 · Equipment · the sheet')) + '</p></div>';

        : t('El equipo no es de la mesa, es de alguien: se paga con sus puntos, sus Llaves y su nivel en Recursos.','Equipment does not belong to the table, it belongs to someone: it is paid with their points, their Keys and their Resources level.')) + '</p><div class="eqwho">';
    S.chars.forEach(function(c, ci){
      var p = cost(c), k = keysUsed(c);
      h += '<button type="button" data-eqwho="' + c.id + '"><b>' + esc(c.name || (u('pc') + ' ' + (ci + 1))) + '</b>' +
        '<small>' + esc(c.concept || t('sin concepto','no concept')) + ' · ' + p + '/' + budget(c) + ' ' + esc(t('puntos','points')) +
        ' · ' + k + '/' + keysHave(c) + ' ' + esc(t('Llaves','Keys')) + ' · ' + esc(t('Recursos ','Resources ')) + bonusTxt(resBonus(c)) +
        ' · ' + (c.gear || []).length + ' ' + esc(t('objetos','items')) + '</small></button>';
    });
    return h + '</div></div></div>';
  }
  var c = eqChar();
  var who = c.name || (u('pc') + ' ' + (S.chars.indexOf(c) + 1));
  h += '<p class="hint">' + esc(t('De compras para ','Shopping for ') + who) + ' · <button type="button" class="mini" data-eq="who">' + esc(t('cambiar','change')) + '</button></p>';
  /* paso 2: la cuenta */
  if (E.modo === 'cuenta') {
    var sp = 0, sk = 0, peor = 'ok', nmon = 0, ntot = 0;
    h += '<div class="page"><p class="kick">' + esc(t('La cuenta','The bill')) + '</p><p class="big">' + esc(isAcc() ? t('Aquí el equipo solo cuesta dinero','Here equipment only costs money') : t('Tres monedas, y solo dos se restan','Three coins, and only two get subtracted')) + '</p>' +
      '<table class="cuenta"><thead><tr><th>' + esc(t('Objeto','Item')) + '</th><th>' + esc(t('Acceso · lo paga el dinero','Access · money pays it')) + '</th><th class="num">' + esc(t('Puntos','Points')) + '</th><th class="num">' + esc(t('Llaves','Keys')) + '</th></tr></thead><tbody>';
    E.sel.forEach(function(key){
      var r = eqItem(key); if (!r) return;
      var sem = accSem(c, r.it), p = itemPtsOf(r.it), k = itemKeysOf(r.it);
      sp += p; sk += k;
      ntot++; if (sem[0] === 'na') nmon++;
      if (sem[0] === 'bad') peor = 'bad'; else if (sem[0] === 'mid' && peor !== 'bad') peor = 'mid';
      var a = accOf(r.it);
      h += '<tr><td><b>' + esc(pick(r.it.n)) + '</b><br><span class="note">' + esc(uniName(r.u)) + '</span></td>' +
        '<td><span class="sem ' + sem[0] + '">' + (a === 9 ? '—' : 'Acceso ' + a) + ' · ' + esc(sem[1]) + '</span></td>' +
        '<td class="num">' + (p || '—') + '</td><td class="num">' + (k || '—') + '</td></tr>';
    });
    if (ntot && nmon === ntot) peor = 'na';
    h += '<tr class="tot"><td>' + esc(t('Total','Total')) + '</td><td><span class="sem ' + peor + '">' +
      esc(peor === 'na' ? t('nada de esto se compra con dinero','none of this is bought with money') : peor === 'ok' ? t('todo a tu alcance','all within reach') : peor === 'mid' ? t('algo hay que conseguirlo','something has to be obtained') : t('algo está fuera de tu alcance','something is out of reach')) +
      '</span></td><td class="num">' + sp + '</td><td class="num">' + sk + '</td></tr></tbody></table>';

    h += '<p class="eqtot">' + esc(t('Puntos de habilidad: ','Skill points: ')) + '<b class="' + (pA > budget(c) ? 'over' : '') + '">' + pA + ' / ' + budget(c) + '</b>' +

      esc(t('El Acceso no se resta de nada: no es un monedero, es un umbral. Lo mide tu nivel en Recursos (ahora ','Access is not subtracted from anything: it is not a wallet, it is a threshold. Your Resources level measures it (now ')) + bonusTxt(resBonus(c)) + esc(t('), y quien decide si lo consigues es la mesa.','), and the table decides whether you get it.')) +
      (isAcc() ? '<br>' + esc(t('Acelerado (2.9): el equipo no gasta puntos de habilidad. Las Llaves sí: las que lleve su precio, sea Rejilla o permiso.','Accelerated (2.9): equipment spends no skill points. Keys it does: those in its price, Grid or permission alike.')) : '') + '</p>';
    if (pA > budget() || kA > keysHave(c)) h += '<p class="eqnote">' + esc(t('Te pasas del presupuesto. Puedes añadirlo igual —la ficha lo marca en rojo y lo arregláis en la mesa—, o quitar algo.','You are over budget. You can add it anyway —the sheet flags it in red and you sort it out at the table— or drop something.')) + '</p>';
    h += '<div class="nav"><button type="button" class="btn" data-eq="list">← ' + esc(E.cat ? t('Volver a la lista','Back to the list') : t('Volver al buscador','Back to the search')) + '</button>' +
      '<button type="button" class="btn" data-eq="more">' + esc(t('Buscar otra cosa','Look for something else')) + '</button>' +
      '<button type="button" class="btn go" data-eq="add">' + esc(t('Añadir a la ficha','Add to the sheet')) + ' →</button></div></div></div>';
    return h;
  }
  /* el buscador de palabra clave: lo primero, porque si sale a la primera se acabo */
  if (E.modo !== 'arbol' && E.modo !== 'lista') {
    h += '<div class="page"><p class="kick">' + esc(t('De compras','Shopping')) + '</p><p class="big">' +
      esc(t('¿Qué buscáis?','What are you looking for?')) + '</p>' +
      '<div class="eqbuscar"><input type="search" id="eqq" autocomplete="off" spellcheck="false" placeholder="' +
      esc(t('katana, cuerda, veneno, implante…','katana, rope, poison, implant…')) + '" value="' + esc(E.busca || '') + '"></div>' +
      '<div id="eqres">' + eqResHTML(c) + '</div>' +
      '<p class="eqnote">' + esc(t('Se busca en el nombre y en lo que hace cada objeto, solo dentro del equipo que tu mesa tiene abierto.',
        'It searches names and what each item does, only within the gear your table has open.')) + '</p>' +
      '<div class="nav" id="eqnav"><button type="button" class="btn" data-eq="arbol">' +
      esc(t('No sé cómo se llama · búscalo por lo que hace','I do not know its name · search by what it does')) + ' →</button>' +
      '<button type="button" class="btn go" data-eq="cuenta"' + (E.sel.length ? '' : ' disabled') + '>' +
      esc(t('Ir a la cuenta','Go to the bill')) + (E.sel.length ? ' (' + E.sel.length + ')' : '') + ' →</button></div></div></div>';
    return h;
  }
  /* y si no, el arbol de cuatro preguntas */
  if (!E.cat) {
    var q = FINDQ[E.fstep];
    h += '<div class="page"><p class="kick">' + esc(t('Por lo que hace','By what it does')) + ' · ' + (E.fstep + 1) + ' / 4</p><p class="big">' + esc(pick(q.q)) + '</p><div class="choices">' +
      '<button type="button" class="choice" data-eqf="y"><span>' + esc(t('Sí','Yes')) + '</span><span class="mark"></span></button>' +
      '<button type="button" class="choice" data-eqf="n"><span>' + esc(t('No','No')) + '</span><span class="mark"></span></button></div>';
    if (!arcOpen()) h += '<p class="eqnote">' + esc(t('En este mundo no hay Arcano, así que la magia y los poderes no salen en la lista.','This world has no Arcane, so magic and powers do not appear in the list.')) + '</p>';
    h += '<div class="nav"><button type="button" class="btn" data-eq="busca">← ' + esc(t('Buscar por palabra','Search by word')) + '</button>' +
      (E.sel.length ? '<button type="button" class="btn go" data-eq="cuenta">' + esc(t('Ir a la cuenta','Go to the bill')) + ' (' + E.sel.length + ') →</button>' : '<span></span>') +

  h += '</div><div class="nav"><button type="button" class="btn" data-eq="fres">← ' + esc(t('Otra búsqueda','Another search')) + '</button>' +
    '<button type="button" class="btn go" data-eq="cuenta"' + (E.sel.length ? '' : ' disabled') + '>' + esc(t('Ir a la cuenta','Go to the bill')) + (E.sel.length ? ' (' + E.sel.length + ')' : '') + ' →</button></div></div></div>';
  return h;
}

function bindEq(){
  var v = $('view'), E = S.eq;
  v.querySelectorAll('[data-eqwho]').forEach(function(b){ b.addEventListener('click', function(){
    E.who = b.getAttribute('data-eqwho'); E.modo = 'busca'; E.busca = ''; E.fstep = 0; E.cat = null; E.sel = [];
    persist(); render(); window.scrollTo(0, 0);
  }); });
  /* el buscador se repinta solo por dentro, para no perder el foco al escribir */
  var inp = $('eqq');
  if (inp) {
    function repinta(){
      var box = $('eqres'); if (box) box.innerHTML = eqResHTML(eqChar());
      var nav = $('eqnav'); if (nav) {
        var go = nav.querySelector('[data-eq="cuenta"]');
        if (go) { go.disabled = !E.sel.length; go.textContent = t('Ir a la cuenta','Go to the bill') + (E.sel.length ? ' (' + E.sel.length + ')' : '') + ' →'; }
      }
    }
    inp.addEventListener('input', function(){ E.busca = inp.value; persist(); repinta(); });
    var box0 = $('eqres');
    if (box0) box0.addEventListener('click', function(ev){
      var b = ev.target.closest('[data-eqadd]'); if (!b) return;
      var key = b.getAttribute('data-eqadd'), i = E.sel.indexOf(key);
      if (i > -1) E.sel.splice(i, 1); else E.sel.push(key);
      persist(); repinta();
    });
    if (window.matchMedia && window.matchMedia('(min-width:768px)').matches) { try { inp.focus(); } catch(e){} }
  }
  v.querySelectorAll('[data-eqf]').forEach(function(b){ b.addEventListener('click', function(){
    var q = FINDQ[E.fstep], nx = q[b.getAttribute('data-eqf')];
    if (typeof nx === 'string') { E.cat = nx; E.modo = 'lista'; } else { E.fstep = nx; }
    persist(); render(); window.scrollTo(0,0);
  }); });
  v.querySelectorAll('[data-eqadd]').forEach(function(b){ b.addEventListener('click', function(){
    var key = b.getAttribute('data-eqadd'), i = E.sel.indexOf(key);
    if (i > -1) E.sel.splice(i, 1); else E.sel.push(key);
    persist(); render(true);
  }); });
  v.querySelectorAll('[data-eq]').forEach(function(b){ b.addEventListener('click', function(){
    var k = b.getAttribute('data-eq');
    if (k === 'exit') { S.form = null; }
    else if (k === 'who') { E.who = null; E.modo = 'busca'; }
    else if (k === 'busca') { E.modo = 'busca'; E.cat = null; E.fstep = 0; }
    else if (k === 'arbol' || k === 'fres') { E.modo = 'arbol'; E.cat = null; E.fstep = 0; }
    else if (k === 'more') { E.modo = 'busca'; E.cat = null; E.fstep = 0; }
    else if (k === 'list') { E.modo = E.cat ? 'lista' : 'busca'; }
    else if (k === 'cuenta') { E.modo = 'cuenta'; }
    else if (k === 'add') {
      var c = eqChar();
      if (c) { E.sel.forEach(function(key){ var r = eqItem(key); if (r) c.gear.push({u:r.u, b:r.b, i:r.i}); }); S.tab = c.id; }
      S.form = null; S.eq = null;
    }
    persist(); render(); window.scrollTo(0,0);
  }); });
}

  h += '<div class="rbox"><h3>' + esc(t('Rejilla y Llave','Grid and Key')) + '</h3><ul><li>' + esc(t('Escala de la partida: ','Game scale: ') + grid() + ' (' + pick(GRIDN[grid()]) + ')') + '</li><li>' + esc(t('La escala dice el tamaño de las hazañas y de las amenazas; no sube tus ámbitos. Los unos abundan: se sale en 1·1·1·1·1 con 5 Llaves (más la experiencia de salida que dé la mesa). Rejilla por encima de 1: 5·n² Llaves por ámbito; los niveles que da la historia no se pagan. Por encima del techo de la receta, solo si la mesa lo confirma.','The scale sets the size of deeds and threats; it does not raise your spheres. Ones are plentiful: you start at 1·1·1·1·1 with 5 Keys (plus any starting experience the table gives). Grid above 1: 5·n² Keys per sphere; levels the story gives are not paid for. Above the recipe’s ceiling, only if the table confirms it.')) + '</li><li>' + esc(t('Mismo nivel: se tira.','Same level: roll.')) + '</li><li>' + esc(t('Por encima del desafío: lo consigues sin tirar' + (estilo() ? ' (si importa cómo, tira Estilo).' : '.') + ' Vale igual para un monstruo frente a un personaje.', 'Above the challenge: you succeed without rolling' + (estilo() ? ' (if how matters, roll Style).' : '.') + ' The same goes for a monster against a character.')) + '</li><li>' + esc(t('Por debajo: no puedes afectarle —ni defenderte de él— sin una Llave (arma, debilidad, ayuda…). Una Llave te pone un nivel por encima, pero solo en lo que cubre: lo que te superaba queda a tu altura (se tira) y lo que estaba a tu altura queda por debajo (lo consigues sin tirar). Ser más es una Llave de un momento: un nivel por encima en lo que cubre, mientras la ficción lo sostenga.','Below: you cannot affect it —nor defend against it— without a Key (weapon, weakness, help…). A Key puts you one level above, but only in what it covers: what was above you is now on your level (roll) and what was on your level is now below you (you succeed without rolling). Numbers are a Key of the moment: one level above in what they cover, while the fiction holds it up.')) + '</li>' + (isAcc() ? '' : '<li>' + esc(t('El acordeón: 3 Firmas pliegan la Disciplina entera en +4, 3 Disciplinas el Dominio, y los 2 Dominios el Ámbito.','The accordion: 3 Signatures fold the whole Discipline into +4, 3 Disciplines the Domain, and both Domains the Sphere.')) + '</li>') + '<li>' + esc(t('Cada nivel multiplica por cien tu alcance. Un nivel de diferencia son dos ceros: por eso no hay tirada.','Each level multiplies your reach by a hundred. One level of difference is two zeros: that is why there is no roll.')) + '</li><li>' + esc(t('Llave estrecha: una Disciplina contra su objetivo, para siempre (nunca una Firma). Ancha: el ámbito entero contra su objetivo, una escena; se tacha al acabarla. Subir más contra lo mismo: 1, 4, 9 Llaves. Contra todo, el doble; si pasa de 5·n² en un ámbito, compra la Rejilla. Las Llaves que cobras por no subir en un salto son tuyas: gástalas donde quieras.','Narrow Key: one Discipline against its target, for ever (never a Signature). Wide: the whole sphere against its target, one scene; cross it out when it ends. Climbing further against the same thing: 1, 4, 9 Keys. Against everything, double; if it goes past 5·n² in a sphere, buy the Grid. Keys you collect for not climbing in a jump are yours: spend them wherever you like.')) + '</li>' + (isAcc() ? '' : '<li>' + esc(t('El techo es la Rejilla entera más alta que puede tener un jugador en vuestro mundo: la receta lo propone y la mesa lo confirma. No frena las Llaves: una Disciplina puede pasar si vuestro mundo lo hace posible.','The ceiling is the highest whole Grid a player can have in your world: the recipe proposes it and the table confirms it. It does not stop Keys: one Discipline can go above it if your world makes it possible.')) + '</li>') + '</ul></div>';
  h += '<div class="rbox"><h3>' + esc(t('Equipo y Llaves','Equipment and Keys')) + '</h3><ul><li>' + esc(isAcc()

    ? t('Lo robado o prestado funciona una escena entera; después, si te lo quedas, tiene que caber en tu Recursos.','Looted or borrowed gear works for a whole scene; after that, if you keep it, it has to fit your Resources.')
    : t('Lo robado o prestado funciona una escena entera gratis; después, se paga o se deja.','Looted or borrowed gear works free for a whole scene; after that you pay for it or leave it.')) + '</li><li>' + esc(t('El equipo siempre se puede devolver: cuando ya no lo usas —lo vendes, se rompe, lo dejas—, ' + (isAcc() ? 'sus Llaves vuelven' : 'sus puntos y sus Llaves vuelven') + ' a quedar libres. Lo de una escena (prestado, robado) y los regalos del Director no costaron nada y no devuelven nada.','Equipment can always be given back: once you no longer use it —you sell it, it breaks, you leave it—, ' + (isAcc() ? 'its Keys are' : 'its points and Keys are') + ' free again. One-scene things (borrowed, looted) and the Director’s gifts cost nothing and give nothing back.')) + '</li><li>' + esc(t('Sincronización (heredar la ficha y la escala): para mechas, trajes, exoesqueletos y fusiones; los regalos del Director no se pagan mientras la historia los pida. Un vehículo normal no presta su nivel: se dispara al vehículo (su propia vida) o a quien va dentro, si las balas entran.','Synchronisation (inheriting the sheet and the scale): for mechas, suits, exoskeletons and mergers; the Director’s gifts are not paid for while the story asks for them. A normal vehicle does not lend its level: you shoot the vehicle (its own health) or whoever is inside, if bullets get in.')) + '</li><li>' + esc(t('Monedero por defecto: 1 Llave por sesión. Es el mando de potencia de la campaña.','Default wallet: 1 Key per session. It is the campaign’s power dial.')) + '</li></ul></div>';
  h += '<div class="rbox"><h3>' + esc(t('Combate','Combat')) + '</h3><ul>' +
    (isAcc() ? '<li>' + esc(t('Iniciativa: tu mejor bono en Destreza.','Initiative: your best Dexterity bonus.')) + '</li>' : '<li>' + esc(t('Iniciativa: declara tu guardia (Violencia, Treta, Especialidad) y tira tu mejor habilidad de esa disposición. Si cambias, vas el último. Si nadie elige, vale el marcador de tu ficha.','Initiative: declare a stance (Violence, Trick, Specialty) and roll your best skill for it. If you switch, you go last. If nobody chooses, your sheet’s marker applies.')) + '</li>') +
    '<li>' + esc(t('Atacar: tirada contra TN. Crítico: +1 al daño.','Attack: roll vs TN. Critical: +1 damage.')) + '</li>' + (isAcc() ? '<li>' + esc(t('Armadura: la ligera da +1 y la pesada +2 a tu tirada de absorción.','Armour: light gives +1 and heavy +2 to your soak roll.')) + '</li>' : '') + '<li>' + esc(t('Defenderse (el empate es del defensor): si tu resultado iguala o supera el del atacante, no hay daño. Si él queda por encima y tú sacas éxito o éxito con coste, daño −1. Si fallas, daño completo. Si pifias, el ataque sube un escalón.','Defend (ties go to the defender): if your result matches or beats the attacker’s, no damage. If they end up above and you got a success or a success at a cost, damage −1. If you fail, full damage. If you fumble, the attack goes up one step.')) + '</li><li>' + esc(t('Etiquetas: Daño 1–2 · La Parca · Esq Total / Parcial (mín. 1) / Nula / Difícil −2 / Fácil +2 · Abs Total / Máx N / Nula · Rejilla. Las etiquetas mandan sobre el empate: Parcial come 1 como mínimo, Nula no deja reaccionar. La Parca es una Llave al daño: si te alcanza y estás por debajo de su nivel, quedas fuera de combate, sin absorción que valga. Si se puede esquivar lo dice su Esq: el francotirador que no ves (Nula) no se esquiva, se evita; una granada, por su área, Difícil −2. A su altura, Daño 2 y defensa normal; por encima, nada sin Llave. Nunca mata.','Tags: Dmg 1–2 · The Reaper · Dodge Full / Partial (min 1) / None / Hard −2 / Easy +2 · Soak Full / Max N / None · Grid. Tags rule over ties: Partial eats at least 1, None allows no reaction. The Reaper is a Key to damage: if it reaches you and you are below its level, you are out of the fight, no soak allowed. Whether it can be dodged is its Dodge tag: the sniper you cannot see (None) is not dodged, it is avoided; a grenade, being an area, Hard −2. At its level, Dmg 2 and normal defence; above, nothing without a Key. It never kills.')) + '</li>' +
    (estilo() ? '<li>' + esc(isAcc()
      ? t('Estilo +2: contra enemigos por debajo o masillas ganas seguro; tiras el modo + 2 solo para ver cómo. Pifia: ridículo. Fallo (y en Caos, el éxito parcial): sucio o sin lucirte. Éxito: con estilo. Crítico: legendario.','Style +2: against foes below you or mooks you win for sure; you roll the mode + 2 only to see how. Fumble: ridiculous. Failure (and in Chaos, partial success): messy or without flair. Success: with style. Critical: legendary.')
      : t('Estilo +2: contra enemigos menores ganas seguro; tiras la tarjeta + 2 solo para ver cómo. Nunca cuesta: la banda de éxito con coste se lee como éxito. Pifia: ridículo. Fallo: olvidable. Éxito: molas. Crítico: lúcete.','Style +2: against lesser foes you win for sure; you roll the card + 2 only to see how. It never costs: the success-at-a-cost band reads as a success. Fumble: ridiculous. Failure: forgettable. Success: magnificent. Critical: show off.')) + '</li>' : '') +
    /* nucleo: el decorado sale aunque el Estilo este apagado */
    '<li>' + esc(t('El decorado lo declara el DJ y no te hace daño' + (estilo() ? ': se tira Estilo y cada tirada tumba a uno; con crítico, a varios.' : '.') + ' Si un enemigo puede hacerte daño, no es decorado: tiene ficha rápida y se tira normal.','The GM declares the scenery, and scenery does not hurt you' + (estilo() ? ': roll Style, each roll drops one; on a critical, several.' : '.') + ' If an enemy can hurt you, it is not scenery: it gets a quick sheet and you roll as normal.')) + '</li></ul></div>';
  var terror3 = isAcc() && ZOOM[zoomK()].units === 3;
  h += '<div class="rbox"><h3>' + esc(t('Vida','Health')) + '</h3><ul>' + (isAcc()
    ? (terror3
      ? '<li>' + esc(t('Modo Terror: 3 casillas, un solo bloque.','Terror mode: 3 boxes, a single block.')) + '</li><li>' + esc(t('Al llenarlo, fuera de combate. Sin −2 ni −4 por el camino.','When it fills, you are out of the fight. No −2 or −4 on the way.')) + '</li>'
      : '<li>' + esc(t('9 casillas de vida, en tres bloques de tres.','9 health boxes, in three blocks of three.')) + '</li><li>' + esc(t('1.er bloque lleno: −2 a lo que la herida estorbe. 2.º: −4 y pierdes las acciones complejas. 3.º: fuera de combate.','1st block full: −2 to whatever the wound hinders. 2nd: −4 and you lose complex actions. 3rd: out of the fight.')) + '</li>')
    : '<li>' + esc(pick(ZOOM[zoomK()].n) + ' · ' + ZOOM[zoomK()].units + t(' casillas por barra.',' boxes per track.')) + '</li><li>' + esc(t('1.er bloque lleno: −2. 2.º: −4. 3.º: fuera de combate.','1st block full: −2. 2nd: −4. 3rd: out of the fight.')) + '</li>') +
    /* T181: la barra es tension y vuelve entera; la consecuencia es la grieta y se queda */
    '<li>' + esc(isAcc()
      ? t('Cuando termina la amenaza y el DJ os declara a salvo, las casillas se borran. Las heridas se quedan: el penalizador del bloque que llenaste sigue hasta que te cures. Leves, cura sencilla; graves, cura grave; qué significa cada una lo decide el universo.','When the threat is over and the GM declares you safe, the boxes are cleared. Wounds stay: the penalty of the block you filled lasts until you heal. Light ones, simple cure; serious ones, serious cure; what each means is up to the universe.')
      : t('Cuando termina la amenaza y el DJ os declara a salvo, todas las barras vuelven enteras (también las del género). Un golpe que cruza un umbral deja una consecuencia, que ya no está en la barra sino en tu ficha: leves, cura sencilla; graves, cura grave; qué significa cada una lo decide el universo.','When the threat is over and the GM declares you safe, every track comes back whole (genre tracks too). A hit that crosses a threshold leaves a consequence, no longer on the track but on your sheet: light ones, simple cure; serious ones, serious cure; what each means is up to the universe.')) + '</li>' +
    '<li>' + esc(t('Nadie muere por una tirada: la muerte se pacta.','Nobody dies from a roll: death is agreed.')) + '</li></ul></div>';
  if (c.partial) h += '<div class="rbox"><h3>' + esc(t('Éxito parcial','Partial success')) + '</h3><p>' + esc(t('Lo consigues, pero el DJ elige un coste: tiempo, recurso, posición o fuego amigo.','You get it, but the GM picks a cost: time, resource, position or friendly fire.')) + '</p></div>';
  if (!isAcc()) h += '<div class="rbox"><h3>' + esc(t('Reglas extra','Extra rules')) + '</h3><ul>' + baul().map(function(k){ return '<li><b>' + esc(pick(DATA.baul[k])) + '.</b> ' + esc(pick(BAUL_TIP[k])) + '</li>'; }).join('') + '</ul><div class="lines"><div class="line">' + esc(t('Otras reglas de la mesa','Other table rules')) + '</div><div class="line"></div></div></div>';
  return h + '</div>';
}

/* ======================= SHEETS ======================= */
function a4(n, total, inner){ return '<section class="a4">' + inner + '<span class="pgno">' + esc(u('page')) + ' ' + n + ' / ' + total + '</span></section>'; }
function sheetHead(title, extra){
  return '<div class="sheethead"><div><h2>' + esc(title) + '</h2><div class="sub">' + esc(worldName()) + ' · ' + esc(isAcc() ? 'NOGUM Acelerado' : t('NOGUM completo','Complete NOGUM')) + ' · ' + esc(pick(card().n)) + (sceneOn() ? ' <span class="badge amber">' + esc(t('tono de escena','scene tone')) + '</span>' : '') + '</div></div><div class="badges">' + (extra || '') + '</div></div>';
}
function toolbar(extra){ return '<div class="sheetbar noprint"><button class="tool" type="button" data-print="1">' + esc(u('print')) + '</button>' + (extra || '') + '</div>'; }
function tracks(ch){
  var z = ZOOM[zoomK()], bars = isAcc() ? [BARS[0]] : BARS, h = '<div class="tracks">';
  /* Acelerado en Terror (2.7): 3 casillas, UN bloque, y al llenarlo fuera de
     combate. Sin −2 ni −4. */
  var nb = (isAcc() && z.units === 3) ? 1 : 3;
  bars.forEach(function(bar){
    var pts = ch ? (ch.dmg[bar[0]] || 0) : 0, per = z.units / nb;
    h += '<div class="track"><span>' + esc(isAcc() ? t('Vida','Health') : pick(bar.slice(1))) + '</span><div class="blocks">';
    for (var bI = 0; bI < nb; bI++) {
      h += '<div class="blk"><span class="lbl">' + esc(nb === 1 ? t('Lleno: fuera de combate','Full: out of the fight') : pick(BLOCKS[bI])) + '</span>';
      for (var k = 0; k < per; k++) { var idx = bI * per + k, lo = idx * z.size, hi = lo + z.size; h += '<button type="button" class="u' + (pts >= hi ? ' full' : pts > lo ? ' half' : '') + '"' + (ch ? ' data-bar="' + bar[0] + '" data-hi="' + hi + '" data-lo="' + lo + '"' : ' disabled') + ' aria-label="' + (idx + 1) + '"></button>'; }
      h += '</div>';
    }
    h += '</div></div>';
  });
  return h + '</div>';
}
function dots(n, onUpTo, clickable, attr){
  var h = '<span class="meter">';
  for (var i = 1; i <= n; i++) {
    var can = clickable.indexOf(i) > -1;
    h += '<button type="button" class="' + (i <= onUpTo ? 'on' : '') + (can ? '' : ' lock') + '"' + (can && attr ? ' ' + attr + ' data-n="' + i + '"' : ' tabindex="-1" disabled') + ' aria-label="+' + i + '"></button>';
  }
  return h + '</span>';
}
function bonusTxt(b){ return (b > 0 ? '+' : '') + b; }
var FOLDN = 3;   // tres Firmas pliegan la Disciplina; tres Disciplinas, el Dominio
function folds(c){
  var out = {dis:{}, dom:{}, amb:{}};
  if (!c) return out;
  AMB.forEach(function(a, ai){
    var domsOk = 0;
    a.doms.forEach(function(d, di){
      var disOk = 0;
      d.dis.forEach(function(x, si){
        var sk = ai + '.' + di + '.' + si, n = 0;
        c.fir.forEach(function(f){ if (f.key === sk && f.lv === 4) n++; });
        if (n >= FOLDN) { out.dis[sk] = true; disOk++; }
      });
      if (disOk >= FOLDN) { out.dom[ai + '.' + di] = true; domsOk++; }
    });
    if (domsOk >= a.doms.length) out.amb[ai] = true;
  });
  return out;
}
function skillGrid(c){
  var blank = !c, FD = folds(c), h = '<div class="skillgrid">';
  AMB.forEach(function(a, ai){
    /* el nivel del ambito es del personaje, no de la mesa: se sale en 1 (T176) */
    var has = !blank && ambHas(c, ai), lvl = blank ? 1 : ambLvl(c, ai);
    var best = blank ? null : (has ? -1 : -2);   /* ya no hay +0: Torpe −1 o Nulo −2 */
    var body = '';
    a.doms.forEach(function(d, di){
      var dk = ai + '.' + di, dOn = !blank && !!c.dom[dk];
      if (dOn) best = Math.max(best, 1);
      var fdom = FD.dom[dk];
      if (fdom) best = Math.max(best, 4);
      /* Torpe: hay algo en el ambito pero nada en esta columna. No es que no
         sepas: es que vas con el pie cambiado. */
      var torpe = !blank && !dOn && has;
      body += '<div class="dcol' + (torpe ? ' torpe' : '') + '"><div class="srow dom' + (fdom ? ' folded' : '') + '">' + dots(1, dOn ? 1 : 0, blank ? [] : [1], 'data-dom="' + dk + '"') + '<span class="nm">' + esc(pick(d.n)) + (fdom ? ' <span class="fold">' + esc(t('plegado +4','folded +4')) + '</span>' : '') + '</span><span class="bonus' + (torpe ? ' neg' : '') + '">' + (dOn ? '+1' : (torpe ? esc(t('Torpe −1','Clumsy −1')) : '')) + '</span></div>';
      d.dis.forEach(function(s, si){
        var sk = dk + '.' + si, sOn = !blank && !!c.dis[sk];
        if (sOn) best = Math.max(best, 2);
        var fdis = FD.dis[sk];
        if (fdis) best = Math.max(best, 4);
        body += '<div class="srow dis' + (fdis ? ' folded' : '') + '">' + dots(2, sOn ? 2 : (dOn ? 1 : 0), (!blank && dOn) ? [2] : [], 'data-dis="' + sk + '"') + '<span class="nm">' + esc(pick(s)) + (fdis ? ' <span class="fold">' + esc(t('plegada +4','folded +4')) + '</span>' : '') + '</span>' + (sOn ? '<button type="button" class="plus noprint" data-addf="' + sk + '" title="' + esc(t('Añadir firma','Add signature')) + '">+</button>' : '') + '<span class="bonus' + ((!sOn && torpe) ? ' neg' : '') + '">' + (sOn ? '+2' : (torpe ? '−1' : '')) + '</span></div>';
        if (!blank) c.fir.forEach(function(f, fi){
          if (f.key !== sk) return; best = Math.max(best, 4);
          body += '<div class="srow fir">' + dots(4, 4, [4], 'data-flv="' + fi + '"') + '<select data-fsel="' + fi + '"><option value="">' + esc(t('Firma…','Signature…')) + '</option>' + firmaList(sk).map(function(x, xi){ return '<option value="' + xi + '"' + (String(f.s) === String(xi) ? ' selected' : '') + ' title="' + esc(pick(x.d)) + '">' + esc(pick(x.n)) + '</option>'; }).join('') + '</select><button type="button" class="plus noprint" data-fdel="' + fi + '" title="' + esc(t('Quitar','Remove')) + '">×</button><span class="bonus">+4</span></div>' + (firmaOf(f) ? '<div class="fdesc">' + esc(pick(firmaOf(f).d)) + '</div>' : '');
        });
      });
      body += '</div>';
    });
    var cap = techo(ai), seg = '<span class="seg">';
    for (var g = 1; g <= 6; g++) {
      var over = cap ? g > cap : true;
      seg += '<button type="button" class="' + (g <= lvl ? 'on' : '') + (over ? ' cap' : '') + '"' + (blank || !cap || (a.id === 'arc' && !tieneArc(c)) ? ' disabled' : ' data-gridset="' + a.id + '" data-n="' + g + '"') + ' aria-label="' + g + '"></button>';
    }

/* Los techos de Rejilla (8.4) vienen de los datos, leidos de la ficha impresa
   de cada receta. Antes habia aqui una tabla copiada a mano y se quedo atras
   al expulsar la receta 15: seis recetas llevaban los techos de la de al lado. */
function techoReceta(r){ var x = DATA.techos && DATA.techos[r]; return (x && x.length === 5) ? x : null; }
function arcOpen(){
  if (M.known && M.world !== null) { var tc = techoReceta(KNOWN[M.world].r); return tc ? tc[4] > 0 : true; }
  var sp = M.sup || [];

}
function techos(){
  if (M.known && M.world !== null) { var tc = techoReceta(KNOWN[M.world].r); if (tc) return tc; }
  return [5,5,5,5, arcOpen() ? 5 : 0];
}
function techo(ai){ var v = techos()[ai]; return v === undefined ? 5 : v; }
/* 12 puntos, o 14 si el personaje tiene Arcano (T188): un humano en un mundo
   de vampiros tiene 12. Sin personaje (la plantilla), lo que permita el mundo. */
function tieneArc(c){ return arcOpen() && !(c && c.arc === false); }

function keyCost(k){ var n = k.lv || 1; return n * n * (k.w === 'all' ? 2 : 1); }

   Lo regalado o prestado no se paga. */
function itemGridN(it){ var m = /(?:Rejilla|Grid): (?:Nivel|Level) (\d)/.exec(pick(it.m) || '') || /(?:Parca|Reaper) · (?:Rejilla|Grid) (\d)/.exec(pick(it.d) || ''); return m ? +m[1] : 0; }
function gearAi(g){ var i = AMB.map(function(x){ return x.id; }).indexOf(g.amb || 'fis'); return i < 0 ? 0 : i; }
function gearKeys(c, g, it){ if (g.free) return 0; var p = itemKeysOf(it), N = itemGridN(it); if (!p || N < 2) return p; var x1 = N - 1, x = N - ambLvl(c, gearAi(g)); return x <= 0 ? 0 : Math.ceil(p * x * x / (x1 * x1)); }

function musdb(){

    a.onloadedmetadata = function(){ fin(true); };

function aud(){

function fundido(a, hasta, ms, luego){
  /* Con setInterval y NO con requestAnimationFrame: hay entornos donde la
     pagina no pinta (pestana de fondo, paneles embebidos, ahorro de energia)
     y rAF no dispara nunca. Alli el volumen se quedaba en 0 y la musica sonaba
     muda con el boton encendido. El valor final se asegura siempre. */
  var de = a.volume, t0 = Date.now(), listo = false, h = null;
  var pon = function(v){ try { a.volume = Math.max(0, Math.min(1, v)); } catch(e){} };
  var cerrar = function(){ if (listo) return; listo = true; if (h) clearInterval(h); pon(hasta); if (luego) luego(); };
  h = setInterval(function(){
    var p = (Date.now() - t0) / ms;
    if (p >= 1) return cerrar();
    pon(de + (hasta - de) * p);
  }, 40);
  setTimeout(cerrar, ms + 150);
}
function musPara(cb){
  var a = aud();
  if (a.paused) { musSon = null; if (cb) cb(); return; }
  fundido(a, 0, 260, function(){ a.pause(); musSon = null; if (musURL) { try { URL.revokeObjectURL(musURL); } catch(e){} musURL = null; } if (cb) cb(); });
}
function musToca(carta){

      if (!p || !p.blob) { musErr = t('Esa pista ya no está guardada.', 'That track is no longer stored.'); render(true); return; }
      var a = aud();
      musURL = URL.createObjectURL(p.blob);
      a.src = musURL; a.volume = 0; a.loop = true;
      a.play().then(function(){ musSon = carta; fundido(a, 1, 420); render(true); })
              .catch(function(){ musErr = t('El navegador no ha dejado sonar. Vuelve a pulsar.', 'The browser refused to play. Press again.'); render(true); });
    });
  });
}

function musMete(files){
  var lista = [].slice.call(files || []).filter(function(f){ return f && f.size; });
  if (!lista.length) return;
  musErr = '';
  var pend = lista.length, malos = [];
  lista.forEach(function(f){
    musValida(f).then(function(vale){
      if (!vale) { malos.push(f.name); pend--; if (!pend) musFin(malos); return; }
      var reg = {id:'m' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
                 nom:f.name.replace(/\.[^.]+$/, '').slice(0, 60), tipo:f.type || 'audio', carta:null, blob:f};
      musGuarda(reg).then(function(){ pend--; if (!pend) musFin(malos); })
        .catch(function(){ malos.push(f.name + ' ' + t('(no cabe o el navegador no deja guardar)','(too big, or the browser refused to store it)')); pend--; if (!pend) musFin(malos); });
    });
  });
}

    '<button type="button" class="mini strong" id="sceneBtn" aria-expanded="' + sceneOpen + '">' + esc(t('Cambiar tono de escena','Change scene tone')) + '</button>' +

    } else {
      h += '<div class="tonegrid"><span></span>' + CAOSCOLS.map(function(c){ return '<span class="axis">' + esc(pick(c.slice(1))) + '</span>'; }).join('');
      OPTROWS.forEach(function(r){
        h += '<span class="axis row">' + esc(pick(r.slice(1))) + '</span>';
        CAOSCOLS.forEach(function(c){
          var k = CELL[r[0] + '|' + c[0]];
          if (!k) { var alt = HOLE[r[0] + '|' + c[0]] || []; h += '<div class="tcellwrap">' + alt.map(function(x){ return '<button type="button" class="tcell hole' + (cardKey() === x ? ' on' : '') + '" data-scene="' + x + '"><b>' + esc(t('Hueco','Gap')) + '</b><small>' + esc(t('usa ','use ') + pick(CARDS[x].n)) + '</small></button>'; }).join('') + '</div>'; return; }
          h += '<div class="tcellwrap">' + musAltavoz(k) + '<button type="button" class="tcell' + (cardKey() === k ? ' on' : '') + '" data-scene="' + k + '"><b>' + esc(pick(CARDS[k].n)) + '</b><small>' + esc(pick(CARDS[k].roll)) + '</small></button></div>';

function skillsOf(c){
  var o = [];
  /* D1: ambito vacio −2 (Nulo); con algo comprado, la otra columna −1 (Torpe).
     Lo plegado por el acordeon tira a +4, como en la ficha. */
  AMB.forEach(function(a, ai){
    if (!ambHas(c, ai)) o.push({k:'a' + ai, n:pick(a.n) + ' · ' + t('nada comprado (Nulo)','nothing bought (Null)'), b:-2});
    a.doms.forEach(function(d, di){
      if (!c.dom[ai + '.' + di]) { if (ambHas(c, ai)) o.push({k:'t' + ai + di, n:pick(a.n) + ' · ' + pick(d.n) + ' (' + t('Torpe','Clumsy') + ')', b:-1}); return; }
      o.push({k:'d' + ai + di, n:pick(d.n), b:bonoCol(c, ai, di)});
      d.dis.forEach(function(s, si){ if (c.dis[ai + '.' + di + '.' + si]) o.push({k:'s' + ai + di + si, n:pick(d.n) + ' › ' + pick(s), b:Math.max(2, bonoCol(c, ai, di), folds(c).dis[ai + '.' + di + '.' + si] ? 4 : 2)}); });
    });
  });
  c.fir.forEach(function(f, fi){ var it = firmaOf(f); o.push({k:'f' + fi, n:(it ? pick(it.n) : t('Firma sin elegir','Unchosen signature')) + ' (' + pick(disName(f.key)) + ')', b:f.lv}); });
  return o;
}
function diceBonus(){
  var D = S.dice, c = S.chars.filter(function(x){ return x.id === D.pc; })[0], base = D.bonus;
  if (c && D.sk) { var s = skillsOf(c).filter(function(x){ return x.k === D.sk; })[0]; if (s) base = s.b; }
  /* La tirada de Estilo es la tarjeta + Estilo (+2), y nada mas (4.5 B; Acelerado 2.8) */
  var raw = D.style ? 2 : base + D.diff + D.mod;
  return {base:base, raw:raw, tot:Math.max(-2, Math.min(4, raw)), c:c};
}
function d10(){ var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % 10 + 1; }
function banda(C, side, r, nat){
  var w = side ? (C.bc || 'normal') : (C.bp || 'normal');
  if (C.r === 'suma') return side ? nat >= 19 : nat <= 3;
  if (w === 'estrecha') return side ? (r[0] === 10 && r[1] === 10) : (r[0] === 1 && r[1] === 1);
  if (w === 'normal') return side ? nat >= 10 : nat <= 1;
  return side ? nat >= 9 : nat <= 2;
}
function rollNow(){
  var C = card(), r = d10(), b = d10(), nat, use, m = C.r || 'rojo';
  if (m === 'rojo') { nat = r; use = 'r'; }
  else if (m === 'mejor') { nat = Math.max(r, b); use = r >= b ? 'r' : 'b'; }
  else if (m === 'peor') { nat = Math.min(r, b); use = r <= b ? 'r' : 'b'; }
  else { nat = r + b; use = 'both'; }
  var fum = banda(C, 0, [r, b], nat), cri = banda(C, 1, [r, b], nat);
  var B = diceBonus(), tot = nat + B.tot, tn = C.tn || 6, out;
  if (fum) out = 'fum'; else if (cri) out = 'cri';
  else if (C.coste && tot >= tn && tot <= tn + 1) out = 'part';
  else out = tot >= tn ? 'ok' : 'fail';
  /* ED-26: en el completo el Estilo nunca cuesta, la banda de coste es exito a
     secas. En el Acelerado (ED-15) el parcial del Caos se lee «ganas, pero sucio». */
  if (S.dice.style && out === 'part' && !isAcc()) out = 'ok';
  lastRoll = {m:m === 'rojo' ? 'red' : m, r:r, b:b, use:use, nat:nat, bonus:B.tot, tot:tot, tn:tn, out:out, style:S.dice.style, mode:pick(C.n), who:B.c ? (B.c.name || u('pc')) : ''};
  diceLog.unshift(lastRoll); if (diceLog.length > 10) diceLog.pop();
}

function pwHash(s){ var h = 5381, x = 'nogum:' + s; for (var i = 0; i < x.length; i++) h = ((h * 33) ^ x.charCodeAt(i)) >>> 0; return h.toString(36); }

function sections(withSecret){

function codeMake(){
  var p = ['N1', 'T' + CARD3[cardBase()], 'Z' + (ZOOMK.indexOf(M.zoom || 'carne') + 1 || 2), 'G' + grid(), 'S' + (M.estilo !== false ? 1 : 0), 'B' + hx(baulMask(), 4)];

  p.push('E' + (isAcc() ? 'A' : 'C'));

     y una app vieja que lea este simplemente lo ignora */

  if (keysExtra()) p.push('K' + keysExtra());
  return p.join('-');
}

function codeParse(str){
  var o = {}, tk = String(str || '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim().split(' ');
  if (!tk.length || tk[0] !== 'N1') return null;
  for (var i = 1; i < tk.length; i++) {
    var k = tk[i].charAt(0), v = tk[i].slice(1);
    if (k === 'T') { if (!C3[v]) return null; o.card = C3[v]; }
    else if (k === 'Z') o.zoom = ZOOMK[(+v) - 1] || 'carne';
    else if (k === 'G') o.grid = Math.max(1, Math.min(5, (+v) || 1));
    else if (k === 'S') o.estilo = v !== '0';
    else if (k === 'B') o.baul = parseInt(v, 16) || 0;
    else if (k === 'W') o.world = +v;
    else if (k === 'U') o.unis = parseInt(v, 16) || 0;
    else if (k === 'E') o.edition = (v === 'A') ? 'acelerado' : 'completo';
    else if (k === 'P') o.pts = +v || 0;
    else if (k === 'K') o.kx = +v || 0;
  }
  return o.card ? o : null;
}
function applyCode(str){
  var c = codeParse(str); if (!c) return false;

  if (c.world !== undefined && KNOWN[c.world]) { M.known = true; M.world = c.world; M.unis = null; }

    var u = UNIID.filter(function(id, i){ return (c.unis >> i) & 1; });

  M.grid = c.grid || 1;
  M.estilo = c.estilo !== false;

  setBaulMask(c.baul || 0);
  S.scene = null; S.locked = true; S.fix = null;
  return true;
}

function dataABlob(d){
  var i = d.indexOf(','), tipo = d.slice(5, i).split(';')[0], b = atob(d.slice(i + 1)), u8 = new Uint8Array(b.length);
  for (var k = 0; k < b.length; k++) u8[k] = b.charCodeAt(k);
  return new Blob([u8], {type:tipo});
}
// Al abrir: las pistas del archivo se guardan, y las tarjetas que ellas ocupan
// se sueltan aqui, para que no haya dos pistas en la misma tarjeta.
function musicaDesdeArchivo(lista){
  var cartas = lista.map(function(x){ return x.carta; }).filter(Boolean);
  return musRefresca().then(function(locales){
    return Promise.all(locales.filter(function(p){ return p.carta && cartas.indexOf(p.carta) > -1; }).map(function(p){
      return musPide(function(st){ return st.get(p.id); }).then(function(reg){ if (reg) { reg.carta = null; return musGuarda(reg); } });
    }));
  }).then(function(){
    return Promise.all(lista.map(function(x){ return musGuarda({id:x.id, nom:x.nom, tipo:x.tipo, carta:x.carta, blob:dataABlob(x.data)}); }));
  }).then(function(){ return musRefresca(); });
}
function nPistas(n){ return n === 1 ? t('1 pista', '1 music track') : n + t(' pistas', ' music tracks'); }
function guardaMesa(conMusica){
  if (!conMusica) return bajaArchivo(gameJson(), gameName(), 'cfgJson');
  return musicaParaArchivo().then(function(m){
    var o = gameObj(); o.musica = m;
    return bajaArchivo(JSON.stringify(o), gameName().replace(/\.json$/, '-con-musica.json'), 'cfgJson').then(function(msg){
      return msg + ' ' + (m.length ? t('Lleva ' + nPistas(m.length) + ' de música.', 'It carries ' + nPistas(m.length) + '.') : t('No había música que guardar.','There was no music to save.'));
    });
  });
}
function importGame(txt, alAcabarMusica){
  var o = null;
  try { o = JSON.parse(txt); } catch(e){}
  if (!o || o.app !== 'NOGUM' || !o.m) { rbBad = true; return t('Eso no es una partida de NOGUM.','That is not a NOGUM game.'); }
  var aviso = t('La partida del archivo reemplaza esta mesa y todas sus fichas. ¿Seguir?','The game in the file replaces this table and all its sheets. Continue?');
  if (o.ver && o.ver !== appVer()) aviso = t('Esta mesa se guardó con otra versión de las preguntas de la app. La mesa, las fichas y la historia se abren igual, pero las respuestas de los formularios pueden no coincidir.',
    'This table was saved with another version of the app’s questions. The table, sheets and story open the same, but the form answers may not match.') + '\n\n' + aviso;
  if (!confirm(aviso)) { rbBad = false; return ''; }
  rbUndo = null;
  restoreM(JSON.stringify(o.m));
  S.chars = Array.isArray(o.chars) ? o.chars : [];
  if (o.story) S.story = o.story;
  if (o.lang) S.lang = o.lang;
  if (o.askMode) S.askMode = o.askMode;
  if (o.q && typeof o.q === 'object') S.q = o.q;
  S.locked = o.locked !== false; S.scene = null; S.fix = null; S.tab = 'tpl'; S.form = null; S.st = {}; S.ia = {};
  rbBad = false;
  if (Array.isArray(o.musica) && o.musica.length) {
    var fin = alAcabarMusica || function(m){ rbMsg = m; render(true); }, n = o.musica.length;
    musicaDesdeArchivo(o.musica).then(function(){ fin(t('Partida abierta, con ' + nPistas(n) + ' de música.', 'Game loaded, with ' + nPistas(n) + '.')); },
      function(){ fin(t('Partida abierta, pero la música no ha cabido en este navegador.','Game loaded, but the music did not fit in this browser.')); });
    return t('Partida abierta: mesa, fichas e historia. Metiendo la música…','Game loaded: table, sheets and story. Loading the music…');
  }
  return t('Partida abierta: mesa, fichas e historia.','Game loaded: table, sheets and story.');
}

function bindCfg(){
  var aviso = function(m, ok){ cfgIAmsg = m; cfgIAok = ok; render(true); };
  $('cfgProv').addEventListener('change', function(){ try { localStorage.setItem(PROV_K, this.value); } catch(e){} eligeIA(); cfgIAmsg = ''; render(true); });
  $('cfgSave').addEventListener('click', function(){
    var v = ($('cfgKey').value || '').trim();
    if (!v) { aviso(t('Pega primero la clave.','Paste the key first.'), false); return; }
    // si la clave es claramente de otro proveedor, se cambia solo y se avisa
    var de = provDeClave(v), cambio = de && de !== provActual();
    if (cambio) try { localStorage.setItem(PROV_K, de); } catch(e){}
    guardaClave(v, $('cfgRec').checked); eligeIA();
    aviso((cambio ? t('Es una clave de ','That is a key for ') + PROVS[de].n + t(': cambio el proveedor. ','; switching provider. ') : '') + t('Clave guardada. Compruébala con «Probar la conexión».','Key saved. Check it with “Test the connection”.'), null);
  });
  var d = $('cfgDel'); if (d) d.addEventListener('click', function(){ guardaClave('', false); eligeIA(); aviso(t('Clave borrada de este navegador.','Key deleted from this browser.'), null); });
  $('cfgRec').addEventListener('change', function(){ var k = claveActual(); if (k) guardaClave(k, this.checked); render(true); });
  $('cfgModel').addEventListener('change', function(){ try { localStorage.setItem(kModelo(provActual()), this.value.trim()); } catch(e){} cfgIAmsg = ''; render(true); });
  var p = $('cfgTest'); if (p) p.addEventListener('click', function(){
    aviso(t('Probando…','Testing…'), null);
    byokSample(t('Contesta solo con la palabra: funciona','Reply with just the word: works'), {max:400}).then(function(r){
      aviso(t('Funciona. ','It works. ') + modeloNombre() + t(' ha contestado: «',' replied: “') + r.text.trim().slice(0, 60) + t('».','”.'), true);
    }, function(e){
      if (!e || e.code !== 'modelo') { aviso(errText(e), false); return; }
      // el nombre del modelo ha caducado o no esta en tu cuenta: se enseñan los que hay
      modelosDeLaClave().then(function(ls){
        aviso(errText(e) + (ls.length ? ' ' + t('Los que tiene tu clave: ','Your key has: ') + ls.slice(0, 15).join(', ') + (ls.length > 15 ? '…' : '') : ''), false);
      }, function(){ aviso(errText(e), false); });
    });
  });
  var hecho = function(m){ cfgMsg = m; render(true); };
  $('cfgExp').addEventListener('click', function(){ hecho(t('Guardando…','Saving…')); guardaMesa(false).then(hecho); });
  $('cfgExpM').addEventListener('click', function(){
    hecho(t('Preparando la mesa con su música…','Preparing the table with its music…'));
    guardaMesa(true).then(hecho, function(){ hecho(t('No se ha podido leer la música de este navegador.','Could not read the music from this browser.')); });
  });
  $('cfgImp').addEventListener('change', function(){
    var f = this.files && this.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      var m = importGame(String(r.result), function(fin){ cfgMsg = fin; persist(); render(true); });
      if (m && !rbBad) S.tab = 'cfg';       // se queda aqui para leer el resultado
      cfgMsg = m; persist(); render();
    };
    r.readAsText(f);
  });
}

function rbCopy(txt, id){
  var el = $(id);
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt); return true; } } catch(e){}
  try { if (el) { el.value = txt; el.select(); return document.execCommand('copy'); } } catch(e){}
  return false;
}
document.addEventListener('click', function(e){
  var b = e.target.closest('.rulesbar [data-rbb]'); if (!b) return;
  var k = b.getAttribute('data-rbb');
  if (k !== 'apply' && k !== 'undo') rbUndo = null;
  if (k === 'estilo') { M.estilo = !estilo(); rbMsg = ''; }
  else if (k === 'baul' || k === 'code' || k === 'file') { rbOpen = (rbOpen === k) ? null : k; rbMsg = ''; }
  else if (k === 'baulk') { toggleBaul(+b.getAttribute('data-k')); }
  else if (k === 'ctxgo') { S.tab = 'form'; S.form = 'contexto'; S.ctx = {step:(M.known && M.world !== null) ? -1 : 0, a:{}, applied:false, more:false}; rbOpen = null; rbMsg = ''; persist(); render(); window.scrollTo(0,0); return; }
  else if (k === 'copy') { rbBad = !rbCopy(codeMake(), 'rbCode'); rbMsg = rbBad ? t('Cópialo a mano desde el recuadro.','Copy it by hand from the box.') : t('Código copiado.','Code copied.'); }
  else if (k === 'copylink') { rbBad = !rbCopy(codeLink(), 'rbCode'); rbMsg = rbBad ? t('Cópialo a mano desde el recuadro.','Copy it by hand from the box.') : t('Enlace copiado.','Link copied.'); }
  else if (k === 'apply') {
    var v = $('rbCodeIn') ? $('rbCodeIn').value : '';
    if (applyCode(v)) { rbBad = false; rbMsg = t('Mesa cambiada: ','Table changed: ') + pick(card().n) + ' · ' + worldName(); rbOpen = null; }
    else { rbBad = true; rbMsg = t('Ese Código no se entiende. Debe empezar por N1.','That Code cannot be read. It has to start with N1.'); }
  }
  else if (k === 'export') { rbMsg = exportGame(); }
  else if (k === 'importpaste') { rbMsg = importGame($('rbJson') ? $('rbJson').value : ''); if (rbMsg && !rbBad) rbOpen = null; }
  else if (k === 'undo') { if (rbUndo) { restoreM(rbUndo); rbUndo = null; S.scene = null; rbMsg = t('Se ha deshecho el cambio.','The change has been undone.'); rbBad = false; } }
  else if (k === 'hide') { rbMsg = ''; }
  else return;
  persist(); render(true);
});
document.addEventListener('change', function(e){
  var el = e.target.closest('.rulesbar [data-rb], .rulesbar [data-rbfile]'); if (!el) return;
  if (el.getAttribute('data-rbfile')) {
    var f = el.files && el.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(){ rbMsg = importGame(String(r.result)); if (rbMsg && !rbBad) rbOpen = null; persist(); render(); };
    r.onerror = function(){ rbBad = true; rbMsg = t('No se ha podido leer el archivo.','The file could not be read.'); render(true); };
    r.readAsText(f); return;
  }
  var f2 = el.getAttribute('data-rb'), v = el.value;
  rbMsg = ''; rbUndo = null;
  if (f2 === 'world') {
    var i = +v;
    if (i < 0) {
      if (M.tech === null || M.tech === undefined) { S.tab = 'form'; S.form = 'uni'; S.st.uni = 0; persist(); render(); window.scrollTo(0,0); return; }
      M.known = false; M.world = null;
    } else { M.known = true; M.world = i; M.unis = null; rbMsg = t('Universo cambiado. Si además quieres su receta de tono entera, cámbiala con la tarjeta y el resto de la barra.','Universe changed. If you also want its whole tone recipe, set it with the card and the rest of the bar.'); }
  }
  else if (f2 === 'edition') M.edition = v;
  else if (f2 === 'card') setCard(v);
  else if (f2 === 'acc') setAccMode(v);
  else if (f2 === 'zoom') M.zoom = v;
  else if (f2 === 'grid') M.grid = +v;
  else if (f2 === 'pts') M.pts = xpNum(v);
  else if (f2 === 'kx') M.kx = xpNum(v);
  persist(); render(true);
});
function fromHash(live){
  var m = /[#&?]c=([A-Za-z0-9\-]+)/.exec(location.hash || '');
  if (!m) return false;
  var ok = applyCode(m[1]);
  if (ok) {
    S.tab = 'tpl'; rbOpen = null; rbBad = false;
    rbMsg = t('Mesa cargada desde el enlace: ','Table loaded from the link: ') + pick(card().n) + ' · ' + worldName();
    persist();
  }
  try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
  if (ok && live) { render(); window.scrollTo(0,0); }
  return ok;
}
window.addEventListener('hashchange', function(){ fromHash(true); });
fromHash(false);

/* ======================= RENDER ======================= */
function render(keep){
  renderTop();
  var v = $('view'), y = window.scrollY;
  if (S.tab === 'form') { v.innerHTML = renderForm(); bindForm(); }
  else if (S.tab === 'tpl') { v.innerHTML = renderTemplate(); var cb = $('createBtn'); if (cb) cb.addEventListener('click', function(){ var c = newChar(); S.chars.push(c); S.tab = c.id; S.form = null; persist(); render(); window.scrollTo(0,0); }); }
  else if (S.tab === 'ask') { v.innerHTML = renderAsk(); $('askBtn').addEventListener('click', ask); $('stopBtn').addEventListener('click', function(){ if (ctl) ctl.abort(); }); $('clearBtn').addEventListener('click', function(){ if (S.askMode === 'camp') campReset(); else turns = []; $('chat').innerHTML = ''; }); v.querySelectorAll('[data-amode]').forEach(function(b){ b.addEventListener('click', function(){ S.askMode = b.getAttribute('data-amode'); pendingQ = null; persist(); render(); }); }); if ($('askLock')) $('askLock').addEventListener('click', function(){ unlocked = false; campReset(); render(); }); $('askQ').addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); } }); }
  else if (S.tab === 'dice') { v.innerHTML = renderDice(); bindDice(); }
  else if (S.tab === 'story') { v.innerHTML = renderStory(); bindStory(); }
  else if (S.tab === 'ses') { v.innerHTML = renderSes(); $('sesBtn').addEventListener('click', analyse); }
  else if (S.tab === 'cfg') { v.innerHTML = renderCfg(); bindCfg(); }
  else {
    var c = S.chars.filter(function(x){ return x.id === S.tab; })[0];
    if (!c) { S.tab = 'tpl'; return render(); }
    v.innerHTML = renderChar(c, S.chars.indexOf(c));
    var sh = $('pcSheet');
    sh.addEventListener('click', function(e){ onChar(e, c); });
    $('f-name').addEventListener('input', function(){ c.name = this.value; persist(); renderTop(); var h2 = sh.querySelector('.sheethead h2'); if (h2) h2.textContent = c.name || (u('pc') + ' ' + (S.chars.indexOf(c) + 1)); });
    ['concept','keys','notes'].forEach(function(k){ $('f-' + k).addEventListener('input', function(){ c[k] = this.value; persist(); }); });
    if ($('f-arc')) $('f-arc').addEventListener('change', function(){ c.arc = this.checked; persist(); render(true); });
    if ($('f-kw')) $('f-kw').addEventListener('input', function(){ c.kw = Math.max(0, +this.value || 0); persist(); render(true); });
    sh.querySelectorAll('[data-ktxt]').forEach(function(x){ x.addEventListener('input', function(){ c.klist[+x.getAttribute('data-ktxt')].t = x.value; persist(); }); });
    sh.querySelectorAll('[data-kform]').forEach(function(x){ x.addEventListener('change', function(){ c.klist[+x.getAttribute('data-kform')].w = x.value; persist(); render(true); }); });
    sh.querySelectorAll('[data-klv]').forEach(function(x){ x.addEventListener('change', function(){ c.klist[+x.getAttribute('data-klv')].lv = +x.value; persist(); render(true); }); });
    if ($('f-ksp')) $('f-ksp').addEventListener('input', function(){ c.ksp = Math.max(0, +this.value || 0); persist(); render(true); });
    /* elegir el ambito no sube nada: sube el boton +1 Rejilla, y se paga */
    sh.querySelectorAll('[data-gamb]').forEach(function(x){ x.addEventListener('change', function(){ var gx = c.gear[+x.getAttribute('data-gamb')]; if (gx) gx.amb = x.value; persist(); render(true); }); });
    sh.querySelectorAll('[data-gj]').forEach(function(x){ x.addEventListener('change', function(){ c.gj = c.gj || {}; c.gj[x.getAttribute('data-gj')] = +x.value; persist(); render(true); }); });
    sh.querySelectorAll('[data-potamb]').forEach(function(x){ x.addEventListener('change', function(){ c.potAmb = x.value; persist(); render(true); }); });
    sh.querySelectorAll('select[data-grid]').forEach(function(s){ s.addEventListener('change', function(){ c.grid[s.getAttribute('data-grid')] = +s.value; persist(); }); });
    sh.querySelectorAll('select[data-fsel]').forEach(function(s){ s.addEventListener('change', function(){ c.fir[+s.getAttribute('data-fsel')].s = s.value; persist(); render(true); }); });
    var gs = groups();
    $('gType').addEventListener('change', function(){ var g = gs[+this.value], it = $('gItem'); it.innerHTML = '<option value="">' + esc(t('Objeto…','Item…')) + '</option>' + (g ? g.items.map(function(x, i){ return '<option value="' + i + '">' + esc(pick(x.n)) + ' — ' + esc(pick(x.d)) + '</option>'; }).join('') : ''); it.disabled = !g; $('gAdd').disabled = true; });
    $('gItem').addEventListener('change', function(){ $('gAdd').disabled = this.value === ''; });
  }
  v.querySelectorAll('[data-print]').forEach(function(b){ b.addEventListener('click', function(){ window.print(); }); });
  if (keep) window.scrollTo(0, y);
}
if (M.known === null) { S.form = null; }
render();
musRefresca().then(function(){ if (MUSP.length) render(true); });
})();
</script>
</body>
