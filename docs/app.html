/* ======================= LOS TRES FORMULARIOS ======================= */
/* 1. El tono escribe la mesa. 2. El contexto recomienda las reglas extra.
   3. El equipo escribe en una ficha. Los dos primeros viajan en el Código;
   el tercero no: el equipo es de quien lleva la ficha. */

/* ---------------- 4. el equipo ---------------- */
/* ---------------- 3. el equipo ---------------- */
function resBonus(c){ return bonoDis(c, 2, 1, 3); }   /* Social > Jerarquia > Recursos */
/* Desde la v2 el catalogo trae el precio en tres columnas: Acceso (it.m),
   Puntos (it.p) y Llaves (it.k). Se lee el numero del principio: «1 por
   hechizo» son 1, «—» es 0. */
function cifra(x){ var m = /^\s*(\d+)/.exec(pick(x) || ''); return m ? +m[1] : 0; }
/* Acelerado (2.9): el equipo solo cuesta dinero, sin puntos ni Llaves; lo
   que pide es sitio: tres objetos. */
function itemPtsOf(it){ return isAcc() ? 0 : cifra(it.p); }
function itemKeysOf(it){ return isAcc() ? 0 : cifra(it.k); }
/* el precio, para leerlo de un vistazo: «Acceso 2 · 1 pt · 1 Llave» */
function costeTxt(it){
  var a = accOf(it), p = cifra(it.p), k = cifra(it.k), o = [];
  o.push(a === 9 ? t('sin Acceso','no Access') : t('Acceso ','Access ') + a);
  if (p) o.push(p + ' ' + t(p === 1 ? 'punto' : 'puntos', p === 1 ? 'point' : 'points'));
  if (k) o.push(/^\s*\d+\s*$/.test(pick(it.k)) ? k + ' ' + t(k === 1 ? 'Llave' : 'Llaves', k === 1 ? 'Key' : 'Keys') : t('Llaves: ','Keys: ') + pick(it.k));
  return o.join(' · ');
}
function accTres(c){ return isAcc() && (c.gear || []).length > 3; }
function accSem(c, it){
  var a = accOf(it);
  if (a === 9) return ['na', t('no se compra con dinero','not bought with money')];
  /* la tabla de los cajones de Recursos (5.6): lo cotidiano (Acceso 0) esta siempre al
     alcance, tambien con Recursos −1 o −2; de +0 a +2 se llega un escalon mas
     arriba con esfuerzo, una vez por arco; +4 llega a 3 y no hay mas arriba */
  var r = resBonus(c), siempre = r >= 4 ? 3 : Math.max(0, r), esfuerzo = (r >= 0 && r <= 2) ? siempre + 1 : siempre;
  if (a <= siempre) return ['ok', t('a tu alcance','within reach')];
  if (a <= esfuerzo) return ['mid', t('con esfuerzo: una vez por arco, y con precio','with effort: once per arc, and at a price')];
  return ['bad', t('fuera de tu alcance aquí','out of reach here')];
}
function eqRef(r){ return r.u + '|' + r.b + '|' + r.i; }
function eqItem(key){
  var p = String(key).split('|');
  var b = DATA.bazar.filter(function(x){ return x.id === p[0]; })[0];
  var it = b && b.blocks[+p[1]] && b.blocks[+p[1]].items[+p[2]];
  return it ? {u:p[0], b:+p[1], i:+p[2], it:it} : null;
}
function eqChar(){ return S.chars.filter(function(x){ return x.id === (S.eq && S.eq.who); })[0]; }
/* acentos fuera y todo en minusculas, que nadie escribe «Katana» con mayuscula */
function norm(x){ return String(x == null ? '' : x).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function eqBusca(q){
  var pal = norm(q).split(/\s+/).filter(function(x){ return x.length > 1; });
  if (!pal.length) return [];
  var out = [];
  DATA.bazar.forEach(function(bz){
    if (universes().indexOf(bz.id) < 0) return;
    var un = norm(uniName(bz.id));
    bz.blocks.forEach(function(bl, bi){
      var bn = norm(pick(bl.n));
      bl.items.forEach(function(it, ii){
        var nom = norm(pick(it.n));
        var todo = nom + ' ' + norm(pick(it.x)) + ' ' + norm(pick(it.d)) + ' ' + norm(pick(it.e)) +
          ' ' + norm(pick(it.a)) + ' ' + norm(pick(it.m)) + ' ' + bn + ' ' + un;
        for (var k = 0; k < pal.length; k++) if (todo.indexOf(pal[k]) < 0) return;
        var enNombre = 1;
        for (var j = 0; j < pal.length; j++) if (nom.indexOf(pal[j]) < 0) { enNombre = 0; break; }
        out.push({u:bz.id, b:bi, i:ii, it:it, nm:enNombre ? 0 : 1});
      });
    });
  });
  out.sort(function(a, b){ return (a.nm - b.nm) || (accOf(a.it) - accOf(b.it)); });
  return out;
}
function eqFicha(c, r){
  var key = eqRef(r), on = S.eq.sel.indexOf(key) > -1, sem = accSem(c, r.it);

    '<em class="sem ' + sem[0] + '">' + esc(sem[1]) + (p ? ' · ' + p + ' ' + esc(t(p === 1 ? 'punto' : 'puntos', 'pt' + (p === 1 ? '' : 's'))) : '') +

}

      esc(t('¿Qué buscáis?','What are you looking for?')) + '</p>' +
      '<div class="eqbuscar"><input type="search" id="eqq" autocomplete="off" spellcheck="false" placeholder="' +
      esc(t('katana, cuerda, veneno, implante…','katana, rope, poison, implant…')) + '" value="' + esc(E.busca || '') + '"></div>' +
      '<div id="eqres">' + eqResHTML(c) + '</div>' +
      '<p class="eqnote">' + esc(t('Se busca en el nombre y en lo que hace cada objeto, solo dentro del equipo que tu mesa tiene abierto.',
        'It searches names and what each item does, only within the gear your table has open.')) + '</p>' +
      '<div class="nav" id="eqnav"><button type="button" class="btn" data-eq="arbol">' +
      esc(t('No sé cómo se llama · búscalo por lo que hace','I do not know its name · search by what it does')) + ' →</button>' +
      '<button type="button" class="btn go" data-eq="cuenta"' + (E.sel.length ? '' : ' disabled') + '>' +
      esc(t('Ir a la cuenta','Go to the bill')) + (E.sel.length ? ' (' + E.sel.length + ')' : '') + ' →</button></div></div></div>';
    return h;
  }
  /* y si no, el arbol de cuatro preguntas */
  if (!E.cat) {
    var q = FINDQ[E.fstep];
    h += '<div class="page"><p class="kick">' + esc(t('Por lo que hace','By what it does')) + ' · ' + (E.fstep + 1) + ' / 4</p><p class="big">' + esc(pick(q.q)) + '</p><div class="choices">' +
      '<button type="button" class="choice" data-eqf="y"><span>' + esc(t('Sí','Yes')) + '</span><span class="mark"></span></button>' +
      '<button type="button" class="choice" data-eqf="n"><span>' + esc(t('No','No')) + '</span><span class="mark"></span></button></div>';
    if (!arcOpen()) h += '<p class="eqnote">' + esc(t('En este mundo no hay Arcano, así que la magia y los poderes no salen en la lista.','This world has no Arcane, so magic and powers do not appear in the list.')) + '</p>';
    h += '<div class="nav"><button type="button" class="btn" data-eq="busca">← ' + esc(t('Buscar por palabra','Search by word')) + '</button>' +
      (E.sel.length ? '<button type="button" class="btn go" data-eq="cuenta">' + esc(t('Ir a la cuenta','Go to the bill')) + ' (' + E.sel.length + ') →</button>' : '<span></span>') +
      '</div></div></div>';
    return h;
  }
  /* paso 2: la lista */
  var list = findItems(E.cat);
  h += '<div class="page"><p class="kick">' + esc(pick(CATN[E.cat])) + ' · ' + list.length + ' ' + esc(t('en tu mesa','on your table')) + '</p>' +
    '<p class="big">' + esc(t('Elige lo que quieras llevarte','Pick whatever you want to take')) + '</p>' +
    '<p class="hint">' + esc(t('Ordenados de lo más fácil de conseguir a lo más difícil. Puedes marcar varios.','Sorted from easiest to hardest to get hold of. You can tick several.')) + '</p><div class="flist">';
  list.forEach(function(r){ h += eqFicha(c, r); });
  h += '</div><div class="nav"><button type="button" class="btn" data-eq="fres">← ' + esc(t('Otra búsqueda','Another search')) + '</button>' +
    '<button type="button" class="btn go" data-eq="cuenta"' + (E.sel.length ? '' : ' disabled') + '>' + esc(t('Ir a la cuenta','Go to the bill')) + (E.sel.length ? ' (' + E.sel.length + ')' : '') + ' →</button></div></div></div>';
  return h;
}

function bindEq(){
  var v = $('view'), E = S.eq;
  v.querySelectorAll('[data-eqwho]').forEach(function(b){ b.addEventListener('click', function(){
    E.who = b.getAttribute('data-eqwho'); E.modo = 'busca'; E.busca = ''; E.fstep = 0; E.cat = null; E.sel = [];
    persist(); render(); window.scrollTo(0, 0);
  }); });
  /* el buscador se repinta solo por dentro, para no perder el foco al escribir */
  var inp = $('eqq');
  if (inp) {
    function repinta(){
      var box = $('eqres'); if (box) box.innerHTML = eqResHTML(eqChar());
      var nav = $('eqnav'); if (nav) {
        var go = nav.querySelector('[data-eq="cuenta"]');
        if (go) { go.disabled = !E.sel.length; go.textContent = t('Ir a la cuenta','Go to the bill') + (E.sel.length ? ' (' + E.sel.length + ')' : '') + ' →'; }
      }
    }
    inp.addEventListener('input', function(){ E.busca = inp.value; persist(); repinta(); });
    var box0 = $('eqres');
    if (box0) box0.addEventListener('click', function(ev){
      var b = ev.target.closest('[data-eqadd]'); if (!b) return;
      var key = b.getAttribute('data-eqadd'), i = E.sel.indexOf(key);
      if (i > -1) E.sel.splice(i, 1); else E.sel.push(key);
      persist(); repinta();
    });
    if (window.matchMedia && window.matchMedia('(min-width:768px)').matches) { try { inp.focus(); } catch(e){} }
  }
  v.querySelectorAll('[data-eqf]').forEach(function(b){ b.addEventListener('click', function(){
    var q = FINDQ[E.fstep], nx = q[b.getAttribute('data-eqf')];
    if (typeof nx === 'string') { E.cat = nx; E.modo = 'lista'; } else { E.fstep = nx; }
    persist(); render(); window.scrollTo(0,0);
  }); });
  v.querySelectorAll('[data-eqadd]').forEach(function(b){ b.addEventListener('click', function(){
    var key = b.getAttribute('data-eqadd'), i = E.sel.indexOf(key);
    if (i > -1) E.sel.splice(i, 1); else E.sel.push(key);
    persist(); render(true);
  }); });
  v.querySelectorAll('[data-eq]').forEach(function(b){ b.addEventListener('click', function(){
    var k = b.getAttribute('data-eq');
    if (k === 'exit') { S.form = null; }
    else if (k === 'who') { E.who = null; E.modo = 'busca'; }
    else if (k === 'busca') { E.modo = 'busca'; E.cat = null; E.fstep = 0; }
    else if (k === 'arbol' || k === 'fres') { E.modo = 'arbol'; E.cat = null; E.fstep = 0; }
    else if (k === 'more') { E.modo = 'busca'; E.cat = null; E.fstep = 0; }
    else if (k === 'list') { E.modo = E.cat ? 'lista' : 'busca'; }
    else if (k === 'cuenta') { E.modo = 'cuenta'; }
    else if (k === 'add') {
      var c = eqChar();
      if (c) { E.sel.forEach(function(key){ var r = eqItem(key); if (r) c.gear.push({u:r.u, b:r.b, i:r.i}); }); S.tab = c.id; }
      S.form = null; S.eq = null;
    }
    persist(); render(); window.scrollTo(0,0);
  }); });
}

/* El nivel maximo de los jugadores de cada receta (3.7, 9.4) viene de los
   datos, leido de la ficha impresa de cada receta. Antes habia aqui una tabla copiada a mano y se quedo atras

function techoReceta(r){ var x = DATA.techos && DATA.techos[r]; return (x && x.length === 5) ? x : null; }
function arcOpen(){

  var sp = M.sup || [];
  return ['magia','monstruos','poderes','ki'].some(function(k){ return sp.indexOf(k) > -1; });

/* el nivel maximo de los jugadores: el de la receta, Ambito por Ambito; en un

   cinco; sin contestar, null (sin techo) */
function jugMax(){

  return (M.known === false && p) ? [p, p, p, p, arcOpen() ? p : 0] : null;

/* la escalera de la Llave (4.3): n², o 3n−2 con la escalera llana del Baul (9.1) */
function llana(){ return !isAcc() && baul().indexOf(16) > -1; }

     limitada(N−1) a limitada(x), y lo demas (que no se esquive…) se queda;

function parcaN(it){ var m = /(?:Parca|Reaper) · (?:Rejilla|Grid) (\d)/.exec(pick(it.d) || ''); return m ? +m[1] : 0; }
function itemGridN(it){ var m = /(?:Rejilla|Grid): (?:Nivel|Level) (\d)/.exec(pick(it.x) || ''); return parcaN(it) || (m ? +m[1] : 0); }

function disName(sk){ var p = String(sk).split('.'); return AMB[+p[0]].doms[+p[1]].dis[+p[2]]; }
// una Firma propia (s = 'own') no esta en el catalogo: solo tiene su nombre, en f.t
function firmaOf(f){ return (f.s === undefined || f.s === null || f.s === '' || f.s === 'own') ? null : firmaList(f.key)[+f.s] || null; }
function firmaNom(f){ var it = firmaOf(f); return it ? pick(it.n) : (f.s === 'own' && f.t) ? f.t : t('Firma sin elegir','Unchosen signature'); }

/* ======================= SCENE TONE (quick change) ======================= */
var sceneOpen = false;
var OPTROWS = [['alto','Optimista','Optimistic'],['neutro','Neutral','Neutral'],['bajo','Opresivo','Oppressive']];
var CAOSCOLS = [['bajo','Previsible','Predictable'],['medio','Neutral','Neutral'],['alto','Caótico','Chaotic']];
function gameCardName(){ return pick(isAcc() ? ACC[accBase()].n : CARDS[cardBase()].n); }
/* ============ PISTAS PROPIAS: ARRASTRAR Y SOLTAR ============
   Viven en el navegador (IndexedDB). No se suben a ningun sitio: son tus
   ficheros en tu maquina, asi que no hay licencia que valga ni nada que
   redistribuir. Sobreviven a que la app se actualice; lo que no hacen es
   seguirte a otro ordenador. */
var MUSP = [];        /* {id, nom, tipo, carta} en memoria, sin el audio */
var musAviso = null;  /* tarjeta con el bocadillo de «no hay pista» */
var musSon = null;    /* tarjeta que esta sonando ahora */
var musErr = '';      /* ultimo problema, para decirlo en vez de callar */
var MUSDB = null, musURL = null, AUD = null;

function musdb(){
  if (MUSDB) return Promise.resolve(MUSDB);
  return new Promise(function(ok, no){
    if (!window.indexedDB) return no(new Error('sin indexedDB'));
    var r = indexedDB.open('nogum-musica', 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore('pistas', {keyPath:'id'}); };
    r.onsuccess = function(){ MUSDB = r.result; ok(MUSDB); };
    r.onerror = function(){ no(r.error || new Error('no abre')); };
  });
}
function musSt(modo){
  return musdb().then(function(d){ return d.transaction('pistas', modo).objectStore('pistas'); });
}
function musPide(hacer){
  return musSt('readonly').then(function(st){
    return new Promise(function(ok){ var r = hacer(st); r.onsuccess = function(){ ok(r.result); }; r.onerror = function(){ ok(null); }; });
  });
}
function musRefresca(){
  return musPide(function(st){ return st.getAll(); }).then(function(ps){
    MUSP = (ps || []).map(function(p){ return {id:p.id, nom:p.nom, tipo:p.tipo, carta:p.carta}; });
    return MUSP;
  }).catch(function(){ MUSP = []; return MUSP; });
}
function musGuarda(reg){
  return musSt('readwrite').then(function(st){
    return new Promise(function(ok, no){ var r = st.put(reg); r.onsuccess = function(){ ok(true); }; r.onerror = function(){ no(r.error); }; });
  });
}
function musElimina(id){
  return musSt('readwrite').then(function(st){
    return new Promise(function(ok){ var r = st.delete(id); r.onsuccess = function(){ ok(true); }; r.onerror = function(){ ok(false); }; });
  });
}
function musDe(carta){ for (var i = 0; i < MUSP.length; i++) if (MUSP[i].carta === carta) return MUSP[i]; return null; }

/* Comprobar que suena ANTES de guardarla: si no, sueltas un PDF y te quedas
   con silencio y sin explicacion. */
function musValida(f){
  return new Promise(function(ok){
    var u = URL.createObjectURL(f), a = new Audio(), hecho = false;
    var fin = function(v){ if (hecho) return; hecho = true; try { URL.revokeObjectURL(u); } catch(e){} ok(v); };
    a.onloadedmetadata = function(){ fin(true); };
    a.onerror = function(){ fin(false); };
    setTimeout(function(){ fin(false); }, 8000);
    a.preload = 'metadata'; a.src = u;
  });
}

/* ---------------------------- el reproductor ---------------------------- */
function aud(){
  if (!AUD) { AUD = document.createElement('audio'); AUD.loop = true; AUD.preload = 'none'; AUD.style.display = 'none'; document.body.appendChild(AUD); }
  return AUD;
}
function fundido(a, hasta, ms, luego){
  /* Con setInterval y NO con requestAnimationFrame: hay entornos donde la
     pagina no pinta (pestana de fondo, paneles embebidos, ahorro de energia)
     y rAF no dispara nunca. Alli el volumen se quedaba en 0 y la musica sonaba
     muda con el boton encendido. El valor final se asegura siempre. */
  var de = a.volume, t0 = Date.now(), listo = false, h = null;
  var pon = function(v){ try { a.volume = Math.max(0, Math.min(1, v)); } catch(e){} };
  var cerrar = function(){ if (listo) return; listo = true; if (h) clearInterval(h); pon(hasta); if (luego) luego(); };
  h = setInterval(function(){
    var p = (Date.now() - t0) / ms;
    if (p >= 1) return cerrar();
    pon(de + (hasta - de) * p);
  }, 40);
  setTimeout(cerrar, ms + 150);
}
function musPara(cb){
  var a = aud();
  if (a.paused) { musSon = null; if (cb) cb(); return; }
  fundido(a, 0, 260, function(){ a.pause(); musSon = null; if (musURL) { try { URL.revokeObjectURL(musURL); } catch(e){} musURL = null; } if (cb) cb(); });
}
function musToca(carta){
  var reg = musDe(carta);
  if (!reg) { musAviso = carta; musErr = ''; render(true); return; }
  musAviso = null;
  musPara(function(){
    musPide(function(st){ return st.get(reg.id); }).then(function(p){
      if (!p || !p.blob) { musErr = t('Esa pista ya no está guardada.', 'That track is no longer stored.'); render(true); return; }
      var a = aud();
      musURL = URL.createObjectURL(p.blob);
      a.src = musURL; a.volume = 0; a.loop = true;
      a.play().then(function(){ musSon = carta; fundido(a, 1, 420); render(true); })
              .catch(function(){ musErr = t('El navegador no ha dejado sonar. Vuelve a pulsar.', 'The browser refused to play. Press again.'); render(true); });
    });
  });
}

        '<td class="chg"><button type="button" class="mini" data-musdel="' + esc(p.id) + '">' + esc(t('Quitar','Remove')) + '</button></td></tr>';
    });
    h += '</table>';

      'A track assigned to a card plays from its speaker button and overrides the built-in one. Leave one unassigned and it works as a loose cue: name it after the scene and fire it when you need it.')) + '</p>';
  }

/* --------------------- entrada de ficheros y botones --------------------- */
function musMete(files){
  var lista = [].slice.call(files || []).filter(function(f){ return f && f.size; });
  if (!lista.length) return;
  musErr = '';
  var pend = lista.length, malos = [];
  lista.forEach(function(f){
    musValida(f).then(function(vale){
      if (!vale) { malos.push(f.name); pend--; if (!pend) musFin(malos); return; }
      var reg = {id:'m' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
                 nom:f.name.replace(/\.[^.]+$/, '').slice(0, 60), tipo:f.type || 'audio', carta:null, blob:f};
      musGuarda(reg).then(function(){ pend--; if (!pend) musFin(malos); })
        .catch(function(){ malos.push(f.name + ' ' + t('(no cabe o el navegador no deja guardar)','(too big, or the browser refused to store it)')); pend--; if (!pend) musFin(malos); });
    });
  });
}
function musFin(malos){
  if (malos.length) musErr = t('No he podido con: ','Could not take: ') + malos.join(', ');
  musRefresca().then(function(){ render(true); });
}
document.addEventListener('dragover', function(e){
  var z = e.target.closest && e.target.closest('[data-musdrop]'); if (!z) return;
  e.preventDefault(); z.classList.add('sobre');
});
document.addEventListener('dragleave', function(e){
  var z = e.target.closest && e.target.closest('[data-musdrop]'); if (z) z.classList.remove('sobre');
});
document.addEventListener('drop', function(e){
  var z = e.target.closest && e.target.closest('[data-musdrop]'); if (!z) return;
  e.preventDefault(); z.classList.remove('sobre');
  musMete(e.dataTransfer && e.dataTransfer.files);
});
document.addEventListener('change', function(e){
  if (e.target && e.target.id === 'musFile') { musMete(e.target.files); e.target.value = ''; return; }
  var sel = e.target && e.target.getAttribute && e.target.getAttribute('data-musasig');
  if (sel) {
    var val = e.target.value || null;
    musPide(function(st){ return st.get(sel); }).then(function(p){
      if (!p) return;
      /* una tarjeta, una pista: si ya habia otra puesta ahi, se suelta */
      var antes = val ? musDe(val) : null;
      var sigue = function(){ p.carta = val; musGuarda(p).then(function(){ musRefresca().then(function(){ render(true); }); }); };
      if (antes && antes.id !== sel) {
        musPide(function(st){ return st.get(antes.id); }).then(function(q){
          if (!q) return sigue();
          q.carta = null; musGuarda(q).then(sigue);
        });
      } else sigue();
    });
  }
});
document.addEventListener('click', function(e){
  var b = e.target.closest && e.target.closest('[data-musp],[data-musid],[data-musdel],[data-musir]');
  if (!b) return;
  var k = b.getAttribute('data-musp');
  if (k) { if (musSon === k) musPara(function(){ render(true); }); else musToca(k); return; }
  var id = b.getAttribute('data-musid');
  if (id) {
    var reg = MUSP.filter(function(p){ return p.id === id; })[0];
    if (!reg) return;
    if (reg.carta) { if (musSon === reg.carta) musPara(function(){ render(true); }); else musToca(reg.carta); return; }
    /* suelta: suena igual, pero no pertenece a ninguna tarjeta */
    musPara(function(){
      musPide(function(st){ return st.get(id); }).then(function(p){
        if (!p || !p.blob) return;
        var a = aud(); musURL = URL.createObjectURL(p.blob);
        a.src = musURL; a.volume = 0; a.loop = true;
        a.play().then(function(){ musSon = '#' + id; fundido(a, 1, 420); render(true); }).catch(function(){});
      });
    });
    return;
  }
  var del = b.getAttribute('data-musdel');
  if (del) {
    var r = MUSP.filter(function(p){ return p.id === del; })[0];
    if (musSon && (musSon === '#' + del || (musDe(musSon) && musDe(musSon).id === del))) musPara();
    musElimina(del).then(function(){ musRefresca().then(function(){ render(true); }); });
    return;
  }
  if (b.getAttribute('data-musir')) { musAviso = null; musOpen = true; S.tab = 'form'; S.form = null; persist(); render(true);
    setTimeout(function(){ var p = document.querySelector('.muspro'); if (p) p.scrollIntoView({block:'center'}); }, 60); }
});

/* ======================= DICE ======================= */
S.dice = S.dice || {pc:'', sk:'', bonus:0, diff:0, mod:0, style:false, grid:'same', key:false};
var diceLog = [], lastRoll = null;
function skillsOf(c){
  var o = [];
  /* D1: ambito vacio −2 (Nulo); con algo comprado, la otra columna −1 (Torpe).
     Lo plegado por el acordeon tira a +4, como en la ficha. */
  AMB.forEach(function(a, ai){
    if (!ambHas(c, ai)) o.push({k:'a' + ai, n:pick(a.n) + ' · ' + t('nada comprado (Nulo)','nothing bought (Null)'), b:-2});
    a.doms.forEach(function(d, di){
      if (!c.dom[ai + '.' + di]) { if (ambHas(c, ai)) o.push({k:'t' + ai + di, n:pick(a.n) + ' · ' + pick(d.n) + ' (' + t('Torpe','Clumsy') + ')', b:-1}); return; }
      o.push({k:'d' + ai + di, n:pick(d.n), b:bonoCol(c, ai, di)});
      d.dis.forEach(function(s, si){ if (c.dis[ai + '.' + di + '.' + si]) o.push({k:'s' + ai + di + si, n:pick(d.n) + ' › ' + pick(s), b:Math.max(2, bonoCol(c, ai, di), folds(c).dis[ai + '.' + di + '.' + si] ? 4 : 2)}); });
    });
  });
  c.fir.forEach(function(f, fi){ o.push({k:'f' + fi, n:firmaNom(f) + ' (' + pick(disName(f.key)) + ')', b:f.lv}); });
  return o;
}
function diceBonus(){
  var D = S.dice, c = S.chars.filter(function(x){ return x.id === D.pc; })[0], base = D.bonus;
  if (c && D.sk) { var s = skillsOf(c).filter(function(x){ return x.k === D.sk; })[0]; if (s) base = s.b; }
  /* La tirada de Estilo es la tarjeta + Estilo (+2), y nada mas (3.5; Acelerado 2.8) */
  var raw = D.style ? 2 : base + D.diff + D.mod;
  return {base:base, raw:raw, tot:Math.max(-2, Math.min(4, raw)), c:c};
}
function d10(){ var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % 10 + 1; }
function banda(C, side, r, nat){
  var w = side ? (C.bc || 'normal') : (C.bp || 'normal');
  if (C.r === 'suma') return side ? nat >= 19 : nat <= 3;
  if (w === 'estrecha') return side ? (r[0] === 10 && r[1] === 10) : (r[0] === 1 && r[1] === 1);
  if (w === 'normal') return side ? nat >= 10 : nat <= 1;
  return side ? nat >= 9 : nat <= 2;
}
function rollNow(){
  var C = card(), r = d10(), b = d10(), nat, use, m = C.r || 'rojo';
  if (m === 'rojo') { nat = r; use = 'r'; }
  else if (m === 'mejor') { nat = Math.max(r, b); use = r >= b ? 'r' : 'b'; }
  else if (m === 'peor') { nat = Math.min(r, b); use = r <= b ? 'r' : 'b'; }
  else { nat = r + b; use = 'both'; }
  var fum = banda(C, 0, [r, b], nat), cri = banda(C, 1, [r, b], nat);
  var B = diceBonus(), tot = nat + B.tot, tn = C.tn || 6, out;
  if (fum) out = 'fum'; else if (cri) out = 'cri';
  else if (C.coste && tot >= tn && tot <= tn + 1) out = 'part';
  else out = tot >= tn ? 'ok' : 'fail';
  /* ED-26 (3.5): en el completo el Estilo no cuesta, la banda de coste es exito a
     secas. En el Acelerado (ED-15) el parcial del Caos se lee «ganas, pero sucio». */
  if (S.dice.style && out === 'part' && !isAcc()) out = 'ok';
  lastRoll = {m:m === 'rojo' ? 'red' : m, r:r, b:b, use:use, nat:nat, bonus:B.tot, tot:tot, tn:tn, out:out, style:S.dice.style, mode:pick(C.n), who:B.c ? (B.c.name || u('pc')) : ''};
  diceLog.unshift(lastRoll); if (diceLog.length > 10) diceLog.pop();
}

var unlocked = false;
function pwHash(s){ var h = 5381, x = 'nogum:' + s; for (var i = 0; i < x.length; i++) h = ((h * 33) ^ x.charCodeAt(i)) >>> 0; return h.toString(36); }

function sections(withSecret){

var campTurns = [], pendingQ = null;
S.askMode = S.askMode || 'rules';
function campReset(){ campTurns = []; pendingQ = null; if (S.tab === 'ask' && S.askMode === 'camp' && $('chat')) $('chat').innerHTML = ''; }
function storyText(withSecret, max){
  var secs = sections(withSecret), per = Math.floor(max / Math.max(1, secs.length));
  return secs.map(function(s){ return '### ' + s.n + '\n' + (s.x.length > per ? s.x.slice(0, per) + ' […]' : s.x); }).join('\n\n');
}
function pcsText(){ return S.chars.map(function(c, i){ return (i + 1) + '. ' + (c.name || '?') + (c.concept ? ' — ' + c.concept : ''); }).join('\n'); }
function lockBubble(){
  document.querySelectorAll('#chat .msg.lock').forEach(function(m){ m.remove(); });
  var d = chatMsg('lock', t('La respuesta está en el Secreto de Máster. Hace falta la contraseña para verla.','The answer is in the GM secret. The password is needed to see it.'));
  var w = document.createElement('div'); w.innerHTML = unlockBox('pwAsk'); d.parentNode.appendChild(w.firstChild);
  setTimeout(function(){ var i = $('pwAsk'); if (i) i.focus(); }, 30);

function campAsk(qv){
  var locked = isLocked(), hasSecret = !!S.story.secret.trim();
  if (!sections(true).length) { chatMsg('loc', t('La historia está vacía. Escribe algo en la pestaña Historia.','The story is empty. Write something in the Story tab.')); return; }
  if (!sample || aiDenied) {
    var w = norm(qv).match(/[a-z0-9]{4,}/g) || [];
    var hits = sections(true).map(function(s){ return {s:s, sc:w.filter(function(x){ return norm(s.x).indexOf(x) > -1; }).length}; }).filter(function(x){ return x.sc; }).sort(function(a,b){ return b.sc - a.sc; });
    var pub = hits.filter(function(h){ return h.s.id !== 'secret'; });
    if (pub.length) chatMsg('loc', pub.slice(0,2).map(function(h){ return h.s.n + ':\n' + h.s.x.slice(0, 600); }).join('\n\n— — —\n\n'));
    if (hits.some(function(h){ return h.s.id === 'secret'; })) { if (locked) { pendingQ = qv; lockBubble(); } else chatMsg('loc', t('Secreto de Máster','GM secret') + ':\n' + S.story.secret.slice(0, 600)); }
    if (!hits.length) chatMsg('loc', t('No encuentro nada con esas palabras.','Nothing found with those words.'));
    return;
  }
  if (!locked || !hasSecret) { campAnswer(qv, false); return; }
  var bub = chatMsg('ai', t('Buscando en la historia…','Searching the story…'));
  var pr = 'You are the index of a roleplaying campaign journal. Decide where the answer to the QUESTION can be found. Do NOT answer the question. Reply ONLY with JSON {"in_public":true|false,"in_secret":true|false}. in_public = the PUBLIC sections contain information that answers it. in_secret = the SECRET section contains information that answers it or is essential to it.\n\nQUESTION: ' + qv + '\n\nPUBLIC SECTIONS:\n' + storyText(false, 26000) + '\n\nSECRET SECTION:\n' + S.story.secret.slice(0, 22000);
  sample.json(pr, {cache:false}).then(function(r){
    bub.parentNode.remove();
    if (r && r.in_secret && !r.in_public) { pendingQ = qv; lockBubble(); }
    else campAnswer(qv, !!(r && r.in_secret));
  }).catch(function(e){ bub.textContent = '—'; $('askNote').textContent = errText(e); });
}
function campAnswer(qv, moreInSecret){
  var withSecret = !isLocked();
  campTurns.push({role:'user', content:qv}); while (campTurns.length > 12) campTurns.splice(0,2);
  var bub = chatMsg('ai', t('Pensando…','Thinking…')); ctl = new AbortController(); $('askBtn').disabled = true; $('stopBtn').hidden = false;
  var sys = 'You are the memory of a NOGUM roleplaying campaign, helping the game master at the table. Answer ONLY from the campaign notes below; if the notes do not say it, say so plainly and do not invent. Reply in ' + (S.lang === 'en' ? 'English' : 'Spanish') + ', in 2-6 sentences or a short list, no heavy markdown. Mention which section the answer comes from.' + (withSecret ? ' The GM secret section is unlocked: you may use it.' : '') + '\n' + ctx() + '\nCHARACTERS:\n' + (pcsText() || '-') + '\n\nCAMPAIGN NOTES:\n' + storyText(withSecret, 48000);
  sample([{role:'user', content:sys}, {role:'assistant', content:t('Entendido.','Understood.')}].concat(campTurns), {cache:false, signal:ctl.signal, onText:function(x){ bub.textContent = x.text; $('chat').scrollTop = 1e9; }})
    .then(function(r){ bub.textContent = r.text; campTurns.push({role:'assistant', content:r.text}); if (moreInSecret) { pendingQ = qv; document.querySelectorAll('#chat .msg.lock').forEach(function(m){ m.remove(); }); var d = chatMsg('lock', t('Hay más sobre esto en el Secreto de Máster.','There is more about this in the GM secret.')); var w = document.createElement('div'); w.innerHTML = unlockBox('pwAsk'); d.parentNode.appendChild(w.firstChild); } })
    .catch(function(e){ bub.textContent = (e && e.text) || '—'; campTurns.pop(); $('askNote').textContent = errText(e); })
    .then(function(){ $('askBtn').disabled = false; $('stopBtn').hidden = true; });
}

function applyTalk(s){

    FAMILIES.forEach(function(f){ if (f.k.indexOf(s.world) > -1) M.family = f.id; });
    applyPreset(s.world);
  } else if (s.known === true && M.known !== true && typeof s.world !== 'number') { M.known = true; M.family = null; M.world = null; M.era = null; M.tech = null; }
  else if (s.known === false && M.known !== false) { M.known = false; M.family = null; M.world = null; }
  function en(k, arr){ if (s[k] !== undefined && ENUMS[k].indexOf(s[k]) > -1) M[k] = s[k]; }
  if (M.known === false) {
    en('era');
    if (M.era === 'presente') M.tech = 'hoy';
    else if (s.tech && ({pasado:['espadas','vapor'], futuro:['ruinas','neon','espacio']}[M.era] || []).indexOf(s.tech) > -1) M.tech = s.tech;
    ['sup','xtra'].forEach(function(k){ if (Array.isArray(s[k])) { var a = s[k].filter(function(x){ return ENUMS[k].indexOf(x) > -1; }); if (a.length) M[k] = a.indexOf('none') > -1 ? ['none'] : a; } });

    '- xtra (own world only, array): intriga (intrigue, duels of words) | toon (cartoon comedy) | none.\n' +
    '- edition: acelerado (they want to start playing now with minimal rules) | completo (all the tools).\n' +
    '- opt: alto (the universe is on the heroes\' side) | neutro (the universe is fair) | bajo (the universe puts them to the test).\n' +
    '- caos: bajo (clockwork world, plans work) | medio (twists, but the story makes sense) | alto (anything can happen).\n' +
    '- hueco (only when opt is alto or bajo and caos is medio: that cell has no card): prev (the world behaves) | caos (the world makes noise).\n' +
    '- zoom: cascara (one lucky bullet decides a fight) | carne (it takes several hits) | nucleo (war of attrition).\n' +
    '- estilo: true (heroes dispatch lesser foes with a flourish) | false (every enemy counts).\n' +
    '- grid: world maximum (3.7), the size of the threats: the highest level that exists in this universe, whether anyone plays it or not. 1 one person, 2 a full room, 3 a building, 4 a city, 5 a country, 6 cosmic (planets; gods that eat worlds).\n' +
    '- pmax (own world only): player maximum (3.7): the highest Grid a player character can ever reach in a Sphere, however long the campaign. 1 to 5, never above grid. Leave it out if unsure.\n' +

var CARD3 = {EPICA:'EPI', PULP:'PUL', REAL:'REA', PRIM:'PRI', BOLA:'BOL', ANG:'ANG', PES:'PES', TRAG:'TRA'};
var C3 = {}; Object.keys(CARD3).forEach(function(k){ C3[CARD3[k]] = k; });

var UNIID = ['fantasia','steampunk','terror','postapo','neon','opera','gotico','supers','wuxia','social','toon'];

function setCard(k){
  S.scene = null;
  if (k === 'TRAG') { M.card = 'TRAG'; return; }
  M.card = null;
  var c = CARDCELL[k]; if (c) { M.opt = c[0]; M.caos = c[1]; M.hueco = 'prev'; }
}

function baulGroupOf(k){ for (var i = 0; i < BAUL_GROUPS.length; i++) if (BAUL_GROUPS[i].k.indexOf(k) > -1) return i; return -1; }
function toggleBaul(k){
  var gi = baulGroupOf(k); if (gi < 0) return;
  var a = (M['b' + gi] || []).filter(function(x){ return x >= 0; }), i = a.indexOf(k);
  if (i > -1) a.splice(i, 1); else a.push(k);
  M['b' + gi] = a;

/* El Baul tiene 18 reglas y el Codigo 18 bits. Los Codigos de antes llevan
   cuatro cifras (16 bits) y se leen igual: la escalera llana (bit 16) y el
   Cansancio (bit 17) quedan apagados. Uno nuevo solo crece a cinco cifras si
   lleva alguna de las dos (cinco cifras caben 20 bits), asi que los Codigos
   sin ellas siguen siendo identicos a los de siempre. */
var BAUL_BITS = 18;
function baulMask(){ var m = 0; baul().forEach(function(k){ if (k >= 0 && k < BAUL_BITS) m |= (1 << k); }); return m; }
function setBaulMask(m){
  BAUL_GROUPS.forEach(function(g, gi){ M['b' + gi] = g.k.filter(function(k){ return (m >> k) & 1; }); });
}
function uniMask(){ var m = 0; universes().forEach(function(id){ var i = UNIID.indexOf(id); if (i > -1) m |= (1 << i); }); return m; }
function hx(n, w){ var s = (n >>> 0).toString(16).toUpperCase(); while (s.length < w) s = '0' + s; return s; }
function restoreM(json){
  var o = JSON.parse(json);
  Object.keys(M).forEach(function(k){ if (!(k in o)) delete M[k]; });
  Object.keys(o).forEach(function(k){ M[k] = o[k]; });
}

/* --- el Codigo --- */
function codeMake(){
  var bm = baulMask();
  var p = ['N1', 'T' + CARD3[cardBase()], 'Z' + (ZOOMK.indexOf(M.zoom || 'carne') + 1 || 2), 'G' + mundoMax(), 'S' + (M.estilo !== false ? 1 : 0), 'B' + hx(bm, bm > 0xFFFF ? 5 : 4)];
  if (M.known && M.world !== null) p.push('W' + ('0' + M.world).slice(-2)); else p.push('U' + hx(uniMask(), 3));
  /* nivel maximo de los jugadores de un mundo propio: solo si se ha dicho, asi
     los Codigos de siempre no cambian; una app vieja no lo conoce y lo ignora */
  if (!(M.known && M.world !== null) && +M.pmax) p.push('J' + Math.max(1, Math.min(5, +M.pmax)));
  p.push('E' + (isAcc() ? 'A' : 'C'));
  /* puntos de mas (o de menos): solo si la mesa los da, asi los Codigos de
     siempre no cambian. Lo negativo va con N (P-N2 son dos puntos menos): una
     app vieja lo lee como 0 en vez de romperse. */
  function xp(k, v){ if (v) p.push(k + (v < 0 ? 'N' + (-v) : v)); }
  xp('P', ptsExtra());
  xp('K', keysExtra());
  return p.join('-');
}
function codeLink(){ return location.origin + location.pathname + '#c=' + codeMake(); }
function codeParse(str){
  var o = {}, tk = String(str || '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim().split(' ');
  if (!tk.length || tk[0] !== 'N1') return null;
  for (var i = 1; i < tk.length; i++) {
    var k = tk[i].charAt(0), v = tk[i].slice(1);
    if (k === 'T') { if (!C3[v]) return null; o.card = C3[v]; }
    else if (k === 'Z') o.zoom = ZOOMK[(+v) - 1] || 'carne';
    /* G: el nivel maximo del mundo (antes «escala de la partida», el mismo numero) */
    else if (k === 'G') o.grid = Math.max(1, Math.min(6, (+v) || 1));
    else if (k === 'J') o.pmax = Math.max(1, Math.min(5, (+v) || 1));
    else if (k === 'S') o.estilo = v !== '0';
    else if (k === 'B') o.baul = (parseInt(v, 16) || 0) & ((1 << BAUL_BITS) - 1);
    else if (k === 'W') o.world = +v;
    else if (k === 'U') o.unis = parseInt(v, 16) || 0;
    else if (k === 'E') o.edition = (v === 'A') ? 'acelerado' : 'completo';
    else if (k === 'P') o.pts = v.charAt(0) === 'N' ? -(+v.slice(1) || 0) : (+v || 0);
    else if (k === 'K') o.kx = v.charAt(0) === 'N' ? -(+v.slice(1) || 0) : (+v || 0);
  }
  return o.card ? o : null;
}
function applyCode(str){
  var c = codeParse(str); if (!c) return false;
  rbUndo = JSON.stringify(M);
  M.edition = c.edition || 'completo';
  if (c.world !== undefined && KNOWN[c.world]) { M.known = true; M.world = c.world; M.unis = null; }
  else if (c.unis !== undefined) {
    var u = UNIID.filter(function(id, i){ return (c.unis >> i) & 1; });
    M.known = false; M.world = null; M.unis = u.length ? u : null;
  }
  setCard(c.card);
  M.zoom = c.zoom || 'carne';
  M.grid = c.grid || 1;

/* --- la partida en archivo ---
   Lleva la mesa, las respuestas de los formularios, las fichas, la historia y,
   si se pide, la musica. Nunca la clave de la IA: esa vive aparte (T164). */
// La version de las preguntas y del catalogo. Si una mesa se guardo con otras,
// al abrirla se avisa en vez de cargar sus respuestas como si nada.
function appVer(){
  var s = JSON.stringify([S_TONO, S_UNI, S_BAUL, DATA.recipes.length, DATA.baul.length]), h = 2166136261;
  for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}
function gameObj(){ return {app:'NOGUM', v:2, ver:appVer(), bzv:BZV, saved:new Date().toISOString(), lang:S.lang, locked:S.locked, q:S.q, m:M, chars:S.chars, story:S.story, askMode:S.askMode}; }
function gameJson(){ return JSON.stringify(gameObj(), null, 1); }
function gameName(){ var n = worldName().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 26); return 'nogum-' + (n || 'mesa') + '.json'; }
var NO_GUARDA = ['El navegador no deja guardar: copia el texto de abajo y guárdalo tú.','The browser will not save it: copy the text below and keep it yourself.'];
// Bajar un archivo: por la plataforma si estamos en claude.ai, si no por el navegador,
// y si tampoco, el texto en la caja para copiarlo a mano.
// lo que no se ha podido bajar se guarda aqui, porque la pantalla se redibuja y la caja se vacia
var TEXTO_CAIDO = {};
function bajaArchivo(data, name, idTexto){
  var cae = function(){ TEXTO_CAIDO[idTexto] = data; var ta = $(idTexto); if (ta) ta.value = data; return pick(NO_GUARDA); };
  TEXTO_CAIDO[idTexto] = '';
  if (DL) return DL.save({filename:name, data:data}).then(function(){ return t('Archivo guardado.','File saved.'); }, cae);
  try {
    var b = new Blob([data], {type:'application/json'}), a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    return Promise.resolve(t('Archivo guardado.','File saved.'));
  } catch(e){}
  return Promise.resolve(cae());
}
function exportGame(){
  bajaArchivo(gameJson(), gameName(), 'rbJson').then(function(m){ rbMsg = m; rbBad = m === pick(NO_GUARDA); render(true); });
  return t('Guardando...','Saving...');
}
// La musica viaja dentro del archivo como texto. Pesa: por eso es un boton aparte.
function musicaParaArchivo(){
  return musPide(function(st){ return st.getAll(); }).then(function(ps){
    return Promise.all((ps || []).filter(function(p){ return p && p.blob; }).map(function(p){
      return new Promise(function(ok){
        var r = new FileReader();
        r.onload = function(){ ok({id:p.id, nom:p.nom, tipo:p.tipo, carta:p.carta, data:r.result}); };
        r.onerror = function(){ ok(null); };
        r.readAsDataURL(p.blob);
      });
    }));
  }).then(function(xs){ return xs.filter(Boolean); });
}
function dataABlob(d){
  var i = d.indexOf(','), tipo = d.slice(5, i).split(';')[0], b = atob(d.slice(i + 1)), u8 = new Uint8Array(b.length);
  for (var k = 0; k < b.length; k++) u8[k] = b.charCodeAt(k);
  return new Blob([u8], {type:tipo});
}
// Al abrir: las pistas del archivo se guardan, y las tarjetas que ellas ocupan
// se sueltan aqui, para que no haya dos pistas en la misma tarjeta.
function musicaDesdeArchivo(lista){
  var cartas = lista.map(function(x){ return x.carta; }).filter(Boolean);
  return musRefresca().then(function(locales){
    return Promise.all(locales.filter(function(p){ return p.carta && cartas.indexOf(p.carta) > -1; }).map(function(p){
      return musPide(function(st){ return st.get(p.id); }).then(function(reg){ if (reg) { reg.carta = null; return musGuarda(reg); } });
    }));
  }).then(function(){
    return Promise.all(lista.map(function(x){ return musGuarda({id:x.id, nom:x.nom, tipo:x.tipo, carta:x.carta, blob:dataABlob(x.data)}); }));
  }).then(function(){ return musRefresca(); });
}
function nPistas(n){ return n === 1 ? t('1 pista', '1 music track') : n + t(' pistas', ' music tracks'); }
function guardaMesa(conMusica){

    return bajaArchivo(JSON.stringify(o), gameName().replace(/\.json$/, '-con-musica.json'), 'cfgJson').then(function(msg){
      return msg + ' ' + (m.length ? t('Lleva ' + nPistas(m.length) + ' de música.', 'It carries ' + nPistas(m.length) + '.') : t('No había música que guardar.','There was no music to save.'));
    });
  });
}
function importGame(txt, alAcabarMusica){

  var aviso = t('La partida del archivo reemplaza esta mesa y todas sus fichas. ¿Seguir?','The game in the file replaces this table and all its sheets. Continue?');
  if (o.ver && o.ver !== appVer()) aviso = t('Esta mesa se guardó con otra versión de las preguntas de la app. La mesa, las fichas y la historia se abren igual, pero las respuestas de los formularios pueden no coincidir.',
    'This table was saved with another version of the app’s questions. The table, sheets and story open the same, but the form answers may not match.') + '\n\n' + aviso;
  if (!confirm(aviso)) { rbBad = false; return ''; }

  rbBad = false;
  if (Array.isArray(o.musica) && o.musica.length) {
    var fin = alAcabarMusica || function(m){ rbMsg = m; render(true); }, n = o.musica.length;
    musicaDesdeArchivo(o.musica).then(function(){ fin(t('Partida abierta, con ' + nPistas(n) + ' de música.', 'Game loaded, with ' + nPistas(n) + '.')); },
      function(){ fin(t('Partida abierta, pero la música no ha cabido en este navegador.','Game loaded, but the music did not fit in this browser.')); });
    return t('Partida abierta: mesa, fichas e historia. Metiendo la música…','Game loaded: table, sheets and story. Loading the music…');
  }
  return t('Partida abierta: mesa, fichas e historia.','Game loaded: table, sheets and story.');
}

    '<button type="button" class="mini" data-rbb="ctxgo">' + esc(t('¿No sabes cuáles? Recomiéndame','Not sure which? Recommend me some')) + '</button></p>';
  BAUL_GROUPS.forEach(function(g, gi){
    h += '<div class="rbgrp"><span class="rbgn">' + esc(pick(g.g)) + '</span><div class="chips">';
    g.k.forEach(function(k){ h += '<button type="button" class="chip' + (on.indexOf(k) > -1 ? ' on' : '') + '" data-rbb="baulk" data-k="' + k + '" title="' + esc(pick(BAUL_TIP[k])) + '">' + esc(pick(DATA.baul[k])) + '</button>'; });
    h += '</div></div>';
  });
  return h + '</div>';
}
function rbCode(){
  return '<div class="rbpanel"><p class="rbp-h">' + esc(t('El Código de la mesa','The table Code')) + '</p>' +
    '<p class="rbp-t">' + esc(t('Tu mesa en una línea: universo, edición, tarjeta, vida fractal, nivel máximo del mundo (y el de los jugadores, en un mundo propio), Estilo, reglas extra y los puntos de más, si los hay. Pásalo y la otra mesa queda igual que la tuya. Al pegar un Código se cambia la mesa entera; las fichas se quedan donde están y pasan a jugar con las reglas nuevas.','Your table in one line: universe, edition, card, Fractal Health, world maximum (and the player maximum, in a world of your own), Style, extra rules and any extra points. Pass it on and the other table ends up like yours. Pasting a Code replaces the whole table; the sheets stay where they are and start playing by the new rules.')) + '</p>' +
    '<div class="rbcode"><input type="text" id="rbCode" readonly value="' + esc(codeMake()) + '"><button type="button" class="tool" data-rbb="copy">' + esc(t('Copiar','Copy')) + '</button><button type="button" class="tool" data-rbb="copylink">' + esc(t('Copiar enlace','Copy link')) + '</button></div>' +
    '<div class="rbcode"><input type="text" id="rbCodeIn" placeholder="' + esc(t('Pega aquí el Código de otra mesa…','Paste another table’s Code here…')) + '"><button type="button" class="tool" data-rbb="apply">' + esc(t('Cambiar la mesa','Change the table')) + '</button></div></div>';
}
function rbFile(){
  return '<div class="rbpanel"><p class="rbp-h">' + esc(t('La partida en un archivo','The game in a file')) + '</p>' +
    '<p class="rbp-t">' + esc(t('El Código lleva la mesa; el archivo lleva la partida entera: mesa, fichas e historia. Guárdalo de vez en cuando, porque la app vive en este navegador y un borrado de datos se lo lleva todo. Al abrir un archivo se cambia todo, fichas incluidas.','The Code carries the table; the file carries the whole game: table, sheets and story. Save one now and then, because the app lives in this browser and clearing its data takes everything with it. Opening a file replaces everything, sheets included.')) + '</p>' +
    '<div class="rbcode"><button type="button" class="tool" data-rbb="export">' + esc(t('Guardar la partida','Save the game')) + '</button><label class="tool file">' + esc(t('Abrir un archivo…','Open a file…')) + '<input type="file" accept=".json,.txt,application/json" data-rbfile="1" hidden></label><button type="button" class="tool" data-rbb="importpaste">' + esc(t('Abrir el texto de abajo','Open the text below')) + '</button></div>' +
    '<textarea id="rbJson" placeholder="' + esc(t('Aquí aparece la partida si el navegador no deja guardar archivos; y aquí puedes pegarla para abrirla.','The game appears here if the browser will not save files; and you can paste one here to open it.')) + '"></textarea>' +
    '<p class="rbp-h" style="margin-top:12px">' + esc(t('Mesa nueva','New table')) + '</p><p class="rbp-t">' + esc(t('Vuelve a empezar desde cero: borra solo la mesa y quédate con las fichas, o bórralo todo. Los ajustes y tu clave no se tocan, y hay deshacer.','Start again from scratch: clear just the table and keep the sheets, or clear everything. Settings and your key are left alone, and there is undo.')) + '</p>' + mesaBotones() +
    '</div>';
}
function rbCopy(txt, id){
  var el = $(id);
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt); return true; } } catch(e){}
  try { if (el) { el.value = txt; el.select(); return document.execCommand('copy'); } } catch(e){}
  return false;
}
document.addEventListener('click', function(e){
  var b = e.target.closest('.rulesbar [data-rbb]'); if (!b) return;
  var k = b.getAttribute('data-rbb');
  if (k !== 'apply' && k !== 'undo') rbUndo = null;
  if (k === 'estilo') { M.estilo = !estilo(); rbMsg = ''; }
  else if (k === 'baul' || k === 'code' || k === 'file') { rbOpen = (rbOpen === k) ? null : k; rbMsg = ''; }
  else if (k === 'baulk') { toggleBaul(+b.getAttribute('data-k')); }
  /* «Recomiéndame» abre el formulario del Baúl (el 3), que es el que las recomienda */
  else if (k === 'ctxgo') { S.tab = 'form'; S.form = 'baul'; S.st.baul = 0; rbOpen = null; rbMsg = ''; persist(); render(); window.scrollTo(0,0); return; }
  else if (k === 'copy') { rbBad = !rbCopy(codeMake(), 'rbCode'); rbMsg = rbBad ? t('Cópialo a mano desde el recuadro.','Copy it by hand from the box.') : t('Código copiado.','Code copied.'); }
  else if (k === 'copylink') { rbBad = !rbCopy(codeLink(), 'rbCode'); rbMsg = rbBad ? t('Cópialo a mano desde el recuadro.','Copy it by hand from the box.') : t('Enlace copiado.','Link copied.'); }
  else if (k === 'apply') {
    var v = $('rbCodeIn') ? $('rbCodeIn').value : '';
    if (applyCode(v)) { rbBad = false; rbMsg = t('Mesa cambiada: ','Table changed: ') + pick(card().n) + ' · ' + worldName(); rbOpen = null; }
    else { rbBad = true; rbMsg = t('Ese Código no se entiende. Debe empezar por N1.','That Code cannot be read. It has to start with N1.'); }
  }
  else if (k === 'export') { rbMsg = exportGame(); }
  else if (k === 'importpaste') { rbMsg = importGame($('rbJson') ? $('rbJson').value : ''); if (rbMsg && !rbBad) rbOpen = null; }
  else if (k === 'undo') { if (rbUndo) { restoreM(rbUndo); rbUndo = null; S.scene = null; rbMsg = t('Se ha deshecho el cambio.','The change has been undone.'); rbBad = false; } }
  else if (k === 'hide') { rbMsg = ''; }
  else return;
  persist(); render(true);
});
document.addEventListener('change', function(e){
  var el = e.target.closest('.rulesbar [data-rb], .rulesbar [data-rbfile]'); if (!el) return;
  if (el.getAttribute('data-rbfile')) {
    var f = el.files && el.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(){ rbMsg = importGame(String(r.result)); if (rbMsg && !rbBad) rbOpen = null; persist(); render(); };
    r.onerror = function(){ rbBad = true; rbMsg = t('No se ha podido leer el archivo.','The file could not be read.'); render(true); };
    r.readAsText(f); return;
  }
  var f2 = el.getAttribute('data-rb'), v = el.value;
  rbMsg = ''; rbUndo = null;
  if (f2 === 'world') {
    var i = +v;
    if (i < 0) {
      if (M.tech === null || M.tech === undefined) { S.tab = 'form'; S.form = 'uni'; S.st.uni = 0; persist(); render(); window.scrollTo(0,0); return; }
      M.known = false; M.world = null;
    } else { M.known = true; M.world = i; M.unis = null; rbMsg = t('Universo cambiado. Si además quieres su receta de tono entera, cámbiala con la tarjeta y el resto de la barra.','Universe changed. If you also want its whole tone recipe, set it with the card and the rest of the bar.'); }
  }
  else if (f2 === 'edition') M.edition = v;
  else if (f2 === 'card') setCard(v);
  else if (f2 === 'acc') setAccMode(v);
  else if (f2 === 'zoom') M.zoom = v;
  else if (f2 === 'grid') M.grid = +v;
  else if (f2 === 'pmax') { M.pmax = (+v) || null; if (M.pmax && M.pmax > (+M.grid || 1)) M.grid = M.pmax; }
  else if (f2 === 'pts') M.pts = xpNum(v);
  else if (f2 === 'kx') M.kx = xpNum(v);
  persist(); render(true);
});
function fromHash(live){
  var m = /[#&?]c=([A-Za-z0-9\-]+)/.exec(location.hash || '');
  if (!m) return false;
  var ok = applyCode(m[1]);
  if (ok) {
    S.tab = 'tpl'; rbOpen = null; rbBad = false;
    rbMsg = t('Mesa cargada desde el enlace: ','Table loaded from the link: ') + pick(card().n) + ' · ' + worldName();
    persist();
  }
  try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
  if (ok && live) { render(); window.scrollTo(0,0); }
  return ok;
}
window.addEventListener('hashchange', function(){ fromHash(true); });
fromHash(false);

/* ======================= RENDER ======================= */
function render(keep){
  renderTop();
  var v = $('view'), y = window.scrollY;
  if (S.tab === 'form') { v.innerHTML = renderForm(); bindForm(); }
  else if (S.tab === 'tpl') { v.innerHTML = renderTemplate(); var cb = $('createBtn'); if (cb) cb.addEventListener('click', function(){ var c = newChar(); S.chars.push(c); S.tab = c.id; S.form = null; persist(); render(); window.scrollTo(0,0); }); }
  else if (S.tab === 'ask') { v.innerHTML = renderAsk(); $('askBtn').addEventListener('click', ask); $('stopBtn').addEventListener('click', function(){ if (ctl) ctl.abort(); }); $('clearBtn').addEventListener('click', function(){ if (S.askMode === 'camp') campReset(); else turns = []; $('chat').innerHTML = ''; }); v.querySelectorAll('[data-amode]').forEach(function(b){ b.addEventListener('click', function(){ S.askMode = b.getAttribute('data-amode'); pendingQ = null; persist(); render(); }); }); if ($('askLock')) $('askLock').addEventListener('click', function(){ unlocked = false; campReset(); render(); }); $('askQ').addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); } }); }
  else if (S.tab === 'dice') { v.innerHTML = renderDice(); bindDice(); }
  else if (S.tab === 'story') { v.innerHTML = renderStory(); bindStory(); }
  else if (S.tab === 'ses') { v.innerHTML = renderSes(); $('sesBtn').addEventListener('click', analyse); }
  else if (S.tab === 'cfg') { v.innerHTML = renderCfg(); bindCfg(); }
  else {
    var c = S.chars.filter(function(x){ return x.id === S.tab; })[0];
    if (!c) { S.tab = 'tpl'; return render(); }
    v.innerHTML = renderChar(c, S.chars.indexOf(c));
    var sh = $('pcSheet');
    sh.addEventListener('click', function(e){ onChar(e, c); });
    $('f-name').addEventListener('input', function(){ c.name = this.value; persist(); renderTop(); var h2 = sh.querySelector('.sheethead h2'); if (h2) h2.textContent = c.name || (u('pc') + ' ' + (S.chars.indexOf(c) + 1)); });
    ['concept','keys','notes'].forEach(function(k){ $('f-' + k).addEventListener('input', function(){ c[k] = this.value; persist(); }); });
    if ($('f-arc')) $('f-arc').addEventListener('change', function(){ c.arc = this.checked; persist(); render(true); });
    if ($('f-kw')) $('f-kw').addEventListener('input', function(){ c.kw = Math.max(0, +this.value || 0); persist(); render(true); });
    sh.querySelectorAll('[data-ktxt]').forEach(function(x){ x.addEventListener('input', function(){ c.klist[+x.getAttribute('data-ktxt')].t = x.value; persist(); }); });
    sh.querySelectorAll('[data-kform]').forEach(function(x){ x.addEventListener('change', function(){ c.klist[+x.getAttribute('data-kform')].w = x.value; persist(); render(true); }); });
    sh.querySelectorAll('[data-klv]').forEach(function(x){ x.addEventListener('change', function(){ c.klist[+x.getAttribute('data-klv')].lv = +x.value; persist(); render(true); }); });
    if ($('f-ksp')) $('f-ksp').addEventListener('input', function(){ c.ksp = Math.max(0, +this.value || 0); persist(); render(true); });
    /* elegir el ambito no sube nada: sube el boton +1 Rejilla, y se paga */
    sh.querySelectorAll('[data-gamb]').forEach(function(x){ x.addEventListener('change', function(){ var gx = c.gear[+x.getAttribute('data-gamb')]; if (gx) gx.amb = x.value; persist(); render(true); }); });
    sh.querySelectorAll('[data-gj]').forEach(function(x){ x.addEventListener('change', function(){ c.gj = c.gj || {}; c.gj[x.getAttribute('data-gj')] = +x.value; persist(); render(true); }); });
    sh.querySelectorAll('[data-potamb]').forEach(function(x){ x.addEventListener('change', function(){ c.potAmb = x.value; persist(); render(true); }); });
    sh.querySelectorAll('select[data-grid]').forEach(function(s){ s.addEventListener('change', function(){ c.grid[s.getAttribute('data-grid')] = +s.value; persist(); }); });
    sh.querySelectorAll('select[data-fsel]').forEach(function(s){ s.addEventListener('change', function(){ c.fir[+s.getAttribute('data-fsel')].s = s.value; persist(); render(true); if (s.value === 'own') { var x = sh.ownerDocument.querySelector('[data-ftxt="' + s.getAttribute('data-fsel') + '"]'); if (x) x.focus(); } }); });
    sh.querySelectorAll('input[data-ftxt]').forEach(function(x){ x.addEventListener('input', function(){ c.fir[+x.getAttribute('data-ftxt')].t = x.value; persist(); }); });
    var gs = groups();
    $('gType').addEventListener('change', function(){ var g = gs[+this.value], it = $('gItem'); it.innerHTML = '<option value="">' + esc(t('Objeto…','Item…')) + '</option>' + (g ? g.items.map(function(x, i){ return '<option value="' + i + '">' + esc(pick(x.n)) + ' — ' + esc(pick(x.d)) + '</option>'; }).join('') : ''); it.disabled = !g; $('gAdd').disabled = true; });
    $('gItem').addEventListener('change', function(){ $('gAdd').disabled = this.value === ''; });
  }
  v.querySelectorAll('[data-print]').forEach(function(b){ b.addEventListener('click', function(){ window.print(); }); });
  if (keep) window.scrollTo(0, y);
}
if (M.known === null) { S.form = null; }
render();
musRefresca().then(function(){ if (MUSP.length) render(true); });
})();
</script>
